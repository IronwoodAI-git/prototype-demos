.ntab.on{background:var(--accent);color:#fff}
.pools{display:grid;gap:8px;margin-bottom:14px}
.pool{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline;
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer}
.pool.on{border-color:#bcd8f7;background:#f7fbff}
.pool input{grid-row:1/3}
.pn{font-weight:650;text-transform:capitalize}
.pm,.pdup,.pnew2{grid-column:2;font-size:12px;color:var(--muted)}
.pdup{color:var(--amber)}
.pnew2{color:var(--green)}
.nform{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:12px}
.nform label{font-size:13px;font-weight:600;display:grid;gap:6px}
.nform input,.nform textarea{font:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;width:100%;resize:vertical}
.nsum{font-size:13px;color:var(--muted);line-height:1.6}
.cbox{display:grid;gap:12px}
.cnote{font-size:12.5px;color:var(--muted);line-height:1.5;padding:10px 12px;
  border:1px solid var(--line);border-radius:9px;background:#fbfcfd}
.cnote.bad{border-color:#f3bdbd;background:#fdecec;color:#8a2019}
.cnote.ok{border-color:#bfe6d2;background:#eefaf3;color:#1c7a4f}
/* a quiet line that explains the table under it, rather than another boxed callout competing
   with the result it is describing */
.cnote.sub{background:none;border:0;padding:6px 0 2px;color:var(--muted);font-size:12px}
.crow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cnaics{font-size:11.5px;color:var(--muted)}
.ttpick{display:grid;gap:5px;margin-top:2px}
.ttrow{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;cursor:pointer;
       padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.ttrow.on{border-color:var(--accent);background:#f2f7ff}
.ttrow .ttn{font-weight:600;font-size:12.5px}
.ttrow .ttc{font-size:12px;color:var(--muted);text-align:right}
.ttrec{font-weight:600;font-size:10.5px;color:var(--accent);border:1px solid var(--accent);
       border-radius:20px;padding:1px 6px;margin-left:5px;vertical-align:1px}
/* something needs your attention but nothing is broken — a finding, not a failure */
.cnote.warn{border-color:#f0dca6;background:#fdf7e6;color:#7a5a12}
.whbox{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;margin:8px 0}
.whlab{font-size:12px;color:var(--muted);margin:8px 0 5px;line-height:1.45}
.segs{display:grid;gap:5px}
.seg{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;cursor:pointer;
     padding:7px 10px;border:1px solid var(--line);border-radius:8px}
.seg.on{border-color:var(--accent);background:#f2f7ff}
.seg .segn{font-weight:600;font-size:12.5px}
.seg .segh{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.seg .segc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rgn{font-size:12px;font-weight:600;padding:5px 10px;border:1px solid var(--line);
     border-radius:20px;background:#fff;cursor:pointer}
.rgn.on{border-color:var(--accent);background:var(--accent);color:#fff}
.stgrid{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.stchip{font-size:11.5px;padding:3px 7px;border:1px solid var(--line);border-radius:6px;
        background:#fff;cursor:pointer;line-height:1.3}
.stchip.on{border-color:var(--accent);background:#f2f7ff;font-weight:700}
.stchip span{color:var(--muted);font-size:10px;margin-left:3px;font-variant-numeric:tabular-nums}
.stchip.on span{color:var(--accent)}
.cscopes{display:grid;gap:7px;margin-top:4px}
.cshead{font-size:12.5px;font-weight:700}
.cscope{display:flex;gap:10px;align-items:baseline;padding:9px 11px;border:1px solid var(--line);
  border-radius:9px;cursor:pointer;background:#fbfcfd}
.cscope.on{border-color:var(--accent);background:#f2f7ff}
.cscope .csn{font-weight:700;font-size:12.5px;min-width:160px}
.cscope .csm{font-size:12px;color:var(--muted)}
.cscope .csm b{color:var(--ink)}
/* the live-collection strip: sticky under the header, on every screen */
.livebar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid #dde3ea;
  box-shadow:0 2px 10px rgba(0,0,0,.06)}
.livebar .lb{max-width:1180px;margin:0 auto;padding:10px 18px}
.livebar .lbtop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.livebar .lbtop b{font-size:14px}
.livebar .lbdot{width:8px;height:8px;border-radius:50%;background:#16a34a;flex:0 0 auto;
  animation:lbpulse 1.6s ease-in-out infinite}
@keyframes lbpulse{0%,100%{opacity:1}50%{opacity:.25}}
.livebar .lbsp{flex:1}
.livebar .lbnums{font-size:12.5px;color:#5b6b7c}
.livebar .lbbar{height:6px;border-radius:4px;background:#e6ebf1;margin:7px 0 5px;overflow:hidden}
.livebar .lbbar i{display:block;height:100%;background:#16a34a;transition:width .6s ease}
.livebar .lbfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:#5b6b7c}
.cprog{border:1px solid #bcd8f7;border-radius:10px;background:#f4f9ff;padding:11px 13px;display:grid;gap:7px}
.cprow{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:12.5px}
.cprow b{font-size:13px}
.cprow span{color:var(--muted)}
.cbar{height:7px;border-radius:99px;background:#dbe8f6;overflow:hidden}
.cbar i{display:block;height:100%;background:linear-gradient(90deg,#4b8fd8,#1c5fb0);border-radius:99px}
.cstall{color:#8a4a12}
.cfold{border:1px solid var(--line);border-radius:9px;background:#fbfcfd}
.cfoldh{width:100%;text-align:left;font:650 12.5px/1.4 inherit;padding:10px 12px;border:0;
  background:transparent;color:var(--ink);cursor:pointer}
.cfoldh span{font-weight:400;color:var(--muted)}
.cfoldb{padding:2px 12px 12px;display:grid;gap:10px}
.frow2{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;
  border-bottom:1px solid #eef1f5}
.cttres{border:1px solid #e6ebf1;border-radius:9px;padding:10px 12px;background:#fff;display:grid;gap:4px}
.cpair{display:flex;gap:12px;align-items:stretch;padding:9px 0;border-top:1px solid #eef1f5}
.cside{flex:1;display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0}
.cside b{font-size:12.5px}
.cside span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cside i{font-style:normal;font-size:10.5px;color:#8a93a0}
.cverd{display:flex;flex-direction:column;gap:6px;justify-content:center}
.cfoldb select{font:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--line);
  border-radius:8px;background:#fff;max-width:100%}
</style>
</head>
<body class="mode-plan">

<div class="top">
  <span class="brand">List&nbsp;<span>Flow</span></span>
  <span class="badge">local planner</span>
  <!-- The plan is a DESIGN and is saved as one. Progress, results and spend are never
       saved here — they belong to the engine and are observed, not stored twice. -->
  <span class="badge" id="savebadge" title="">&nbsp;</span>
  <button class="btn gray sm homeback" id="homeback" title="Back to all lists">← All lists</button>
  <button class="lswitch" id="lswitch" title="Switch list">
    <span class="lsn" id="lswitchname">—</span><span class="cv">▾</span>
  </button>
  <div class="lmenu" id="lmenu"></div>
  <div class="seg" id="modeseg">
    <button data-m="strategize">① Strategize</button>
    <button data-m="plan" class="on">② Plan</button>
    <button data-m="run">③ Run</button>
  </div>
  <span class="spacer"></span>
  <div id="rollup" style="display:flex;gap:7px"></div>
  <div class="seg mini" id="vocabseg" title="Plain English or technical names">
    <button data-v="plain" class="on">Plain</button>
    <button data-v="tech">Technical</button>
  </div>
  <button class="tutpill" id="tutPill">🎓 Tutorial</button>
</div>

<!-- ALWAYS ON. A running collection is money being spent and hours of clock time; it cannot be
     something you only see if you happen to be standing on the right screen. -->
<div id="livecrawl"></div>

<!-- ============ home: every list at a glance ============ -->
<div id="home"><div class="pfwrap" id="homebody"></div></div>

<div class="shell">
  <!-- ============ left: chat rail ============ -->
  <div class="side wide" id="side">
    <div class="sidehead">
      <div class="seg" id="railseg">
        <button data-r="strategy" class="on">Strategy</button>
        <button data-r="chat">Chat</button>
      </div>
      <span style="flex:1"></span>
      <button class="btn gray sm" id="sidecollapse" title="Collapse">‹</button>
    </div>
    <div class="sidebody" id="strategybody"></div>
    <div class="sidebody" id="chatlog"></div>
    <div class="chatinput" id="chatinput">
      <input id="chatbox" placeholder="Describe who you want to reach…" autocomplete="off">
      <button class="btn" id="chatsend">Send</button>
    </div>
    <div class="railstub">
      <div class="rb" id="railstrat" title="The strategy behind this plan">🧭</div>
      <div class="vlbl">strategy</div>
      <div class="rb" id="railopen" title="Open the chat">💬</div>
    </div>
  </div>

  <!-- ============ center: canvas ============ -->
  <div class="stage" id="stage">
    <div class="viewport" id="viewport">
      <div class="world" id="world">
        <div class="spotscrim" id="spotscrim"></div>
        <svg class="edges" id="edges"></svg>
        <div id="nodes"></div>
      </div>
    </div>
    <div class="hint" id="hint">drag to pan · scroll to zoom</div>
    <div class="minimap" id="minimap"></div>
    <div class="zoomctl">
      <button id="zoomout" title="Zoom out">−</button>
      <button id="zoomin" title="Zoom in">+</button>
      <button class="w" id="zoomfit" title="Fit the whole plan">Fit</button>
      <button class="w" id="relayout" title="Re-layout from the dependency graph">⇄ Tidy</button>
      <button class="w" id="focusbtn" title="Spotlight the step that is running right now">◎ Focus</button>
      <button class="w" id="speedbtn" title="Fast-forward the simulated run">1×</button>

    <!-- data peek: bottom sheet over the canvas, re-targets when you click another card -->
    <div class="sheet" id="sheet">
      <div class="shead">
        <span class="sgrain" id="sheetgrain"></span>
        <div><h4 id="sheettitle"></h4><div class="ssub" id="sheetsub"></div></div>

        <button class="sx" id="sheetbig" title="Fill the window">⤢</button>

      <div class="colmenu" id="colmenu"></div>

<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================================
   0 · UTILITIES
   ============================================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const N=(t,c,h)=>{const d=document.createElement(t);if(c)d.className=c;if(h!=null)d.innerHTML=h;return d;};
const num=n=>n.toLocaleString("en-US");
function money(v){
  if(v===0)return "free";
  if(v<0.01)return "$"+v.toFixed(4);
  if(v<1)return "$"+v.toFixed(2);
  return "$"+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function centsWord(v){                       // plain-English cost, tutorial voice
  if(v===0)return "free";
  if(v<0.01)return "a fraction of a cent";
  if(v<1)return "about "+Math.round(v*100)+"¢";
  if(v<100)return "about $"+v.toFixed(0);
  return "about $"+Math.round(v/10)*10;
}
function dur(mins){
  if(mins<1)return "seconds";
  if(mins<60)return "~"+Math.round(mins)+"m";
  if(mins<60*24)return "~"+(mins/60).toFixed(mins<180?1:0)+"h";
  return "~"+Math.round(mins/60/24)+"d";
}
/* seeded PRNG — mock data must be identical every load (no Math.random) */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

let toastT=0;
function toast(msg,kind){
  const t=$("#toast");t.className="toast on"+(kind?" "+kind:"");t.textContent=msg;
  clearTimeout(toastT);toastT=setTimeout(()=>t.className="toast",2600);
}

/* ============================================================================
   1 · ICON SET
   Monochrome inline SVG (inherits currentColor + state color). Emoji is reserved
   for prose/toasts — a node card carrying 5 emoji renders inconsistently across
   platforms and cannot inherit state color. See DESIGN.md §5.
   ============================================================================ */
const ICON={
 building:'<path d="M2.5 14V3.2c0-.4.3-.7.7-.7h5.6c.4 0 .7.3.7.7V14"/><path d="M10 14V6.8h3.3c.4 0 .7.3.7.7V14"/><path d="M1 14h14"/><path d="M4.8 5.4h1M7.2 5.4h1M4.8 7.9h1M7.2 7.9h1M4.8 10.4h1M7.2 10.4h1M11.6 9.2h.9M11.6 11.6h.9"/>',
 person:'<circle cx="8" cy="5.6" r="3"/><path d="M2.7 14c0-2.7 2.4-4.3 5.3-4.3s5.3 1.6 5.3 4.3"/>',
 list:'<path d="M5.6 4h8.8M5.6 8h8.8M5.6 12h8.8"/><path d="M2.3 4h.01M2.3 8h.01M2.3 12h.01" stroke-width="2"/>',
 coins:'<ellipse cx="8" cy="4.7" rx="5" ry="2.2"/><path d="M3 4.7v3.1c0 1.2 2.2 2.2 5 2.2s5-1 5-2.2V4.7"/><path d="M3 8.4v3.1c0 1.2 2.2 2.2 5 2.2s5-1 5-2.2V8.4"/>',
 bills:'<path d="M1.6 4.4h9.6"/><rect x="3.4" y="6.1" width="11.2" height="7.1" rx="1.2"/><circle cx="9" cy="9.6" r="1.7"/>',
 stopwatch:'<circle cx="8" cy="9.2" r="4.9"/><path d="M8 9.2V6.4M6.6 2.1h2.8M8 2.1v2.2M12.6 4.8l1-1"/>',
 hourglass:'<path d="M4.4 2h7.2M4.4 14h7.2"/><path d="M5.5 2v2.3c0 1.4 2.5 2.5 2.5 3.7s-2.5 2.3-2.5 3.7V14"/><path d="M10.5 2v2.3c0 1.4-2.5 2.5-2.5 3.7s2.5 2.3 2.5 3.7V14"/>',
 calendar:'<rect x="2.2" y="3.7" width="11.6" height="10.1" rx="1.4"/><path d="M2.2 7.1h11.6M5.4 2.2v2.4M10.6 2.2v2.4"/><path d="M5.3 9.9h.9M7.6 9.9h.9M9.9 9.9h.9M5.3 11.9h.9M7.6 11.9h.9" stroke-width="1.5"/>',
 hand:'<circle cx="8" cy="8" r="6"/><path d="M8 4.9v4.2M8 11.3h.01" stroke-width="1.6"/>',
 lock:'<rect x="3.2" y="7" width="9.6" height="7" rx="1.5"/><path d="M5.6 7V5.3a2.4 2.4 0 0 1 4.8 0V7"/>',
 rows:'<rect x="1.8" y="3" width="12.4" height="10" rx="1.3"/><path d="M1.8 6.5h12.4M1.8 9.8h12.4M6.2 6.5V13"/>',
 check:'<path d="M3 8.4l3.4 3.3L13 5"/>',
 /* ONE warning shape everywhere. The lint badge used to be a bare "!" and the
    "waiting on you" run state used a bare "!" too — two different meanings, one
    glyph. The triangle is now the only thing that means "something is wrong here". */
 warn:'<path d="M8 2.2 1.6 13.4h12.8L8 2.2Z" stroke-linejoin="round"/><path d="M8 6.4v3.1M8 11.3h.01" stroke-width="1.6"/>',
 /* a cog, not a sunburst. The old glyph was a centre dot plus eight free-floating radial
    ticks — with no RING the ticks read as rays of light, which is exactly how it landed.
    The ring is the whole difference: teeth have to be attached to something. */
 gear:'<circle cx="8" cy="8" r="4.35"/><circle cx="8" cy="8" r="1.65"/><path d="M8 1.35v2.35M8 12.3v2.35M14.65 8h-2.35M3.7 8H1.35M12.7 3.3 11.05 4.95M4.95 11.05 3.3 12.7M12.7 12.7l-1.65-1.65M4.95 4.95 3.3 3.3"/>',
 flask:'<path d="M6.4 1.8v4.1L2.6 12.2A1.3 1.3 0 0 0 3.7 14.2h8.6a1.3 1.3 0 0 0 1.1-2L9.6 5.9V1.8"/><path d="M5.3 1.8h5.4"/><path d="M4.6 9.7h6.8"/>'
};
function ico(name,cls){return `<svg class="ic ${cls||""}" viewBox="0 0 16 16">${ICON[name]||""}</svg>`;}
function grainIcon(g){
  if(g==="account")return ico("building");
  if(g==="contact")return ico("person");
  if(g==="list")return ico("list");
  return `<span class="cross-ic">${ico("building")}<span class="ar">→</span>${ico("person")}</span>`;
}

/* ============================================================================
   2 · THE ACTION REGISTRY  (mock of list-ops/registry.yaml)
   Every node the canvas can draw comes from here. Nothing is hand-authored per
   list. Fields mirror the real registry plus the three this UI asks for:
   `grain`, `plain{title,body}`, `ui{review,drip}`.  See BUILD_NOTES.md §3.
   ============================================================================ */
/* Not const: a real build REPLACES this wholesale from the server catalogue via
   applyRegistry(). A page that keeps its own copy of a price or a rate is the bug. */
let REGISTRY={
/* ---- collection ---- */
maps_collect:{phase:"collect",grain:"account",broad:true,tech:"maps-collect",job:"collect_maps.py",
  plain:{title:"Collect from Google Maps",body:"Sweeps a grid of map searches across every city in scope and saves each business Google knows about — name, address, phone, website, rating. This is how a list gets born when you are starting from nothing."},
  requires:[],produces:["account.name","account.website","account.phone","account.address"],
  unit:0.002,rpm:320,seed:12480,keep:1,
  rules:["no-silent-caps","warn-before-cost"],
  gotcha:"Depth comes from more/tighter pins, never more pages — a single map viewport hard-stops at ~120–180 results. Always dedup the new bucket globally by cid; raw counts inflate about 11x."},
web_serp_collect:{phase:"collect",grain:"account",broad:true,tech:"web-serp-collect",job:"collect.py",
  plain:{title:"Also collect from web search",body:"Runs ordinary web searches per city and keeps the company websites that come back. Useful for businesses with a weak Google Maps presence, or when you need to search with words that must NOT appear."},
  requires:[],produces:["account.website"],unit:0.001,rpm:300,seed:2400,keep:1,
  rules:["no-silent-caps"],
  gotcha:"Measured at only about +2% over Maps for storefront businesses. Its real value is weak-Maps verticals and negative-keyword searches."},
registry_import:{phase:"collect",grain:"account",broad:true,tech:"registry-import",job:"funnel_seeds.py",
  plain:{title:"Import a roster or registry file",body:"Loads a spreadsheet you already have — a state licensing board list, a trade-association roster, a permit file — and maps its columns onto the list. Free, and usually the most complete source that exists."},
  requires:[],produces:["account.name","account.city","account.state"],unit:0,rpm:9000,seed:4600,keep:1,
  gotcha:"Registry rows are legal names (\"… LLC dba …\") with no website — the hardest case for finding a domain later. Re-import with the trade-name column as Name if the hit rate is low."},
aggregator_harvest:{phase:"collect",grain:"account",broad:true,tech:"aggregator-harvest",job:"funnel_aggregator.py",
  plain:{title:"Harvest a directory or award list",body:"Points at one page that already lists the kind of company you want — an award list, a members page, a \"brands we carry\" page — and pulls the businesses out of it."},
  requires:[],produces:["account.name","account.city"],unit:0.00006,rpm:40,seed:900,keep:1,
  gotcha:"Pages behind a member login or rendered by JavaScript return nothing to a plain fetch. Five of eleven sources failed that way on the last run."},
salesnav_harvest:{phase:"collect",grain:"contact",tech:"salesnav-harvest",job:"salesnav scripts",
  plain:{title:"Pull a LinkedIn Sales Navigator search",body:"Takes a saved Sales Navigator search and pulls the people out of it — name, title, employer. This starts a list from PEOPLE instead of companies."},
  requires:[],produces:["contact.name","contact.title","contact.linkedin"],unit:0,rpm:60,seed:2500,keep:1,
  gotcha:"Chrome throttles background tabs to about one request a minute — keep the tab in the foreground. Regional splits are needed to stay under the 2,500-result cap."},
/* ---- qualify ---- */
evidence_rules:{phase:"qualify",grain:"account",tech:"evidence-rules",job:"refine_targets.py",
  plain:{title:"Free cuts from data we already have",body:"Removes the obvious misses using only what is already on the record — chains (the same web domain in five or more cities), retail stores, the wrong category, no website at all. Costs nothing and runs instantly, so it always goes first."},
  requires:["account.name"],produces:["account.disposition"],unit:0,rpm:12000,keep:.65,
  rules:["cheapest-signal-first"],
  gotcha:"Two independents can share a name (\"Family Eye Care\") — never cut on name alone. Domain is definitive; state is a hard separator."},

/* ============================================================================
   3b · PER-STEP SETUP — where the old wizard's workbenches live now
   ----------------------------------------------------------------------------
   The canvas answers WHERE a step sits and WHAT it costs. It cannot answer WHAT
   IT WILL ACTUALLY DO — which search words, which states, how deep, which
   negative keywords, which role we are looking for. In the old List Builder each
   of those was a numbered wizard step, and that is exactly why the wizard could
   only ever describe ONE shape of list: the questions were welded to a fixed
   sequence.

   Here they belong to the ACTION. Drop "Collect from Google Maps" anywhere in
   any plan and it brings its own setup — terms, geography, depth, and the
   experiments that answer those questions honestly (term validation, term
   efficiency, sample & density, the Census reality check). The canvas stays a
   map; the gear is the workbench.

   Three consequences worth stating, because they are the whole design:
   1. A step with unanswered REQUIRED questions is NOT runnable. That is a lint
      finding, not a silent default — a default term list is how you spend $70
      collecting the wrong businesses.
   2. Setup CHANGES THE ESTIMATE. Adding a fourth search term or a second region
      moves the dollar and clock figures on the card immediately, so the cost of
      a decision is visible while you are making it, not after.
   3. Probes are cheap experiments that write their answer back into the setup.
      "Apply the recommended terms" is a real edit to this node's params.
   ============================================================================ */

/* deterministic pseudo-random so a demo repeats identically (no Date/Math.random) */
function hsh(s){let h=2166136261;for(let i=0;i<String(s).length;i++){
  h^=String(s).charCodeAt(i);h=Math.imul(h,16777619);}return Math.abs(h);}
function jit(seed,lo,hi){return lo+(hsh(seed)%1000)/1000*(hi-lo);}

const REGIONS=[["ne","Northeast"],["mw","Midwest"],["s","South"],["w","West"]];
/* Cities WORTH SWEEPING, not every incorporated place. The full country has ~19,451
   and roughly 19,180 of them are single-pin small towns; sweeping all of them is the
   single biggest way to waste money on a list that is not genuinely rural. These are
   the ~1,934-city target scope the real collector defaults to. */
const REGION_CITIES={ne:330,mw:480,s:700,w:424};

const SETUP={

/* ---------------- the one that prompted this ---------------- */
maps_collect:{
  req:["terms","regions"],
  summary:p=>{
    const t=(p.terms||[]).length, rg=(p.regions||[]).length;
    if(!t||!rg)return null;
    return `${t} search term${t>1?"s":""} · ${rg===4?"all US":REGIONS.filter(r=>(p.regions||[]).includes(r[0])).map(r=>r[1]).join(", ")} · ${p.pages||8} pages a pin`;
  },
  groups:[
    {title:"What to search for",sub:"the highest-leverage setting on the whole step",
     fields:[
      {k:"terms",type:"lines",label:"Search terms",req:true,
       help:"One per line. Google Maps returns the same business for close synonyms, so every extra term is a flat tax on the whole run — the efficiency test below measures which ones actually earn their place.",
       ph:"optometrist\neye doctor\noptometry clinic"},
      {k:"include",type:"text",label:"Keep only these business categories",
       help:"Word stems, separated by |. Google's categories are spaced words (\"Eye care center\"), so stems beat exact phrases.",
       ph:"optometr|eye care|vision"},
      {k:"exclude",type:"text",label:"Never keep these",
       help:"Same format. This is where retail chains and the wrong specialism get dropped for free.",
       ph:"ophthalmolog|lasik|sunglass|department store"}]},
    {title:"Where",sub:"cost is linear in cities — this is the second biggest dial",
     fields:[
      {k:"regions",type:"regions",label:"Regions",req:true,
       help:"Pick regions, then narrow if you want. Every city in scope gets at least one map search."},
      {k:"exclude_cities",type:"lines",label:"Skip these cities",
       help:"One \"City, ST\" per line. Useful when a metro is already collected or is somebody else's territory.",
       ph:"Atlanta, GA"}]},
    {title:"How deep",sub:"both of these stop themselves; the numbers are seatbelts, not targets",
     fields:[
      {k:"pages",type:"number",label:"Pages per map pin",min:1,max:10,def:8,
       help:"A single map viewport hard-stops at roughly 120–180 results no matter how many pages you ask for. Measured: 99% of results arrive by page 7, 100% by page 8, nothing after. Depth comes from more pins, never more pages."},
      {k:"zoom",type:"select",label:"Map zoom",def:"auto",
       opts:[["auto","Set it from the sample (recommended)"],["11","Wide — z11"],["13","Medium — z13"],["14","Tight — z14"]],
       help:"Tighter zoom means more, smaller pins. The sample below can pick this for you by measuring how dense this category actually is, which is usually looser — and cheaper — than population density suggests."},
      {k:"selfstop",type:"toggle",label:"Stop early when a city stops yielding",def:true,
       help:"Walks each city's pins from the centre out and stops after two pins in a row add almost nothing. Verified on a dense metro: 4 pins instead of 25, same businesses found."}]}],
  probes:[
    {id:"validate",title:"Check the terms return the right thing",cost:"about 1¢",free:false,
     body:"Runs one page for each term and shows how many results survive your category filter. A low keep rate almost always means the filter is wrong, not the term — and catching that here costs a cent instead of the whole run.",
     run:p=>({rows:(p.terms||[]).map(t=>{const k=Math.round(jit(t+"v",0.55,1)*20);
       return {t,got:20,kept:k};})}),
     render:r=>`<table><tr><th>Term</th><th>Found</th><th>Kept by your filter</th></tr>
       ${r.rows.map(x=>`<tr><td>${x.t}</td><td>${x.got}</td><td><b>${x.kept}</b> · ${Math.round(x.kept/x.got*100)}%</td></tr>`).join("")}</table>
       ${r.rows.some(x=>x.kept/x.got<0.5)
         ?`<div class="verdict warn">At least one term is losing more than half its results to the category filter. Loosen the keep-list before spending anything — that ratio holds for the whole run.</div>`
         :`<div class="verdict ok">Every term is passing the filter cleanly. Safe to move on.</div>`}`},

    {id:"efficiency",title:"Are the terms finding DIFFERENT businesses?",cost:"about 5¢",free:false,
     body:"Runs every term over the same few map viewports so the overlap is a fair comparison, then builds the shortest set of terms that still reaches 98% of everything the full set found. Cost is linear in term count, so dropping a redundant synonym is a straight percentage off the whole job.",
     run:p=>{const ts=p.terms||[];
       const share=ts.map((t,i)=>({t,pct:i===0?Math.round(jit(t+"e",70,88)):Math.round(jit(t+"e",4,26))}));
       let cum=0;const build=share.map(s=>{const before=cum;cum=Math.min(100,cum+s.pct);
         return {t:s.t,marginal:cum-before,cum};});
       const keep=build.filter((b,i)=>i===0||b.marginal>=3);
       return {build,keep:keep.map(k=>k.t)};},
     render:(r,p)=>`<table><tr><th>Adding this term</th><th>New businesses it alone brings</th><th>Running coverage</th></tr>
       ${r.build.map(b=>`<tr><td>${b.t}</td><td>+${b.marginal}%</td><td>${b.cum}%</td></tr>`).join("")}</table>
       ${r.keep.length<(p.terms||[]).length
         ?`<div class="verdict warn">${(p.terms||[]).length-r.keep.length} term(s) add almost nothing of their own. Dropping them cuts roughly ${Math.round((1-r.keep.length/(p.terms||[]).length)*100)}% off this step's cost for about 2% less coverage.</div>`
         :`<div class="verdict ok">Every term is pulling its weight — each one brings businesses the others miss. Keep all of them.</div>`}`,
     apply:{label:"Use the recommended terms",to:(r,p)=>({terms:r.keep})}},

    {id:"sample",title:"Sample a few cities — density, cost, and a real sample list",
     cost:"7¢ – 20¢",free:false,
     body:"Crawls a handful of cities for real, self-stopping as it goes. This one run does three jobs: it measures how many pins a city actually needs (which is what makes the cost estimate honest), it recommends a map zoom from the density it observed, and the businesses it finds ARE a client-ready sample. Include one big metro and one small town or the blend will lie to you.",
     run:p=>{const cities=["New York, NY","Columbus, OH","Hattiesburg, MS"];
       return {rows:cities.map(c=>{const planned=c==="New York, NY"?25:c==="Columbus, OH"?6:1;
         const used=Math.max(1,Math.round(planned*jit(c,0.3,0.8)));
         return {c,planned,used,found:Math.round(used*jit(c+"f",9,42))};}),
         eff:0.46,pagesPerPin:2.3,zoomRec:11};},
     render:r=>`<table><tr><th>City</th><th>Pins planned</th><th>Pins actually needed</th><th>Found</th></tr>
       ${r.rows.map(x=>`<tr><td>${x.c}</td><td>${x.planned}</td><td><b>${x.used}</b></td><td>${x.found}</td></tr>`).join("")}</table>
       <div class="verdict ok">Cities are stopping themselves at ${Math.round(r.eff*100)}% of their planned pins and averaging ${r.pagesPerPin} pages a pin. The estimate on the card now uses those measured numbers instead of a worst case.<br><br>
       This category is sparser than the population suggests — a wider zoom (z${r.zoomRec}) covers it with far fewer pins and loses nothing.</div>`,
     apply:{label:"Use the measured density and zoom",to:(r,p)=>({zoom:String(r.zoomRec),_eff:r.eff})}},

    {id:"cbp",title:"Sanity-check the total against the Census",cost:"free",free:true,
     body:"How many of this business actually exist, from the Census County Business Patterns file — offline, no API. This is the check that would have caught the 932,000-optometrist estimate that was really 22,781. If our projection is more than about 1.6× the Census count we are over-pulling chains, duplicates or the wrong category.",
     run:p=>({naics:"621320",title:"Offices of Optometrists",estab:22781,scoped:17841,projected:30147}),
     render:r=>{const ratio=r.projected/r.scoped;
       return `<table><tr><th>Census code</th><th>US total</th><th>In your scope</th><th>This plan projects</th></tr>
       <tr><td>${r.naics} · ${r.title}</td><td>${num(r.estab)}</td><td>${num(r.scoped)}</td><td><b>${num(r.projected)}</b></td></tr></table>
       ${ratio>1.6?`<div class="verdict warn">The plan projects ${ratio.toFixed(1)}× the Census count. Expect chains, duplicates or a neighbouring category in the results — plan a refine step.</div>`
         :`<div class="verdict ok">Within range of the Census count (${ratio.toFixed(2)}×). The terms and filter are pointed at the right category.</div>`}`;}}],
  /* setup drives the estimate: cities x terms x pins x pages x price-per-call */
  scale:p=>{
    const cities=(p.regions||[]).reduce((s,r)=>s+(REGION_CITIES[r]||0),0)
                 -((p.exclude_cities||[]).length);
    const terms=Math.max(1,(p.terms||[]).length);
    const pins=p.zoom==="14"?3.1:p.zoom==="13"?2.0:p.zoom==="11"?1.25:1.6;
    const pages=Math.min(p.pages||8,8)/8*2.3;         // measured pages actually fetched
    const eff=p._eff!=null?p._eff:(p.selfstop===false?1:0.55);
    const calls=Math.max(0,cities)*terms*pins*pages*eff;
    /* Maps bills TWO credits a query ($0.0024). About three of a page's twenty results
       survive a tight category filter, so calls -> businesses is roughly x2.95. */
    const seed=Math.round(calls*2.95);
    return {seed,unit:seed?(calls*0.0024)/seed:0.002};
  }},

web_serp_collect:{
  req:["queries"],
  summary:p=>{const q=(p.queries||[]).length;if(!q)return null;
    return `${q} search${q>1?"es":""}${(p.negatives||[]).length?" · "+(p.negatives||[]).length+" negative word"+((p.negatives||[]).length>1?"s":""):""} · ${p.pages||3} pages each`;},
  groups:[
    {title:"What to search",sub:"this is the engine you use when the qualifier is invisible to Maps",
     fields:[
      {k:"queries",type:"lines",label:"Search phrases",req:true,
       help:"One per line. Quote a phrase to force an exact match. Unlike Maps, these can be sentences — this engine exists precisely because you can express things here that a map category cannot.",
       ph:"\"packaging design\" agency portfolio\nbrand identity studio case studies"},
      {k:"negatives",type:"lines",label:"Words that must NOT appear",
       help:"One per line. The whole reason to run web search alongside Maps: Maps has no way to say \"not a franchise\", and this does.",
       ph:"franchise\ndirectory\ntop 10"},
      {k:"blocked",type:"text",label:"Domains to always discard",def:"yelp|indeed|facebook|linkedin|glassdoor",
       help:"Separated by |. Directories and job boards dominate ordinary web results; without this the pool fills with them."}]},
    {title:"How deep",fields:[
      {k:"pages",type:"number",label:"Result pages per search",min:1,max:10,def:3,
       help:"Relevance falls off a cliff after page 3 for most queries. Going deeper is rarely wrong, but it is linear cost for a shrinking return."},
      {k:"per_city",type:"toggle",label:"Repeat each search per city",def:false,
       help:"Multiplies cost by the number of cities. Worth it for genuinely local businesses; wasteful for anything that sells nationally."}]}],
  probes:[
    {id:"page1",title:"Look at page one before running the rest",cost:"about a tenth of a cent",free:false,
     body:"Runs the first page of your first search with the negatives and blocked domains applied, and splits what comes back into what we would keep and what we would throw away. Measured across the suite, web search adds only about 2% over Maps for storefront businesses — so it is worth proving it earns its place on this list before running it.",
     run:p=>({q:(p.queries||["—"])[0],kept:9,noise:1,
       samples:["studioaether.com","northlightbranding.com","meridianpackaging.co"]}),
     render:r=>`<div>Search: <b>${r.q}</b></div>
       <table><tr><th>Kept</th><th>Discarded as directories or noise</th></tr>
       <tr><td><b>${r.kept}</b></td><td>${r.noise}</td></tr></table>
       <div style="margin-top:6px;font-size:11.5px;color:var(--muted)">Kept, for example: ${r.samples.join(" · ")}</div>
       <div class="verdict ok">Nine of ten results are real companies. The negatives and the blocked-domain list are doing their job.</div>`}],
  scale:p=>{const q=Math.max(1,(p.queries||[]).length);
    const pages=p.pages||3, mult=p.per_city?40:1;
    const calls=q*pages*mult;
    return {seed:Math.round(calls*9),unit:calls*0.001/Math.max(1,calls*9)};}},

/* ---------------------------------------------------------------------------
   ROUND 8 — the rest of the inventory.
   The question was whether the Maps step was the only one hiding a wizard's worth of
   questions. It was not: 19 of 30 actions had no settings at all, and several of
   those carry the sharpest judgement calls in the whole pipeline (which records
   get cut for free, what counts as the same company, what a lead score is made
   of, how fast we are allowed to touch LinkedIn). An action with no settings and
   an action whose settings were never built look identical on a canvas — so
   every action now either has a setup sheet or says, in the inspector, that it
   genuinely has nothing to configure and why.
   --------------------------------------------------------------------------- */

evidence_rules:{
  req:["chain_n"],
  summary:p=>`chain at ${p.chain_n||5}+ cities · ${p.no_site==="cut"?"no website = cut":"no website = keep"}`,
  groups:[
    {title:"What gets cut for free",sub:"only signals already on the record — this step never fetches anything",
     fields:[
      {k:"chain_n",type:"number",label:"Treat as a chain at this many cities",def:5,min:2,max:20,req:true,
       help:"Counted by shared web domain, never by name. Two independents can both be called “Family Eye Care”; a shared domain is definitive and a shared name is not. This one rule is usually the largest free cut in the plan."},
      {k:"categories",type:"text",label:"Cut these categories outright",
       help:"Word stems separated by |. Applied to whatever category the source gave us.",
       ph:"department store|pharmacy|hospital"},
      {k:"no_site",type:"select",label:"A record with no website at all",def:"hold",
       opts:[["hold","Keep it and try to find one later (recommended)"],["cut","Cut it now"],["keep","Keep it and never look"]],
       help:"Cutting here is tempting and has been expensive before. A registry import is mostly legal names with no website — cutting them at this point throws away the exact records the “find websites” step exists to rescue."}]},
    {title:"Judgement",fields:[
      {k:"strict",type:"toggle",label:"Cut when the category is missing entirely",def:false,
       help:"A blank category is an absence of evidence, not evidence of absence. Leave this off unless you have measured that blank categories in this vertical are genuinely junk."}]}],
  probes:[
    {id:"preview",title:"Show me what this would remove",cost:"free",free:true,
     body:"Applies the rules to the records already collected and reports what each rule would take out, before anything is written. Free and instant — there is no reason to run this step blind.",
     run:p=>{const n=1000;
       return {rows:[
         {r:`Chain (same domain in ${p.chain_n||5}+ cities)`,cut:Math.round(jit("ch",90,190))},
         {r:"Category blocklist",cut:(p.categories||"").trim()?Math.round(jit("cat",40,120)):0},
         {r:"No website",cut:p.no_site==="cut"?Math.round(jit("nw",120,260)):0}],base:n};},
     render:(r,p)=>`<table><tr><th>Rule</th><th>Would remove</th></tr>
       ${r.rows.map(x=>`<tr><td>${x.r}</td><td><b>${x.cut?num(x.cut):"—"}</b>${x.cut?" per 1,000":" (off)"}</td></tr>`).join("")}</table>
       ${p.no_site==="cut"
         ?`<div class="verdict warn">Cutting the no-website records here removes about ${num(r.rows[2].cut)} per thousand that the “find websites” step is designed to rescue. On a registry-heavy list that is most of the list.</div>`
         :`<div class="verdict ok">Nothing here is cutting records that a later step could still rescue.</div>`}`}]},

/* is this step configured enough to run? */
function setupOf(n){
  const s=SETUP[n.action];
  if(!s)return null;
  const p=n.params||{};
  const missing=(s.req||[]).filter(k=>{
    const v=p[k];
    return v==null||v===""||(Array.isArray(v)&&!v.length);
  });
  return {spec:s,params:p,missing,ready:!missing.length,summary:s.summary?s.summary(p):null};
}
function fieldOf(actionId,key){
  const s=SETUP[actionId];if(!s)return null;
  for(const g of s.groups)for(const f of g.fields)if(f.k===key)return f;
  return null;
}
function setDefaults(n){
  const s=SETUP[n.action];if(!s)return;
  n.params=n.params||{};
  s.groups.forEach(g=>g.fields.forEach(f=>{
    if(f.def!==undefined&&n.params[f.k]===undefined)n.params[f.k]=f.def;
  }));
}

/* The phase list is the spine of the canvas: it decides which column-group a step
   lands in, and therefore which side of a gate it falls on. It was previously wrong in
   a way the old decorative headers concealed. Three "qualify" steps all require the
   page text that only "read the site" produces, and merging duplicates by domain
   requires the domain that only "find the website" produces — so judgement steps were
   being drawn to the LEFT of the work they depend on, and the connectors ran backwards
   underneath the cards. Nobody noticed, because a header that contains nothing cannot
   contradict anything. Gathering cheap evidence and judging on it are BUILD work; only
   what happens after the verdict is enrichment. */
const PHASES=[["collect","Collect"],["qualify","Free cuts"],["resolve","Find websites"],
  ["dedupe","Merge duplicates"],["evidence","Read the sites"],["verdict","Judge &amp; cut"],
  ["account","Company enrichment"],
  ["discovery","Find people"],["email","Email addresses"],["verify","Verify"],
  ["handoff","Deep &amp; handoff"],["recover","Recover &amp; re-check"]];
const PHASE_ORDER={};PHASES.forEach(([k],i)=>PHASE_ORDER[k]=i);
/* kept only as the "everything cheap lives here" set used by the palette copy — the
   lock's POSITION is now a stage boundary, computed in layout(), not this list */
const PRE_LOCK=new Set(["collect","qualify","resolve","dedupe","evidence","verdict","account"]);

/* ---------------------------------------------------------------------------
   STAGES — the two systems this tool replaced, now one canvas with real gates.
   List-building collected broadly; enrichment then cut hard before spending.
   Keeping that as two separate apps enforced the discipline by accident: you
   physically could not enrich something you had not first exported and cut.
   Merging them removes that accident, so the gate has to become explicit or the
   whole "collect broad, enrich narrow" economics quietly stops being true.
   A gate is a boundary between STAGES; a phase is a column-group inside one.
   --------------------------------------------------------------------------- */
const STAGE_DEF=[
  {id:"build", name:"Build the list", sub:"collect broadly · cheap evidence only · cut hard",
   phases:["collect","qualify","resolve","dedupe","evidence","verdict"]},
  {id:"acct",  name:"Enrich companies", sub:"depth, on the ones you kept",
   phases:["account"]},
  {id:"people",name:"Enrich people", sub:"one company becomes several people",
   phases:["discovery","email","verify","handoff","recover"]}
];
const STAGE_OF={};STAGE_DEF.forEach(s=>s.phases.forEach(p=>STAGE_OF[p]=s.id));
const STAGE_AT={};STAGE_DEF.forEach((s,i)=>STAGE_AT[s.id]=i);
const stageOf=n=>STAGE_OF[reg(n).phase]||"build";
/* the gate that sits to the LEFT of each stage (none for the first) */
const GATE={
  acct:  {t:"THE LIST IS CUT", s:"past here you only spend on companies you decided to keep"},
  people:{t:"ACCOUNT LIST LOCKED", s:"everything past here bills per person"}
};
/* the free, judgement-based steps that actually remove records — what "cut hard" means */
/* DERIVED on install, never listed: a cutter is a free step whose keep-rate is below 1.
   The hand-written list drifted the moment a cutter was added to the registry — see
   applyRegistry(), which is now the only thing that fills this. */
let CUTTERS=new Set();

/* ============================================================================
   3 · THE PLAN  (the single artifact all three modes render)
   ============================================================================ */
/* The STRATEGY is part of the plan artifact, not a transcript of how it was produced.
   The chat is one way to fill these in; the strategy record in the rail is another, and
   both write to the same three fields. That is what makes "go back and look at what we
   told it, months later, mid-run" possible — a chat log you have to re-read is not that.
   Seeded with the demo's answers so the record always matches the plan already drawn. */
const START_PLAN={
  name:"Independent optometrists — Southeast",
  entry:"nothing",
  budget:30,
  brief:"Independent optometry practices across the Southeast — the kind of single-location "+
        "or two-location practice that owns its own website and books its own patients.",
  answers:["Independents only — anything with more than 3 locations is out.",
           "The owner or principal. One per practice."],
  nodes:[
   {id:"n1", action:"maps_collect",    after:[],
    params:{terms:["optometrist","eye doctor","optometry clinic"],
            include:"optometr|eye care|vision",
            exclude:"ophthalmolog|lasik|sunglass|department store",
            regions:["s"],exclude_cities:[],pages:8,zoom:"auto",selfstop:true}},
   {id:"n2", action:"web_serp_collect",after:[],      skipped:true,
    why:"Maps covers this vertical; the bake-off measured web search at only about +2%."},
   {id:"n3", action:"evidence_rules",  after:["n1"]},
   /* merge BEFORE the paid judgement, not after: the plan used to run the LLM verdict
      first and reconcile the duplicates afterwards, which pays to judge the same
      practice twice. The old canvas hid it — with phases as real column groups the
      connector now visibly doubles back, which is how it was spotted. */
   {id:"n6", action:"pool_reconcile",  after:["n3"]},
   {id:"n4", action:"site_scrape",     after:["n6"]},
   {id:"n5", action:"llm_verdict",     after:["n4"],
    params:{question:"Is this an independent optometry practice that sees patients at its own location — not a retail eyewear chain and not an ophthalmology surgical group?",batch:20}},
   {id:"n7", action:"dm_discovery",    after:["n5"],
    params:{role:"The owner or principal optometrist. One per practice. Not an office manager, not an associate.",per_company:1}},
   {id:"n8", action:"dm_confirm",      after:["n7"]},
   {id:"n9", action:"email_guess",     after:["n7"]},
   {id:"n10",action:"mv_verify",       after:["n9"]},
   {id:"n11",action:"outreach_push",   after:["n10"],
    params:{instance:"8851 — optometrists",tag:"optometrists-2026-q3"}},
   {id:"n12",action:"unipile_activity",after:["n10"]}
  ]
};
let PLAN=JSON.parse(JSON.stringify(START_PLAN));
let seq=100;                                     // deterministic id counter (never Date.now)
/* what the strategy looked like when the plan on the canvas was drafted — the plan goes
   stale when the answers behind it change, and saying so is more useful than silently
   re-planning underneath someone who is watching a run */
function strategySig(p){return JSON.stringify([p.brief||"",p.entry||"",p.answers||[]]);}
let DRAFTED_SIG=strategySig(PLAN);

/* ---- derived graph: volumes, cost, time, topological order ---- */
/* Never returns undefined: a saved plan can name a step that has since been retired, and
   that must show up as one clearly-broken card rather than a blank application. */
const MISSING_STEP={phase:"collect",grain:"account",tech:"?",job:null,
  plain:{title:"Unknown step",body:"This plan names a step this system no longer has. It cannot run until you replace it."},
  requires:[],produces:[],unit:0,rpm:0,keep:1,missing:true};
function reg(n){return REGISTRY[n.action]||MISSING_STEP;}
/* A rider is a seatbelt on the next step, not a stage in the funnel: it must not
   appear as a predecessor, or its zero volume would zero out everything after it. */
function preds(n){return n.after.map(id=>PLAN.nodes.find(x=>x.id===id)).filter(x=>x&&!isRider(x));}
function succs(n){return PLAN.nodes.filter(x=>x.after.includes(n.id));}
function topo(){
  const out=[],seen=new Set();
  let guard=0;
  while(out.length<PLAN.nodes.length&&guard++<500){
    PLAN.nodes.forEach(n=>{
      if(seen.has(n.id))return;
      if(n.after.every(id=>seen.has(id)||!PLAN.nodes.some(x=>x.id===id))){seen.add(n.id);out.push(n);}
    });
  }
  PLAN.nodes.forEach(n=>{if(!seen.has(n.id))out.push(n);});   // cycle safety
  return out;
}
/* volumes flow along edges; a node's inbound volume is the sum of its predecessors' outputs */
/* A step's numbers come from the registry UNLESS its own setup overrides them.
   That is what makes the estimate move while you are configuring: adding a fourth
   search term or a second region changes the dollars on the card immediately,
   rather than after the money is gone. */
function scaled(n){
  const r=reg(n);
  const s=(SETUP[n.action]&&SETUP[n.action].scale&&n.params)?SETUP[n.action].scale(n.params):null;
  if(!s)return r;
  return {...r,seed:s.seed!=null?s.seed:r.seed,unit:s.unit!=null?s.unit:r.unit,
          rpm:s.rpm!=null?s.rpm:r.rpm,keep:s.keep!=null?s.keep:r.keep};
}
function compute(){
  const G={};let cum=0;
  topo().filter(n=>!isRider(n)).forEach(n=>{
    const r=scaled(n),ps=preds(n);
    /* A step with no real predecessor is a SOURCE. It seeds from its own estimate if it
       collects, and otherwise from the list you already have — which is what an
       entry point means. Without that fallback every accounts-first plan reads zero. */
    const isSource=!ps.length;
    /* A COLLECTOR INVENTS RECORDS. It must never inherit the size of the list you already
       have — doing that quoted an unconfigured map sweep at $190 against 92,628 existing
       places, a precise-looking number derived from something entirely unrelated to it.
       Until its scope is set its volume is genuinely UNKNOWN, and an unknown must be shown
       as unknown rather than guessed at. The PLAN.seed fallback stays for everything else:
       for a list you already hold, the first step really does operate on all of it.
       (Found in the live build 2026-07-31; back-ported.) */
    const collector=r.broad&&isSource;
    const seed=collector?(r.seed||0):(r.seed||(isSource?(PLAN.seed||0):0));
    const unknown=collector&&!seed;
    const inVol=isSource?seed:ps.reduce((s,p)=>s+((G[p.id]&&G[p.id].out)||0),0);
    const skipped=!!n.skipped;
    const out=skipped?inVol:Math.round(inVol*(r.keep==null?1:r.keep));
    const billable=skipped?0:inVol;
    const cost=skipped?0:billable*(r.unit||0);
    const mins=skipped?0:(r.drip?(billable/(r.perDay||120))*1440:(r.rpm?billable/r.rpm:0));
    cum+=cost;
    /* A collector shows no inbound — it invents the records. A first step on a list you
       ALREADY have does have inbound, and hiding it renders an accounts-first plan as
       "0 in -> 16,120 out", which reads as the step inventing 16,120 companies. */
    G[n.id]={in:isSource?(r.seed?0:seed):inVol, out, cost, mins, billable, skipped, unknown,
             cum,                                  // running spend in execution order
             overBudget:cost>0&&cum>PLAN.budget,   // this step is what breaks the ceiling
             /* a list-level step has no grain of its own — what it emits is whatever it
                consumes, so the handoff reads "people out", not "companies out" */
             grainOut:(r.grain==="cross"||r.grain==="contact"||
                       (r.grain==="list"&&(r.requires||[]).some(x=>x.indexOf("contact.")===0)))
                       ?"people":"companies"};
  });
  /* ---- visual weight: how much of THIS plan is this one step? ----
     Cost and time cannot be averaged into one number without lying — a free step
     that runs for six hours and a $30 step that finishes instantly are both heavy,
     for opposite reasons. So the card's size/shade takes the LARGER of the two
     burdens (the honest "how much of this plan is this?"), and two separate meters
     say which one it is. Shares are square-rooted: one dominant step would
     otherwise flatten every other card to nothing. */
  const live=PLAN.nodes.filter(n=>!n.skipped)
    .map(n=>({g:G[n.id],drip:!!reg(n).drip})).filter(x=>x.g);
  const maxC=Math.max(...live.map(x=>x.g.cost),0.0001);
  /* A drip is not "a very long clock step" — it is a different kind of slow, capped by
     somebody else's daily limit and deliberately off the critical path. Letting a 14-day
     drip set the clock scale made a FOUR-HOUR website crawl render as featherweight,
     which is the exact misreading this feature exists to prevent. So drips are excluded
     from the scale and simply pinned to full. */
  const maxM=Math.max(...live.filter(x=>!x.drip).map(x=>x.g.mins),0.0001);
  live.forEach(x=>{
    x.g.mShare=Math.sqrt(Math.min(1,x.g.cost/maxC));
    x.g.tShare=x.drip?1:Math.sqrt(Math.min(1,x.g.mins/maxM));
    const w=Math.max(x.g.mShare,x.g.tShare);
    x.g.wt=w>=.78?3:w>=.5?2:w>=.22?1:0;
  });
  return G;
}
let G=compute();
function totals(){
  let cost=0,mins=0,drip=0,partial=false;
  PLAN.nodes.forEach(n=>{const g=G[n.id];if(!g||g.skipped)return;
    if(g.unknown)partial=true;                     // a step whose size nobody knows yet
    cost+=g.cost; if(reg(n).drip)drip=Math.max(drip,g.mins); else mins+=g.mins;});
  const last=PLAN.nodes.find(n=>n.action==="outreach_push");
  /* `partial` travels with the number so the headline can never read as a settled total
     while a collector in the plan still has no scope.
     G may also be a frame behind PLAN — layout() runs before the graph is recomputed. This
     feeds the headline AND the lint, so it degrades to zero rather than throwing: an
     exception here took down the whole render in the live build. */
  return {cost,mins,drip,partial,sendable:(last&&G[last.id])?G[last.id].out:0};
}

/* ============================================================================
   4 · LAYOUT  (layered auto-layout from the dependency graph — the real thing,
   not hand-placed coordinates. "Tidy" re-runs it; dragging overrides per node.)
   ============================================================================ */
/* ROWH grew 132 -> 196 when cards gained a setup line and the two weight meters.
   Measured worst case across all five demo plans in both modes: 184px (a w3 drip step
   in Run mode, whose two chips wrap to a second line). Re-measure after any card change.
   Heavy cards are deliberately taller, so the row pitch has to clear the TALLEST
   card a row can hold, not the average one — otherwise a w3 step overlaps the row
   below it and the graph reads as broken. */
const NW=206, NWC=216, PITCH=252, ROWH=276;   /* 236 -> 276: batch stacks add a row in Run mode; measured worst 248 */
const GATEGAP=86;          // extra breathing room at a stage boundary, for the gate wall
const PADX=30, HEADH=74;   // canvas left pad; height of the stage/phase header strip
let POS={};                                     // id -> {x,y} (auto or dragged)
let manual={};                                  // ids the user dragged
let WALLX=0, LANEBOX={}, WORLD={w:1200,h:700};
let COLX={};                                    // column index -> world x
let PSPAN={}, SSPAN={}, COLOF={};               // phase / stage column ranges; id -> column

function laneOf(n){const g=reg(n).grain;return g==="cross"?"cross":g;}

/* Columns are not evenly spaced: a stage boundary buys an extra gap so the gate wall
   has somewhere to stand without crowding the cards on either side. Everything that
   converts a column index to a pixel goes through xOf() — there is no `26+c*PITCH`
   arithmetic left anywhere, because the moment two places disagree the bands stop
   lining up with the cards they are supposed to contain. */
function xOf(c){return COLX[c]!=null?COLX[c]:PADX+c*PITCH;}
function buildCols(colOf,order){
  const maxc=Math.max(0,...order.map(n=>colOf[n.id]));
  /* which stage owns each column (leftmost stage wins if they ever overlap) */
  const owner=[];
  order.forEach(n=>{const c=colOf[n.id],s=STAGE_AT[stageOf(n)];
    if(owner[c]==null||s<owner[c])owner[c]=s;});
  for(let c=1;c<=maxc;c++)if(owner[c]==null)owner[c]=owner[c-1];
  COLX={};let x=PADX;
  for(let c=0;c<=maxc;c++){
    if(c>0&&owner[c]!==owner[c-1])x+=GATEGAP;
    COLX[c]=x;x+=PITCH;
  }
  return owner;
}

function layout(force){
  const order=topo().filter(n=>!isRider(n));
  const col={};
  /* PHASE ORDER DOMINATES. Columns are laid out phase by phase against a cursor, and
     depth is measured only against predecessors IN THE SAME PHASE.
     Ranking by global dependency depth and then lifting phases into order looks
     equivalent and is not: depth accumulates ACROSS phases, so one long chain drags
     every later phase rightward. Measured on the ad-agency plan before this change:
     30 columns for 20 steps, including an eleven-column "merge duplicates" phase that
     holds three steps. Anchoring each phase to a cursor keeps a phase exactly as wide
     as its own internal chain, and makes the phase spans contiguous and disjoint BY
     CONSTRUCTION rather than by hope — which is the property a band needs before it can
     honestly be called a container. */
  const local={};
  order.forEach(n=>{
    const ps=preds(n).filter(p=>reg(p).phase===reg(n).phase&&local[p.id]!=null);
    local[n.id]=ps.length?Math.max(...ps.map(p=>local[p.id]+1)):0;
  });
  PSPAN={};SSPAN={};
  let cursor=0;
  PHASES.forEach(([ph])=>{
    const ns=order.filter(n=>reg(n).phase===ph);if(!ns.length)return;
    let w=1;
    ns.forEach(n=>{col[n.id]=cursor+local[n.id];w=Math.max(w,local[n.id]+1);});
    PSPAN[ph]={c0:cursor,c1:cursor+w-1,ph};
    const st=STAGE_OF[ph],s=SSPAN[st];
    if(s)s.c1=cursor+w-1; else SSPAN[st]={c0:cursor,c1:cursor+w-1,id:st};
    cursor+=w;
  });
  COLOF=col;
  buildCols(col,order);

  /* rows: stack within (lane, column) */
  const rowOf={},used={};
  order.forEach(n=>{
    const key=laneOf(n)+":"+col[n.id];
    used[key]=(used[key]||0);rowOf[n.id]=used[key];used[key]++;
  });
  /* STAGGER — alternate columns drop one row.
     Level rows put every connector on one horizontal line, and the gap between two
     columns is 46px while "12,539 companies" needs about 110px — so the count that IS
     the funnel was rendered underneath the next card on every single edge. This surfaced
     by dragging the cards into a zigzag by hand and discovering the canvas suddenly
     read properly. Dropping alternate columns a full row opens a clear band for the
     label and turns the funnel into a visible descending staircase.
     A full row rather than a half: cards run 92–248px tall depending on their weight, so
     any smaller offset still lands the label on top of a heavy card. Different columns
     can never collide horizontally (pitch 252 > card 206), so the offset is free of
     overlap risk by construction — it only costs one row of lane height.
     Parity is measured from each lane's OWN first column, so every lane starts high. */
  const laneC0={};
  order.forEach(n=>{const l=laneOf(n),c=col[n.id];
    if(laneC0[l]==null||c<laneC0[l])laneC0[l]=c;});
  const stagOf=n=>((col[n.id]-(laneC0[laneOf(n)]||0))%2+2)%2;
  const slot={};order.forEach(n=>{slot[n.id]=rowOf[n.id]+stagOf(n);});
  const maxRow=l=>Math.max(0,...order.filter(n=>laneOf(n)===l).map(n=>slot[n.id]));
  const aRows=maxRow("account")+1, cRows=Math.max(maxRow("contact")+1,1), lRows=maxRow("list")+1;
  const hasCross=order.some(n=>laneOf(n)==="cross"), hasList=order.some(n=>laneOf(n)==="list");
  const aH=aRows*ROWH+34, cH=cRows*ROWH+34, lH=lRows*ROWH+30;
  const aY=HEADH+18, cY=aY+aH+(hasCross?46:22), lY=cY+cH+22;
  LANEBOX={account:{y:aY,h:aH},contact:{y:cY,h:cH},list:hasList?{y:lY,h:lH}:null};
  order.forEach(n=>{
    if(!force&&manual[n.id]){POS[n.id]=clampToCell(n,manual[n.id]);return;}
    POS[n.id]={x:xOf(col[n.id]),y:rowY(n,slot[n.id])};
    if(force)delete manual[n.id];
  });
  /* the lock wall now IS a stage boundary rather than a floating line */
  WALLX=SSPAN.people?xOf(SSPAN.people.c0)-GATEGAP/2-7:0;
  const right=Math.max(...order.map(n=>POS[n.id].x+NWC),600);
  const bot=(LANEBOX.list?LANEBOX.list.y+LANEBOX.list.h:cY+cH);
  WORLD={w:right+70,h:bot+56};
  return {col,rowOf};
}

/* ---- the cell a card is allowed to occupy: its phase's columns × its own lane ------
   This is the bit that makes the containers mean something. Before this, a card could
   be dragged into any band on the canvas and the band would carry on claiming to be
   "Collect" or "Accounts" while holding something else entirely — decoration that
   actively lies. Now the drag is clamped to the cell, so the picture cannot go wrong. */
function laneTop(n){
  const l=laneOf(n);
  if(l==="cross")return LANEBOX.account.y+LANEBOX.account.h-56;
  return (LANEBOX[l]||LANEBOX.contact).y+22;
}
function rowY(n,r){return laneTop(n)+r*ROWH;}
function cellOf(n){
  const sp=PSPAN[reg(n).phase]||{c0:0,c1:0};
  const l=laneOf(n), box=l==="cross"?LANEBOX.account:(LANEBOX[l]||LANEBOX.contact);
  const top=laneTop(n);
  const rows=Math.max(1,Math.round((box.h-34)/ROWH));
  return {x0:xOf(sp.c0),x1:xOf(sp.c1),y0:top,y1:top+(rows-1)*ROWH,c0:sp.c0,c1:sp.c1,rows};
}
function clampToCell(n,p){
  const c=cellOf(n);
  return {x:Math.max(c.x0,Math.min(c.x1,p.x)),y:Math.max(c.y0,Math.min(c.y1,p.y))};
}
function showCell(n){
  const el=$("#cellhi");if(!el)return;
  const c=cellOf(n);
  el.style.left=(c.x0-14)+"px";el.style.top=(c.y0-14)+"px";
  el.style.width=(c.x1-c.x0+NW+28)+"px";
  el.style.height=(c.y1-c.y0+ROWH-30)+"px";
}
function hideCell(){const el=$("#cellhi");if(el)el.removeAttribute("style");}
/* on drop: land on the nearest legal (column,row) slot, and if someone is already
   there, trade places with them — a drag is a reorder, not a free placement */
function snapToSlot(n,p,from){
  const c=cellOf(n);
  let bc=c.c0,bd=1e9;
  for(let i=c.c0;i<=c.c1;i++){const d=Math.abs(xOf(i)-p.x);if(d<bd){bd=d;bc=i;}}
  const r=Math.max(0,Math.min(c.rows-1,Math.round((p.y-c.y0)/ROWH)));
  const tgt={x:xOf(bc),y:c.y0+r*ROWH};
  const occ=PLAN.nodes.find(o=>o.id!==n.id&&!isRider(o)&&!o.skipped&&POS[o.id]&&
    Math.abs(POS[o.id].x-tgt.x)<4&&Math.abs(POS[o.id].y-tgt.y)<4&&laneOf(o)===laneOf(n));
  if(occ&&from){manual[occ.id]=POS[occ.id]=clampToCell(occ,from);}
  return tgt;
}

/* ============================================================================
   5 · CAMERA (pan / zoom / minimap / fly-to) — extends the Logic Engine pattern
   ============================================================================ */
const cam={x:24,y:8,z:.82};
function applyCam(){
  $("#world").style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
  sizeScrim();
  drawMinimap();
}
/* The dim layer lives in world space but has to cover the SCREEN, so its rect is the
   viewport projected back into world coordinates. Four style writes per pan frame. */
function sizeScrim(extra){
  const sc=$("#spotscrim");if(!sc)return;
  const vp=$("#viewport").getBoundingClientRect(),pad=(240+(extra||0))/cam.z;
  sc.style.left=(-cam.x/cam.z-pad)+"px";
  sc.style.top=(-cam.y/cam.z-pad)+"px";
  sc.style.width=(vp.width/cam.z+pad*2)+"px";
  sc.style.height=(vp.height/cam.z+pad*2)+"px";
}
function fit(pad){
  const vp=$("#viewport").getBoundingClientRect();
  const z=Math.min((vp.width-(pad||46)*2)/WORLD.w,(vp.height-(pad||46)*2)/WORLD.h,1.15);
  cam.z=Math.max(.28,Math.min(1.15,z));
  cam.x=(vp.width-WORLD.w*cam.z)/2; cam.y=Math.max(8,(vp.height-WORLD.h*cam.z)/2);
  applyCam();
}
function flyTo(id,zoom){
  const p=POS[id];if(!p)return;
  const vp=$("#viewport").getBoundingClientRect();
  cam.z=zoom||Math.max(cam.z,.72);
  cam.x=vp.width/2-(p.x+NW/2)*cam.z;
  cam.y=vp.height/2-(p.y+58)*cam.z;
  applyCam();
}
/* Same move, animated — driven by requestAnimationFrame, NOT a CSS transition.
   This is not a style preference, it is the fix for a real bug. A CSS transition animates
   `.world`'s transform while `cam` already holds the destination, so everything computed
   FROM `cam` — above all the spotlight dim layer, which lives in world space but must
   cover the screen — is drawn for a camera the canvas has not reached yet. The dim landed
   off to one side for the whole half-second of every hop, which read as "the spotlight
   does not work". Tweening `cam` itself keeps the world and everything derived from it on
   the same frame, by construction. */
let camAnim=0,camSnap=0;
function stopCam(){cancelAnimationFrame(camAnim);clearTimeout(camSnap);camAnim=camSnap=0;}
function tweenCam(to,ms){
  stopCam();
  const from={x:cam.x,y:cam.y,z:cam.z}, dur=ms||520;
  let t0=null;
  const ease=t=>1-Math.pow(1-t,3);
  const step=now=>{
    if(t0===null)t0=now;
    const t=Math.min(1,(now-t0)/dur), e=ease(t);
    cam.x=from.x+(to.x-from.x)*e;cam.y=from.y+(to.y-from.y)*e;cam.z=from.z+(to.z-from.z)*e;
    applyCam();
    if(t<1)camAnim=requestAnimationFrame(step);
  };
  camAnim=requestAnimationFrame(step);
  /* rAF does not fire in a hidden tab — land the camera anyway rather than freezing
     mid-flight, which would leave the dim layer sized for somewhere we never arrived */
  camSnap=setTimeout(()=>{cam.x=to.x;cam.y=to.y;cam.z=to.z;applyCam();stopCam();},dur+90);
}
function glideTo(id,zoom){
  const p=POS[id];if(!p)return;
  const vp=$("#viewport").getBoundingClientRect();
  const z=zoom||Math.max(cam.z,.95);
  tweenCam({z,x:vp.width/2-(p.x+NW/2)*z,y:vp.height/2-(p.y+58)*z});
}
function drawMinimap(){
  const mm=$("#minimap"),W=mm.clientWidth,H=mm.clientHeight,pad=5;
  const s=Math.min((W-pad*2)/WORLD.w,(H-pad*2)/WORLD.h);
  let h='';
  PLAN.nodes.forEach(n=>{
    const p=POS[n.id];if(!p)return;
    h+=`<div class="mn ${n.skipped?"ghost":laneOf(n)}${SPOT.id===n.id?" spotmn":""}" style="left:${pad+p.x*s}px;top:${pad+p.y*s}px;
         width:${Math.max(3,NW*s)}px;height:${Math.max(2.5,104*s)}px"></div>`;
  });
  const vp=$("#viewport").getBoundingClientRect();
  const vw=vp.width/cam.z*s, vh=vp.height/cam.z*s;
  h+=`<div class="cam" style="left:${pad+(-cam.x/cam.z)*s}px;top:${pad+(-cam.y/cam.z)*s}px;
       width:${vw}px;height:${vh}px"></div>`;
  mm.innerHTML=h;mm._s=s;mm._pad=pad;
}

/* ============================================================================
   6 · RENDER — nodes, edges, lanes, wall
   ============================================================================ */
let vocab="plain", mode="plan", selected=null;

function costChip(n){
  const g=G[n.id],r=scaled(n);
  if(g.skipped)return "";
  if(!r.unit)return `<span class="chip free">free</span>`;
  /* "over" = by the time this step runs, the plan has passed the ceiling — a single
     step rarely exceeds the whole budget alone, so per-step comparison never fires. */
  const c=g.cost, over=g.overBudget;
  const kind=c<1?"coin":"bill";
  const label=vocab==="plain"?centsWord(c):money(c);
  return `<span class="chip ${kind}${over?" over":""}">${ico(kind==="coin"?"coins":"bills")}${label}</span>`;
}
/* The clock glyph is the fastest read on the card, so it earns colour of its own:
   grey instant, teal minutes, amber hours, purple days. Three shapes AND three
   colours means the tier lands before the number is read. */
function timeChip(n){
  const g=G[n.id],r=scaled(n);
  if(g.skipped)return "";
  if(r.drip)return `<span class="chip drip t-day">${ico("calendar")}${dur(g.mins)} drip</span>`;
  if(!g.mins)return `<span class="chip t-inst">${ico("stopwatch")}instant</span>`;
  const cls=g.mins>=1440?"t-day":g.mins>30?"t-hr":"t-min";
  const glyph=g.mins>=1440?"calendar":g.mins>30?"hourglass":"stopwatch";
  return `<span class="chip ${cls}">${ico(glyph)}${dur(g.mins)}</span>`;
}
/* ---- the same cost/time language in the CATALOGUE, priced at the volume that
   would actually reach this insertion point. Choosing an action without knowing
   what it costs is the decision the icons exist to inform, and it happens HERE —
   by the time the card is on the canvas the choice is already made. ---- */
/* A BILLABLE STEP MUST NEVER READ "free", and a SLOW STEP MUST NEVER READ "instant".
   Adding a step to an empty plan projects zero records through it, so the honest total
   really is nothing — but "free" is not what a reader takes from that, they take "this
   one doesn't cost". Same for "instant" on a crawl that runs at 20 a minute. When there
   is no volume to multiply yet we show the RATE instead of a total of zero. */
function palCostChip(k,vol){
  const r=REGISTRY[k];
  if(!r.unit)return `<span class="chip free">free</span>`;
  const n=r.seed||vol;
  if(!n)return `<span class="chip coin" title="cost depends on how many records reach it">${
    ico("coins")}${vocab==="plain"?centsWord(r.unit*1000)+" per 1,000":money(r.unit)+"/record"}</span>`;
  const c=n*r.unit;
  const kind=c<1?"coin":"bill";
  return `<span class="chip ${kind}">${ico(kind==="coin"?"coins":"bills")}${
    vocab==="plain"?centsWord(c):money(c)}</span>`;
}
function palTimeChip(k,vol){
  const r=REGISTRY[k],n=r.seed||vol;
  if(r.drip&&!n)return `<span class="chip drip t-day">${ico("calendar")}${
    num(r.perDay||120)} a day</span>`;
  const mins=r.drip?(n/(r.perDay||120))*1440:(r.rpm?n/r.rpm:0);
  if(r.drip)return `<span class="chip drip t-day">${ico("calendar")}${dur(mins)} drip</span>`;
  if(!n&&r.rpm)return `<span class="chip ${r.rpm<100?"t-hr":"t-min"}" title="how long depends on how many records reach it">${
    ico(r.rpm<100?"hourglass":"stopwatch")}${num(Math.round(r.rpm))} a minute</span>`;
  if(!mins)return `<span class="chip t-inst">${ico("stopwatch")}instant</span>`;
  const cls=mins>=1440?"t-day":mins>30?"t-hr":"t-min";
  return `<span class="chip ${cls}">${ico(mins>30?"hourglass":"stopwatch")}${dur(mins)}</span>`;
}
function chipsHTML(n,st){
  const r=reg(n);
  const c=[];
  if(mode==="run"){c.push(costChip(n));c.push(timeChip(n));}
  if(r.review)c.push(`<span class="chip human">${ico("hand")}${st.queue||0}</span>`);
  if(vocab==="tech")c.push(`<span class="chip tech">${r.job}</span>`);
  const s=c.filter(Boolean).join("");
  return s?`<div class="nchips">${s}</div>`:"";
}
/* Two meters, drawn to the same scale across the whole plan, so "which step is
   the expensive one / the slow one" is answerable without reading anything. */
function heftHTML(n){
  const g=G[n.id],r=scaled(n);
  if(g.skipped)return "";
  const m=Math.round((g.mShare||0)*100),t=Math.round((g.tShare||0)*100);
  /* an unconfigured collector has no volume, so it has no cost and no duration — saying
     so is the whole point, and any number here would be invented */
  if(g.unknown)return `<div class="hefts"><div class="heft"><span class="hl">cost</span>
    <span class="hv">set the scope first</span></div></div>`;
  const mv=r.unit?(vocab==="plain"?centsWord(g.cost):money(g.cost)):"free";
  const tv=g.mins?dur(g.mins):"instant";
  /* A free, instant step has nothing worth metering. Drawing two empty bars on it
     spent the same space as the step that costs $17 and said nothing — the contrast
     between cards IS the information. */
  if((g.wt||0)===0)
    return `<div class="heftlite">${ico(r.unit?"coins":"bills")}${mv} · ${ico("stopwatch")}${tv}</div>`;
  return `<div class="heft">
    <div class="hm money">${ico("bills")}<span class="tr"><i style="width:${m}%"></i></span><span class="v">${mv}</span></div>
    <div class="hm time${r.drip?" drip":""}">${ico(r.drip?"calendar":g.mins>30?"hourglass":"stopwatch")}<span class="tr"><i style="width:${t}%"></i></span><span class="v">${tv}</span></div>
  </div>`;
}
/* Name the reason, not just the size. A bigger box with no explanation is a puzzle. */
function weightTag(n){
  const g=G[n.id];if(!g||g.skipped||(g.wt||0)<2)return "";
  const m=g.mShare||0,t=g.tShare||0,top=g.wt===3;
  let txt,glyph;
  if(m>=.7&&t>=.7){txt=top?"costliest and slowest":"costly and slow";glyph="bills";}
  else if(m>=t)   {txt=top?"biggest cost here":"costly";           glyph="bills";}
  else            {txt=top?"longest step here":"slow";             glyph=scaled(n).drip?"calendar":"hourglass";}
  return `<div class="wtag">${ico(glyph)}${txt}</div>`;
}
function runOf(n){return RUN.state[n.id]||{st:"idle",done:0,spent:0,mins:0};}

/* --- run spotlight (see the .spotscrim comment in the CSS for the stacking rules) ---
   One card is THE focus: the first step in execution order that is actually running.
   Steps running alongside it are lifted out of the dim too — a parallel branch that
   vanished behind a scrim would read as "stopped" — but only the focus grows and only
   the focus pulls the camera. If nothing is running, the queue waiting on a human is
   the next most useful thing to point at. */
const SPOT={on:true,id:null,preview:null};
function spotTarget(){
  if(mode!=="run")return null;
  if(SPOT.preview)return SPOT.preview;    // the tour demonstrates the spotlight on a real card
  if(!SPOT.on)return null;
  const live=topo().filter(n=>!n.skipped&&!isRider(n)&&runOf(n).st==="running");
  if(live.length)return live[0].id;
  const wait=topo().filter(n=>!n.skipped&&runOf(n).st==="needs");
  return wait.length?wait[0].id:null;
}
function spotClass(n,st){
  if(!SPOT.on||mode!=="run"||!SPOT.id)return "";
  if(n.id===SPOT.id)return " spot";
  return (st.st==="running"||st.st==="needs")?" lit":"";
}
function nodeHTML(n){
  if(isRider(n))return "";          // drawn as a band on the card it protects
  const r=reg(n),g=G[n.id],lane=laneOf(n);
  const title=vocab==="plain"?r.plain.title:r.tech;
  const p=POS[n.id];
  if(!p||!g)return "";
  if(n.skipped){
    return `<div class="node ghost g-${lane}" data-id="${n.id}" style="left:${p.x}px;top:${p.y}px">
      <div class="nhead"><span class="gi">${grainIcon(r.grain)}</span><span class="ntitle">${title}</span></div>
      <div class="ghostwhy">Skipped — ${n.why||"not needed for this list."}</div></div>`;
  }
  const st=runOf(n), lint=LINTBY[n.id], su=setupOf(n);
  const io=vocab==="plain"
    ? `${num(g.in||g.billable)} in &rarr; ${num(g.out)} ${g.grainOut}`
    : `${(r.requires[0]||"—")} &rarr; ${(r.produces[0]||"—")}`;
  /* the state dot: "!" used to mean BOTH "needs you" and "lint finding". The
     triangle is now reserved for the lint badge; a step waiting on a human shows
     the person glyph instead, which is what it actually means. */
  const stateGlyph={done:"✓",running:"◔",idle:"·",blocked:"·"}[st.st]
    ?? (st.st==="needs"?ico("hand"):"·");
  const riders=ridersOn(n);
  /* completeness recedes, exceptions speak: complete/closed cards gray back, an up-to-date
     card dims slightly, and ONLY a reopened card (complete + genuinely new work) highlights */
  const live=STATE[n.action];
  const doneCls=!live?"":live.state==="settled"||live.state==="closed"?" ncomplete"
              :live.state==="reopened"?" nreopen":live.state==="done"?" nquiet":"";
  return `<div class="node g-${lane} w${g.wt||0}${doneCls}${n.required?" joinnode":""}${selected===n.id?" sel":""}${lint&&!lint.pass?" flag":""}${spotClass(n,st)}${PEEK.node===n.id?" peeking":""}"
       data-id="${n.id}" style="left:${p.x}px;top:${p.y}px">
    ${weightTag(n)}
    ${workHTML(n)}
    ${stateChip(n)}
    ${riders.map(rd=>`<div class="rider" title="${reg(rd).plain.body}">${ico("lock")}
       <span>${vocab==="plain"?reg(rd).plain.title:reg(rd).tech}</span>
       <b>before this</b></div>`).join("")}
    ${n.required?`<div class="reqtag">${ico("check")} required — ${n.srcCount||2} sources feed this</div>`:""}
    <div class="nownote"><i></i>${st.st==="needs"?"waiting on you":"running now"}</div>
    <button class="peek" data-peek="${n.id}" title="Look at the records at this step">${ico("rows")}data</button>
    ${su?`<button class="gearb${su.ready?"":" needs"}" data-gear="${n.id}"
       title="${su.ready?"Set up this step":"This step still needs setting up"}">${ico("gear")}</button>`:""}
    ${lint&&!lint.pass?`<div class="lintdot ${lint.sev==="stop"?"stop":""}" title="${lint.t}">${ico("warn")}</div>`:""}
    <div class="state ${st.st}">${stateGlyph}</div>
    <div class="nhead"><span class="gi">${grainIcon(r.grain)}</span><span class="ntitle">${title}</span></div>
    <div class="nio">${io}</div>
    ${su?`<div class="nsetup${su.ready?"":" needs"}" data-gear="${n.id}"
       title="Open this step's settings">${su.ready?ico("gear"):ico("warn")}<span
       >${su.ready?(su.summary||"set up"):"Needs setting up — "+su.missing.map(k=>{
         const f=fieldOf(n.action,k);return (f?f.label:k).toLowerCase();}).join(", ")}</span></div>`:""}
    ${/* Plan mode: the meters carry BOTH the value and the magnitude, so repeating
          them as chips was the same number twice on a 206px card. Run mode has no
          meters (the progress bar owns that space), so the chips come back there. */""}
    ${chipsHTML(n,st)}
    ${heftHTML(n)}
    ${stackHTML(n)}
    <div class="nrun">
      <div class="bar ${st.st==="done"?"done":st.st==="running"?"":st.st==="needs"?"need":"wait"}">
        <i style="width:${st.pct||0}%"></i></div>
      <div class="runline"><span>${st.line||"queued"}</span><span>${st.right||""}</span></div>
    </div></div>`;
}
function edgeList(){
  const out=[];
  PLAN.nodes.forEach(n=>{
    if(isRider(n))return;                       // riders have no edges — they ride a card
    n.after.forEach(pid=>{
      const p=PLAN.nodes.find(x=>x.id===pid);
