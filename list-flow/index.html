function fieldHTML(n,f){
  const p=n.params||{},v=p[f.k];
  const req=(SETUP[n.action].req||[]).includes(f.k);
  let ctl="";
  if(f.type==="lines")
    ctl=`<textarea data-f="${f.k}" placeholder="${(f.ph||"").replace(/"/g,"&quot;")}">${(v||[]).join("\n")}</textarea>`;
  else if(f.type==="textarea")
    ctl=`<textarea data-f="${f.k}" placeholder="${(f.ph||"").replace(/"/g,"&quot;")}">${v||""}</textarea>`;
  else if(f.type==="number")
    ctl=`<input type="number" data-f="${f.k}" value="${v==null?"":v}" min="${f.min||0}" max="${f.max||9999}">`;
  else if(f.type==="select")
    ctl=`<select data-f="${f.k}">${f.opts.map(o=>
      `<option value="${o[0]}"${String(v)===o[0]?" selected":""}>${o[1]}</option>`).join("")}</select>`;
  else if(f.type==="toggle")
    ctl=`<div class="chips"><button data-t="${f.k}" data-v="1" class="${v!==false?"on":""}">Yes</button>
         <button data-t="${f.k}" data-v="0" class="${v===false?"on":""}">No</button></div>`;
  else if(f.type==="regions")
    ctl=`<div class="chips">${REGIONS.map(r=>
      `<button data-rg="${r[0]}" class="${(v||[]).includes(r[0])?"on":""}">${r[1]}
        <span style="opacity:.65;font-weight:500"> ${num(REGION_CITIES[r[0]])} cities</span></button>`).join("")}</div>`;
  else
    ctl=`<input type="text" data-f="${f.k}" value="${(v==null?"":String(v)).replace(/"/g,"&quot;")}"
         placeholder="${(f.ph||"").replace(/"/g,"&quot;")}">`;
  return `<div class="fld ${req?"req":""}"><label>${f.label}</label>
    ${f.help?`<div class="fh">${f.help}</div>`:""}${ctl}</div>`;
}
function probeHTML(n,pr){
  const res=(PROBE_RESULTS[n.id]||{})[pr.id];
  return `<div class="probe">
    <div class="pt">${ico("flask")}${pr.title}
      <span class="pcost ${pr.free?"free":""}">${pr.cost}</span></div>
    <div class="pb">${pr.body}</div>
    <div class="btnrow" style="margin:0">
      <button class="btn gray sm" data-probe="${pr.id}">${res?"Run it again":"Run it"}</button>
      ${res&&pr.apply?`<button class="btn sm" data-apply="${pr.id}">${pr.apply.label}</button>`:""}
    </div>
    ${res?`<div class="pres">${pr.render(res,n.params||{})}</div>`:""}</div>`;
}
function renderSetup(){
  const n=setupNode();if(!n)return;
  const s=SETUP[n.action],r=reg(n),su=setupOf(n),g=G[n.id]||{};
  $("#modal").innerHTML=`
    <div class="mhead">
      <div><h2>${ico("gear")} ${r.plain.title}</h2>
        <div class="sub">What this step will actually do. Everything here belongs to this step,
          so the same action set up differently on another list stays untouched.</div></div>
      <div class="spacer"></div><div class="dclose" onclick="closeSetup()">×</div></div>
    <div class="mbody">
      ${su.ready?"":`<div class="setmiss">${ico("warn")} Not runnable yet — still needs
        ${su.missing.map(k=>{const f=fieldOf(n.action,k);return "<b>"+(f?f.label.toLowerCase():k)+"</b>";}).join(" and ")}.
        The plan checker will refuse to start a run while that is true.</div>`}
      ${s.groups.map(grp=>`<div class="setgrp">
        <div class="gh">${grp.title}${grp.sub?`<span class="gsub">— ${grp.sub}</span>`:""}</div>
        <div class="gb">${grp.fields.map(f=>fieldHTML(n,f)).join("")}</div></div>`).join("")}
      ${s.probes&&s.probes.length?`<div class="setgrp">
        <div class="gh">${ico("flask")} Before you commit
          <span class="gsub">— cheap experiments that answer these questions with real data</span></div>
        <div class="gb">${s.probes.map(pr=>probeHTML(n,pr)).join("")}</div></div>`:""}
      <div class="setfoot">
        <div class="est">This step, as set up: <b>${money(g.cost||0)}</b> ·
          <b>${g.mins?dur(g.mins):"instant"}</b> ·
          about <b>${num(g.out||0)}</b> ${g.grainOut||"companies"} out</div>
        <span style="flex:1"></span>
        <button class="btn" onclick="closeSetup()">Done</button>
      </div></div>`;
  /* --- wire it up. Every edit writes straight to the node and re-renders the
     canvas, so the dollar figure on the card moves while you type. --- */
  const M=$("#modal");
  M.querySelectorAll("[data-f]").forEach(el=>{
    el.oninput=()=>{
      const k=el.dataset.f,f=fieldOf(n.action,k);
      let v=el.value;
      if(f.type==="lines")v=v.split("\n").map(x=>x.trim()).filter(Boolean);
      else if(f.type==="number")v=v===""?null:Number(v);
      n.params[k]=v;
      render();refreshSetupEstimate();
    };
    if(el.tagName==="SELECT")el.onchange=el.oninput;
  });
  M.querySelectorAll("[data-t]").forEach(el=>{el.onclick=()=>{
    n.params[el.dataset.t]=el.dataset.v==="1";renderSetup();render();};});
  M.querySelectorAll("[data-rg]").forEach(el=>{el.onclick=()=>{
    const k=el.dataset.rg,cur=n.params.regions||[];
    n.params.regions=cur.includes(k)?cur.filter(x=>x!==k):cur.concat([k]);
    renderSetup();render();};});
  M.querySelectorAll("[data-probe]").forEach(el=>{el.onclick=()=>{
    const pr=s.probes.find(x=>x.id===el.dataset.probe);
    el.disabled=true;el.textContent="Running…";
    /* async on purpose: a probe that returns instantly teaches the wrong thing
       about what it costs (standing UX rule — a non-instant control shows it is working) */
    setTimeout(()=>{
      PROBE_RESULTS[n.id]=PROBE_RESULTS[n.id]||{};
      PROBE_RESULTS[n.id][pr.id]=pr.run(n.params||{});
      renderSetup();
      toast(pr.free?"Done — that one was free":"Done — "+pr.cost+" spent","ok");
    },620);};});
  M.querySelectorAll("[data-apply]").forEach(el=>{el.onclick=()=>{
    const pr=s.probes.find(x=>x.id===el.dataset.apply);
    const res=(PROBE_RESULTS[n.id]||{})[pr.id];
    pushUndo("Applied "+pr.title.toLowerCase());
    Object.assign(n.params,pr.apply.to(res,n.params||{}));
    renderSetup();render();toast("Applied to this step","ok");};});
}

const vp=$("#viewport");
let dragging=null,panning=null;
vp.addEventListener("mousedown",e=>{
  /* the data tab must win over both node-drag and node-select */
  const pk=e.target.closest("[data-peek]");
  if(pk){e.preventDefault();e.stopPropagation();openPeek(pk.dataset.peek);return;}
  /* the gear must win over node-drag too, or a click reads as a 0px drag */
  const gr=e.target.closest("[data-gear]");
  if(gr){e.preventDefault();e.stopPropagation();openSetup(gr.dataset.gear);return;}
  /* a work token sits ON the card but is NOT the card — it must not start a card drag */
  const wo=e.target.closest("[data-wo]");
  if(wo){e.preventDefault();e.stopPropagation();
    WORK_OPEN=wo.dataset.wo;const w=WORK.find(x=>x.id===WORK_OPEN);
    if(w){selected=w.step;setPanel("work");render();}
    return;}
  const nd=e.target.closest(".node");
  if(nd&&mode!=="run"){
    const id=nd.dataset.id, n=PLAN.nodes.find(x=>x.id===id);
    dragging={id,sx:e.clientX,sy:e.clientY,ox:POS[id].x,oy:POS[id].y,moved:false,
              cell:n&&!isRider(n)?cellOf(n):null,node:n};
    nd.classList.add("dragging");
    /* light up the one place this card is allowed to go, so the constraint reads as
       a rule of the board rather than as the drag being broken */
    if(dragging.cell)document.body.classList.add("celling");
    if(dragging.cell)showCell(n);
    e.preventDefault();return;
  }
  if(nd){selectNode(nd.dataset.id);return;}
  stopCam();                       // the user is taking the camera; abandon any glide
  panning={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y};
  vp.classList.add("drag");
});
window.addEventListener("mousemove",e=>{
  if(dragging){
    const dx=(e.clientX-dragging.sx)/cam.z,dy=(e.clientY-dragging.sy)/cam.z;
    if(Math.abs(dx)>3||Math.abs(dy)>3)dragging.moved=true;
    let p={x:Math.round(dragging.ox+dx),y:Math.round(dragging.oy+dy)};
    if(dragging.cell)p=clampToCell(dragging.node,p);   // the cell is the board, not a hint
    POS[dragging.id]=p;
    const el=$(`.node[data-id="${dragging.id}"]`);
    if(el){el.style.left=POS[dragging.id].x+"px";el.style.top=POS[dragging.id].y+"px";}
    renderEdges();drawMinimap();
    return;
  }
  if(panning){cam.x=panning.cx+(e.clientX-panning.sx);cam.y=panning.cy+(e.clientY-panning.sy);applyCam();}
});
window.addEventListener("mouseup",()=>{
  if(dragging){
    const el=$(`.node[data-id="${dragging.id}"]`);if(el)el.classList.remove("dragging");

    if(dragging.moved){
      if(dragging.cell)POS[dragging.id]=snapToSlot(dragging.node,POS[dragging.id],
                                                   {x:dragging.ox,y:dragging.oy});

$("#sheetq").oninput=e=>{PEEK.q=e.target.value;PEEK.row=null;renderPeek();};
$("#sheetcols").onclick=()=>{$("#filtermenu").classList.remove("on");
  $("#colmenu").classList.toggle("on");};
$("#colmenu").addEventListener("click",e=>{
  const c=e.target.closest("[data-col]");if(!c)return;
  const f=c.dataset.col;
  if(PEEK.hide[f])delete PEEK.hide[f];else PEEK.hide[f]=1;
  save();renderPeek();$("#colmenu").classList.add("on");
});

/* --- expand / shrink. The canvas is covered, never unmounted, and the camera is not
   touched — shrinking puts you back exactly where you were looking. --- */
function setSheetBig(on){
  PEEK.big=on;document.body.classList.toggle("sheetbig",on);
  $("#sheetbig").textContent=on?"⤡":"⤢";
  $("#sheetbig").title=on?"Back to half height":"Fill the window";
  requestAnimationFrame(()=>{sizeScrim();renderEdges();drawMinimap();});
}
$("#sheetbig").onclick=()=>setSheetBig(!PEEK.big);

/* --- filters --- */
$("#sheetfilter").onclick=()=>{$("#colmenu").classList.remove("on");
  const m=$("#filtermenu");
  if(!m.classList.contains("on")&&!PEEK.filters.length){
    /* opening an empty builder with nothing in it is a dead end — start a condition */
    const n=PLAN.nodes.find(x=>x.id===PEEK.node);
    const f=n?pkOrdered(pkFields(n))[0]:null;
    if(f)PEEK.filters.push({f,op:"set",v:""});
    renderPeek();
  }
  m.classList.toggle("on");};
$("#filtermenu").addEventListener("change",e=>{
  const part=e.target.dataset.fpart;if(!part)return;
  const row=e.target.closest("[data-fi]");if(!row)return;
  const f=PEEK.filters[+row.dataset.fi];if(!f)return;
  f[part]=e.target.value;
  if(part==="op"&&!OP_NEEDS_VALUE(f.op))f.v="";
  PEEK.row=null;renderPeek();$("#filtermenu").classList.add("on");
});
$("#filtermenu").addEventListener("input",e=>{
  if(e.target.dataset.fpart!=="v")return;
  const row=e.target.closest("[data-fi]");if(!row)return;
  PEEK.filters[+row.dataset.fi].v=e.target.value;
  PEEK.row=null;
  /* re-render the TABLE only — rebuilding the builder would blur the box mid-typing */
  const keep=document.activeElement,pos=keep.selectionStart;
  renderPeek();$("#filtermenu").classList.add("on");
  const again=$(`#filtermenu [data-fi="${row.dataset.fi}"] [data-fpart="v"]`);
  if(again){again.focus();try{again.setSelectionRange(pos,pos);}catch(err){}}
});
$("#filtermenu").addEventListener("click",e=>{
  if(e.target.closest("[data-fadd]")){
    const n=PLAN.nodes.find(x=>x.id===PEEK.node);
    const f=n?pkOrdered(pkFields(n))[0]:null;
    if(f)PEEK.filters.push({f,op:"set",v:""});
    renderPeek();$("#filtermenu").classList.add("on");return;}
  if(e.target.closest("[data-fclear]")){PEEK.filters=[];renderPeek();$("#filtermenu").classList.add("on");return;}
  const d=e.target.closest("[data-fdel]");
  if(d){PEEK.filters.splice(+d.dataset.fdel,1);renderPeek();$("#filtermenu").classList.add("on");}
});
$("#fchips").addEventListener("click",e=>{
  const d=e.target.closest("[data-fdel]");if(!d)return;
  PEEK.filters.splice(+d.dataset.fdel,1);renderPeek();
});

/* --- column reorder: drag the heading, the gesture every data explorer uses --- */
let colDrag=null;
$("#sheetbody").addEventListener("dragstart",e=>{
  const th=e.target.closest("th[data-col]");if(!th)return;
  colDrag=th.dataset.col;th.classList.add("dragging");
  e.dataTransfer.effectAllowed="move";
  try{e.dataTransfer.setData("text/plain",colDrag);}catch(err){}
});
$("#sheetbody").addEventListener("dragover",e=>{
  const th=e.target.closest("th[data-col]");if(!th||!colDrag)return;
  e.preventDefault();e.dataTransfer.dropEffect="move";
  $$("#sheetbody th").forEach(x=>x.classList.remove("dropL","dropR"));
  if(th.dataset.col===colDrag)return;
  const r=th.getBoundingClientRect();
  th.classList.add(e.clientX<r.left+r.width/2?"dropL":"dropR");
});
$("#sheetbody").addEventListener("drop",e=>{
  const th=e.target.closest("th[data-col]");if(!th||!colDrag)return;
  e.preventDefault();
  const n=PLAN.nodes.find(x=>x.id===PEEK.node);
  if(n&&th.dataset.col!==colDrag){
    const fields=pkFields(n),cur=pkOrdered(fields).slice();
    const i=cur.indexOf(colDrag);cur.splice(i,1);
    const r=th.getBoundingClientRect();
    let j=cur.indexOf(th.dataset.col);
    if(e.clientX>=r.left+r.width/2)j++;
    cur.splice(j,0,colDrag);
    PEEK.order=cur;save();
  }
  colDrag=null;renderPeek();
});
$("#sheetbody").addEventListener("dragend",()=>{
  colDrag=null;$$("#sheetbody th").forEach(x=>x.classList.remove("dragging","dropL","dropR"));
});
$("#sheetslice").addEventListener("click",e=>{
  const b=e.target.closest("[data-slice]");if(!b)return;
  PEEK.slice=b.dataset.slice;PEEK.row=null;renderPeek();
});
$("#sheetbody").addEventListener("click",e=>{
  const r=e.target.closest("[data-row]");if(!r)return;
  const i=+r.dataset.row;PEEK.row=PEEK.row===i?null:i;renderPeek();
});
$("#sheetfoot").addEventListener("click",e=>{
  const b=e.target.closest("[data-pk]");if(!b||!PEEK.node)return;
  const n=PLAN.nodes.find(x=>x.id===PEEK.node);if(!n)return;
  if(b.dataset.pk==="skip")setSkip(n.id,!n.skipped);
  if(b.dataset.pk==="after"){const s=succs(n)[0];         // splice INTO the chain, not beside it
    openPalette({after:n.id,before:s?s.id:null});
    toast("Pick the step to run straight after this one");}
  if(b.dataset.pk==="export")toast("Preview export prepared. Use list_flow.py for CSV output.","ok");
});

/* --- right panel clicks --- */
$("#rvbar").addEventListener("click",reviewClick);
$("#rightbody").addEventListener("click",e=>{
  const fx=e.target.closest("[data-fix]");
  if(fx){const l=LINTS[+fx.dataset.fix];if(l&&l.act){l.act();}return;}
  const gt=e.target.closest("[data-goto]");
  if(gt){selected=gt.dataset.goto;glideTo(gt.dataset.goto);render();return;}
  const wg=e.target.closest("[data-wogo]");
  if(wg){const w=WORK.find(x=>x.id===wg.dataset.wogo);
    if(w){WORK_OPEN=w.id;selected=w.step;glideTo(w.step);setPanel("work");}return;}
  const wr=e.target.closest("[data-wrun]");
  if(wr){const w=WORK.find(x=>x.id===wr.dataset.wrun);
    if(w){w.status="running";w.pct=0;
      rlog("Started a job — "+num(w.n)+" records through "+reg(PLAN.nodes.find(x=>x.id===w.step)).plain.title,"ok");
      if(mode==="run"&&!RUN.on)startRun();else render();}
    renderRight();return;}
  const wp=e.target.closest("[data-wpeek]");
  if(wp){const w=WORK.find(x=>x.id===wp.dataset.wpeek);if(w)openPeek(w.step);return;}
  const wd=e.target.closest("[data-wdrop]");
  if(wd){const i=WORK.findIndex(x=>x.id===wd.dataset.wdrop);
    if(i>=0){toast("Dropped — those "+num(WORK[i].n)+" records stay as they are");WORK.splice(i,1);}
    WORK_OPEN=null;setPanel("lint");return;}
  const lc=e.target.closest(".lint");
  if(lc&&lc.dataset.l!=null){const l=LINTS[+lc.dataset.l];
    if(l&&l.node){selected=l.node;flyTo(l.node);setPanel("inspector");}return;}
  const add=e.target.closest("[data-add]");
  if(add){if(add.classList.contains("dis"))return toast("That step needs data nothing upstream produces","warn");
    insertAt(add.dataset.add,palTarget);palTarget=null;return;}
  const act=e.target.closest("[data-act]");
  if(act){
    const n=PLAN.nodes.find(x=>x.id===selected);if(!n)return;
    const a=act.dataset.act;
    if(a==="peek")openPeek(n.id);
    if(a==="skip")setSkip(n.id,!n.skipped);
    if(a==="remove")removeNode(n.id);
    if(a==="before")openPalette({after:n.after[0],before:n.id});
    if(a==="review")setPanel("review");
    return;
  }
  if(reviewClick(e))return;
});
$("#addbtn").onclick=()=>{
  if(mode==="run"){if(RUN.on)pauseRun();else startRun();
    $("#addbtn").textContent=RUN.on?"⏸ Pause":"▶ Start the run";return;}
  openPalette(null);
};

/* --- keyboard --- */
document.addEventListener("keydown",e=>{
  const tag=(document.activeElement||{}).tagName;
  const typing=tag==="INPUT"||tag==="TEXTAREA";
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!typing){e.preventDefault();undo();}
  if(e.key==="Escape"){closeModal();
    if($("#colmenu").classList.contains("on")){$("#colmenu").classList.remove("on");return;}
    if($("#filtermenu").classList.contains("on")){$("#filtermenu").classList.remove("on");return;}
    if(PEEK.big){setSheetBig(false);return;}   // shrink before closing — one Esc, one step back
    if(closePeek())return;                       // the sheet is the frontmost thing: it goes first
    if(panel!=="lint"){selected=null;setPanel("lint");}}
  if(!typing&&e.key==="d"&&selected)openPeek(selected);
  if(!typing&&e.key==="f")fit();
});
$("#scrim").onclick=closeModal;

/* ============================================================================
   14b · PORTFOLIO — many lists in ONE app
   ----------------------------------------------------------------------------
   DECIDED 2026-07-30 (BUILD_PLAN §1): one application holds every list, with a
   switcher and a home screen — NOT one instance per list. The reasons are not
   tidiness: the engine's job registry is already keyed (list, kind) and runs
   lists concurrently, and the two locks that keep that safe (the single DB
   writer, the email-verification rate gate) are IN-PROCESS objects. A second
   process does not see them — and exceeding the verify rate returns fake
   "invalid" results, so the failure is silent bad data, not an error.

   The all-lists view is the LANDING surface. The canvas is what you get when
   you open one list. Cost of that choice, measured on the real engine DB:
   every list = 0.37s, one list = 0.28s. Two grouped scans either way.

   THE ONE BUG OF THIS PATTERN is stale per-list state bleeding across a
   switch. openList() below is the ONLY thing allowed to change which list is
   current, and it clears every per-list cache in one place. Nothing else may
   assign CURRENT.
   ============================================================================ */

/* ============================================================================
   14b · THE OPERATING LAYER — where each step stands, and starting one
   ----------------------------------------------------------------------------
   A LIST IS NOT A RUN. A run begins, proceeds and ends; a list takes days to weeks,
   stalls mid-way, sits silently, and several of its steps make progress at once. So
   there is no global Run button here: every step carries a state derived from the
   engine, you trigger steps one at a time with the count and the price stated first,
   and arming is PER STEP rather than a global mode.

   `stale` is the state a plan-only view has no word for at all, and it is the one the
   whole freshness rule is about: a step redoes a record when its inputs are newer than
   its answer.

   In a real build every number below comes from the engine over HTTP and is DERIVED on
   every poll, never stored. The local preview answers the same shapes from `mockState()`
   so the rendering code is the same code — when a real build replaces the mock with
   fetch, nothing above this line changes.

   The planner keeps its preview Run mode alongside this. That is a deliberate
   divergence, not drift: simulating a run is what a prototype is for, and the live tool
   deleted its simulation precisely because inventing progress against real work is the
   one thing this screen must never do.
   ============================================================================ */
let STATE={}, ENGINE={accepting:true}, STATE_ERR=null, STATE_T=null;
let DECLS={settled:{},closed_stages:{},list_done:null}, PROGRESS=null;

const ST_LABEL={
  never   :["never run",      "st-idle"],
  waiting :["waiting",        "st-wait"],
  starting:["starting",       "st-run"],
  running :["running",        "st-run"],
  done    :["done and current","st-done"],
  stale   :["stale",          "st-wait"],
  stopped :["stopped",        "st-bad"],
  blocked :["can't run yet",  "st-idle"],
  elsewhere:["runs elsewhere","st-idle"],
  panel   :["operate here",   "st-wait"],
  settled :["complete",       "st-settled"],
  reopened:["complete — new work","st-reopen"],
  closed  :["closed — view only","st-settled"]
};

/* --- the mock engine. One function, one shape, so swapping in a real fetch is a
       one-line change and every renderer below is untouched. --- */
const MOCK_OFFPLAN={

    waiting:424,est_cost_cents:0,cost_tier:"free",

/* a deterministic-enough spread so the same list always looks the same across reloads */
function mockStepState(l,n,i,total){
  const r=reg(n), paid=r.unit>0, g=G[n.id]||{};
  const seedN=Math.round(g.billable||g.in||0);
  /* How far along this list is comes from the SAME place the portfolio bar reads — the
     list's own stage states. Deriving it from the Run-mode simulation instead made every
     list permanently show running steps, which quietly made "Close collection" unreachable:
     only running work may block a close. Two renderings of one state, never a third. */
  const st=l.stages||[];
  const frac=st.length?st.filter(x=>x.state==="done").length/st.length:0;
  const busy=(l.jobs_running||[]).length>0;
  const pos=i/Math.max(1,total-1);
  let state, waiting=0, done=0;
  if(n.skipped){state="blocked";}
  else if(r.review){state="panel";}
  /* a list whose every stage is done has no stale tail to invent. A finished list must LOOK
     finished — that is the entire point of the completion model. */
  else if(frac>=0.999){state="done";}
  else if(pos<frac-0.15){state="done";}
  else if(pos<frac){state="stale";waiting=Math.round(seedN*0.12);}
  else if(busy&&pos<frac+0.12){state="running";done=Math.round(seedN*0.4);waiting=seedN-done;}
  else if(pos<frac+0.45){state="waiting";waiting=seedN;}
  else {state="never";waiting=0;}
  const decl=(DECLS.settled||{})[n.action];
  let fresh=0;
  if(decl){
    fresh=Math.max(0,waiting-(decl.left_records||0));
    state=fresh>0?"reopened":"settled";
    /* A reopened step is SCOPED to the new records and nothing else. Leaving `waiting` at the
       full figure put two numbers that disagree on one card — the chip counting fresh work and
       the button offering to run the whole backlog again, which is the very thing being
       declared complete. Scoped means scoped, in the count AND in the price. */
    waiting=state==="reopened"?fresh:(decl.left_records||waiting);
  }
  if((DECLS.closed_stages||{})[r.stage||stageOfPhase(r.phase)])state="closed";
  return {action:n.action, title:r.plain.title, stage:r.stage||stageOfPhase(r.phase),
    state, waiting, done, total:seedN, in_plan:true,
    cost_tier:paid?(r.unit<0.001?"pennies":"paid"):"free",
    est_cost_cents:Math.round(waiting*r.unit*100),
    armed:paid?"ask":(ARMED[n.action]||"ask"),
    settled_at:decl?decl.declared_at:null, locked:state==="closed",
    fresh:state==="reopened"?fresh:0,
    detail:state==="settled"?"You marked this complete"+(decl&&decl.left_records?" with "+num(decl.left_records)+" records knowingly set aside.":".")
          :state==="closed"?"Collection is closed for this list — this step is view-only."
          :state==="reopened"?"Complete, but new records have qualified since."
          :state==="stale"?"Its inputs are newer than its answer for some records."
          :"",
    cause:state==="waiting"?num(waiting)+" records are eligible and have never been through this step."
         :state==="stale"?"Something upstream changed, so these records must be re-tested."
         :state==="reopened"?num(fresh)+" records qualified after you called this complete — running them is scoped to those, not to the whole step."
         :""};
}
function stageOfPhase(p){
  const sd=STAGE_DEF.find(s=>s.phases.includes(p));return sd?sd.id:"build";
}
let ARMED={};
function mockState(){
  const l=curList();
  if(!l){STATE={};PROGRESS=null;return;}
  const live=PLAN.nodes.filter(n=>!isRider(n));
  const out={};
  live.forEach((n,i)=>{out[n.action]=mockStepState(l,n,i,live.length);});
  (MOCK_OFFPLAN[l.id]||[]).forEach(s=>{
    if(out[s.action])return;                 // a step drawn on the board is not "off it"
    out[s.action]=Object.assign({state:"waiting",in_plan:false,done:0,total:s.waiting,
      armed:"ask",settled_at:null,locked:false,fresh:0,detail:""},s);
  });
  STATE=out;
  /* progress: behind / (behind + ahead). Work on settled or closed steps moves OUT of the
     remaining tail and into "set aside" — that is what makes a nearly-finished list look
     nearly finished instead of visually reopening on every stray record. */
  const inPlay=Object.values(STATE).filter(s=>s.state!=="settled"&&s.state!=="closed");
  const ahead=inPlay.reduce((t,s)=>t+(s.waiting||0),0);
  const behind=Object.values(STATE).reduce((t,s)=>t+(s.done||0)+((s.state==="done"||s.state==="settled")?(s.total||0):0),0);
  const cents=inPlay.reduce((t,s)=>t+(s.est_cost_cents||0),0);
  PROGRESS={pct:Math.round(100*behind/Math.max(1,behind+ahead)),
    remaining:ahead, remaining_steps:inPlay.filter(s=>s.waiting>0).length,
    remaining_cost_cents:cents, remaining_minutes:Math.round(ahead/240),
    set_aside:setAside()};
}
async function loadState(){

     never look the same, which is why STATE_ERR is its own thing rather than an empty map. */

     and then leave you to go and find somebody to restart a process — which is how a whole day

  const fixable=!STATE_ERR&&!ENGINE.accepting&&ENGINE.reason;

/* ============================================================================
   WORK WAITING THAT THE BOARD DOES NOT MENTION
   ----------------------------------------------------------------------------
   A list that has been running for weeks arrives with a great deal of unfinished work
   and no drawing of it. The first cut of this screen showed only the steps somebody had
   drawn, so a list carrying twenty thousand actionable records rendered as an empty
   canvas — indistinguishable from a finished list. The engine knew the whole time; the
   screen never asked.

   Shown separately rather than merged into the graph on purpose. These were not designed,
   they were discovered, and every number beside them comes from the engine's own count of
   what is actionable — never from the funnel arithmetic, which would compound one step's
   survival rate into the next and quote volumes that were never real.
   ============================================================================ */
let WAIT_OPEN=false;
function outstanding(){
  /* Steps marked complete (or in a closed stage) do NOT nag from this bar — their leftover
     records were knowingly set aside, and the scoped exception on the card itself is where
     new work on a completed step gets noticed. Re-headlining it here would be exactly the
     "every 2% of progress reopens more things" failure this model exists to end. */
  return Object.values(STATE).filter(s=>!s.in_plan&&(s.waiting||0)>0
             &&s.state!=="settled"&&s.state!=="closed")
         .sort((a,b)=>(b.est_cost_cents-a.est_cost_cents)||(b.waiting-a.waiting));
}
function setAside(){
  /* Keyed on the STATE, not on "has a declaration". A REOPENED step carries a declaration too,
     and its fresh records are the one thing the model insists is still live work — counting
     them as set aside both hid them from the tail and double-counted them on the strip. */
  return Object.values(STATE).filter(s=>(s.waiting||0)>0&&(s.state==="settled"||s.state==="closed"))
         .reduce((t,s)=>t+s.waiting,0);
}
function renderWaitBar(){
  let bar=$("#waitbar");
  if(!bar){
    bar=document.createElement("div");bar.id="waitbar";
    const anchor=$("#enginebar")||document.body.firstElementChild;
    if(anchor)anchor.insertAdjacentElement("afterend",bar); else document.body.prepend(bar);
  }
  const rows=outstanding();
  /* A list called done keeps its board quiet — what was left behind is stated once, on the
     progress strip, with the numbers the call was made on. */
  if(!rows.length||DECLS.list_done||document.body.classList.contains("athome")){
    bar.className="waitbar";bar.innerHTML="";return;}
  const recs=rows.reduce((t,s)=>t+s.waiting,0), cents=rows.reduce((t,s)=>t+(s.est_cost_cents||0),0);
  const free=rows.filter(s=>!s.est_cost_cents);
  bar.className="waitbar on"+(WAIT_OPEN?" open":"");
  bar.innerHTML=`
    <div class="wbhead" data-wtoggle>
      ${ico("warn")}
      <span><b>${num(recs)} records</b> of work are waiting on this list that the board does not show
        — ${rows.length} step${rows.length===1?"":"s"}, ${cents?"$"+(cents/100).toFixed(2)+" to run all of it":"all of it free"}.</span>
      <span class="sp">
        <button class="wbtn" data-wadopt>Put them on the board</button>
        <span>${WAIT_OPEN?"▾":"▸"}</span>
      </span>
    </div>
    <div class="wbody">
      ${free.length?`<div class="wrow" style="border:0;padding-bottom:2px"><span class="wc">
        ${num(free.reduce((t,s)=>t+s.waiting,0))} of these records cost nothing to work through.</span></div>`:""}
      ${rows.map(s=>{
        const paid=s.est_cost_cents>0;
        const busy=(s.state==="running"||s.state==="starting");
        const can=!busy&&ENGINE.accepting;
        /* a judgement queue cannot be "run" — it gets a card on the board, where you judge */
        const btn=s.state==="panel"
          ?`<button class="wbtn" data-wadopt-one="${s.action}">Put on the board</button>`
          :`<button class="wbtn" data-run="${s.action}" ${can?"":"disabled"}>${busy?"Running…":"Run"}</button>`;
        return `<div class="wrow">
          <span class="wt">${s.title||s.action}</span>
          <span class="wc">${s.cause||s.detail||""}</span>
          <span class="wn">${num(s.waiting)}</span>
          <span class="wm ${paid?"paid":"free"}">${s.state==="panel"?"your call":paid?"$"+(s.est_cost_cents/100).toFixed(2):"free"}</span>
          ${btn}
        </div>`;}).join("")}
    </div>`;
}
document.addEventListener("click",async e=>{

/* ============================================================================
   THE PROGRESS STRIP — how done is this list, in one honest number.
   ----------------------------------------------------------------------------
   The definition fits in a sentence: of all the record-work this list has ever been
   asked to do, how much is behind you. New work makes the number tick DOWN slightly —
   the truth, told as a small movement instead of a funnel visually reopening. Beside
   it: the tail, priced (records, dollars, minutes), because "is the last 3% worth it"
   is a question about time and money, not percent. "Call it done" records that
   judgement with the numbers it was made on.
   ============================================================================ */
function renderProgress(){
  let bar=$("#progstrip");
  if(!bar){
    bar=document.createElement("div");bar.id="progstrip";
    const anchor=$("#waitbar")||$("#enginebar")||document.body.firstElementChild;
    if(anchor)anchor.insertAdjacentElement("afterend",bar); else document.body.prepend(bar);
  }
  if(CURRENT==null||!PROGRESS||document.body.classList.contains("athome")){
    bar.className="progstrip";bar.innerHTML="";return;}
  const p=PROGRESS, done=DECLS.list_done;
  bar.className="progstrip on"+(done?" isdone":"");
  if(done){
    const left=done.left_records||0, lc=done.left_cost_cents||0;
    bar.innerHTML=`
      <span class="pdone">${ico("check")} <b>Called done</b> on ${String(done.declared_at||"").slice(0,10)}
        ${left?`— ${num(left)} records knowingly left on the table${lc?" ($"+(lc/100).toFixed(2)+" to have run them)":""}.`:"— nothing left behind."}
        ${done.note?`<i>“${done.note}”</i>`:""}</span>
      <button class="wbtn" data-undeclare-list title="Take the done call back and put the board back in play">Reopen this list</button>`;
    return;
  }
  const pctTxt=p.pct==null?"":`<b class="ppct">${p.pct}%</b>`;
  const tail=p.remaining
    ? `${num(p.remaining)} records left across ${p.remaining_steps} step${p.remaining_steps===1?"":"s"}`
      +(p.remaining_cost_cents?` · $${(p.remaining_cost_cents/100).toFixed(2)}`:" · free")
      +(p.remaining_minutes>=60?` · ~${Math.round(p.remaining_minutes/60)}h`:p.remaining_minutes?` · ~${p.remaining_minutes}m`:"")
    : "nothing is waiting anywhere";
  bar.innerHTML=`
    <span class="pmeter" title="Of all the record-work this list has ever been asked to do, how much is behind you. It can tick down slightly when new work appears — that is the truth, told small.">
      ${pctTxt}<span class="pbar"><i style="width:${Math.max(0,Math.min(100,p.pct||0))}%"></i></span></span>
    <span class="ptail">${tail}${p.set_aside?` · <span class="paside" title="Records on steps marked complete or behind closed collection — knowingly set aside, not forgotten.">${num(p.set_aside)} set aside</span>`:""}</span>
    <button class="wbtn" data-declare-list
      title="Decide the remaining tail is not worth its time and money, record that with today's numbers, and ship the list as it stands.">Call it done</button>`;
}
document.addEventListener("click",async e=>{

        +(p.remaining_cost_cents?` (about $${(p.remaining_cost_cents/100).toFixed(2)} to have run them).`:" (all free work)."):`Nothing is waiting anywhere.`,
      `Nothing is deleted and nothing runs — the board goes quiet, unattended steps stop, and you can reopen it any time.`];

/* Declarations are the ONE piece of step status that is STORED. "This is complete" is a
   human call; everything else on this screen is derived on every poll. Cleared by stamping,
   never by deleting, so the history of the call survives the reopen. */
async function declare(scope,key,on,note){
  const today=new Date().toISOString().slice(0,10);
  if(scope==="list"){
    DECLS.list_done=on?{declared_at:today,note,
      left_records:(PROGRESS||{}).remaining||0,
      left_cost_cents:(PROGRESS||{}).remaining_cost_cents||0}:null;
  }else if(scope==="stage"){
    if(on)DECLS.closed_stages[key]={declared_at:today};
    else delete DECLS.closed_stages[key];
  }else{
    if(on)DECLS.settled[key]={declared_at:today,left_records:(STATE[key]||{}).waiting||0};
    else delete DECLS.settled[key];
  }
  toast(on?"Recorded.":"Reopened.","ok");
  await loadState();
}
function stateChip(n){
  const s=STATE[n.action];if(!s)return "";
  const [lab,cls]=ST_LABEL[s.state]||["",""];
  const extra=s.state==="waiting"?" "+num(s.waiting)

async function startStep(action,btn){

  const paid=s.cost_tier&&s.cost_tier!=="free";
  if(paid&&!confirm(
      "Start “"+(s.title||action)+"” on "+num(s.waiting)+" records?\n\n"+
      "This will spend about $"+((s.est_cost_cents||0)/100).toFixed(2)+".\n"+
      "Nothing is spent until you say yes."))return;
  if(btn){btn.disabled=true;btn.textContent="Starting…";}
  s.state="running";s.done=0;s.total=s.waiting;

  await loadState();
}

/* the control that replaces "Run": one step, with what it is about to do stated first */
function runControlHTML(n){
  const s=STATE[n.action];
  if(!s)return "";
  if(s.state==="panel")
    return finishControlHTML(n);
  if(s.state==="elsewhere")
    return `<div class="runbox"><div class="rn">${s.detail}</div></div>`;
  /* --- the declaration states. closed = the hard line: view-only, no controls at all.
     settled = quietly complete. reopened = complete BUT new work — the one card on the
     board allowed to ask for attention, scoped to its own count and cause. --- */
  if(s.state==="closed")
    return `<div class="runbox"><div class="rn">${s.detail}</div></div>`;
  if(s.state==="settled")
    return `<div class="runbox">
      <div class="rn">${s.detail}</div>
      <div class="rn why"><a href="#" data-unsettle="${n.action}">Not complete after all — put it back in play</a></div>
    </div>`;
  const paid=(s.cost_tier&&s.cost_tier!=="free");
  const money_=s.est_cost_cents?("$"+(s.est_cost_cents/100).toFixed(2)):"free";
  const busy=(s.state==="running"||s.state==="starting");
  const can=s.waiting>0&&!busy&&ENGINE.accepting&&!DECLS.list_done;
  const why=!ENGINE.accepting?"The pipeline is not accepting new work."
          :DECLS.list_done?"This list was called done — reopen it to run more work."
          :busy?"It is already going."
          :!s.waiting?"Nothing is waiting for this step.":"";
  if(s.state==="reopened")
    return `<div class="runbox reob">
      <div class="rn">${s.detail}</div>
      ${s.cause?`<div class="rn why">${s.cause}</div>`:""}
      <button class="runbtn${paid?" paid":""}" data-run="${n.action}" ${can?"":"disabled"}>
        ${busy?"Running…":"Run this step"}<b>${num(s.waiting)} records · ${money_}</b>
      </button>
      ${why?`<div class="rn why">${why}</div>`:""}
      <div class="rn why">Running them keeps the step complete — or
        <a href="#" data-unsettle="${n.action}">put it fully back in play</a>.</div>
    </div>`;
  /* a step with nothing left, or one you consider finished, can be CALLED complete — after
     which it goes quiet and gray, and only genuinely new work may speak, scoped, on this card */
  const settleable=!busy&&(s.state==="done"||s.state==="waiting"||s.state==="stopped"||s.state==="never");
  return `<div class="runbox">
    ${s.cause?`<div class="rn">${s.cause}</div>`:""}
    <button class="runbtn${paid?" paid":""}" data-run="${n.action}" ${can?"":"disabled"}>
      ${busy?"Running…":"Run this step"}
      ${s.waiting?`<b>${num(s.waiting)} records · ${money_}</b>`:""}
    </button>
    ${why?`<div class="rn why">${why}</div>`:""}
    <label class="armrow" title="${paid?"A step that spends money needs a ceiling before it can run unattended.":"Free work can be left to run whenever there is any."}">
      <input type="checkbox" data-arm="${n.action}" ${s.armed==="auto"?"checked":""} ${paid?"disabled":""}>
      <span>${paid?"Always ask me — this step spends money":"Run it whenever there is work"}</span>
    </label>
    ${settleable?`<div class="rn why"><a href="#" data-settle="${n.action}"
      title="Gray this step out as finished. If new records ever qualify, it re-lights scoped to just them — never the whole board.">Mark this step complete</a></div>`:""}
  </div>`;
}

/* ============================================================================
   PLAN PERSISTENCE
   ----------------------------------------------------------------------------
   The plan is a DESIGN and it is saved as one. Progress, results and spend are not saved
   here — they belong to the engine and are observed, never stored twice. Derived steps
   (the free check before the paid one, the restore point, the merge) are NOT sent: the
   server recomputes them, so a rule added later reaches a plan drawn earlier instead of
   being frozen out of it.
   ============================================================================ */
let SAVE={state:"idle", t:null, sig:null, err:null, at:null};
/* Only what YOU decided. Derived steps are excluded, so re-deriving them can never look
   like an edit and trigger a pointless save. */
function planSig(){
  return JSON.stringify({n:PLAN.name,e:PLAN.entry,b:PLAN.budget,br:PLAN.brief||"",
    a:PLAN.answers||[],
    nodes:(PLAN.nodes||[]).filter(n=>!n.auto).map(n=>[n.id,n.action,
      (n.after||[]).slice().sort(),n.params||null,!!n.skipped,n.why||null])});
}
function renderSaveBadge(){
  const b=$("#savebadge"); if(!b)return;
  const S=SAVE.state;
  const txt={idle:"", dirty:"unsaved changes", saving:"saving…",
             saved:"saved"+(SAVE.at?" "+SAVE.at:""), error:"NOT SAVED"}[S]||"";
  b.textContent=txt||" ";
  b.className="badge"+(S==="error"?" bad":S==="saved"?" ok":"");
  b.title=S==="error"
    ? "Your last change was NOT saved: "+(SAVE.err||"unknown reason")+
      ". Leave this page open — it will keep retrying."
    : S==="saved" ? "This plan is stored. Progress and results are not stored here; they live in the pipeline."
    : "";
}
async function savePlanNow(){
  if(CURRENT==null)return;
  const sig=planSig();
  /* never bring a plan record into existence just because someone looked at a list */
  if(!SAVE.sig&&!(PLAN.nodes||[]).filter(n=>!n.auto).length)return;
  SAVE.state="saving";renderSaveBadge();
  SAVE.sig=sig;SAVE.state="saved";SAVE.err=null;
  SAVE.at=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  renderSaveBadge();
}
function scheduleSave(){
  if(CURRENT==null)return;
  if(planSig()===SAVE.sig){if(SAVE.state==="dirty"){SAVE.state="saved";renderSaveBadge();}return;}
  SAVE.state="dirty";renderSaveBadge();
  clearTimeout(SAVE.t);SAVE.t=setTimeout(savePlanNow,900);
}
/* A list with no saved plan opens on an EMPTY canvas carrying its real name, its real entry
   point and its real size — not on a fabricated funnel. An invented graph in front of real
   numbers is the one failure this screen cannot recover from: you would plan against it. */
function emptyPlan(l){
  return {name:l.name, entry:l.entry||"accounts", seed:l.total||0, budget:0,
          brief:"", answers:[], nodes:[]};
}

/* ============================================================================
   14c · THE PORTFOLIO — one row per list, and what each one is waiting for
   ----------------------------------------------------------------------------
   The first cut of this screen was five lines a list. It read fine and answered nothing:
   the question you actually arrive with is "which of these needs me, and what for". So
   the card now carries the funnel, the live job, the people numbers, the collection
   scope, the spend, and — the part nothing had ever surfaced — the WORK ALREADY WAITING.
   A list carrying twenty thousand actionable records used to look exactly like a
   finished one.

   The bar and the canvas are two renderings of ONE state. Never invent a third.
   ============================================================================ */

/* the ten funnel segments the portfolio card draws, from real counts */
function funnelBar(l){
  const c=l.counts||{}, b=l.backlogs||{}, people=l.entry_point==="people";
  const seg=(have,want)=>!want?"todo":have>=want?"done":have>0?"run":"open";
  const waiting=k=>(b[k]||0)>0;
  return [
    seg(c.total,c.total),                                   // collected
    seg(c.total-(c.cleared||0),c.total),                    // free cuts
    people?"done":seg(c.scraped,c.kept),                    // websites found
    people?"done":seg(c.scraped,c.kept),                    // sites read
    seg(c.kept,c.total),                                    // judged
    l.locked?"done":seg(c.locked,c.kept),                   // locked
    seg(c.named,c.kept),                                    // people found
    waiting("email_reharvest")?"attn":seg(c.with_email,c.named),
    seg(c.verified,c.with_email),                           // checked
    seg(0,1)                                                // handed off
  ];
}

let PORTFOLIO_TOTALS={};

   run?" would then skip it on a list that has never been cleaned. Not cosmetic. */

/* --- the test-drives: small measured spends that make the big spend honest --- */
/* HOW DEEP IS DEEP ENOUGH? The sweep has two depth settings and guesses at both: how many pages of
   results to take from one map viewport, and how many viewports a city gets. The crawl does stop
   itself when a search comes back empty, but a page returning two businesses costs the same as one
   returning twenty, so the CAP matters — and cost is roughly linear in it across every city in the
   country. This walks both curves deliberately past the useful point to find where each flattens. */
const DEPTH_PAGES = 8;
function depthQuote(b){
  const n=colTerms().length, c=colCities().length;
  if(!n||!c) return "";
  return `$${((c*25*n*DEPTH_PAGES*0.3)/100).toFixed(2)}`;
}
function renderDepth(b){
  const r=b.depth||{};
  if(r.error) return `<div class="cnote bad">${esc(r.error)}</div>`;
  const pg=r.page_flatten, pin=r.pin_flatten;
  const arr=(r.page_avg||[]).map((v,i)=>`p${i+1}: ${v}`).join(" · ");
  return `${b.depthSaved?`<div class="cnote sub">Your depth test from <b>${probeWhen(b.depthSaved.at)}</b>${
      b.depthSaved.cost_cents?` — it cost $${(b.depthSaved.cost_cents/100).toFixed(2)}`:""}. Kept.</div>`:""}
    ${renderScreenNote(r)}
    <div class="cnote ${pg?"ok":""}">
      <b>${pg?`Searching stops paying after page ${pg}.`:`Results were still coming in at page ${r.max_page} — this category runs deeper than the test went.`}</b>
      <span style="display:block;margin-top:4px">${pg
        ? `The sweep currently takes up to ${DEPTH_PAGES}. ${pg<DEPTH_PAGES
            ? `Capping at ${pg} would cut roughly <b>${Math.round(100*(DEPTH_PAGES-pg)/DEPTH_PAGES)}%</b> off the searching, everywhere.`
            : `That matches what it already does, so there is nothing to save here.`}`
        : `Leave the depth where it is; lowering it would start losing businesses.`}</span>
      <span style="display:block;margin-top:6px;font-size:12px;opacity:.85">
        New businesses appearing on each page, averaged over the sample cities — ${esc(arr)}.
        ${pin?`Within a city, adding viewports stops paying after the ${pin}${pin===1?"st":pin===2?"nd":pin===3?"rd":"th"} — the crawl already stops itself around there.`
             :`Every viewport a city was given kept finding businesses, so the grid is not too fine.`}</span>
      ${pg&&pg<DEPTH_PAGES?`<button class="nbtn sm" id="cdepthuse" style="margin-top:8px">
        ${b.pages===pg?`✓ Sweep set to ${pg} pages — click to undo`:`Use ${pg} pages on the sweep`}</button>`:""}
    </div>`;

/* HOW FINE DOES THE GRID NEED TO BE FOR *THIS* CATEGORY?
   Coverage is normally decided by population density. But what actually forces a fine grid is the
   cap of about 120 places per viewport, and that only bites for a category that is dense on the
   ground. For a sparse one, a coarser grid covers the same city in far fewer, bigger viewports with
   nothing missed — a cut in the viewports you PLAN, before the crawl's own stopping trims what is
   left, applied to every city. Opt-in, because it is a coverage judgement and should be yours. */
function renderGridRec(b){
  const s=b.samp||{}, z=s.zoom_rec;
  if(!z && s.peak_per_pin==null) return `<div class="cnote sub">Grid: this sample ran before the
    tool started keeping its grid recommendation, so there is no answer either way. Re-run the
    sample to find out whether a coarser grid would do.</div>`;
  if(!z) return `<div class="cnote sub">Grid: this category is dense enough that the standard
    fine grid is the right call — no coarser option was safe.</div>`;
  const on=(b.zoom===z.recommended_zoom);
  return `<div class="cnote ${on?"ok":""}" style="margin-top:8px">
    <b>This category is sparse enough to use a coarser grid.</b>
    <span style="display:block;margin-top:4px">Covering each city in bigger viewports would plan
      <b>${num(z.pins_recommended)}</b> instead of <b>${num(z.pins_default)}</b> — about
      <b>${z.pin_cut_pct}% fewer</b>, and you pay per viewport. Nothing is missed: the busiest spot
      in your sample returned ${num(z.peak_per_pin)} places, well under the ~120 a single viewport
      can return before the map stops handing them over.</span>
    <button class="nbtn sm" id="czoom" style="margin-top:8px">
      ${on?"✓ Using the coarser grid — click to go back to the fine one":"Use the coarser grid"}</button>
  </div>`;
}

/* DID THE SWEEP QUIETLY COME BACK SHORT? The map stops handing over results at roughly 120 places
   per viewport. A viewport that hits the ceiling returns a full page and simply stops — no error
   and no warning — so a busy area comes back short and the list still looks finished. The scan is
   FREE: it reads the finished crawl's own log and makes no searches. Only the repair costs
   anything, and only for the handful of spots that were actually cut off. */
function renderClipCheck(b){
  /* only a FINISHED sweep can be checked — there is nothing to read otherwise */
  if(!(b.builds||[]).some(x=>!x.running)) return "";
  const a=b.clip;
  const body = !b.clipOpen ? "" : `<div class="cfoldb">
    ${b.clipMsg?`<div class="cnote">${b.clipMsg}</div>`:""}

      ? `<div class="cnote ok">Nothing was cut off. No viewport came close to the limit, so the
           sweep got everything it could see.</div>`
      : `<div class="cnote warn"><b>${num(a.pins.length)} spots came back full to the brim</b>, which
           usually means there were more businesses there that you never got.
         <span style="display:block;margin-top:4px">Re-searching just those spots, split into
           smaller areas so nothing is hidden behind the limit, would cost about
           <b>$${((a.estimate&&a.estimate.est_cost)||0).toFixed(2)}</b>${

/* IS THE RURAL SLICE WORTH ITS PRICE? The scope quotes split the census business count across
   scopes by POPULATION, which assumes a town of 4,000 holds as many of these businesses per head
   as a city does. For some verticals that is roughly true and for others it is nonsense, and the
   difference is hundreds of dollars on the sweep. So: measure a random sample of small towns,
   project it across the tier, and cap the projection at what the census says can physically exist
   out there. Towns sitting next to cities the bigger scopes already crawl are excluded — their
   businesses arrive either way, and counting them would inflate the case for buying the tier. */
const TAIL_TOWNS = 24;
function tailQuote(b){
  const n = colTerms().length||1;
  return `$${((TAIL_TOWNS*n*2*0.3)/100).toFixed(2)}`;
}
/* WHERE the small-town test looks. Sampling small towns at random across the country answers
   "is the small-town tier worth buying nationally"; it cannot answer "is small-town Pennsylvania
   worth buying", which is the live question the moment the geography above names states. Sample
   and projection move together - 24 towns drawn from one state are projected across that state's
   own small towns, never across the national 17,517. */
function tailStates(b){
  const picked = statesPicked(b);
  const v = b.tailSt;
  if(v===null||v===undefined) return picked.length?picked.slice():[];   // follow the geography
  if(v==="") return [];                                                  // deliberately everywhere
  if(v==="__geo__") return picked.slice();
  return [v];
}
function stateName(b,code){ return ((b.geo&&b.geo.state_names)||{})[code]||code; }
function tailScopeWord(b){
  const st = tailStates(b);
  if(!st.length) return "small towns anywhere in the US";
  if(st.length===1) return `small towns in ${stateName(b,st[0])}`;
  return `small towns across ${st.length} states`;
}
/* Name the geography a finished run actually tested, from the run itself - never from what the
   dropdown says now. A saved result reopened a day later must describe the ground it covered. */
function tailPlace(b,r,bare){
  const st=(r.states||[]);
  if(!st.length) return bare?"in the country":"The rural tier";
  const names = st.length<=3 ? st.map(x=>stateName(b,x)).join(" and ") : `${st.length} states`;
  return bare ? `in ${names}` : `Small-town ${names}`;
}
function renderTailScope(b){
  const g=b.geo; if(!g) return "";
  const picked=statesPicked(b), cur=tailStates(b);
  const all=Object.keys((g.cities_by_state)||{}).sort();
  const sel = !cur.length ? ""
            : (picked.length>1 && cur.length===picked.length && cur.every(x=>picked.indexOf(x)>=0)) ? "__geo__"
            : cur[0];
  return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)">
    Look in
    <select id="ctailst" onchange="COL.tailSt=this.value;$('#collectbox').innerHTML=renderCollect()">
      <option value="" ${sel===""?"selected":""}>anywhere in the US</option>
      ${picked.length>1?`<option value="__geo__" ${sel==="__geo__"?"selected":""}>the ${picked.length} states I picked above</option>`:""}
      ${all.map(x=>`<option value="${x}" ${sel===x?"selected":""}>${esc(stateName(b,x))}</option>`).join("")}
    </select></label>`;
}

function renderTailVerdict(b){
  const r = b.tail||{};
  if(r.error) return `<div class="cnote bad">${esc(r.error)}</div>`;
  const proj = r.projected_tail, lo = r.projected_low, hi = r.projected_high;
  /* the quoted rural cost is a NATIONAL figure. Dividing it by a single state's projection
     would read as a per-business price and be wrong by however many states were left out, so
     the money verdict only runs when the test itself was national. */
  const scoped = (r.states||[]).length>0;
  const sc = scoped ? null : ((b.est&&b.est.scopes)||[]).find(s=>/rural/i.test(s.name||""));
  const cost = sc && sc.cost;
  const per = (cost && proj) ? cost/proj : null;
  const verdict = scoped
    ? {cls:"", say:`That is this geography's small towns only - the ones the curated city list
        skips. Widen the test to the whole country if you want the national rural price.`}
    : per==null
    ? {cls:"", say:`Price the sweep and this will also say what each of those businesses costs you.`}
    : per<=0.10
    ? {cls:"ok", say:`That works out at about $${per.toFixed(2)} per business — in line with the rest
        of the sweep, so the rural tier is worth buying if you want the coverage.`}
    : {cls:"mut", say:`That works out at about $${per.toFixed(2)} per business, well above what the
        towns and cities cost you. The rural tier is expensive ground — probably leave it.`};
  return `${b.tailSaved?`<div class="cnote sub">Your rural test from <b>${probeWhen(b.tailSaved.at)}</b>${
      b.tailSaved.cost_cents?` — it cost $${(b.tailSaved.cost_cents/100).toFixed(2)}`:""}. Kept.</div>`:""}
    ${renderScreenNote(r)}
    <div class="cnote ${verdict.cls}">
      <b>${scoped?esc(tailPlace(b,r)):"The rural tier"} looks like about ${num(proj)} businesses${
        lo!=null&&hi!=null&&hi>lo?` (somewhere between ${num(lo)} and ${num(hi)})`:""}.</b>
      <span style="display:block;margin-top:4px">${verdict.say}</span>
      <span style="display:block;margin-top:6px;font-size:12px;opacity:.85">
        Measured, not assumed: ${num(r.n_towns)} small towns picked at random and actually searched,
        averaging <b>${r.avg_per_town}</b> each${r.nonzero_pct!=null?`, and ${r.nonzero_pct}% of them
        had at least one`:""}. ${r.n_covered?`${num(r.n_covered)} of the sampled towns sit next to
        cities the sweep already covers, so they were left out — their businesses come to you either
        way.`:""} ${r.tail_towns?`Projected across the <b>${num(r.tail_towns)}</b> small towns
        ${scoped?esc(tailPlace(b,r,true)):"in the country"} that the curated city list skips.`:""} ${r.capped?`<b>Capped:</b> the raw projection came to ${num(r.projected_raw)}, which
        is more than the census says exists outside your target cities, so the census figure is used
        instead.`:""}</span>
      ${(r.examples||[]).length?`<div class="wsamp" style="margin-top:8px"><b>Towns sampled:</b>
        ${r.examples.slice(0,8).map(x=>esc(`${x.city} (${x.n})`)).join(" · ")}</div>`:""}
    </div>`;
}

/* PICK THE TERMS YOURSELF. The head-to-head used to be read-only: it named a recommended set and
   offered one all-or-nothing button, so the only choices were "all of them" or "the ones it
   picked". Cost is LINEAR in term count, so which terms you keep is the single biggest lever on
   the price of the sweep — that decision has to be yours, per term. Ticking a box only edits the
   terms box; nothing is spent until the sweep is priced and started. */
/* Mock stand-in for what a real comparison measures: which terms found each business. Deterministic
   (no randomness), first term catches the most, and every business was found by at least one term. */
function mockTermBits(terms,n){
  const share=[720,560,430,330,250];
  const bits=[];
  for(let k=0;k<n;k++){
    let m=0;
    terms.forEach((t,i)=>{
      if(((k*7919+i*104729)%1000) < share[Math.min(i,share.length-1)]) m|=(1<<i);
    });
    bits.push(m||1);
  }
  return bits;
}
function ttPicked(b){
  const all = (b.tt&&b.tt.per_term||[]).map(t=>t.term);
  if(b.ttPick) return all.filter(t=>b.ttPick.indexOf(t)>=0);
  const rec = (b.tt&&b.tt.recommended_terms)||all;      // default to what it recommends
  return all.filter(t=>rec.indexOf(t)>=0);
}
/* How many distinct businesses a chosen set of terms actually found. The comparison sends one
   number per business whose bits say which terms found it, so this is a count, not an estimate.
   It cannot be derived from the per-term totals: those overlap, so they cannot be summed, and
   summing the dropped terms' "no other term found" counts UNDERSTATES the loss — a business found
   by two dropped terms but no kept one is in nobody's unique count. Returns null when the bits are
   absent, and the caller then says the figure is a floor rather than passing it off as the number. */
function ttCoverage(b, picked){
  const tt=b.tt||{}, order=tt.terms_order, bits=tt.coverage_bits;
  if(!order||!bits||!picked.length) return null;
  let mask=0;
  picked.forEach(t=>{ const i=order.indexOf(t); if(i>=0) mask|=(1<<i); });
  if(!mask) return null;
  let n=0;
  for(let k=0;k<bits.length;k++) if(bits[k]&mask) n++;
  return n;
}
function renderTermPicker(b){
  const per = (b.tt&&b.tt.per_term)||[];
  if(!per.length) return "";
  const picked = ttPicked(b);
  const rec = (b.tt&&b.tt.recommended_terms)||[];
  const union = b.tt.union_total||0;
  const cov = ttCoverage(b, picked);
  const floorLost = per.filter(t=>picked.indexOf(t.term)<0).reduce((n,t)=>n+(t.unique||0),0);
  const lost = cov==null ? floorLost : Math.max(0, union-cov);
  const exact = cov!=null;
  const same = picked.length===per.length;
  return `<div class="ttpick">
    ${per.map(t=>`<label class="ttrow ${picked.indexOf(t.term)>=0?"on":""}" data-ttpick="${esc(t.term)}">
      <input type="checkbox" ${picked.indexOf(t.term)>=0?"checked":""}>
      <span class="ttn">${esc(t.term)}${rec.indexOf(t.term)>=0?` <span class="ttrec">suggested</span>`:""}</span>
      <span class="ttc">${num(t.kept)} found · ${num(t.unique)} that no other term found</span>
    </label>`).join("")}
    <div class="cnote sub" style="margin-top:2px">
      ${picked.length?`Keeping <b>${picked.length} of ${per.length}</b> terms — the sweep then costs
        about <b>${Math.round(100*picked.length/per.length)}%</b> of what all ${per.length} would,
        because you pay per term.
        ${exact?`In the sample ${picked.length===1?"this term finds":"these find"} <b>${num(cov)}</b> of the
          ${num(union)} businesses${lost?`, so you give up <b>${num(lost)}</b>`:` — the full catch`}.`
         :lost?`Dropping the rest gives up <b>at least ${num(lost)}</b> businesses${union?` of the
           ${num(union)}`:""} — the exact figure needs a fresh comparison.`
          :`None of the unticked terms found anything on their own.`}`
       :`Nothing ticked. Tick at least one term.`}</div>
    <button class="nbtn sm" id="cttuse" ${picked.length?"":"disabled"}>
      ${same?`Use all ${per.length} terms`:`Use just ${picked.length===1?"this term":`these ${picked.length} terms`}`}</button>
    <span class="cnote sub" style="display:block">This only fills in the terms box above. Price the
      sweep afterwards and the quote follows whatever is in that box.</span>
  </div>`;
}

/* WHERE THE SWEEP GOES — the part that decides the price.
   The old radio list mixed two different things: ready-made COMBINATIONS ("target list", "full
   US", "rural only") sitting alongside individual SIZE BANDS, with no way to tell which was which
   and no way to take two bands at once. Every seeded city sits in exactly ONE band — they
   partition the country — so a tick-box per band is not just friendlier, it is well defined, and
   the crawler already accepts "everything except these bands".
   States get regions you can click to light up all their states and then toggle individually,
   with the city count on every chip: that is what actually makes a sweep affordable. */
const SEG_HELP = {
  "Major Market": "the biggest metros",
  "Large City / Major Suburb": "large cities and the substantial suburbs around them",
  "Mid-sized City": "mid-sized cities",
  "Small City / Strong Town": "small cities and larger towns",
  "Below Target Cutoff": "everything smaller — small towns and rural places",
};
function segsPicked(b){
  /* default: the curated list — every band except the rural tail. That is what "Target list"
     used to mean, spelled out instead of hidden behind a label. */
  if(b.segs) return b.segs;
  const all=(b.geo&&b.geo.segment_order)||[];
  return all.filter(s=>s!=="Below Target Cutoff");
}
function statesPicked(b){ return b.states2||[]; }
function renderWhere(b){
  const g=b.geo;
  if(g===null) return `<div class="skel">Loading the map of the country…</div>`;
  if(!g) return "";
  const segs=segsPicked(b), st=statesPicked(b);
  const cbs=(g.cities_by_state)||{}, cbg=(g.cities_by_segment)||{};
  const regions=(g.regions)||[], sbr=(g.states_by_region)||{};
  const nCities=(g.segment_order||[]).filter(s=>segs.indexOf(s)>=0)
    .reduce((n,s)=>n+(cbg[s]||0),0);
  const regionOn=r=>(sbr[r]||[]).length && (sbr[r]||[]).every(x=>st.indexOf(x)>=0);
  return `<div class="whbox">
    <div class="cshead">Where should it look?</div>

    <div class="whlab">Size of place — tick any combination. Every city is in exactly one of these,
      so there is no double-counting.</div>
    <div class="segs">
      ${(g.segment_order||[]).map(s=>`<label class="seg ${segs.indexOf(s)>=0?"on":""}" data-seg="${esc(s)}">
        <input type="checkbox" ${segs.indexOf(s)>=0?"checked":""}>
        <span class="segn">${esc(s)}<span class="segh">${esc(SEG_HELP[s]||"")}</span></span>
        <span class="segc">${num(cbg[s]||0)}</span>
      </label>`).join("")}
    </div>
    <div class="crow" style="margin:2px 0 8px">
      <button type="button" class="linkish" data-segpre="curated">Cities only</button>
      <button type="button" class="linkish" data-segpre="all">Everything</button>
      <button type="button" class="linkish" data-segpre="rural">Just the small places</button>
    </div>

    <div class="whlab">States — click a region to take all of it, then add or drop individual
      states. Leave everything unticked for the whole country.</div>
    <div class="crow" style="margin-bottom:6px">
      ${regions.map(r=>`<button type="button" class="rgn ${regionOn(r)?"on":""}" data-rgn="${esc(r)}">${esc(r)}</button>`).join("")}
      ${st.length?`<button type="button" class="linkish" data-rgn="__none__">Clear</button>`:""}
    </div>
    ${regions.map(r=>`<div class="stgrid">
      ${(sbr[r]||[]).map(x=>`<button type="button" class="stchip ${st.indexOf(x)>=0?"on":""}" data-st="${x}"
        title="${esc((g.state_names||{})[x]||x)} — ${num(cbs[x]||0)} cities">${x}
        <span>${num(cbs[x]||0)}</span></button>`).join("")}
    </div>`).join("")}

    <div class="cnote ${segs.length?"":"bad"}" style="margin-top:8px">
      ${segs.length
        ? `<b>${st.length?`${st.length} state${st.length===1?"":"s"}`:"The whole country"}</b>,
           ${segs.length===(g.segment_order||[]).length?"every size of place":`${segs.length} of
           ${(g.segment_order||[]).length} sizes`}. That is up to <b>${num(nCities)}</b> cities
           before the state filter${st.length?" narrows it further":""} — price it to see the real
           number and the cost.`
        : `Tick at least one size of place.`}
    </div>
  </div>`;
}


/* A TEST-DRIVE COSTS MONEY, SO ITS RESULT IS KEPT. The panel's results used to live only in the
   page, which meant leaving the list and coming back threw away work that had already been paid
   for, and the only route back to the number was to buy it a second time. A kept run says WHEN it
   ran and what it cost, so it can never be mistaken for one that just finished. */
function nowStamp(){ return new Date().toISOString().slice(0,19).replace("T"," "); }
function probeWhen(s){
  if(!s) return "";
  const d = new Date((s||"").replace(" ","T")+"Z");
  if(isNaN(d)) return esc(s);
  return d.toLocaleString(undefined,{weekday:"short",day:"numeric",month:"short",
                                     hour:"numeric",minute:"2-digit"});
}

/* WHAT CAME BACK vs WHAT COUNTS. A map sweep returns the target businesses AND whatever else sits
   near them — apartment complexes, home-health agencies, a furniture bank. Counting all of it makes
   a term look productive for dragging in the wrong kind of business, and makes "how many of these
   are new to us" a comparison between unlike things. Every number on this panel is computed AFTER
   the finds are judged against the list's own description, and this line shows that judging so the
   drop is auditable rather than invisible. */
function renderScreenNote(tt){
  const s = tt.screen;
  if(!s) return "";
  if(s.error) return `<div class="cnote bad">Could not check whether these are really what you are
    after, so the numbers below count everything the map returned — treat them as a ceiling.
    (${esc(s.error)})</div>`;
  const c = s.counts||{};
  const eg = (s.off_examples||[]).slice(0,4)
    .map(x=>esc(x.name+(x.category?` (${x.category})`:""))).join(" · ");
  return `<div class="cnote mut" style="margin-bottom:10px">
    <b>${num(c.total)} businesses came back from the map · ${num(c.kept)} are actually what you are
      after.</b>
    <span style="display:block;margin-top:4px">The other ${num(c.dropped)} were something else and
      are not counted anywhere below.${eg?` For example: ${eg}.`:""}</span>
    <span style="display:block;margin-top:6px;font-size:12px;opacity:.85">Judged against your own
      description of the list${s.target?` — “${esc(s.target)}”`:""}. Cost about
      $${(s.cost||0).toFixed(2)}. Change that description in the box above to change what counts.
      ${c.unscreened?`<b>${num(c.unscreened)} could not be judged and were kept</b>, so the
        figures below are slightly generous.`:""}</span>
  </div>`;
}

function colCities(){
  return (COL.cities||"").split("\n").map(x=>{
    const m=x.trim().match(/^(.+?),\s*([A-Za-z]{2})$/);
    return m?[m[1].trim(),m[2].toUpperCase()]:null;
  }).filter(Boolean);
}
function colTerms(){
  return COL.terms.split(/\n|,/).map(x=>x.trim()).filter(Boolean);
}
function colReadInputs(){
  const d=$("#cdesc"), t=$("#cterms"), s=$("#cstates"), c=$("#ccities"), i=$("#cicp");
  if(d)COL.desc=d.value; if(t)COL.terms=t.value; if(s)COL.states=s.value;
  if(c)COL.cities=c.value; if(i)COL.icp=i.value;
}
/* live status line inside the test-drive fold while a job runs */
function colTd(msg){
  COL.tdMsg=msg;
  const box=$("#collectbox");
  if(box)box.innerHTML=renderCollect();
}
/* In a real build this polls a background job by id. The contract that matters is the
   FAILURE one: a job that vanished (the service restarted) must not read as a job that is
   still working, or you wait forever on nothing. */
async function colPollJob(jid,opts){
  const maxIter=(opts&&opts.maxIter)||90;
  for(let i=0;i<maxIter;i++){
    await new Promise(r=>setTimeout(r,120));
    if(opts&&opts.onTick)opts.onTick(i);
    if(i>=(opts&&opts.ticks||6))return (opts&&opts.result)||{};
  }
  throw new Error("it did not finish in time — it may still be running on the collector side");
}
/* ---- the live collection strip -------------------------------------------------------------
   Its own poll, deliberately separate from the Maps panel's. The panel's tick reschedules itself
   INSIDE "if (the panel is open)", so it stops the moment you navigate away - which is exactly
   when you most need to know that a paid, hours-long crawl is still running. This one starts at
   load and never stops. */
let LIVE = {t:null};

function tickLive(){
  clearTimeout(LIVE.t);
  let anyRunning = false;
  for(const b of (COL.builds||[])){
    if(!b.running) continue;
    anyRunning = true;
    /* the demo's stand-in for a real crawl reporting in: searches spent creep up, and the towns
       and businesses follow from them */
    b.spent_calls = Math.min(b.est_calls||1, (b.spent_calls||0) + Math.round((b.est_calls||1)*0.0004));
    const frac = (b.est_calls ? b.spent_calls/b.est_calls : 0);
    const total = (b.completed||0) + (b.pending||0);
    b.completed = Math.round(total*frac);
    b.pending = total - b.completed;
    b.places = Math.round(frac * (b.est_places||0));
    if(b.spent_calls >= (b.est_calls||1)) b.running = false;
  }
  const el = document.getElementById("livecrawl");
  if(el) el.innerHTML = renderLive();
  LIVE.t = setTimeout(tickLive, anyRunning ? 2000 : 15000);
}

function hhmm(mins){
  if(!isFinite(mins)||mins<0) return "";
  if(mins<60) return `${Math.round(mins)} min`;
  const h=Math.floor(mins/60), m=Math.round(mins%60);
  if(h<24) return m?`${h}h ${m}m`:`${h}h`;
  const d=Math.floor(h/24);
  return `${d} day${d===1?"":"s"} ${h%24}h`;
}
function clockOf(d){
  return d.toLocaleString(undefined,{weekday:"short",hour:"numeric",minute:"2-digit"});
}
/* The collection is named after the whole audience description, which can run to a paragraph.
   The strip needs a name, not an essay. */
function shortLabel(t){
  t = String(t||"").trim();
  let cut = (t.split(/[\u2014.\u00b7(]/)[0] || t).trim();
  if(cut.length > 46){
    cut = cut.slice(0,46).replace(/\s+\S*$/,"")
             .replace(/\s+(that|the|and|or|of|a|an|with|for|in)$/i,"");
  }
  return cut + (cut.length < t.length ? "\u2026" : "");
}

function renderLive(){
  const running = (COL.builds||[]).filter(x=>x.running);
  if(!running.length) return "";
  return running.map(r=>{
    const cities = r.completed||0, total = cities + (r.pending||0);
    /* progress off SEARCHES, not towns: the crawl takes the dense cities first, so "towns done"
       crawls along at the start and would promise a finish that never arrives. Searches flow at a
       roughly constant rate, which is what makes the projection worth printing. */
    const frac = r.est_calls ? Math.min(1, (r.spent_calls||0)/r.est_calls) : 0;
    const perCall = (r.est_calls && r.est_cost) ? r.est_cost/r.est_calls : 0.003;
    const spent = (r.spent_calls||0) * perCall;
    const started = r.launch_ts ? new Date(r.launch_ts) : null;
    const mins = started ? (Date.now()-started.getTime())/60000 : 0;
    /* Below about half a percent the rate is noise and any finish time would be a fiction.
       Saying "too early to say" is the honest line; a made-up hour is not. */
    const left = (frac>0.005 && mins>0.2) ? mins*(1-frac)/frac : null;
    const eta = left!=null ? new Date(Date.now()+left*60000) : null;
    return `<div class="livebar">
      <div class="lb">
        <div class="lbtop">
          <span class="lbdot"></span>
          <b>Collecting ${esc(shortLabel(r.label||r.key))}</b>
          <span class="lbnums">${num(r.places||0)} businesses found so far ·
            ${num(cities)} of ${num(total)} towns done</span>
          <span class="lbsp"></span>
          <button class="wbtn" data-cstop="${esc(r.key)}">Stop this collection</button>
        </div>
        <div class="lbbar"><i style="width:${Math.round(100*frac)}%"></i></div>
        <div class="lbfoot">
          <span>${r.est_cost?`About <b>$${spent.toFixed(2)}</b> spent of the
            <b>$${num(Math.round(r.est_cost))}</b> you agreed`:"Running"}</span>
          ${started?`<span>· going ${hhmm(mins)}</span>`:""}
          <span>· ${eta ? `on this pace it finishes around <b>${clockOf(eta)}</b>
            (about ${hhmm(left)} left)` : "too early to say when it finishes"}</span>
        </div>
      </div>
    </div>`;
  }).join("");
}

async function tickCollect(){
  clearTimeout(COL_T);
  const box=$("#collectbox");
  if(box&&NEW_TAB==="collect"&&NEW_OPEN){
    /* re-render only when nobody is mid-typing — a poll must never eat a half-typed term */
    const typing=document.activeElement&&box.contains(document.activeElement)
                 &&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if(!typing)box.innerHTML=renderCollect();
    COL_T=setTimeout(tickCollect,COL.builds.some(x=>x.running)?12000:45000);
  }
}

/* ---- switching: the ONLY place CURRENT changes ---- */
function seedRun(at,pct){
  /* enforce FIRST: the entailed steps this pass creates change the plan's shape, and a
     run whose signature predates them is discarded the moment Run mode is entered — which
     silently wiped the progress on every list that opens mid-flight. */
  enforceStructure();
  resetRun();
  if(!at&&!pct)return;
  G=compute();
  let i=0;
  topo().forEach(n=>{
    if(n.skipped)return;
    const s=RUN.state[n.id],g=G[n.id]||{};
    if(i<at){s.st="done";s.pct=100;s.done=g.billable||0;s.spent=g.cost||0;
      s.line="finished";}
    else if(i===at&&pct){s.st="running";s.pct=pct;
      s.done=Math.round((g.billable||0)*pct/100);s.spent=(g.cost||0)*pct/100;
      s.line=num(s.done)+" of "+num(g.billable||0);}
    i++;
  });
  RUN.tick=Math.max(1,at*3);
}

/* ---- the registry adapter -------------------------------------------------------
   A real build reads the action catalogue from the server rather than holding its own
   copy, because a second copy of a step's price or rate is a second thing to drift. The
   adapter is the ONE place that turns the API shape into the shape this canvas draws
   from — everything above it is untouched by where the numbers came from. The demo
   ships the fixture registry AS that API shape so the seam is real and exercised. */
function buildEntails(ui){
  const e={};
  if(ui.rider_needs) e.rider=ui.rider_needs;
  if(ui.needs_after) e.after=ui.needs_after;
  if(ui.entails_before) e.before=ui.entails_before;
  if(ui.required_before) e.requiredBefore=ui.required_before;
  return Object.keys(e).length?e:null;
}
function adaptRegistry(api){
  const R={};
  (api.actions||[]).forEach(a=>{
    const f=a.flow||{}, c=a.cost||{}, ui=a.ui||{}, inv=a.invoke||{};
    R[a.id]=Object.assign({},a,{
      id:a.id, phase:a.phase, stage:a.stage, grain:a.grain,
      plain:a.plain||{title:a.id,body:""},
      requires:a.requires||[], produces:a.produces||[],
      unit:c.per_unit_usd||0, tier:c.tier, perDay:c.per_day||null,
      rpm:f.rpm||0, keep:(f.keep==null?1:f.keep), seed:f.seed||null,
      review:ui.review?(ui.review_surface||null):null,
      /* the technical view shows the registry id — the name this step is called everywhere
         else in the system, so what you read here matches what you would grep for */
      tech:a.tech||a.id, job:inv.job_kind||a.job||null,
      entails:buildEntails(ui)||a.entails||null
    });
  });
  return R;
}
/* install everything the catalogue just told us. Derived, never listed: a cutter is a free
   step whose keep-rate is below 1, so adding one to the registry can never forget to
   declare it here. */
function applyRegistry(api){
  if(api&&api.actions)REGISTRY=adaptRegistry(api);
  CUTTERS=new Set(Object.keys(REGISTRY).filter(k=>{
    const r=REGISTRY[k];return !r.unit&&r.keep<1;
  }));
}
applyRegistry(null);

/* ---- boot ---- */
function boot(){

     tab nobody is looking at is spend and noise for no reader. */
  pollState();
  setTimeout(()=>{layout(true);fit();},40);
}
boot();

  halo.style.width=(r.width+pad*2)+"px";halo.style.height=(r.height+pad*2)+"px";
  card.innerHTML=`<span class="tut-x" onclick="TUT.end()" title="End tour">✕</span>
    <div class="tut-kicker">Guided tour</div><h4>${s.title}</h4>
    <div class="tut-body">${s.body}</div>

      <span style="flex:1"></span>

      <button class="btn sm" onclick="TUT.next()">${cur===STEPS.length-1?"✓ Finish":"Next ›"}</button>
    </div>`;
  const cw=card.offsetWidth,ch=card.offsetHeight,gap=14;
  const vw=document.documentElement.clientWidth,vh=document.documentElement.clientHeight;
  let pos=s.pos||"bottom",x,y;
  if(pos==="right"&&r.right+gap+cw>vw-10)pos="bottom";
  if(pos==="left"&&r.left-gap-cw<10)pos="bottom";
  if(pos==="bottom"&&r.bottom+gap+ch>vh-10&&r.top-gap-ch>10)pos="top";
  if(pos==="top"&&r.top-gap-ch<10)pos="bottom";
