/* ---- per-mode intro cards ---- */
const INTRO={
 strategize:{t:"① Strategize",b:"A conversation, not a form. Describe who you want to reach in plain speech, say what you already have, and answer the couple of questions that genuinely change the plan. Your answers are remembered and carried into every future re-plan."},
 plan:{t:"② Plan",b:"The whole list-build as one picture: companies on top, people below, the lock wall between them, and the funnel narrowing left to right. Edit it, let it check itself, then approve."},
 run:{t:"③ Run",b:"The same picture with live progress. Watch the counts land, see money spent against the estimate, and decide the close calls where the run stops for you."}
};
let intro=null;
function closeIntro(){if(intro){intro.remove();intro=null;}}
function showIntro(m){
  if(!on||cur>=0||seenModes.has(m))return;
  const t=INTRO[m];if(!t)return;
  seenModes.add(m);closeIntro();
  intro=Nn("div","tut-intro",`<span class="tut-x" onclick="TUT.closeIntro()">✕</span>
    <div class="tut-kicker">\u{1F393} ${t.t}</div><div class="tut-body">${t.b}</div>
    <div class="tut-foot"><span class="tut-link" onclick="TUT.start()">▶ Take the guided tour</span>
      <span style="flex:1"></span>
      <button class="btn gray sm" onclick="TUT.closeIntro()">Got it</button></div>`);
  document.body.appendChild(intro);
  setTimeout(()=>{if(intro)intro.remove(),intro=null;},13000);
}
/* ---- pill + welcome ---- */
function updatePill(){
  const p=document.getElementById("tutPill");
  p.className="tut-pill tutpill"+(on?"":" off");
  p.innerHTML="\u{1F393} Tutorial "+(on?"ON":"OFF");
  p.title=on?"Tutorial mode is ON — hotspots + intro cards. Click to turn off."
            :"Tutorial mode is OFF. Click to turn hints back on.";
}
function setOn(v){
  on=v;try{localStorage.setItem(LS_KEY,v?"on":"off");}catch(e){}
  updatePill();
  if(!v){endTour(false);clearSpots();closeMini();closeIntro();}
  else{attachSpots();
    /* tutorial ON implies plain English until the user says otherwise */
    if(vocab!=="plain"){document.querySelector('#vocabseg button[data-v="plain"]').click();}}
}
function welcome(){
  closeMini();closeIntro();
  openModal(`<div class="mhead"><div><h2>\u{1F44B} What this tool is</h2>
      <div class="sub">30 seconds, no jargon</div></div><div class="spacer"></div>
      <div class="dclose" onclick="closeModal()">×</div></div>
    <div class="mbody">
      <p><b>List Flow</b> plans and runs the work of building a prospect list: finding the companies,
      narrowing them down to the ones worth contacting, finding the right person at each one, getting a
      working email address, and handing the result to the tool that sends the email.</p>
      <p>All of that is drawn as one picture you can scroll around. Each card is one step. The lines show
      how many records survive it. Icons tell you at a glance whether a step <b>costs money</b>
      (${ico("coins")} pennies vs ${ico("bills")} real dollars), whether it is <b>quick or slow</b>
      (${ico("stopwatch")} minutes vs ${ico("hourglass")} hours vs ${ico("calendar")} days), and whether it
      works on <b>companies</b> (${ico("building")}) or <b>people</b> (${ico("person")}).</p>
      <p style="font-size:12.5px;color:var(--muted)">This planner opens with sample data. Nothing is
      collected, nothing is charged, nothing is sent. Click anything. The tour takes about three minutes
      and follows the real order of work.</p>
      <div class="btnrow">
        <button class="btn" onclick="closeModal();TUT.start()">▶ Take the guided tour</button>
        <button class="btn ghost" onclick="closeModal();TUT.explore()">Explore with hints on</button>
        <button class="btn gray" onclick="closeModal();TUT.off()">Turn tutorial off</button>
      </div></div>`);
}
/* ---- hook the app's renders so hotspots re-attach ---- */
const _render=window.render;
window.render=function(){const r=_render.apply(this,arguments);schedule();return r;};
const _rw=window.renderWorld;
window.renderWorld=function(){const r=_rw.apply(this,arguments);schedule();return r;};
document.getElementById("tutPill").onclick=()=>{setOn(!on);
  toast(on?"Tutorial hints ON — every card has a ?":"Tutorial hints off","");};
document.addEventListener("keydown",e=>{
  if(cur<0)return;
  const tag=(document.activeElement||{}).tagName;
  if(tag==="INPUT"||tag==="TEXTAREA")return;
  if(e.key==="ArrowRight"){e.preventDefault();TUT.next();}
  else if(e.key==="ArrowLeft"){e.preventDefault();TUT.back();}
  else if(e.key==="Escape")endTour(false);
});
window.addEventListener("resize",()=>{if(cur>=0)place();schedule();});

window.TUT={
  toggle:()=>setOn(!on),
  start:()=>{if(!on)setOn(true);startTour(0);},
  explore:()=>{if(!on)setOn(true);seenModes.delete(mode);attachSpots();showIntro(mode);},
  off:()=>setOn(false),
  welcome,
  next:()=>{cur===STEPS.length-1?endTour(true):goStep(cur+1);},
  back:()=>{if(cur>0)goStep(cur-1);},
  end:()=>endTour(false),
  tourNode:id=>{STEPS=steps();const i=STEPS.findIndex(s=>s.node===id);
    if(i<0)return;if(!on)setOn(true);closeMini();startTour(i);},
  record:()=>{closeMini();toast("In the real tool this opens the Logic Engine on one record","");},
  onMode:m=>{closeMini();if(cur<0){closeIntro();showIntro(m);}schedule();},
  schedule,closeMini,closeIntro
};
updatePill();
if(on)attachSpots();
if(firstRun){seenModes.add("strategize");}           // open on the tool; walkthrough starts on request
else if(on)showIntro("strategize");
})();
</script>
</body>
</html>
