<!doctype html>
<html lang="en">
<head>
<style id="demo-first-visit-style">html[data-demo-first-visit] :is(#demo-tour-start,#demo-start,#demo-tour-launch,#tutPill){display:none!important}</style>
<script id="demo-first-visit">
(function(){
  const key="demo-walkthrough-seen:list-flow";
  let first=true;
  try { first=localStorage.getItem(key)!=="1"; } catch {}
  if(first)document.documentElement.setAttribute("data-demo-first-visit","");
  try { localStorage.setItem("lf_tutorial","off"); } catch {}
  function ready(){
    let attempts=0;
    const timer=setInterval(()=>{
      const launch=document.querySelector("#demo-tour-start,#demo-start,#demo-tour-launch,#tutPill");
      if(!launch){if(++attempts>100)clearInterval(timer);return;}
      if(!window.TUT)return;launch.onclick=()=>window.TUT.start();launch.textContent="Walkthrough";launch.title="Replay the walkthrough";
      clearInterval(timer);
      if(!first)return;
      launch.click();
      const check=setInterval(()=>{
        const card=document.querySelector("#demo-tour-card,#demo-tour,.tut-card");
        if(card&&!card.hidden&&card.getBoundingClientRect().height){
          try { localStorage.setItem(key,"1"); } catch {}
          clearInterval(check);
        }else if(++attempts>100){
          document.documentElement.removeAttribute("data-demo-first-visit");
          clearInterval(check);
        }
      },100);
    },100);
  }
  if(document.readyState==="complete")setTimeout(ready,500);
  else window.addEventListener("load",()=>setTimeout(ready,500),{once:true});
})();
</script>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; media-src data: blob:; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>List Flow demo</title>
<style>
/* ============================================================================
   LIST FLOW — local workflow planner. No external dependencies.
   Single file, no build step, no external deps, no network.
   ============================================================================ */
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#1c2330; --muted:#5b6675; --line:#e3e7ec;
  --accent:#3858c6; --accent-soft:#eef2fd;
  --teal:#0f8f74; --amber:#a8641b; --amber-soft:#fdf3e3;
  --green:#1f7a4d; --green-soft:#eef8f2; --red:#b3372f; --red-soft:#fdecea;
  --purple:#6d4bb8;
  --acct:#2f6f8f; --acct-soft:#eaf3f8; --acct-band:#f2f9fc;
  --cont:#8a5a1f; --cont-soft:#fdf3e6; --cont-band:#fefaf4;
  --list:#4a5566; --list-band:#f7f8fa;
  --shadow:0 1px 3px rgba(20,28,45,.07),0 6px 18px rgba(20,28,45,.06);
  --shadow-lg:0 14px 44px rgba(15,22,38,.22);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit}
svg.ic{width:15px;height:15px;flex:0 0 auto;vertical-align:-2px}
svg.ic path,svg.ic rect,svg.ic circle,svg.ic ellipse{fill:none;stroke:currentColor;
  stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.cross-ic{display:inline-flex;align-items:center;gap:1px;flex:0 0 auto}
.cross-ic .ar{font-size:10px;opacity:.6;line-height:1}

/* ---------------- top bar ---------------- */
.top{height:56px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:13px;padding:0 16px;position:relative;z-index:70}
.brand{font-weight:800;font-size:16.5px;letter-spacing:-.3px;white-space:nowrap}
.brand span{color:var(--accent)}
.badge{font-size:9.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  background:var(--amber-soft);color:var(--amber);border:1px solid #f0dcb8;border-radius:999px;padding:3px 8px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fbfcfd;flex:0 0 auto}
.seg button{font-size:12.5px;font-weight:650;border:0;background:transparent;color:var(--muted);
  padding:7px 13px;cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.seg.mini button{padding:5px 9px;font-size:11.5px}
.spacer{flex:1}
.roll{background:#fbfcfd;border:1px solid var(--line);border-radius:9px;padding:5px 10px;
  font-size:11.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:5px}
.roll b{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.roll.over{background:var(--red-soft);border-color:#f3c9c4}
.roll.over b{color:var(--red)}
.tutpill{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;
  border:1px solid #c9d7f8;background:var(--accent-soft);color:var(--accent);cursor:pointer;white-space:nowrap}
.tutpill.off{background:transparent;color:var(--muted);border-color:var(--line)}
.btn{font-size:12.5px;font-weight:650;border-radius:8px;padding:7px 13px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--panel);color:var(--accent)}
.btn.gray{background:var(--panel);color:var(--muted);border-color:var(--line)}
.btn.sm{font-size:11.5px;padding:5px 10px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

/* ---------------- shell ---------------- */
/* The shell FLEXES to whatever is left rather than assuming a 56px header. Three bars can
   stack above it (engine warning, waiting work, progress) and a fixed calc() silently pushed
   the bottom of the board past the viewport on a page that cannot scroll — the canvas looked
   fine and its last row was simply gone. Anything that can appear above the work area must be
   laid out, never subtracted by hand. */
body{display:flex;flex-direction:column}
.shell{display:flex;flex:1 1 auto;min-height:0}
.side{width:300px;flex:0 0 300px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;transition:width .16s ease,flex-basis .16s ease}
.side.wide{width:470px;flex-basis:470px}
.side.thin{width:50px;flex-basis:50px}
.sidehead{height:40px;display:flex;align-items:center;gap:7px;padding:0 12px;
  border-bottom:1px solid var(--line);flex:0 0 auto}
.sidehead .ph{flex:1}
.ph{font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.sidebody{flex:1;overflow:auto;padding:12px;display:none}
/* which rail tab shows is a CLASS on .side, never an inline display: an inline style beats
   the collapsed-rail rule and the panel bleeds across the canvas when the rail is thin. */
.side.r-strategy #strategybody{display:block}
.side.r-chat #chatlog{display:block}
.side.r-chat .chatinput{display:flex}
.side.thin .sidehead,.side.thin .sidebody,.side.thin .chatinput{display:none !important}
.railstub .rb:hover{border-color:var(--accent);background:var(--accent-soft)}
.railstub{display:none;flex-direction:column;align-items:center;padding:11px 0;gap:9px}
.side.thin .railstub{display:flex}
.railstub .rb{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fbfcfd;
  display:grid;place-items:center;cursor:pointer;font-size:14px}
.railstub .vlbl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:750;
  letter-spacing:.6px;color:var(--muted);text-transform:uppercase}

.stage{flex:1;position:relative;overflow:hidden;background:var(--bg)}
.right{width:326px;flex:0 0 326px;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column}

/* ---------------- strategy record (the rail's other tab) ----------------
   Deliberately NOT the chat transcript. Months later, mid-run, the question is "what did
   we tell it?" — that has to be a short standing record you can read and correct, not a
   conversation you scroll back through and re-derive. */
#railseg button{padding:6px 12px;font-size:12px}
.side .sidehead{gap:9px}
.strat{display:flex;flex-direction:column;gap:15px;font-size:13px}
.strat .sec{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fbfcfd}
.strat .sec>.hd{font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  color:#8b95a5;margin-bottom:7px}
.strat textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;font:inherit;font-size:12.5px;line-height:1.5;background:var(--panel);
  color:var(--ink);resize:vertical;min-height:56px}
.strat textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.strat .q{font-size:12.5px;font-weight:700;line-height:1.45;margin-bottom:6px;display:flex;gap:7px}
.strat .q .n{color:var(--accent);font-weight:800;flex:0 0 auto}
.strat .qa{margin-bottom:13px}
.strat .qa:last-child{margin-bottom:0}
.strat .ok{font-size:10.5px;color:var(--teal);font-weight:700;margin-top:4px}
.strat .un{font-size:10.5px;color:var(--amber);font-weight:700;margin-top:4px}
.strat .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.strat .st{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
.strat .st .l{font-size:10px;color:#8b95a5;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.strat .st .v{font-size:15px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}
.strat .st.over .v{color:var(--red)}
.stale{border:1px solid #f0dcb8;background:var(--amber-soft);border-radius:12px;padding:11px 12px}
.stale h5{margin:0 0 5px;font-size:12.5px;color:#8a6a12}
.stale p{margin:0 0 9px;font-size:12px;line-height:1.5;color:#7a6410}
.strat .foot{font-size:11.5px;color:var(--muted);line-height:1.55;border-top:1px solid var(--line);
  padding-top:11px}

/* ---------------- chat (mode 1) ---------------- */
.chatlog{display:flex;flex-direction:column;gap:11px}
.msg{max-width:100%;font-size:13.5px;line-height:1.55}
.msg.bot .bub{background:#f4f6fa;border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:10px 12px}
.msg.me{align-self:flex-end;max-width:88%}
.msg.me .bub{background:var(--accent);color:#fff;border-radius:12px 12px 4px 12px;padding:9px 12px}
.msg .who{font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  color:var(--muted);margin-bottom:4px}
.msg .bub b{font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.pick{font-size:12px;font-weight:650;border:1px solid #c9d7f8;background:var(--accent-soft);
  color:var(--accent);border-radius:999px;padding:5px 11px;cursor:pointer}
.pick:hover{filter:brightness(.97)}
.pick.on{background:var(--accent);color:#fff}
.qa{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:8px;background:#fbfcfd}
.qa .q{font-size:12.5px;font-weight:700;margin-bottom:6px;display:flex;gap:6px}
.qa .q .n{color:var(--accent);font-weight:800}
.qa textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit;
  font-size:12.5px;resize:vertical;min-height:44px;background:var(--panel);color:var(--ink)}
.qa .ok{font-size:11px;color:var(--green);font-weight:700;margin-top:4px}
.chatinput{border-top:1px solid var(--line);padding:10px 12px;flex:0 0 auto;display:none;gap:7px}
.chatinput input{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;
  font-size:13px;background:#fbfcfd;color:var(--ink)}
.typing{display:flex;gap:3px;padding:4px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:#b6c0cd;animation:tp 1.1s infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes tp{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* ---------------- canvas ---------------- */
.viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;
  background:radial-gradient(circle at 1px 1px,#dfe4ea 1px,transparent 0) 0 0/22px 22px,var(--bg)}
.viewport.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.lane{position:absolute;border-radius:15px;border:1px dashed transparent}
.lane .lbl{position:absolute;top:9px;left:13px;font-size:11px;font-weight:800;letter-spacing:.8px;
  text-transform:uppercase;display:flex;align-items:center;gap:5px}
.lane.account{background:linear-gradient(90deg,var(--acct-soft),var(--acct-band) 60%,#fcfeff);border-color:#cfe1ea}
.lane.account .lbl{color:var(--acct)}
.lane.contact{background:linear-gradient(90deg,var(--cont-soft),var(--cont-band) 60%,#fffdfa);border-color:#ecdcc4}
.lane.contact .lbl{color:var(--cont)}
.lane.list{background:var(--list-band);border-color:#dfe4ea}
.lane.list .lbl{color:var(--list)}
/* sband = the STAGE BAND: the vertical container. Border + header, NO fill, so it can
   overlay the lane fills without the two tint systems muddying each other.
   NOT named ".stage" — that class already belongs to the canvas wrapper, and taking it
   made the wrapper position:absolute with no size, collapsing the whole canvas to 2x2px
   while leaving the header and side panel perfectly intact. A blank canvas with working
   chrome is the single most confusing failure this app can produce; prefix new canvas
   furniture rather than reaching for the obvious noun. */
.sband{position:absolute;border:1px solid #d7dee8;border-radius:16px;z-index:1;pointer-events:none}
.sband .sthd{position:absolute;left:0;top:0;right:0;height:40px;padding:8px 14px 0;
  display:flex;align-items:baseline;gap:9px;border-radius:15px 15px 0 0;
  border-bottom:1px solid #e6ebf1;background:#f4f7fb}
.sband .sthd b{font-size:12.5px;font-weight:800;letter-spacing:.2px;color:#3d4a5c}
.sband .sthd i{font-style:normal;font-size:10.5px;color:#95a0ae;letter-spacing:.1px}
.sband .phrow{position:absolute;left:0;top:40px;right:0;height:30px}
.sband.st-build{border-color:#cfdcd6}
.sband.st-build .sthd{background:#eef6f2;border-bottom-color:#dcebe4}
.sband.st-build .sthd b{color:#2f6b52}
.sband.st-acct{border-color:#cfe1ea}
.sband.st-acct .sthd{background:#eef5fa;border-bottom-color:#dbe8f1}
.sband.st-acct .sthd b{color:var(--acct)}
.sband.st-people{border-color:#ecdcc4}
.sband.st-people .sthd{background:#fbf4e9;border-bottom-color:#efe2cd}
.sband.st-people .sthd b{color:var(--cont)}
.phase{position:absolute;top:6px;height:19px;font-size:10px;font-weight:800;letter-spacing:.8px;
  text-transform:uppercase;color:#8d97a5;display:flex;align-items:center;justify-content:center;
  border:1px solid #e3e8ef;border-top:none;border-radius:0 0 8px 8px;background:#fdfefe}
.phase span{padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* rework return path + the batch stacks that travel it */
.elab.rwk{fill:#a4691f;font-size:10.5px;font-weight:800}
.stax{display:flex;gap:7px;flex-wrap:wrap;margin:5px 0 0}
.stk{display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;
  padding:2px 6px 2px 4px;border-radius:7px;border:1px solid var(--line);background:#fbfcfd;color:#5b6675}
.stk .sh{display:flex;flex-direction:column-reverse;gap:1px;padding-top:1px}
.stk .sh i{display:block;width:11px;height:2px;border-radius:1px;background:currentColor;opacity:.55}
.stk .sh i:last-child{opacity:.95}
.stk b{font-variant-numeric:tabular-nums}
.stk.bk-move{color:#2c5fd0;border-color:#c9d7f8;background:#f2f6ff}
.stk.bk-wait{color:#7c8798;border-color:#e2e7ee;background:#f7f9fb}
.stk.bk-held{color:#8a4a12;border-color:#eccfa8;background:var(--cont-soft)}
.stk.bk-cut {color:#8b95a5;border-color:#e6eaf0;background:#f6f7f9}
.stk.bk-back{color:#a4691f;border-color:#e6c79a;background:#fdf3e3}
/* WORK ORDERS — a job, not a stage. Hangs off the LEFT edge of the step that will do
   it: near the tool, plainly not part of it, and on the side the records arrive from. */
.wo{position:absolute;left:-27px;width:52px;height:52px;border-radius:50%;z-index:14;cursor:pointer;
  display:grid;place-items:center;gap:0;border:2px solid #fff;
  box-shadow:0 2px 6px rgba(20,28,45,.16),0 8px 18px rgba(20,28,45,.13);
  background:var(--panel);overflow:hidden;transition:transform .12s}
.wo:hover{transform:scale(1.08)}
.wo.on{outline:2px solid var(--accent);outline-offset:2px}
.wo b{font-size:13px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;margin-top:-2px}
.wo i{font-style:normal;font-size:10px;line-height:1;opacity:.85;margin-top:1px}
.wo u{position:absolute;left:0;bottom:0;height:3px;background:currentColor;text-decoration:none}
.wo.k-back{color:#a4691f;border-color:#f6e6cd;background:#fdf3e3}
.wo.k-recheck{color:#6a4bbd;border-color:#e2dcf7;background:#f3f0fd}
.wo.k-fwd{color:#2c7a56;border-color:#cfe9dc;background:#eef8f3}
/* the list of outstanding jobs, and one job in detail */
.woset{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.worow{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel);cursor:pointer}
.worow:hover{border-color:#c9d7f8;background:#f8faff}
.worow .won{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;min-width:50px}
.worow .wow{font-size:11.5px;color:#5b6675;line-height:1.4}
.worow .wow b{color:#26303f;font-size:12px}
.worow .wow em{display:block;font-style:normal;font-size:10.5px;color:#9aa5b3;margin-top:3px}
.worow.k-back{border-color:#f0dcc0}.worow.k-back .won{color:#a4691f}
.worow.k-recheck{border-color:#ded7f4}.worow.k-recheck .won{color:#6a4bbd}
.worow.k-fwd{border-color:#cfe9dc}.worow.k-fwd .won{color:#2c7a56}
.wodet .wh{display:flex;gap:11px;align-items:flex-start;margin-bottom:12px}
.wodet .wob{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;
  font-size:17px;border:2px solid currentColor}
.wodet .wob.k-back{color:#a4691f;background:#fdf3e3}
.wodet .wob.k-recheck{color:#6a4bbd;background:#f3f0fd}
.wodet .wob.k-fwd{color:#2c7a56;background:#eef8f3}
.wodet h3{font-size:14.5px;font-weight:800;line-height:1.3}
.wodet .ws{font-size:11px;color:var(--muted);margin-top:3px}
.woacts{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
/* the "where is everything" list in the side panel */
.bset{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.brow{display:flex;align-items:center;gap:9px;padding:8px 9px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel);cursor:pointer}
.brow:hover{border-color:#c9d7f8;background:#f8faff}
.brow .bn{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;min-width:52px}
.brow .bw{font-size:11.5px;color:#5b6675;line-height:1.35}
.brow .bw b{color:#26303f}
.brow.bk-back{border-color:#e6c79a;background:#fefaf3}
.brow.bk-back .bn{color:#a4691f}
.brow.bk-held{border-color:#eccfa8}
.brow.bk-held .bn{color:#8a4a12}
/* the legal drop cell, shown only while a card is in the air */
.cellhi{position:absolute;display:none;z-index:4;pointer-events:none;border-radius:14px;
  border:2px dashed #9fb4d8;background:rgba(74,110,200,.07)}
body.celling .cellhi{display:block}
/* z-index 5 is load-bearing: the lane bands and the lock wall are painted by the
   SAME innerHTML write as the nodes, so they come LATER in the DOM than this svg and
   would cover every connector (lanes 0 / wall 3 / walltag 4 < edges 5 < nodes 6). */
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:5}
.elab{font-size:11px;font-weight:700;fill:#4a5566;paint-order:stroke;stroke:#fff;stroke-width:3.5px}
.elab.est{font-style:italic;fill:#7c8798}
.esub{font-size:9.5px;fill:#8b95a5;paint-order:stroke;stroke:#fff;stroke-width:3px}
.ins{position:absolute;width:20px;height:20px;border-radius:50%;border:1px solid #c9d7f8;
  background:var(--panel);color:var(--accent);font-size:13px;font-weight:800;line-height:1;
  display:grid;place-items:center;cursor:pointer;z-index:12;opacity:0;transition:opacity .12s}
.viewport:hover .ins{opacity:.55}
.ins:hover{opacity:1 !important;background:var(--accent);color:#fff}

.wall{position:absolute;width:15px;border-radius:4px;z-index:3;
  background:repeating-linear-gradient(135deg,#e7ebf1,#e7ebf1 6px,#dbe1ea 6px,#dbe1ea 12px);
  border-left:2px solid #c3ccd8;border-right:2px solid #c3ccd8}
.walltag{position:absolute;width:150px;text-align:center;font-size:10px;font-weight:800;
  color:#5b6675;line-height:1.4;z-index:4}
.walltag .lk{display:block;color:#55606f;margin-bottom:3px}
.walltag em{display:block;font-style:normal;font-weight:600;color:#7c8798;margin-top:2px}

/* ---------------- node ---------------- */
.node{position:absolute;width:206px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);padding:9px 10px 8px;z-index:6;cursor:pointer;
  transition:box-shadow .12s,border-color .12s,transform .3s cubic-bezier(.22,.61,.36,1)}
.node:hover{border-color:#c3cede;box-shadow:0 2px 6px rgba(20,28,45,.09),0 10px 26px rgba(20,28,45,.09)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.node::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:3px;
  border-radius:12px 12px 0 0;background:var(--line)}
.node.g-account::before{background:var(--acct)}
.node.g-contact::before{background:var(--cont)}
.node.g-list::before{background:var(--list)}
.node.g-cross{width:216px;z-index:7}
.node.g-cross::before{background:linear-gradient(90deg,var(--acct),var(--cont))}
.node.flag{border-color:#e2b48c;box-shadow:0 0 0 3px var(--amber-soft),var(--shadow)}
.node.flag.sel{border-color:var(--accent)}
.node.ghost{background:#fbfcfd;border:1px dashed #c8d0da;box-shadow:none;opacity:.9}
.node.ghost::before{display:none}
.node.dragging{z-index:30;box-shadow:0 18px 40px rgba(15,22,38,.24)}
.nhead{display:flex;align-items:flex-start;gap:6px}
.nhead .gi{margin-top:1.5px;color:var(--muted)}
.node.g-account .nhead .gi{color:var(--acct)}
.node.g-contact .nhead .gi{color:var(--cont)}
.ntitle{font-size:12.5px;font-weight:750;line-height:1.33;flex:1}
.node.ghost .ntitle{color:#8b95a5;font-weight:650}
.nio{font-size:10px;color:var(--muted);margin:5px 0 6px;line-height:1.4}
.nchips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:3.5px;font-size:10.5px;font-weight:750;
  border-radius:6px;padding:2px 6px;border:1px solid var(--line);background:#fbfcfd;color:#4a5566;
  white-space:nowrap}
.chip svg.ic{width:12px;height:12px}
.chip.free{color:var(--green);border-color:#c6e3d3;background:var(--green-soft)}
.chip.coin{color:#7a6410;border-color:#e8dfae;background:#fbf7e6}
.chip.bill{color:#8a4a12;border-color:#eccfa8;background:var(--cont-soft)}
.chip.bill.over{color:var(--red);border-color:#f3c9c4;background:var(--red-soft)}
.chip.human{color:var(--accent);border-color:#c9d7f8;background:var(--accent-soft)}
.chip.drip{color:var(--purple);border-color:#d5cbee;background:#f4f1fb}
.chip.tech{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;font-size:9px;color:#8b95a5}
.ghostwhy{font-size:10px;color:var(--muted);font-style:italic;margin-top:5px;line-height:1.4}
.nrun{display:none;margin-top:7px;border-top:1px dashed var(--line);padding-top:6px}
body.mode-run .node .nrun{display:block}
.bar{height:5px;border-radius:3px;background:#eceff4;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .3s linear}
.bar.done i{background:var(--green)}
.bar.wait i{background:#cfd6e0}
.bar.need i{background:var(--amber)}
.runline{font-size:9.5px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px}
.runline b{color:var(--ink);font-variant-numeric:tabular-nums}
.state{position:absolute;top:-9px;right:-9px;width:21px;height:21px;border-radius:50%;
  display:none;place-items:center;font-size:11px;font-weight:800;color:#fff;
  box-shadow:0 1px 4px rgba(20,28,45,.28)}
body.mode-run .state{display:grid}
.state.running{background:var(--accent);animation:pl 1.6s infinite}
.state.done{background:var(--green)}.state.idle{background:#aeb7c3}
.state.needs{background:var(--amber)}.state.blocked{background:#cfd6e0;color:#6b7686}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(56,88,198,.4)}70%{box-shadow:0 0 0 8px rgba(56,88,198,0)}100%{box-shadow:0 0 0 0 rgba(56,88,198,0)}}
/* ONE warning shape. Previously a bare "!" in a circle here and ANOTHER bare "!" in the
   run-state dot — same glyph, two unrelated meanings. The triangle now means exactly one
   thing anywhere it appears: the plan checker has a finding on this step. */
.lintdot{position:absolute;top:-9px;left:-9px;width:22px;height:22px;border-radius:7px;
  background:var(--amber);color:#fff;display:grid;place-items:center;
  box-shadow:0 1px 4px rgba(20,28,45,.28);z-index:9}
.lintdot svg.ic{width:13px;height:13px;stroke-width:1.5}
.lintdot.stop{background:var(--red)}
.state.needs svg.ic{width:12px;height:12px;stroke:#fff;stroke-width:1.7}

/* ---------------- weight: heavy steps LOOK heavy ----------------
   A chip you have to read is not a glance. Cost and time also cannot share one bar
   without lying — a free step that runs for six hours and a $30 step that finishes
   instantly are both "heavy", differently. So: the card's SIZE and SHADE carry the
   combined burden (how much of this plan is this one step?), and two thin meters
   underneath say which of the two it is. Tiers, not a continuum, because the eye
   compares four buckets far better than it compares 40 gradations. */
/* MIN-HEIGHT per tier, not just padding. Padding alone was drowned out by how long
   each step's title happened to be, so the tiers read as noise — the tier has to set
   the size, or the text does. The light end is deliberately COMPACT as well as the
   heavy end being tall: contrast comes from both directions, which keeps the graph
   from inflating to fit its worst step. */
.node.w0{min-height:92px;padding:8px 10px 7px}
.node.w1{min-height:126px;padding:9px 10px 10px}
.node.w2{min-height:158px;padding:11px 11px 13px;border-color:#e0d3bb;
  background:linear-gradient(180deg,#fff 30%,#fdf7ec)}
.node.w3{min-height:190px;padding:13px 12px 15px;border-color:#d9c0a0;
  background:linear-gradient(180deg,#fffdfa 18%,#fbeed9);
  box-shadow:0 3px 7px rgba(20,28,45,.11),0 14px 30px rgba(20,28,45,.13)}
.node.w1::before{height:4px}
.node.w2::before{height:6px}
.node.w3::before{height:9px}
/* say WHY it is heavy — "big" without a reason is just a bigger box */
.wtag{position:absolute;right:-6px;top:-9px;display:inline-flex;align-items:center;gap:4px;
  background:var(--cont);color:#fff;font-size:8.5px;font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;padding:3px 7px;border-radius:6px;white-space:nowrap;
  box-shadow:0 2px 7px rgba(20,28,45,.26);z-index:10}
.wtag svg.ic{width:10px;height:10px}
.node.w3 .wtag{background:#8a4a12}
.heft{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.hm{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:800;letter-spacing:.4px;
  text-transform:uppercase;color:#98a2b1}
.hm svg.ic{width:13px;height:13px;flex:0 0 auto}
.hm .tr{flex:1;height:6px;border-radius:3px;background:#eaeef4;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(20,28,45,.07)}
.hm .tr i{display:block;height:100%;border-radius:3px}
/* the meters grow with the tier too, so the bar you are meant to read is the big one */
.node.w2 .hm .tr{height:9px;border-radius:4px}
.node.w2 .hm svg.ic{width:14px;height:14px}
.node.w2 .hm .v{font-size:11px}
.node.w3 .hm .tr{height:13px;border-radius:5px}
.node.w3 .hm svg.ic{width:16px;height:16px}
.node.w3 .hm .v{font-size:12.5px;font-weight:800;color:var(--ink)}
.node.w3 .heft{gap:7px;margin-top:11px}
/* a free, instant step has nothing to meter — one quiet line says so and stays small */
.heftlite{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:10px;font-weight:700;
  color:#9aa5b3}
.heftlite svg.ic{width:12px;height:12px}
.hm.money .tr i{background:linear-gradient(90deg,#d8b45e,#b4762a)}
.hm.time  .tr i{background:linear-gradient(90deg,#7fb9ad,#2f7f9e)}
.hm.time.drip .tr i{background:linear-gradient(90deg,#a996d8,#6d4bb8)}
.hm .v{width:52px;text-align:right;color:#6b7686;font-variant-numeric:tabular-nums;
  text-transform:none;letter-spacing:0;font-size:9.5px;font-weight:700}
.node.w0 .heft{opacity:.55}

/* ---- entailed actions ----
   A RIDER is drawn INSIDE the card it protects: a snapshot is not a stage you
   watch, it is a seatbelt on the next step, and giving it its own box in the row
   said the opposite. A REQUIRED JOIN is drawn as a confluence — wider, doubled
   left edge, with the reason on the card — because "these two become one here"
   is the entire content of the node. */
.rider{display:flex;align-items:center;gap:5px;margin:-3px -4px 7px;padding:4px 7px;
  background:var(--green-soft);border:1px solid #c6e3d3;border-radius:7px;
  font-size:9.5px;font-weight:700;color:var(--green);line-height:1.3}
.rider svg.ic{width:11px;height:11px;flex:0 0 auto}
.rider b{margin-left:auto;font-weight:800;opacity:.7;white-space:nowrap}
.rider>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node.joinnode{border-color:#b9c7dd;box-shadow:0 0 0 3px #eef2fd,var(--shadow)}
.node.joinnode::after{content:"";position:absolute;left:-7px;top:14px;bottom:14px;width:3px;
  border-radius:3px;background:linear-gradient(180deg,var(--acct),var(--accent))}
.reqtag{display:flex;align-items:center;gap:4px;margin:-2px -4px 6px;padding:3px 7px;
  background:var(--accent-soft);border:1px solid #c9d7f8;border-radius:7px;
  font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--accent)}
.reqtag svg.ic{width:10px;height:10px}
/* In Run mode the progress bar and the live counts take over: an estimate meter
   beside a real number is noise, and the card has to stay inside the row pitch. */
body.mode-run .heft{display:none}

/* time + cost chips are the glance, so make them legible from across the room */
.chip svg.ic{width:13.5px;height:13.5px;stroke-width:1.5}
.chip.t-inst{color:#8b95a5}
.chip.t-min{color:var(--teal);border-color:#bfe0d7;background:#eff8f5}
.chip.t-hr {color:var(--amber);border-color:#f0dcb8;background:var(--amber-soft)}
.chip.t-day{color:var(--purple);border-color:#d5cbee;background:#f4f1fb}
.node.w3 .chip{font-size:11.5px;padding:3px 8px}
.node.w3 .chip svg.ic{width:15px;height:15px}

/* ---------------- per-step setup ----------------
   A card is WHERE a step sits. Its setup is WHAT it will actually do — the old
   wizard's whole workbench, scoped to one node. */
/* The gear was hover-only, so scanning the canvas showed no sign that a step HAS
   settings — and "where are my settings?" is a question you ask while looking, not
   while hovering. Always visible, quietly; full strength on hover. */
.gearb{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:7px;
  border:1px solid var(--line);background:#fbfcfd;color:#8b95a5;display:grid;place-items:center;
  cursor:pointer;padding:0;opacity:.75;transition:opacity .12s,color .12s,background .12s;z-index:11}
.node:hover .gearb,.node.sel .gearb,.gearb.needs{opacity:1}
.gearb:hover{color:var(--accent);background:var(--accent-soft);border-color:#c9d7f8}
.gearb svg.ic{width:14px;height:14px}
.gearb.needs{color:var(--amber);background:var(--amber-soft);border-color:#f0dcb8}
/* One line, always. A card whose height depends on how long you made a prompt is a
   card that overlaps the row below it. The full text lives in the setup sheet. */
.nsetup{font-size:9.5px;color:#8b95a5;margin:4px 0 0;line-height:1.4;
  display:flex;align-items:center;gap:4px}
.nsetup>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nsetup svg.ic{width:11px;height:11px;flex:0 0 auto}
.nsetup.needs{color:var(--amber);font-weight:700}
/* Kept visible during a run too: "what did we actually tell this step to do?" is a
   question you ask MORE once it is running, not less. */
.nsetup{cursor:pointer}
.nsetup:hover{color:var(--accent)}
.node .nhead{padding-right:20px}

/* setup modal */
.modal.wide{width:760px}
.setgrp{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.setgrp>.gh{background:#fbfcfd;border-bottom:1px solid var(--line);padding:9px 13px;font-size:12px;
  font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
.setgrp>.gh .gsub{font-weight:500;color:var(--muted);font-size:11.5px;letter-spacing:0}
.setgrp>.gb{padding:12px 13px}
.fld{margin-bottom:11px}
.fld:last-child{margin-bottom:0}
.fld>label{display:block;font-size:12px;font-weight:700;margin-bottom:3px}
.fld .fh{font-size:11.5px;color:var(--muted);line-height:1.45;margin-bottom:5px}
.fld input[type=text],.fld input[type=number],.fld textarea,.fld select{
  width:100%;font:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);color:var(--ink)}
.fld textarea{min-height:64px;resize:vertical;line-height:1.5}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:0;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.fld.req>label::after{content:" required";font-size:9.5px;font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;color:var(--amber);margin-left:5px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips button{font:inherit;font-size:11.5px;font-weight:650;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);background:#fbfcfd;color:var(--muted);cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fld .row2{display:flex;gap:9px}
.fld .row2>div{flex:1}
/* a probe is a cheap experiment that answers one question and writes its answer back */
.probe{border:1px solid #d7e0ee;background:#f8fafd;border-radius:10px;padding:10px 12px;margin-bottom:9px}
.probe:last-child{margin-bottom:0}
.probe .pt{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:750;margin-bottom:3px}
.probe .pt svg.ic{width:14px;height:14px;color:var(--accent)}
.probe .pb{font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:8px}
.probe .pcost{margin-left:auto;font-size:10.5px;font-weight:800;color:#7a6410;background:#fbf7e6;
  border:1px solid #e8dfae;border-radius:6px;padding:2px 7px}
.probe .pcost.free{color:var(--green);background:var(--green-soft);border-color:#c6e3d3}
.probe .pres{margin-top:9px;border-top:1px dashed #d7e0ee;padding-top:9px;font-size:12px;line-height:1.55}
.probe table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
.probe th{text-align:left;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);
  padding:0 6px 4px 0;font-weight:800}
.probe td{padding:3px 6px 3px 0;border-top:1px solid #e7edf6;font-variant-numeric:tabular-nums}
.probe .verdict{border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.5;margin-top:8px}
.probe .verdict.ok{background:var(--green-soft);color:#186040;border:1px solid #c6e3d3}
.probe .verdict.warn{background:var(--amber-soft);color:#7d4a12;border:1px solid #f0dcb8}
.setfoot{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:11px 18px;display:flex;align-items:center;gap:9px;margin:14px -18px -18px}
.setfoot .est{font-size:12px;color:var(--muted)}
.setfoot .est b{color:var(--ink)}
.setmiss{background:var(--amber-soft);border:1px solid #f0dcb8;color:#7d4a12;border-radius:9px;
  padding:8px 11px;font-size:12px;margin-bottom:12px;line-height:1.5}

/* ---------------- run spotlight (mode 3) ----------------
   "Where are we right now" has to survive a glance from across the room, so the
   step that is running gets the whole screen: everything else drops behind a dim
   layer, the live card lifts through it and grows.
   The dim layer lives INSIDE .world on purpose. .world has a transform, which makes
   it a stacking context — a scrim placed outside it could never be undercut by a
   node inside it, no matter what z-index the node carried. Inside, plain z-index
   ordering works: edges 5 / nodes 6 / SCRIM 20 / other live cards 22 / the one 24.
   Its rect is recomputed from the camera on every pan/zoom (sizeScrim) — a fixed
   world-space margin is not enough, because panning 1500px at 0.3 zoom walks 5000
   world units and the dim would end mid-screen. */
.spotscrim{position:absolute;left:0;top:0;width:100%;height:100%;
  background:rgba(14,20,35,.62);z-index:20;pointer-events:none;display:none}
body.mode-run.focusing .spotscrim{display:block}
/* deliberately NO css transition on .world — the camera is tweened in JS so that the dim
   layer, which is computed from the camera, can never be drawn for a frame the canvas has
   not reached. See glideTo(). */
body.mode-run.focusing .node.lit{z-index:22}
body.mode-run.focusing .node.spot{z-index:24;transform:scale(1.24);border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft),0 0 0 1px var(--accent),0 26px 56px rgba(10,16,30,.4)}
.nownote{position:absolute;left:0;top:-25px;display:none;align-items:center;gap:5px;
  background:var(--accent);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap;
  box-shadow:0 3px 10px rgba(20,28,45,.3)}
.nownote i{width:6px;height:6px;border-radius:50%;background:#fff;animation:nowp 1.2s infinite}
@keyframes nowp{0%,100%{opacity:.35}50%{opacity:1}}
body.mode-run.focusing .node.spot .nownote{display:inline-flex}
.minimap .mn.spotmn{background:var(--accent);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}

/* ---------------- minimap + canvas controls ---------------- */
.minimap{position:absolute;left:12px;bottom:12px;width:210px;height:104px;background:rgba(255,255,255,.93);
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:40;cursor:pointer;
  overflow:hidden}
.minimap .mn{position:absolute;background:#b9c4d2;border-radius:1.5px}
.minimap .mn.account{background:var(--acct)}.minimap .mn.contact{background:var(--cont)}
.minimap .mn.list{background:var(--list)}.minimap .mn.cross{background:var(--purple)}
.minimap .mn.ghost{background:#d7dde5}
.minimap .cam{position:absolute;border:1.5px solid var(--accent);background:rgba(56,88,198,.09);
  border-radius:3px;pointer-events:none}
.zoomctl{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;z-index:40}
.zoomctl button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.95);
  color:var(--ink);cursor:pointer;font-size:14px;font-weight:700;box-shadow:var(--shadow);display:grid;place-items:center}
.zoomctl button.w{width:auto;padding:0 10px;font-size:11.5px;font-weight:650}
.zoomctl button:hover{background:#fff;border-color:#c3cede}
#speedbtn,#focusbtn{display:none}
body.mode-run #speedbtn,body.mode-run #focusbtn{display:grid}
body.mode-run #relayout{display:none}
.zoomctl button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.zoomctl button.on:hover{background:#2e4bb0;border-color:#2e4bb0}
.hint{position:absolute;left:12px;top:12px;z-index:40;background:rgba(255,255,255,.92);
  border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:11px;color:var(--muted);
  box-shadow:var(--shadow)}

/* ---------------- right panel ---------------- */
.rhead{height:40px;display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.rbody{flex:1;overflow:auto;padding:12px}
.lint{border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:9px;
  padding:9px 10px;margin-bottom:9px;background:#fffdf9;cursor:pointer}
.lint:hover{border-color:#dfe4ea}
.lint.pass{border-left-color:var(--green);background:#f8fcfa;cursor:default}
.lint.stop{border-left-color:var(--red);background:#fffafa}
.lint h5{margin:0 0 4px;font-size:12px;font-weight:750;display:flex;gap:6px;align-items:baseline}
.lint p{margin:0;font-size:11.5px;color:#4a5566;line-height:1.45}
.lint .rule{display:block;margin-top:5px;font-size:10px;color:var(--muted);font-style:italic}
.lint .fix{margin-top:7px;font-size:11.5px;font-weight:700;color:var(--accent)}
.lint.stop .fix{color:var(--red)}
.empty{font-size:12.5px;color:var(--muted);text-align:center;padding:22px 10px;line-height:1.55}
.legend .lg{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;margin-bottom:6px;line-height:1.4}
.legend .lg .k{flex:0 0 30px;text-align:center;padding-top:1px;color:var(--muted)}
.legend .lg b{font-weight:750}
.legend .sub{font-size:10.5px;color:var(--muted);margin:-3px 0 9px 38px;line-height:1.4}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}

/* inspector */
.insp .itop{display:flex;gap:8px;align-items:flex-start;margin-bottom:3px}
.insp h3{margin:0;font-size:15px;line-height:1.3;flex:1}
.insp .tech{font-size:10.5px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;margin-bottom:10px}
.insp .body{font-size:12.5px;color:#414c5e;line-height:1.6;margin-bottom:12px}
.kv{display:flex;gap:8px;font-size:11.5px;padding:5px 0;border-top:1px dotted var(--line)}
.kv .k{flex:0 0 92px;color:var(--muted);font-weight:650}
.kv .v{flex:1}
.kv .v code{background:#f0f3f8;border-radius:4px;padding:0 4px;font-size:10.5px}
.gotcha{margin-top:11px;background:var(--amber-soft);border:1px solid #f0dcb8;border-radius:9px;
  padding:8px 10px;font-size:11.5px;color:#6f4a13;line-height:1.5}
.gotcha b{display:block;font-size:10px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:3px}
.actrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}
.est{display:flex;gap:7px;margin:11px 0 3px}
.est .t{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#fbfcfd}
.est .t .l{font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.est .t .v{font-size:15px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}
.est .t .n{font-size:10.5px;color:var(--muted);margin-top:1px}

/* palette */
.palgroup{margin-bottom:12px}
.palgroup .gl{font-size:9.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px}
.pal{border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-bottom:5px;cursor:pointer;background:#fbfcfd}
.pal:hover{border-color:var(--accent);background:var(--accent-soft)}
.pal.dis{opacity:.5;cursor:not-allowed}
.pal.dis:hover{border-color:var(--line);background:#fbfcfd}
.pal .pt{font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center}
.pal .pt .gi{color:var(--muted)}
.pal .pw{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.pal .pn{font-size:10px;color:var(--red);margin-top:3px;font-style:italic}
.pal .pmeta{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.pal .pmeta .chip{font-size:9.5px;padding:2px 5px}
.pal .pmeta .chip svg.ic{width:11.5px;height:11.5px}
.search{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font:inherit;
  font-size:12.5px;margin-bottom:11px;background:#fbfcfd;color:var(--ink)}

/* review queue */
.rvrow{border:1px solid var(--line);border-radius:9px;padding:8px 9px;margin-bottom:7px;background:#fbfcfd}
.rvrow .n{font-size:12.5px;font-weight:700}
.rvrow .d{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.45}
.rvrow .b{display:flex;gap:6px;margin-top:7px}
.rvlist{display:flex;flex-direction:column;gap:5px}
.rvrow{overflow:hidden}
.rvtop{display:flex;gap:9px;align-items:flex-start;cursor:pointer;user-select:none}
.rvrow .rvmain{flex:1;min-width:0}
.rvrow .n em{font-style:normal;font-weight:600;color:#7c8798;font-size:11px}
.rvmore{margin-left:auto;flex:0 0 auto;font-size:10px;font-weight:800;letter-spacing:.4px;
  text-transform:uppercase;color:#9aa5b3;background:none;border:none;cursor:pointer;padding:1px 2px}
.rvmore:hover{color:var(--accent)}
.rvev{margin-top:8px;padding-top:8px;border-top:1px dotted var(--line);font-size:11px}
.rvev .ek{display:flex;gap:8px;padding:2px 0}
.rvev .ek span:first-child{flex:0 0 96px;color:#9aa5b3}
.rvev .ek span:last-child{color:#3d4a5c;word-break:break-word}
.rvev .eq{margin:6px 0;padding:6px 8px;border-radius:7px;background:#f6f8fb;color:#5b6675;font-style:italic}
.rvev .et{display:flex;flex-wrap:wrap;gap:5px}
.rvev .et span{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;
  border:1px solid #e6c79a;background:#fdf3e3;color:#8a5a12}
.rvmoreb{display:flex;gap:7px;justify-content:center;padding:10px 0 2px}
.rvmoreb .note{font-size:11px;color:var(--muted)}
/* what it learned from what you rejected */
.learn{border:1px solid #c6e3d3;background:linear-gradient(180deg,#f4fbf8,#eef8f4);
  border-radius:11px;padding:11px 12px;margin-bottom:11px}
.learn .lh{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:var(--green);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.lrow+.lrow{margin-top:11px;padding-top:11px;border-top:1px dotted #cfe6db}
.lrow .lw{font-size:12px;color:#3d4a5c;line-height:1.45}
.lrow .lr{font-size:12.5px;font-weight:700;color:#26303f;margin:6px 0;padding:6px 9px;
  border-radius:8px;background:var(--panel);border:1px solid #cfe6db}
.lrow .lm{font-size:11px;color:#5b6675;line-height:1.5}
.lrow .lb{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.taught{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:11px;background:#fbfcfd}
.taught .th{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  color:#9aa5b3;margin-bottom:6px}
.trow{display:flex;align-items:baseline;gap:8px;font-size:11.5px;padding:3px 0}
.trow span{flex:1;color:#3d4a5c}
.trow i{font-style:normal;font-size:10.5px;color:#9aa5b3;white-space:nowrap}
.trow b{cursor:pointer;color:#c3ccd8;font-size:12px;padding:0 2px}
.trow b:hover{color:var(--red)}
.rvrow:hover{border-color:#c9d7f8;background:#f8faff}
.rvrow.open{border-color:#c9d7f8;background:var(--panel)}
.rvrow .rvck{flex:0 0 17px;height:17px;margin-top:1px;border:1.5px solid #c3ccd8;border-radius:5px;
  display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--panel)}
.rvrow.marked{border-color:#f3c9c4;background:var(--red-soft)}
.rvrow.marked .rvck{background:var(--red);border-color:var(--red)}
.rvrow.marked .n{text-decoration:line-through;color:#9aa5b3}
.rvbar{display:none;flex-direction:column;gap:7px;padding:10px 13px;border-top:1px solid var(--line);
  background:linear-gradient(180deg,#fbfcfd,#f4f7fb)}
.rvbar.on{display:flex}
.rvbar .rvcount{font-size:11.5px;color:#5b6675}
.rvbar .rvcount b{color:var(--red);font-size:13px}
.rvbar .rvacts{display:flex;gap:7px}
.rvbar .rvacts .btn{flex:1;justify-content:center}
.mini{font-size:11px;font-weight:700;border-radius:7px;padding:4px 9px;cursor:pointer;border:1px solid var(--line);background:var(--panel)}
.mini.y{color:var(--green);border-color:#c6e3d3;background:var(--green-soft)}
.mini.n{color:var(--red);border-color:#f3c9c4;background:var(--red-soft)}

/* run log */
.log{font-size:11.5px}
.logrow{display:flex;gap:7px;padding:6px 0;border-top:1px dotted var(--line);line-height:1.45}
.logrow .tm{flex:0 0 46px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:10.5px}
.logrow.warn{color:var(--amber)}.logrow.ok{color:var(--green)}

/* ---------------- modal / toast ---------------- */
/* ---------------- data peek sheet ----------------
   A bottom sheet, NOT a modal and NOT another tab: the canvas has to stay on screen
   and stay clickable, because the point is to look at the rows at one step, then move
   along the graph and look again. Clicking another card re-targets the open sheet.
   The viewport is genuinely resized (not overlaid) so every camera measurement, the
   spotlight centring and the minimap keep working against the area you can still see. */
.sheet{position:absolute;left:0;right:0;bottom:0;height:56%;min-height:270px;background:var(--panel);
  border-top:1px solid var(--line);box-shadow:0 -12px 34px rgba(15,22,38,.15);z-index:60;
  display:flex;flex-direction:column;transform:translateY(101%);pointer-events:none;
  transition:transform .26s cubic-bezier(.22,.61,.36,1)}
body.sheeting .sheet{transform:none;pointer-events:auto}
body.sheeting .viewport{bottom:56%}
body.sheeting .minimap,body.sheeting .zoomctl{bottom:calc(56% + 12px)}
.shead{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:11px 14px;
  border-bottom:1px solid var(--line)}
.shead .sgrain{color:var(--muted);display:flex;padding-top:1px}
.shead h4{margin:0;font-size:14px;white-space:nowrap}
.shead .ssub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
.shead .ssub b{color:var(--ink);font-variant-numeric:tabular-nums}
.shead .ssub .live{color:var(--green);font-weight:800}
.shead .ssub .samp{color:#8a6a12;font-weight:800}
.shead .grow{flex:1}
.shead input{width:172px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;
  font-size:12px;background:#fbfcfd;color:var(--ink)}
.sx{border:0;background:none;font-size:17px;color:var(--muted);cursor:pointer;line-height:1;padding:2px 4px}
.sseg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
.sseg button{border:0;background:var(--panel);padding:6px 10px;font:inherit;font-size:11.5px;font-weight:650;
  color:var(--muted);cursor:pointer;border-right:1px solid var(--line)}
.sseg button:last-child{border-right:0}
.sseg button.on{background:var(--accent-soft);color:var(--accent)}
.sseg button b{font-variant-numeric:tabular-nums}
.colmenu{position:absolute;right:14px;top:50px;z-index:5;width:250px;max-height:265px;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-lg);
  padding:8px;display:none}
.colmenu.on{display:block}
.colmenu .cm{display:flex;gap:8px;align-items:center;padding:5px 7px;border-radius:7px;font-size:12px;cursor:pointer}
.colmenu .cm:hover{background:#f4f6fa}
.colmenu .cm code{font-size:9.5px;color:#9aa5b3;margin-left:auto}
.colmenu .hd{font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  color:#9aa5b3;padding:6px 7px 4px}
/* expanded sheet: everything except the app header and the side panel. The canvas is
   still THERE, just fully covered — closing or shrinking puts it back exactly as it was,
   because the camera was never touched. */
body.sheetbig .sheet{height:100%}
body.sheetbig .viewport{bottom:100%}
body.sheetbig .minimap,body.sheetbig .zoomctl{display:none}
#sheetbig{font-size:14px}
body.sheetbig #sheetbig{background:var(--accent-soft);color:var(--accent)}
/* filter builder */
.colmenu.fm{width:330px;max-height:330px}
.fmrow{display:flex;gap:5px;align-items:center;padding:5px 7px}
.fmrow select,.fmrow input{font:inherit;font-size:11.5px;border:1px solid var(--line);
  border-radius:7px;padding:4px 6px;background:var(--panel);color:inherit;min-width:0}
.fmrow select.f{flex:1.5}.fmrow select.o{flex:1.2}.fmrow input{flex:1.3}
.fmrow .x{cursor:pointer;color:#b6bec9;font-weight:800;padding:0 3px}
.fmrow .x:hover{color:var(--red)}
.fchips{display:none;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);
  background:#fbfcfd}
.fchips.on{display:flex}
.fchip{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 5px 3px 9px;
  border:1px solid #c9d7f8;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.fchip i{font-style:normal;font-weight:600;color:#5b6675}
.fchip b{cursor:pointer;font-size:12px;padding:0 3px;border-radius:50%}
.fchip b:hover{background:#fff;color:var(--red)}
/* column reordering: drag the header, standard gesture in any data explorer */
table.pk th{cursor:grab}
table.pk th.dragging{opacity:.4;cursor:grabbing}
table.pk th.dropL{box-shadow:inset 3px 0 0 var(--accent)}
table.pk th.dropR{box-shadow:inset -3px 0 0 var(--accent)}
.sbody{flex:1;overflow:auto;position:relative}
table.pk{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
table.pk th{position:sticky;top:0;background:#f8fafc;text-align:left;font-size:10px;font-weight:800;
  letter-spacing:.5px;text-transform:uppercase;color:#7c8798;padding:8px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
table.pk th.new{color:var(--accent);background:var(--accent-soft)}
table.pk td{padding:7px 10px;border-bottom:1px solid #f0f2f6;vertical-align:top;line-height:1.4}
table.pk tr.r{cursor:pointer}
table.pk tr.r:hover td{background:#fafbfd}
table.pk tr.cut td{color:#8a919c}
table.pk td.new{background:rgba(56,88,198,.045);font-weight:650}
table.pk td.txt{color:var(--muted);font-style:italic}
table.pk td b{font-weight:700}
.pkpill{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  padding:2px 7px;border-radius:20px;border:1px solid}
.pkpill.keep{color:var(--green);border-color:#bfe3d6;background:#eef8f4}
.pkpill.cut{color:var(--red);border-color:#f3c9c4;background:var(--red-soft)}
.pkpill.wait{color:#8a6a12;border-color:#e8dfae;background:#fbf7e6}
.pkwhy{font-size:10.5px;color:#8a919c;font-style:italic;margin-top:2px}
.pkx td{background:#f8fafc !important;padding:10px 12px 12px}
.pkx .kvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:6px 16px}
.pkx .prov{border-left:2px solid var(--line);padding:0 0 0 10px;margin:0 0 11px}
.pkx .prov:last-child{margin-bottom:0}
.pkx .prov.self{border-left-color:var(--accent)}
.pkx .prov .pl{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:#9aa5b3;margin-bottom:5px}
.pkx .prov.self .pl{color:var(--accent)}
.pkx .kv1{display:flex;gap:8px;font-size:11.5px;border-bottom:1px dotted #e3e7ec;padding-bottom:3px}
.pkx .kv1 .k{color:#8b95a5;flex:0 0 108px}
.pkx .kv1 .v{color:var(--ink);font-weight:600;word-break:break-word}
.pkx .kv1 .v.na{color:#b6c0cd;font-weight:400;font-style:italic}
.sfoot{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:9px 14px;
  border-top:1px solid var(--line);background:#fbfcfd;flex-wrap:wrap}
.sfoot .lbl{font-size:12px;font-weight:700}
.sfoot .note{font-size:11px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.4}
/* hangs off the bottom edge as a little tab: the card's corners are already taken by
   the run badge and the lint dot, and the footer row is the live count in run mode */
.peek{position:absolute;right:9px;bottom:-11px;height:21px;padding:0 7px;border-radius:6px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;
  display:flex;align-items:center;gap:4px;font:inherit;font-size:9.5px;font-weight:800;
  letter-spacing:.5px;text-transform:uppercase;box-shadow:0 2px 6px rgba(20,28,45,.12);
  opacity:0;transition:opacity .12s,color .12s;z-index:11}
.node:hover .peek,.node.spot .peek{opacity:1}
.peek:hover{color:var(--accent);border-color:#c9d7f8;background:var(--accent-soft)}
.peek svg.ic{width:12px;height:12px}
.node.peeking{border-color:var(--accent)}
.node.peeking .peek{opacity:1;color:#fff;background:var(--accent);border-color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(15,22,38,.42);z-index:1000;display:none}
.scrim.on{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1001;width:560px;
  max-width:calc(100vw - 32px);max-height:calc(100vh - 60px);overflow:auto;background:var(--panel);
  border-radius:15px;box-shadow:var(--shadow-lg);display:none}
.modal.on{display:block}
.mhead{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.mhead h2{margin:0;font-size:17px}
.mhead .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.mbody{padding:16px 18px 18px;font-size:13.5px;line-height:1.6}
.mbody p{margin:0 0 10px}
.dclose{font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.quote{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin:12px 0}
.quote .qr{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-size:12.5px;
  border-bottom:1px solid var(--line)}
.quote .qr:last-child{border-bottom:0;background:#fbfcfd;font-weight:750}
.quote .qr b{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1200;background:#1c2330;
  color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:10px;
  box-shadow:0 10px 30px rgba(15,22,38,.35);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-3px)}
.toast.ok{background:#14603e}.toast.warn{background:#7a4a10}

/* ---------------- tutorial layer ---------------- */
.tut-shield{position:fixed;inset:0;z-index:100000}
.tut-halo{position:fixed;z-index:100001;border-radius:12px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(15,22,38,.55),0 0 0 2.5px var(--accent);transition:box-shadow .18s ease}
.tut-card{position:fixed;z-index:100002;width:356px;max-width:calc(100vw - 24px);background:#fff;
  border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-lg);padding:15px 17px 13px;
  font-size:13px;line-height:1.55}
.tut-card h4,.tut-mini h4{margin:0 0 6px;font-size:14.5px}
.tut-kicker{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  color:var(--accent);margin-bottom:4px}
.tut-body{color:#414c5e}
.tut-body code{background:#f0f3f8;border-radius:4px;padding:0 4px;font-size:12px}
.tut-foot{display:flex;align-items:center;gap:8px;margin-top:12px}
.tut-step{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tut-x{position:absolute;top:9px;right:12px;cursor:pointer;color:var(--muted);font-size:14px;line-height:1}
.tut-link{color:var(--accent);font-weight:650;font-size:12.5px;cursor:pointer}
.tut-spot{position:absolute;z-index:45;width:19px;height:19px;border-radius:50%;border:0;padding:0;
  background:var(--accent);color:#fff;font-size:11.5px;font-weight:800;line-height:19px;text-align:center;
  cursor:pointer;box-shadow:0 1px 6px rgba(56,88,198,.4);animation:tutPulse 2.2s infinite}
.tut-spot:hover{filter:brightness(1.12);animation:none}
@keyframes tutPulse{0%{box-shadow:0 0 0 0 rgba(56,88,198,.35)}70%{box-shadow:0 0 0 8px rgba(56,88,198,0)}100%{box-shadow:0 0 0 0 rgba(56,88,198,0)}}
.tut-mini{position:absolute;z-index:78;width:320px;max-width:calc(100vw - 24px);background:#fff;
  border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 34px rgba(15,22,38,.22);
  padding:13px 15px 11px;font-size:12.5px;line-height:1.55}
.tut-intro{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:78;width:452px;
  max-width:calc(100vw - 24px);background:#fff;border:1px solid #c9d7f8;border-radius:13px;
  box-shadow:0 12px 38px rgba(15,22,38,.22);padding:14px 16px 12px;font-size:13px;line-height:1.55}

/* ===========================================================================
   PORTFOLIO — the home screen. Every list at a glance; the canvas is what you
   get when you open ONE of them. Kept as a sibling of .shell rather than a
   canvas mode: it has no camera, no graph and no plan, so making it a mode
   would mean every canvas affordance needs a "not at home" guard.
   =========================================================================== */
#home{display:none;flex:1 1 auto;min-height:0;overflow:auto;background:var(--bg)}
.athome #home{display:block}
.top,#enginebar,#waitbar,#progstrip{flex:0 0 auto}
.athome .shell{display:none}
.athome #modeseg,.athome #rollup,.athome #vocabseg{display:none}
.athome .lswitch{display:none}
.homeback{display:inline-flex}
.athome .homeback{display:none}

/* --- list switcher in the top bar --- */
.lswitch{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink);
  background:#fbfcfd;border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer;
  max-width:330px}
.lswitch:hover{border-color:#c3cede}
.lswitch .lsn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lswitch .cv{color:var(--muted);font-size:10px}
.lmenu{position:absolute;top:50px;left:112px;z-index:96;width:340px;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-lg);padding:6px;display:none}
.lmenu.on{display:block}
.lmenu .li{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;
  font-size:12.5px}
.lmenu .li:hover{background:var(--accent-soft)}
.lmenu .li.cur{background:var(--accent-soft);font-weight:700}
.lmenu .li .d{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.lmenu .li .sub{color:var(--muted);font-size:11px;margin-left:auto;white-space:nowrap}
.lmenu .sep{border-top:1px solid var(--line);margin:5px 2px}
.lmenu .all{font-weight:700;color:var(--accent)}

/* --- portfolio body --- */
.pfwrap{max-width:1080px;margin:0 auto;padding:22px 20px 56px}
.pfh1{font-size:20px;font-weight:800;letter-spacing:-.3px;margin:0 0 3px}
/* the one row that survives when a list is being worked and the portfolio is put away */
.pfsolo{margin:0 0 10px}
.pfh1s{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.kpis{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 13px;
  box-shadow:var(--shadow);min-width:104px}
.kpi b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.kpi span{font-size:11px;color:var(--muted);font-weight:600}
.kpi.run b{color:var(--teal)} .kpi.attn b{color:var(--amber)} .kpi.err b{color:var(--red)}

.pfcard{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);
  padding:15px 17px 14px;margin-bottom:13px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.pfcard:hover{border-color:#c3cede;box-shadow:0 2px 5px rgba(20,28,45,.09),0 10px 26px rgba(20,28,45,.09)}
.pfcard.arch{opacity:.62}
.pftop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:2px}
.pfname{font-size:15px;font-weight:750;letter-spacing:-.2px}
.pfpill{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  border-radius:999px;padding:2px 7px;border:1px solid}
.pfpill.lock{background:var(--green-soft);color:var(--green);border-color:#bfe3cd}
.pfpill.block{background:var(--amber-soft);color:var(--amber);border-color:#f0dcb8}
.pfpill.build{background:var(--acct-soft);color:var(--acct);border-color:#cfe3ee}
.pfpill.people{background:var(--cont-soft);color:var(--cont);border-color:#f0dcc0}
.pforigin{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.pfcount{font-size:12.5px;color:var(--muted);margin-bottom:9px}
.pfcount b{color:var(--ink);font-weight:750}

/* the 10-stage funnel bar: the engine's own stage vocabulary, one segment each */
.fbar{display:flex;gap:3px;margin-bottom:9px}
.fseg{flex:1;border-radius:5px;padding:5px 4px 4px;text-align:center;font-size:9.5px;font-weight:700;
  letter-spacing:-.1px;border:1px solid;line-height:1.2;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.fseg.done{background:var(--green-soft);color:var(--green);border-color:#c8e6d4}
.fseg.run {background:#e7f5f1;color:var(--teal);border-color:#b8e0d5}
.fseg.attn{background:var(--amber-soft);color:var(--amber);border-color:#f0dcb8}
.fseg.open{background:#fbfcfd;color:var(--muted);border-color:var(--line)}
.fseg.todo{background:#fafbfc;color:#9aa5b3;border-color:#eef1f5}

.pfrow{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:7px}
.pfrow b{color:var(--ink);font-weight:700}
.pfjob{display:flex;align-items:center;gap:8px;background:#e7f5f1;border:1px solid #b8e0d5;
  border-radius:9px;padding:7px 11px;font-size:12px;color:#0b6b57;margin-bottom:7px}
.pfjob.stall{background:var(--red-soft);border-color:#f3c9c4;color:var(--red)}
.pfjob .bar{flex:1;height:5px;background:#cfe9e1;border-radius:3px;overflow:hidden;min-width:60px}
.pfjob .bar i{display:block;height:100%;background:var(--teal)}
.pfnext{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--amber);font-weight:600}
.pfnext.ok{color:var(--muted);font-weight:500}
.pfspend{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600}
/* collection progress: measured against the scope you ASKED for, never the seeded city table */
.pfcoll{background:var(--acct-band);border:1px solid #d8e8f0;border-radius:9px;padding:7px 11px;
  font-size:12px;color:var(--acct);margin-bottom:7px}
.pfcoll .note{color:var(--muted);font-weight:500}
.pfnew{display:block;width:100%;text-align:left;background:var(--panel);border:1px dashed #c3cede;
  border-radius:13px;padding:15px 17px;font-size:13px;font-weight:650;color:var(--accent);cursor:pointer}
.pfnew:hover{background:var(--accent-soft)}
.pfsect{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);
  margin:20px 0 9px}

/* ============================================================================
   THE OPERATING SURFACE — where a step stands, starting one, and calling things done
   ----------------------------------------------------------------------------
   Everything below arrived when the board stopped being a picture of a plan and became
   the thing you operate. Three bars stack under the header, outermost first: the engine
   banner (something is wrong), the waiting-work bar (work the board never drew), and
   the progress strip (how done this list is, and what the tail costs).
   ============================================================================ */
.enginebar{display:none}
.enginebar.on{display:flex;gap:8px;align-items:center;padding:9px 16px;font-size:12.5px;
  background:#fdecec;color:#8a2019;border-bottom:1px solid #f3bdbd}
.stchip{position:absolute;top:-9px;left:12px;font-size:9.5px;font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid;white-space:nowrap;
  background:#fff}
.st-run{background:#e8f2ff;color:#1c5fb0;border-color:#bcd8f7}
.st-wait{background:var(--amber-soft);color:var(--amber);border-color:#f0dcb8}
.st-done{background:#eefaf3;color:#1c7a4f;border-color:#bfe6d2}
.st-bad{background:#fdecec;color:#b3261e;border-color:#f3bdbd}
.st-idle{background:#f4f6fa;color:#7b8794;border-color:var(--line)}
/* ---- the completion model: what is finished recedes, only exceptions speak ----
   complete/closed = gray and quiet. up-to-date = slightly dimmed. reopened = the ONE state
   allowed to highlight: a step declared complete that has grown genuinely new work. The whole
   point is that a nearly-finished list LOOKS nearly finished — and a stray record relights one
   scoped card, never the funnel. */
.st-settled{background:#f1f3f6;color:#8a93a0;border-color:#dde2e9}
.st-reopen{background:#f4ecfd;color:#6b3fa0;border-color:#dcc8f2}
.node.nquiet{opacity:.86}
.node.ncomplete{opacity:.55;filter:grayscale(.85)}
.node.ncomplete:hover{opacity:.9;filter:grayscale(.3)}
.node.nreopen{box-shadow:0 0 0 2px #b98be0,0 8px 22px rgba(107,63,160,.18)}
.sband.sclosed{border-color:#dde2e9;background:repeating-linear-gradient(-45deg,rgba(120,130,145,.05) 0 14px,transparent 14px 28px)}
.sband.sclosed .sthd{background:#f1f3f6;border-bottom-color:#e2e6eb}
.sband.sclosed .sthd b,.sband.sclosed .sthd i{color:#8a93a0}
.sclose,.sreopen{font:650 10.5px/1 inherit;margin-left:auto;padding:5px 9px;border-radius:7px;
  cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted);text-decoration:none}
.sclose:hover,.sreopen:hover{color:var(--ink);border-color:#b6bec9}
body.listdone #world .node:not(.ncomplete){opacity:.6;filter:grayscale(.5)}
body.listdone #world .node:hover{opacity:.95;filter:none}
/* ---- the progress strip: one honest number and the priced tail ---- */
.progstrip{display:none}
.progstrip.on{display:flex;gap:14px;align-items:center;padding:7px 16px;font-size:12px;
  color:var(--muted);background:#fbfcfd;border-bottom:1px solid var(--line)}
.progstrip .pmeter{display:flex;gap:9px;align-items:center}
.progstrip .ppct{font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.progstrip .pbar{width:150px;height:7px;border-radius:99px;background:#e8ecf1;overflow:hidden;display:inline-block}
.progstrip .pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3f8f6a,#1c7a4f)}
.progstrip .ptail{flex:1}
.progstrip .paside{color:#8a93a0}
.progstrip .wbtn{border-color:var(--line);color:var(--muted)}
.progstrip .wbtn:hover{color:var(--ink);border-color:#b6bec9}
.progstrip.isdone{background:#f1f3f6;border-bottom-color:#dde2e9}
.progstrip .pdone{flex:1;color:#4a5560}
.progstrip .pdone i{color:#8a93a0}
/* ---- work this list already has waiting that the board never mentioned ----
   Amber, not red: it is not a fault, it is work. But it must not be quiet either — a list
   sitting on twenty thousand records of unstarted work looked exactly like a finished one. */
.waitbar{display:none}
.waitbar.on{display:block;border-bottom:1px solid #f0dcb8;background:#fffaf0}
.waitbar .wbhead{display:flex;gap:10px;align-items:center;padding:9px 16px;font-size:12.5px;
  color:var(--amber);cursor:pointer;user-select:none}
.waitbar .wbhead b{font-weight:800}
.waitbar .wbhead .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.wbtn{font:650 11.5px/1 inherit;padding:7px 11px;border-radius:8px;cursor:pointer;
  border:1px solid #f0dcb8;background:#fff;color:var(--amber)}
.wbtn:disabled{opacity:.45;cursor:not-allowed}
.waitbar .wbody{display:none;padding:2px 16px 14px}
.waitbar.open .wbody{display:block}
.wrow{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid #f4e6cd;font-size:12.5px}
.wrow .wt{font-weight:650;color:var(--ink);min-width:190px}
.wrow .wc{color:var(--muted);flex:1;line-height:1.45}
.wrow .wn{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.wrow .wm{font-variant-numeric:tabular-nums;white-space:nowrap;min-width:64px;text-align:right}
.wrow .wm.paid{color:var(--amber);font-weight:700}
.wrow .wm.free{color:#1c7a4f}
/* ---- starting a step, on its own card ---- */
.runbox{margin:12px 0 4px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fbfcfd}
.runbox.reob{border-color:#dcc8f2;background:#fcf9ff}
.runbox .rn{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:8px}
.runbox .rn.why{margin:8px 0 0}
.runbox .rn a{color:inherit;text-decoration:underline;cursor:pointer}
.runbtn{width:100%;font:650 13px/1.3 inherit;padding:10px 12px;border-radius:9px;cursor:pointer;
  border:1px solid #bcd8f7;background:#eef5ff;color:#1c5fb0;display:flex;justify-content:center;gap:8px}
.runbtn b{font-weight:800}
.runbtn.paid{border-color:#f0dcb8;background:var(--amber-soft);color:var(--amber)}
.runbtn:disabled{opacity:.45;cursor:not-allowed}
.runbtn.fexp{display:flex;text-decoration:none;margin-top:8px}
.frow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;
  border-bottom:1px solid #eef1f5}
.frow b{font-variant-numeric:tabular-nums}
.frow.gap span,.frow.gap b{color:var(--amber)}
.armrow{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted);cursor:pointer}
.armrow input:disabled+span{opacity:.6}
/* ---- the review drawer: judging records one at a time ---- */
.rqbox{display:flex;flex-direction:column;max-height:76vh}
.rqhead{display:flex;gap:12px;align-items:center;padding:2px 2px 12px;border-bottom:1px solid var(--line)}
.rqhead b{font-size:14.5px}
.rqhead>span{color:var(--muted);font-size:12px}
.rqhead .sp{flex:1}
.rqlist{overflow-y:auto;padding:4px 2px}
.rqrow{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid #eef1f5}
.rqrow .sp{flex:1}
.rqwho{display:flex;flex-direction:column;gap:2px;font-size:12.5px;min-width:0}
.rqwho b{font-size:13px}
.rqwho i{color:var(--muted);font-style:normal}
.rqwho span{color:var(--muted)}
.rqwho .rqmail{font-variant-numeric:tabular-nums;color:#4a5560}
.rqwho a{color:#1c5fb0;font-size:11.5px;text-decoration:none}
.rqacts{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.rqcands{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.rqcand{display:flex;gap:9px;align-items:center;font-size:12.5px;padding:6px 9px;
  border:1px solid #e6ebf1;border-radius:9px;background:#fbfcfd}
.rqcand .sp{flex:1}
.rqcand a{color:#1c5fb0;font-size:11.5px;text-decoration:none;white-space:nowrap}
.rqcand.rqman{background:#f7f9fb;border-style:dashed}
.rqcand.rqman input{flex:2;font:inherit;font-size:12px;padding:6px 9px;border:1px solid var(--line);
  border-radius:7px;min-width:120px}
/* saved is quiet, unsaved is amber, FAILED is red and does not blend in — the whole point
   of this badge is the state you must not miss */
#savebadge{background:#f4f6fa;color:#8a93a0;border-color:var(--line)}
#savebadge.ok{background:#eefaf3;color:#1c7a4f;border-color:#bfe6d2}
#savebadge.bad{background:#fdecec;color:#b3261e;border-color:#f3bdbd}

/* ============================================================================
   THE PORTFOLIO CARD — one row per list, and what each is waiting for
   ----------------------------------------------------------------------------
   Replaces the first cut's five-line summary. The bar is where the list stands; the
   strip underneath is the numbers you would otherwise open three screens to read; the
   panel under that is work already sitting there that nothing had ever surfaced.
   ============================================================================ */
.pfcard2{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;cursor:pointer}
.pfcard2.arch{opacity:.62}
.pfcard2:hover{border-color:#c9d7f8}
.chead{display:flex;align-items:flex-start;gap:14px;padding:17px 20px 14px}
.ctitle{flex:1;min-width:0}
.ctitle h2{font-size:16.5px;font-weight:800;letter-spacing:-.2px;display:flex;
  align-items:center;gap:9px;flex-wrap:wrap;margin:0}
.origin{font-size:12px;color:var(--muted);margin-top:3px}
.origin.soft{color:#9aa5b3}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
  padding:2.5px 8px;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.pill.lock{color:var(--acct);background:#eaf3f8;border-color:#cfe4ee}
.pill.run{color:var(--green);background:var(--green-soft);border-color:#cbe8d8}
.pill.flag{color:var(--amber);background:var(--amber-soft);border-color:#f2ddbd}
.pill.arch{color:#7b8492;background:#f0f2f5;border-color:#e0e4ea}
.pill.people{color:var(--cont);background:#fdf3e6;border-color:#f2ddbd}
.kept{text-align:right;white-space:nowrap}
.kept .big{font-size:22px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kept .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.openb{flex:0 0 auto;align-self:center;font:600 12.5px/1 inherit;padding:9px 13px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.openb:hover{border-color:#c9d7f8;background:#f8faff;color:var(--accent)}
.funnel{display:flex;gap:3px;padding:0 20px 14px}
.fnseg{flex:1;min-width:0;position:relative}
.fnseg .bar{height:7px;border-radius:4px;background:#e9ecf1}
.fnseg[data-s=done] .bar{background:var(--green)}
.fnseg[data-s=run] .bar{background:var(--accent)}
.fnseg[data-s=attn] .bar{background:#e0a33c}
.fnseg[data-s=open] .bar{background:#c3cad4}
.fnseg .lab{font-size:9.5px;color:var(--muted);margin-top:5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.fnseg[data-s=attn] .lab,.fnseg[data-s=run] .lab{color:var(--ink);font-weight:700}
.fnseg .tip{display:none;position:absolute;bottom:100%;left:0;margin-bottom:7px;z-index:12;
  background:#26303f;color:#fff;font-size:11.5px;line-height:1.35;padding:7px 10px;
  border-radius:8px;width:230px;box-shadow:0 8px 22px rgba(20,28,45,.28)}
.fnseg:hover .tip{display:block}
.strip{display:flex;border-top:1px solid var(--line);flex-wrap:wrap}
.cell{flex:1;min-width:150px;padding:12px 20px;border-right:1px solid var(--line)}
.cell:last-child{border-right:0}
.cell .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.45px;color:#98a2b0;
  font-weight:700;margin-bottom:3px}
.cell .v{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
.cell .v small{font-weight:500;color:var(--muted);font-size:12px}
.cell .n{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.cell.next{background:#fffcf5}
.cell.next .v{color:var(--amber)}
.cell.livejob{background:var(--accent-soft)}
.cell.livejob .v{color:var(--accent)}
.work{border-top:1px solid var(--line);background:#fbfcfd;padding:14px 20px 16px}
.work h3{font-size:12px;text-transform:uppercase;letter-spacing:.45px;color:#7d8794;
  font-weight:800;margin:0 0 3px}
.work .wsub{font-size:12px;color:var(--muted);margin-bottom:11px;max-width:640px}
.bkrow{display:flex;align-items:flex-start;gap:12px;padding:9px 11px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel);margin-bottom:7px;cursor:pointer}
.bkrow:hover{border-color:#c9d7f8;background:#f8faff}
.bkrow .wn{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.bkrow[data-k=forward] .wn{color:var(--green)}
.bkrow[data-k=recheck] .wn{color:var(--purple)}
.bkrow[data-k=back] .wn{color:var(--amber)}
.bkrow .wt{flex:1;min-width:0}
.bkrow .wt b{font-size:13px;display:block}
.bkrow .wt span{font-size:11.5px;color:var(--muted);line-height:1.4;display:block;margin-top:2px}
.cost{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.35px;
  padding:2.5px 8px;border-radius:99px;white-space:nowrap;margin-top:2px}
.cost.free{color:var(--green);background:var(--green-soft)}
.cost.paid{color:var(--amber);background:var(--amber-soft)}
.cost.pennies{color:var(--acct);background:#eaf3f8}
/* a condition nothing can currently act on. It still gets counted and shown — hiding it would
   make the list look tidier than it is — but it must never wear a price, because a price implies
   there is something to buy. */
.cost.none{color:#7b8794;background:#f4f6fa}
.nostep{display:block;margin-top:3px;font-style:italic;opacity:.85}
.pfnote{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--muted);
  padding:10px 20px;border-top:1px solid var(--line);background:#fcfcfd;line-height:1.45}
.pfnote b{color:var(--ink)}
.pfnote .ic2{color:var(--amber);font-weight:800;flex:0 0 auto}
.warnbox{background:var(--amber-soft);border:1px solid #f2ddbd;border-radius:12px;
  padding:14px 16px;margin-bottom:18px;font-size:13px;line-height:1.5}
.warnbox b{display:block;margin-bottom:3px}
/* ---- starting a list: the two halves, stated rather than hidden ---- */
.newbar{display:flex;gap:12px;align-items:center;margin:0 0 18px}
.nhint{font-size:12.5px;color:var(--muted)}
.nbtn{font:650 13px/1 inherit;padding:10px 14px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--ink)}
.nbtn.go{border-color:#bcd8f7;background:#eef5ff;color:#1c5fb0;padding:11px 16px}
.nbtn.sm{font-size:12px;padding:7px 11px}
.nbtn:disabled{opacity:.5;cursor:not-allowed}
.newpanel{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 20px;background:#fff}
.nhead{display:flex;align-items:center;margin-bottom:8px}
.nhead b{font-size:15px}
.nhead .xb{margin-left:auto;border:0;background:0;font-size:20px;cursor:pointer;color:var(--muted)}
.nlede{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 14px;max-width:70ch}
.ntabs{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;
  margin:0 0 14px;background:#fbfcfd;width:fit-content}
.ntab{font:650 12.5px/1 inherit;padding:9px 14px;border:0;background:transparent;color:var(--muted);
  cursor:pointer;border-right:1px solid var(--line)}
.ntab:last-child{border-right:0}
