/* Edges are drawn SYNCHRONOUSLY (layout is readable immediately after the write),
   then settled once more next frame. Never rely on rAF alone — it does not fire
   while the tab/pane is hidden, which leaves the canvas edge-less on load. */
/* every card's rect in world space, for keeping edge labels off them */
function cardRects(){
  return PLAN.nodes.filter(n=>!isRider(n)&&POS[n.id]).map(n=>{
    const e=$(`.node[data-id="${n.id}"]`);
    return {id:n.id,x:POS[n.id].x,y:POS[n.id].y,w:laneOf(n)==="cross"?NWC:NW,h:e?e.offsetHeight:150};});
}
function clearLabel(x,y,w,anchor){
  /* test against EVERY card, including this edge's own two ends. Exempting them was
     the obvious shortcut and the wrong one: the midpoint of a long S-curve out of a
     tall card lands squarely on that same card. */
  const rects=cardRects();
  const box=t=>({x0:anchor==="start"?x:x-w/2,x1:anchor==="start"?x+w:x+w/2,y0:t-11,y1:t+4});
  const hits=t=>{const b=box(t);
    return rects.some(r=>b.x0<r.x+r.w-3&&b.x1>r.x+3&&b.y0<r.y+r.h-3&&b.y1>r.y+3);};
  if(!hits(y))return {x,y};
  /* try just above, then just below, in widening steps — the gaps between staggered
     rows are large, so this almost always lands on the first or second attempt */
  for(let d=16;d<=190;d+=16){
    if(!hits(y-d))return {x,y:y-d};
    if(!hits(y+d))return {x,y:y+d};
  }
  return {x,y};
}
function renderEdges(){
  const svg=$("#edges");
  svg.setAttribute("width",WORLD.w);svg.setAttribute("height",WORLD.h);
  const maxV=Math.max(1,...PLAN.nodes.map(n=>G[n.id]?G[n.id].out:0));  /* G lacks riders by design */
  let h="";
  edgeList().forEach(e=>{
    const a=POS[e.from.id],b=POS[e.to.id];if(!a||!b)return;
    const aw=laneOf(e.from)==="cross"?NWC:NW;
    const ael=$(`.node[data-id="${e.from.id}"]`), bel=$(`.node[data-id="${e.to.id}"]`);
    const ah=ael?ael.offsetHeight:104, bh=bel?bel.offsetHeight:104;
    const g=G[e.from.id]||{out:0};
    const skip=e.from.skipped||e.to.skipped;
    const vol=g.out||0;
    const wd=skip?1.6:1.7+Math.sqrt(vol/maxV)*8.2;
    let d,lx,ly,anchor="middle";
    if(b.x<a.x+aw-20){                                   // downstream sits left/below → vertical
      const x=a.x+aw/2;
      d=`M ${x} ${a.y+ah} C ${x} ${a.y+ah+24}, ${x} ${b.y-24}, ${x} ${b.y}`;
      lx=x+9;ly=(a.y+ah+b.y)/2+4;anchor="start";
    }else if(Math.abs(a.y-b.y)>52){                      // lane / row change → S-curve
      const x1=a.x+aw,y1=a.y+ah/2,x2=b.x,y2=b.y+bh/2,mx=(x1+x2)/2;
      d=`M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
      lx=mx;ly=(y1+y2)/2-9;
    }else{
      const y=a.y+ah/2;
      d=`M ${a.x+aw} ${y} L ${b.x} ${b.y+bh/2}`;
      lx=(a.x+aw+b.x)/2;ly=y-11;
    }
    const est=mode!=="run";
    let label="";
    if(!skip&&vol){
      const grainWord=G[e.from.id].grainOut;
      label=vocab==="plain"?`${num(vol)} ${grainWord}`:num(vol);
      const kp=reg(e.to).keep;
      if(!est&&runOf(e.from).st!=="done")label=num(vol)+" est.";
      /* The stagger clears most labels; a lane-crossing edge can still drop its label
         on a card that happens to sit between its two ends, because the midpoint of a
         long S-curve is nowhere near either end. Nudge it clear rather than leaving a
         count half-hidden — an unreadable number is worse than no number, because you
         cannot tell it is unreadable. */
      const lp=clearLabel(lx,ly,label.length*6.4,anchor);
      lx=lp.x;ly=lp.y;
      h+=`<text class="elab ${est?"est":""}" x="${lx}" y="${ly}" text-anchor="${anchor}">${label}</text>`;
      if(reg(e.to).grain==="cross"&&kp)h+=`<text class="esub" x="${lx}" y="${ly+12}" text-anchor="${anchor}">crosses the lock</text>`;
    }
    h=`<path d="${d}" fill="none" stroke="${skip?"#c8d0da":"#9aa6b6"}" stroke-width="${wd}"
        ${skip?'stroke-dasharray="5 4"':""} stroke-linecap="round" opacity="${skip?.8:.55}"/>`+h;
  });
  /* --- rework: the return path, drawn UNDER the row so it cannot be mistaken for
     the main flow. Dashed, warm, arrow pointing left, labelled with how many
     records travel it. This is the loop that used to be invisible. --- */
  reworkEdges().forEach(e=>{
    const a=POS[e.from.id],b=POS[e.to.id];if(!a||!b)return;
    const ael=$(`.node[data-id="${e.from.id}"]`),bel=$(`.node[data-id="${e.to.id}"]`);
    const ah=ael?ael.offsetHeight:120, bh=bel?bel.offsetHeight:120;
    const y0=a.y+ah, y1=b.y+bh;
    const lb=LANEBOX[laneOf(e.to)]||LANEBOX.contact;
    const dip=Math.max(y0,y1,lb.y+lb.h)+22;
    const x0=a.x+NW/2, x1=b.x+NW/2;
    const d=`M ${x0} ${y0} C ${x0} ${dip}, ${x1} ${dip}, ${x1} ${y1}`;
    const back=Math.round(((G[e.from.id]||{out:0}).out||0)*reworkShare(e.from));
    h+=`<path d="${d}" fill="none" stroke="#c98a3c" stroke-width="2.2" stroke-dasharray="7 5"
         stroke-linecap="round" opacity=".75"/>
        <path d="M ${x1} ${y1} l -5 9 l 10 0 z" fill="#c98a3c" opacity=".85"/>
        <text class="elab rwk" x="${(x0+x1)/2}" y="${dip+4}" text-anchor="middle">${num(back)} back for re-checking</text>`;
  });
  svg.innerHTML=h;
  /* insertion affordances: a "+" on every edge */
  $$(".ins").forEach(x=>x.remove());
  edgeList().forEach(e=>{
    if(e.from.skipped||e.to.skipped)return;
    const a=POS[e.from.id],b=POS[e.to.id];
    const aw=laneOf(e.from)==="cross"?NWC:NW;
    if(b.x<a.x+aw-20)return;
    const el=N("button","ins","+");
    el.style.left=((a.x+aw+b.x)/2-10)+"px";
    el.style.top=((a.y+b.y)/2+42)+"px";
    el.title="Insert an action here";
    el.onclick=ev=>{ev.stopPropagation();openPalette({after:e.from.id,before:e.to.id});};
    $("#world").appendChild(el);
  });
}
/* ============================================================================
   6b · ENTAILED ACTIONS — not everything on the canvas is a free choice
   ----------------------------------------------------------------------------
   Most actions are genuinely independent: you pick them because you want what
   they produce. Two are not, and pretending otherwise is how a plan ends up
   billing per record for the same company twice.

   1. REQUIRED JOIN. The moment a plan has TWO sources of the same kind of
      record, merging them stops being an option and becomes a consequence.
      Two collectors that never meet do not produce one list — they produce two
      lists in one table, and every per-record price downstream is paid twice on
      the overlap. So the merge is created automatically, every source is wired
      INTO it, and everything that used to follow a source now follows the merge.
      It cannot be deleted while two sources exist; removing a source is how you
      remove the merge. It is drawn as a confluence, not as another step in a
      row, because "these two become one here" is the whole content of it.

   2. RIDER. A snapshot is not a stage you watch — it is a seatbelt on the step
      after it. It gets no card of its own; it renders as a band across the top
      of the step it protects. A rider takes no column, no row, and no place in
      the funnel arithmetic.

   Both are the same idea: the graph is not only what you chose, it is also what
   your choices entail. Making that structural rather than advisory is the
   difference between a plan checker that warns you and a canvas that cannot
   draw the wrong thing.
   ============================================================================ */
const JOIN_FOR={account:"pool_reconcile",contact:"email_dedupe"};
function isRider(n){return !!REGISTRY[n.action]&&!!REGISTRY[n.action].rider;}
function riderHost(n){                     // the step a rider protects
  const s=PLAN.nodes.filter(x=>x.after.includes(n.id)&&!isRider(x));
  return s[0]||null;
}
function ridersOn(host){
  return PLAN.nodes.filter(n=>isRider(n)&&!n.skipped&&host.after.includes(n.id));
}
function reaches(fromId,toId){            // is there any path from -> to?
  const seen=new Set();
  const walk=id=>{
    if(id===toId)return true;
    if(seen.has(id))return false;
    seen.add(id);
    return PLAN.nodes.filter(x=>x.after.includes(id)).some(x=>walk(x.id));
  };
  return walk(fromId);
}
function enforceStructure(){
  let changed=false;
  /* Defaults are part of the plan the moment a step is on the canvas. They used to be
     applied only when the setup sheet was opened, so a step with a perfectly good default
     read as "has not been set up" until somebody clicked its gear and clicked away again —
     a blocking error you clear by looking at it. */
  PLAN.nodes.forEach(n=>{if(!n.params&&SETUP[n.action]){setDefaults(n);changed=true;}});
  Object.keys(JOIN_FOR).forEach(grain=>{
    const act=JOIN_FOR[grain];
    const srcs=PLAN.nodes.filter(n=>!n.skipped&&reg(n).phase==="collect"&&reg(n).grain===grain);
    let join=PLAN.nodes.find(n=>n.action===act&&!n.skipped);
    if(srcs.length>=2){
      if(!join){
        const jid="join_"+act;
        join={id:jid,action:act,after:srcs.map(s=>s.id),required:true,auto:true};
        /* whatever used to follow a source now follows the merge instead */
        PLAN.nodes.forEach(x=>{
          if(x.id===jid)return;
          if(x.after.some(a=>srcs.some(s=>s.id===a))){
            x.after=x.after.filter(a=>!srcs.some(s=>s.id===a));
            if(!x.after.includes(jid))x.after.push(jid);
          }
        });
        PLAN.nodes.push(join);changed=true;
      }else{
        /* Only wire a source in directly if it does not ALREADY reach the merge by
           some other path — otherwise a plan that legitimately routes a source
           through a website-finding step first grows a redundant second edge. */
        srcs.forEach(s=>{
          if(!join.after.includes(s.id)&&!reaches(s.id,join.id)){
            join.after.push(s.id);changed=true;}});
        if(!join.required){join.required=true;changed=true;}
      }
      if(join)join.srcCount=srcs.length;
    }else if(join&&join.required){join.required=false;changed=true;}
  });
  /* --- generalised entailment ------------------------------------------------
     The required join was the first of these and turned out not to be the only
     one. Three shapes, all "you did not choose this, your other choice chose it":
       before — a cheap gate that must run first (the free mail check before the
                paid address check: skipping it means paying to verify addresses
                whose domain accepts no mail at all)
       after  — a step that settles what this one only proposes (a guessed address
                is a hypothesis; a machine-picked decision-maker is a suggestion)
       rider  — a guard attached to the step, not a stage of its own (the restore
                point before a bulk rewrite)
     All three are created automatically, marked required, and refuse deletion —
     the same treatment the join already got, for the same reason. A warning you
     can ignore is not a rule.
     -------------------------------------------------------------------------- */
  const byAction=a=>PLAN.nodes.find(n=>n.action===a&&!n.skipped);
  PLAN.nodes.filter(n=>!n.skipped&&reg(n).entails).slice().forEach(host=>{
    const e=reg(host).entails;
    (e.before||[]).forEach(act=>{
      let g=byAction(act);
      if(!g){
        g={id:"ent_"+act,action:act,after:host.after.slice(),required:true,auto:true};
        PLAN.nodes.push(g);changed=true;
      }
      /* wire it in only if it does not ALREADY reach the host by some other path,
         or a plan that legitimately routes through it grows a redundant edge */
      if(!reaches(g.id,host.id)){
        host.after=host.after.filter(a=>a!==g.id).concat(g.id);changed=true;}
      if(!g.required){g.required=true;changed=true;}
    });
    (e.after||[]).forEach(act=>{
      let g=byAction(act);
      if(!g){
        g={id:"ent_"+act,action:act,after:[host.id],required:true,auto:true};
        PLAN.nodes.push(g);changed=true;
      }else if(!g.after.includes(host.id)&&!reaches(host.id,g.id)){
        g.after.push(host.id);changed=true;}
      if(!g.required){g.required=true;changed=true;}
    });
    (e.rider||[]).forEach(act=>{
      let g=byAction(act);
      if(!g){
        g={id:"ent_"+act,action:act,after:[host.id],required:true,auto:true};
        PLAN.nodes.push(g);changed=true;
      }else if(!g.after.includes(host.id)){g.after.push(host.id);changed=true;}
      if(!g.required){g.required=true;changed=true;}
    });
  });
  return changed;
}

/* ============================================================================
   6c · REWORK — records that travel BACKWARDS
   ============================================================================
   The old system's worst tedium, as the operator described it: "running certain steps would
   automatically create conditions that pushed those records back up the funnel
   and now needed to be tested again... small little batches of records moving
   into different parts of the funnel."
   The canvas could not draw that, so it was invisible, and invisible rework is
   the kind you do by hand at midnight.
   A rework edge is DERIVED, not declared: a recovery step re-produces a field
   that some EARLIER step consumes, so the records it touches are owed that
   earlier step again. Nothing new has to be maintained in the registry — the
   loop falls out of requires/produces, which is the only honest source for it.
   ========================================================================== */
function reworkEdges(){
  const out=[],live=PLAN.nodes.filter(n=>!n.skipped&&!isRider(n));
  live.filter(n=>reg(n).recover).forEach(n=>{
    const made=new Set(reg(n).produces||[]);
    live.forEach(m=>{
      if(m.id===n.id)return;
      if(PHASE_ORDER[reg(m).phase]>PHASE_ORDER[reg(n).phase])return;   // forward, not rework
      if(!(reg(m).requires||[]).some(f=>made.has(f)))return;
      if(m.action==="mx_preflight")return;      // already covered by the step it gates
      out.push({from:n,to:m,field:(reg(m).requires||[]).find(f=>made.has(f))});
    });
  });
  return out;
}
/* the share of a recovery step's output that actually loops back */
function reworkShare(n){return Math.max(0,(scaled(n).keep||1)-1);}

/* ============================================================================
   6d · BATCHES — "where are all these stacks?"
   ============================================================================
   The operator: "whenever a subset of leads moves out from the core flow... we would
   represent that somewhere. That's one of the weaknesses of the old system...
   maybe there's like some icons, stacks of paper, indicating records, and as
   they move through that stack might get split."
   The old tools only ever showed a per-step percentage, which silently assumes
   one cohort marching left to right. It never was one cohort. At any moment a
   list is several piles in several places: the one being worked, the one parked
   waiting on a human, the one that was cut, and the one that came BACK. A
   percentage cannot express "1,200 of these are sitting in a review queue and
   380 have looped back to be re-checked", so nobody could see it.
   Batches are DERIVED from run state every frame — never stored. A stored pile
   is a pile that goes stale the moment anything moves.
   ========================================================================== */
/* ============================================================================
   6e · WORK ORDERS — a piece of work is not a stage
   ============================================================================
   The operator, describing what actually went wrong in the old tool: "I'd be evaluating
   things, clicking, omitting, combining, accepting, updating — and a bunch of leads
   would move back in the funnel, and new rules would be proposed, and you'd have to
   re-run things, and it got confusing... rather than just a piece of information on
   the card, which makes you think it's just that stage again, maybe that piece of
   work should live on its own block. Here is a piece of work that needs to be done
   with a certain set of contacts because of changes that were made."

   He is naming a real distinction the tool did not have:

     A STAGE is a CAPABILITY. "Check the emails are deliverable" is a thing the
     system can do, permanently, to whatever arrives.

     A WORK ORDER is an EVENT. "These 182 addresses need re-checking because a
     re-read found them on 2026-07-28" has an identity, a cause, a size, a status
     and an end. It is not the stage running again; it is one specific job that
     happens to use that stage.

   Collapsing the second into a counter on the first is exactly why the old system
   got confusing: every change you made — a merge, an omission, a taught rule, a
   hand edit — dissolved into a number that looked like ordinary throughput. You
   could see that something had moved and never what, or why, or whether it was
   finished.

   THE UNIFICATION worth keeping: a work order is the VISIBLE FORM OF THE FRESHNESS
   RULE. That rule says a step reprocesses a record when its inputs are newer than
   its own last answer. A work order is one such set, named: these records, this
   step, because this changed, at this time. It is not a parallel bookkeeping
   system bolted alongside the funnel — it is the same mechanism given a face.

   Three things create one, and they are the three that were named:
     back    — a recovery step found data that invalidates an earlier step's answer
     recheck — a rule was taught or changed, so settled records must be re-tested
     forward — records became eligible for a step they were previously skipped by
   ========================================================================== */
const WORK_KIND={
  back   :{lab:"back for re-checking",cls:"k-back",  ico:"↺"},
  recheck:{lab:"to be re-tested",cls:"k-recheck",ico:"⚖"},
  forward:{lab:"newly eligible",cls:"k-fwd",   ico:"→"}
};
let WORK=[], WORK_SEQ=0, WORK_OPEN=null;
function addWork(o){
  const w=Object.assign({id:"w"+(++WORK_SEQ),status:"waiting",pct:0,n:0},o);
  /* one open order per (step, cause): a second taught rule of the same kind should grow
     the existing job, not litter the canvas with near-identical tokens */
  const same=WORK.find(x=>x.step===w.step&&x.cause===w.cause&&x.status!=="done");
  if(same){same.n+=w.n;return same;}
  WORK.push(w);return w;
}
function workAt(id){return WORK.filter(w=>w.step===id&&w.status!=="done");}
function openWork(){return WORK.filter(w=>w.status!=="done");}
/* the token that hangs off the left edge of the step that will do the work — near the
   tool, but plainly not part of it */
function workHTML(n){
  const ws=workAt(n.id);if(!ws.length)return "";
  return ws.map((w,i)=>`<div class="wo ${WORK_KIND[w.kind].cls}${WORK_OPEN===w.id?" on":""}"
      data-wo="${w.id}" style="top:${16+i*52}px"
      title="${num(w.n)} ${WORK_KIND[w.kind].lab} — ${w.cause}">
      <b>${num(w.n)}</b><i>${WORK_KIND[w.kind].ico}</i>
      ${w.status==="running"?`<u style="width:${Math.round(w.pct)}%"></u>`:""}</div>`).join("");
}
function workPanelHTML(){
  const ws=openWork();
  if(!ws.length)return "";
  return `<div class="sec"><div class="ph" style="margin-bottom:7px">Work waiting to be done</div>
    <div class="sub" style="margin:0 0 8px">Not stages — <b>jobs</b>. Each one exists because

    <div class="woset">${ws.map(w=>{

          <em>${w.status==="running"?Math.round(w.pct)+"% done":w.status==="waiting"?"not started":"done"}</em></span>
      </div>`;}).join("")}</div></div>`;

const BATCH_KIND={
  moving  :{lab:"being worked",   cls:"bk-move"},
  waiting :{lab:"waiting to start",cls:"bk-wait"},
  held    :{lab:"waiting on you", cls:"bk-held"},
  cut     :{lab:"cut here",       cls:"bk-cut"}
};
function batches(){
  const out=[];
  PLAN.nodes.filter(n=>!n.skipped&&!isRider(n)).forEach(n=>{
    const s=runOf(n),g=G[n.id];if(!g)return;
    if(s.st==="running")out.push({at:n.id,kind:"moving",n:Math.max(0,Math.round(g.billable-s.done))});
    if(s.st==="blocked"&&preds(n).some(p=>runOf(p).st==="done"))
      out.push({at:n.id,kind:"waiting",n:Math.round(g.in)});
    if(s.st==="needs")out.push({at:n.id,kind:"held",n:s.queue||0});
    if(s.st==="done"&&g.in-g.out>0.5)out.push({at:n.id,kind:"cut",n:Math.round(g.in-g.out)});
  });
  /* records that came BACK are deliberately NOT a pile on the card any more. A pile on
     a card reads as "this stage again"; a returning batch is a job with a cause and an
     end, so it gets its own object. See work orders above. */
  return out.filter(b=>b.n>0);
}
function batchesAt(id){return batches().filter(b=>b.at===id);}
/* stack thickness reads as size at a glance; the number is there for when it matters */
function stackHTML(n){
  if(mode!=="run")return "";
  const bs=batchesAt(n.id);if(!bs.length)return "";
  const big=Math.max(1,...batches().map(b=>b.n));
  return `<div class="stax">${bs.map(b=>{
    const k=BATCH_KIND[b.kind],sheets=Math.max(2,Math.min(6,Math.round(2+4*Math.sqrt(b.n/big))));
    return `<div class="stk ${k.cls}" title="${num(b.n)} ${k.lab}${b.from?" from "+reg(PLAN.nodes.find(x=>x.id===b.from)).plain.title:""}">
      <span class="sh">${Array.from({length:sheets},()=>"<i></i>").join("")}</span>
      <b>${num(b.n)}</b></div>`;}).join("")}</div>`;
}

  requestAnimationFrame(()=>{renderEdges();drawMinimap();sizeScrim();});

}

/* ============================================================================
   7 · PLAN LINT — the standing rules, checked as graph properties
   ============================================================================ */
/* What each entry point hands us on day one. A list that starts from a Sales Navigator
   export already HAS names, titles and profile links — no step produced them, but they
   are just as present as if one had. Both the lint and the palette must treat these as
   satisfied or every non-empty entry point looks broken. */
const ENTRY_GIVES={
  nothing:[],
  accounts:["account.name","account.website","account.city","account.state"],
  contacts_li:["contact.name","contact.title","contact.linkedin"],
  contacts_email:["contact.name","contact.email"],
  site_emails:["account.name","account.website","contact.email_raw"]
};
let LINTS=[],LINTBY={};
function ancestors(n,set){
  set=set||new Set();
  preds(n).forEach(p=>{if(!set.has(p.id)){set.add(p.id);ancestors(p,set);}});
  return set;
}
/* Which registry action should satisfy a missing input for `target`?
   Not simply the first one that produces the key — several do, and a COLLECTION
   source (e.g. "pull a Sales Navigator search") technically produces
   contact.linkedin while being completely wrong as a mid-plan fix. Rank by:
   can it actually run here (requires already available) → is it the same grain as
   the step that needs it → is it not a list-starting collection step. */
function bestProducer(key,target){
  const avail=new Set(ENTRY_GIVES[PLAN.entry]||[]);
  [...ancestors(target)].forEach(id=>{const x=PLAN.nodes.find(y=>y.id===id);
    if(x&&!x.skipped)(reg(x).produces||[]).forEach(p=>avail.add(p));});
  const wantGrain=reg(target).grain;
  const cands=Object.keys(REGISTRY).filter(k=>(REGISTRY[k].produces||[]).includes(key));
  if(!cands.length)return null;
  const score=k=>{
    const r=REGISTRY[k];
    const unmet=(r.requires||[]).filter(x=>!avail.has(x)).length;
    return unmet*100                                        // must be runnable here
      + (r.phase==="collect"?40:0)                          // never a fresh source mid-plan
      + (r.grain===wantGrain?0:8)                           // prefer the same grain
      + (r.unit>0?2:0);                                     // prefer the cheaper option
  };
  return cands.sort((a,b)=>score(a)-score(b))[0];
}
function lint(){
  LINTS=[];LINTBY={};
  /* riders never enter the lint working set: they have no volume, cost or lane, so
     every check that reads G[n.id] would hit undefined on them */
  const live=PLAN.nodes.filter(n=>!n.skipped&&!isRider(n));
  const t=totals();
  /* One finding per KIND, not per offending node — the same structural mistake on five
     nodes is one thing to fix, and five copies of it reads as noise. Extra offenders are
     counted on the first card and still get their own node badge. */
  const kinds={};
  const add=o=>{
    if(o.kind&&kinds[o.kind]){
      kinds[o.kind].more=(kinds[o.kind].more||0)+1;
      if(o.node&&!LINTBY[o.node])LINTBY[o.node]=kinds[o.kind];
      return;
    }
    if(o.kind)kinds[o.kind]=o;
    LINTS.push(o);
    if(o.node&&(!LINTBY[o.node]||o.sev==="stop"))LINTBY[o.node]=o;
  };

  /* 0 · THE SAME PAID STEP TWICE.
     Found the first time a real plan was assembled in the live build: adding the address
     guess auto-created the deliverability check it entails, and adding that check by hand
     afterwards left two of them wired in series. Both bill. Nothing on screen said so.
     A duplicate FREE step is only clutter; a duplicate PAID step is money. */
  const byAct={};
  live.forEach(n=>{const r=reg(n); if(r.unit>0)(byAct[n.action]=byAct[n.action]||[]).push(n);});
  Object.keys(byAct).filter(a=>byAct[a].length>1).forEach(a=>{
    const ns=byAct[a],r=reg(ns[0]);
    const spend=ns.reduce((s,n)=>s+((G[n.id]||{}).cost||0),0);
    add({sev:"stop",kind:"dupe_paid",t:"The same paid step appears twice",node:ns[1].id,
      rule:"warn before cost — never bill the same records twice",
      p:`<b>${r.plain.title}</b> is in this plan ${ns.length} times, and every copy bills.
         Together they come to <b>${money(spend)}</b>. Unless you meant to pay for the same
         records twice, remove all but one — the automatically added copy is usually the
         one to keep, because something else in the plan requires it.`});
  });

  /* 1 · budget ceiling */
  if(t.cost>PLAN.budget){
    const worst=live.slice().sort((a,b)=>G[b.id].cost-G[a.id].cost)[0];
    add({sev:"stop",kind:"budget",t:"Budget ceiling exceeded",node:worst&&worst.id,
      p:`This plan totals <b>${money(t.cost)}</b> against your <b>${money(PLAN.budget)}</b> ceiling.
         <b>${reg(worst).plain.title}</b> is ${money(G[worst.id].cost)} of it —
         ${Math.round(G[worst.id].cost/t.cost*100)}% of the whole plan.`,
      rule:"standing rule 6 — warn before cost, and surface the cheaper alternative",
      fix:"↳ Skip that step for now",act:()=>{setSkip(worst.id,true,"Skipped to stay inside the budget ceiling.");}});
  }
  /* 2 · a rate-capped drip on the critical path to handoff */
  live.filter(n=>reg(n).drip).forEach(n=>{
    const push=live.find(x=>x.action==="outreach_push");
    if(push&&ancestors(push).has(n.id)){
      add({sev:"warn",t:"A drip is blocking the handoff",node:n.id,
        p:`<b>${reg(n).plain.title}</b> is capped at ${reg(n).perDay}/day — ${dur(G[n.id].mins)} for
           ${num(G[n.id].billable)} people. Nothing downstream should wait on it.`,
        rule:"producer–consumer streaming — release the email-ready list now, trickle activity up later",
        fix:"↳ Move it off the path (release first, sync later)",
        act:()=>{const push=PLAN.nodes.find(x=>x.action==="outreach_push");
          push.after=push.after.filter(id=>id!==n.id);
          n.after=[...new Set([...n.after,...push.after])];
          snap("split the release");toast("Handoff no longer waits on the drip","ok");}});
    }
  });
  /* 3 · paying per record with no dedupe upstream */
  /* a collection step cannot have a merge upstream of it — there is nothing to merge
     until it has run. Firing there made the finding read as noise on four of five plans. */
  live.filter(n=>reg(n).unit>0&&G[n.id].billable>200&&reg(n).phase!=="collect").forEach(n=>{
    const anc=ancestors(n);
    const deduped=[...anc].some(id=>{const x=PLAN.nodes.find(y=>y.id===id);
      return x&&!x.skipped&&["pool_reconcile","email_dedupe"].includes(x.action);});
    const isContact=["contact","cross"].includes(reg(n).grain);
    const hasPeopleDedupe=[...anc].some(id=>{const x=PLAN.nodes.find(y=>y.id===id);
      return x&&!x.skipped&&x.action==="email_dedupe";});
    if(isContact&&!hasPeopleDedupe&&reg(n).unit>0&&n.action!=="dm_discovery"){
      add({sev:"warn",kind:"dedupe-people",t:"You will pay twice for the same address",node:n.id,
        p:`<b>${reg(n).plain.title}</b> bills per person and nothing upstream merges duplicate people.
           Two records sharing one address get billed once each.`,
        rule:"dedupe waterfall + verify cache — never bill the same string twice",
        fix:"↳ Insert “Merge duplicate people” before it (free)",
        act:()=>insertBefore(n.id,"email_dedupe")});
    }else if(!deduped&&!isContact){
      add({sev:"warn",kind:"dedupe-companies",t:"Paying before the duplicates are merged",node:n.id,
        p:`<b>${reg(n).plain.title}</b> bills per company and no merge step runs first.`,
        rule:"dedupe waterfall — cheapest cuts first",
        fix:"↳ Insert “Merge duplicate companies” before it (free)",
        act:()=>insertBefore(n.id,"pool_reconcile")});
    }
  });
  /* 4 · cost must ascend — a paid step upstream of a free cut */
  let firstPaid=null,ascend=true;
  topo().filter(n=>!n.skipped&&!isRider(n)).forEach(n=>{
    const paid=G[n.id].cost>0.005;
    if(paid&&!firstPaid&&n.after.length)firstPaid=n;
    /* a merge step landing late is already reported as "paying before the duplicates are
       merged" — don't say the same thing twice in different words */
    const isMerge=["pool_reconcile","email_dedupe"].includes(n.action);
    if(firstPaid&&!paid&&reg(n).keep<1&&reg(n).unit===0&&!isMerge&&ancestors(n).has(firstPaid.id)){
      ascend=false;
      add({sev:"warn",kind:"cost-order",t:"A free cut runs after a paid step",node:firstPaid.id,
        p:`<b>${reg(n).plain.title}</b> costs nothing and removes
           ${Math.round((1-reg(n).keep)*100)}% of the records, but it runs after
           <b>${reg(firstPaid).plain.title}</b>, which you have already paid for.`,
        rule:"governing rule — apply each disqualifier the moment its signal is available, cheapest first"});
    }
  });
  /* 5 · lossy bulk work with no restore point */
  const lossy=live.filter(n=>["pool_reconcile","email_dedupe"].includes(n.action));
  if(lossy.length&&!live.some(n=>n.action==="snapshot")){
    add({sev:"warn",t:"No restore point before a merge",node:lossy[0].id,
      p:`<b>${reg(lossy[0]).plain.title}</b> rewrites rows in bulk and there is no snapshot before it.`,
      rule:"standing rule 5 — snapshot before any lossy bulk write (backup API, not a file copy)",
      fix:"↳ Insert “Save a restore point” (free, instant)",
      act:()=>insertBefore(lossy[0].id,"snapshot")});
  }
  /* 5b · a step running out of its natural order.
     Only checkable now that phases are real column groups: an edge whose target sits in
     an EARLIER phase than its source is a plan doing things in an order the pipeline
     does not support. It is not a cycle and it is not a missing dependency, so nothing
     else catches it — the old canvas simply drew it left-to-right and it looked fine.
     The opto plan had exactly this and had it for weeks: judge, then merge duplicates. */
  edgeList().forEach(e=>{
    if(e.from.skipped||e.to.skipped)return;
    const pf=PHASE_ORDER[reg(e.from).phase], pt=PHASE_ORDER[reg(e.to).phase];
    if(pt>=pf)return;
    add({sev:"warn",kind:"out-of-order",t:"Two steps are in the wrong order",node:e.to.id,
      p:`<b>${reg(e.to).plain.title}</b> runs after <b>${reg(e.from).plain.title}</b>, but it
         belongs earlier — it is a “${(PHASES.find(x=>x[0]===reg(e.to).phase)||["",""])[1]}”
         step and the other is “${(PHASES.find(x=>x[0]===reg(e.from).phase)||["",""])[1]}”.
         The connector doubles back on the canvas for the same reason.`,
      rule:"cheapest cuts first — anything that removes records has to run before anything that pays per record"});
  });
  /* 5c · a step that gives up on a record permanently.
     The third complaint, and the most expensive one: "it gets tagged with something
     later in the funnel, then because it got moved back earlier in the funnel... because
     it had that tag, the thing it's supposed to do didn't actually do it."
     A try-once mark answers "have we attempted this?" when the question that matters is
     "is what we know now newer than what we tried it on?" The two agree exactly until
     something improves, and then the mark hides precisely the records the improvement
     was for. Measured on a real list: 1,689 hidden addresses, 467 of them permanently
     unreachable because the mark predated the decoder that would have read them. */
  live.filter(n=>reg(n).retry==="once").forEach(n=>{
    add({sev:"warn",kind:"try-once",t:"This step gives up on a record for good",node:n.id,
      p:`<b>${reg(n).plain.title}</b> marks each record “${reg(n).retryFlag||"already tried"}” and never
         looks at it again — even after something upstream improves and the record becomes
         answerable. Records that come back down a return path arrive still carrying the mark,
         so the step skips exactly the ones it was re-run for.`,
      rule:"re-run on freshness, not on a flag — a step should reprocess a record whenever its inputs are newer than its own last answer",
      fix:"↳ Switch it to re-run when its inputs change",
      act:()=>{const r=REGISTRY[n.action];r.retry="fresh";delete r.retryFlag;
        snap("re-run on freshness");toast("It will now re-run whenever its inputs change","ok");}});
  });
  /* 6 · the BUILD → ENRICH gate.
     The old "per-person cost above the lock wall" check used to live here and can no
     longer fire: per-person work is in the people stage, and the layout will not let a
     card leave its stage, so the picture cannot be drawn wrong in the first place. That
     is the better outcome — but it only covers WHERE a step sits, not whether anything
     narrowed the list before it. This check covers the second half.
     Only fires when the plan actually collects; a plan starting from a list you already
     curated had its cut before this canvas existed. */
  if(live.some(n=>reg(n).broad)){
    const first=topo().filter(n=>!n.skipped&&!isRider(n)).find(n=>stageOf(n)!=="build");
    if(first){
      const anc=ancestors(first);
      const cut=[...anc].some(id=>{const x=PLAN.nodes.find(y=>y.id===id);
        return x&&!x.skipped&&CUTTERS.has(x.action);});
      if(!cut){
        const spend=live.filter(n=>stageOf(n)!=="build")
                        .reduce((s,n)=>s+((G[n.id]&&G[n.id].cost)||0),0);
        const vol=(G[first.id]&&G[first.id].in)||0;
        add({sev:"stop",kind:"enrich-before-cut",t:"Enriching a list nobody has cut yet",node:first.id,
          p:`Everything collected — <b>${num(vol)}</b> records — walks straight into
             <b>${reg(first).plain.title}</b> with no judgement step in between. The enrichment
             side of this plan costs <b>${money(spend)}</b>, and at this shape you would pay it on
             every record you collected instead of the ones worth keeping.`,
          rule:"collect broadly, enrich narrowly — building and enriching used to be two separate tools, so you physically could not skip the cut; on one canvas that has to be a rule",
          fix:`↳ Insert “${REGISTRY.evidence_rules.plain.title}” before it (free)`,
          act:()=>insertBefore(first.id,"evidence_rules")});
      }
    }
  }
  /* 7 · a human queue nobody can act on */
  live.filter(n=>reg(n).review).forEach(n=>{
    const anc=ancestors(n);
    if(!anc.size&&n.after.length===0)
      add({sev:"warn",t:"A review queue with nothing feeding it",node:n.id,
        p:`<b>${reg(n).plain.title}</b> has no upstream step, so its queue will always be empty.`,
        rule:"standing rule 19 — human queues contain only what a human can act on today"});
  });
  /* 7b · a step nobody has set up yet.
     Deliberately a STOP, not a warning, and deliberately not defaulted: a plausible
     default term list is exactly how you spend $70 collecting the wrong businesses.
     The plan checker refusing to approve an unconfigured step is the cheapest
     possible place to catch that. */
  live.forEach(n=>{
    const su=setupOf(n);
    if(su&&!su.ready)
      add({sev:"stop",kind:"needs-setup",t:"This step has not been set up",node:n.id,
        p:`<b>${reg(n).plain.title}</b> needs ${su.missing.map(k=>{
             const f=fieldOf(n.action,k);return "<b>"+(f?f.label.toLowerCase():k)+"</b>";}).join(" and ")}
           before it can run. Nothing is assumed for you — a default here is how a run
           collects the wrong thing at full price.`,
        rule:"standing rule 6 — never spend on an unconfirmed instruction",
        fix:"↳ Set it up now",
        act:()=>openSetup(n.id)});
  });
  /* 8 · unmet data dependency
     The entry point is DATA WE ALREADY HAVE, so it satisfies a requirement exactly
     as a producing step does. Without this, every list that starts from something
     other than nothing reports a false "missing data" on its very first step —
     found the moment a second list was put on the canvas. */
  live.forEach(n=>{
    const need=reg(n).requires||[];
    const anc=[...ancestors(n)].map(id=>PLAN.nodes.find(x=>x.id===id)).filter(x=>x&&!x.skipped);
    const have=new Set([...(ENTRY_GIVES[PLAN.entry]||[]),...anc.flatMap(x=>reg(x).produces||[])]);
    const missing=need.filter(k=>!have.has(k));
    if(missing.length&&n.after.length)
      add({sev:"stop",kind:"missing-data",t:"Missing data this step needs",node:n.id,
        p:`<b>${reg(n).plain.title}</b> needs <code>${missing[0]}</code> and nothing upstream produces it.`,
        rule:"registry dependency — requires / produces",
        fix:"↳ Insert the step that produces it",
        act:()=>{const src=bestProducer(missing[0],n);
          if(src)insertBefore(n.id,src);else toast("No action in the registry produces that","warn");}});
  });
  if(ascend&&live.length>3){
    const freeCut=live.filter(n=>reg(n).unit===0&&reg(n).keep<1)
      .reduce((s,n)=>s+((G[n.id]||{billable:0,out:0}).billable-(G[n.id]||{out:0}).out),0);
    LINTS.push({sev:"pass",t:"Cost ascends left to right",
      p:`Every free cut happens before anything paid — <b>${num(Math.round(freeCut))}</b> records
         are removed for $0 before the first metered call.`,
      rule:"governing rule — cheapest signal that decides it, applied as soon as it is available"});
  }
}

/* ============================================================================
   8 · RIGHT PANEL — lint / inspector / palette / review / log
   ============================================================================ */
let panel="lint", palTarget=null;
function renderRight(){
  const b=$("#rightbody");
  /* the sticky bar belongs to exactly one panel. Leaving an "accept 22 records" button
     floating over the palette is not untidy, it is dangerous. */
  if(panel!=="review")$("#rvbar").classList.remove("on");
  if(panel==="inspector"&&selected)return renderInspector();
  if(panel==="palette")return renderPalette();
  if(panel==="review")return renderReview();
  if(panel==="work"){
    const w=WORK.find(x=>x.id===WORK_OPEN);
    if(w){$("#righttitle").textContent="A piece of work";
      $("#rightbody").innerHTML=workDetailHTML(w);return;}
    panel="lint";}
  if(panel==="log")return renderLog();
  /* default: lint */
  $("#righttitle").textContent=mode==="run"?"Run health":"Plan lint";
  const issues=LINTS.filter(l=>l.sev!=="pass");
  b.innerHTML=whereHTML()
    +(issues.length?"":`<div class="empty">${ico("check")} Nothing to flag.<br>This plan honours every rule the graph can check.</div>`)

/* ---- review queue (mock rows, seeded so they never shuffle) ---- */
const RVSEED=mulberry(7);
const RV_FIRST=["Dana","Marcus","Priya","Tom","Alina","Wes","Nia","Hugo","Ivy","Sam","Rosa","Ken"];
const RV_LAST=["Okafor","Whitlock","Raman","Feld","Costa","Nguyen","Barrera","Lindqvist","Shah","Ortiz"];
const RV_ORG=["Clearview Eye Care","Summit Family Optometry","Harbor Vision Group","Lakeside Eyecare",
  "Meridian Optical","Pinehurst Eye Associates","Copper Creek Vision","Bayou Optometry"];
const RV_WHY=["two people carry an owner-level title","the title reads “Office Manager”, not owner",
  "the name might be the practice itself","listed as a client testimonial, not staff",
  "two spellings of what looks like one person"];
/* ============================================================================
   REVIEW — a queue that LEARNS from what you reject
   ----------------------------------------------------------------------------
   The operator: "does this system have the learning aspect? If we eliminate people or make
   changes, is it able to learn about, oh, why are they making these changes? And
   should we look for ways to apply certain rules that might help us process through
   the entire database and clean up some of that stuff."

   That is the highest-value thing a review queue can do, and almost no tool does it.
   A queue that only records decisions makes you pay the same tuition on every list:
   you reject four coordinators here, and next month you reject four coordinators
   again, and the machine has learned nothing from either round.

   The design constraints matter as much as the idea:

   1. PROPOSE, NEVER APPLY. The system may notice a pattern; it may not act on one.
      A queue that silently generalises your clicks into a rule is a queue you can
      no longer trust, because you cannot see what it concluded.
   2. SHOW THE REACH BEFORE THE DECISION, both ways — how many unreviewed records
      the rule would cut, AND how many currently-kept records it would take with it.
      "This would also remove 41 people" is the number that decides it.
   3. NEVER RE-DECIDE WHAT A HUMAN DECIDED. A taught rule skips any record you
      personally ruled on. Manual judgement is authoritative; that is a standing rule
      here and a learned rule is exactly where it would get quietly violated.
   4. THE RULE STAYS VISIBLE AND REMOVABLE afterwards, in the step's own settings, in
      the words you would use. A rule you cannot find is indistinguishable from a bug.
   ========================================================================== */
const RV_TITLE_OK=["Owner","Founder","Managing Partner","Principal Optometrist","Owner / OD"];
const RV_TITLE_BAD=["Patient Care Coordinator","Office Manager","Account Executive",
  "Front Desk Lead","Practice Manager","Optical Sales Associate"];
const RV_PAGE=["/about","/our-team","/meet-the-doctors","/contact","/testimonials","/partners"];
const RV_GENERIC=["Front Desk","The Team","Reception","Our Doctors","Admin Office"];
/* Each trait is a candidate RULE. `say` is how it is offered, `rule` is what gets written
   into the step's settings, `where` is which step learns it. Reach is deterministic so a
   proposal does not change its own numbers between renders. */
const RV_TRAIT={
  coordinator:{say:"the title is a coordinator or account-executive role",
    rule:"Never take a coordinator or account executive as the decision maker",
    where:"dm_discovery",field:"role",reach:[41,168]},
  manager:{say:"the title is an office or practice manager",
    rule:"Never take an office or practice manager as the decision maker",
    where:"dm_discovery",field:"role",reach:[63,247]},
  testimonial:{say:"the person was found in a testimonial or client list",
    rule:"Ignore names found on testimonial and client pages",
    where:"team_roster",field:"skip_generic",reach:[28,96]},
  vendor:{say:"the person was found on a partners or vendors page",
    rule:"Ignore names found on partner and vendor pages",
    where:"team_roster",field:"skip_generic",reach:[19,74]},
  noname:{say:"the record has no real personal name",
    rule:"Drop entries with no personal name rather than queueing them",
    where:"cleanse",field:"junk",reach:[52,203]},
  second:{say:"a second person at the same company already holds an owner title",
    rule:"Only one decision maker per company — keep the more senior title",
    where:"dm_discovery",field:"per_company",reach:[37,140]}
};
let REVIEW=null, RV_SHOWN=12, RV_PROPOSALS=[];
function buildReview(){
  const rows=[];
  for(let i=0;i<24;i++){
    const bad=RVSEED()<.42;
    const title=bad?RV_TITLE_BAD[Math.floor(RVSEED()*RV_TITLE_BAD.length)]
                   :RV_TITLE_OK[Math.floor(RVSEED()*RV_TITLE_OK.length)];
    const page=RV_PAGE[Math.floor(RVSEED()*RV_PAGE.length)];
    /* EVERY trait is derived from what the row actually shows. Rolling them at random
       produced a row headed "Founder" carrying the tag "no real personal name", and a
       panel that contradicts itself destroys the whole proposition — you cannot ask
       somebody to turn an observation into a rule if the observation is visibly wrong. */
    const generic=RVSEED()<.16;
    const name=generic?RV_GENERIC[Math.floor(RVSEED()*RV_GENERIC.length)]
      :RV_FIRST[Math.floor(RVSEED()*RV_FIRST.length)]+" "+RV_LAST[Math.floor(RVSEED()*RV_LAST.length)];
    const traits=[];
    if(/Coordinator|Account Executive|Sales/.test(title))traits.push("coordinator");
    if(/Manager/.test(title))traits.push("manager");
    if(page==="/testimonials")traits.push("testimonial");
    if(page==="/partners")traits.push("vendor");
    if(generic)traits.push("noname");
    rows.push({id:"r"+i,
      name,
      title,org:RV_ORG[Math.floor(RVSEED()*RV_ORG.length)],
      why:RV_WHY[Math.floor(RVSEED()*RV_WHY.length)],
      page,traits,
      quote:"“"+title+" — "+(generic?"our team has":name.split(" ")[0]+" has")+" been with the practice "
            +(2+Math.floor(RVSEED()*18))+" years.”",
      conf:Math.round(52+RVSEED()*46),
      done:null});
  }
  /* "a second person at the same company already holds an owner title" has to be TRUE of
     the queue, not rolled — it is a statement about the other rows, so it can only be
     decided once every row exists. */
  const owners={};
  rows.forEach(r=>{if(RV_TITLE_OK.includes(r.title))owners[r.org]=(owners[r.org]||0)+1;});
  rows.forEach(r=>{if(RV_TITLE_OK.includes(r.title)&&owners[r.org]>1)r.traits.push("second");});
  return rows;
}
/* What did the rejections have in common? Only traits shared by at least two rejections
   are offered: one rejection is a decision, two is the beginning of a pattern, and a rule
   proposed off a single click is just the machine putting words in your mouth. */
function reviewLearn(rejected){
  const count={};
  rejected.forEach(r=>r.traits.forEach(t=>{count[t]=(count[t]||0)+1;}));
  return Object.keys(count).filter(t=>count[t]>=2&&RV_TRAIT[t])
    .sort((a,b)=>count[b]-count[a]).slice(0,3)
    .map(t=>({t,n:count[t],...RV_TRAIT[t]}));
}
function applyTaught(p,scope){
  const host=PLAN.nodes.find(n=>n.action===p.where&&!n.skipped)
          || PLAN.nodes.find(n=>reg(n).review&&!n.skipped);
  if(!host)return toast("Nothing in this plan learns that rule yet","warn");
  snap("taught a rule");
  host.params=host.params||{};
  host.params.taught=(host.params.taught||[]).concat([
    {rule:p.rule,scope,hit:scope==="all"?p.reach[1]:p.reach[0]}]);
  const n=scope==="all"?p.reach[1]:p.reach[0];
  rlog("Learned: "+p.rule+" — "+n+" records "+(scope==="all"?"across every list":"in this list")
       +" will be handled without asking","ok");
  /* A rule that changes what counts does NOT quietly rewrite settled records. It opens a
     job you can see, size, inspect and refuse — which is the whole difference between
     "the numbers changed while I was looking away" and "here is what changed and why". */
  addWork({step:host.id,kind:"recheck",n,at:"just now",
    cause:"you taught a rule — “"+p.rule+"” — so records already settled have to be tested against it"});
  toast(n+" more records now handled without asking","ok");
  RV_PROPOSALS=RV_PROPOSALS.filter(x=>x.t!==p.t);
  renderReview();
}

/* The review bar lives OUTSIDE #rightbody so it cannot scroll away from the rows it acts
   on — which also means the panel's own click delegate never sees it. Bind both. */
function reviewClick(e){
  const mo=e.target.closest("[data-rvo]");
  if(mo){const r=REVIEW.find(x=>x.id===mo.dataset.rvo);
    if(r)r.open=!r.open;renderReview();return true;}
  const ld=e.target.closest("[data-rvload]");
  if(ld){RV_SHOWN=ld.dataset.rvload==="all"?9999:RV_SHOWN+12;renderReview();return true;}
  const ap=e.target.closest("[data-lapply]");
  if(ap){const p=RV_PROPOSALS.find(x=>x.t===ap.dataset.lapply);
    if(p)applyTaught(p,ap.dataset.scope);return true;}
  const dp=e.target.closest("[data-ldrop]");
  if(dp){RV_PROPOSALS=RV_PROPOSALS.filter(x=>x.t!==dp.dataset.ldrop);renderReview();return true;}
  const td=e.target.closest("[data-tdel]");
  if(td){const parts=td.dataset.tdel.split(":");
    const n=PLAN.nodes.find(x=>x.id===parts[0]);
    if(n&&n.params&&n.params.taught){snap("stopped using a rule");
      n.params.taught.splice(+parts[1],1);toast("That rule is no longer applied");}
    renderReview();return true;}
  const tog=e.target.closest("[data-rvt]");
  if(tog){const r=REVIEW.find(x=>x.id===tog.dataset.rvt);
    if(r)r.mark=!r.mark;renderReview();return true;}
  if(e.target.closest("[data-rvclear]")){REVIEW.forEach(r=>{r.mark=false;});renderReview();return true;}
  const acc=e.target.closest("[data-rvaccept]");
  if(acc){
    snap("accepted the review queue");   // "accept 22 records" is exactly the click you want back
    const open=REVIEW.filter(x=>!x.done);
    const rejected=open.filter(r=>r.mark);
    const wrong=rejected.length, right=open.length-wrong;
    /* learn BEFORE the marks are cleared — this is the only moment the reasons exist */
    RV_PROPOSALS=reviewLearn(rejected);
    open.forEach(r=>{r.done=r.mark?"cut":"keep";r.mark=false;r.open=false;});
    rlog(`Review cleared — ${right} confirmed, ${wrong} rejected`,"ok");
    toast(`${num(right)} confirmed, ${num(wrong)} rejected`,"ok");
    const left=REVIEW.filter(x=>!x.done).length;
    const node=PLAN.nodes.find(x=>reg(x).review==="person"&&x.action==="dm_confirm");
    if(node&&RUN.state[node.id]){RUN.state[node.id].queue=left;
      RUN.state[node.id].line=left?left+" waiting on you":"all decided";
      if(!left){RUN.state[node.id].st="done";RUN.state[node.id].pct=100;
        rlog("Review queue cleared — every close call decided","ok");
        if(mode==="run"&&!RUN.on)startRun();}}
    renderReview();renderWorld();
    return true;
  }
  return false;
}
/* Review is EXCEPTION-MARKING, not one decision per row.
   The operator: "I would go through the list and select the ones that are NOT them, and then have a
   button that says accept the rest as right person."
   That is the right shape and it is not a shortcut — it matches how the judgement actually
   works. The machine already believes every row is correct; the human is confirming or

/* PEEK.order is a SPARSE override, not the column list.

    <select class="f" data-fpart="f">${fields.map(x=>
      `<option value="${x}"${x===f.f?" selected":""}>${FIELD[x].l}</option>`).join("")}</select>
    <select class="o" data-fpart="op">${OPS.map(o=>
      `<option value="${o[0]}"${o[0]===f.op?" selected":""}>${o[1]}</option>`).join("")}</select>
    ${OP_NEEDS_VALUE(f.op)?`<input data-fpart="v" value="${(f.v||"").replace(/"/g,"&quot;")}" placeholder="value">`:""}
    <span class="x" data-fdel="${i}">✕</span></div>`).join("");
  $("#filtermenu").innerHTML=
    `<div class="hd">Only show records where…</div>${rows}
     <div class="fmrow"><button class="btn gray sm" data-fadd style="flex:1">+ Add a condition</button>
       ${PEEK.filters.length?`<button class="btn ghost sm" data-fclear>Clear all</button>`:""}</div>
     <div class="hd">All conditions must hold. “Is set” and “is empty” are the two you want most —
       they are how you find what the plan has not managed to fill in yet.</div>`;
  const chips=$("#fchips");
  chips.classList.toggle("on",PEEK.filters.length>0);
  chips.innerHTML=PEEK.filters.map((f,i)=>`<span class="fchip">${FIELD[f.f]?FIELD[f.f].l:f.f}
    <i>${(OP[f.op]||["","?"])[1]}${OP_NEEDS_VALUE(f.op)&&f.v?" “"+f.v+"”":""}</i>
    <b data-fdel="${i}">✕</b></span>`).join("");
}
/* headOnly is what a run tick calls: the ROWS at a step are deterministic and do not
   change tick to tick, only the live counts do — so the table is left alone and the
   reader's scroll position (and any expanded row) survives a running job. */
function renderPeek(headOnly){
  const id=PEEK.node;if(!id)return;
  const n=PLAN.nodes.find(x=>x.id===id);if(!n)return;
  const r=reg(n),g=G[n.id]||{},st=runOf(n);
  const ran=mode==="run"&&(st.st==="running"||st.st==="done"||st.st==="needs");
  const all=pkRows(n), cut=all.filter(x=>x.cut), kept=all.filter(x=>!x.cut);
  /* "cut" is the default, but a step that cuts nothing must not open on an empty screen */
  const eff=(PEEK.slice==="cut"&&!cut.length)?"all":PEEK.slice;
  const slice=eff==="cut"?cut:eff==="kept"?kept:all;
  const q=PEEK.q.trim().toLowerCase();
  const searched=q?slice.filter(x=>Object.keys(x.rec).some(k=>FIELD[k]&&String(x.rec[k]).toLowerCase().includes(q))):slice;
  const filtered=searched.filter(x=>pkPasses(x.rec));
  const shown=filtered.slice(0,70);
  const fields=pkOrdered(pkFields(n)), newF=new Set(r.produces||[]);
  const prov=pkProvenance(n);
  const cols=fields.filter(f=>newF.has(f)||!PEEK.hide[f]);   // own output is never hidden
  $("#sheetgrain").innerHTML=grainIcon(r.grain);
  $("#sheettitle").textContent=(vocab==="plain"?r.plain.title:r.tech);
  $("#sheetsub").innerHTML=n.skipped
    ? `<span class="samp">skipped</span> · nothing runs here now — these records pass straight through`
    : ran
    ? `<span class="live">live</span> · ${num(st.done||g.out)} of ${num(g.billable)} processed ·
       <b>${num(g.in||g.billable)}</b> in &rarr; <b>${num(g.out)}</b> ${g.grainOut}`
    : `<span class="samp">sample</span> · this step has not run — rows are from a comparable list ·
       projected <b>${num(g.in||g.billable)}</b> in &rarr; <b>${num(g.out)}</b> ${g.grainOut}`;
  $("#sheetslice").innerHTML=[["cut","Cut",cut.length],["kept","Kept",kept.length],["all","All",all.length]]
    .map(([k,l,c])=>`<button data-slice="${k}"${eff===k?' class="on"':""}>${l} <b>${num(c)}</b></button>`).join("");
  $("#sheetfoot").innerHTML=
    `<span class="lbl">${n.skipped?"Changed your mind?":"Not going the right way?"}</span>
     <button class="btn ${n.skipped?"":"ghost "}sm" data-pk="skip">${n.skipped?"↺ Put this step back":"⊘ Skip this step"}</button>
     <button class="btn gray sm" data-pk="after">+ Add a step after this</button>
     <button class="btn gray sm" data-pk="export">⤓ Export this sample</button>
     <span class="note">${peekRateNote(n,r,all,cut)}
       <br>Every edit here is undoable with Ctrl+Z.</span>`;
  if(headOnly)return;
  renderFilterMenu(fields);
  $("#colmenu").innerHTML=`<div class="hd">Everything known at this step</div>`+
    fields.map(f=>`<div class="cm" data-col="${f}">
      <input type="checkbox" ${cols.includes(f)?"checked":""} ${newF.has(f)?"disabled":""} tabindex="-1">
      <span>${FIELD[f].l}${newF.has(f)?" — added here":""}</span><code>${f}</code></div>`).join("")+
    `<div class="hd">${fields.length} field${fields.length===1?"":"s"} — this list grows as you move right</div>`;
  const head=`<tr><th style="width:76px;cursor:default">Outcome</th>`+
    cols.map(f=>`<th class="${newF.has(f)?"new":""}" data-col="${f}" draggable="true"
      title="Drag to move this column" style="min-width:${FIELD[f].w}px">${FIELD[f].l}</th>`).join("")+`</tr>`;
  const body=shown.map((x,i)=>{
    const open=PEEK.row===i;
    const cells=cols.map(f=>{const v=pkVal(x.rec,f);
      return `<td class="${newF.has(f)?"new":""} ${FIELD[f].txt?"txt":""}">${v==null?'<span style="color:#c3cbd6">—</span>':v}</td>`;}).join("");
    const pill=x.cut?`<span class="pkpill cut">cut</span>`
              :x.wait?`<span class="pkpill wait">waiting</span>`:`<span class="pkpill keep">kept</span>`;
    const main=`<tr class="r ${x.cut?"cut":""}" data-row="${i}"><td>${pill}
        ${x.cut?`<div class="pkwhy">${x.why}</div>`:""}</td>${cells}</tr>`;
    if(!open)return main;
    /* grouped by the step that added each value, in execution order = the record's history */
    const groups=[];
    fields.forEach(f=>{
      const p=prov[f]||{id:"?",title:"already on the record when the list started"};
      let g=groups.find(y=>y.id===p.id);
      if(!g){g={id:p.id,title:p.title,self:p.self,fields:[]};groups.push(g);}
      g.fields.push(f);
    });
    const body=groups.map(g=>`<div class="prov ${g.self?"self":""}">
      <div class="pl">${g.self?"added by THIS step":"from: "+g.title}</div>
      <div class="kvs">${g.fields.map(f=>{const v=pkVal(x.rec,f);
        return `<div class="kv1"><span class="k">${FIELD[f].l}</span>
          <span class="v ${v==null?"na":""}">${v==null?"not known yet":v}</span></div>`;}).join("")}</div>
      </div>`).join("");
    return main+`<tr class="pkx"><td colspan="${cols.length+1}">
      <div style="font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
        color:#9aa5b3;margin-bottom:8px">This record as it stands after this step — and where each
        value came from</div>${body}</td></tr>`;
  }).join("");
  $("#sheetbody").innerHTML=shown.length
    ? `<table class="pk">${head}${body}</table>
       <div style="padding:9px 12px;font-size:11px;color:var(--muted)">
         Showing ${num(shown.length)} of ${num(filtered.length)} ${eff==="all"?"records":eff}
         ${PEEK.filters.length?` matching ${PEEK.filters.length} filter${PEEK.filters.length>1?"s":""}`:""}
         ${q?` matching “${PEEK.q}”`:""}${filtered.length<slice.length
           ?` <span style="color:#9aa5b3">(${num(slice.length-filtered.length)} filtered out)</span>`:""}
         · click a row to see it as it stands here, and which step put each value on it.
         · drag a column heading to move it.</div>`
    : `<div class="empty" style="padding:34px 20px">${ico("check")} Nothing in this slice${
         PEEK.filters.length?" passes those filters":q?" matches that search":""}.</div>`;
}
/* Two cut rates are on screen at once — this sample's, and the plan's projection for the
   whole list. They will not match exactly, and a sample that matched to the point would be
   the suspicious one. Say which is which rather than showing two bare numbers. */
function peekRateNote(n,r,all,cut){
  if(n.skipped)return "Skipped — the step is a ghost on the canvas and costs nothing.";
  if(!cut.length)return "Nothing is cut at this step.";
  const s=Math.round(cut.length/Math.max(1,all.length)*100);
  const p=Math.round((1-(r.keep==null?1:r.keep))*100);
  return `<b>${s}%</b> of this sample is cut${Math.abs(s-p)>=4?` — the plan projects ${p}% across the whole list`:""}.`;
}

/* ============================================================================
   9 · GRAPH EDITS (+ undo)
   ============================================================================ */
const UNDO=[];
function snap(label){
  /* REVIEW rides along: accepting a queue in one click is a plan edit in every sense that
     matters — it decides the fate of dozens of records — so Ctrl+Z has to reach it. */
  UNDO.push({plan:JSON.stringify(PLAN),manual:JSON.stringify(manual),
             review:REVIEW?JSON.stringify(REVIEW):null,label});
  if(UNDO.length>40)UNDO.shift();
  render();
}
function undo(){
  if(!UNDO.length)return toast("Nothing left to undo");
  const u=UNDO.pop();
  PLAN=JSON.parse(u.plan);manual=JSON.parse(u.manual);
  if(u.review)REVIEW=JSON.parse(u.review);
  selected=null;panel="lint";render();
  toast("Undone: "+u.label);
}
function pushUndo(label){UNDO.push({plan:JSON.stringify(PLAN),manual:JSON.stringify(manual),
  review:REVIEW?JSON.stringify(REVIEW):null,label});
  if(UNDO.length>40)UNDO.shift();}
function setSkip(id,v,why){
  const n=PLAN.nodes.find(x=>x.id===id);if(!n)return;
  pushUndo((v?"skip ":"restore ")+reg(n).plain.title);
  n.skipped=v;if(v)n.why=why||"Skipped by hand.";else delete n.why;
  render();toast(v?"Step skipped — still visible as a ghost":"Step restored",v?"warn":"ok");
}
function removeNode(id){
  const n=PLAN.nodes.find(x=>x.id===id);if(!n)return;
  /* A required join is not a choice, so it does not get a delete. Saying WHY, and
     naming the edit that would actually remove it, beats a disabled button. */
  if(n.required)return toast("This merge is required while "+(n.srcCount||2)+
    " sources feed the same list — remove a source to remove it","warn");
  pushUndo("remove "+reg(n).plain.title);
  const ss=succs(n);
  ss.forEach(s=>{s.after=[...new Set(s.after.filter(x=>x!==id).concat(n.after))];});
  PLAN.nodes=PLAN.nodes.filter(x=>x.id!==id);
  delete manual[id];selected=null;panel="lint";render();
  toast("Removed — Ctrl+Z to undo");
}
function insertBefore(id,action){
  const n=PLAN.nodes.find(x=>x.id===id);if(!n)return;
  pushUndo("insert "+REGISTRY[action].plain.title);
  const nid="n"+(++seq);
  PLAN.nodes.push({id:nid,action,after:[...n.after]});
  n.after=[nid];
  selected=nid;panel="inspector";render();
  toast("Inserted “"+REGISTRY[action].plain.title+"”","ok");
}
function insertAt(action,target){
  pushUndo("insert "+REGISTRY[action].plain.title);
  const nid="n"+(++seq);
  if(target&&target.after){
    PLAN.nodes.push({id:nid,action,after:[target.after]});
    if(target.before){const b=PLAN.nodes.find(x=>x.id===target.before);
      if(b)b.after=b.after.map(x=>x===target.after?nid:x);}
  }else{
    const tail=topo().filter(n=>!n.skipped).slice(-1)[0];
    PLAN.nodes.push({id:nid,action,after:tail?[tail.id]:[]});
  }
  selected=nid;panel="inspector";render();
  toast("Added “"+REGISTRY[action].plain.title+"”","ok");
}
function openPalette(target){palTarget=target||null;window._palq="";window._palfocus=true;setPanel("palette");
  setTimeout(()=>{window._palfocus=false;},400);}

/* ============================================================================
   10 · RUN SIMULATION (mode ③) — deterministic, tick-driven, no network
   ============================================================================ */
const RUN={on:false,tick:0,timer:0,state:{},log:[],speed:1,sig:""};
/* A plan edit invalidates a run — you cannot half-run a graph that changed shape.
   planSig() is what "changed shape" means; entering Run mode after an edit resets. */
function planSig(){
  return JSON.stringify(PLAN.nodes.map(n=>[n.id,n.action,!!n.skipped,n.after.slice().sort()]));
}
function blankState(n){
  return {st:n.skipped?"idle":"blocked",done:0,spent:0,pct:0,
    line:n.skipped?"skipped":"waiting on the step before",right:"",queue:0};
}
function resetRun(){
  RUN.on=false;RUN.tick=0;RUN.log=[];clearInterval(RUN.timer);RUN.timer=0;RUN.state={};
  PLAN.nodes.forEach(n=>{RUN.state[n.id]=blankState(n);});
  RUN.sig=planSig();REVIEW=null;
}
/* defensive: a node with no run state must never crash the tick */
function ensureRunState(){PLAN.nodes.forEach(n=>{if(!RUN.state[n.id])RUN.state[n.id]=blankState(n);});}
function rlog(m,k){
  const mins=RUN.tick*2;
  const t=mins<60?mins+"m":(Math.floor(mins/60)+"h"+String(mins%60).padStart(2,"0"));
  RUN.log.unshift({t,m,k});
  if(RUN.log.length>60)RUN.log.pop();
}
function runReady(n){
  if(n.skipped)return false;
  return preds(n).every(p=>p.skipped||RUN.state[p.id].st==="done"||RUN.state[p.id].st==="needs");
}
function startRun(){
  if(RUN.on)return;
  ensureRunState();
  RUN.on=true;
  rlog("Run started — "+PLAN.nodes.filter(n=>!n.skipped).length+" steps queued","ok");
  RUN.timer=setInterval(runTick,700);
  runTick();
}
function pauseRun(){RUN.on=false;clearInterval(RUN.timer);RUN.timer=0;rlog("Paused by you","warn");render();}
function runTick(){
  if(!RUN.on)return;
  ensureRunState();
  RUN.tick++;
  let working=false;
  topo().forEach(n=>{
    const s=RUN.state[n.id],g=G[n.id],r=reg(n);
    if(!g)return;                                   // riders are not run steps
    if(n.skipped||s.st==="done"||s.st==="needs")return;
    if(s.st==="blocked"){
      if(runReady(n)){s.st="running";s.pct=0;s.done=0;
        rlog("Started — "+r.plain.title);}
      else return;
    }
    if(s.st==="running"){
      working=true;
      /* progress rate scales with the step's own throughput, so a slow step LOOKS slow */
      const step=RUN.speed*(r.drip?4:Math.max(3,Math.min(34,2200/Math.max(1,g.mins))));
      s.pct=Math.min(100,s.pct+step);
      s.done=Math.round(g.billable*s.pct/100);
      s.spent=g.cost*s.pct/100;
      s.line=r.drip?num(s.done)+" of "+num(g.billable)+" · "+reg(n).perDay+"/day"
                   :num(s.done)+" of "+num(g.billable);
      s.right=r.drip?dur(g.mins*s.pct/100):dur(g.mins*s.pct/100);
      if(r.review)s.queue=Math.round(24*s.pct/100);
      if(s.pct>=100){
        if(r.review){s.st="needs";s.line=s.queue+" waiting on you";s.right="";
          rlog(r.plain.title+" — "+s.queue+" need your decision","warn");}
        else{s.st="done";s.line=num(g.out)+" "+g.grainOut+" out";s.right=dur(g.mins);
          rlog("Finished — "+r.plain.title+" · "+num(g.out)+" out"+(g.cost?" · "+money(g.cost):""),"ok");
          /* the moment a recovery step finishes it has INVALIDATED earlier answers for the
             records it touched. That is a job, not a footnote on a stage. */
          if(r.recover)reworkEdges().filter(e=>e.from.id===n.id).forEach(e=>{
            const back=Math.round((g.out||0)*reworkShare(n));
            if(back>0){addWork({step:e.to.id,from:n.id,kind:"back",n:back,at:"just now",
              cause:"a re-read of pages we already had found addresses we could not read at the time — none of them have ever been checked"});
              rlog(num(back)+" records need "+reg(e.to).plain.title.toLowerCase()+" again","warn");}
          });}
      }
    }
  });
  WORK.filter(w=>w.status==="running").forEach(w=>{
    w.pct=Math.min(100,w.pct+RUN.speed*9);
    if(w.pct>=100){w.status="done";
      rlog("Job finished — "+num(w.n)+" records re-checked","ok");}
  });
  /* a running JOB keeps the clock alive on its own. Every step being finished does not
     mean the list is finished — that is the entire point of work orders: the funnel is
     done and there is still work outstanding against it. */
  const stepsDone=PLAN.nodes.every(n=>n.skipped||["done","needs"].includes(RUN.state[n.id].st));
  const allDone=stepsDone&&!WORK.some(w=>w.status==="running");
  if(allDone){RUN.on=false;clearInterval(RUN.timer);RUN.timer=0;
    rlog(openWork().length?"Run complete — "+openWork().length+" job(s) still outstanding":"Run complete","ok");
    toast("Run complete","ok");}
  renderWorld();renderRollup();
  /* the "where are the records" list is the panel you sit and watch — it has to move
     with the run, not only when something else happens to re-render the side */
  if(panel==="lint")renderRight();
  if(PEEK.node)renderPeek(true);          // live counts in the open sheet, table untouched
  if(panel==="log")renderLog();
  if(!working&&!allDone&&RUN.tick>3){/* nothing runnable: a gate is waiting on a human */}
}

/* ============================================================================
   11a · THE STRATEGY RECORD — the rail's other tab, available in every mode
   ----------------------------------------------------------------------------
   The ask: months later, or mid-run, be able to go back and see everything we told
   it — the brief, the starting point, the questions we answered — and change it. A chat
   transcript does not do that job: it is ordered by when things were said, not by what
   is currently true, and half of it is the assistant talking. So the strategy is a short
   standing record of the CURRENT answers, editable in place, and the chat is one of two
   ways to fill it in. Both write the same fields on the plan.

   It lives in the persistent rail rather than inside mode ①, so it is reachable while a
   run is going without leaving the run.
   ============================================================================ */
let rail="strategy";
function setRail(r){
  rail=r;
  $$("#railseg button").forEach(b=>b.classList.toggle("on",b.dataset.r===r));
  const side=$("#side");
  side.classList.toggle("r-strategy",r==="strategy");
  side.classList.toggle("r-chat",r==="chat");
  if(r==="strategy")renderStrategy();
}
function openRail(r){
  $("#side").className="side wide";
  setRail(r||rail);
}
function strategyStale(){return strategySig(PLAN)!==DRAFTED_SIG;}
function renderStrategy(){
  const t=totals(), live=PLAN.nodes.filter(n=>!n.skipped).length,
        skipped=PLAN.nodes.filter(n=>n.skipped).length, stale=strategyStale();
  $("#strategybody").innerHTML=`<div class="strat">
    ${stale?`<div class="stale"><h5>⚠ The plan was drafted before these answers</h5>
      <p>The picture on the canvas still reflects what you said earlier. Nothing re-plans itself
         behind your back — especially not while a run is going.</p>
      <button class="btn sm" data-st="redraft">Re-draft the plan from these answers</button>
      <button class="btn gray sm" data-st="revert">Undo my changes</button></div>`:""}

    <div class="sec"><div class="hd">Who we are trying to reach</div>
      <textarea data-st-brief rows="4" placeholder="Describe the audience in plain speech…">${(PLAN.brief||"").replace(/</g,"&lt;")}</textarea>
    </div>

    <div class="sec"><div class="hd">What we started from</div>
      <div class="chips">${ENTRIES.map(([k,l])=>
        `<button class="pick${PLAN.entry===k?" on":""}" data-st-entry="${k}">${l}</button>`).join("")}</div>
      <div class="foot" style="border:0;padding-top:9px">This decides which steps are even possible.
        Starting from nothing means collection comes first and every free filter can run ahead of
        anything metered.</div>
    </div>

    <div class="sec"><div class="hd">Decisions that shape the plan</div>
      ${QUESTIONS.map((q,i)=>`<div class="qa">
        <div class="q"><span class="n">${i+1}.</span><span>${q.q}</span></div>
        <textarea data-st-a="${i}" rows="2" placeholder="Your answer…">${(PLAN.answers[i]||"").replace(/</g,"&lt;")}</textarea>
        ${(PLAN.answers[i]||"").trim()
          ?`<div class="ok">✓ saved — this carries into every future re-plan</div>`
          :`<div class="un">not answered — the planner will have to guess</div>`}</div>`).join("")}
    </div>

    <div class="sec"><div class="hd">What this produced</div>
      <div class="stats">
        <div class="st"><div class="l">Steps</div><div class="v">${live}${skipped?` <span style="font-size:11px;color:#8b95a5;font-weight:600">+${skipped} skipped</span>`:""}</div></div>
        <div class="st ${t.cost>PLAN.budget?"over":""}"><div class="l">Cost</div><div class="v">${money(t.cost)}</div></div>
        <div class="st"><div class="l">Clock time</div><div class="v">${dur(t.mins)}</div></div>
        <div class="st"><div class="l">Sendable</div><div class="v">${num(t.sendable)}</div></div>
      </div>
      ${t.cost>PLAN.budget?`<div class="foot" style="border:0;padding-top:9px;color:var(--red)">
        Over your ${money(PLAN.budget)} ceiling — flagged in the lint rather than quietly trimmed.</div>`:""}
    </div>

    <div class="foot">Everything here is an <b>input</b>, not a record of the conversation.
      Change an answer and the plan is marked as drafted-before — you decide when to re-draft.
      Answers are matched by question, so they survive every future re-plan of this list.</div>
  </div>`;
}
$("#railseg").onclick=e=>{const b=e.target.closest("button");if(b)setRail(b.dataset.r);};
$("#strategybody").addEventListener("input",e=>{
  const t=e.target;
  if(t.hasAttribute("data-st-brief")){PLAN.brief=t.value;markStrategyEdited();}
  else if(t.hasAttribute("data-st-a")){PLAN.answers[+t.dataset.stA]=t.value;markStrategyEdited();}
});
/* Re-rendering on every keystroke would steal focus mid-sentence — the recurring SPA bug
   in this suite. Only re-render when the stale banner actually has to appear or go away,
   and put the caret back where it was. */
function markStrategyEdited(){
  const stale=strategyStale(), has=!!$("#strategybody .stale");
  if(stale===has)return;
  const el=document.activeElement;
  const sel=el&&el.hasAttribute&&el.hasAttribute("data-st-brief")?"[data-st-brief]"
           :el&&el.dataset&&el.dataset.stA!=null?`[data-st-a="${el.dataset.stA}"]`:null;
  const pos=el&&el.selectionStart;
  renderStrategy();
  if(sel){const again=$("#strategybody "+sel);
    if(again){again.focus();try{again.setSelectionRange(pos,pos);}catch(x){}}}
}
$("#strategybody").addEventListener("click",e=>{
  const en=e.target.closest("[data-st-entry]");
  if(en){PLAN.entry=en.dataset.stEntry;renderStrategy();return;}
  const a=e.target.closest("[data-st]");if(!a)return;
  if(a.dataset.st==="redraft"){
    const keep={brief:PLAN.brief,entry:PLAN.entry,answers:PLAN.answers.slice()};
    pushUndo("re-draft from the strategy");
    PLAN=JSON.parse(JSON.stringify(START_PLAN));Object.assign(PLAN,keep);
    manual={};DRAFTED_SIG=strategySig(PLAN);
    resetRun();selected=null;panel="lint";
    layout(true);render();renderStrategy();fit();
    toast("Re-drafted from your answers — nothing has been spent","ok");
  }
  if(a.dataset.st==="revert"){
    const d=JSON.parse(DRAFTED_SIG);
    PLAN.brief=d[0];PLAN.entry=d[1];PLAN.answers=d[2];
    renderStrategy();toast("Back to the answers this plan was drafted from");
  }
});

const CHAT_SCRIPT=[
 {who:"bot",body:`I can help you plan a list. Tell me who you want to reach — plain speech is fine,
   the way you would describe it to a colleague.`},
 {wait:"input",
  then:{who:"bot",body:`Good — that is a category Google Maps knows well, so we can start from nothing
   and still get a complete picture.<br><br>Before I draft anything: <b>what do you already have?</b>`,
  entry:true}},
 {wait:"entry",
  then:{who:"bot",body:`Starting from nothing, then. That means collection comes first and we can put every
   free filter ahead of anything that costs money.<br><br>Two things change the plan enough that I should ask
   rather than guess:`,questions:true}},
 {wait:"questions",
  then:{who:"bot",body:`That is what I needed. I checked the category against the Census business counts as a
   sanity check on the size, and drafted a plan: <b>12 steps</b>, one deliberately skipped, about
   <b>7 hours</b> of clock time and <b>$55.85</b> — which is over your $50 ceiling, so I have flagged it
   rather than quietly trimming it.<br><br>The plan is a picture. Have a look.`,done:true}}
];
const QUESTIONS=[
 {q:"Independent practices only, or should small local chains count too?",
  a:"Independents only — anything with more than 3 locations is out."},
 {q:"Who is the person you actually want — the owner, or whoever handles marketing?",
  a:"The owner or principal. One per practice."}
];
let chatStep=0, entryPick=null;
/* the chat writes the SAME fields the strategy record edits — one plan artifact, two ways in */
const ENTRIES=[["nothing","Nothing yet"],["accounts","Companies, no people"],
  ["contacts_li","People + LinkedIn"],["contacts_email","People + emails"]];

function chatPush(m){
  const log=$("#chatlog");
  const el=N("div","msg "+(m.who==="me"?"me":"bot"));
  el.innerHTML=`${m.who==="me"?"":`<div class="who">List Flow</div>`}<div class="bub">${m.body}</div>`;
  if(m.entry){
    const c=N("div","chips");
    ENTRIES.forEach(([k,l])=>{const b=N("button","pick"+(entryPick===k?" on":""),l);
      b.onclick=()=>{entryPick=k;PLAN.entry=k;if(rail==="strategy")renderStrategy();
        chatPush({who:"me",body:l});advance("entry");};
      c.appendChild(b);});
    el.querySelector(".bub").appendChild(c);
  }
  if(m.questions){
    QUESTIONS.forEach((q,i)=>{
      const d=N("div","qa",`<div class="q"><span class="n">${i+1}.</span><span>${q.q}</span></div>
        <textarea data-q="${i}" placeholder="Your answer…">${(PLAN.answers[i]||"").replace(/</g,"&lt;")}</textarea>
        <div class="ok" style="display:none">✓ saved — this carries into every future re-plan</div>`);
      const ta=d.querySelector("textarea");
      if((PLAN.answers[i]||"").trim())d.querySelector(".ok").style.display="block";
      ta.oninput=()=>{PLAN.answers[i]=ta.value;markStrategyEdited();
        d.querySelector(".ok").style.display=ta.value.trim()?"block":"none";
        if(QUESTIONS.every((_,j)=>(PLAN.answers[j]||"").trim()))showDraft();};
      el.querySelector(".bub").appendChild(d);
    });
    const c=N("div","chips");
    const b=N("button","pick","Use my usual answers");
    b.onclick=()=>{QUESTIONS.forEach((q,i)=>{PLAN.answers[i]=q.a;
      const ta=el.querySelector(`textarea[data-q="${i}"]`);
      if(ta){ta.value=q.a;ta.dispatchEvent(new Event("input"));}});};
    c.appendChild(b);el.querySelector(".bub").appendChild(c);
  }
  if(m.done){
    const c=N("div","chips");
    const b=N("button","pick on","Open the plan →");
    b.onclick=()=>setMode("plan");
    c.appendChild(b);el.querySelector(".bub").appendChild(c);
  }
  log.appendChild(el);log.scrollTop=log.scrollHeight;
}
function typingOn(){
  const log=$("#chatlog");
  const el=N("div","msg bot");el.id="typing";
  el.innerHTML=`<div class="bub"><div class="typing"><i></i><i></i><i></i></div></div>`;
  log.appendChild(el);log.scrollTop=log.scrollHeight;
}
function typingOff(){const t=$("#typing");if(t)t.remove();}
let draftShown=false;
function showDraft(){
  if(draftShown)return;draftShown=true;
  setTimeout(()=>advance("questions"),700);
}
function advance(kind){
  const step=CHAT_SCRIPT[chatStep];
  if(!step||step.wait!==kind)return;
  chatStep++;
  const nxt=step.then;
  typingOn();
  setTimeout(()=>{typingOff();chatPush(nxt);
    const after=CHAT_SCRIPT[chatStep];
    if(after&&!after.wait){chatStep++;chatPush(after);}
  },780);
}
function chatSend(){
  const v=$("#chatbox").value.trim();
  if(!v)return;
  $("#chatbox").value="";
  chatPush({who:"me",body:v.replace(/</g,"&lt;")});
  if(CHAT_SCRIPT[chatStep]&&CHAT_SCRIPT[chatStep].wait==="input"){
    PLAN.brief=v;markStrategyEdited();advance("input");}
  else{
    typingOn();
    setTimeout(()=>{typingOff();chatPush({who:"bot",body:`In the real tool this edits the graph directly —
      “add a franchise cut before the paid verify” becomes a proposed change you approve.
      The chat rail never goes away; it is another way to edit the plan.`});},700);
  }
}
function bootChat(){
  $("#chatlog").innerHTML="";chatStep=0;draftShown=false;
  chatPush(CHAT_SCRIPT[0]);chatStep=1;
}

function setMode(m){
  mode=m;
  document.body.className="mode-"+m;          // NOTE: this wipes sheeting/focusing
  /* Strategize has no canvas, so a data sheet there would point at nothing. Plan and Run
     share one canvas, so the sheet survives the toggle between them. */
  if(m==="strategize")PEEK.node=null; else if(PEEK.node)document.body.classList.add("sheeting");
  $$("#modeseg button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  const side=$("#side");
  side.className="side "+(m==="strategize"?"wide":"thin");
  /* the rail keeps whichever tab you left it on — the strategy record is not a phase-①
     screen, it is the standing answer to "what did we tell it", readable during a run */
  setRail(rail);
  /* the canvas keeps its camera across Plan <-> Run: it is ONE canvas, two states */
  if(m==="run"){
    if(!Object.keys(RUN.state).length||RUN.sig!==planSig()){
      const had=RUN.tick>0;
      resetRun();
      if(had)toast("The plan changed — run reset","warn");
    }
    ensureRunState();

    $("#addbtn").textContent=RUN.on?"⏸ Pause":"▶ Start the run";
    if(panel==="palette")panel="lint";
  }else{
    $("#addbtn").textContent="+ Add action";
  }

  render();
  if(window.TUT)TUT.onMode(m);
}

let SETUP_NODE=null, PROBE_RESULTS={};
function setupNode(){return PLAN.nodes.find(n=>n.id===SETUP_NODE);}
function openSetup(id){
