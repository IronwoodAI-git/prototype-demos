// TEMPLATES
// ============================================================
const TEMPLATES_KEY = 'pe-templates';

// Built-in templates ship with the app. They start from getDefaultData() and
// apply the overrides below. They cannot be renamed/deleted/edited.
const BUILTIN_TEMPLATES = {
  'Flat Header': {
    meta: { headerStyle: 'flat-blue' }
  }
};

function isBuiltinTemplate(id) {
  return Object.prototype.hasOwnProperty.call(BUILTIN_TEMPLATES, id);
}

function getTemplates() {
  try { return JSON.parse(localStorage.getItem(TEMPLATES_KEY)) || {}; } catch { return {}; }
}

function refreshTemplateSelector() {
  const sel = document.getElementById('template-selector');
  const templates = getTemplates();
  sel.innerHTML = '<option value="">Default</option>';
  Object.keys(BUILTIN_TEMPLATES).forEach(k => {
    sel.innerHTML += `<option value="${escAttr(k)}">${escHtml(k)}</option>`;
  });
  Object.keys(templates).forEach(k => {
    if (isBuiltinTemplate(k)) return;
    sel.innerHTML += `<option value="${escAttr(k)}">${escHtml(k)}</option>`;
  });
}

function saveAsTemplate() {
  const name = prompt('Template name (e.g., "Conversion Project", "Full Build"):', '');
  if (!name) return;
  const templates = getTemplates();
  const templateData = JSON.parse(JSON.stringify(data));
  // Clear client-specific fields so it's a clean starting point
  templateData.meta.clientName = 'Client Name';
  templateData.meta.intro = templateData.meta.intro;
  templateData.overview = templateData.overview;
  templates[name] = templateData;
  safeLocalStorageWrite(TEMPLATES_KEY, JSON.stringify(templates));
  refreshTemplateSelector();
  const btn = event.target;
  const orig = btn.textContent;
  btn.textContent = 'Saved!';
  setTimeout(() => { btn.textContent = orig; }, 1200);
}

function todayDateString() {
  return new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}

function newFromTemplate() {
  const sel = document.getElementById('template-selector');
  const templateId = sel.value;
  // Auto-save current work
  if (currentProposalId) autoSave();
  if (currentTemplateId) { currentTemplateId = null; updateTemplateEditBanner(); }
  if (templateId && isBuiltinTemplate(templateId)) {
    data = getDefaultData();
    const overrides = BUILTIN_TEMPLATES[templateId];
    if (overrides.meta) Object.assign(data.meta, overrides.meta);
  } else if (templateId) {
    const templates = getTemplates();
    if (templates[templateId]) {
      data = JSON.parse(JSON.stringify(templates[templateId]));
    }
  } else {
    data = getDefaultData();
  }
  // Always stamp new proposals with today's date
  if (data.meta) data.meta.date = todayDateString();
  // Remember which template this proposal was started from, so "Set as default"
  // can be scoped to that template instead of the global default. '' = Default.
  if (data.meta) data.meta.sourceTemplate = templateId || '';
  currentProposalId = null;
  document.getElementById('proposal-selector').value = '__new__';
  buildEditor(); render();
}

function renameTemplate() {
  const sel = document.getElementById('template-selector');
  const id = sel.value;
  if (!id) return;
  if (isBuiltinTemplate(id)) { alert('Built-in templates cannot be renamed.'); return; }
  const name = prompt('New template name:', id);
  if (!name || name === id) return;
  const templates = getTemplates();
  templates[name] = templates[id];
  delete templates[id];
  safeLocalStorageWrite(TEMPLATES_KEY, JSON.stringify(templates));
  if (currentTemplateId === id) {
    currentTemplateId = name;
    updateTemplateEditBanner();
  }
  refreshTemplateSelector();
  sel.value = name;
}

function deleteTemplate() {
  const sel = document.getElementById('template-selector');
  const id = sel.value;
  if (!id) return;
  if (isBuiltinTemplate(id)) { alert('Built-in templates cannot be deleted.'); return; }
  if (!confirm(`Delete template "${id}"?`)) return;
  const templates = getTemplates();
  delete templates[id];
  safeLocalStorageWrite(TEMPLATES_KEY, JSON.stringify(templates));
  if (currentTemplateId === id) exitTemplateEdit();
  refreshTemplateSelector();
}

function editTemplate() {
  const sel = document.getElementById('template-selector');
  const id = sel.value;
  if (!id) { alert('Select a template to edit.'); return; }
  if (isBuiltinTemplate(id)) { alert('Built-in templates cannot be edited. Use "New" to create a proposal from it, or "Save as Template" to make a customized copy.'); return; }
  const templates = getTemplates();
  if (!templates[id]) return;
  if (currentProposalId) autoSave();
  data = JSON.parse(JSON.stringify(templates[id]));
  if (data.meta) data.meta.sourceTemplate = id;
  currentProposalId = null;
  currentTemplateId = id;
  document.getElementById('proposal-selector').value = '__new__';
  updateTemplateEditBanner();
  buildEditor(); render();
}

function saveTemplateEdits() {
  if (!currentTemplateId) return;
  const templates = getTemplates();
  templates[currentTemplateId] = JSON.parse(JSON.stringify(data));
  safeLocalStorageWrite(TEMPLATES_KEY, JSON.stringify(templates));
  const btn = document.querySelector('.tmpl-banner-actions button:first-child');
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = 'SAVED!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  }
}

function exitTemplateEdit() {
  currentTemplateId = null;
  data = getDefaultData();
  updateTemplateEditBanner();
  buildEditor(); render();
}

function updateTemplateEditBanner() {
  const banner = document.getElementById('template-edit-banner');
  const nameEl = document.getElementById('template-edit-name');
  const saveBtn = document.querySelector('.btn-save');
  if (!banner) return;
  if (currentTemplateId) {
    banner.style.display = 'flex';
    if (nameEl) nameEl.textContent = currentTemplateId;
    if (saveBtn) saveBtn.textContent = 'Save Template';
  } else {
    banner.style.display = 'none';
    if (saveBtn) saveBtn.textContent = 'Save';
  }
}

// ============================================================
// PER-SECTION DEFAULTS
// ============================================================
// Maps section keys to the data paths they control
const SECTION_DATA_MAP = {
  cover:        ['meta.preparedBy', 'meta.subtitle', 'meta.intro'],
  pricing:      ['pricing'],
  phases:       ['phases'],
  overview:     ['overview'],
  contentMigration: ['contentMigration'],
  process:      ['process'],
  plugins:      ['plugins', 'pluginCost'],
  deliverables: ['deliverables'],
  schedule:     ['schedule'],
  billing:      ['billing'],
  ongoingSupport: ['ongoingSupport'],
  team:         ['team'],
  references:   ['references']
};

// Resolve which template's default "Set as default" / "Reset" should modify.
// Returns a custom-template name, or '' meaning the global Default.
function currentTemplateContext() {
  if (currentTemplateId) return currentTemplateId;
  if (data && data.meta && typeof data.meta.sourceTemplate === 'string') return data.meta.sourceTemplate;
  return '';
}

// Path helpers for the one- and two-level keys in SECTION_DATA_MAP.
function getDataPath(obj, p) {
  const parts = p.split('.');
  return parts.length === 1 ? obj[parts[0]] : (obj[parts[0]] || {})[parts[1]];
}
function setDataPath(obj, p, val) {
  const parts = p.split('.');
  const clone = JSON.parse(JSON.stringify(val));
  if (parts.length === 1) { obj[parts[0]] = clone; }
  else { if (!obj[parts[0]]) obj[parts[0]] = {}; obj[parts[0]][parts[1]] = clone; }
}
function deleteDataPath(obj, p) {
  const parts = p.split('.');
  if (parts.length === 1) delete obj[parts[0]];
  else if (obj[parts[0]]) delete obj[parts[0]][parts[1]];
}
function flashDefaultLink(link, msg, color) {
  if (!link) return;
  const orig = link.textContent;
  link.textContent = msg;
  if (color) link.style.color = color;
  setTimeout(() => { link.textContent = orig; link.style.color = ''; }, 1500);
}

function saveSectionDefault(sectionKey) {
  const paths = SECTION_DATA_MAP[sectionKey];
  if (!paths) return;
  const tid = currentTemplateContext();
  const templates = getTemplates();
  if (tid && templates[tid]) {
    // Scope the default to THIS template only — write the current value into
    // the template's own stored data. Other templates are unaffected.
    paths.forEach(p => setDataPath(templates[tid], p, getDataPath(data, p)));
    safeLocalStorageWrite(TEMPLATES_KEY, JSON.stringify(templates));
    flashDefaultLink(event && event.target, 'Saved to template!', '#2a7d3f');
  } else {
    // No custom-template context → this is the Default; keep global behavior.
    const defaults = getCustomDefaults() || {};
    paths.forEach(p => setDataPath(defaults, p, getDataPath(data, p)));
    safeLocalStorageWrite(DEFAULTS_KEY, JSON.stringify(defaults));
    flashDefaultLink(event && event.target, 'Saved!', '#2a7d3f');
  }
}

function resetSectionDefault(sectionKey) {
  const paths = SECTION_DATA_MAP[sectionKey];
  if (!paths) return;
  const tid = currentTemplateContext();
  const templates = getTemplates();
  if (tid && templates[tid]) {
    // Revert this section in the template back to the base default.
    const base = getDefaultData();
    paths.forEach(p => setDataPath(templates[tid], p, getDataPath(base, p)));
    safeLocalStorageWrite(TEMPLATES_KEY, JSON.stringify(templates));
    flashDefaultLink(event && event.target, 'Reset!');
  } else {
    const defaults = getCustomDefaults();
    if (!defaults) return;
    paths.forEach(p => deleteDataPath(defaults, p));
    safeLocalStorageWrite(DEFAULTS_KEY, JSON.stringify(defaults));
    flashDefaultLink(event && event.target, 'Reset!');
  }
}

function switchTab(tab) {
  const editorView = document.getElementById('editor-view');
  const pipelineView = document.getElementById('pipeline-view');
  const tabEditor = document.getElementById('tab-editor');
  const tabPipeline = document.getElementById('tab-pipeline');
  const editorActions = document.getElementById('editor-actions');
  const pipelineActions = document.getElementById('pipeline-actions');

  if (tab === 'pipeline') {
    editorView.style.display = 'none';
    pipelineView.classList.add('active');
    tabEditor.classList.remove('active');
    tabPipeline.classList.add('active');
    editorActions.style.display = 'none';
    pipelineActions.style.display = 'flex';
    renderPipeline();
  } else {
    editorView.style.display = 'flex';
    pipelineView.classList.remove('active');
    tabEditor.classList.add('active');
    tabPipeline.classList.remove('active');
    editorActions.style.display = 'flex';
    pipelineActions.style.display = 'none';
  }
}

// ============================================================
// PIPELINE
// ============================================================
const PIPELINE_KEY = 'pe-pipeline';

function getPipeline() {
  try { return JSON.parse(localStorage.getItem(PIPELINE_KEY)) || []; } catch { return []; }
}
function savePipeline(items) {
  safeLocalStorageWrite(PIPELINE_KEY, JSON.stringify(items), { silent: true });
}

function addToPipeline(proposalName) {
  const items = getPipeline();
  // Check if this proposal already exists
  const existing = items.find(it => it.name === proposalName);
  if (existing) {
    // Update amount and version
    const proposals = getProposals();
    const p = proposals[proposalName];
    if (p) {
      existing.amount = calcProposalTotal(p);
      existing.version = p.meta.version || 1;
      existing.lastModified = new Date().toISOString().split('T')[0];
    }
  } else {
    const proposals = getProposals();
    const p = proposals[proposalName];
    const amount = p ? calcProposalTotal(p) : 0;
    items.push({
      id: Date.now().toString(36),
      name: proposalName,
      amount: amount,
      version: (p && p.meta.version) || 1,
      status: 'draft',
      dateSent: '',
      followUp: '',
      notes: '',
      lastModified: new Date().toISOString().split('T')[0],
      dateCreated: new Date().toISOString().split('T')[0]
    });
  }
  savePipeline(items);
}

function calcProposalTotal(p) {
  if (!p || !p.pricing || !p.pricing.lineItems) return 0;
  return p.pricing.lineItems
    .filter(li => li.enabled)
    .reduce((sum, li) => sum + Number(li.amount || 0), 0);
}

function calcAltTotal(p) {
  if (!p || !p.pricing || !p.pricing.lineItems) return 0;
  return p.pricing.lineItems
    .filter(li => li.enabled)
    .reduce((sum, li) => sum + Number(li.altAmount || li.amount || 0), 0);
}

function updatePipelineField(id, field, value) {
  const items = getPipeline();
  const item = items.find(it => it.id === id);
  if (item) {
    item[field] = value;
    savePipeline(items);
    renderPipeline(); // re-render to update stats
  }
}

function removePipelineItem(id) {
  if (!confirm('Remove this proposal from the pipeline?')) return;
  const items = getPipeline().filter(it => it.id !== id);
  savePipeline(items);
  renderPipeline();
}

function openProposalFromPipeline(name) {
  loadProposal(name);
  switchTab('editor');
}

function syncAllToPipeline() {
  const proposals = getProposals();
  Object.keys(proposals).forEach(name => addToPipeline(name));
  renderPipeline();
}

function markComplete() {
  if (!currentProposalId) {
    alert('Save the proposal first before marking it complete.');
    return;
  }
  // Save current state
  saveProposal(true);
  // Add/update in pipeline with 'sent' status
  addToPipeline(currentProposalId);
  const items = getPipeline();
  const item = items.find(it => it.name === currentProposalId);
  if (item && item.status === 'draft') {
    item.status = 'sent';
    item.dateSent = new Date().toISOString().split('T')[0];
    savePipeline(items);
  }
  // Visual feedback — go solid orange (completed state)
  const btn = document.getElementById('btn-mark-complete');
  btn.classList.add('completed');
  btn.innerHTML = '&#x2714; In Pipeline';
}

function addManualPipelineEntry() {
  const name = prompt('Proposal / Client name:');
  if (!name) return;
  const amountStr = prompt('Total amount (e.g. 45000):', '0');
  if (amountStr === null) return;
  const amount = Number(amountStr.replace(/[^0-9.]/g, '')) || 0;

  const items = getPipeline();
  items.push({
    id: Date.now().toString(36),
    name: name,
    amount: amount,
    version: 1,
    status: 'sent',
    dateSent: new Date().toISOString().split('T')[0],
    followUp: '',
    notes: '',
    lastModified: new Date().toISOString().split('T')[0],
    dateCreated: new Date().toISOString().split('T')[0],
    manual: true
  });
  savePipeline(items);
  renderPipeline();
}

function fmtCurrency(n) {
  return '$' + Number(n || 0).toLocaleString('en-US');
}

function renderPipeline() {
  const el = document.getElementById('pipeline-view');
  const items = getPipeline();

  // Calculate stats
  const totalAll = items.reduce((s, it) => s + Number(it.amount || 0), 0);
  const wonItems = items.filter(it => it.status === 'won');
  const lostItems = items.filter(it => it.status === 'lost');
  const pendingItems = items.filter(it => it.status === 'sent' || it.status === 'draft');
  const totalWon = wonItems.reduce((s, it) => s + Number(it.amount || 0), 0);
  const totalLost = lostItems.reduce((s, it) => s + Number(it.amount || 0), 0);
  const totalPending = pendingItems.reduce((s, it) => s + Number(it.amount || 0), 0);

  let html = `
    <div class="pipeline-header">
      <h2>Proposal Pipeline</h2>
      <div style="display:flex;gap:8px">
        <button class="topbar-btn btn-load" onclick="addManualPipelineEntry()" style="font-size:10px;padding:6px 12px;color:var(--navy);border-color:var(--border);background:white">+ Add Manual Entry</button>
        <button class="topbar-btn btn-save" onclick="syncAllToPipeline()" style="font-size:10px;padding:6px 12px">Sync All Proposals</button>
      </div>
    </div>

    <div class="pipeline-stats" style="margin-bottom:24px">
      <div class="pipeline-stat">
        <div class="stat-value">${items.length}</div>
        <div class="stat-label">Total Proposals</div>
      </div>
      <div class="pipeline-stat">
        <div class="stat-value">${fmtCurrency(totalAll)}</div>
        <div class="stat-label">Total Value</div>
      </div>
      <div class="pipeline-stat won">
        <div class="stat-value">${fmtCurrency(totalWon)}</div>
        <div class="stat-label">Won (${wonItems.length})</div>
      </div>
      <div class="pipeline-stat pending">
        <div class="stat-value">${fmtCurrency(totalPending)}</div>
        <div class="stat-label">Pending (${pendingItems.length})</div>
      </div>
      <div class="pipeline-stat lost">
        <div class="stat-value">${fmtCurrency(totalLost)}</div>
        <div class="stat-label">Lost (${lostItems.length})</div>
      </div>
    </div>`;

  if (items.length === 0) {
    html += `
      <div class="pipeline-empty">
        <p>No proposals in the pipeline yet.</p>
        <small>Click "Sync All Proposals" to pull in your saved proposals, or proposals are automatically added when you export a JSON.</small>
      </div>`;
  } else {
    // Sort: pending first, then by date
    const sorted = [...items].sort((a, b) => {
      const order = { draft: 0, sent: 1, won: 2, lost: 3 };
      const diff = (order[a.status] || 0) - (order[b.status] || 0);
      return diff !== 0 ? diff : (b.lastModified || '').localeCompare(a.lastModified || '');
    });

    html += `
      <table class="pipeline-table">
        <thead>
          <tr>
            <th>Proposal</th>
            <th>Amount</th>
            <th>Version</th>
            <th>Status</th>
            <th>Date Sent</th>
            <th>Follow-up</th>
            <th>Notes</th>
            <th></th>
          </tr>
        </thead>
        <tbody>`;

    const proposals = getProposals();
    sorted.forEach(item => {
      const hasProposal = !item.manual && proposals[item.name];
      const nameCell = hasProposal
        ? `<a href="#" onclick="openProposalFromPipeline('${escAttr(item.name)}');return false" style="color:var(--navy);font-weight:600;text-decoration:none">${escHtml(item.name)}</a>`
        : item.manual
          ? `<input type="text" value="${escAttr(item.name)}" onchange="updatePipelineField('${item.id}','name',this.value)" style="font-weight:600;color:var(--navy);border:1px solid var(--border)">`
          : `<span style="font-weight:600;color:var(--navy)">${escHtml(item.name)}</span>`;
      const amountCell = item.manual
        ? `<input type="text" value="${item.amount || 0}" onchange="updatePipelineField('${item.id}','amount',Number(this.value.replace(/[^0-9.]/g,''))||0);this.value=Number(this.value.replace(/[^0-9.]/g,''))||0" style="font-weight:700;color:var(--navy);width:90px;text-align:right">`
        : `${fmtCurrency(item.amount)}`;
      html += `
          <tr>
            <td>${nameCell}</td>
            <td style="font-weight:700;color:var(--navy);white-space:nowrap">${amountCell}</td>
            <td style="text-align:center;color:var(--text-light)">${item.manual ? '\u2014' : 'v' + (item.version || 1)}</td>
            <td>
              <select value="${item.status || 'draft'}" onchange="updatePipelineField('${item.id}','status',this.value)" style="min-width:80px">
                <option value="draft" ${item.status === 'draft' ? 'selected' : ''}>Draft</option>
                <option value="sent" ${item.status === 'sent' ? 'selected' : ''}>Sent</option>
                <option value="won" ${item.status === 'won' ? 'selected' : ''}>Won</option>
                <option value="lost" ${item.status === 'lost' ? 'selected' : ''}>Lost</option>
              </select>
            </td>
            <td><input type="date" value="${item.dateSent || ''}" onchange="updatePipelineField('${item.id}','dateSent',this.value)"></td>
            <td><input type="date" value="${item.followUp || ''}" onchange="updatePipelineField('${item.id}','followUp',this.value)"></td>
            <td><input type="text" value="${escAttr(item.notes || '')}" placeholder="Notes..." onchange="updatePipelineField('${item.id}','notes',this.value)" style="min-width:120px"></td>
            <td class="pipeline-actions-cell">
              <button onclick="removePipelineItem('${item.id}')" title="Remove">\u2716</button>
            </td>
          </tr>`;
    });

    html += `
        </tbody>
      </table>`;
  }

  el.innerHTML = html;
}

function exportPipelineCSV() {
  const items = getPipeline();
  if (!items.length) { alert('No pipeline data to export.'); return; }
  const headers = ['Proposal', 'Amount', 'Version', 'Status', 'Date Sent', 'Follow-up', 'Notes', 'Created', 'Last Modified'];
  const rows = items.map(it => [
    it.name,
    it.amount || 0,
    'v' + (it.version || 1),
    it.status || 'draft',
    it.dateSent || '',
    it.followUp || '',
    '"' + (it.notes || '').replace(/"/g, '""') + '"',
    it.dateCreated || '',
    it.lastModified || ''
  ]);
  const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'proposal-pipeline.csv';
  a.click();
}

// ============================================================
refreshProposalSelector();
refreshTemplateSelector();
// Auto-load last worked-on proposal
const lastId = localStorage.getItem(STORAGE_KEY + '-last');
if (lastId) {
  const proposals = getProposals();
  if (proposals[lastId]) {
    data = JSON.parse(JSON.stringify(proposals[lastId]));
    currentProposalId = lastId;
    document.getElementById('proposal-selector').value = lastId;
  }
}
buildEditor();
render();
updateCompleteButton();

// Open IndexedDB, prime the image cache, and migrate any inline base64 images
// (in the currently-loaded proposal + all stored proposals/templates/defaults)
// into IndexedDB. This frees up localStorage and ensures uploads never re-trigger
// the quota error. Runs in the background; UI is already interactive.
imgDbOpen()
  .then(() => imgDbPrimeCache())
  .then(() => migrateInlineImagesToIdb(data))
  .then(currentChanged => {
    if (currentChanged) {
      // Persist the slimmed-down current proposal back to localStorage.
      if (currentProposalId) autoSave();
      render();
      buildEditor();
    }
    return migrateAllStoredImagesToIdb();
  })
  .catch(err => console.warn('Image migration error:', err));
</script>

<script>
(() => {
  /* ---------- 1. give every sidebar control a data-path ----------
     The sidebar is built by buildEditor() plus a dozen rebuild* functions that
     rewrite their own rows, and none of them emit a path. Rather than edit them
     all, read the path back out of the handler each control already carries.
     Stamping is lazy (on demand) so it always covers rows rebuilt since the
     last pass. First visible element to claim a path wins, which matters for
     the rich-text fields that keep a hidden mirror textarea. */
  function stampEditorPaths() {
    const host = document.getElementById('editor-sections');
    if (!host) return;
    const claimed = new Set();
    host.querySelectorAll('[data-path]').forEach(el => claimed.add(el.getAttribute('data-path')));
    host.querySelectorAll('input, textarea, select, [contenteditable="true"]').forEach(el => {
      if (el.getAttribute('data-path')) return;
      const h = (el.getAttribute('oninput') || '') + ';' + (el.getAttribute('onchange') || '');
      let path = null;
      let m = h.match(/setPath\(\s*data\s*,\s*'([^']+)'/);
      if (m) path = m[1];
      if (!path) { m = h.match(/data\.([A-Za-z]+(?:\.[A-Za-z]+)*)\[(\d+)\]\.([A-Za-z]+)\s*=/); if (m) path = m[1] + '.' + m[2] + '.' + m[3]; }
      if (!path) { m = h.match(/data\.([A-Za-z]+(?:\.[A-Za-z]+)*)\[(\d+)\]\s*=\s*this\./);      if (m) path = m[1] + '.' + m[2]; }
      if (!path) { m = h.match(/data\.([A-Za-z]+(?:\.[A-Za-z]+)+)\s*=\s*this\./);               if (m) path = m[1]; }
      if (!path) return;
      el.setAttribute('data-path', path);
      claimed.add(path);
    });
  }

  /* ---------- 2. tag the rendered proposal ----------
     Runs after every render. Blocks written from code constants (the Extra
     Scope copy, the terms page, the standing footnotes) are deliberately left
     untagged, so they show no hover affordance instead of a dead-end click. */
  const tag = (el, path) => { if (el) el.setAttribute('data-edit', path); };
  const pages = () => [...document.querySelectorAll('#proposal-preview .page')];
  const pageByH2 = t => pages().find(p => {
    const h = p.querySelector('h2');
    return h && h.textContent.trim().indexOf(t) === 0;
  });
  /* Rendered lists are filtered to enabled entries; map display order back to
     the real index so the click lands on the right row. */
  const liveIdx = (arr, key) => (arr || []).map((x, i) => i).filter(i => (arr[i] || {})[key === undefined ? 'enabled' : key] !== false);

  function tagEditable() {
    const wrap = document.getElementById('proposal-preview');
    if (!wrap || typeof data === 'undefined') return;
    wrap.querySelectorAll('[data-edit]').forEach(el => el.removeAttribute('data-edit'));
    const d = data;

    wrap.querySelectorAll('.header-date').forEach(el => tag(el, 'meta.date'));

    const cover = pages().find(p => p.querySelector('.cover-hero'));
    if (cover) {
      tag(cover.querySelector('.cover-title'), 'meta.clientName');
      tag(cover.querySelector('.cover-subtitle'), 'meta.subtitle');
      tag(cover.querySelector('.cover-intro'), 'meta.intro');
      const items = [...cover.querySelectorAll('.cover-meta-item')];
      tag(items[0], 'sec:Pricing');
      tag(items[1], 'schedule.title');
      tag(items[2], 'meta.preparedBy');
    }

    const fee = pageByH2('Project Fee');
    if (fee) {
      tag(fee.querySelector('.pricing-hero'), 'sec:Pricing');
      const live = liveIdx(d.pricing.lineItems);
      const rows = [...fee.querySelectorAll('.fee-table tr')];
      rows.forEach((tr, j) => {
        if (tr.classList.contains('fee-note')) { tag(tr, 'pricing.hourlyRate'); return; }
        if (live[j] !== undefined) tag(tr, 'pricing.lineItems.' + live[j] + '.label');
      });
      tag(fee.querySelector('.callout'), 'pricing.note');
    }

    const ph = pageByH2('Project Phases');
    if (ph) {
      const live = liveIdx(d.phases);
      [...ph.querySelectorAll('.phase-item')].forEach((el, j) => {
        if (live[j] !== undefined) tag(el, 'phases.' + live[j] + '.desc');
      });
    }

    /* Overview can run to several pages; each .overview-content is one entry in
       data.overview, in document order. The migration page reuses the class, so
       skip that one. */
    const cmPage = pageByH2('Content Plan');
    let oi = 0;
    wrap.querySelectorAll('.overview-content').forEach(el => {
      if (cmPage && cmPage.contains(el)) return;
      tag(el, 'overview.' + (oi++));
    });

    if (cmPage) {
      const cm = d.contentMigration || {};
      tag(cmPage.querySelector('.overview-content'), 'contentMigration.intro');
      const h3 = cmPage.querySelector('.page-body > h3');
      tag(h3, 'contentMigration.inventoryTitle');
      if (h3 && h3.nextElementSibling && h3.nextElementSibling.tagName === 'P') tag(h3.nextElementSibling, 'contentMigration.inventoryIntro');
      const live = liveIdx(cm.items);
      [...cmPage.querySelectorAll('.inventory-table tbody tr')].forEach((tr, j) => {
        if (tr.classList.contains('inventory-total')) return;
        if (live[j] === undefined) return;
        tag(tr, 'contentMigration.items.' + live[j] + '.label');
        /* Nested tags win over the row, so the count and note cells land on
           their own boxes rather than on the content-type name. */
        const cells = tr.children;
        if (cells[1]) tag(cells[1], 'contentMigration.items.' + live[j] + '.count');
        if (cells[2]) tag(cells[2], 'contentMigration.items.' + live[j] + '.note');
      });
      tag(cmPage.querySelector('.migration-note'), 'contentMigration.note');
    }

    const pr = pageByH2('Process Overview');
    if (pr) {
      const live = liveIdx(d.process);
      [...pr.querySelectorAll('.process-card')].forEach((el, j) => {
        /* Process cards have no per-card editor in the sidebar (only an
           on/off toggle), so point at the section rather than a field. */
        if (live[j] !== undefined) tag(el, 'sec:Process');
      });
    }

    const pl = pageByH2('Platforms & Tools') || pageByH2('Platforms &amp; Tools');
    if (pl) {
      const live = liveIdx(d.plugins);
      [...pl.querySelectorAll('.page-body > h4')].forEach((h4, j) => {
        if (live[j] === undefined) return;
        tag(h4, 'plugins.' + live[j] + '.name');
        if (h4.nextElementSibling && h4.nextElementSibling.tagName === 'P') tag(h4.nextElementSibling, 'plugins.' + live[j] + '.desc');
      });
      /* pluginCost has no sidebar control of its own yet. */
      tag(pl.querySelector('.callout'), 'sec:Plugins');
    }

    const dl = pages().find(p => {
      const h3 = p.querySelector('.page-body > h3');
      return h3 && h3.textContent.trim() === 'Project Deliverables';
    });
    if (dl) {
      const live = liveIdx(d.deliverables);
      [...dl.querySelectorAll('.deliverables-list li')].forEach((li, j) => {
        if (live[j] !== undefined) tag(li, 'deliverables.' + live[j] + '.text');
      });
    }

    const sch = pageByH2('Project Schedule');
    if (sch) {
      tag(sch.querySelector('h2'), 'schedule.title');
      const ps = [...sch.querySelectorAll('.page-body > p')];
      tag(ps[0], 'schedule.intro');
      tag(ps[1], 'sec:Schedule');   /* schedule.note has no sidebar field yet */
      [...sch.querySelectorAll('.schedule-table tbody tr')].forEach((tr, j) => tag(tr, 'schedule.phases.' + j + '.milestones'));
      [...sch.querySelectorAll('.billing-step')].forEach((el, j) => tag(el, 'billing.' + j + '.label'));
    }

    const os = pageByH2('Ongoing Support');
    if (os) {
      const body = os.querySelector('.page-body');
      let bi = -1;
      if (body) [...body.children].forEach(el => {
        if (el.tagName === 'H3') { bi++; tag(el, 'ongoingSupport.blocks.' + bi + '.heading'); return; }
        if (bi >= 0 && !el.classList.contains('section-number') && !el.classList.contains('section-divider')) tag(el, 'ongoingSupport.blocks.' + bi + '.body');
      });
    }

    const tm = pageByH2(data.brand.company + ' Team');
    if (tm) {
      const live = liveIdx(d.team);
      [...tm.querySelectorAll('.team-member')].forEach((el, j) => {
        /* Team rows are on/off toggles only; no bio editor to jump to. */
        if (live[j] !== undefined) tag(el, 'sec:Team');
      });
    }

    const rf = pageByH2('References');
    if (rf) {
      const live = liveIdx(d.references);
      [...rf.querySelectorAll('.ref-card')].forEach((el, j) => {
        if (live[j] !== undefined) tag(el, 'references.' + live[j] + '.org');
      });
    }
  }

  /* ---------- 3. the jump ---------- */
  const isVisible = el => !!(el && (el.offsetWidth || el.offsetHeight || el.getClientRects().length));
  function edResolve(spec) {
    if (!spec) return {};
    const host = document.getElementById('editor-sections');
    if (!host) return {};
    if (spec.indexOf('sec:') === 0) {
      const t = spec.slice(4).trim().toLowerCase();
      const sec = [...host.querySelectorAll('.editor-section')].find(d => {
        const h = d.querySelector('.editor-section-header');
        return h && h.textContent.trim().toLowerCase().indexOf(t) === 0;
      }) || null;
      return { sec: sec };
    }
    let matches = [...host.querySelectorAll('[data-path="' + spec + '"]')];
    if (!matches.length) { stampEditorPaths(); matches = [...host.querySelectorAll('[data-path="' + spec + '"]')]; }
    if (!matches.length) return {};
    /* A rich-text field keeps a hidden mirror; take whichever is on screen. */
    const target = matches.find(isVisible) || matches[0];
    return { target: target, sec: target.closest('.editor-section') };
  }
  function edLabel(spec) {
    const r = edResolve(spec);
    if (r.target) {
      const field = r.target.closest('.field');
      const lab = field && field.querySelector('.field-label');
      const row = r.target.closest('.toggle-row');
      const rowName = row && row.querySelector('label');
      if (lab) return rowName ? rowName.textContent.trim() + ': ' + lab.textContent.trim() : lab.textContent.trim();
      if (rowName) return rowName.textContent.trim();
    }
    if (r.sec) return r.sec.querySelector('.editor-section-header').textContent.replace(/▶/g, '').trim();
    return 'this text';
  }
  function jumpToEdit(spec) {
    const host = document.getElementById('sidebar');
    const r = edResolve(spec);
    if (!r.sec || !host) return;
    r.sec.classList.add('open');
    /* List rows keep their editor collapsed behind an Edit button. */
    if (r.target) {
      const panel = r.target.closest('.inline-edit');
      if (panel && !panel.classList.contains('open')) {
        panel.classList.add('open');
        const btn = panel.previousElementSibling;
        if (btn && btn.classList.contains('toggle-edit-btn')) btn.textContent = 'Save';
      }
    }
    /* Reading a rect right after opening forces the layout, so positions are
       already correct here; no rAF, which never fires in a hidden tab. */
    const el = r.target || r.sec;
    const box = el.getBoundingClientRect(), hostBox = host.getBoundingClientRect();
    host.scrollTop += box.top - hostBox.top - (r.target ? 90 : 12);
    const hit = r.target ? (r.target.closest('.field') || r.target.closest('.toggle-row') || r.target) : r.sec;
    hit.classList.remove('editing-hit');
    void hit.offsetWidth;
    hit.classList.add('editing-hit');
    setTimeout(() => hit.classList.remove('editing-hit'), 1600);
    if (r.target) {
      r.target.focus({ preventScroll: true });
      try { const n = r.target.value.length; r.target.setSelectionRange(n, n); } catch (e) {}
    }
  }

  let _tip = null;
  function edTip() {
    if (!_tip) { _tip = document.createElement('div'); _tip.className = 'edit-tip'; document.body.appendChild(_tip); }
    return _tip;
  }
  const escTip = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function wireClickToEdit() {
    const wrap = document.getElementById('proposal-preview');
    if (!wrap || wrap.dataset.clickToEdit) return;
    wrap.dataset.clickToEdit = 'on';
    wrap.addEventListener('click', e => {
      const el = e.target.closest('[data-edit]');
      if (!el) return;
      /* Links inside a tagged block keep working. */
      if (e.target.closest('a')) return;
      e.preventDefault();
      jumpToEdit(el.getAttribute('data-edit'));
    });
    wrap.addEventListener('mouseover', e => {
      const el = e.target.closest('[data-edit]');
      const t = edTip();
      if (!el) { t.style.display = 'none'; return; }
      t.innerHTML = '<i>&#9998;</i>' + escTip(edLabel(el.getAttribute('data-edit')));
      t.style.display = 'block';
    });
    wrap.addEventListener('mousemove', e => {
      if (!_tip || _tip.style.display === 'none') return;
      _tip.style.left = Math.max(8, Math.min(window.innerWidth - _tip.offsetWidth - 12, e.clientX + 15)) + 'px';
      _tip.style.top = Math.max(8, e.clientY - 34) + 'px';
    });
    wrap.addEventListener('mouseleave', () => { if (_tip) _tip.style.display = 'none'; });
    window.addEventListener('beforeprint', () => { if (_tip) _tip.style.display = 'none'; });
  }
  function addSidebarHint() {
    const host = document.getElementById('editor-sections');
    if (!host || document.querySelector('.ed-hint')) return;
    host.insertAdjacentHTML('beforebegin', '<div class="ed-hint">Click any text on the proposal to jump to the field that writes it.</div>');
  }

  const priorRender = render;
  render = function () { priorRender.apply(this, arguments); tagEditable(); };
  const priorBuildEditor = buildEditor;
  buildEditor = function () { priorBuildEditor.apply(this, arguments); stampEditorPaths(); addSidebarHint(); };

  stampEditorPaths(); addSidebarHint(); tagEditable(); wireClickToEdit();
})();
</script>
<style>
/* ============ DEMO LAYER (prototype only) ============ */
.pe-story-veil{position:fixed;inset:0;background:rgba(12,53,80,.62);z-index:900;display:flex;align-items:center;justify-content:center}
.pe-story{background:#fff;border-radius:10px;max-width:520px;width:92%;padding:34px 38px 26px;box-shadow:0 18px 60px rgba(0,0,0,.35);font-family:'Mulish',sans-serif}
.pe-story .k{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--orange)}
.pe-story h2{font-size:23px;color:var(--navy);margin:8px 0 12px;line-height:1.25}
.pe-story p{font-size:14.5px;line-height:1.65;color:#3d4652;margin:0 0 12px}
.pe-story .dots{display:flex;gap:6px;margin:16px 0 18px}
.pe-story .dots i{width:8px;height:8px;border-radius:50%;background:#D8DEE6}
.pe-story .dots i.on{background:var(--orange)}
.pe-story .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pe-btn{border:none;border-radius:5px;cursor:pointer;font-family:'Mulish',sans-serif;font-weight:700;font-size:13px;padding:9px 18px}
.pe-btn.pri{background:var(--orange);color:#fff}
.pe-btn.sec{background:#EEF1F5;color:var(--navy)}
.pe-btn.ghost{background:none;color:#7a8492;text-decoration:underline;padding:9px 4px}
.pe-tourveil{position:fixed;inset:0;z-index:880;pointer-events:none}
.pe-spot{position:fixed;border:3px solid var(--orange);border-radius:8px;box-shadow:0 0 0 9999px rgba(12,53,80,.45);z-index:881;pointer-events:none;transition:all .25s}
.pe-tip{position:fixed;z-index:882;background:#fff;border-radius:8px;padding:16px 18px 12px;max-width:330px;box-shadow:0 10px 40px rgba(0,0,0,.35);font-family:'Mulish',sans-serif}
.pe-tip h3{font-size:15px;color:var(--navy);margin:0 0 6px}
.pe-tip p{font-size:13px;line-height:1.55;color:#3d4652;margin:0 0 10px}
.pe-tip .row{display:flex;justify-content:space-between;align-items:center}
.pe-tip .step{font-size:11px;color:#8a93a1}
.pe-head-btn{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:4px;cursor:pointer;font-size:14px;padding:5px 10px}
.pe-head-btn:hover{background:rgba(255,255,255,.12)}
</style>
<script>
/* ============ PROPOSAL ENGINE DEMO LAYER (prototype only) ============
   Story intro (once per browsing session; ?story=1 forces, ?story=0 skips),
   a guided tour, and a seeded sample proposal. The engine code above is
   untouched; this layer only reads the same globals (data, render). */
(function(){
  var qs = new URLSearchParams(location.search);

  /* ---- seed a filled-in sample proposal on a fresh browser ---- */
  try {
    if (!localStorage.getItem('pe-proposals') && data && data.meta && data.meta.clientName === 'Client Name') {
      data.meta.clientName = 'Meridian Outfitters';
      data.meta.intro = 'This proposal includes our fee and schedule for Meridian Outfitters’ brand and website program. Deliverables and the project schedule are included below.';
      data.overview = ['<p>Meridian Outfitters has grown from two stores to six, but the brand and website still belong to the two-store years. Campaigns run ad hoc, the site is hard to update, and there is no reliable way to tell which marketing is working.</p><p>This program resets the foundation: a sharpened brand and message, a website the team can run themselves, the content to launch with, and measurement wired in so next year’s decisions are based on numbers.</p>'];
      if (data.contentMigration && data.contentMigration.items) {
        var counts = { 'Website pages': '38', 'Blog articles': '24', 'Email templates': '6', 'Case studies': '4' };
        data.contentMigration.items.forEach(function(it){ if (counts[it.label]) it.count = counts[it.label]; });
      }
      render();
      buildEditor();   // the sidebar was built before the seed; rebuild so fields match
    }
  } catch(e){}

  /* ---- header buttons ---- */
  var acts = document.getElementById('editor-actions');
  if (acts) {
    var b1 = document.createElement('button'); b1.className='pe-head-btn'; b1.textContent='📖'; b1.title='Replay the introduction'; b1.onclick=function(){ showStory(0); };
    var b2 = document.createElement('button'); b2.className='pe-head-btn'; b2.textContent='🎓'; b2.title='Start the guided tour'; b2.onclick=function(){ startTour(); };
    acts.insertBefore(b2, acts.firstChild); acts.insertBefore(b1, acts.firstChild);
  }

  /* ---- story ---- */
  var CARDS = [
    {k:'The idea', h:'A proposal builder, not a document', p:['Every page on the right is generated from the settings on the left. Prices total themselves, sections number themselves, and the output is a finished, client-ready PDF.','Nothing here is a Word template.']},
    {k:'Why it exists', h:'Doc templates rot', p:['In a doc, every proposal is a copy of the last one: a stale price, a client name you forgot to change, a layout that breaks when you delete a section.','Here a proposal is data. Turn a section off and the pages renumber. Change a fee and the totals follow. Your standard wording ships from saved defaults, not from whatever you sent last month.']},
    {k:'The trick', h:'Click the page itself', p:['See something to change? Click it on the proposal. The editor opens the exact field that wrote it, so you never hunt through the sidebar.','Hover any block and a pencil tip names the field.']},
    {k:'Repeatable', h:'Your brand, set once', p:['The Brand section holds your company name, address, and terms links; every proposal carries them. Save any proposal as a template to capture a whole setup for a repeat project type.','Per-proposal defaults mean you tune wording once, not per deal.']},
    {k:'The loop', h:'From draft to sent', p:['Save proposals, watch them on the Pipeline tab, and export a print-perfect PDF.','This demo runs entirely in your browser on sample data. Nothing is sent anywhere.']}
  ];
  var veil=null, idx=0;
  function showStory(i){
    idx=i||0; closeStory();
    veil=document.createElement('div'); veil.className='pe-story-veil';
    veil.innerHTML='<div class="pe-story"></div>';
    document.body.appendChild(veil);
    paint();
  }
  function paint(){
    var c=CARDS[idx], last=idx===CARDS.length-1;
    var dots=CARDS.map(function(_,i){return '<i class="'+(i===idx?'on':'')+'"></i>';}).join('');
    veil.firstChild.innerHTML='<div class="k">'+c.k+'</div><h2>'+c.h+'</h2>'+c.p.map(function(t){return '<p>'+t+'</p>';}).join('')+
      '<div class="dots">'+dots+'</div><div class="row">'+
      '<button class="pe-btn ghost" id="pe-skip">'+(last?'Explore on my own':'Skip')+'</button><span>'+
      (idx>0?'<button class="pe-btn sec" id="pe-back">Back</button> ':'')+
      (last?'<button class="pe-btn pri" id="pe-tour">Take the tour</button>':'<button class="pe-btn pri" id="pe-next">Next</button>')+'</span></div>';
    var g=function(id){return veil.querySelector('#'+id);};
    if(g('pe-skip')) g('pe-skip').onclick=closeStory;
    if(g('pe-back')) g('pe-back').onclick=function(){idx--;paint();};
    if(g('pe-next')) g('pe-next').onclick=function(){idx++;paint();};
    if(g('pe-tour')) g('pe-tour').onclick=function(){closeStory();startTour();};
  }
  function closeStory(){ if(veil){veil.remove();veil=null;} }

  /* ---- tour ---- */
  var STEPS=[
    {sel:'.topbar-tabs', h:'Editor and Pipeline', p:'Two views. Editor is where a proposal is built. Pipeline tracks every proposal you have out the door.'},
    {sel:'#editor-sections', h:'The proposal, as settings', p:'Each section here owns part of the document. Open one, change a field, and the pages update as you type.', pos:'right'},
    {sel:'#editor-sections .editor-section:nth-of-type(2)', h:'Set your identity once', p:'The Brand section carries your company name, address, and terms links onto every page that needs them.', pos:'right'},
    {sel:'#proposal-preview .page', h:'A real document, always current', p:'This is the actual output. Click any block to jump to the field that wrote it. A page that runs past US Letter gets flagged in red before a client ever sees it.', pos:'left'},
    {sel:'#editor-actions', h:'Save, export, PDF', p:'Save keeps versions in this browser. Export JSON moves a proposal between machines. Generate PDF produces the client-ready file.'}
  ];
  var spot=null, tip=null, ti=0;
  function startTour(){ ti=0; place(); }
  function endTour(){ if(spot){spot.remove();spot=null;} if(tip){tip.remove();tip=null;} }
  function place(){
    var st=STEPS[ti]; var el=document.querySelector(st.sel);
    if(!el){ ti++; if(ti<STEPS.length) return place(); return endTour(); }
    el.scrollIntoView({block:'nearest'});
    var r=el.getBoundingClientRect();
    if(!spot){ spot=document.createElement('div'); spot.className='pe-spot'; document.body.appendChild(spot); }
    var vh=Math.max(window.innerHeight,400), vw=Math.max(window.innerWidth,600);
    spot.style.left=(r.left-6)+'px'; spot.style.top=(r.top-6)+'px';
    spot.style.width=(r.width+12)+'px'; spot.style.height=(Math.max(24,Math.min(r.height,vh-r.top))+12)+'px';
    if(!tip){ tip=document.createElement('div'); tip.className='pe-tip'; document.body.appendChild(tip); }
    tip.innerHTML='<h3>'+st.h+'</h3><p>'+st.p+'</p><div class="row"><span class="step">'+(ti+1)+' of '+STEPS.length+'</span><span>'+
      (ti>0?'<button class="pe-btn sec" id="pe-tb">Back</button> ':'')+
      (ti<STEPS.length-1?'<button class="pe-btn pri" id="pe-tn">Next</button>':'<button class="pe-btn pri" id="pe-td">Done</button>')+
      ' <button class="pe-btn ghost" id="pe-tx">End</button></span></div>';
    var w=340, x, y;
    if(st.pos==='right'){ x=r.right+16; y=r.top+10; }
    else if(st.pos==='left'){ x=r.left-w-16; y=r.top+40; }
    else { x=Math.min(r.left, vw-w-20); y=r.bottom+14; }
    x=Math.max(10,Math.min(x,vw-w-10)); y=Math.max(10,Math.min(y,vh-190));
    tip.style.left=x+'px'; tip.style.top=y+'px';
    var g=function(id){return tip.querySelector('#'+id);};
    if(g('pe-tb')) g('pe-tb').onclick=function(){ti--;place();};
    if(g('pe-tn')) g('pe-tn').onclick=function(){ti++;place();};
    if(g('pe-td')) g('pe-td').onclick=endTour;
    if(g('pe-tx')) g('pe-tx').onclick=endTour;
  }

  /* ---- first-run: once per browsing session ---- */
  var want = qs.get('story');
  var seen = false;
  try { seen = sessionStorage.getItem('pe_story_seen') === '1'; } catch(e){}
  if (want !== '0' && (want === '1' || !seen)) {
    try { sessionStorage.setItem('pe_story_seen','1'); } catch(e){}
    showStory(0);
  }
})();
</script>
