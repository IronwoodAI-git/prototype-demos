<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposal Engine Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;600;700;800&family=Ovo&display=swap" rel="stylesheet">
<style>
/* ============================================================
   EDITOR UI STYLES
   ============================================================ */
:root {
  --navy: #10466A;
  --navy-dark: #0C3550;
  --orange: #F55C00;
  --orange-light: #FF6C14;
  --text: #464646;
  --text-light: #6B7280;
  --bg-light: #F7F8FA;
  --border: #E2E6EC;
  --white: #FFFFFF;
  --sidebar-w: 380px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Mulish', sans-serif;
  color: var(--text);
  background: #E8EAED;
  overflow: hidden;
  height: 100vh;
}

/* --- Top Bar --- */
.topbar {
  height: 52px;
  background: var(--navy-dark);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 24px;
}
.topbar-title {
  color: var(--white);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 10px;
}
.topbar-title img { height: 28px; }
.topbar-tabs { display: flex; gap: 4px; }
.topbar-tab {
  padding: 7px 14px;
  border: none;
  border-radius: 4px 4px 0 0;
  font-family: 'Mulish', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  background: transparent;
  color: rgba(255,255,255,0.5);
  transition: all 0.15s;
  position: relative;
  top: 1px;
}
.topbar-tab:hover { color: rgba(255,255,255,0.8); }
.topbar-tab.active {
  background: #E8EAED;
  color: var(--navy);
}
.topbar-actions { display: flex; gap: 8px; }
.topbar-btn {
  padding: 7px 16px;
  border: none;
  border-radius: 4px;
  font-family: 'Mulish', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.15s;
}
.topbar-btn:hover { opacity: 0.85; }
.btn-save { background: var(--navy); color: var(--white); border: 1px solid rgba(255,255,255,0.2); }
.btn-load { background: transparent; color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.2); }
.btn-pdf { background: var(--orange); color: var(--white); }

/* --- Pipeline View --- */
.pipeline-view {
  display: none;
  width: 100%;
  height: calc(100vh - 52px);
  margin-top: 52px;
  overflow-y: auto;
  background: var(--bg-light);
  padding: 30px 40px;
}
.pipeline-view.active { display: block; }
.pipeline-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.pipeline-header h2 {
  font-family: 'Ovo', serif;
  font-size: 24px;
  color: var(--navy);
}
.pipeline-stats {
  display: flex;
  gap: 24px;
}
.pipeline-stat {
  text-align: center;
  padding: 16px 24px;
  background: var(--white);
  border-radius: 8px;
  border: 1px solid var(--border);
  min-width: 140px;
}
.pipeline-stat .stat-value {
  font-size: 24px;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: 2px;
}
.pipeline-stat .stat-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.pipeline-stat.won .stat-value { color: #2a7d3f; }
.pipeline-stat.lost .stat-value { color: #c0392b; }
.pipeline-stat.pending .stat-value { color: var(--orange); }
.pipeline-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--white);
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.pipeline-table th {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 1px;
  text-align: left;
  padding: 12px 16px;
  background: var(--bg-light);
  border-bottom: 2px solid var(--border);
}
.pipeline-table td {
  padding: 12px 16px;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.pipeline-table tr:last-child td { border-bottom: none; }
.pipeline-table tr:hover td { background: #f0f4f8; }
.pipeline-table td input,
.pipeline-table td select {
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 3px;
  font-family: 'Mulish', sans-serif;
  font-size: 12px;
  width: 100%;
}
.pipeline-table td select { width: auto; min-width: 90px; }
.pipeline-table td input[type="date"] { width: auto; min-width: 130px; }
.status-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.status-draft { background: #E2E6EC; color: #555; }
.status-sent { background: #FFF3E0; color: #E65100; }
.status-won { background: #E8F5E9; color: #2E7D32; }
.status-lost { background: #FFEBEE; color: #C62828; }
.pipeline-actions-cell { white-space: nowrap; }
.pipeline-actions-cell button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 3px;
  font-family: 'Mulish', sans-serif;
  color: var(--text-light);
}
.pipeline-actions-cell button:hover { background: var(--bg-light); color: var(--navy); }
.pipeline-empty {
  text-align: center;
  padding: 60px 40px;
  color: var(--text-light);
  background: var(--white);
  border-radius: 8px;
  border: 1px solid var(--border);
}
.pipeline-empty p { font-size: 14px; margin-bottom: 8px; }
.pipeline-empty small { font-size: 12px; }

/* --- Layout --- */
.app-layout {
  display: flex;
  height: calc(100vh - 52px);
  margin-top: 52px;
}

/* --- Sidebar --- */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--white);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 0;
}
.sidebar::-webkit-scrollbar { width: 5px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.editor-section {
  border-bottom: 1px solid var(--border);
}
.editor-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--navy);
  background: var(--bg-light);
  transition: background 0.15s;
}
.editor-section-header:hover { background: #EDF0F4; }
.editor-section-header .arrow {
  font-size: 10px;
  color: var(--text-light);
  transition: transform 0.2s;
}
.editor-section.open .arrow { transform: rotate(90deg); }
.editor-section-body {
  display: none;
  padding: 14px 18px 18px;
}
.editor-section.open .editor-section-body { display: block; }

/* --- Form controls --- */
.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-light);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 5px;
}
.field-input, .field-textarea, .field-select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: 'Mulish', sans-serif;
  font-size: 13px;
  color: var(--text);
  background: var(--white);
  transition: border-color 0.15s;
}
.field-input:focus, .field-textarea:focus { border-color: var(--navy); outline: none; }
.field-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

.toggle-row {
  display: flex;
  flex-wrap: wrap;   /* lets .inline-edit drop to its own full-width line below the row */
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  font-size: 13px;
}
.toggle-row input[type="checkbox"] {
  accent-color: var(--orange);
  width: 16px;
  height: 16px;
  cursor: pointer;
}
.toggle-row label { cursor: pointer; flex: 1; }
.toggle-row .toggle-edit-btn {
  font-size: 11px;
  color: var(--orange);
  cursor: pointer;
  background: none;
  border: none;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.inline-edit {
  display: none;
  margin-top: 6px;
  padding: 8px;
  background: var(--bg-light);
  border-radius: 4px;
  border: 1px solid var(--border);
}
/* Open panels sit BELOW the row at full sidebar width, so the row label
   keeps its space instead of being squashed into a narrow column. */
.inline-edit.open {
  display: block;
  flex: 0 0 100%;
  width: 100%;
  min-width: 0;
}
.inline-edit .field { margin-bottom: 8px; }

/* --- Drag handle --- */
.drag-handle {
  cursor: grab;
  padding: 0 4px;
  color: #aab2bd;
  font-size: 16px;
  line-height: 1;
  user-select: none;
  flex-shrink: 0;
  font-weight: 700;
  letter-spacing: -2px;
}
.drag-handle:hover { color: var(--navy); }
.drag-handle:active { cursor: grabbing; }
.draggable-row { transition: background 0.12s, border-color 0.12s; }
.draggable-row.dragging { opacity: 0.4; }
.draggable-row.drag-over-top { border-top: 2px solid var(--orange); margin-top: -2px; }
.draggable-row.drag-over-bottom { border-bottom: 2px solid var(--orange); margin-bottom: -2px; }

/* --- Rich text editor --- */
.richtext-toolbar {
  display: flex;
  gap: 2px;
  margin-bottom: -1px;
  position: relative;
  z-index: 1;
}
.richtext-toolbar button {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-bottom: none;
  border-radius: 4px 4px 0 0;
  background: var(--bg-light);
  cursor: pointer;
  font-size: 12px;
  color: var(--text);
  font-family: 'Mulish', sans-serif;
}
.richtext-toolbar button:hover { background: var(--border); }
.richtext-editor {
  width: 100%;
  min-height: 120px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 0 4px 4px 4px;
  font-family: 'Mulish', sans-serif;
  font-size: 13px;
  color: var(--text);
  line-height: 1.6;
  outline: none;
  background: var(--white);
}
.richtext-editor:focus { border-color: var(--navy); }
.richtext-editor p { margin-bottom: 8px; }
.richtext-editor p:last-child { margin-bottom: 0; }

.add-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  border: 1px dashed var(--border);
  border-radius: 4px;
  background: none;
  color: var(--orange);
  font-family: 'Mulish', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
}
.add-btn:hover { background: var(--bg-light); }

.remove-btn {
  font-size: 14px;
  color: #ccc;
  cursor: pointer;
  background: none;
  border: none;
  line-height: 1;
}
.remove-btn:hover { color: #e74c3c; }

.ref-image-field { flex-direction: column; align-items: stretch !important; gap: 6px; }
.ref-image-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ref-image-controls .field-input { flex: 1; min-width: 160px; }
.ref-image-thumb {
  width: 64px; height: 48px; object-fit: cover;
  border: 1px solid var(--border); border-radius: 4px;
  background: var(--bg-light); flex-shrink: 0;
}
.ref-image-thumb-empty {
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--text-light); text-align: center;
}
.upload-btn {
  font-family: 'Mulish', sans-serif;
  font-size: 11px; font-weight: 700;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
  white-space: nowrap;
}
.upload-btn:hover { background: var(--bg-light); }
.remove-btn-sm {
  font-size: 11px; font-weight: 600;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: #fff;
  color: var(--text-light);
  cursor: pointer;
}
.remove-btn-sm:hover { color: #e74c3c; border-color: #e74c3c; }

.template-edit-banner {
  margin: 0 18px 12px;
  padding: 10px 12px;
  background: #fff6d6;
  border: 1px solid #e0c766;
  border-left: 4px solid #c9a227;
  border-radius: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-family: 'Mulish', sans-serif;
  font-size: 12px;
  color: #5a4200;
}
.tmpl-banner-label { font-weight: 600; }
.tmpl-banner-actions { margin-left: auto; display: flex; gap: 6px; }
.tmpl-banner-actions button {
  font-family: 'Mulish', sans-serif;
  font-size: 11px; font-weight: 700;
  padding: 5px 10px;
  border: 1px solid #c9a227;
  border-radius: 3px;
  background: #fff;
  color: #5a4200;
  cursor: pointer;
}
.tmpl-banner-actions button:hover { background: #fff0b3; }
.tmpl-banner-actions button:first-child {
  background: #c9a227; color: #fff; border-color: #c9a227;
}
.tmpl-banner-actions button:first-child:hover { background: #b88d1e; }

.defaults-link {
  font-size: 10px;
  color: var(--text-light);
  text-decoration: none;
  font-weight: 600;
  letter-spacing: 0.3px;
}
.defaults-link:hover { color: var(--navy); }

/* --- Proposal select dropdown --- */
.proposal-select-bar {
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--white);
}
.proposal-select-bar select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: 'Mulish', sans-serif;
  font-size: 13px;
}
.proposal-select-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.proposal-select-actions button {
  flex: 1;
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--white);
  font-family: 'Mulish', sans-serif;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  color: var(--text);
}
.proposal-select-actions button:hover { background: var(--bg-light); }
#btn-mark-complete {
  background: var(--white) !important;
  color: var(--orange) !important;
  border-color: var(--orange) !important;
  opacity: 0.7;
  transition: all 0.15s;
}
#btn-mark-complete:hover {
  background: var(--orange) !important;
  color: var(--white) !important;
  opacity: 1;
}
#btn-mark-complete.completed {
  background: var(--orange) !important;
  color: var(--white) !important;
  opacity: 1;
}

/* --- Preview area --- */
.preview-area {
  flex: 1;
  overflow-y: auto;
  padding: 30px;
  background: #E8EAED;
}
.preview-area::-webkit-scrollbar { width: 8px; }
.preview-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

/* ============================================================
   PROPOSAL STYLES
   ============================================================ */
#proposal-preview .page {
  max-width: 850px;
  margin: 0 auto 30px;
  background: var(--white);
  box-shadow: 0 2px 20px rgba(0,0,0,0.08);
  border-radius: 2px;
  display: flex;
  flex-direction: column;
  height: 1100px;
  page-break-after: always;
  overflow: visible;
  position: relative;
}
/* Overflow warning: red bottom border when content exceeds page */
#proposal-preview .page.overflow {
  box-shadow: 0 2px 20px rgba(0,0,0,0.08), 0 3px 0 0 #e74c3c;
}
#proposal-preview .page.overflow::after {
  content: '⚠ Content exceeds page — split into additional page';
  position: absolute;
  bottom: -28px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: #e74c3c;
  letter-spacing: 0.3px;
}
#proposal-preview .page.overflow { margin-bottom: 50px; }
#proposal-preview .page:last-child { page-break-after: avoid; }

#proposal-preview .header-bar {
  background: var(--navy);
  background-image: linear-gradient(120deg, var(--navy-dark), var(--navy) 60%, #1B5B85);
  background-size: cover;
  background-position: center;
  padding: 30px 50px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}
#proposal-preview .header-bar.flat-blue {
  background-image: none;
}
#proposal-preview .header-bar::before {
  display: none;
}
#proposal-preview .header-bar .logo-area {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 10px;
}
#proposal-preview .header-bar .logo-icon { height: 44px; width: auto; }
#proposal-preview .header-bar .logo-text { font-family: 'Ovo', serif; font-size: 22px; color: #fff; letter-spacing: 1px; }
#proposal-preview .header-bar .header-date {
  font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.9);
  position: relative; z-index: 1; letter-spacing: 0.5px;
}

#proposal-preview .page-body { flex: 1; padding: 60px 50px 30px; }

/* Cover */
#proposal-preview .cover-hero {
  flex: 1; display: flex; flex-direction: column;
  justify-content: center; padding: 60px 50px;
}
#proposal-preview .cover-label {
  font-size: 11px; font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase; color: var(--orange); margin-bottom: 16px;
}
#proposal-preview .cover-title {
  font-family: 'Ovo', serif; font-size: 46px; font-weight: 400;
  color: var(--navy); line-height: 1.15; margin-bottom: 10px;
}
#proposal-preview .cover-subtitle {
  font-family: 'Ovo', serif; font-size: 22px; font-weight: 400;
  color: var(--text-light); margin-bottom: 30px;
}
#proposal-preview .cover-intro { font-size: 15px; color: var(--text); max-width: 560px; line-height: 1.7; }
#proposal-preview .cover-meta {
  margin-top: 50px; display: flex; gap: 40px;
}
#proposal-preview .cover-meta-item {
  border-left: 3px solid var(--orange); padding-left: 14px;
}
#proposal-preview .cover-meta-label {
  font-size: 10px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text-light); margin-bottom: 3px;
}
#proposal-preview .cover-meta-value {
  font-family: 'Ovo', serif; font-size: 20px; color: var(--navy);
}
#proposal-preview .cover-footer {
  padding: 24px 50px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--text-light);
  display: flex; justify-content: space-between;
}

/* Section headings */
#proposal-preview .section-number {
  font-size: 10px; font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase; color: var(--orange); margin-bottom: 6px; display: block;
}
#proposal-preview h2 {
  font-family: 'Ovo', serif; font-size: 32px; font-weight: 400;
  color: var(--navy); margin-bottom: 6px; line-height: 1.2;
}
#proposal-preview .section-divider {
  width: 45px; height: 3px; background: var(--orange);
  margin: 12px 0 24px; border: none;
}
#proposal-preview .section-number { margin-top: 60px; }
#proposal-preview .page-body > .section-number:first-child { margin-top: 0; }
#proposal-preview h3 {
  font-family: 'Ovo', serif; font-size: 20px; font-weight: 400;
  color: var(--navy); margin: 28px 0 10px;
}
#proposal-preview h4 {
  font-size: 14px; font-weight: 700; color: var(--navy);
  margin: 20px 0 6px; letter-spacing: 0.3px;
}
#proposal-preview p { margin-bottom: 12px; font-size: 14px; line-height: 1.65; }
#proposal-preview .overview-content { font-size: 14px; line-height: 1.65; margin-bottom: 12px; }
#proposal-preview .compact-top .overview-content > *:first-child { margin-top: 0 !important; }
#proposal-preview .overview-content p { margin-bottom: 12px; }
#proposal-preview .overview-content div { margin-bottom: 12px; }
#proposal-preview p:last-child { margin-bottom: 0; }
#proposal-preview a { color: var(--orange); text-decoration: none; }

/* Pricing */
#proposal-preview .pricing-hero {
  background: var(--navy); border-radius: 8px; padding: 28px 32px;
  margin: 24px 0; display: flex; align-items: center;
  justify-content: space-between; gap: 24px;
}
#proposal-preview .pricing-hero-label {
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 4px;
}
#proposal-preview .pricing-hero-amount {
  font-family: 'Ovo', serif; font-size: 38px; color: var(--white);
}
#proposal-preview .pricing-hero-alt {
  font-size: 13px; color: rgba(255,255,255,0.65); text-align: right;
}
#proposal-preview .pricing-hero-alt strong {
  display: block; font-family: 'Ovo', serif; font-size: 24px;
  color: var(--orange-light); font-weight: 400;
}

#proposal-preview .fee-table { width: 100%; border-collapse: collapse; margin: 16px 0; }
#proposal-preview .fee-table tr { border-bottom: 1px solid var(--border); }
#proposal-preview .fee-table tr:last-child { border-bottom: none; }
#proposal-preview .fee-table td { padding: 10px 0; font-size: 14px; }
#proposal-preview .fee-table td:first-child { font-weight: 600; }
#proposal-preview .fee-table td:last-child {
  text-align: right; font-weight: 700; color: var(--navy); font-size: 14px;
}
#proposal-preview .fee-table .fee-note td { font-style: italic; font-weight: 400; color: var(--text-light); font-size: 13px; }
#proposal-preview .footnote {
  font-size: 12px; color: var(--text-light); margin-top: 12px;
  padding-top: 12px; border-top: none; line-height: 1.6;
}

/* Phases */
#proposal-preview .phase-item {
  display: grid; grid-template-columns: 170px 1fr; gap: 0 20px;
  border-bottom: 1px solid var(--border); padding: 16px 0;
}
#proposal-preview .phase-item:first-child { padding-top: 0; }
#proposal-preview .phase-item:last-child { border-bottom: none; }
#proposal-preview .phase-label {
  font-size: 11px; font-weight: 800; color: var(--orange);
  text-transform: uppercase; letter-spacing: 1px; padding-top: 2px;
}
#proposal-preview .phase-desc { font-size: 14px; line-height: 1.6; }
#proposal-preview .phase-na { color: var(--text-light); font-style: italic; }

/* Process cards */
#proposal-preview .process-card {
  background: var(--bg-light); border-radius: 6px; padding: 26px 28px;
  margin: 24px 0; border-left: 4px solid var(--orange);
}
#proposal-preview .process-card:first-child { margin-top: 16px; }
#proposal-preview .process-card h3 { margin-top: 0; margin-bottom: 10px; font-size: 18px; }
#proposal-preview .process-card p { font-size: 14px; margin-bottom: 10px; line-height: 1.65; }
#proposal-preview .process-card .card-link {
  display: inline-block; font-size: 11px; font-weight: 700;
  color: var(--orange); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;
}

/* Schedule table */
#proposal-preview .schedule-table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  margin: 20px 0; border-radius: 6px; overflow: hidden;
  border: 1px solid var(--border);
}
#proposal-preview .schedule-table thead th {
  background: var(--navy); color: var(--white);
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; padding: 10px 16px; text-align: left;
}
#proposal-preview .schedule-table tbody tr:nth-child(even) { background: var(--bg-light); }
#proposal-preview .schedule-table td {
  padding: 12px 16px; font-size: 14px; vertical-align: top;
}
#proposal-preview .schedule-table td:first-child { font-weight: 700; color: var(--navy); white-space: nowrap; }
#proposal-preview .schedule-table td:nth-child(2) { color: var(--text-light); }
#proposal-preview .schedule-table ul { margin: 0; padding-left: 0; list-style: none; }
#proposal-preview .schedule-table ul li { margin-bottom: 3px; }

/* Content migration inventory */
/* Fixed layout so the column widths are set by these rules, not by whatever
   happens to be typed in a note. A one-word note and a full paragraph produce
   the same table, and editing a note in place never shifts the columns. */
#proposal-preview .inventory-table { table-layout: fixed; }
#proposal-preview .inventory-table td:first-child { font-weight: 600; white-space: normal; }
#proposal-preview .inventory-table th:nth-child(2) { width: 200px; text-align: center; }
#proposal-preview .inventory-table td:nth-child(2) {
  width: 200px; color: var(--navy); font-weight: 700; text-align: center;
}
#proposal-preview .inventory-table .inventory-total td {
  border-top: 2px solid var(--navy); font-weight: 800; background: var(--white);
}
/* With the optional notes column on, the count column gives up its width so a
   note reads as a sentence instead of a stack of single words. */
#proposal-preview .inventory-table.has-notes th:first-child,
#proposal-preview .inventory-table.has-notes td:first-child { width: 32%; }
/* Fixed layout means the header can no longer push this column wider, so let
   "Approximate Count" wrap onto two lines and keep nowrap for the numbers. */
#proposal-preview .inventory-table.has-notes th:nth-child(2) { width: 130px; white-space: normal; }
#proposal-preview .inventory-table.has-notes td:nth-child(2) { width: 130px; white-space: nowrap; }
#proposal-preview .inventory-table .inventory-note {
  font-size: 13px; font-weight: 400; color: var(--text-light); line-height: 1.5;
  white-space: normal; overflow-wrap: break-word; word-break: normal; hyphens: auto;
}
#proposal-preview .migration-note { font-size: 13px; }

/* Billing */
#proposal-preview .billing-grid { display: flex; gap: 0; margin: 20px 0; }
#proposal-preview .billing-step {
  flex: 1; text-align: center; padding: 16px 10px; position: relative;
}
#proposal-preview .billing-step::after {
  content: ''; position: absolute; top: 24px; right: 0;
  width: 1px; height: 36px; background: var(--border);
}
#proposal-preview .billing-step:last-child::after { display: none; }
#proposal-preview .billing-pct {
  font-family: 'Ovo', serif; font-size: 28px; color: var(--navy); margin-bottom: 4px;
}
#proposal-preview .billing-label { font-size: 11px; font-weight: 600; color: var(--text-light); line-height: 1.4; }

/* Deliverables */
#proposal-preview .deliverables-list {
  list-style: none; padding: 0; margin: 16px 0; counter-reset: deliverable;
}
#proposal-preview .deliverables-list li {
  counter-increment: deliverable; padding: 14px 0 14px 36px;
  border-bottom: 1px solid var(--border); font-size: 14px;
  position: relative; line-height: 1.65;
}
#proposal-preview .deliverables-list li:last-child { border-bottom: none; }
#proposal-preview .deliverables-list li::before {
  content: counter(deliverable); position: absolute; left: 0; top: 14px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--navy); color: var(--white);
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

/* Scope bullets */
#proposal-preview .scope-list { list-style: none; padding: 0; margin: 12px 0; }
#proposal-preview .scope-list li {
  padding: 6px 0 6px 22px; position: relative; font-size: 14px; line-height: 1.6;
}
#proposal-preview .scope-list li::before {
  content: ''; position: absolute; left: 4px; top: 13px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--orange);
}

/* Callout */
#proposal-preview .callout {
  background: var(--bg-light); border-radius: 6px; padding: 18px 22px;
  margin: 18px 0; border: 1px solid var(--border);
}
#proposal-preview .callout h4 { margin-top: 0; }
#proposal-preview .callout p { font-size: 13px; }

/* Team */
#proposal-preview .team-member {
  margin: 28px 0; padding-bottom: 28px;
  border-bottom: 1px solid var(--border);
  display: grid; grid-template-columns: 90px 1fr; gap: 28px;
}
#proposal-preview .team-member:first-of-type { margin-top: 16px; }
#proposal-preview .team-member:last-of-type { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
#proposal-preview .team-photo-img {
  width: 90px; height: 90px; border-radius: 50%;
  object-fit: cover; border: 3px solid var(--border);
}
#proposal-preview .team-name {
  font-family: 'Ovo', serif; font-size: 18px; color: var(--navy); margin-bottom: 2px;
}
#proposal-preview .team-role {
  font-size: 11px; font-weight: 700; color: var(--orange);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
}
#proposal-preview .team-bio { font-size: 14px; line-height: 1.65; }

/* References */
#proposal-preview .ref-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin: 18px 0; }
#proposal-preview .ref-card {
  border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
}
#proposal-preview .ref-screenshot {
  width: 100%; height: 235px; object-fit: cover; object-position: top center;
  display: block; border-bottom: 3px solid var(--orange);
}
#proposal-preview .ref-screenshot-placeholder {
  width: 100%; aspect-ratio: 16 / 10;
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
  background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 100%);
  border-bottom: 3px solid var(--orange);
  color: rgba(255,255,255,0.5); font-size: 10px; font-weight: 600;
  letter-spacing: 1.5px; text-transform: uppercase;
}
#proposal-preview .ref-screenshot-placeholder .placeholder-url {
  color: rgba(255,255,255,0.85); font-family: 'Ovo', serif;
  font-size: 16px; letter-spacing: 0; text-transform: none;
}
#proposal-preview .ref-card-body {
  padding: 16px 18px;
  background: var(--navy);
}
#proposal-preview .ref-org { font-family: 'Ovo', serif; font-size: 15px; color: var(--white); margin-bottom: 3px; }
#proposal-preview .ref-url { font-size: 11px; color: var(--orange-light); margin-bottom: 2px; display: block; }
#proposal-preview .ref-phone { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 8px; }
#proposal-preview .ref-contact-name { font-size: 12px; font-weight: 700; color: var(--white); }
#proposal-preview .ref-contact-title { font-size: 11px; color: rgba(255,255,255,0.6); }
#proposal-preview .ref-contact-email { font-size: 11px; color: var(--orange-light); }

/* Signature */
#proposal-preview .sig-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin: 24px 0; }
#proposal-preview .sig-block-header { font-family: 'Ovo', serif; font-size: 18px; color: var(--navy); margin-bottom: 4px; }
#proposal-preview .sig-block-info { font-size: 13px; color: var(--text-light); line-height: 1.6; margin-bottom: 24px; }
#proposal-preview .sig-line { border-bottom: 0.5px solid var(--text); margin-bottom: 4px; height: 30px; }
#proposal-preview .sig-label {
  font-size: 10px; font-weight: 600; color: var(--text-light);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 18px;
}

/* Page footer */
#proposal-preview .page-footer {
  padding: 12px 50px; border-top: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  font-size: 10px; color: var(--text-light); letter-spacing: 0.5px;
}
#proposal-preview .page-footer .footer-line { width: 24px; height: 2px; background: var(--orange); }

/* ============================================================
   PRINT STYLES

  /* Keep blocks together */
  #proposal-preview .process-card, #proposal-preview .pricing-hero,

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-title">
      Proposal Engine
    </div>
    <div class="topbar-tabs">
      <button class="topbar-tab active" onclick="switchTab('editor')" id="tab-editor">Editor</button>
      <button class="topbar-tab" onclick="switchTab('pipeline')" id="tab-pipeline">Pipeline</button>
    </div>
  </div>
  <div class="topbar-actions" id="editor-actions">
    <button class="topbar-btn btn-load" onclick="exportJSON()">Export JSON</button>
    <button class="topbar-btn btn-load" onclick="emergencyExport()" title="Download current in-memory data as JSON without touching localStorage">Backup Now</button>
    <button class="topbar-btn btn-load" onclick="document.getElementById('import-file').click()">Import JSON</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importJSON(event)">
    <button class="topbar-btn btn-save" onclick="saveProposal()">Save</button>
    <button class="topbar-btn btn-pdf" onclick="generatePDF()" title="Opens a clean print window. For best results, use: node generate-pdf.js output.pdf">Generate PDF</button>
  </div>
  <div class="topbar-actions" id="pipeline-actions" style="display:none">
    <button class="topbar-btn btn-load" onclick="exportPipelineCSV()">Export CSV</button>
  </div>
</div>

<!-- PIPELINE VIEW -->
<div class="pipeline-view" id="pipeline-view"></div>

<!-- MAIN LAYOUT -->
<div class="app-layout" id="editor-view">
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <!-- Proposal selector -->
    <div class="proposal-select-bar">
      <select id="proposal-selector" onchange="loadProposal(this.value)">
        <option value="__new__">+ New Proposal</option>
      </select>
      <div class="proposal-select-actions">
        <button onclick="renameProposal()">Rename</button>
        <button onclick="duplicateProposal()">Duplicate</button>
        <button onclick="deleteProposal()">Delete</button>
        <button onclick="markComplete()" id="btn-mark-complete">&#x2714; Complete</button>
      </div>
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
        <span class="field-label">Start from template</span>
        <div style="display:flex;gap:6px;margin-top:4px">
          <select id="template-selector" style="flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:3px;font-family:'Mulish',sans-serif;font-size:12px">
            <option value="">Default</option>
          </select>
          <button onclick="newFromTemplate()" style="padding:5px 10px;border:1px solid var(--border);border-radius:3px;background:var(--white);font-family:'Mulish',sans-serif;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap">New</button>
        </div>
        <div class="proposal-select-actions" style="margin-top:4px">
          <button onclick="saveAsTemplate()">Save as Template</button>
          <button onclick="editTemplate()">Edit</button>
          <button onclick="renameTemplate()">Rename</button>
          <button onclick="deleteTemplate()">Delete</button>

      <strong id="template-edit-name"></strong>

        <button onclick="saveTemplateEdits()">Save Template</button>
        <button onclick="exitTemplateEdit()">Done</button>
      </div>
    </div>

    <!-- Editor sections built by JS -->
    <div id="editor-sections"></div>
  </div>

  <!-- PREVIEW -->
  <div class="preview-area">
    <div id="proposal-preview"></div>
  </div>
</div>

<script>
// ============================================================
// DEFAULT DATA
// ============================================================
const DEFAULTS_KEY = 'pe-defaults';

function getCustomDefaults() {
  try { return JSON.parse(localStorage.getItem(DEFAULTS_KEY)); } catch { return null; }
}

function getDefaultData() {
  const hardcoded = getHardcodedDefaults();
  const custom = getCustomDefaults();
  if (custom) {
    // Merge custom overrides into hardcoded defaults
    Object.keys(custom).forEach(key => {
      if (key === 'meta') {
        // Merge meta fields individually (preserve clientName, date, version)
        Object.keys(custom.meta).forEach(mk => {
          hardcoded.meta[mk] = JSON.parse(JSON.stringify(custom.meta[mk]));
        });
      } else {
        hardcoded[key] = JSON.parse(JSON.stringify(custom[key]));
      }
    });
  }
  return hardcoded;
}

function getHardcodedDefaults() {
  return {
    meta: {
      clientName: "Client Name",
      date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }),
      preparedBy: "Alex Rivera",
      subtitle: "Pricing and Schedule",
      docLabel: "Marketing Services Proposal",
      intro: "This proposal includes our fee and schedule for [Client]\u2019s upcoming program. Deliverables and the project schedule are included below.",
      headerStyle: "classic"
    },
    brand: {
      company: "Acme Studio",
      logo: "",
      address1: "123 Example Street",
      address2: "Anytown, ST 00000",
      email: "hello@acmestudio.com",

let data = getDefaultData();
let currentProposalId = null;

// ============================================================
// RENDER PROPOSAL
// ============================================================
function render() {
  const d = data;
  if (!d.brand) d.brand = getHardcodedDefaults().brand;   // proposals saved before the brand block
  const fmtNum = (n) => `$${Number(n).toLocaleString('en-US')}`;
  const enabledLI = d.pricing.lineItems.filter(li => li.enabled);
  const baseFeeTotal = enabledLI.reduce((sum, li) => sum + Number(li.amount || 0), 0);
  const altFeeTotal = enabledLI.reduce((sum, li) => sum + Number(li.altAmount || li.amount || 0), 0);
  let pageNum = 1;

  // Helpers
  const headerStyleClass = d.meta.headerStyle === 'flat-blue' ? ' flat-blue' : '';
  const headerBar = (showDate) => `
    <div class="header-bar${headerStyleClass}">
      <div class="logo-area">
        ${d.brand.logo ? `<img class="logo-icon" src="${d.brand.logo}" alt="${d.brand.company}">` : `<span class="logo-text">${d.brand.company}</span>`}
      </div>
      ${showDate ? `<span class="header-date">${d.meta.date}</span>` : ''}
    </div>`;

  const pageFooter = (num) => `
    <div class="page-footer">
      <span>${d.meta.clientName} ${d.meta.docLabel || "Proposal"}</span>
      <div class="footer-line"></div>
      <span>Page ${num}</span>
    </div>`;

  const sectionHead = (num, label, title) => `
    <span class="section-number">${num} &mdash; ${label}</span>
    <h2>${title}</h2>
    <hr class="section-divider">`;

  let html = '';

  // PAGE 1: COVER
  html += `<div class="page">
    ${headerBar(true)}
    <div class="cover-hero">
      <span class="cover-label">${d.meta.docLabel || "Proposal"}</span>
      <h1 class="cover-title">${d.meta.clientName}</h1>
      <p class="cover-subtitle">${d.meta.subtitle}</p>
      <div class="cover-intro">${d.meta.intro}</div>
      <div class="cover-meta">
        <div class="cover-meta-item">
          <div class="cover-meta-label">Project Fee</div>
          <div class="cover-meta-value">${fmtNum(baseFeeTotal)}</div>
        </div>
        <div class="cover-meta-item">
          <div class="cover-meta-label">Timeline</div>
          <div class="cover-meta-value">${d.schedule.title}</div>
        </div>
        <div class="cover-meta-item">
          <div class="cover-meta-label">Prepared By</div>
          <div class="cover-meta-value">${d.meta.preparedBy}</div>
        </div>
      </div>
    </div>
    <div class="cover-footer">
      <span>${d.brand.company} &middot; ${d.brand.address1}, ${d.brand.address2}</span>
      <span>${d.brand.email} &middot; ${d.brand.website}</span>
    </div>
  </div>`;

  // Ensure sections object exists (backward compat with old saved proposals)
  const sec = d.sections || {};
  const s = (key) => sec[key] !== false; // default true if missing
  let sn = 0; // auto section number
  const enabledProcess = d.process.filter(p => p.enabled);
  const enabledPlugins = d.plugins.filter(p => p.enabled);
  const enabledDeliverables = d.deliverables.filter(dl => dl.enabled);
  const enabledTeam = d.team.filter(t => t.enabled);
  const enabledRefs = d.references.filter(r => r.enabled);

  // PRICING + PHASES
  if (s('pricing')) {
    sn++; const pn = String(sn).padStart(2,'0');
    pageNum++;
    html += `<div class="page">${headerBar(false)}<div class="page-body">
      ${sectionHead(pn, 'Pricing', 'Project Fee')}
      <div class="pricing-hero">
        <div>
          <div class="pricing-hero-label">Base Project Fee</div>
          <div class="pricing-hero-amount">${fmtNum(baseFeeTotal)}</div>
        </div>
        ${d.pricing.altFee.enabled ? `<div class="pricing-hero-alt">
          ${d.pricing.altFee.label}
          <strong>${fmtNum(altFeeTotal)}</strong>
        </div>` : ''}
      </div>
      <table class="fee-table">
        ${enabledLI.map(li => {
          const showAlt = d.pricing.altFee.enabled && Number(li.altAmount) !== Number(li.amount);
          const amtDisplay = showAlt ? `${fmtNum(li.amount)} / ${fmtNum(li.altAmount)}` : fmtNum(li.amount);
          return `<tr><td>${li.label}${li.desc ? ` <span style="font-weight:400;color:var(--text-light)">${li.desc}</span>` : ''}</td><td>${amtDisplay}</td></tr>`;
        }).join('')}
        <tr class="fee-note"><td>Out of scope project changes, alterations, additions*</td><td style="font-style:italic">${d.pricing.hourlyRate}</td></tr>
      </table>
      <p class="footnote">* We recommend setting aside 10&ndash;15% of a project&rsquo;s initial budget for unforeseen changes and out-of-scope additions.${s('extraScope') ? ' See the &ldquo;Extra Scope&rdquo; section for details.' : ''}</p>
      ${d.pricing.note ? `<div class="callout">${d.pricing.note}</div>` : ''}
    </div>${pageFooter(pageNum)}</div>`;

    // PHASES — separate page
    if (s('phases')) {
      sn++; const pn2 = String(sn).padStart(2,'0');
      pageNum++;
      html += `<div class="page">${headerBar(false)}<div class="page-body">
        ${sectionHead(pn2, 'Phases', 'Project Phases')}
        <div class="phases-grid">
          ${d.phases.filter(p => p.enabled).map(p => `<div class="phase-item"><div class="phase-label">${p.label}</div><div class="phase-desc">${p.na ? `<span class="phase-na">${p.desc}</span>` : p.desc}</div></div>`).join('')}
        </div>
      </div>${pageFooter(pageNum)}</div>`;
    }
  }

  // OVERVIEW (supports multiple pages)
  if (s('overview')) {
    // Backward compat: convert string to array
    const overviewPages = Array.isArray(d.overview) ? d.overview : [d.overview];
    sn++; const pn = String(sn).padStart(2,'0');
    overviewPages.forEach((text, oi) => {
      pageNum++;
      const compactTop = oi > 0 && data.overviewCompactTop && data.overviewCompactTop[oi];
      html += `<div class="page">${headerBar(false)}<div class="page-body${compactTop ? ' compact-top' : ''}">
        ${oi === 0 ? sectionHead(pn, 'Overview', 'Project Overview') : ''}
        <div class="overview-content">${text}</div>
      </div>${pageFooter(pageNum)}</div>`;
    });
  }

  // CONTENT MIGRATION
  if (s('contentMigration')) {
    ensureContentMigration();
    const cm = data.contentMigration;
    const cmItems = (cm.items || []).filter(it => it.enabled);
    const cmTotal = cmItems.reduce((sum, it) => {
      const n = parseInt(String(it.count).replace(/[^0-9]/g, ''), 10);
      return sum + (isNaN(n) ? 0 : n);
    }, 0);
    sn++; const pn = String(sn).padStart(2,'0');
    pageNum++;
    html += `<div class="page">${headerBar(false)}<div class="page-body">
      ${sectionHead(pn, 'Content', 'Content Plan')}
      <div class="overview-content">${cm.intro || ''}</div>
      ${cmItems.length ? `
      <h3>${cm.inventoryTitle || ''}</h3>
      ${cm.inventoryIntro ? `<p>${cm.inventoryIntro}</p>` : ''}
      <table class="schedule-table inventory-table${cm.showNotes ? ' has-notes' : ''}">
        <thead><tr><th>Content Type</th><th>Approximate Count</th>${cm.showNotes ? `<th>Notes</th>` : ''}</tr></thead>
        <tbody>
          ${cmItems.map(it => `<tr><td>${it.label}</td><td>${it.count}</td>${cm.showNotes ? `<td class="inventory-note">${it.note || ''}</td>` : ''}</tr>`).join('')}
          ${cm.showTotal !== false && cmTotal > 0 ? `<tr class="inventory-total"><td>Total items (approximate)</td><td>${cmTotal.toLocaleString('en-US')}</td>${cm.showNotes ? `<td></td>` : ''}</tr>` : ''}
        </tbody>
      </table>` : ''}
      ${cm.note ? `<div class="callout migration-note">${cm.note}</div>` : ''}
    </div>${pageFooter(pageNum)}</div>`;
  }

  // PROCESS
  if (s('process') && enabledProcess.length) {
    sn++; const pn = String(sn).padStart(2,'0');
    pageNum++;
    html += `<div class="page">${headerBar(false)}<div class="page-body">
      ${sectionHead(pn, 'Process', 'Process Overview')}
      ${enabledProcess.map(p => `<div class="process-card"><h3>${p.title}</h3><p>${p.text}</p>${p.linkText ? `<a href="${p.linkUrl}" class="card-link">${p.linkText}</a>` : ''}</div>`).join('')}
    </div>${pageFooter(pageNum)}</div>`;
  }

  // PLUGINS (Details)
  if (s('plugins')) {
    sn++; const pn = String(sn).padStart(2,'0');
    pageNum++;
    html += `<div class="page">${headerBar(false)}<div class="page-body">
      ${sectionHead(pn, 'Platforms', 'Platforms & Tools')}
      <p>This engagement is built on the following platforms:</p>
      ${enabledPlugins.map(p => `<h4>${p.name}</h4><p>${p.desc}</p>`).join('')}
      <div class="callout">
        <h4>Third Party License Costs</h4>
        <p>Our standard toolset is provided by ${d.brand.company} under our license management fee of <strong>${d.pluginCost}</strong>. Platform subscriptions unique to your program (email platform, CRM, stock licensing) are billed to you directly at the publisher\u2019s rate.</p>
      </div>
    </div>${pageFooter(pageNum)}</div>`;
  }

  // DELIVERABLES
  if (s('deliverables') && enabledDeliverables.length) {
    pageNum++;
    html += `<div class="page">${headerBar(false)}<div class="page-body">
      <h3 style="margin-top:0">Project Deliverables</h3>
      <ol class="deliverables-list">
        ${enabledDeliverables.map(dl => `<li>${dl.text}</li>`).join('')}
      </ol>
    </div>${pageFooter(pageNum)}</div>`;
  }

  // SCHEDULE & BILLING
  if (s('schedule')) {
    sn++; const pn = String(sn).padStart(2,'0');
    pageNum++;
    html += `<div class="page">${headerBar(false)}<div class="page-body">
      ${sectionHead(pn, 'Schedule', `Project Schedule: ${d.schedule.title}`)}
      <p>${d.schedule.intro}</p>
      <p style="font-size:13px;color:var(--text-light);font-style:italic">${d.schedule.note}</p>
      <table class="schedule-table">
        <thead><tr><th>Phase</th><th>Duration</th><th>Project Milestones</th></tr></thead>
        <tbody>
          ${d.schedule.phases.map(p => `<tr><td>${p.name}</td><td>${p.duration}</td><td><ul>${p.milestones.split('\n').map(m => `<li>${m}</li>`).join('')}</ul></td></tr>`).join('')}
        </tbody>
      </table>
      <h3>Billing Schedule</h3>
      <div class="billing-grid">
        ${d.billing.map(b => `<div class="billing-step"><div class="billing-pct">${b.pct}</div><div class="billing-label">${b.label.replace('\n','<br>')}</div></div>`).join('')}
      </div>
      <p class="footnote" style="border-top:none;padding-top:0"><strong>NOTE:</strong> We submit invoices 30 days prior to payment due dates to give your accounts payable 30 days to process.</p>
    </div>${pageFooter(pageNum)}</div>`;
  }

  // EXTRA SCOPE
  if (s('extraScope')) {
    sn++; const pn = String(sn).padStart(2,'0');
    pageNum++;
    html += `<div class="page">${headerBar(false)}<div class="page-body">
      ${sectionHead(pn, 'Scope', 'Extra Scope')}
      <p>The scope of a marketing program inevitably shifts as the work takes shape. Some needs cannot be seen until strategy and creative are in front of you and content production begins. Our milestone reviews are designed to catch and absorb most of those changes.</p>
      <p>Even so, some requests that were not contemplated in this proposal will fall outside the fee provided. We recommend that clients set aside <strong>10&ndash;15% of the initial budget</strong> for extra scope. All extra scope work is billed on an hourly basis (<strong>${d.pricing.hourlyRate}</strong>).</p>
      <h3>Our Pledge</h3>
      <p>${d.brand.company} will quickly make known any changes or additions that fall into the extra scope category throughout the planning, design, and development process. We will explain why certain changes fall outside of scope, and whenever possible, offer alternatives to keep the project as close to its original budget as possible.</p>
      <h3>Examples of scope changes:</h3>
      <ul class="scope-list">
        <li>New deliverables, channels, or page types added after strategy sign-off</li>
        <li>Creative directions that call for custom artwork, original photography, or video</li>
        <li>Revisions requested after a milestone has been approved</li>
        <li>Additional content beyond the counts in the Content Inventory</li>
        <li>Integrations or platform work discovered mid-project</li>
      </ul>
      <h3>Expenses, Licenses, Third Party Platforms</h3>
      <p>Hard costs and expenses (e.g., travel and lodging, if needed) associated with the project will be billed separately. Platform subscriptions, artwork and stock licensing, font licensing, and paid media budgets are also billed separately.</p>
      <p>Whenever possible ${d.brand.company} uses tools we hold agency licenses for and passes that saving on under our license management fee. Tools licensed to you directly stay in your name, so nothing breaks if we ever part ways.</p>
    </div>${pageFooter(pageNum)}</div>`;
  }

  // ONGOING SUPPORT
  if (s('ongoingSupport')) {
    sn++; const pn = String(sn).padStart(2,'0');
    pageNum++;
    const blocks = (d.ongoingSupport && Array.isArray(d.ongoingSupport.blocks)) ? d.ongoingSupport.blocks : [];
    html += `<div class="page">${headerBar(false)}<div class="page-body">
      ${sectionHead(pn, 'Support', 'Ongoing Support')}
      ${blocks.map((b, i) => `<h3${i === 0 ? ' style="margin-top:0"' : ''}>${b.heading || ''}</h3>${b.body || ''}`).join('')}
    </div>${pageFooter(pageNum)}</div>`;
  }

  // TEAM
  if (s('team') && enabledTeam.length) {
    sn++; const pn = String(sn).padStart(2,'0');
    pageNum++;
    html += `<div class="page">${headerBar(false)}<div class="page-body">
      ${sectionHead(pn, 'Team', d.brand.company + ' Team')}
      <p style="margin-bottom:30px">${d.brand.teamIntro}</p>
      ${enabledTeam.map(t => { const ti = resolveImg(t.image); return `<div class="team-member">${ti ? `<img class="team-photo-img" src="${ti}" alt="${t.name}">` : ''}<div class="team-info"><div class="team-name">${t.name}</div><div class="team-role">${t.role}</div><p class="team-bio">${t.bio}</p></div></div>`; }).join('')}
    </div>${pageFooter(pageNum)}</div>`;
  }

  // REFERENCES
  if (s('references') && enabledRefs.length) {
    sn++; const pn = String(sn).padStart(2,'0');
    pageNum++;
    html += `<div class="page">${headerBar(false)}<div class="page-body">
      ${sectionHead(pn, 'References', 'References')}
      <div class="ref-grid">
        ${enabledRefs.map(r => { const ri = resolveImg(r.image); return `<div class="ref-card">
          ${ri ? `<img class="ref-screenshot" src="${ri}" alt="${r.org} Homepage">` : `<div class="ref-screenshot-placeholder">
            <span>Homepage Screenshot</span>
            <span class="placeholder-url">${r.url}</span>

          </div>
        </div>`; }).join('')}
      </div>
    </div>${pageFooter(pageNum)}</div>`;
  }

  // TERMS
  if (s('terms')) {
    sn++; const pn = String(sn).padStart(2,'0');
    pageNum++;
    html += `<div class="page">${headerBar(false)}<div class="page-body">
      ${sectionHead(pn, 'Approval', 'Project Terms and Approval')}
      <p>Please review our project terms at <a href="https://${d.brand.termsUrl}">${d.brand.termsUrl}</a>, and our terms for ongoing proactive support at <a href="https://${d.brand.supportTermsUrl}">${d.brand.supportTermsUrl}</a>. Accepting this project affirms that you have read and agree to these terms.</p>
      <div class="sig-grid" style="margin-top:40px">
        <div class="sig-block">
          <div class="sig-block-header">Client</div>
          <div class="sig-block-info">&nbsp;</div>

  document.getElementById('proposal-preview').innerHTML = html;

  // Check each page for overflow and flag it
  requestAnimationFrame(() => {

function editorSection(title, open, content, defaultsKey) {
  const defaultsLink = defaultsKey
    ? `<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--border);text-align:right"><a href="#" onclick="saveSectionDefault('${defaultsKey}');return false" class="defaults-link">Set as default</a><a href="#" onclick="resetSectionDefault('${defaultsKey}');return false" class="defaults-link" style="margin-left:10px;color:#c0392b">Reset</a></div>`
    : '';
  return `<div class="editor-section ${open ? 'open' : ''}">
    <div class="editor-section-header" onclick="this.parentElement.classList.toggle('open')">
      ${title} <span class="arrow">\u25B6</span>
    </div>
    <div class="editor-section-body">${content}${defaultsLink}</div>
  </div>`;
}

function field(label, type, path, extra='') {
  const val = getPath(data, path);
  if (type === 'textarea') {
    return `<div class="field"><span class="field-label">${label}</span><textarea class="field-textarea" ${extra} onchange="setPath(data,'${path}',this.value);render()" oninput="setPath(data,'${path}',this.value);render()">${val || ''}</textarea></div>`;
  }
  return `<div class="field"><span class="field-label">${label}</span><input class="field-input" type="text" value="${escAttr(val)}" onchange="setPath(data,'${path}',this.value);render()" ${extra}></div>`;
}

function getPath(obj, path) {
  return path.split('.').reduce((o, k) => o && o[k], obj);
}

function setPath(obj, path, val) {
  const keys = path.split('.');
  const last = keys.pop();
  const target = keys.reduce((o, k) => o[k], obj);
  target[last] = val;
}

function escAttr(s) { return String(s || '').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

let codeViewActive = false;
let introCodeViewActive = false;

function toggleIntroCodeView() {
  const editor = document.getElementById('intro-editor');
  const code = document.getElementById('intro-code');
  const btn = document.getElementById('intro-code-toggle-btn');

function toggleCodeView() {

}
function escHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

// Generic drag-and-drop reordering for any list editor.
// containerEl: parent whose direct children are the rows.
// arrayPath: dot-path into `data` for the array being reordered (e.g. 'pricing.lineItems').
// rebuildFn: function to redraw the editor list after reorder.
// onSwap (optional): called as onSwap(from, to) BEFORE rebuildFn, lets caller keep paired arrays in sync.
const DRAG_HANDLE_HTML = '<span class="drag-handle" title="Drag to reorder">&#9776;</span>';
function enableRowDrag(containerEl, arrayPath, rebuildFn, onMove) {
  if (!containerEl) return;
  const arr = arrayPath.split('.').reduce((o, k) => o && o[k], data);
  if (!Array.isArray(arr)) return;
  Array.from(containerEl.children).forEach((row, i) => {
    row.classList.add('draggable-row');
    row.dataset.idx = i;
    // Find the row's own drag handle (not one nested inside an inline-edit panel).
    const handle = row.querySelector('.drag-handle');
    if (!handle || handle.closest('.inline-edit')) return;
    // Only enable dragging when the user grabs the handle, so clicking inputs/text inside the row still selects normally.
    handle.addEventListener('mousedown', () => {
      row.setAttribute('draggable', 'true');
      // Always clear draggable on the next mouseup anywhere, even if the user releases off the handle.
      document.addEventListener('mouseup', () => row.setAttribute('draggable', 'false'), { once: true });
    });
    row.addEventListener('dragstart', (e) => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(i));
      row.classList.add('dragging');
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      row.setAttribute('draggable', 'false');
      containerEl.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(r => {
        r.classList.remove('drag-over-top', 'drag-over-bottom');
      });
    });
    row.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = row.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      row.classList.toggle('drag-over-top', before);
      row.classList.toggle('drag-over-bottom', !before);
    });
    row.addEventListener('dragleave', () => {
      row.classList.remove('drag-over-top', 'drag-over-bottom');
    });
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      const from = Number(e.dataTransfer.getData('text/plain'));
      const rect = row.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      let to = Number(row.dataset.idx);
      if (!before) to += 1;
      // Adjust for the splice we're about to do
      if (from < to) to -= 1;
      if (Number.isNaN(from) || from === to) {
        row.classList.remove('drag-over-top', 'drag-over-bottom');
        return;
      }
      const [moved] = arr.splice(from, 1);
      arr.splice(to, 0, moved);
      if (typeof onMove === 'function') onMove(from, to);
      if (typeof rebuildFn === 'function') rebuildFn();
      render();
    });
  });
}

// --- Dynamic list builders ---

// Toggle an inline edit panel open/closed and reflect state in the button label.
function toggleInlineEdit(btn) {
  const panel = btn.nextElementSibling;
  if (!panel) return;
  const open = panel.classList.toggle('open');
  btn.textContent = open ? 'Save' : 'Edit';
}

// Update a collapsed row's summary label in place \u2014 lets you edit field-to-field
// without rebuilding (which would collapse the panel and drop focus).
function syncRowLabel(inputEl, text) {
  const row = inputEl.closest('.toggle-row');
  if (!row) return;
  const label = row.querySelector('label');
  if (label) label.textContent = text;
}

// Capture / restore which inline edit panels are open across an innerHTML rebuild
// (structural changes like remove/reorder shouldn't collapse other open rows).
function captureOpenRows(el) {
  const open = new Set();
  if (el) Array.from(el.children).forEach((row, i) => {
    const ie = row.querySelector('.inline-edit');
    if (ie && ie.classList.contains('open')) open.add(i);
  });
  return open;
}
function restoreOpenRows(el, open) {
  if (!el || !open || !open.size) return;
  Array.from(el.children).forEach((row, i) => {
    if (!open.has(i)) return;
    const ie = row.querySelector('.inline-edit');
    if (ie) ie.classList.add('open');
    const btn = row.querySelector('.toggle-edit-btn');
    if (btn) btn.textContent = 'Save';
  });
}

function updatePricingTotal() {
  const totalEl = document.getElementById('pricing-total');
  if (!totalEl) return;
  const showAlt = data.pricing.altFee.enabled;
  const enabled = data.pricing.lineItems.filter(li => li.enabled);
  const base = enabled.reduce((s, li) => s + Number(li.amount || 0), 0);
  const alt = enabled.reduce((s, li) => s + Number(li.altAmount || li.amount || 0), 0);
  totalEl.innerHTML = showAlt
    ? `Total: $${base.toLocaleString('en-US')} / $${alt.toLocaleString('en-US')} (${data.pricing.altFee.label})`
    : `Total: $${base.toLocaleString('en-US')}`;
}

function rebuildPricingItems() {
  const el = document.getElementById('pricing-items');

// Split the overview text into paragraphs (on blank lines, or single lines as
// a fallback) and wrap each one in <p>...</p>. Strips any existing <p> wrappers
// first so it's safe to click repeatedly without double-wrapping. Works whether
// the editor is in rich-text or code view.
function wrapOverviewParagraphs(idx) {
  const editor = document.getElementById('ov-editor-' + idx);
  const code = document.getElementById('ov-code-' + idx);
  const inCode = code.style.display !== 'none';
  const raw = inCode ? code.value : (data.overview[idx] || '');
  let s = String(raw).trim();
  // Drop existing paragraph wrappers so we re-paragraph from scratch.
  s = s.replace(/<\/?p[^>]*>/gi, '\n\n');
  // Prefer splitting on blank lines; fall back to single newlines.
  let blocks = s.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  if (blocks.length <= 1) blocks = s.split(/\n+/).map(b => b.trim()).filter(Boolean);
  const wrapped = blocks.map(b => '<p>' + b + '</p>').join('\n');
  data.overview[idx] = wrapped;
  if (inCode) code.value = wrapped;
  editor.innerHTML = wrapped;
  render();
}

// ============================================================
// IMAGE STORE (IndexedDB) — keeps uploaded images out of localStorage
// ============================================================
// Images uploaded by the user are stored in IndexedDB (gigabyte-class quota)
// instead of inlined as base64 in localStorage (~5 MB cap).
// In the proposal data, an uploaded image is referenced as 'idb:<id>'.
// On export, idb: references are inlined back to base64 so the JSON stays portable.
const IMG_DB_NAME = 'pe-images';
const IMG_STORE = 'images';
let _imgDb = null;
const _imgCache = new Map();        // id -> data URL (resolved)
const _imgPending = new Set();      // ids currently being loaded
let _imgReloadTimer = null;

function imgDbOpen() {
  if (_imgDb) return Promise.resolve(_imgDb);
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB not available')); return; }
    const req = indexedDB.open(IMG_DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IMG_STORE)) db.createObjectStore(IMG_STORE);
    };
    req.onsuccess = (e) => { _imgDb = e.target.result; resolve(_imgDb); };
    req.onerror = (e) => reject(e.target.error);
  });
}

function imgDbPut(id, dataUrl) {
  return imgDbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IMG_STORE, 'readwrite');
    tx.objectStore(IMG_STORE).put(dataUrl, id);
    tx.oncomplete = () => { _imgCache.set(id, dataUrl); resolve(); };
    tx.onerror = (e) => reject(e.target.error);
  }));
}

function imgDbGet(id) {
  if (_imgCache.has(id)) return Promise.resolve(_imgCache.get(id));
  return imgDbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IMG_STORE, 'readonly');
    const req = tx.objectStore(IMG_STORE).get(id);
    req.onsuccess = () => {
      if (req.result) _imgCache.set(id, req.result);
      resolve(req.result || '');
    };
    req.onerror = (e) => reject(e.target.error);
  }));
}

function imgDbDelete(id) {
  return imgDbOpen().then(db => new Promise((resolve) => {
    const tx = db.transaction(IMG_STORE, 'readwrite');
    tx.objectStore(IMG_STORE).delete(id);
    tx.oncomplete = () => { _imgCache.delete(id); resolve(); };
    tx.onerror = () => resolve(); // best-effort
  }));
}

// Load every image in the store into memory so render() can use them synchronously.
function imgDbPrimeCache() {
  return imgDbOpen().then(db => new Promise((resolve) => {
    const tx = db.transaction(IMG_STORE, 'readonly');
    const store = tx.objectStore(IMG_STORE);
    const req = store.openCursor();
    req.onsuccess = (e) => {
      const cur = e.target.result;
      if (cur) {
        _imgCache.set(cur.key, cur.value);
        cur.continue();
      } else {
        resolve();
      }
    };
    req.onerror = () => resolve();
  })).catch(() => {});
}

function newImgId() {
  return 'img_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

// Synchronously resolve an image URL. If it's an idb: reference and the cache
// doesn't have it yet, kicks off an async load and schedules a re-render.
function resolveImg(url) {
  if (!url || typeof url !== 'string') return '';
  if (url.indexOf('idb:') === 0) {
    const id = url.slice(4);
    if (_imgCache.has(id)) return _imgCache.get(id);
    // Not cached yet — load in background and re-render when ready.
    if (!_imgPending.has(id)) {
      _imgPending.add(id);
      imgDbGet(id).then(() => {
        _imgPending.delete(id);
        if (_imgReloadTimer) return;
        _imgReloadTimer = setTimeout(() => {
          _imgReloadTimer = null;
          if (typeof render === 'function') render();
          if (typeof rebuildRefs === 'function') rebuildRefs();
          if (typeof rebuildTeam === 'function') rebuildTeam();
        }, 50);
      }).catch(() => { _imgPending.delete(id); });
    }
    return '';
  }
  return url;
}

// Walk a proposal-shaped object and move any inline base64 images into IndexedDB,
// replacing them with idb: references. Returns true if anything changed.
function migrateInlineImagesToIdb(d) {
  if (!d) return Promise.resolve(false);
  const tasks = [];
  let changed = false;
  function visit(obj, key) {
    const v = obj && obj[key];
    if (typeof v === 'string' && v.indexOf('data:image') === 0) {
      const id = newImgId();
      tasks.push(imgDbPut(id, v).then(() => { obj[key] = 'idb:' + id; changed = true; }));
    }
  }
  (d.references || []).forEach(r => visit(r, 'image'));
  (d.team || []).forEach(t => visit(t, 'image'));
  return Promise.all(tasks).then(() => changed);
}

// Walk a proposal and inline any idb: references back to base64. Used on export.
function inlineIdbImagesForExport(d) {
  const copy = JSON.parse(JSON.stringify(d));
  const tasks = [];
  function visit(obj, key) {
    const v = obj && obj[key];
    if (typeof v === 'string' && v.indexOf('idb:') === 0) {
      tasks.push(imgDbGet(v.slice(4)).then(url => { if (url) obj[key] = url; }));
    }
  }
  (copy.references || []).forEach(r => visit(r, 'image'));
  (copy.team || []).forEach(t => visit(t, 'image'));
  return Promise.all(tasks).then(() => copy);
}

// One-shot migration over everything stored in localStorage.
function migrateAllStoredImagesToIdb() {
  return imgDbOpen().then(() => {
    const proposals = getProposals();
    const proposalIds = Object.keys(proposals);
    let proposalsChanged = false;
    const proposalTasks = proposalIds.map(id =>
      migrateInlineImagesToIdb(proposals[id]).then(c => { if (c) proposalsChanged = true; })
    );
    return Promise.all(proposalTasks).then(() => {
      if (proposalsChanged) safeLocalStorageWrite(STORAGE_KEY, JSON.stringify(proposals), { silent: true });
      const tpls = getTemplates();
      let tplsChanged = false;
      const tplTasks = Object.keys(tpls).map(id =>
        migrateInlineImagesToIdb(tpls[id]).then(c => { if (c) tplsChanged = true; })
      );
      return Promise.all(tplTasks).then(() => {
        if (tplsChanged) safeLocalStorageWrite(TEMPLATES_KEY, JSON.stringify(tpls), { silent: true });
        // Also migrate any custom defaults (e.g. team images saved as defaults)
        const defaults = getCustomDefaults();
        if (defaults) {
          return migrateInlineImagesToIdb(defaults).then(c => {
            if (c) safeLocalStorageWrite(DEFAULTS_KEY, JSON.stringify(defaults), { silent: true });
          });
        }
      });
    });
  }).catch(err => console.warn('Image migration skipped:', err));
}

// ============================================================
// SAVE / LOAD / EXPORT / IMPORT
// ============================================================
const STORAGE_KEY = 'pe-proposals';

function getProposals() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}

// Wrap any localStorage write so we surface quota errors instead of silently failing.
function safeLocalStorageWrite(key, value, opts) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (err) {
    const isQuota = err && (err.name === 'QuotaExceededError' || err.code === 22 || /quota/i.test(String(err.message)));
    if (opts && opts.silent) {
      console.error('localStorage write failed for key', key, err);
      return false;
    }
    if (isQuota) {
      const sizeMB = (value.length / (1024 * 1024)).toFixed(2);
      // Offer an immediate emergency download so no work is lost.
      const dl = confirm(
        'Save failed: browser localStorage is full.\n\n' +
        'Your proposal data is ' + sizeMB + ' MB. The browser cap is typically 5–10 MB per site.\n' +
        'The most common cause is uploaded reference/team images stored as base64.\n\n' +
        'Click OK to immediately download a JSON backup of your current work.\n' +
        'Then either remove some uploaded images or delete unused saved proposals.'
      );
      if (dl) emergencyExport();
    } else {
      alert('Save failed: ' + (err && err.message ? err.message : err));
    }
    return false;
  }
}

function emergencyExport() {
  const slug = (data.meta && data.meta.clientName ? data.meta.clientName : 'proposal').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/, '');
  // Inline idb: image references back to base64 so the rescue file is fully portable.
  inlineIdbImagesForExport(data).then(portable => {
    try {
      const blob = new Blob([JSON.stringify(portable, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'RESCUE-' + slug + '-' + Date.now() + '.json';
      a.click();
    } catch (e) {
      console.error('Emergency export failed', e);
      alert('Emergency export also failed. Open DevTools console and run: copy(JSON.stringify(data))');
    }
  }).catch(() => {
    // Fall back to in-memory data without idb resolution if IndexedDB is broken.
    try {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'RESCUE-' + slug + '-' + Date.now() + '.json';
      a.click();
    } catch (e) {
      alert('Emergency export failed. Open DevTools console and run: copy(JSON.stringify(data))');
    }
  });
}

function saveProposal(silent) {
  if (currentTemplateId) { saveTemplateEdits(); return; }
  if (!currentProposalId) {
    const name = prompt('Proposal name:', data.meta.clientName || 'Untitled');
    if (!name) return;
    currentProposalId = name;
  }
  const proposals = getProposals();
  proposals[currentProposalId] = JSON.parse(JSON.stringify(data));
  const serialized = JSON.stringify(proposals);
  if (!safeLocalStorageWrite(STORAGE_KEY, serialized)) return;
  safeLocalStorageWrite(STORAGE_KEY + '-last', currentProposalId, { silent: true });
  refreshProposalSelector();
  document.getElementById('proposal-selector').value = currentProposalId;
  if (!silent) {
    const btn = document.querySelector('.btn-save');
    const orig = btn.textContent;
    btn.textContent = 'SAVED!';
    btn.style.background = '#2a7d3f';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; }, 1500);
  }
}

function autoSave() {
  if (currentProposalId) {
    const proposals = getProposals();
    proposals[currentProposalId] = JSON.parse(JSON.stringify(data));
    // Silent here — autoSave fires constantly; we don't want a popup on every keystroke.
    // The next manual Save / Export will surface the issue.
    const ok = safeLocalStorageWrite(STORAGE_KEY, JSON.stringify(proposals), { silent: true });
    if (ok) safeLocalStorageWrite(STORAGE_KEY + '-last', currentProposalId, { silent: true });
    return ok;
  }
  return true;
}

function loadProposal(id) {
  // Auto-save current work before switching
  if (currentProposalId) autoSave();
  // Loading a proposal exits template edit mode
  if (currentTemplateId) { currentTemplateId = null; updateTemplateEditBanner(); }

  if (id === '__new__') {
    data = getDefaultData();
    if (data.meta) data.meta.date = todayDateString();
    currentProposalId = null;
    buildEditor(); render();
    updateCompleteButton();
    return;
  }
  const proposals = getProposals();
  if (proposals[id]) {
    data = JSON.parse(JSON.stringify(proposals[id]));
    currentProposalId = id;
    safeLocalStorageWrite(STORAGE_KEY + '-last', id, { silent: true });
    buildEditor(); render();
    updateCompleteButton();
  }
}

function updateCompleteButton() {
  const btn = document.getElementById('btn-mark-complete');
  if (!btn) return;
  if (currentProposalId) {
    const items = getPipeline();
    const inPipeline = items.find(it => it.name === currentProposalId);
    if (inPipeline) {
      btn.classList.add('completed');
      btn.innerHTML = '&#x2714; In Pipeline';
    } else {
      btn.classList.remove('completed');
      btn.innerHTML = '&#x2714; Complete';
    }
  } else {
    btn.classList.remove('completed');
    btn.innerHTML = '&#x2714; Complete';
  }
}

function refreshProposalSelector() {
  const sel = document.getElementById('proposal-selector');
  const proposals = getProposals();
  sel.innerHTML = '<option value="__new__">+ New Proposal</option>';
  Object.keys(proposals).forEach(k => {
    sel.innerHTML += `<option value="${escAttr(k)}">${escHtml(k)}</option>`;
  });
  if (currentProposalId) sel.value = currentProposalId;
}

function renameProposal() {
  if (!currentProposalId) return;
  const name = prompt('New name:', currentProposalId);
  if (!name || name === currentProposalId) return;
  const proposals = getProposals();
  proposals[name] = proposals[currentProposalId];
  delete proposals[currentProposalId];
  safeLocalStorageWrite(STORAGE_KEY, JSON.stringify(proposals));
  currentProposalId = name;
  refreshProposalSelector();
}

function duplicateProposal() {
  const name = prompt('Name for duplicate:', (currentProposalId || data.meta.clientName) + ' (copy)');
  if (!name) return;
  const proposals = getProposals();
  proposals[name] = JSON.parse(JSON.stringify(data));
  safeLocalStorageWrite(STORAGE_KEY, JSON.stringify(proposals));
  currentProposalId = name;
  refreshProposalSelector();
}

function deleteProposal() {
  if (!currentProposalId) return;
  if (!confirm(`Delete "${currentProposalId}"?`)) return;
  const proposals = getProposals();
  delete proposals[currentProposalId];
  safeLocalStorageWrite(STORAGE_KEY, JSON.stringify(proposals));
  currentProposalId = null;
  data = getDefaultData();
  refreshProposalSelector();
  buildEditor(); render();
}

function exportJSON() {
  // Auto-increment version on each export
  if (!data.meta.version) data.meta.version = 1;
  else data.meta.version++;

  // Download FIRST — this never fails on quota and guarantees the user gets their file.
  // Inline any idb: image references back to base64 so the file is portable.
  const slug = (data.meta.clientName || 'proposal').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/, '');
  inlineIdbImagesForExport(data).then(portable => {
    try {
      const blob = new Blob([JSON.stringify(portable, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${slug}-proposal-v${data.meta.version}.json`;
      a.click();
    } catch (e) {
      alert('Export failed: ' + (e && e.message ? e.message : e));
      return;
    }
    // Then continue with the post-export persistence.
    exportJSONPostSave();
  });
}

function exportJSONPostSave() {

  // Then try to persist the version bump and pipeline entry. If localStorage is full
  // we still got the file out, so we just surface a warning.
  if (currentProposalId) {
    const ok = autoSave();
    if (!ok) {
      alert('JSON file downloaded, but the version bump could not be saved to your browser ' +
            '(localStorage is full). Consider removing uploaded images or deleting old saved proposals.');
    } else {
      try { addToPipeline(currentProposalId); } catch (e) { console.warn('addToPipeline failed', e); }
    }
  }

  // Update version display
  render();
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      // Move any inline base64 images out of the proposal data and into IndexedDB
      // before storing in localStorage — otherwise we re-create the quota problem.
      migrateInlineImagesToIdb(parsed).then(() => {
        data = parsed;
        currentProposalId = data.meta.clientName || null;
        buildEditor(); render();
        if (currentProposalId) saveProposal();
      });
    } catch (err) { alert('Invalid JSON file'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function generatePDF() {
  // Open a clean print window with ONLY the proposal (no sidebar/editor)
  const clientName = data.meta.clientName || 'Client';
  const previewHtml = document.getElementById('proposal-preview').innerHTML;

  // Collect all stylesheets from the current page
  const styles = Array.from(document.querySelectorAll('style')).map(s => s.outerHTML).join('\n');
  const links = Array.from(document.querySelectorAll('link[rel="stylesheet"]')).map(l => l.outerHTML).join('\n');

  const printDoc = `<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>Proposal - ${clientName}</title>
${links}
${styles}
<style>
  /* Print window: remove editor UI, show only proposal */
  body { background: white !important; margin: 0; padding: 0; overflow: visible; }
  .topbar, .sidebar, .app-layout, .preview-area { all: unset !important; display: block !important; }
  #proposal-preview .page {
    box-shadow: none; margin: 0; border-radius: 0;
    max-width: 100%; width: 100%;
    page-break-before: always;
    background: white;
  }
  #proposal-preview .page:first-child { page-break-before: auto; }
  @media print {
    @page { size: letter; margin: 0; }
  }
</style>
</head><body>
<div id="proposal-preview">${previewHtml}</div>
<script>
  // Auto-print after images load
  window.onload = function() {
    setTimeout(function() { window.print(); }, 500);
  };
<` + `/script>
</body></html>`;

  const printWindow = window.open('', '_blank');
  printWindow.document.write(printDoc);
  printWindow.document.close();
}
