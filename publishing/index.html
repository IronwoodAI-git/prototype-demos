/* ---- simulated generation actions ---- */
function simGen(msg,cb){toast(msg);setTimeout(cb,650);}
/* Real article draft: Sonnet writes ~900-1400 words from the concept's brief+angle+steering, then
   the self-review finishing pass runs (so this can take up to a minute + several model calls). */
/* ===== workspace status bar for long LLM actions =====
   A persistent in-progress bar (animated + elapsed seconds) so a click always shows
   it's working, and a real error banner (with Retry) when something fails — instead of
   a toast that flashes and vanishes. Only ONE workspace LLM action runs at a time. */
let _wsTimer=null;
// Where the status bar lives: a TRANSIENT bar injected right after the clicked button's row
// (so EVERY AI/image button gets in-progress + error feedback right where it was clicked), or
// the fixed #wsWork bar in the Article-content section when no button element is given.
function _wbHost(anchor){
  if(anchor){
    const row=anchor.closest(".btnrow")||anchor;
    let bar=row.nextElementSibling;
    if(!(bar&&bar.classList&&bar.classList.contains("workbar")&&bar.dataset.tw==="1")){
      bar=document.createElement("div"); bar.className="workbar"; bar.dataset.tw="1"; bar.style.marginTop="10px";
      row.insertAdjacentElement("afterend",bar);
    }
    return bar;
  }
  return $("wsWork");
}
function wsWorkStart(bar,msg){
  if(!bar)return;
  bar.style.display=""; bar.className="workbar working"+(bar.dataset.tw?" tw":"");
  bar.innerHTML='<div class="wbrow"><span class="wbspin">✨</span><div class="wbmsg">'+esc(msg)+'</div><div class="wbtime">0s</div></div><div class="wbbar"></div>';
  const te=bar.querySelector(".wbtime"),t0=Date.now(); clearInterval(_wsTimer);
  _wsTimer=setInterval(function(){ if(!te||!te.isConnected){clearInterval(_wsTimer);return;}
    const s=Math.floor((Date.now()-t0)/1000); te.textContent=s<60?s+"s":Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); },1000);
  bar.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function wsWorkDone(bar){ clearInterval(_wsTimer); if(!bar)return; if(bar.dataset.tw){bar.remove();} else {bar.style.display="none"; bar.innerHTML="";} }
function wsWorkFail(bar,msg,retry){
  clearInterval(_wsTimer); if(!bar)return;
  bar.style.display=""; bar.className="workbar error"+(bar.dataset.tw?" tw":"");
  bar.innerHTML='<div class="wbrow"><span>⚠️</span><div class="wbmsg"><b>That did not go through.</b> '+esc(msg)+'</div></div>'
    +'<div class="wbactions"><button class="btn sm" data-act="retry">↻ Try again</button><button class="btn sm gray ghost" data-act="dismiss">Dismiss</button></div>';
  const rb=bar.querySelector('[data-act="retry"]'); if(rb)rb.onclick=function(){ wsWorkDone(bar); if(retry)retry(); };
  const dz=bar.querySelector('[data-act="dismiss"]'); if(dz)dz.onclick=function(){ wsWorkDone(bar); };
  bar.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function setWsBusy(busy){ document.querySelectorAll('#v-workspace button, #v-workspace select, #v-workspace input, #v-workspace textarea').forEach(function(b){ b.disabled=busy; }); }
// Generic runner for ANY workspace AI/image action: guards double-clicks, drives the status bar
// (transient next to the button `o.anchor`, or the fixed one), surfaces the real server error
// with a Retry, and only mutates + re-renders on success.
async function llmAction(o){
  if(window._wsBusy){toast("Already working — hang tight","warn");return;}
  window._wsBusy=true; setWsBusy(true);
  const bar=_wbHost(o.anchor); wsWorkStart(bar,o.label);
  // stale guard: a truly stuck request eventually aborts to an error instead of spinning forever.
  const ctrl=new AbortController(); const ceiling=o.timeout||300000;
  const to=setTimeout(function(){ try{ctrl.abort();}catch(e){} }, ceiling);
  let r=null, neterr=null, timedout=false;
  try{
    const resp=await fetch(o.path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o.body||{}),signal:ctrl.signal});
    r=await resp.json().catch(function(){return {ok:false,error:"unreadable response (HTTP "+resp.status+")"};});
    if(!resp.ok && r && r.ok!==false){ r.ok=false; r.error=r.error||("HTTP "+resp.status); }
  }catch(e){ if(e&&e.name==="AbortError"){timedout=true;} else {neterr=(e&&e.message)||"network error";} }
  finally{ clearTimeout(to); }
  window._wsBusy=false; setWsBusy(false);
  if(timedout){ wsWorkFail(bar,"This ran longer than "+Math.round(ceiling/1000)+"s and was stopped. It may still have finished on the server — reopen the article to check, or click Try again.", o.retry); return; }
  if(neterr){ wsWorkFail(bar,"Couldn't reach the server ("+neterr+"). It may still be finishing in the background — wait a few seconds and reopen the article, or click Try again.", o.retry); return; }
  if(!r||r.ok===false){ wsWorkFail(bar,(r&&r.error)||"Unknown error from the server.", o.retry); return; }
  wsWorkDone(bar);
  o.onOk(r);
}
/* ===== Voice Studio pipe (2026-09-03) =====
   The engine no longer writes prose. vsRun starts a write (or a revise) in Voice Studio,
   then polls /vs_status until the write -> lint -> edit pipeline there is done and the
   text has been pulled in. Same status bar, same busy guard, same error banner as llmAction. */
let VS={};
const VS_STAGE_WORDS={draft:"Drafting…",lint:"Checking it with the detector…",editor:"Editor pass…",done:"Finishing up…"};
function vsDownNote(){
  if(VS&&VS.alive===false)return `<div class="warnstrip" style="margin-top:10px"><span>⚠</span><div><b>Voice Studio is not answering</b>, so nothing can be written right now. Open it from its launcher. Everything already written can still be polished, approved and scheduled, and you can always paste.</div></div>`;
  return "";
}
async function _vsFetch(path,body){
  const opt=body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{};
  const resp=await fetch(path,opt);
  const r=await resp.json().catch(function(){return {ok:false,error:"unreadable response (HTTP "+resp.status+")"};});
  if(!resp.ok&&r&&r.ok!==false){r.ok=false;r.error=r.error||("HTTP "+resp.status);}
  return r;
}
async function vsRun(o){
  if(window._wsBusy){toast("Already working — hang tight","warn");return;}
  window._wsBusy=true; setWsBusy(true);
  const bar=_wbHost(o.anchor); wsWorkStart(bar,o.label);
  const fail=function(m){ window._wsBusy=false; setWsBusy(false); wsWorkFail(bar,m,o.retry); };
  let r=null;
  try{ r=await _vsFetch(o.startPath,o.body||{}); }
  catch(e){ return fail("Couldn't reach the server ("+((e&&e.message)||"network error")+")."); }
  if(!r||r.ok===false) return fail((r&&r.error)||"Unknown error from the server.");
  const msg=bar.querySelector(".wbmsg");
  const who=r.model?(" Writer: "+r.model+(r.est_cost?" · about "+Math.round(r.est_cost*100)+"¢":"")+"."):"";
  if(msg)msg.textContent=o.label+who;
  const t0=Date.now(), ceiling=o.timeout||480000; let last="";
  while(true){
    await new Promise(function(res){setTimeout(res,3000);});
    if(Date.now()-t0>ceiling) return fail("Voice Studio has been at it for over "+Math.round(ceiling/60000)+" minutes. It may still finish there; reopen this piece in a minute, or open it in Voice Studio.");
    let st=null;
    try{ st=await _vsFetch("/api/concept/"+o.id+"/vs_status"); }
    catch(e){ continue; }  /* a blip; keep polling until the ceiling */
    if(!st||st.ok===false) return fail((st&&st.error)||"Voice Studio reported a failure.");
    if(st.status==="pending"){ const w=VS_STAGE_WORDS[st.stage]||""; if(msg&&w&&w!==last){last=w;msg.textContent=o.label+who+" "+w;} continue; }
    window._wsBusy=false; setWsBusy(false); wsWorkDone(bar); o.onOk(st); return;
  }
}
function vsWrite(id,btn){
  const c=CONCEPTS.find(function(x){return x.id===id;}); if(!c)return;
  const isLi=isPost(c);
  if(!(isLi&&c.source_concept_id)&&!genGuard(id,isLi?"post":"draft"))return;
  if(!isLi&&c.drafts&&c.drafts.length&&!confirm("Write a fresh draft in Voice Studio? Your current versions stay in the version picker."))return;
  if(isLi&&(c.li_text||"").trim()&&!confirm("Write a fresh post in Voice Studio? It replaces the text in the box."))return;
  const dEl=$("ws_direction"); const direction=(dEl?dEl.value:(ST.genDir&&ST.genDir[id])||"").trim();
  return vsRun({anchor:btn,id:id,startPath:"/api/concept/"+id+"/vs_write",body:direction?{direction:direction}:{},
    label:isLi?"Voice Studio is writing the post: draft, detector check, editor pass. Usually 1 to 3 minutes.":"Voice Studio is writing the article: draft, detector check, editor pass. Usually 2 to 4 minutes.",
    retry:function(){vsWrite(id,btn);},
    onOk:function(st){ snapshot("Write in Voice Studio"); const c=CONCEPTS.find(function(x){return x.id===id;}); if(st.concept)Object.assign(c,st.concept); if(ST.genDir)delete ST.genDir[id]; renderWorkspace(); renderTabs(); toast(st.pulled?"It's in from Voice Studio":"Voice Studio finished; nothing new to pull","ok"); }
  });

/* Generate reads title + brief + angle. A piece started from scratch has a placeholder title and
   nothing else, so an ungated click spends a real Sonnet call to produce mush. Block on a missing
   title (nothing to write about at all); warn once, with the choice left to him, when there's a
   title but no brief or angle. */
function genGuard(id,what){
  const c=CONCEPTS.find(x=>x.id===id);if(!c)return false;
  if(isUntitled(c)){
    toast("Give it a title first — that's all the writer would have to go on","warn");

    if(!confirm("There's no brief or angle yet, so the writer only has the title \""+c.title+"\" to go on.\n\nAdding a brief and angle above gives you a far better "+what+". Generate anyway?")){

    }

/* ISO date (YYYY-MM-DD) of the Monday of the week containing today, in LOCAL time —

function currentWeekStart(){const n=new Date();
  const dow=(n.getDay()+6)%7;  /* JS Sun=0 -> Mon=0..Sun=6 */
  const mon=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow);
  const p=x=>String(x).padStart(2,"0");
  return mon.getFullYear()+"-"+p(mon.getMonth()+1)+"-"+p(mon.getDate());}
function weekDates(startISO){const[y,m,d]=startISO.split("-").map(Number);const out=[];

function publisherBanner(){
  const p=PUBLISHER||{};
  if(p.error||p.enabled===false||!pubNextTick()){
    const why=p.enabled===false?"The automatic publisher is switched OFF in Task Scheduler, so nothing will go out on its own."
      :`I can't read the publisher's schedule right now${p.error?" ("+esc(p.error)+")":""}, so I can't tell you when queued items go out.`;
    return `<div class="pubbanner bad"><span>⚠</span><div>${why} Use <b>Post it now</b> on a card to send it yourself.</div></div>`;
  }
  const next=pubNextTick();
  const mins=Math.max(0,Math.round((next-new Date())/60000));
  return `<div class="pubbanner"><span>🕒</span><div>Scheduled items don't go out the second their time arrives — an automatic publisher checks every
    <b>${pubInterval()}</b> minutes and sends whatever is due. Next check: <b>${esc(fmtWhen(next))}</b>${mins<=90?` (in ${mins} min)`:""}.
    Don't want to wait? Hit <b>Post it now</b> on the card.</div></div>`;
}

      return `<span class="pill p-red">⚠ Didn't go out</span>
        <button class="btn sm purple" onclick="schedPostLi(${c.id})">Try again now</button>
        <div class="puberr">${esc(c.li_error)}</div>`;
    if(liOver(c)>0)
      return `<span class="pill p-red">🚨 ${liOver(c).toLocaleString()} characters too long</span>
        <span class="linkish" onclick="openWorkspace(${c.id})">trim it →</span>`;
    const go=`<button class="btn sm purple pubgo" onclick="schedPostLi(${c.id})" title="Skip the wait — post it to LinkedIn right now">⚡ Post it now</button>`;
    if(!when)return cantTell+go;
    return `<span class="pill p-pur">⏳ goes out ${esc(fmtWhen(when))}</span>${go}`;
  }

  if(c.wp_state==="live")return `<span class="pill p-teal">✓ published</span>`;
  const push=`<button class="btn sm pubgo" onclick="schedUpdateWp(${c.id})" title="Send it to WordPress right now instead of waiting for the next check">⚡ Send it now</button>`;
  if(c.wp_state==="scheduled")
    return `<span class="pill p-amb">📄 handed to WordPress${when?" · goes live "+esc(fmtWhen(when)):""}</span>`;
  if(!when)return cantTell+push;
  return `<span class="pill p-amb">📄 not on WordPress yet · picked up ${esc(fmtWhen(when))}</span>${push}`;
}
function miniCard(c){
  const isLi=posterOf(c)!=="wordpress";   /* every non-WordPress outlet records its live state in li_* */
  const pubrow=pubRowHTML(c);
  const liveUrl=isLi?c.li_url:c.wp_url;
  const isLive=isLi?(c.li_state==="posted"):(c.wp_state==="live");
  const viewLive=(isLive&&liveUrl)?` <a class="linkish" href="${esc(liveUrl)}" target="_blank" rel="noopener" title="Open the published post in a new tab">view live ↗</a>`:"";
  return `<div class="mini" style="border-left:3px solid ${outletOf(c).color}" draggable="true" ondragstart="ST.dragId=${c.id}" ondragend="ST.dragId=null">
    <div class="mt linkish" title="Open this item" onclick="openWorkspace(${c.id})">${typeBadge(c,{sm:true})} ${esc(c.title)}</div>
    <div class="mrow"><input type="time" value="${c.planned_time||'07:00'}" onchange="setTime(${c.id},this.value)"> <span class="linkish" onclick="openWorkspace(${c.id})">open</span>${viewLive}</div>
    <div class="mrow">${pubrow}</div>
    <div class="mrow"><span class="linkish" onclick="unschedule(${c.id})">× remove from day</span> <span class="linkish arch" onclick="archiveFromSchedule(${c.id})" title="Archive — take it off the schedule entirely (reversible)">🗄 archive</span></div></div>`;
}
function dropToDay(e,iso){e.preventDefault();document.querySelectorAll(".daycol").forEach(d=>d.classList.remove("dragover"));
  if(ST.dragId==null)return;snapshot("Schedule item");const c=CONCEPTS.find(x=>x.id===ST.dragId);
  c.planned_date=iso;c.planned_time=c.planned_time||outletOf(c).default_time||"07:00";if(posterOf(c)==="wordpress"&&!c.wp_state)c.wp_state="scheduled";
  persist(c.id,{planned_date:iso,planned_time:c.planned_time});
  ST.dragId=null;render();toast("Scheduled for "+fmtDay(iso),"ok");}
function dropToPool(e){e.preventDefault();if(ST.dragId==null)return;snapshot("Unschedule");const c=CONCEPTS.find(x=>x.id===ST.dragId);
  c.planned_date=null;if(c.wp_state==="scheduled")c.wp_state=null;persist(c.id,{planned_date:null});ST.dragId=null;render();toast("Back to pool","ok");}
function unschedule(id){snapshot("Unschedule");const c=CONCEPTS.find(x=>x.id===id);c.planned_date=null;if(c.wp_state==="scheduled")c.wp_state=null;persist(id,{planned_date:null});render();toast("Removed from day","ok");}
function setTime(id,t){snapshot("Set time");CONCEPTS.find(c=>c.id===id).planned_time=t;persist(id,{planned_time:t});}
function shiftWeek(days){const[y,m,d]=ST.weekStart.split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,d+days));ST.weekStart=dt.toISOString().slice(0,10);renderSchedule();}
/* ---- real publishing from the schedule board ---------------------------------------
   These two used to be mocks that just recoloured the card. They now call the same
   server endpoints the workspace buttons use, hold an in-progress state on the concept
   (c._pub), and only ever show "posted"/"published" when the server confirms it. */
/* Poll the runner's schedule so "next check: 2:15 PM" ages into "2:45 PM" instead of going
   stale on screen. Throttled, and it only re-renders when the tick time actually moved —
   re-rendering unconditionally from inside renderSchedule() would loop forever. */
let _pubPollAt=0,_pubPolling=false;
function refreshPublisher(force){
  const now=Date.now();
  if(_pubPolling||(!force&&now-_pubPollAt<30000))return;
  _pubPolling=true;_pubPollAt=now;
  fetch("/api/publisher").then(r=>r.json()).then(d=>{
    const changed=!PUBLISHER||PUBLISHER.next_run!==d.next_run||PUBLISHER.enabled!==d.enabled||PUBLISHER.error!==d.error;
    PUBLISHER=d;
    if(changed&&ST.tab==="schedule")renderSchedule();
  }).catch(()=>{
    PUBLISHER={...PUBLISHER,error:"the engine didn't answer"};
  }).finally(()=>{_pubPolling=false;});
}
setInterval(()=>{if(ST.tab==="schedule")refreshPublisher();},60000);

const _pubTickers={};
function pubElapsed(job){
  if(!job||!job.startedAt)return "";
  const s=Math.max(0,Math.floor((Date.now()-job.startedAt)/1000));
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
}
function startPubTicker(id){
  if(_pubTickers[id])return;
  _pubTickers[id]=setInterval(()=>{
    const c=CONCEPTS.find(x=>x.id===id);
    if(!c||!c._pub||c._pub.status!=="pending"){clearInterval(_pubTickers[id]);delete _pubTickers[id];return;}
    const el=document.getElementById("ptick-"+id);      // re-queried each tick → survives re-render
    if(el)el.textContent=pubElapsed(c._pub);
  },1000);
}
/* Shared plumbing: guard double-fires, drive c._pub, translate every failure mode into a
   sentence a human can act on. Never falls through to the success path. */
async function _pubRun(id,opts){
  const c=CONCEPTS.find(x=>x.id===id); if(!c)return;
  if(c._pub&&c._pub.status==="pending")return;                     // re-entrancy guard
  if(opts.precheck){const stop=opts.precheck(c); if(stop){toast(stop,"warn");return;}}
  if(opts.confirm&&!confirm(opts.confirm(c)))return;
  c._pub={status:"pending",startedAt:Date.now(),label:opts.label};
  render(); startPubTicker(id);
  const ctrl=new AbortController(), ceiling=opts.timeout||120000;
  const to=setTimeout(()=>{try{ctrl.abort();}catch(e){}},ceiling);
  let r=null,neterr=null,timedout=false;
  try{
    const resp=await fetch(opts.path.replace("{id}",id),{method:"POST",
      headers:{"Content-Type":"application/json"},body:"{}",signal:ctrl.signal});
    r=await resp.json().catch(()=>({ok:false,error:"unreadable response (HTTP "+resp.status+")"}));
    if(!resp.ok&&r&&r.ok!==false){r.ok=false;r.error=r.error||("HTTP "+resp.status);}
  }catch(e){ if(e&&e.name==="AbortError")timedout=true; else neterr=(e&&e.message)||"network error"; }
  finally{ clearTimeout(to); }
  const fail=m=>{c._pub={status:"error",error:m};render();};
  if(timedout)return fail(`This ran longer than ${Math.round(ceiling/1000)} seconds and was stopped. It may still have gone through — reload the page before trying again, so you don't send it twice.`);
  if(neterr)return fail(`Couldn't reach the engine (${neterr}). Check that it's still running, then try again.`);
  if(!r||r.ok===false)return fail((r&&(r.message||r.error))||"The engine refused it and didn't say why.");
  if(r.preview_only||r.dry_run)
    return fail(r.note||"This app is still in practice mode, so nothing was actually sent.");
  c._pub=null;
  opts.onOk(c,r);
  render(); toast(opts.done,"ok");
}
function schedPostLi(id){
  return _pubRun(id,{
    path:"/api/concept/{id}/post_now",
    label:"Posting",
    precheck:c=>liOver(c)>0?fixReason(c)+" Trim it first.":"",
    confirm:c=>`Post “${c.title}” to ${outletOf(c).short} right now?\n\nThis is a real, public post. It goes out immediately and can't be deleted from this app.`,
    /* deliberately NOT snapshot()ed for undo: undo is browser-memory only, so an "undo"
       here would just make the card lie about a post that is already public. */
    onOk:(c,r)=>{
      if(r.concept)Object.assign(c,r.concept);
      else {c.li_state="posted"; if(r.url)c.li_url=r.url;}
      c.li_error=null; },
    done:"Posted ✓"
  });
}
function schedUpdateWp(id){
  return _pubRun(id,{
    path:"/api/concept/{id}/publish",
    label:"Sending to WordPress",
    confirm:c=>`Send “${c.title}” to WordPress (${PUBLISH.wp_target}) now?\n\nIt's created as a scheduled post and goes live at its planned time.`,
    onOk:(c,r)=>{   /* not undoable — see schedPostLi */
      if(r.concept)Object.assign(c,r.concept);
      else {c.wp_state=(r.status==="publish")?"live":"scheduled"; if(r.url)c.wp_url=r.url;} },
    done:"Handed to WordPress ✓"
  });
}
function planWeek(){simGen("Planning the week (Sonnet)…",()=>{toast("Simulated: 5 concepts biased to each day's rhythm pillar. Scheduling stays manual.","ok");});}

window._lastTab="content";

/* =====================================================================
   BOOT — v2 loads REAL data from the server instead of the mock arrays.
   (Phase 1: read-only. Mutations still change the in-memory copy only;
   Phase 2 wires them to the API.) The mock-array literals above remain as
   an offline fallback but are overwritten here before the first render.
   ===================================================================== */
async function boot(){
  try{
    const d=await (await fetch("/api/bootstrap")).json();
    CONCEPTS=d.concepts||[]; PILLARS=d.pillars||PILLARS; SOURCES=d.sources||SOURCES;
    FEED=d.feed||FEED; INSIGHTS=d.insights||INSIGHTS; HASHTAGS=d.hashtags||HASHTAGS;
    STYLE=d.style||STYLE; IMG=d.img||IMG;
    if(d.publish)PUBLISH=d.publish;
    if(d.publisher)PUBLISHER=d.publisher;
    if(d.vs)VS=d.vs;
    if(d.outlets&&d.outlets.length){OUTLETS={};d.outlets.forEach(o=>OUTLETS[o.slug]=o);}
    if(d.posters)POSTERS=d.posters;
    if(d.idseq)_idseq=d.idseq;
  }catch(e){
    console.error("bootstrap failed — showing offline mock data",e);
    toast("Could not load live data — showing mock data","warn");
  }
  renderTabs();applyHash();   // open whatever section/article the URL points at (else Today)
}
boot();

var veil = null, i = 0;

function markSeen(){ try{ sessionStorage.setItem(SKEY,"1"); }catch(e){} }
function esc(){ return null; }

function hasTut(){ return typeof window.TUT === "object" && window.TUT; }

function render(){
  var c = STORY_CH[i], last = i === STORY_CH.length - 1, lead = i === 0;
  var dots = STORY_CH.map(function(_,n){
    return '<i class="'+(n===i?'on':(n<i?'past':''))+'" data-g="'+n+'" title="'+(n+1)+'"></i>';
  }).join("");
  var body = "";
  if(c.lede)   body += '<p class="lede">'+c.lede+'</p>';
  if(c.body)   body += c.body;
  if(c.vs)     body += '<div class="sty-vs"><div><h5>'+c.vs[0].h+'</h5>'+c.vs[0].b+'</div>'+
                       '<div><h5>'+c.vs[1].h+'</h5>'+c.vs[1].b+'</div></div>';
  if(c.flow)   body += '<div class="sty-flow">'+c.flow.map(function(f,n){
                       return '<div class="fs"><span class="n">'+(n+1)+'</span><span class="t">'+f[0]+
                              '</span><span class="d">'+f[1]+'</span></div>';}).join("")+'</div>';
  if(c.list)   body += '<ul class="sty-ul">'+c.list.map(function(l){return '<li>'+l+'</li>';}).join("")+'</ul>';
  if(c.after)  body += c.after;
  if(c.note)   body += '<div class="sty-note">'+c.note+'</div>';

  var foot;
  if(c.choices){
    foot = '<div class="sty-choice">'+c.choices.map(function(ch,n){
      return '<button class="'+(ch.pri?'pri':'')+'" data-do="'+ch.act+'">'+
             '<span class="ci">'+ch.icon+'</span><span><span class="cl">'+ch.label+'</span>'+
             (ch.sub?'<span class="cs">'+ch.sub+'</span>':'')+'</span></button>';
    }).join("")+'</div>'+
    (lead ? '' : '<div class="sty-foot"><div class="sty-dots">'+dots+'</div>'+
       '<button class="sty-btn" data-do="back">&lsaquo; Back</button></div>');
  } else {
    foot = '<div class="sty-foot"><div class="sty-dots">'+dots+'</div>'+
      '<button class="sty-lnk" data-do="skip">Skip to the tool</button>'+
      '<button class="sty-btn" data-do="back"'+(i===0?' disabled':'')+'>&lsaquo; Back</button>'+
      '<button class="sty-btn pri" data-do="next">'+(last?'Finish':'Next')+' &rsaquo;</button></div>';
  }

  veil.innerHTML = '<div class="sty-card'+(lead?' lead':'')+(c.wide?' wide':'')+'">'+
    '<button class="sty-x" data-do="close" title="Close">&times;</button>'+
    '<p class="sty-kick">'+(c.kicker || ('The story &middot; '+i+' of '+(STORY_CH.length-1)))+'</p>'+
    '<h3 class="sty-h">'+c.title+'</h3>'+
    '<div class="sty-b">'+body+'</div>'+ foot + '</div>';
  veil.scrollTop = 0;
  var card = veil.firstChild; if(card) card.scrollTop = 0;
}

function act(name){
  if(name==="next"){ if(i<STORY_CH.length-1){ i++; render(); } else finish("tour"); }
  else if(name==="back"){ if(i>0){ i--; render(); } }
  else if(name==="skip"){ i = STORY_CH.length-1; render(); }
  else if(name==="close"){ finish("explore"); }
  else if(name==="tour"){ finish("tour"); }
  else if(name==="explore"){ finish("explore"); }
  else if(name==="quiet"){ finish("quiet"); }
  else if(name==="story"){ i = 1; render(); }
}

function finish(how){
  markSeen();
  close();
  if(!hasTut()) return;
  try{
    if(how==="tour")        window.TUT.start(0);
    else if(how==="quiet")  window.TUT.off();
    else                    window.TUT.explore();
  }catch(e){}
}

function close(){
  if(veil && veil.parentNode) veil.parentNode.removeChild(veil);
  veil = null;
  document.removeEventListener("keydown", onKey, true);
}

function onKey(e){
  if(!veil) return;
  var t=(document.activeElement||{}).tagName;
  if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT") return;
  if(e.key==="ArrowRight"){ e.preventDefault(); act("next"); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); act("back"); }
  else if(e.key==="Escape"){ e.preventDefault(); act("close"); }
}

function open(start){
  if(veil) close();
  i = (typeof start === "number") ? start : 0;
  veil = document.createElement("div");
  veil.className = "sty-veil";
  veil.addEventListener("click", function(ev){
    var b = ev.target.closest ? ev.target.closest("[data-do]") : null;
    if(b){ ev.preventDefault(); act(b.getAttribute("data-do")); return; }
    var d = ev.target.getAttribute && ev.target.getAttribute("data-g");
    if(d !== null && d !== undefined){ i = +d; render(); return; }
    if(ev.target === veil){ /* clicking the backdrop does nothing: this is a deliberate read */ }
  });
  document.body.appendChild(veil);
  render();
  document.addEventListener("keydown", onKey, true);
}

/* header entry point, so the story can be replayed at any time */
function injectPill(){
  if(document.getElementById("styPill")) return;
  var anchor = document.getElementById("tutPill");
  var b = document.createElement("button");
  b.id = "styPill"; b.className = "sty-pill";
  b.innerHTML = "\u{1F4D6} The story";
  b.title = "What this tool is and why it exists, in about two minutes";
  b.onclick = function(){ open(1); };
  if(anchor && anchor.parentNode){ anchor.parentNode.insertBefore(b, anchor); return; }
  var slot = document.getElementById("tutPillSlot") ||
             document.querySelector(".hdr-pills") || document.querySelector(".topin");
  if(slot) slot.insertBefore(b, slot.firstChild);
}

window.STORY = {
  willRun: willRun,
  open: open,
  replay: function(){ open(0); },
  close: close,
  chapters: STORY_CH
};

function boot(){
  injectPill();
  /* the tutorial layer may not have injected its pill yet; try once more next frame */
  requestAnimationFrame(injectPill);
  setTimeout(injectPill, 400);
  if(willRun) open(isNaN(at) ? 0 : Math.max(0, Math.min(STORY_CH.length-1, at)));
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
</script>

      <span class="tut-step">step ${cur+1} of ${TUT_STEPS.length}</span>
      <span style="flex:1"></span>
      <button class="tut-btn ghost" ${cur===0?"disabled":""} onclick="TUT.back()">‹ Back</button>
      <button class="tut-btn" onclick="TUT.next()">${cur===TUT_STEPS.length-1?"✓ Finish":"Next ›"}</button>
    </div>`;
  const cw=card.offsetWidth,ch=card.offsetHeight,gap=14;
  const vw=document.documentElement.clientWidth,vh=document.documentElement.clientHeight;
  let pos=s.pos||"bottom",x,y;
  if(pos==="right"&&r.right+gap+cw>vw-10)pos="bottom";
  if(pos==="left"&&r.left-gap-cw<10)pos="bottom";
  if(pos==="bottom"&&r.bottom+gap+ch>vh-10&&r.top-gap-ch>10)pos="top";
  if(pos==="top"&&r.top-gap-ch<10)pos="bottom";
  if(pos==="right"){x=r.right+gap;y=r.top;}
  else if(pos==="left"){x=r.left-gap-cw;y=r.top;}
  else if(pos==="top"){x=r.left;y=r.top-gap-ch;}
  else {x=r.left;y=r.bottom+gap;}
  x=Math.max(10,Math.min(x,vw-cw-10));y=Math.max(10,Math.min(y,vh-ch-10));
  card.style.left=x+"px";card.style.top=y+"px";
}
function endTour(finished){
  if(cur>=0){const s=TUT_STEPS[cur];if(s&&s.post){try{s.post();}catch(e){}}}
  cur=-1;
  [shield,halo,card].forEach(n=>{if(n)n.remove();});shield=halo=card=null;
  window.__tourTab=null;
  const top=document.querySelector(".top");if(top)top.classList.remove("tut-lift");
  if(typeof renderTabs==="function")renderTabs();
  schedule();
  if(finished&&on&&typeof toast==="function")toast("Tour done. Hints stay on: click any ? badge, or toggle 🎓 in the header.","ok");
}

/* ---------------- ambient hotspots ---------------- */
function clearSpots(){document.querySelectorAll(".tut-spot").forEach(n=>n.remove());}
function attachSpots(){
  clearSpots();
  if(!on||cur>=0)return;
  TUT_SPOTS.forEach(sp=>{
    if(sp.tab!=="*"&&sp.tab!==ST.tab)return;
    const t=tutFind(sp);if(!t)return;
    const r=t.getBoundingClientRect();if(!r.width&&!r.height)return;
    const b=N("button","tut-spot","?");
    b.title=sp.title+" (click for a hint)";b.dataset.sel=sp.sel;
    b.style.left=(window.scrollX+r.right-8)+"px";
    b.style.top=(window.scrollY+r.top-8)+"px";
    b.onclick=e=>{e.stopPropagation();openMini(sp,b);};
    document.body.appendChild(b);
  });
}
function repositionSpots(){  // sticky-header targets shift on page scroll
  document.querySelectorAll(".tut-spot").forEach(b=>{
    const t=document.querySelector(b.dataset.sel);if(!t){b.remove();return;}
    const r=t.getBoundingClientRect();
    b.style.left=(window.scrollX+r.right-8)+"px";
    b.style.top=(window.scrollY+r.top-8)+"px";
  });
}
/* debounce within a synchronous render chain, then re-attach immediately after it
   (microtask, not rAF, rAF stalls in background tabs and the renders here are sync) */
function schedule(){if(raf)return;raf=1;queueMicrotask(()=>{raf=0;attachSpots();});}

/* hotspot explainer card */
let mini=null;
function closeMini(){if(mini){mini.remove();mini=null;document.removeEventListener("click",closeMini);}}
function openMini(sp,anchor){
  closeMini();closeIntro();
  const idx=sp.tourStep!=null?TUT_STEPS.findIndex(s=>s.id===sp.tourStep):-1;
  mini=N("div","tut-mini",`
    <span class="tut-x" onclick="TUT.closeMini()">✕</span>
    <h4>${sp.title}</h4>
    <div class="tut-body">${sp.body}</div>
    ${idx>=0?`<div class="tut-foot"><span class="tut-link" onclick="TUT.tourFrom('${sp.tourStep}')">▶ Tour this area</span></div>`:""}`);
  mini.onclick=e=>e.stopPropagation();
  document.body.appendChild(mini);
  const r=anchor.getBoundingClientRect(),w=mini.offsetWidth;
  mini.style.left=Math.max(10,Math.min(window.scrollX+r.left,window.scrollX+document.documentElement.clientWidth-w-12))+"px";
  mini.style.top=(window.scrollY+r.bottom+8)+"px";
  setTimeout(()=>document.addEventListener("click",closeMini),0);
}

/* ---------------- tab intro cards ---------------- */
let intro=null;
function closeIntro(){if(intro){intro.remove();intro=null;}}
function showIntro(tab){
  if(!on||cur>=0||seenTabs.has(tab))return;
  const t=TUT_TABS.find(x=>x.tab===tab);if(!t)return;
  seenTabs.add(tab);closeIntro();
  intro=N("div","tut-intro",`
    <span class="tut-x" onclick="TUT.closeIntro()">✕</span>
    <div class="tut-kicker">🎓 ${t.title}</div>
    <div class="tut-body">${t.body}</div>
    <div class="tut-foot">
      <span class="tut-link" onclick="TUT.tourFrom('${t.step}')">▶ Tour this tab</span>
      <span style="flex:1"></span>
      <button class="tut-btn ghost" onclick="TUT.closeIntro()">Got it</button>
    </div>`);
  document.body.appendChild(intro);
}

/* ---------------- toggle + header pill ---------------- */
function setOn(v){
  on=v;try{localStorage.setItem(LS_KEY,v?"on":"off");}catch(e){}
  updatePill();
  if(!v){endTour(false);clearSpots();closeMini();closeIntro();}
  else attachSpots();
}
function updatePill(){
  const p=document.getElementById("tutPill");if(!p)return;
  p.className="tut-pill"+(on?"":" off");
  p.innerHTML="🎓 Tutorial "+(on?"ON":"OFF");
  p.title=on?"Tutorial mode is ON. Hotspots and tab intros are showing. Click to turn off.":"Tutorial mode is OFF. Click to turn hints back on.";
}
(function injectPill(){
  const slot=document.getElementById("tutPillSlot");   // new home: top-left of the crumbrow row
  const pills=slot||document.querySelector(".hdr-pills")||document.querySelector(".topin");if(!pills)return;
  const p=N("button","tut-pill");p.id="tutPill";
  p.onclick=()=>{setOn(!on);if(typeof toast==="function")toast(on?"Tutorial hints ON, ? badges mark every major area":"Tutorial hints off, toggle 🎓 anytime","");};
  if(slot)slot.appendChild(p); else pills.insertBefore(p,pills.firstChild);
  updatePill();
})();

/* ---------------- welcome modal (first run / restart) ---------------- */
function welcome(){
  closeMini();closeIntro();
  openModal(`
   <div class="mhead"><div><h2>👋 Welcome to the Publishing Engine</h2><div class="sub">What this tool is, in 30 seconds</div></div><div class="dclose" onclick="closeModal()">×</div></div>
   <div class="mbody">
     <p style="margin:0 0 10px">This is a <b>publishing engine</b>: it proposes ideas, sends each one to <b>Voice Studio</b> to be written in your voice, polishes the result for its <b>outlet</b> (blog, LinkedIn, or one you add), and posts it on schedule.</p>
     <p style="margin:0 0 10px">It never writes a sentence itself. The voice lives in one place; this tool owns what goes out, where, and when.</p>
     <p class="muted" style="margin:0 0 4px;font-size:12.5px">This prototype runs on sample data. Nothing posts anywhere and nothing leaves the browser, so click anything. The guided tour takes about three minutes and follows the real workflow in order.</p>
     <div class="btnrow" style="margin-top:16px">
       <button class="btn" onclick="closeModal();TUT.start()">▶ Take the guided tour</button>
       <button class="btn ghost" onclick="closeModal();TUT.explore()">Explore with hints on</button>
       <button class="btn gray" onclick="closeModal();TUT.off()">Turn tutorial off</button>
     </div>
   </div>`);
}
/* demo helper: open a piece that matches, so a workspace step always has something to point at */
function demoOpen(pred){
  try{
    const c=(typeof CONCEPTS!=="undefined"?CONCEPTS:[]).find(x=>!x.archived&&pred(x))||(typeof CONCEPTS!=="undefined"?CONCEPTS.find(x=>!x.archived&&x.started!==false):null);
    if(c&&(ST.tab!=="workspace"||ST.wsId!==c.id))openWorkspace(c.id);
  }catch(e){}
}


/* ---------------- hooks into the app (re-attach after renders / tab switches) ---------------- */
["render","renderToday","renderContent","renderWorkspace","renderSchedule","renderOutlets","renderImages"].forEach(fn=>{
  const o=window[fn];if(typeof o!=="function")return;
  window[fn]=function(){const r=o.apply(this,arguments);schedule();return r;};
});
const _go=window.go;
window.go=function(t){const r=_go.apply(this,arguments);closeMini();if(cur<0){closeIntro();showIntro(t);}schedule();return r;};

/* keyboard: ← → advance, Esc ends (only while the tour runs, never while typing) */
document.addEventListener("keydown",e=>{
  if(cur<0)return;
  const tag=(document.activeElement||{}).tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  if(e.key==="ArrowRight"){e.preventDefault();TUT.next();}
  else if(e.key==="ArrowLeft"){e.preventDefault();TUT.back();}
  else if(e.key==="Escape"){endTour(false);}
});
window.addEventListener("resize",()=>{if(cur>=0)place();schedule();});
window.addEventListener("scroll",()=>{if(cur>=0)place();else repositionSpots();},{passive:true});

/* ---------------- public API (used by inline onclick handlers) ---------------- */
window.TUT={
  toggle:()=>setOn(!on),
  start:()=>{if(!on)setOn(true);startTour(0);},
  explore:()=>{if(!on)setOn(true);seenTabs.delete(ST.tab);attachSpots();showIntro(ST.tab);},
  off:()=>setOn(false),
  welcome,
  next:()=>{cur===TUT_STEPS.length-1?endTour(true):goStep(cur+1);},
  back:()=>{if(cur>0)goStep(cur-1);},
  end:()=>endTour(false),
  tourFrom:id=>{const i=TUT_STEPS.findIndex(s=>s.id===id);if(i<0)return;if(!on)setOn(true);startTour(i);},
  closeMini,closeIntro
};

/* ---------------- boot ---------------- */
if(on)attachSpots();
/* The story layer owns the very first screen of a session: it opens the narrative
   "what is this and why" card, then hands off to this tour. Only fall back to the old
   welcome modal if the story layer is absent or has already been seen this session. */
if(window.STORY&&window.STORY.willRun){seenTabs.add(ST.tab);}
else if(firstRun){seenTabs.add(ST.tab);welcome();}   // welcome covers the first tab's intro
else if(on)showIntro(ST.tab);
})();
</script>
