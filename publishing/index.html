<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publishing Engine — PROTOTYPE (demo data)</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2330; --muted:#5b6675; --line:#e3e7ec;
  --accent:#3858c6; --accent-soft:#e9eefb; --teal:#0f8f74; --teal-soft:#e1f4ef;
  --amber:#9a6a00; --amber-soft:#fbf0d8; --red:#b4322b; --red-soft:#fbe9e7;
  --green:#2f7d32; --green-soft:#e7f3e8; --purple:#5b3fb5; --purple-soft:#ece7fb;
  --shadow:0 1px 2px rgba(18,28,45,.06),0 4px 14px rgba(18,28,45,.05);
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.topin{display:flex;align-items:center;gap:22px;padding:0 26px;max-width:1320px;margin:0 auto}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px;padding:15px 0 13px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:1px}
.brand .dot{color:var(--teal)}
.tabs{display:flex;gap:2px;align-self:stretch;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:7px;padding:0 12px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .tc{font-size:11px;font-weight:700;background:#eef1f5;color:var(--muted);border-radius:999px;padding:1px 7px}
.tab.active .tc{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}
.pipe{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.pipe b{color:var(--ink)}
.pipe .arr{color:#c2cad6}
/* settings gear + menu */
.gearwrap{position:relative}
.gearbtn{font-size:17px;line-height:1;color:var(--muted);border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;cursor:pointer}
.gearbtn:hover{color:var(--ink);border-color:#c8d2e8}
.gearbtn.active{color:var(--accent);border-color:#c4d0f0;background:var(--accent-soft)}
.gearmenu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 30px rgba(18,28,45,.16);padding:7px;min-width:214px;z-index:40;display:none}
.gearmenu.show{display:block}
.gearmenu .gmh{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:5px 9px 6px}
.gearmenu .gmi{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--ink);padding:8px 9px;border-radius:8px;cursor:pointer}
.gearmenu .gmi:hover{background:#f4f6f9}
.gearmenu .gmi.on{background:var(--accent-soft);color:var(--accent)}
.gearmenu .gmi .gi{width:18px;text-align:center;flex:0 0 auto}
.gearmenu .gmi .tc{margin-left:auto;font-size:11px;font-weight:700;background:#eef1f5;color:var(--muted);border-radius:999px;padding:1px 7px}
/* ---- main ---- */
.main{padding:24px 26px 80px;max-width:1320px;margin:0 auto}
h1{font-size:22px;margin:0 0 3px}
.lede{color:var(--muted);margin:0 0 18px;max-width:80ch}
.view{display:none}
.view.show{display:block}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 3px;font-size:15px}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:960px){.grid2,.grid3{grid-template-columns:1fr}}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow)}
.kpi b{font-size:24px;display:block;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.tealk b{color:var(--teal)} .kpi.acck b{color:var(--accent)}
.kpi.grnk b{color:var(--green)} .kpi.redk b{color:var(--red)}
.kpi.purk b{color:var(--purple)} .kpi.ambk b{color:var(--amber)}
/* buttons */
.btn{font:inherit;font-weight:600;font-size:13px;border-radius:9px;padding:8px 15px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.teal{background:var(--teal);border-color:var(--teal)}
.btn.teal.ghost{background:#fff;color:var(--teal)}
.btn.gray{background:#fff;color:var(--muted);border-color:var(--line)}
/* unsaved-changes state on a Save button — the button IS the saved-state indicator */
.btn.dirty{background:var(--amber-soft);color:var(--amber);border-color:#e6cf9e;font-weight:700}
.btn.amber{background:var(--amber);border-color:var(--amber)}
.btn.purple{background:var(--purple);border-color:var(--purple)}
.btn.purple.ghost{background:#fff;color:var(--purple)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.red.ghost{background:#fff;color:var(--red);border-color:#f2cfca}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
/* toolbar */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{font:inherit;font-size:12.5px;font-weight:600;border:0;background:#fff;color:var(--muted);padding:7px 13px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg button+button{border-left:1px solid var(--line)}
input[type=text],input[type=search],select,textarea{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--ink);background:#fff}
input[type=search]{min-width:230px}
textarea{width:100%;resize:vertical;line-height:1.55}
label.fld{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;margin:0 0 5px}
/* pills */
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid;line-height:1.5}
.p-grn{color:var(--green);background:var(--green-soft);border-color:#c7e3c8}
.p-amb{color:var(--amber);background:var(--amber-soft);border-color:#ecd9a8}
.p-red{color:var(--red);background:var(--red-soft);border-color:#f2cfca}
.p-acc{color:var(--accent);background:var(--accent-soft);border-color:#d4ddf7}
.p-teal{color:var(--teal);background:var(--teal-soft);border-color:#c5e8df}
.p-pur{color:var(--purple);background:var(--purple-soft);border-color:#d8cdf3}
/* content-TYPE tag — a clear, filled little label so blog vs LinkedIn reads at a glance */
.tbadge{display:inline-flex;align-items:center;gap:5px;font-size:8.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:1px 5px;border-radius:4px;border:1px solid;line-height:1.5;white-space:nowrap;vertical-align:middle;flex:0 0 auto}
.tbadge.blog{color:#fff;background:var(--accent);border-color:var(--accent)}
.tbadge.li{color:#fff;background:var(--purple);border-color:var(--purple)}
.tbadge.neutral{color:var(--muted);background:#f1f3f7;border-color:#e2e6ee}
.tbadge.sm{font-size:8px;padding:0.5px 4px}
.p-gray{color:var(--muted);background:#eef1f5;border-color:var(--line)}
.tag{display:inline-block;font-size:10.5px;color:var(--muted);background:#eef1f5;border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin:1px 3px 1px 0}
.muted{color:var(--muted)} .tnum{font-variant-numeric:tabular-nums}
/* guide / banner (feature notes live here) */
.guide{border:1px solid #d4ddf7;background:#fbfcff;border-radius:11px;padding:13px 15px;margin:0 0 18px;font-size:13px;color:var(--muted);display:flex;gap:11px}
.guide.teal{border-color:#c5e8df;background:#f6fdfb}
.guide.purple{border-color:#d8cdf3;background:#faf8ff}
.guide.amber{border-color:#ecd9a8;background:var(--amber-soft)}
.guide b{color:var(--ink)}
.guide .ic{font-size:18px;flex:0 0 auto}
/* concept cards */
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.ccard.li{border-left:3px solid var(--purple)}
.ccard .chd{display:flex;align-items:flex-start;gap:9px}
.ccard .tico{font-size:16px;flex:0 0 auto;margin-top:1px}
.ccard .ctitle{font-weight:600;font-size:14.5px;line-height:1.35;flex:1}
.ccard .cmeta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted)}
.ccard .cangle{font-size:12.5px;color:var(--muted);line-height:1.45}
.ccard .cactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.dedupnote{font-size:11.5px;color:var(--teal);background:var(--teal-soft);border:1px solid #c5e8df;border-radius:7px;padding:5px 9px}
.dedupnote.overlap{color:var(--amber);background:var(--amber-soft);border-color:#ecd9a8}
/* inline angle / POV editor on neutral (unstarted) cards */
.pickangle label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;margin:0 0 4px}
.pickangle label span{text-transform:none;letter-spacing:0;font-weight:400}
.pickangle textarea{width:100%;font-size:12.5px;min-height:38px;line-height:1.45}
/* All Content: main column + sticky right calendar rail (mirrors :8793) */
.ccwrap{display:flex;gap:20px;align-items:flex-start}
.ccmain{flex:1;min-width:0}
.ccside{width:250px;flex:none}
@media(max-width:920px){.ccwrap{display:block}.ccside{width:auto;margin-top:18px}}
.ag-inner{position:sticky;top:68px}
.ag-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
.ag-sec{margin-bottom:16px}
.ag-h{font-size:11px;font-weight:600;color:var(--muted);margin:0 0 7px;opacity:.85}
.ag-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:7px;cursor:pointer;box-shadow:var(--shadow)}
.ag-card:hover{border-color:var(--accent)}
.ag-day{font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.ag-line{display:flex;align-items:flex-start;gap:6px}
.ag-ti{font-size:12px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ag-t{font-size:11px;flex:none;line-height:1.3}
.ag-t.li{background:#0a66c2;color:#fff;border-radius:4px;font-weight:700;font-size:9.5px;padding:1px 4px;letter-spacing:.5px;line-height:1.5}
.ag-empty{font-size:11.5px;color:var(--muted);opacity:.7;padding:2px 0}
/* readiness bar */
.readybar{display:flex;align-items:center;gap:5px}
.readydot{width:20px;height:6px;border-radius:999px;background:#e0e4ea}
.readydot.on{background:var(--green)}
.readytxt{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.readytxt.done{color:var(--green)}
/* table */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#fafbfc;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);position:sticky;top:0;z-index:2}
tbody tr:hover{background:#f7f9fc}
.linkish{color:var(--accent);cursor:pointer}
.linkish:hover{text-decoration:underline}
.scorebadge{display:inline-block;min-width:30px;text-align:center;font-weight:700;font-size:12px;border-radius:6px;padding:2px 7px}
/* score meter */
.smeter{display:inline-block;width:54px;height:7px;border-radius:999px;background:#eef1f5;overflow:hidden;vertical-align:middle;margin-right:6px}
.smeter i{display:block;height:100%;background:var(--accent)}
/* toast */
#toast{position:fixed;bottom:22px;left:22px;z-index:80;display:flex;flex-direction:column;gap:8px}
.to{background:var(--ink);color:#fff;padding:10px 15px;border-radius:9px;font-size:13px;box-shadow:0 6px 20px rgba(18,28,45,.25);animation:tin .2s}
.to.ok{background:#1f5e34} .to.warn{background:#7c5300}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
/* modal */
.modalwrap{position:fixed;inset:0;background:rgba(18,28,45,.34);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:56px 20px;overflow:auto}
.modalwrap.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:600px;width:100%;box-shadow:0 22px 60px rgba(18,28,45,.28);animation:tin .16s}
.modal.wide{max-width:900px}
.modal .mhead{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.modal .mhead h2{margin:0;font-size:18px} .modal .mhead .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.modal .mbody{padding:16px 20px 22px}
.dclose{margin-left:auto;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;background:none;border:0}
/* ===== workspace ===== */
.wsbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 16px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);position:sticky;top:52px;z-index:20}
.wsbar .wsback{font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 11px;background:#fff}
.wsbar .wsback:hover{color:var(--ink);border-color:#c8d2e8}
.wsbar .wstitle{font-weight:700;font-size:16px;flex:1;min-width:200px}
/* click-to-rename: a dotted underline is the only affordance that fits the bar without
   turning the title into a button. The input keeps the same weight so nothing jumps. */
.wsbar .wstitleed{cursor:text;border-bottom:1px dashed transparent;padding-bottom:1px}
.wsbar .wstitleed:hover{border-bottom-color:var(--muted)}
.wsbar .wstitlein{font-weight:700;font-size:16px;padding:4px 8px;border:1.5px solid var(--accent);
  border-radius:7px;background:var(--panel);color:var(--ink);font-family:inherit}
.wsbar .wstitlein::placeholder{font-weight:400;color:var(--muted)}
.wsec{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 16px;box-shadow:var(--shadow);overflow:hidden}
.wsec .wsh{display:flex;align-items:center;gap:11px;padding:14px 17px;border-bottom:1px solid var(--line);background:#fafbfc}
.wsec .wsnum{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.wsec.done .wsnum{background:var(--green-soft);color:var(--green)}
.wsec .wsh h3{margin:0;font-size:14.5px;flex:1}
.wsec .wsh .wsub{font-size:11.5px;color:var(--muted);font-weight:400}
.wsbody{padding:16px 17px}
.approvetog{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;background:#fff;white-space:nowrap}
.approvetog:hover{border-color:#c8d2e8}
.approvetog.on{color:var(--green);border-color:#c7e3c8;background:var(--green-soft)}
.approvetog .bx{width:15px;height:15px;border-radius:4px;border:1.5px solid #c2cad6;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.approvetog.on .bx{background:var(--green);border-color:var(--green);color:#fff}
/* over the LinkedIn character limit: approval is refused, and it says so */
.approvetog.blocked{color:var(--red);border-color:#f0c4bb;background:#fdf3f1;cursor:not-allowed}
.approvetog.blocked .bx{border-color:#e6a89c}
.approvetog.blocked .bx::after{content:"✕";font-size:10px;color:var(--red)}
/* can't-miss banner on a post the publisher refused (or that still can't fit) */
.fixbanner{display:flex;gap:12px;align-items:flex-start;background:#fdf3f1;border:1px solid #f0c4bb;
  border-left:4px solid var(--red);border-radius:10px;padding:13px 15px;margin-bottom:14px;font-size:13.5px;line-height:1.5}
.fixbanner .fbi{font-size:19px;line-height:1.2}
.fixbanner .fbsub{color:var(--muted);font-size:12.5px;margin-top:4px}
.overred{color:var(--red)}
/* markdown editor */
.mdtool{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:7px;align-items:center}
.mdtool button{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:6px;padding:4px 9px;cursor:pointer;min-width:28px}
.mdtool button:hover{border-color:#c8d2e8;color:var(--ink)}
.mdta{width:100%;min-height:340px;font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.predir{margin:0 0 12px;padding:12px 14px;background:var(--accent-soft);border:1px solid #d4ddf7;border-radius:10px}
.predirlbl{display:block;font-size:12.5px;font-weight:700;color:var(--accent);margin:0 0 7px}
.predirlbl .muted{font-weight:500}
.predirta{width:100%;box-sizing:border-box;min-height:52px;resize:vertical;background:#fff;border-color:#c4d0f0}
.mdprev{min-height:340px;border:1px solid var(--line);border-radius:9px;padding:6px 20px;background:#fff;font-size:14.5px;line-height:1.65}
.mdprev h1{font-size:23px;margin:.5em 0 .3em} .mdprev h2{font-size:18px;margin:1.1em 0 .3em} .mdprev h3{font-size:15px}
.mdprev a{color:var(--accent)} .mdprev blockquote{border-left:3px solid var(--line);margin:.6em 0;padding:.1em 0 .1em 14px;color:var(--muted)}
.mdkey{font-size:12px;color:var(--muted);background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-top:8px}
.mdkey code{background:#eef1f5;border-radius:4px;padding:1px 5px;font-size:11.5px}
.warnstrip{border:1px solid #ecd9a8;background:var(--amber-soft);color:var(--amber);border-radius:9px;padding:9px 13px;font-size:12.5px;margin-bottom:11px;display:flex;gap:8px;align-items:flex-start}
.revnote{border-radius:9px;padding:8px 12px;font-size:12.5px;margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.revnote.ok{border:1px solid #c7e3c8;background:var(--green-soft);color:var(--green)}
.revnote.warn{border:1px solid #ecd9a8;background:var(--amber-soft);color:var(--amber)}
.verpick{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.verpick select{font-size:12px;padding:4px 8px}
.wordcount{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.charcount{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.charcount.over{color:var(--red);font-weight:700}
/* SEO option rows */
.optrow{border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:9px;cursor:pointer;background:#fff}
.optrow:hover{border-color:#c8d2e8}
.optrow.pick{border-color:var(--accent);background:var(--accent-soft)}
.optrow .ot{font-weight:600;font-size:13.5px}
.optrow .om{font-size:12px;color:var(--muted);margin-top:3px}
.optrow .oc{font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
/* image pipeline */
.imgsteps{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.imgstep{flex:1;min-width:150px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12px;background:#fff}
.imgstep .st{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
.imgstep.done{border-color:#c7e3c8;background:var(--green-soft)}
.imgstep.active{border-color:var(--accent);background:var(--accent-soft)}

   This file is the REAL Publishing Engine UI (index.html, verbatim) running with

(function(){

Most owners already know this one is coming. They just have not sat down and done the arithmetic.

## The number that moves first

${a}. That is the whole argument, and the rest of this piece is what to do about it this quarter.

- Keep the timesheet as a capacity signal, not a pricing input.

None of this is a tooling problem. The tools are cheap and everyone has them. It is a decision problem, and the firms that make the decision on purpose are the ones that keep the margin.

      case "publish":{if(outletOf(c).poster!=="wordpress")return {ok:false,error:"The "+outletOf(c).name+" outlet does not publish to WordPress."};

        c.wp_state=past?"live":"scheduled";if(past)c.status="published";return {ok:true,status:past?"publish":"future",url:c.wp_url,concept:c};}
      case "post_linkedin":{if(outletOf(c).poster!=="unipile_linkedin")return {ok:false,error:"The "+outletOf(c).name+" outlet does not post through LinkedIn."};
        c.li_state="posted";c.li_url="https://www.linkedin.com/feed/update/urn:li:activity:demo"+c.id+"/";return {ok:true,url:c.li_url,chars:(c.li_text||"").length+(c.li_extra||0),concept:c};}
      case "post_now":{const p=outletOf(c).poster;
        if(p==="wordpress")return handle("/api/concept/"+c.id+"/publish",method,body);
        if(p==="unipile_linkedin")return handle("/api/concept/"+c.id+"/post_linkedin",method,body);

        c.li_state="posted";c.li_url=(body.url||"").trim()||null;return {ok:true,concept:c};}
      default: return OK;
    }
  }
  return OK;
}

  let data;try{data=handle(path,(init&&init.method)||"GET",body);}catch(e){data={ok:false,error:"demo backend: "+e.message};}
  const status=(data&&data.ok===false)?400:200;
  const delay=/vs_status|publisher|bootstrap/.test(path)?0:180;   // a beat, so buttons visibly work
  return new Promise(res=>setTimeout(()=>res(new Response(JSON.stringify(data),{status,headers:{"Content-Type":"application/json"}})),delay));
};

/* Fully approved AND actually sendable. The length check is deliberately part of readiness,
   not just of approval: an over-limit post must never reach the schedule board by any route
   (approve, switch type, restore from archive), because from there it fails in silence. */
function isReady(c){

/* Is there actually anything to publish? Reads the LIVE editor when this piece is open, so an

   ready, drop it on a day -- and only the publisher ever objected, half an hour later, with
   "No LinkedIn version to post". That is the failure this closes. */
function hasWritten(c){
  if(!c)return false;
  if(isPost(c))return !!liTextOf(c).trim();

}

Your retainer still bills for a level of effort that AI quietly deleted six months ago. The client hasn't noticed. Your margin has.

## The number that should worry you

If a deliverable that took 14 hours now takes 4, and you still bill 14, you have not made a 71% margin. You have made a **liability** — the gap between what you charge and what you do, sitting on your invoice, waiting for a procurement team to find it.

The agencies pulling ahead are not the ones with the best prompts. They are the ones who [rebuilt the operating model](https://example.com/insights/operating-model-is-the-product) so the price maps to outcomes, not hours.

## What to do this quarter

- Reprice one retainer around a **result**, not a scope of tasks.
- Kill the timesheet as a pricing input. Keep it only as a capacity signal.
- Publish a value narrative your buyer can repeat internally.

This is uncomfortable because it exposes how much of your pricing was labor arbitrage. That is exactly why it is the moat.`;

/* ---- persistence (Phase 2): mirror local state changes to the v2 API. Local
   updates stay optimistic (snappy); POST persists to content_engine.db. Publish
   state is NOT sent from here — publishing is a later phase. ---- */
async function apiPost(path,body){
  try{
    const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
    const j=await r.json().catch(()=>({}));
    /* j.message is the human sentence (e.g. the LinkedIn over-limit refusal); j.error is the code */
    if(!r.ok||j.ok===false){toast(j.message||("Save failed: "+(j.error||r.status)),"warn");return null;}
    return j;
  }catch(e){toast("Save failed (server offline?)","warn");return null;}
}

/* ---- tiny markdown renderer (mirrors mdRender in concept_explorer.py) ---- */
function mdRender(src){
  const lines=(src||"").split("\n");let html="",inList=false;
  const inline=s=>esc(s)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/\*([^*]+)\*/g,"<i>$1</i>");
  for(let ln of lines){
    if(/^### /.test(ln)){html+="<h3>"+inline(ln.slice(4))+"</h3>";continue;}
    if(/^## /.test(ln)){html+="<h2>"+inline(ln.slice(3))+"</h2>";continue;}
    if(/^# /.test(ln)){html+="<h1>"+inline(ln.slice(2))+"</h1>";continue;}
    if(/^> /.test(ln)){html+="<blockquote>"+inline(ln.slice(2))+"</blockquote>";continue;}
    if(/^[-*] /.test(ln)){if(!inList){html+="<ul>";inList=true;}html+="<li>"+inline(ln.slice(2))+"</li>";continue;}
    if(inList){html+="</ul>";inList=false;}
    if(ln.trim()==="")continue;
    html+="<p>"+inline(ln)+"</p>";
  }
  if(inList)html+="</ul>";
  return html;
}

/* ---- deep-linkable URLs (hash routing) ---------------------------------------------------
   Every section and every open article/LinkedIn workspace gets its own #hash, so the browser
   Back/Forward buttons, bookmarks, and opening pages in separate tabs all work. Nav still flows
   through go()/openWorkspace(); those now stamp the hash, and a hashchange listener replays a
   hash back into app state (for Back/Forward and hand-typed/pasted URLs).                     */
const ROUTE_TABS=["today","content","images","schedule","feed","sources","strategy","insights","outlets"];
const TAB_TITLE={today:"Today's Concepts",content:"All Content",images:"Featured images",schedule:"Schedule",
  feed:"Feed",sources:"Sources",strategy:"Strategy",insights:"Insights catalog",outlets:"Outlets"};
function hashFor(){
  if(ST.tab==="workspace"&&ST.wsId!=null)return "#article/"+ST.wsId;
  return "#"+ST.tab;
}
function titleFor(){
  if(ST.tab==="workspace"){const c=currentConcept();return (c&&c.title?c.title:"Workspace")+" · Publishing Engine";}
  return (TAB_TITLE[ST.tab]||"Publishing Engine")+" · Publishing Engine";
}
function syncHash(){
  const h=hashFor();
  if(location.hash!==h)location.hash=h;   // assigning a new hash pushes a history entry → Back/Forward work
  document.title=titleFor();
}
function applyHash(){
  const raw=decodeURIComponent((location.hash||"").replace(/^#/,""));
  if(!raw){go("today");return;}
  const m=raw.match(/^article\/(\d+)$/);
  if(m){const id=+m[1];
    if(CONCEPTS.find(c=>c.id===id))openWorkspace(id);
    else{toast("That article no longer exists","warn");go("content");}
    return;}
  if(ROUTE_TABS.includes(raw))go(raw); else go("today");
}
/* Back/Forward or a manual hash edit: replay it — unless the hash already reflects current state
   (which happens when WE just set it in syncHash), in which case do nothing to avoid a loop. */
window.addEventListener("hashchange",()=>{if(location.hash!==hashFor())applyHash();});
function render(){
  renderTabs();
  if(ST.tab==="today")renderToday();
  else if(ST.tab==="content")renderContent();
  else if(ST.tab==="workspace")renderWorkspace();
  else if(ST.tab==="schedule")renderSchedule();
  else if(ST.tab==="feed")renderFeed();
  else if(ST.tab==="sources")renderSources();
  else if(ST.tab==="strategy")renderStrategy();
  else if(ST.tab==="images")renderImages();
  else if(ST.tab==="insights")renderInsights();
  else if(ST.tab==="outlets")renderOutlets();
}

async function outletSave(slug,btn){
  const o=OUTLETS[slug];if(!o)return;
  const g=id=>{const el=$(id);return el?el.value:"";};
  const body=Object.assign({},o,{name:g("ol_name_"+slug).trim()||o.name,short:g("ol_short_"+slug).trim()||o.short,
    voice_context:g("ol_ctx_"+slug),char_limit:o.format==="longform"?null:(g("ol_lim_"+slug)||null),
    default_time:g("ol_time_"+slug)||"07:00",color:g("ol_color_"+slug)||o.color,poster:g("ol_poster_"+slug)||o.poster,icon:g("ol_icon_"+slug)||o.icon});
  if(btn){btn.disabled=true;btn.textContent="Saving…";}
  const r=await apiPost("/api/outlet/save",body);
  if(btn){btn.disabled=false;btn.textContent="Save";}
  if(!r||!r.outlets)return;
  OUTLETS={};r.outlets.forEach(x=>OUTLETS[x.slug]=x);
  render();toast("Outlet saved","ok");
}
async function outletAdd(btn){
  const g=id=>{const el=$(id);return el?el.value:"";};
  const name=g("ol_new_name").trim();if(!name){toast("Give the outlet a name","warn");return;}
  const fmt=g("ol_new_format");
  const body={slug:name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),name:name,short:g("ol_new_short").trim()||name,
    plural:name+"s",format:fmt,voice_context:g("ol_new_ctx"),char_limit:fmt==="longform"?null:(g("ol_new_lim")||null),
    poster:"manual",icon:g("ol_new_icon")||"•",color:g("ol_new_color")||"#0f8f74",
    pieces:fmt==="longform"?["content","seo","image"]:["content"],polish:fmt==="longform"?["seo","featured_image"]:["length"],
    default_time:"07:00",sort:100+Object.keys(OUTLETS).length};
  if(OUTLETS[body.slug]){toast("There is already an outlet called "+body.slug,"warn");return;}
  if(btn){btn.disabled=true;btn.textContent="Adding…";}
  const r=await apiPost("/api/outlet/save",body);
  if(btn){btn.disabled=false;btn.textContent="Add outlet";}
  if(!r||!r.outlets)return;
  OUTLETS={};r.outlets.forEach(x=>OUTLETS[x.slug]=x);
  render();toast("Outlet added: "+name+". It now shows up in Create, the filters and the calendar.","ok");
}
async function outletArchive(slug,arch){
  const r=await apiPost("/api/outlet/"+slug+(arch?"/archive":"/unarchive"),{});
  if(!r||!r.outlets)return;
  const keep=OUTLETS[slug];OUTLETS={};r.outlets.forEach(x=>OUTLETS[x.slug]=x);
  if(arch&&keep&&!OUTLETS[slug]){keep.archived=true;OUTLETS[slug]=keep;}
  render();toast(arch?"Outlet archived":"Outlet restored","ok");
}

function readyBarHTML(c){

/* ---- "is it already out the door?" -------------------------------------------------------
   Only the WordPress publisher writes status='published' (publish.py). Posting to LinkedIn
   records li_post_id but LEAVES status='ready' — so every LinkedIn post that has actually gone
   live used to sit in the working pool forever and inflate every count/filter. Treat anything
   live on either channel as published, whatever the stored status says.                        */
function isLive(c){return c.status==="published"||c.li_state==="posted"||c.wp_state==="live";}
/* Which All-Content stage chip an item belongs under (archived handled separately). */
function contentStageOf(c){
  if(isLive(c))return "published";
  if(c.status==="ready")return "ready";
  if(c.status==="picked"||c.status==="drafted")return "progress";
  return null;   /* new / deferred / dismissed — only visible under the "All" chip */
}
/* ---- LinkedIn 3,000-char limit -------------------------------------------------
   The number that matters is the COMPOSED length: what's in the editor PLUS the
   "Read more: <article>\n<url>" block the system appends at post time for a post
   repurposed from a blog article (c.li_extra, computed server-side). Counting only
   the textarea is exactly how #230 and #242 read 2,863/2,884 here, went out at
   3,001/3,101, and failed every 30-minute publish tick for two weeks while still
   showing a green "Ready". Nothing may approve or schedule a post that doesn't fit. */
const LI_LIMIT=3000;
function liLimit(c){const o=outletOf(c);return o.char_limit||Infinity;}   /* no limit = never over */
/* live text if this concept's editor is open and dirty, else what's saved */
/* TRAP (found 2026-09-03): while a workspace re-renders, the PREVIOUS piece's textarea is
   still in the DOM, so "is the editor open for this piece" must check the textarea's own
   data-cid, not just ST.wsId. Jumping article -> its LinkedIn child used to measure the
   article body and flag the post "3,322 over" on arrival. */
function liveEditor(c,kind){const el=$("ws_body");
  return (el&&ST.wsId===c.id&&el.dataset.cid===String(c.id)&&el.dataset.kind===kind)?el:null;}
function liTextOf(c){const el=liveEditor(c,"linkedin");
  return el?el.value:(c.li_text||"");}
function liChars(c,text){return (text!=null?text:liTextOf(c)).length+(c.li_extra||0);}
function liOver(c,text){return liChars(c,text)-liLimit(c);}
/* A LinkedIn post the system already tried and refused to send, or one that can't fit.
   Unlike isOverdue this does NOT depend on a schedule slot, so pulling it off the
   calendar doesn't hide the problem — it stays flagged in All Content until fixed. */
function needsFix(c){
  if(isLive(c)||c.archived||!isPost(c))return false;
  return !!c.li_error||liOver(c)>0;
}
function fixReason(c){
  if(c.li_error)return c.li_error;
  const o=liOver(c);
  return o>0?`This post is ${liChars(c).toLocaleString()} characters, ${o.toLocaleString()} over the ${liLimit(c).toLocaleString()} limit.`:"";
}
/* ---- publisher-cycle timing ------------------------------------------------------
   Nothing here posts the moment you schedule it. A separate 30-minute runner picks up
   whatever is due and fires it on its next tick, so a 2:00 post goes out at 2:15. These
   turn that into a real clock time the card can show ("goes out by 2:15 PM") instead of
   the board pretending the work already happened. */
function schedDT(c){
  if(!c.planned_date)return null;
  const d=new Date(`${c.planned_date}T${(c.planned_time||"07:00")}:00`);
  return isNaN(d)?null:d;
}
function pubInterval(){return (PUBLISHER&&PUBLISHER.interval_min)||30;}
function pubNextTick(){
  const n=PUBLISHER&&PUBLISHER.next_run?new Date(PUBLISHER.next_run):null;
  return (n&&!isNaN(n))?n:null;
}
/* The runner tick that will actually send this item: the first tick at or after its
   scheduled time. Null when we can't read the runner's schedule — callers must then say
   "I can't tell you when" rather than invent a time. */
function goesOutAt(c){
  const next=pubNextTick(),due=schedDT(c);
  if(!next||!due)return null;
  if(due<=next)return next;
  const step=pubInterval()*60000;
  return new Date(next.getTime()+Math.ceil((due-next)/step)*step);
}
function fmtClock(d){return d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});}
function fmtWhen(d){
  return d.toDateString()===new Date().toDateString()
    ? fmtClock(d)
    : d.toLocaleDateString([],{weekday:"short"})+" "+fmtClock(d);
}
/* Scheduled to go out, the moment has passed, and it never posted → it's stuck, not "Ready".
   BUT the gap between "its time arrived" and "the runner's next tick" is normal waiting, not a
   failure — flagging that as "Didn't post" is what made a perfectly healthy queued post look
   broken. Only call it overdue once the tick that should have carried it has come and gone
   (plus one interval of slack), or when the server recorded an actual error. */
function isOverdue(c){
  if(isLive(c)||c.archived||c.status!=="ready"||!c.planned_date)return false;
  if(`${c.planned_date} ${c.planned_time||"07:00"}` >= isoNow())return false;
  if(c.li_error||c.publish_error)return true;
  const t=goesOutAt(c);
  if(t&&Date.now()<t.getTime()+pubInterval()*60000)return false;   // still inside the window
  return true;
}
function isoNow(){const d=new Date(),p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function statusPill(c){
  const map={new:["p-acc","New"],picked:["p-amb","In progress"],drafted:["p-amb","Drafting"],ready:["p-grn","Ready"],
    published:["p-teal","Published"],deferred:["p-gray","Deferred"],dismissed:["p-red","Dismissed"]};
  const key=isLive(c)?"published":c.status;
  const[cls,lab]=map[key]||["p-gray",c.status];
  return `<span class="pill ${cls}">${lab}</span>`;
}

/* "+ New article" / "+ New LinkedIn post" (2026-08-28): start a piece from scratch.
   No modal, no idea framing, nothing generated — it creates an empty item of that type and
   opens its workspace, where he can paste his own text OR hit Generate. Before this the only
   route to a LinkedIn post was to add an IDEA and then generate it, which is the wrong shape
   when you just want to write a post: "it's not so much create an idea, it's just create a post". */
function isUntitled(c){return !c||!c.title||c.title.trim()===""||c.title.trim()===untitledFor(c.outlet)||/^Untitled (article|LinkedIn post|linkedin post)$/.test(c.title.trim());}
async function newPiece(slug){
  const o=outletByAny(slug);

  if(!r||!r.concept)return;
  snapshot("New "+o.name);

  setTimeout(()=>{const el=$("ws_title_in");if(el){el.focus();el.select();}},60);
}

}
function pickIdeaMode(btn){
  [...btn.parentNode.children].forEach(b=>b.classList.remove("on"));btn.classList.add("on");
  const written=btn.dataset.m==="written";ST._newMode=btn.dataset.m;
  $("ai_written").style.display=written?"":"none";
  /* brief+angle stay available in written mode — they still feed SEO, the LinkedIn version and
     any later revise — but they're optional and out of the way, so collapse them. */
  $("ai_ideaflds").style.display=written?"none":"";
  $("ai_go").textContent=written?"Add it":"Create";
  $("ai_guide").innerHTML=written
    ? `<span class="ic">✍</span><div>Your text goes in <b>exactly as written</b> — no model call, no cost, nothing rewritten. It opens in the workspace where you can edit it, revise it with a prompt, or run self-review if you want a second opinion.</div>`
    : `<span class="ic">↪</span><div>An idea lands in <b>All Content</b> as a neutral concept; you pick its outlet there and write it in Voice Studio.</div>`;
  const ta=$("ai_content");
  if(written&&ta){ta.oninput=()=>{const n=(ta.value.trim().match(/\S+/g)||[]).length;$("ai_cwc").textContent=n.toLocaleString()+" words";};ta.focus();}
}
function pickType(btn){[...btn.parentNode.children].forEach(b=>b.classList.remove("on"));btn.classList.add("on");ST._newType=btn.dataset.t;}
async function createIdea(){
  const t=$("ai_t").value.trim();if(!t){toast("Give it a title","warn");return;}
  const type=ST._newType||(outletList()[0]||{}).slug||"blog";const newO=outletByAny(type);
  const written=ST._newMode==="written";
  const content=written?($("ai_content").value||"").trim():"";
  if(written&&!content){toast("Paste your content, or switch to “Just the idea”","warn");return;}
  const btn=$("ai_go"),old=btn?btn.textContent:"";
  if(btn){btn.disabled=true;btn.textContent="Saving…";}
  /* Idea mode: created NEUTRAL server-side (pick-then-choose-type model).
     Written mode: the server also stores the content and locks the type, so it arrives started. */
  const r=await apiPost("/api/concepts/add",{outlet:newO.slug,content_type:newO.legacy_type,title:t,
    excerpt:written?"":$("ai_brief").value,angle:written?"":$("ai_a").value,
    pillar:$("ai_p").value,status:"picked",content:content});
  if(btn){btn.disabled=false;btn.textContent=old;}
  if(!r||!r.concept)return;
  snapshot(written?"Add written piece":"Add idea");
  CONCEPTS.unshift(r.concept);closeModal();go("content");
  if(written){
    /* Never claim the text saved when it didn't — the concept survives either way. */
    if(r.content_error){toast("Added, but your text didn't save: "+r.content_error,"warn");}
    else{toast("Added your "+lcName(newO)+" → opening workspace","ok");}
    openWorkspace(r.concept.id);
  }else{
    toast("Idea added → choose its outlet in All Content","ok");
  }
}

/* real "today" in LOCAL time (not toISOString, which is UTC and flips the date
   after ~8pm ET). Computed per call so a long-open tab rolls over at midnight. */
function todayISO(){const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function conceptStarted(c){return !(c.status==="picked"&&c.started===false);}
function startAs(id,slug){
  const o=outletByAny(slug);
  snapshot("Create "+o.name);
  const c=CONCEPTS.find(x=>x.id===id);
  c.outlet=o.slug;c.type=o.legacy_type;c.format=o.format;c.started=true;
  if(isPost(c)){c.approved_content=false;c.li_text=c.li_text||"";}  /* hashtags are opt-in — never auto-added (2026-07-10) */
  else{c.approved_content=false;c.approved_seo=!!c.approved_seo;c.approved_image=!!c.approved_image;c.drafts=c.drafts||[];}
  persist(id,{outlet:o.slug,started:true});
  render();toast("Started as "+o.name+" → opening workspace","ok");openWorkspace(id);
}
function saveAngle(id){
  const ta=$("pang_"+id);if(!ta)return;
  snapshot("Save brief & angle");const c=CONCEPTS.find(x=>x.id===id);
  const br=$("pbrief_"+id);if(br)c.excerpt=br.value.trim();c.angle=ta.value.trim();
  persist(id,{excerpt:c.excerpt||"",angle:c.angle});renderContent();toast("Brief & angle saved","ok");
}
/* sticky right rail: everything with a spot on the publish calendar */
function fmtAgendaDay(iso){
  const[y,m,d]=String(iso).slice(0,10).split("-").map(Number);if(!y||!m||!d)return iso;
  const dt=new Date(Date.UTC(y,m-1,d));
  const dow=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt.getUTCDay()];
  const mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1];
  return dow+" "+mo+" "+d;
}
function agendaRail(){
  const ag=CONCEPTS.filter(c=>c.planned_date&&["ready","published"].includes(c.status))
    .sort((a,b)=>((a.planned_date+(a.planned_time||""))<(b.planned_date+(b.planned_time||"")))?-1:1);
  const today=todayISO();
  const up=ag.filter(c=>String(c.planned_date).slice(0,10)>=today);
  const recent=ag.filter(c=>String(c.planned_date).slice(0,10)<today).slice(-6).reverse();
  const row=c=>{
    return `<div class="ag-card" onclick="openWorkspace(${c.id})" title="${esc(c.title)} — ${esc(pillarName(c.pillar))}">
      <div class="ag-day">${fmtAgendaDay(c.planned_date)}</div>
      <div class="ag-line">${typeBadge(c,{sm:true})}<span class="ag-ti">${esc(c.title)}</span></div></div>`;};
  const sec=(t,items,empty)=>`<div class="ag-sec"><div class="ag-h">${t}</div>${items.length?items.map(row).join(""):`<div class="ag-empty">${empty}</div>`}</div>`;
  return `<div class="ag-inner"><div class="ag-title">📅 On the calendar</div>
    ${sec("Upcoming",up,"Nothing scheduled yet")}
    ${recent.length?sec("Recently published",recent,""):""}</div>`;
}
function renderContent(){
  const v=$("v-content");
  /* Stage comes from contentStageOf(), not the raw status, so a LinkedIn post that has actually
     gone live lands under Published instead of sitting in Ready forever (see isLive). */
  const allStatuses=["new","picked","drafted","ready","published","deferred","dismissed"];
  const archMode=ST.contentStage==="archived";
  let items=archMode
    ? CONCEPTS.filter(c=>c.archived)
    : ST.contentStage==="all"
      ? CONCEPTS.filter(c=>!c.archived&&allStatuses.includes(c.status))
      : CONCEPTS.filter(c=>!c.archived&&contentStageOf(c)===ST.contentStage);
  if(ST.contentType!=="all")items=items.filter(c=>conceptStarted(c)&&c.outlet===ST.contentType);
  if(ST.contentPillar)items=items.filter(c=>c.pillar===ST.contentPillar);
  const archCount=CONCEPTS.filter(c=>c.archived).length;
  const seg=(k,l)=>`<button class="${ST.contentType===k?'on':''}" onclick="ST.contentType='${k}';renderContent()">${l}</button>`;
  const chip=(k,l)=>`<button class="${ST.contentStage===k?'on':''}" onclick="ST.contentStage='${k}';renderContent()">${l}</button>`;
  v.innerHTML=`
    <div class="pagehead"><div class="pht">
      <h1>All Content</h1>
      <p class="lede">Everything you've picked, placed on an <b>outlet</b>. A freshly-picked concept is <b>neutral</b> — decide here where it goes (${outletList().map(o=>o.icon+" "+esc(lcName(o))).join(" or ")}). Its angle / point of view is shown on the card and editable in place. The rail on the right shows what's on the publish calendar so you don't double up on a topic.</p>
    </div></div>
    <div class="toolbar">
      <div class="seg">${seg('all','All')}${outletList().map(o=>seg(o.slug,o.icon+" "+esc(o.plural))).join("")}</div>
      <span style="width:10px"></span>
      <div class="seg">${chip('progress','In progress')}${chip('ready','Ready')}${chip('published','Published')}${chip('all','All')}${chip('archived',`🗄 Archived${archCount?` ${archCount}`:''}`)}</div>
      <div class="spacer" style="flex:1"></div>
      <select onchange="ST.contentPillar=this.value;renderContent()">
        <option value="">All pillars</option>
        ${activePillars().map(p=>`<option value="${p.slug}" ${ST.contentPillar===p.slug?'selected':''}>${esc(p.name)}</option>`).join("")}
      </select>
      ${outletList().map(o=>`<button class="btn ghost" onclick="newPiece('${o.slug}')" title="Start a blank ${esc(lcName(o))} and open it — paste your own text or write it in Voice Studio">+ New ${esc(lcName(o))}</button>`).join("")}
      <button class="btn ghost" onclick="addOwnIdea()" title="Bank a concept for later — a brief and angle for the writer, without starting the piece">+ Add an idea</button>
      <button class="btn ghost" onclick="pullFromVs()" title="Bring in a piece you finished in Voice Studio's Canvas">📥 Pull from Voice Studio</button>
    </div>
    <div class="ccwrap">
      <div class="ccmain"><div id="contentGrid" class="ccards"></div></div>
      <aside class="ccside">${agendaRail()}</aside>
    </div>`;
  const grid=$("contentGrid");
  if(!items.length){grid.innerHTML=archMode
    ?`<div class="card muted">No archived content. Use <b>🗄 Archive</b> on a card to tuck away ideas that didn't make the cut — they land here and can be restored anytime.</div>`
    :`<div class="card muted">Nothing here yet. Triage some concepts in <span class="linkish" onclick="go('today')">Today</span> or add your own idea.</div>`;return;}
  grid.innerHTML=items.map(c=>contentCard(c)).join("");
}
function contentCard(c){
  const started=conceptStarted(c);
  const o=outletOf(c);
  const rel=relatives(c);
  const po=rel.parent?outletOf(rel.parent):null, co=rel.children.length?outletOf(rel.children[0]):null;
  const src=rel.parent
    ? ` <span class="pill p-pur linkish" title="Open the ${esc(lcName(po))} this was repurposed from" onclick="event.stopPropagation();openWorkspace(${rel.parent.id})">↪ from ${po.icon} ${esc(po.short)} · open</span>`
    : rel.children.length
    ? ` <span class="pill p-pur linkish" title="Open the ${esc(lcName(co))} repurposed from this" onclick="event.stopPropagation();openWorkspace(${rel.children[0].id})">↗ has ${co.icon} ${esc(co.short)} · open</span>`
    : "";
  const actions=c.archived?`
      <button class="btn sm" onclick="unarchiveConcept(${c.id})" title="Restore to All Content">↩ Restore</button>
      <button class="btn sm red ghost" onclick="deleteConcept(${c.id})" title="Delete permanently (published items can't be deleted)">Delete permanently</button>`
    :started?`
      <button class="btn sm" onclick="openWorkspace(${c.id})">Open →</button>
      ${c.status==="ready"&&!c.planned_date?`<button class="btn sm teal ghost" onclick="go('schedule')">Schedule</button>`:""}
      ${["drafted","ready","published"].includes(c.status)?(o.repurpose_to||[]).map(sl=>OUTLETS[sl]).filter(t=>t&&!t.archived).map(t=>`<button class="btn sm ghost" style="color:${t.color};border-color:${t.color}" onclick="repurposeTo(${c.id},'${t.slug}')">↗ Repurpose to ${esc(t.short)}</button>`).join(""):""}
      <button class="btn sm ghost" onclick="editConceptIdea(${c.id})">Edit</button>
      <button class="btn sm gray ghost" onclick="archiveConcept(${c.id})" title="Archive — remove from the working list (reversible)">🗄 Archive</button>`
    :`
      ${outletList().map(t=>`<button class="btn sm" style="background:${t.color};border-color:${t.color}" onclick="startAs(${c.id},'${t.slug}')" title="Create a ${esc(lcName(t))} from this concept">${t.icon} Create ${esc(lcName(t))}</button>`).join("")}
      <button class="btn sm ghost" onclick="editConceptIdea(${c.id})">Edit</button>
      <button class="btn sm gray ghost" onclick="archiveConcept(${c.id})" title="Archive — remove from the working list (reversible)">🗄 Archive</button>`;
  const angleArea=started
    ?`<div class="cangle">${esc(c.angle||"")}</div>`
    :`<div class="pickangle">
        <label>Brief <span>— the subject &amp; what it covers</span></label>
        <textarea id="pbrief_${c.id}" placeholder="what the piece is about — topic, key points, who it's for…">${esc(c.excerpt||"")}</textarea>
        <label style="margin-top:8px">Angle / point of view <span>— the take on it; the writer works from this</span></label>
        <textarea id="pang_${c.id}" placeholder="e.g. lead with the pricing angle; tie it to a client story…">${esc(c.angle||"")}</textarea>
        <div style="margin-top:5px"><button class="btn sm gray" onclick="saveAngle(${c.id})">💾 Save brief &amp; angle</button></div>
      </div>`;
  return `<div class="ccard" style="${started?`border-left:3px solid ${o.color}`:''}">
    <div class="chd">${typeBadge(c)}
      <div class="ctitle">${esc(c.title)}</div>${started?readyBarHTML(c):""}</div>
    <div class="cmeta">${c.archived?`<span class="pill p-gray">🗄 Archived</span>`:""}${started?statusPill(c):`<span class="pill p-acc">Picked — choose type</span>`}${needsFix(c)?`<span class="pill p-red" title="${esc(fixReason(c))} Open it, trim the text, then approve and reschedule.">🚨 Too long — fix &amp; reschedule</span>`:isOverdue(c)?`<span class="pill p-red" title="${esc(c.li_error||c.publish_error||"Its scheduled time has passed and it never went out — open it to see why.")}">⚠ Didn't post</span>`:""}<span class="pill p-pur">${esc(pillarName(c.pillar))}</span>${src}${c.gen_date?`<span class="cdate" title="Created">· 🗓 ${esc(c.gen_date)}</span>`:""}${c.planned_date?`<span>· 📅 ${esc(c.planned_date)}</span>`:""}</div>
    ${angleArea}
    <div class="cactions">${actions}</div></div>`;
}
async function repurposeTo(id,to){
  const t=outletByAny(to);
  const r=await apiPost("/api/concept/"+id+"/repurpose",{to:t.slug});
  if(!r||!r.concept)return;
  snapshot("Repurpose to "+t.short);
  CONCEPTS.unshift(r.concept);render();toast("Spun off a "+lcName(t)+" → opening","ok");openWorkspace(r.concept.id);
}
function repurposeLinkedin(id){return repurposeTo(id,'linkedin');}
function archiveConcept(id){
  const c=CONCEPTS.find(x=>x.id===id);if(!c)return;
  snapshot("Archive concept");c.archived=true;
  apiPost("/api/concept/"+id+"/archive",{});render();
  toast("Archived → find it under 🗄 Archived (Ctrl+Z to undo)","ok");
}
// Archive straight from the Schedule board (pool item or a day card): tuck it away
// AND clear any schedule slot, so a change-of-mind item leaves the queue without
// having to be published. Reversible (undo / All Content ▸ 🗄 Archived ▸ ↩ Restore).
function archiveFromSchedule(id){
  const c=CONCEPTS.find(x=>x.id===id);if(!c)return;
  snapshot("Archive from schedule");
  c.archived=true;c.planned_date=null;if(c.wp_state==="scheduled")c.wp_state=null;
  apiPost("/api/concept/"+id+"/archive",{});
  persist(id,{planned_date:null});
  render();
  toast("Archived & taken off the schedule → All Content ▸ 🗄 Archived (Ctrl+Z to undo)","ok");
}
function unarchiveConcept(id){
  const c=CONCEPTS.find(x=>x.id===id);if(!c)return;
  snapshot("Restore concept");c.archived=false;
  apiPost("/api/concept/"+id+"/unarchive",{});renderContent();
  toast("Restored to All Content","ok");
}
async function deleteConcept(id){
  const c=CONCEPTS.find(x=>x.id===id);if(!c)return;
  if(!confirm(`Permanently delete "${c.title}"? This can't be undone.`))return;
  try{
    const resp=await fetch("/api/concept/"+id+"/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
    const j=await resp.json().catch(()=>({}));
    if(resp.ok&&j.ok){CONCEPTS=CONCEPTS.filter(x=>x.id!==id);renderContent();toast("Deleted permanently","ok");}
    else if(j.error==="published"){toast("Published items can't be deleted — keep it archived instead","warn");}
    else{toast("Delete failed: "+(j.error||resp.status),"warn");}
  }catch(e){toast("Delete failed (server offline?)","warn");}
}

function saveImg(){snapshot("Edit image settings");if($("im_style"))IMG.style_notes=$("im_style").value;if($("im_inst"))IMG.instructions=$("im_inst").value;apiSettings({image_style_notes:IMG.style_notes,image_instructions:IMG.instructions});toast("Image settings saved","ok");}
// Upload one or more real style-reference images → stored in the image_refs table, shown as
// thumbnails, and bundled into the workspace's Image prompt & references block.
async function uploadImgRefs(files){
  const list=files?[...files]:[];
  if(!list.length)return;
  toast("Uploading "+list.length+" reference"+(list.length>1?"s":"")+"…");
  let ok=0;
  for(const f of list){
    if(!f.type.startsWith("image/")){toast("Skipped "+f.name+" (not an image)","warn");continue;}
    let data_url;
    try{ data_url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(f);}); }
    catch(e){ toast("Couldn't read "+f.name,"warn"); continue; }
    const r=await apiPost("/api/image_refs/add",{filename:f.name,data_url});
    if(r&&r.ok){ if(r.refs)IMG.refs=r.refs; ok++; }
  }
  renderImages();
  if(ok)toast(ok+" reference image"+(ok>1?"s":"")+" added","ok");
}
async function rmImgRef(id){
  snapshot("Remove image ref");
  const r=await apiPost("/api/image_ref/"+id+"/delete",{});
  if(r&&r.refs)IMG.refs=r.refs; else IMG.refs=IMG.refs.filter(x=>x.id!==id);
  renderImages();toast("Reference removed","ok");
}

/* ---- blog ↔ LinkedIn "family": a repurposed post is a SEPARATE concept that

function relatives(c){
  if(!c)return{parent:null,children:[]};
  const parent=c.source_concept_id?CONCEPTS.find(x=>x.id===c.source_concept_id):null;
  const children=CONCEPTS.filter(x=>x.source_concept_id===c.id);
  return{parent,children};

  const{parent,children}=relatives(c);
  if(!parent&&!children.length)return "";

  if(parent){
    const po=outletOf(parent);
    return `<div class="guide purple" style="margin:0 0 14px;align-items:center"><span class="ic">↪</span>
      <div style="flex:1">You're viewing the <b>${esc(o.name)}</b>, repurposed from the ${po.icon} <b>${esc(parent.title)}</b> (${esc(lcName(po))}). They're <b>separate pieces</b> and publish/schedule independently.</div>
      <button class="btn sm ghost" onclick="openWorkspace(${parent.id})">${po.icon} Open the ${esc(lcName(po))} →</button></div>`;
  }
  const links=children.map(ch=>{const co=outletOf(ch);return `<button class="btn sm ghost" style="color:${co.color};border-color:${co.color}" onclick="openWorkspace(${ch.id})">${co.icon} Open the ${esc(co.short)} version →</button>`;}).join(" ");

    <div style="flex:1">This ${o.icon} <b>${esc(lcName(o))}</b> has ${children.length===1?"a repurposed version":"repurposed versions"} on ${children.map(ch=>"<b>"+esc(outletOf(ch).short)+"</b>").join(", ")} — separate pieces that schedule on their own. Editing one doesn't change the other.</div>${links}</div>`;

/* Re-rendering the workspace replaces the whole view, including the <textarea> —
   which drops the height you dragged it to, the caret, and the page scroll, so
   every Save yanked you back to the top of the editor (2026-07-21).
   Save handlers wrap their re-render in renderWorkspaceInPlace() to keep it put. */
function wsEditorState(){
  const ta=$("ws_body");
  return {y:window.scrollY, h:ta?ta.style.height:"", top:ta?ta.scrollTop:0,
          s:ta?ta.selectionStart:null, e:ta?ta.selectionEnd:null,
          focused:!!ta&&document.activeElement===ta};
}
function restoreWsEditor(st){
  const ta=$("ws_body");
  if(ta){
    if(st.h)ta.style.height=st.h;              /* manual resize-grip height */
    ta.scrollTop=st.top;
    if(st.s!=null){try{ta.setSelectionRange(st.s,st.e);}catch(_){}}
    if(st.focused)ta.focus({preventScroll:true});
  }
  window.scrollTo(0,st.y);
}
function renderWorkspaceInPlace(){const st=wsEditorState();renderWorkspace();restoreWsEditor(st);}
function renderWorkspace(){
  const c=currentConcept();const v=$("v-workspace");
  if(!c){v.innerHTML=`<div class="card muted">No item selected.</div>`;return;}

function hasContent(c){return isPost(c)?!!(c.li_text||"").trim():!!(c.drafts&&c.drafts.length);}
function briefAngleHTML(c){

/* The workspace title is editable in place. It has to be: a piece started from scratch arrives
   as "Untitled …" and there was previously nowhere in the workspace to name it (only the card's
   Edit modal, which means leaving). An untitled piece renders as an open input, a named one as
   click-to-edit text. */
function wsTitleHTML(c){
  if(ST.titleEdit===c.id||isUntitled(c)){
    return `<input class="wstitle wstitlein" id="ws_title_in" value="${esc(isUntitled(c)?"":c.title)}"
      placeholder="${esc(untitledFor(c.outlet))} — name it" spellcheck="false"
      onkeydown="if(event.key==='Enter'){this.blur();}if(event.key==='Escape'){ST.titleEdit=null;renderWorkspace();}"
      onblur="saveWsTitle(${c.id},this.value)">`;
  }
  return `<span class="wstitle wstitleed" title="Click to rename" onclick="ST.titleEdit=${c.id};renderWorkspace();
    var e=document.getElementById('ws_title_in');if(e){e.focus();e.select();}">${esc(c.title)}</span>`;
}
function saveWsTitle(id,val){
  const c=CONCEPTS.find(x=>x.id===id);if(!c)return;
  const t=(val||"").trim();
  ST.titleEdit=null;
  /* Blank stays blank — we do NOT quietly re-stamp "Untitled": the placeholder input has to keep
     showing so it's obvious the piece still needs a name before it can generate or publish. */
  if(t===(c.title||"")||(!t&&isUntitled(c))){renderWorkspace();return;}
  snapshot("Rename");
  c.title=t||untitledFor(c.outlet);
  persist(id,{title:c.title});
  render();                       /* render() re-renders the workspace itself — don't double-call */
  document.title=titleFor();      /* the browser tab is named after the piece; keep it honest */

}
function markReadyBtn(c){
  if(c.status==="published")return `<span class="pill p-teal">Published</span>`;
  const ready=isReady(c);
  if(c.status==="ready")return `<button class="btn green" onclick="unmarkReady(${c.id})">✓ Ready — click to re-open</button>`;
  /* an over-limit LinkedIn post says WHY it can't be readied, instead of a generic "approve first" */
  const tooLong=liOver(c)>0;
  const empty=!hasWritten(c);
  const why=empty?("Nothing written yet — "+(isPost(c)?"write or paste the post":"write or paste a draft")+" first")
    :(tooLong?("Too long for "+outletOf(c).short+". "+fixReason(c)):(ready?'All required pieces approved':'Approve all pieces first'));
  const lbl=ready?'Mark ready →':(empty?'Nothing written yet':(tooLong?'Too long for '+outletOf(c).short:'Mark ready ('+readyCount(c)+'/'+readyTotal(c)+')'));
  return `<button class="btn ${ready?'green':'gray'}" ${ready?'':'disabled'} onclick="markReady(${c.id})" title="${esc(why)}">${lbl}</button>`;
}
function markReady(id){const c=CONCEPTS.find(x=>x.id===id);
  if(!isReady(c)){
    toast(!hasWritten(c)
      ? (isPost(c)?"Nothing written yet — write or paste the post, then Save"
                  :"Nothing written yet — write or paste a draft first")
      : (liOver(c)>0
        ? `Can't mark ready — ${liChars(c).toLocaleString()} characters, ${liOver(c).toLocaleString()} over the ${liLimit(c).toLocaleString()} limit. Trim it and Save first.`
        : "Approve all pieces first"),"warn");
    return;}
  snapshot("Mark ready");c.status="ready";
  /* Commit the text on screen along with the status. Marking ready is a commitment to publish
     THIS, so it must not be possible to schedule one thing and store another — a LinkedIn post
     typed but never Saved is exactly how an item reached the calendar with an empty body. */
  const payload={status:"ready"};
  if(isPost(c)){const live=liTextOf(c);if(live!==c.li_text){c.li_text=live;payload.li_text=live;}}
  persist(id,payload);render();toast("Marked ready — it's now in the schedule pool","ok");}
function unmarkReady(id){snapshot("Re-open");const c=CONCEPTS.find(x=>x.id===id);c.status="drafted";c.planned_date=null;persist(id,{status:"drafted",planned_date:null});render();toast("Re-opened for editing","ok");}

/* ---- change your mind: convert this concept to the other type IN PLACE ----
   Distinct from Repurpose (which spins off a separate linked post). Kept out
   once committed downstream — published, live on WP, posted, or a repurposed child. */
function switchTypeBtn(c){
  if(!conceptStarted(c))return "";               /* neutral items pick their outlet via Create buttons */
  if(c.status==="published"||c.wp_state==="live"||c.li_state==="posted"||c.source_concept_id)return "";
  return outletList().filter(o=>o.slug!==outletOf(c).slug).map(o=>`<button class="wsback" onclick="switchType(${c.id},'${o.slug}')" title="Convert this whole piece into a ${esc(lcName(o))} — your title, angle and any text are kept; switch back anytime">⇄ Switch to ${esc(lcName(o))}</button>`).join("");
}
function switchType(id,to){
  const c=CONCEPTS.find(x=>x.id===id);const o=OUTLETS[to];if(!c||!o)return;
  if(!confirm("Switch this to a "+lcName(o)+"?\n\nYour title, angle and any text are kept. The readiness checklist changes to match, so some pieces may need approving again. You can switch back anytime."))return;
  snapshot("Switch to "+o.name);
  c.outlet=o.slug;c.type=o.legacy_type;c.format=o.format;c.started=true;
  if(isPost(c)){if(c.li_text==null)c.li_text="";}  /* hashtags are opt-in — never auto-added (2026-07-10) */
  else{c.drafts=c.drafts||[];}
  if(c.status==="ready"&&!isReady(c)){c.status="drafted";c.planned_date=null;} /* new checklist may not be met */
  persist(id,{outlet:o.slug,started:true,status:c.status});
  renderWorkspace();renderTabs();toast("Now a "+lcName(o),"ok");
}

/* ---- shared: approve toggle ---- */
function approveTog(c,piece){
  const on=c["approved_"+piece];
  /* a LinkedIn post that doesn't fit shows the toggle as blocked rather than silently failing */
  const tooLong=!on&&piece==="content"&&liOver(c)>0;
  /* ...and so does an EMPTY one. Approving nothing used to be allowed all the way to the
     calendar; the publisher was the first thing to complain. */
  const empty=!on&&piece==="content"&&!hasWritten(c);
  const blocked=tooLong||empty;
  const why=tooLong?("Too long to approve. "+fixReason(c))
    :(empty?("Nothing written yet — "+(isPost(c)?"write or paste the post":"write or paste a draft")+" first"):"");
  const lbl=on?"Approved":(tooLong?"Too long":(empty?"Nothing to approve":"Approve"));
  return `<span class="approvetog ${on?'on':''}${blocked?' blocked':''}" title="${esc(why)}" onclick="toggleApprove(${c.id},'${piece}')"><span class="bx">${on?'✓':''}</span>${lbl}</span>`;
}
function toggleApprove(id,piece){
  const c0=CONCEPTS.find(x=>x.id===id);
  /* HARD RULE: never approve a LinkedIn post that won't fit. Caught here, at the click,
     instead of two weeks later in a silent publish failure. Un-approving is always allowed. */
  if(c0&&isPost(c0)&&piece==="content"&&!c0.approved_content){
    const over=liOver(c0);
    if(over>0){
      toast(`Can't approve — ${liChars(c0).toLocaleString()} characters, ${over.toLocaleString()} over the ${liLimit(c0).toLocaleString()} limit. Trim it and Save first.`,"warn");
      return;
    }
  }
  /* Never approve an empty piece — the publisher would be the first thing to notice, 30 minutes
     later. The server refuses this too; this is the version that explains itself at the click. */
  if(c0&&piece==="content"&&!c0["approved_content"]&&!hasWritten(c0)){
    toast(isPost(c0)?"Nothing written yet — write or paste the post, then Save"
                    :"Nothing written yet — write or paste a draft first","warn");
    return;
  }
  snapshot("Approve "+piece);const c=CONCEPTS.find(x=>x.id===id);
  c["approved_"+piece]=!c["approved_"+piece];
  // auto-demote a ready item if a required piece is un-approved (server mirrors this via its gate)
  if(c.status==="ready"&&!isReady(c)){c.status="drafted";c.planned_date=null;toast("Un-approved a piece → auto-demoted from Ready","warn");}
  const payload={["approved_"+piece]:c["approved_"+piece]?1:0};
  // Approving a LinkedIn post commits the text you're looking at, so the length the server
  // gates on is the length the counter just showed you (no approve-the-old-text mismatch).
  if(isPost(c)&&piece==="content"){
    const live=liTextOf(c);
    if(live!==c.li_text){c.li_text=live;payload.li_text=live;}
    if(c.approved_content)c.li_error=null;   // fits now → retire the old failure flag
  }
  persist(id,payload);
  renderWorkspace();renderTabs();
}

        </div>

/* ---- image card (shared by article + linkedin) ----
   New workflow (no in-app pixel generation): generate a CONCEPT → export a prompt+refs
   block to an external image model → upload the final back → upscale. */
function imageCard(c){
  const uploaded=!!c.featured_image;
  const step=(k)=>{const order=["concept","upload","upscale"];const cur=c.img_upscaled?"upscale":(uploaded?"upload":(c.image_concept?"concept":"concept"));
    const doneMap={concept:!!c.image_concept,upload:uploaded,upscale:!!c.img_upscaled};
    return doneMap[k]?"done":(cur===k?"active":"");};
  return `
    <div class="imgsteps">
      <div class="imgstep ${step('concept')}"><div class="st">Step 1</div>Illustration concept</div>
      <div class="imgstep ${step('upload')}"><div class="st">Step 2</div>Generate externally · upload</div>
      <div class="imgstep ${step('upscale')}"><div class="st">Step 3</div>Upscale</div>
    </div>

    <label class="fld">Illustration concept <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)">— the idea; what the image is getting at</span></label>
    <div class="btnrow" style="margin-bottom:8px">
      <button class="btn ghost" id="imgGenBtn_${c.id}" onclick="genImgConcepts(${c.id},this)">${(c.img_concept_batches&&c.img_concept_batches.length)?'✨ Generate 4 more':'✨ Suggest concepts'}</button>
      <span class="muted" style="font-size:12px">4 at a time — older batches are kept; page back to compare and pick.</span>
    </div>
    <div id="imgConcepts_${c.id}">${imgConceptsHTML(c)}</div>
    <textarea id="ws_imgc" placeholder="Pick a concept above, or write your own…" style="min-height:66px;margin:4px 0 8px">${esc(c.image_concept||"")}</textarea>
    <div class="btnrow" style="margin-bottom:16px"><button class="btn gray" onclick="saveImgConcept(${c.id})">Save concept</button></div>

    <label class="fld">Tactical image prompt <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)">— the concrete subject the generator gets (no composition, no style)</span></label>
    <div class="btnrow" style="margin-bottom:8px">
      <button class="btn teal ghost" onclick="genImgPrompt(${c.id},this)">⚙ Generate tactical image prompt</button>
      <span class="muted" style="font-size:12px">Turns the concept into literal art direction. Edit freely — this exact text goes in the copy-paste block.</span>
    </div>
    <textarea id="ws_imgp" placeholder="Generate from the concept above, or write the literal image direction yourself…" style="min-height:92px;margin-bottom:10px">${esc(c.image_prompt||"")}</textarea>
    <div class="btnrow" style="margin-bottom:14px">
      <button class="btn gray" onclick="saveImgPrompt(${c.id})">Save prompt</button>
      <button class="btn" onclick="openImageResources(${c.id})">🎨 Image prompt &amp; references →</button>
    </div>
    <div class="guide" style="margin:0 0 16px"><span class="ic">↗</span><div>Images are made in a dedicated image model, not in-app. The <b>concept</b> is the idea; the <b>tactical image prompt</b> is the literal art direction the generator needs. <b>Image prompt &amp; references</b> bundles that tactical prompt with your saved <b>style</b> + <b>handling instructions</b> into one copy-paste block, and shows your reference images to drag across. Bring the final back here to upload.</div></div>

    <label class="fld">Final image</label>
    ${uploaded?`
      <div style="margin-bottom:6px">
        <img class="finalimg" src="/api/concept/${c.id}/image?v=${c.img_ver||0}" alt="Final featured image"
             title="click to open full size" onclick="window.open('/api/concept/${c.id}/image?v=${c.img_ver||0}','_blank')">
        <div class="imgused ${c.img_upscaled?'up':''}">
          <span class="pill ${c.img_upscaled?'p-teal':'p-grn'}">✓ Featured image${c.img_upscaled?' · upscaled':''}</span>
          <span>${c.img_upscaled
            ? 'This upscaled hi-res version <b>is the featured image that gets published</b> — it replaced the one you uploaded.'
            : 'This is <b>the featured image that gets published</b>. Upscaling below sharpens it to hi-res and <b>replaces it in place</b> — still the featured image, no extra step (optional).'}</span>
        </div>
        <div class="muted" style="font-size:12px;margin:6px 0 0">Click the image to open it full size.</div>
        <div class="btnrow" style="margin-top:10px">
          <button class="btn teal" ${c.img_upscaled?'disabled':''} onclick="upscaleFinal(${c.id},this)">${c.img_upscaled?'✓ Upscaled':'⤢ Upscale (Replicate/fal)'}</button>
          <button class="btn gray" onclick="uploadFinal(${c.id},this)">Replace</button>
          <button class="btn red ghost" onclick="removeFinal(${c.id})">Remove</button>
        </div></div>`
    :`<div class="uploadzone" onclick="uploadFinal(${c.id},this)">⬆ Upload the final image<br><span style="font-size:11.5px">from your image generator — PNG / JPG</span></div>`}`;
}
/* image-resources export modal: one copy-paste block + draggable reference images.
   The block leads with the TACTICAL IMAGE PROMPT (not the concept, and no title line —
   stray words hurt the crop), followed by the shared style + handling instructions. */
function openImageResources(id){
  const c=CONCEPTS.find(x=>x.id===id);const ws=ST.tab==="workspace";
  const prompt=((ws&&$("ws_imgp"))?$("ws_imgp").value:c.image_prompt||"").trim();
  const concept=((ws&&$("ws_imgc"))?$("ws_imgc").value:c.image_concept||"").trim();
  const usingConcept=!prompt&&!!concept;
  const shot=prompt||concept||"(no image prompt yet — generate a tactical image prompt first)";
  const block=`IMAGE PROMPT\n${shot}\n\nSTYLE\n${IMG.style_notes}\n\nHANDLING INSTRUCTIONS\n${IMG.instructions}`;
  showModal(`<div class="mhead"><div><h2>Image prompt &amp; references</h2><div class="sub">Copy the block into your image model; drag the reference images across</div></div><button class="dclose" onclick="closeModal()">×</button></div>
    <div class="mbody">
      ${usingConcept?`<div class="warnstrip"><span>⚠</span><div>This is the raw <b>concept</b>, not a tactical prompt — for a tighter crop, close this and <b>⚙ Generate tactical image prompt</b> first.</div></div>`:""}
      <label class="fld">Copy-paste prompt block <span class="muted" style="text-transform:none;font-weight:400">— tactical image prompt + your style + handling instructions</span></label>
      <div class="resblock"><textarea id="resTA" readonly>${esc(block)}</textarea></div>
      <div class="btnrow" style="margin:10px 0 20px"><button class="btn" onclick="copyImgResources()">📋 Copy block</button>
        <span class="muted" style="font-size:12px">Edit the style + handling text under <span class="linkish" onclick="closeModal();go('images')">Featured images</span>.</span></div>
      <label class="fld">Reference images <span class="muted" style="text-transform:none;font-weight:400">— drag straight into your image model</span></label>
      <div class="resimgs">${(IMG.refs||[]).map(r=>`<div class="dragimg" title="${esc(r.name)} — drag into your image model"><img src="/api/image_ref/${r.id}" alt="${esc(r.name)}" draggable="true"><span class="gr">⠿</span><span class="cap">${esc(r.name)}</span></div>`).join("")||`<span class="muted" style="font-size:12.5px">No reference images yet — add them under Featured images.</span>`}</div>
    </div>`,true);
}
function copyImgResources(){const ta=$("resTA");if(ta){ta.select();try{document.execCommand('copy');}catch(e){}}toast("Copied prompt block to clipboard","ok");}
/* persist both image fields off the DOM before any re-render, so neither textarea is lost */
function _persistImgFields(c){if($("ws_imgc"))c.image_concept=$("ws_imgc").value;if($("ws_imgp"))c.image_prompt=$("ws_imgp").value;}
function saveImgConcept(id){snapshot("Save image concept");const c=CONCEPTS.find(x=>x.id===id);_persistImgFields(c);persist(id,{image_concept:c.image_concept||"",image_prompt:c.image_prompt||""});renderWorkspaceInPlace();toast("Concept saved","ok");}
function saveImgPrompt(id){snapshot("Save image prompt");const c=CONCEPTS.find(x=>x.id===id);_persistImgFields(c);persist(id,{image_concept:c.image_concept||"",image_prompt:c.image_prompt||""});renderWorkspaceInPlace();toast("Image prompt saved","ok");}
/* Convert the saved concept (the idea) into concrete art direction via a real model call
   (the server steers it with the concept + image style/handling settings). The concept is
   auto-saved first so the server reads the same text you see. */
async function genImgPrompt(id,btn){
  const c=CONCEPTS.find(x=>x.id===id);
  const concept=($("ws_imgc")?$("ws_imgc").value:c.image_concept||"").trim();
  if(!concept){toast("Pick or write a concept first","warn");return;}
  // persist the on-screen concept first so the server converts the same text you see
  if(concept!==(c.image_concept||"")){c.image_concept=concept;await apiPost("/api/concept/"+id,{image_concept:concept,image_prompt:c.image_prompt||""});}
  return llmAction({
    anchor:btn, path:"/api/concept/"+id+"/gen_image_prompt", body:{},
    label:"Converting the concept into a tactical image prompt with Sonnet — usually 15–30 seconds.",
    retry:function(){genImgPrompt(id,btn);},
    onOk:function(r){ if(!r.image_prompt){toast("No prompt came back — try again","warn");return;} snapshot("Gen image prompt"); c.image_prompt=r.image_prompt; renderWorkspace(); toast("Tactical prompt ready — edit if needed","ok"); }
  });
}
/* Read a picked file as a data: URL and POST it as the final image. */
function uploadFinal(id,el){
  const inp=document.createElement("input");inp.type="file";inp.accept="image/png,image/jpeg,image/webp";
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;
    if(f.size>12*1024*1024){toast("Image is over 12 MB — use a smaller export","warn");return;}
    const imgc=$("ws_imgc")?$("ws_imgc").value:null;  // capture before the render
    const rd=new FileReader();rd.onload=function(){
      llmAction({
        anchor:el, path:"/api/concept/"+id+"/upload_image", body:{data_url:rd.result,filename:f.name},
        label:"Uploading the final image ("+Math.round(f.size/1024)+" KB)…",
        retry:function(){uploadFinal(id,el);},
        onOk:function(r){ snapshot("Upload final image"); const c=CONCEPTS.find(x=>x.id===id); if(imgc!=null)c.image_concept=imgc; c.featured_image=true; c.img_upscaled=false; c.img_ver=(c.img_ver||0)+1; renderWorkspace(); toast("Final image uploaded","ok"); }
      });
    };rd.readAsDataURL(f);};
  inp.click();
}
