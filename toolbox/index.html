<!doctype html><html lang="en"><head>
<style id="demo-first-visit-style">html[data-demo-first-visit] :is(#demo-tour-start,#demo-start,#demo-tour-launch,#tutPill){display:none!important}</style>
<script id="demo-first-visit">
(function(){
  const key="demo-walkthrough-seen:toolbox";
  let first=true;
  try { first=localStorage.getItem(key)!=="1"; } catch {}
  if(first)document.documentElement.setAttribute("data-demo-first-visit","");
  
  function ready(){
    let attempts=0;
    const timer=setInterval(()=>{
      const launch=document.querySelector("#demo-tour-start,#demo-start,#demo-tour-launch,#tutPill");
      if(!launch){if(++attempts>100)clearInterval(timer);return;}
      
      clearInterval(timer);
      if(!first)return;
      launch.click();
      const check=setInterval(()=>{
        const card=document.querySelector("#demo-tour-card,#demo-tour,.tut-card");
        if(card&&!card.hidden&&card.getBoundingClientRect().height){
          try { localStorage.setItem(key,"1"); } catch {}
          clearInterval(check);
        }else if(++attempts>100){
          document.documentElement.removeAttribute("data-demo-first-visit");
          clearInterval(check);
        }
      },100);
    },100);
  }
  if(document.readyState==="complete")setTimeout(ready,500);
  else window.addEventListener("load",()=>setTimeout(ready,500),{once:true});
})();

:root {
  --ink: #202124;
  --soft: #e9edf0;
  --blue: #4263eb;
  --paper: #fff;
}
* {
  box-sizing: border-box;
}
html, body {
  min-height: 100%;
}
body {
  margin: 0;
  background: #fff;
  color: var(--ink);
  font-family: "Excalifont", "Comic Sans MS", cursive;
}
button, input {
  font: inherit;
}
button {
  color: inherit;
}
.page-frame {
  width: 100%;
  min-height: 100vh;
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr);
  background: var(--paper);
}
.sidebar {
  position: sticky;
  top: 0;
  align-self: start;
  border-right: 3px solid var(--ink);
  padding: 28px 22px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
.wordmark {
  position: relative;
  width: 158px;
  margin: 4px auto 28px;
  padding: 13px 8px 7px;
  border: 3px solid var(--ink);
  border-radius: 6px 9px 5px 10px;
  background: #fff;
  color: var(--ink);
  font-size: 36px;
  line-height: 1;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  transform: rotate(-1deg);
  box-shadow: 3px 2px 0 var(--ink);
}
.wordmark .handle {
  position: absolute;
  top: -19px;
  left: 51px;
  width: 54px;
  height: 24px;
  background: #fff;
  border: 3px solid var(--ink);
  border-bottom: 0;
  border-radius: 9px 9px 0 0;
}
.sidebar nav {
  display: grid;
  gap: 10px;
}
.team-nav {
  margin-top: auto;
  padding-top: 24px;
  border-top: 2px solid var(--ink);
}
.team-nav span {
  display: block;
  margin-bottom: 8px;
  font-family: system-ui;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.team-nav button, .team-nav a {
  display: block;
  padding: 6px 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  text-decoration: none;
  cursor: pointer;
}
.sidebar nav button, .sidebar nav a {
  display: block;
  width: 100%;
  padding: 12px 15px;
  text-align: left;
  border: 3px solid transparent;
  border-radius: 11px 9px 12px 8px;
  background: transparent;
  color: var(--ink);
  font-size: 23px;
  text-decoration: none;
  cursor: pointer;
}
.sidebar nav button:hover, .sidebar nav a:hover {
  background: #f4f5f5;
}
.sidebar nav button.active, .sidebar nav a.active {
  border-color: var(--ink);
  background: #fff;
  box-shadow: 2px 2px 0 var(--ink);
  transform: rotate(.4deg);
}
.content-shell {
  min-width: 0;
}
.doc-page {
  position: relative;
  width: min(940px, calc(100% - 72px));
  margin: 0 auto;
  padding: 64px 0 80px;
}
h1, h2, h3, p {
  margin-top: 0;
}
h1 {
  margin-bottom: 35px;
  font-size: clamp(42px, 5vw, 68px);
  line-height: 1.03;
  font-weight: 400;
}
h2 {
  margin: 58px 0 26px;
  font-size: clamp(33px, 3.4vw, 48px);
  line-height: 1.08;
  font-weight: 400;
}
h3 {
  font-size: 27px;
  font-weight: 400;
}

  .search {

    grid-template-columns: 1fr;
    height: auto;
    min-height: 0;

  .repository-picker {
    max-height: 310px;
    border-right: 0;
    border-bottom: 3px solid var(--ink);
  }
  .repository-header {
    display: grid;
    gap: 14px;
  }
  .repository-workspace {
    grid-template-columns: 1fr;
    max-height: none;

  .history-workspace {

  .commit-list {

  .file-tree {

  .code-lines {

  .action-detail {

  .action-facts {

  }

.shared-list h3 {

.shared-list p {

.shared-list code {

.room-status {

.room-actions {

.room-gate {

.room-brand b, .remote-brand b {

.room-gate h1 {

.room-gate p {
  color: #71736d;
  font-size: 14px;

}
.room-gate label {
  display: grid;
  gap: 7px;
  margin-top: 25px;
  font-size: 12px;
}
.room-gate input {
  padding: 11px;
  border: 1px solid #c7c8c1;
  border-radius: 8px;
  font: 12px ui-monospace,monospace;
}
.room-gate button {
  width: 100%;
  margin-top: 12px;
  padding: 11px;
  border: 0;
  border-radius: 8px;

.remote-codex-shell {
  --r-bg: #fbfbf9;
  --r-chrome: #f1f1ed;
  --r-panel: #fff;
  --r-text: #262722;
  --r-muted: #777971;
  --r-line: #e3e3dd;
  --r-strong: #d5d5ce;
  --r-accent: #3f62d8;
  display: grid;
  grid-template-columns: 250px minmax(0,1fr);
  height: 100dvh;
  overflow: hidden;
  background: var(--r-chrome);
  color: var(--r-text);
  font-family: ui-sans-serif,system-ui,-apple-system,sans-serif;
}
.remote-sidebar {
  display: flex;
  min-height: 0;
  flex-direction: column;
  padding: 13px 10px 9px;
  border-right: 1px solid var(--r-line);
}
.remote-brand {
  display: flex;
  align-items: center;
  gap: 9px;
  height: 39px;
  padding: 0 7px 8px;
  font-size: 14px;
}
.shared-label {
  margin: 16px 9px 7px;
  color: var(--r-muted);
  font-size: 10px;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: .07em;
}
.remote-thread {
  display: grid;
  gap: 3px;
  width: 100%;
  padding: 10px 9px;
  border: 0;
  border-radius: 7px;
  background: rgb(38 39 34/8%);
  text-align: left;
}
.remote-thread span {
  overflow: hidden;
  font-size: 13px;
  font-weight: 550;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.remote-thread small {
  color: var(--r-muted);
  font-size: 10px;
}
.remote-sidebar footer {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: auto;
  padding: 10px 6px 0;
  border-top: 1px solid var(--r-line);
  color: var(--r-muted);
  font-size: 11px;
}
.remote-sidebar footer i,.remote-connection i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #b8423d;
  box-shadow: 0 0 0 3px rgb(184 66 61/12%);
}
.remote-sidebar footer.relay-online {
  color: #24623d;
}
.remote-sidebar footer.relay-online i,.remote-connection.online i {
  background: #2d8a55;

}
.remote-workspace {
  position: relative;
  display: grid;
  min-width: 0;
  grid-template-rows: auto auto minmax(0,1fr) auto;
  margin: 7px 7px 7px 0;
  overflow: hidden;
  border: 1px solid var(--r-line);
  border-radius: 11px;
  background: var(--r-bg);
  box-shadow: 0 8px 28px rgb(0 0 0/5%);
}
.remote-topbar {
  display: flex;
  min-height: 52px;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 0 17px;
  border-bottom: 1px solid var(--r-line);
}
.remote-topbar > div {
  display: grid;
  gap: 2px;
}
.remote-topbar strong {
  font-size: 13px;
}
.remote-topbar span {
  color: var(--r-muted);
  font: 9.5px ui-monospace,monospace;
}
.remote-topbar button {
  border: 0;
  background: transparent;
  color: var(--r-muted);
  font-size: 11px;
  cursor: pointer;
}
.remote-topbar-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.remote-connection {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #9e312a;
  font-size: 10px;
  font-weight: 650;
}
.remote-connection.online {
  color: #24623d;
}
.remote-error {
  padding: 8px 16px;
  border-bottom: 1px solid #edcbc8;
  background: #fff2f1;
  color: #a43832;
  font-size: 11px;
}
.remote-disconnected {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-bottom: 1px solid #edcbc8;
  background: #fff2f1;
  color: #8e312c;
  font-size: 11px;
}
.remote-disconnected strong {
  white-space: nowrap;
}
.remote-disconnected span {
  color: #a85a55;
}
.remote-notices:empty {
  display: none;
}
.remote-agent-access {
  margin: 10px 16px 0;
  padding: 9px 12px;
  border: 1px solid var(--r-line);
  border-radius: 8px;
  background: var(--r-panel);
  color: var(--r-muted);
  font-size: 11px;
}
.remote-agent-access summary {
  cursor: pointer;
  color: var(--r-text);
  font-weight: 600;
}
.remote-agent-access p {
  margin: 8px 0 6px;
}
.remote-agent-access code {
  display: block;
  overflow: auto;
  padding: 8px;
  border-radius: 6px;
  background: var(--r-chrome);
  color: var(--r-text);
  font: 9.5px/1.5 ui-monospace,monospace;
  white-space: nowrap;
}
.remote-conversation {
  min-height: 0;
  overflow-y: auto;
}
.remote-timeline {
  width: 100%;
  max-width: 820px;
  min-height: 100%;
  margin: 0 auto;
  padding: 28px 34px 30px;
}
.remote-empty {
  display: grid;
  min-height: 100%;
  align-content: center;
  justify-items: center;
  padding: 40px;
  text-align: center;
}
.remote-empty b {
  display: grid;
  width: 48px;
  height: 48px;
  place-items: center;
  border: 1px solid var(--r-strong);
  border-radius: 13px;
  background: white;
  color: var(--r-accent);
  font-size: 21px;
}
.remote-empty h2 {
  margin: 18px 0 8px;
  font: 620 27px ui-sans-serif,system-ui,sans-serif;
  letter-spacing: -.035em;
}
.remote-empty p {
  max-width: 430px;
  margin: 0;
  color: var(--r-muted);
  font-size: 14px;
  line-height: 1.55;
}
.timeline-label {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 22px;
  color: var(--r-muted);
  font-size: 9px;
  font-weight: 650;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.timeline-label i {
  height: 1px;
  flex: 1;
  background: var(--r-line);
}
.remote-history {
  margin-bottom: 30px;
}
.remote-history .remote-message {
  margin-bottom: 18px;
}
.remote-exchange {
  margin-bottom: 27px;
}
.remote-message {
  display: grid;
  grid-template-columns: 24px minmax(0,1fr);
  gap: 10px;
  margin-bottom: 21px;
}
.remote-message .message-mark {
  display: grid;
  width: 23px;
  height: 23px;
  place-items: center;
  border: 1px solid var(--r-line);
  border-radius: 7px;
  background: var(--r-panel);
  color: var(--r-muted);
  font-size: 9px;
}
.remote-message > div:last-child > span {
  color: var(--r-muted);
  font-size: 10px;
}
.remote-message p {
  margin: 4px 0 0;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.remote-user .message-mark {
  visibility: hidden;
}
.remote-history-user .message-mark {
  visibility: visible;
}
.remote-user > div:last-child {
  width: fit-content;
  max-width: min(86%,660px);
  justify-self: end;
  padding: 10px 13px;
  border-radius: 13px 13px 4px 13px;
  background: rgb(38 39 34/7%);
}
.remote-user small {
  display: block;
  margin-top: 6px;
  color: var(--r-muted);
  font-size: 9px;
}
.remote-attachments {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 9px;
}
.remote-attachments button {
  display: flex;
  align-items: center;
  gap: 7px;
  max-width: 260px;
  padding: 7px 9px;
  border: 1px solid var(--r-strong);
  border-radius: 8px;
  background: var(--r-panel);
  color: var(--r-text);
  text-align: left;
  cursor: pointer;
}
.remote-attachments button > b {
  display: grid;
  width: 19px;
  height: 19px;
  place-items: center;
  border-radius: 5px;
  background: var(--r-chrome);
  font-size: 11px;
}
.remote-attachments button > span {
  min-width: 0;
  overflow: hidden;
  font-size: 10px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.remote-attachments button small {
  margin: 1px 0 0;
  font-size: 8px;
  font-weight: 400;
}
.remote-failure {
  margin-left: 34px;
  padding: 8px 10px;
  border-left: 2px solid #b8423d;
  color: #a63832;
  font-size: 11px;
}
.remote-working {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 18px 0 0 34px;
  color: var(--r-muted);
  font-size: 12px;
}
.remote-working i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--r-accent);
  animation: pulse 1.4s ease-in-out infinite;
}
.remote-new-activity {
  position: absolute;
  z-index: 3;
  bottom: 137px;
  left: 50%;
  transform: translateX(-50%);
  padding: 7px 11px;
  border: 1px solid var(--r-strong);
  border-radius: 999px;
  background: var(--r-panel);
  color: var(--r-text);
  box-shadow: 0 5px 16px rgb(0 0 0/12%);
  font: 600 10px ui-sans-serif,system-ui,sans-serif;
  cursor: pointer;
}
.remote-new-activity span {
  margin-left: 3px;
  color: var(--r-accent);
}
.remote-composer-wrap {
  width: min(100%,860px);
  margin: 0 auto;
  padding: 0 20px 14px;
}
.pending-files {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 0 2px 8px;
}
.pending-files > span {
  display: grid;
  grid-template-columns: minmax(0,1fr) auto;
  gap: 1px 8px;
  min-width: 150px;
  max-width: 260px;
  padding: 7px 8px 7px 10px;
  border: 1px solid var(--r-strong);
  border-radius: 8px;
  background: var(--r-panel);
}
.pending-files b {
  overflow: hidden;
  font-size: 10px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pending-files small {
  color: var(--r-muted);
  font-size: 8px;
}
.pending-files button {
  grid-column: 2;
  grid-row: 1/3;
  align-self: center;
  border: 0;
  background: transparent;
  color: var(--r-muted);
  font-size: 16px;
  cursor: pointer;
}
.remote-composer {
  overflow: hidden;
  border: 1px solid var(--r-strong);
  border-radius: 13px;
  background: rgb(255 255 255/92%);
  box-shadow: 0 12px 34px rgb(0 0 0/9%),0 2px 8px rgb(0 0 0/5%);
}
.remote-composer textarea {
  display: block;
  width: 100%;
  min-height: 72px;
  max-height: 180px;
  resize: vertical;
  border: 0;
  outline: 0;
  padding: 13px 15px 6px;
  background: transparent;
  color: var(--r-text);
  font: 14px/1.5 ui-sans-serif,system-ui,sans-serif;
}
.remote-composer footer {
  display: flex;
  min-height: 42px;
  align-items: center;
  justify-content: space-between;
  padding: 5px 7px 7px 14px;
  color: var(--r-muted);
  font-size: 10px;
}
.remote-composer footer > div {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}
.remote-composer footer input[type="file"] {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.remote-composer button {
  border: 0;
  cursor: pointer;
}
.remote-composer .send-button {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border-radius: 8px;
  background: var(--r-text);
  color: var(--r-bg);
  font-size: 18px;
}
.remote-composer .attach-button {
  display: flex;
  align-items: center;
  gap: 5px;
  min-height: 29px;
  padding: 0 8px 0 5px;
  border-radius: 7px;
  background: var(--r-chrome);
  color: var(--r-text);
  font-size: 10px;
}
.remote-composer .attach-button b {
  display: grid;
  width: 20px;
  height: 20px;
  place-items: center;
  font-size: 16px;
  font-weight: 400;
}
.remote-composer button:disabled {
  opacity: .3;
  cursor: default;
}
.remote-composer-wrap > p {
  margin: 7px 0 0;
  color: #9c9e96;
  font-size: 9.5px;
  text-align: center;
}
@media (max-width:760px) {
  .multiplayer-connect,.share-builder {
    grid-template-columns: 1fr;
    padding: 20px;
  }
  .share-builder>div,.multiplayer-connect>p,.share-error {
    grid-column: 1;
  }
  .shared-list article {
    grid-template-columns: 1fr;
  }
  .room-actions {
    flex-wrap: wrap;
  }
  .remote-codex-shell {
    display: block;
  }
  .remote-sidebar {
    display: none;
  }
  .remote-workspace {
    height: 100dvh;
    margin: 0;
    border: 0;
    border-radius: 0;
  }
  .remote-timeline {
    padding: 22px 16px;
  }
  .remote-composer-wrap {
    padding: 0 10px max(10px,env(safe-area-inset-bottom));
  }
  .remote-user>div:last-child {
    max-width: 92%;
  }
  .remote-topbar-actions>button {
    display: none;
  }
  .remote-disconnected {
    align-items: flex-start;
    flex-direction: column;
    gap: 2px;
  }
  .remote-disconnected strong {
    white-space: normal;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
  }
}
.tester-page {
  width: min(1120px, calc(100% - 44px));
  margin: 0 auto;
  padding: 42px 0 90px;
}
.tester-header {
  max-width: 860px;
}
.tester-header h1 {
  margin: 14px 0 18px;
}
.tester-header p {
  max-width: 760px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 17px;
}
.tester-back {
  color: var(--ink);
  font-size: 18px;
  text-decoration: none;
}
.tester-back:hover {
  color: var(--blue);
}
.tester-kicker {
  display: inline-block;
  margin-left: 18px;
  padding: 5px 9px;
  border: 1px solid var(--ink);
  border-radius: 999px;
  font-family: system-ui;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.tester-connect {
  display: grid;
  grid-template-columns: minmax(240px, .75fr) minmax(300px, 1fr) auto;
  align-items: end;
  gap: 24px;
  margin-top: 46px;
  padding: 28px;
  border: 3px solid var(--ink);
  border-radius: 16px 12px 18px 13px;
  box-shadow: 4px 4px 0 var(--ink);
}
.tester-connect h2 {
  margin: 0 0 8px;
  font-size: 30px;
}
.tester-connect p {
  margin: 0;
  font-family: system-ui;
  font-size: 13px;
}
.tester-connect label, .tester-search, .tester-form label {
  display: grid;
  gap: 7px;
  font-family: system-ui;
  font-size: 13px;
}
.tester-connect label > div {
  display: flex;
}
.tester-connect input, .tester-search input, .tester-form input:not([type="checkbox"]), .tester-form select, .tester-form textarea {
  width: 100%;
  min-width: 0;
  padding: 10px 11px;
  border: 2px solid var(--ink);
  border-radius: 8px 6px 9px 7px;
  background: #fff;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
}
.tester-connect label button {
  padding: 0 12px;
  border: 2px solid var(--ink);
  border-left: 0;
  border-radius: 0 8px 8px 0;
  background: #f4f5f5;
  font-family: system-ui;
  font-size: 12px;
  cursor: pointer;
}
.tester-connect label input {
  border-radius: 8px 0 0 8px;
}
.tester-connect-button, .tester-run-row button {
  padding: 11px 15px;
  border: 2px solid var(--ink);
  border-radius: 9px 7px 10px 8px;
  background: var(--ink);
  color: #fff;
  font-family: system-ui;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.tester-connect-button:disabled, .tester-run-row button:disabled {
  opacity: .45;
  cursor: not-allowed;
}
.tester-error {
  grid-column: 1 / -1;
  padding: 10px 12px;
  border-left: 4px solid #c2362b;
  background: #fff0ed;
  color: #862218;
}
.tester-status {
  display: grid;
  grid-template-columns: repeat(3, 1fr) auto;
  align-items: stretch;
  margin: 40px 0 20px;
  border: 2px solid var(--ink);
  border-radius: 12px 9px 14px 10px;
  overflow: hidden;
}
.tester-status > div {
  display: grid;
  gap: 4px;
  padding: 16px 18px;
  border-right: 1px solid #aeb3b5;
}
.tester-status span {
  font-family: system-ui;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .05em;
}
.tester-status strong {
  font-size: 22px;
  font-weight: 400;
}
.tester-status button {
  padding: 0 18px;
  border: 0;
  background: #f2f3f4;
  font-family: system-ui;
  font-size: 12px;
  cursor: pointer;
}
.tester-truth {
  display: flex;
  align-items: baseline;
  gap: 20px;
  margin: 0 0 26px;
  padding: 13px 16px;
  border-left: 4px solid var(--blue);
  background: #f2f4ff;
}
.tester-truth strong {
  flex: 0 0 auto;
  font-size: 18px;
  font-weight: 400;
}
.tester-truth p {
  margin: 0;
  font-family: system-ui;
  font-size: 13px;
}
.tester-search {
  max-width: 420px;
  margin: 0 0 30px;
}
.tester-groups {
  display: grid;
  gap: 12px;
}
.tester-group {
  border-top: 3px solid var(--ink);
}
.tester-group:last-child {
  border-bottom: 3px solid var(--ink);
}
.tester-group > summary {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 40px;
  align-items: center;
  gap: 18px;
  padding: 19px 8px;
  cursor: pointer;
  list-style: none;
}
.tester-group > summary::-webkit-details-marker, .tester-action > summary::-webkit-details-marker {
  display: none;
}
.tester-group > summary > span {
  display: grid;
  gap: 5px;
}
.tester-group > summary strong {
  font-size: 28px;
  font-weight: 400;
}
.tester-group > summary small {
  color: #5e6366;
  font-family: system-ui;
  font-size: 13px;
}
.tester-group > summary em {
  padding: 5px 9px;
  border: 1px solid;
  border-radius: 999px;
  font-family: system-ui;
  font-size: 10px;
  font-style: normal;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.runtime-live, .runtime-connected {
  color: #24623d;
  background: #e8f6ed;
}
.runtime-local-only {
  color: #745d14;
  background: #fff7d8;
}
.tester-group > summary > b {
  font-family: system-ui;
  font-size: 16px;
  text-align: center;
}
.tester-actions {
  display: grid;
  gap: 9px;
  padding: 0 8px 22px 28px;
}
.tester-action {
  border: 2px solid var(--ink);
  border-radius: 11px 8px 12px 9px;
  background: #fff;
}
.tester-action > summary, .tester-action.unavailable > header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding: 15px 17px;
  cursor: pointer;
  list-style: none;
}
.tester-action > summary > span:first-child, .tester-action.unavailable header > span {
  display: grid;
  gap: 4px;
}
.tester-action strong {
  font-size: 20px;
  font-weight: 400;
}
.tester-action small {
  max-width: 760px;
  color: #5f6366;
  font-family: system-ui;
  font-size: 12px;
  line-height: 1.4;
}
.tester-action-meta {
  display: flex;
  gap: 6px;
  flex: 0 0 auto;
}
.tester-action em {
  padding: 4px 7px;
  border: 1px solid #a3a7a9;
  border-radius: 999px;
  font-family: system-ui;
  font-size: 9px;
  font-style: normal;
  white-space: nowrap;
}
.tester-action[open] {
  box-shadow: 3px 3px 0 var(--ink);
}
.tester-action[open] > summary {
  border-bottom: 1px solid #b8bcbe;
}
.tester-form {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  padding: 18px;
  background: #fafafa;
}
.tester-form label > span:first-child {
  font-weight: 650;
}
.tester-form label small {
  color: #63686a;
  line-height: 1.35;
}
.tester-form label b {
  color: #a52920;
}
.tester-form textarea {
  min-height: 90px;
  resize: vertical;
}
.tester-checkbox, .tester-approval {
  grid-template-columns: auto minmax(0, 1fr);
  align-items: start;
}
.tester-checkbox input, .tester-approval input {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: var(--blue);
}
.tester-approval {
  grid-column: 1 / -1;
  padding: 12px;
  border: 1px dashed var(--ink);
  background: #fff8dc;
}
.tester-no-input {
  grid-column: 1 / -1;
  margin: 0;
  color: #666;
  font-family: system-ui;
  font-size: 13px;
}
.tester-run-row {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 16px;
}
.tester-run-row code {
  color: #656a6d;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
}
.tester-result {
  grid-column: 1 / -1;
  min-width: 0;
  border: 2px solid;
  border-radius: 9px;
  overflow: hidden;
  background: #fff;
}
.tester-result.passed {
  border-color: #2d7549;
}
.tester-result.failed {
  border-color: #b23b30;
}
.tester-result header {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 9px 12px;
  font-family: system-ui;
  font-size: 12px;
}
.tester-result.passed header {
  background: #eaf7ef;
}
.tester-result.failed header {
  background: #fff0ed;
}
.tester-result pre {
  max-height: 360px;
  margin: 0;
  padding: 14px;
  overflow: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.tester-action.unavailable {
  opacity: .7;
  background: #f5f5f3;
}
.tester-action.unavailable > header {
  cursor: default;
}
.tester-action.unavailable > code {
  display: block;
  padding: 0 17px 14px;
  color: #666;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
}
@media (max-width: 780px) {
  .tester-page {
    width: min(100% - 28px, 1120px);
    padding-top: 24px;
  }
  .tester-kicker {
    display: block;
    width: max-content;
    margin: 16px 0 0;
  }
  .tester-connect {
    grid-template-columns: 1fr;
    padding: 20px;
  }
  .tester-status {
    grid-template-columns: 1fr 1fr;
  }
  .tester-status > div {
    border-bottom: 1px solid #aeb3b5;
  }
  .tester-status button {
    min-height: 48px;
  }
  .tester-truth {
    display: grid;
    gap: 7px;
  }
  .tester-group > summary {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .tester-group > summary > b {
    display: none;
  }
  .tester-actions {
    padding-left: 0;
  }
  .tester-action > summary, .tester-action.unavailable > header {
    display: grid;
  }
  .tester-form {
    grid-template-columns: 1fr;
  }
  .tester-approval, .tester-run-row, .tester-result, .tester-no-input {
    grid-column: 1;
  }
  .tester-run-row {
    align-items: flex-start;
    flex-direction: column;
  }
}
.toolbox-sign-in,.toolbox-access-denied,.toolbox-auth-loading {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  text-align: center;
  background: #fff;
  color: #202124;
}
.toolbox-sign-in h1,.toolbox-access-denied h1 {
  font-family: var(--font-sketch,system-ui,sans-serif);
  font-size: clamp(2rem,6vw,4rem);
  letter-spacing: -.04em;
  margin: .5rem 0;
}
.toolbox-sign-in>p,.toolbox-access-denied>p {
  color: #62666a;
  margin: 0 0 1.5rem;
}
.toolbox-sign-in-mark {
  border: 3px solid currentColor;
  border-radius: .7rem;
  padding: 1rem 1.4rem;
  font: 700 1.5rem/1 ui-monospace,monospace;
  transform: rotate(-1deg);
  margin-bottom: 1rem;
}
.external-auth-page {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: clamp(24px, 5vw, 72px);
  background: #f4f7f9;
  color: #111c24;
  font-family: Inter, Arial, Helvetica, sans-serif;
}
.external-auth-card {
  width: min(100%, 430px);
  margin: auto;
}
.toolbox-auth-card {
  display: grid;
  place-items: center;
}
.boxwood-auth-card {
  display: block;
  padding: clamp(24px, 4vw, 38px);
  border: 1px solid #d3dde2;
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 24px 70px rgba(17, 28, 36, 0.12);
}
.boxwood-auth-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
  color: #111c24;
  font-size: 24px;
  font-weight: 750;
  letter-spacing: -0.025em;
}
.boxwood-auth-brand img {
  width: 46px;
  height: 46px;
  border-radius: 11px;
}
.boxwood-auth-card > h1 {
  margin: 0 0 10px;
  font-family: Inter, Arial, Helvetica, sans-serif;
  font-size: clamp(28px, 4vw, 34px);
  font-weight: 720;
  line-height: 1.12;
  letter-spacing: -0.035em;
}
.boxwood-auth-card > p {
  margin: 0 0 28px;
  color: #667780;
  font-size: 15px;
  line-height: 1.55;
}
.boxwood-auth-back {
  display: block;
  width: max-content;
  margin: 24px auto 0;
  color: #526670;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
}
.boxwood-auth-back:hover,
.boxwood-auth-back:focus-visible {
  color: #075078;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.boxwood-consent-card {
  padding-top: 30px;
}
@media (max-width: 520px) {
  .external-auth-page {
    align-items: start;
    padding: 18px;
  }
  .boxwood-auth-card {
    margin-top: 18px;
    padding: 24px 20px;
    border-radius: 16px;
  }
  .boxwood-auth-brand {
    margin-bottom: 22px;
  }
}
.toolbox-user-button {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 200;
}
.source-editor {
  display: flex;
  flex-direction: column;
  min-height: 560px;
}
.source-editor textarea {
  flex: 1;
  min-height: 460px;
  width: 100%;
  resize: vertical;
  border: 0;
  border-top: 1px solid var(--line,#d8d2c6);
  padding: 16px;
  background: #171717;
  color: #f4f1e8;
  font: 13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
  tab-size: 2;
  outline: none;
}
.commit-bar {
  display: flex;
  gap: 10px;
  padding: 12px;
  border-top: 1px solid #343434;
  background: #f7f3e9;
}
.commit-bar input {
  flex: 1;
  min-width: 0;
  border: 1px solid #b9b09e;
  border-radius: 6px;
  padding: 10px 12px;
  background: white;
  color: #202020;
}
.commit-bar button {
  border: 1px solid #1e5331;
  border-radius: 6px;
  padding: 9px 14px;
  background: #24663c;
  color: white;
  font-weight: 700;
  cursor: pointer;
}
.commit-bar .delete-code {
  border-color: #843d35;

.commit-bar button:disabled {

.code-notice {
