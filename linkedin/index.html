/* ── why a warming prospect is stuck, in words the operator can act on ──────────────────────────
   The raw string is a Unipile 422 body. Nobody should have to read JSON to find out that a
   prospect can't be invited, and until now the UI showed nothing at all: a permanently-refused
   row just sat on deck looking like it was waiting its turn. Returns null when nothing's wrong. */
function queueBlocker(p){
  if(p.queueDropped) return null;                       /* already removed — shown elsewhere */
  const raw=(p.sendLastError||p.resolveLastError||"")+"";
  const has=k=>raw.indexOf(k)>=0;
  if(!p.resolved){
    if((p.resolveAttempts||0)>=5) return {
      kind:"unreachable",
      short:"LinkedIn profile can't be reached",
      why: has("invalid_recipient")||has("locked")
        ? "Their profile is locked or private, so LinkedIn won't let us look it up. Nothing on our side will fix this."
        : has("404")||has("not_found")
        ? "There's no LinkedIn profile at the address we have for them."
        : "We tried five times and LinkedIn never returned their profile.",
      fix:"Remove them — nothing can be sent to a profile we can't look up."};
    return null;                                        /* still legitimately in flight */
  }
  if((p.sendFailCount||0)>=5) return {
    kind:"parked",
    short:"LinkedIn keeps refusing the request",
    why: has("already_invited_recently")
      ? "You withdrew an earlier connection request to them. LinkedIn blocks re-inviting the same person for about three weeks after a withdrawal."
      : has("cannot_resend_yet")
      ? "LinkedIn won't accept another connection request to them yet — one went out to them too recently."
      : has("invalid_recipient")||has("locked")
      ? "Their profile is locked or private, so LinkedIn won't deliver a request to it."
      : "Five connection requests in a row were rejected by LinkedIn.",
    fix:"They've been taken out of the queue, so they're no longer holding up anyone else. Remove them for good, or put them back to try again."};
  if((p.sendFailCount||0)>0) return {
    kind:"failing",
    short:(p.sendFailCount)+" rejected attempt"+(p.sendFailCount!==1?"s":""),
    why:"LinkedIn has turned down the connection request "+p.sendFailCount+" time"+(p.sendFailCount!==1?"s":"")
        +" so far. After five it stops trying.",
    fix:""};
  return null;
}
function blockerCell(p,b){
  return `<span class="soak wait">${b.kind==="failing"?"⚠️":"⛔"} ${esc(b.short)}</span>
    <span class="muted" style="font-size:11.5px;margin-left:6px">${esc(b.why)}${b.fix?" "+esc(b.fix):""}</span>`;
}
/* Remove one prospect from the connect queue. LOCAL ONLY — nothing is sent to or withdrawn from
   LinkedIn; it stops US from queuing them. They keep their whole history and can be put back. */
async function dropFromQueue(id){
  const p=personById(id); if(!p) return;
  const b=queueBlocker(p);
  if(!confirm("Remove "+(p.fn||p.name)+" from the connect queue?\n\n"
    +(b?b.why+"\n\n":"")
    +"No connection request will be sent to them, and the automatic profile-view warm-up will skip them.\n\n"
    +"Nothing happens on LinkedIn — this only stops us queuing them. They stay in Connections with "
    +"their full history, and you can put them back any time.")) return;
  const r=await api("/api/person/"+id+"/queue-drop",{reason:b?b.short:"removed by hand"});
  if(!r||!r.ok){toast((r&&r.error)||"Could not remove them — the engine may be down.","err");return;}
  toast((p.fn||p.name)+" removed from the queue","ok");
  const d=await api("/api/bootstrap"); if(applyBootstrap(d))render();
}
async function restoreToQueue(id){
  const p=personById(id); if(!p) return;
  const r=await api("/api/person/"+id+"/queue-drop",{restore:true});
  if(!r||!r.ok){toast((r&&r.error)||"Could not put them back.","err");return;}
  toast((p.fn||p.name)+" is back on deck","ok");
  const d=await api("/api/bootstrap"); if(applyBootstrap(d))render();
}
/* LinkedIn refuses a fresh connection request for roughly three weeks after you withdraw one.
   This is LinkedIn's rule, not ours — we count forward from the withdrawal so the list can say
   "available" instead of leaving the operator to guess and burn a rejected send finding out. */
const RECONNECT_COOLDOWN_DAYS=21;
function reconnectState(p){
  /* No stamp = the tag was applied by hand rather than by the Withdraw button. We can't count a
     cooldown we never saw start, so say so instead of implying the window has passed. */
  if(!p.withdrawnAt) return {ready:true, daysLeft:0, dateless:true,
    label:"no withdrawal date on record"};
  const left=RECONNECT_COOLDOWN_DAYS-daysSince(p.withdrawnAt);
  return left<=0
    ? {ready:true, daysLeft:0, label:"✓ available to reconnect"}
    : {ready:false, daysLeft:left, label:"⏳ "+left+" day"+(left!==1?"s":"")+" until LinkedIn will accept a new request"};
}
/* The ONLY way out of 'withdrawn', and deliberately one person at a time — the operator's rule is that a
   prospect whose invitation was pulled is never re-invited automatically. No bulk version exists. */
async function reconnectProspect(id){
  const p=personById(id); if(!p) return;
  const rc=reconnectState(p);
  if(!confirm("Put "+(p.fn||p.name)+" back on deck?\n\n"
    +(rc.dateless
      ? "We have no record of when their request was withdrawn, so we can't tell whether LinkedIn will accept a new one yet. "
        +"If it was pulled within the last "+RECONNECT_COOLDOWN_DAYS+" days, the send will be rejected."
      : rc.ready
      ? "You withdrew their connection request "+daysSince(p.withdrawnAt)+" days ago, so LinkedIn should accept a fresh one now."
      : "WARNING: you withdrew their request only "+daysSince(p.withdrawnAt)+" days ago. LinkedIn blocks a new request for about "
        +RECONNECT_COOLDOWN_DAYS+" days, so it will most likely be rejected for another "+rc.daysLeft+" day"+(rc.daysLeft!==1?"s":"")+".")
    +"\n\nThey rejoin the queue in their original place and the auto-sender will invite them again when their turn comes.")) return;
  const r=await api("/api/person/"+id+"/reconnect",{});
  if(!r||!r.ok){toast((r&&r.error)||"Could not put them back.","err");return;}
  toast((p.fn||p.name)+" is back on deck","ok");
  const d=await api("/api/bootstrap"); if(applyBootstrap(d))render();
}
/* The auto-withdraw sweep's ACTUAL state, read from the server rather than asserted in copy.
   Both banners below used to state flatly that nothing withdraws stale invites — true when written,
   and believed, which is how 201 invites piled up past 30 days. Now that a worker exists the same
   hard-coded sentence would be a lie in the other direction, so both read this instead. Returns
   null if the server didn't report (old build / bootstrap hiccup) — callers fall back to silence
   rather than guessing. */
function withdrawSweep(){
  const w=(window.__META||{}).withdrawQueue;
  if(!w) return null;
  const rate=w.dailyLimit||0;
  const daysToClear=rate>0?Math.ceil(w.due/rate):null;
  return Object.assign({}, w, {
    running: w.enabled && !w.dryRun,
    /* one sentence, in the tense that matches reality */
    line: !w.enabled
      ? "Automatic withdrawal is <b>switched off</b> — every withdrawal is a button you press."
      : w.dryRun
      ? "Automatic withdrawal is <b>in test mode</b>: it picks the list each run and reports it, but <b>withdraws nothing</b>. Turn off test mode in Funnel settings to let it act."
      : `Automatic withdrawal is <b>on</b> — up to <b>${rate}/day</b>, oldest first`
        + (w.doneToday?`, <b>${w.doneToday}</b> so far today`:"")
        + (daysToClear&&w.due?`. At this rate the current backlog clears in about <b>${daysToClear} day${daysToClear!==1?'s':''}</b>`:"")
        + ".",
    daysToClear});
}
function warmChecklist(p){
  const steps=[["viewed","👁 Viewed profile"],["commented","💬 Commented"],["liked","👍 Liked a post"]];
  const av=settings.view_enabled&&p.viewState==="enrolled"
    ? `<span class="warmstep" title="Automated profile-view warm-up — the view worker viewed this profile ${p.viewCount||0}× so far" style="background:#eef1ff;border-color:#cdd6f5;color:var(--accent);cursor:default">🤖 auto-views ×${p.viewCount||0}</span>` : "";
  return `<div class="warm">${av}${steps.map(([k,l])=>`<span class="warmstep ${p.warm[k]?'done':''}" onclick="toggleWarm(${p.id},'${k}')">${p.warm[k]?'✓ ':''}${l}</span>`).join("")}</div>`;
}
function toggleWarm(id,k){snapshot("warm-up step");const p=personById(id);p.warm[k]=!p.warm[k];renderProspects();}
/* A prospect promoted in the Outreach Engine syncs straight in as "warming", lands at the BOTTOM
   of the on-deck list (addedAt=today = newest), and immediately kicks off the automatic LinkedIn
   profile / provider-id resolution — no manual queue step. */
function simulatePromotion(){snapshot("promotion synced");
  const p=mkPerson("warming",{addedAt:TODAY}); p.resolved=false; p.warm={viewed:false,commented:false,liked:false};
  toast(p.fn+" synced from the Outreach Engine — resolving their LinkedIn profile…");
  render(); resolveProfile(p.id);}
/* Auto-resolve the LinkedIn provider-id (mocked Unipile lookup). Until it lands the prospect can't be warmed or sent. */
function resolveProfile(id){setTimeout(()=>{const p=personById(id); if(!p||p.resolved)return;
  p.resolved=true; p.providerId="ACwAA"+((p.id*2654435761)>>>0).toString(36);
  toast(p.fn+"'s profile resolved — on deck and warming","ok");
  if(ST.tab==="prospects")renderProspects();},1600);}
async function sendRequest(id){const p=personById(id);if(!p)return;
  if(window.__LIVE){const r=await api("/api/person/"+id+"/send-invite",{});
    if(!r||!r.ok){toast((r&&r.error)||"Send failed — no request sent to LinkedIn","err");return;}}
  snapshot("send request");p.stage="request_sent";p.requestSentAt=TODAY;toast("👋 Connection request sent to "+p.fn,"ok");render();}
/* Withdraw one pending connection request. A REAL LinkedIn call — hence the explicit confirm and
   the await: this is not a bookkeeping move.

   FIXED 2026-08-24. This used to warn that withdrawing re-queued the person for an automatic
   re-invite that LinkedIn would reject — it did, and it cost person 4552 nine hundred and fifty-one
   rejected calls. /api/person/<id>/withdraw now also applies the BLOCKING 'withdrawn' tag, so the
   auto-sender and the view worker both skip them permanently. Re-inviting is a deliberate click on
   the Withdrawn card and nothing else. */
async function withdrawRequest(id){const p=personById(id);if(!p)return;
  const d=daysSince(p.requestSentAt);
  if(!confirm("Withdraw the connection request to "+p.fn+"?\n\n"
    +"Sent "+d+" day"+(d!==1?"s":"")+" ago. This is a REAL action on LinkedIn — the pending invite disappears from their side.\n\n"
    +"They then move to the \u201cWithdrawn\u201d list and are OUT of the automatic queue: nothing will re-invite them, "
    +"and the profile-view warm-up stops too. They keep their full history, and the list tells you when LinkedIn "
    +"would accept a fresh request (about "+RECONNECT_COOLDOWN_DAYS+" days) if you ever want to try again."))return;
  const r=await api("/api/person/"+id+"/withdraw",{});
  if(!r||!r.ok){toast((r&&r.error)||"Withdraw failed — the invite is still pending on LinkedIn.","err");return;}
  toast("Withdrew the request to "+p.fn+" — moved to Withdrawn, not being re-invited","ok");
  const d2=await api("/api/bootstrap"); if(applyBootstrap(d2))render();}
function markAccepted(id){snapshot("mark accepted");const p=personById(id);p.stage="accepted";p.connectedAt=TODAY;p.tags.push("in-intro-funnel");toast(p.fn+" accepted — now in Pipeline","ok");render();}

/* ============================ PIPELINE (post-connection state machine) ============================ */
/* Pipeline membership, defined ONCE so the tab badge and the board can never disagree: carried in
   through the prospect funnel, not blocked by a tag, not exited, and still pre-graduation. The badge
   used to count every accepted/intro_sent person — i.e. the whole 1st-degree network (~4,578) — which
   made it read as a connection count sitting on the wrong tab. */
function inPipelineNow(p){return p.tags.includes("in-intro-funnel")&&!personBlocked(p)
  &&!p.funnelExited&&(p.stage==="accepted"||p.stage==="intro_sent");}

/* ---- ADD BY HAND: the second way into the pipeline -------------------------------------------
   The invite funnel is not the only way people arrive. Some connect unprompted — an inbound invite
   accepted, a referral, someone who read a post — and until this existed they had NO route onto the
   board: membership is the in-intro-funnel tag, and the only things that wrote it were the funnel
   itself and the stage-move control, which only exists on a card already ON the board. So a
   connection who never rode the funnel could never be worked through the intro sequence at all.

   Adding SENDS NOTHING. It seats them in the first column owing an intro; every message still
   leaves only when the operator presses Send on the card. */
function pipelineAddable(p){return (p.stage==="accepted"||p.stage==="intro_sent")&&!inPipelineNow(p);}
/* Why they CAN'T be added, in the order the server checks — so the chip's tooltip and the server's
   refusal always give the same reason. null = nothing in the way. */
function pipelineBlockReason(p){
  if(p.disconnectedAt)return "They're no longer connected — messages to them will fail.";
  const b=blockingTagsOf(p);
  if(b.length&&!p.overrideEligibility)return "Tagged "+b.join(" + ")+", which keeps them off the board.";
  return null;
}
/* One path for one person and for a bulk selection, so the two can't drift. Optimistic local
   update + one request; a server refusal is surfaced and rolled back, never swallowed. */
function addToPipeline(ids,force){
  ids=(ids||[]).filter(id=>{const p=personById(id);return p&&pipelineAddable(p);});
  if(!ids.length){toast("Nothing to add — they're already in the pipeline.","warn");return;}
  const hard=ids.map(personById).filter(p=>pipelineBlockReason(p));
  if(hard.length&&!force){
    const one_=hard.length===1;
    const msg=one_?(hard[0].name+": "+pipelineBlockReason(hard[0])+"\n\nAdd them anyway?")
      :(hard.length+" of the "+ids.length+" selected can't go on the board as they are:\n\n"
        +hard.slice(0,8).map(p=>"• "+p.name+" — "+pipelineBlockReason(p)).join("\n")
        +(hard.length>8?"\n• …and "+(hard.length-8)+" more":"")
        +"\n\nAdd them anyway? (this allows outbound to them)");
    if(!confirm(msg)){                       // add only the clean ones
      const clean=ids.filter(id=>!pipelineBlockReason(personById(id)));
      if(!clean.length){toast("Nothing added.","warn");return;}
      return addToPipeline(clean,false);
    }
    force=true;
  }
  snapshot("add to pipeline");
  const root=rootFunnel().id;
  ids.forEach(id=>{const p=personById(id);
    if(!p.tags.includes("in-intro-funnel"))p.tags.push("in-intro-funnel");
    if(!p.tags.includes("manual-add"))p.tags.push("manual-add");
    if(force&&blockingTagsOf(p).length&&!p.overrideEligibility){
      p.overrideEligibility=true; p.overrideCampaignTag=p.overrideCampaignTag||"manual-add";}
    p.funnelId=root; p.funnelExited=false; p.exitReason=null;
    if(p.stage==="accepted")p.fuStep=-1;
    p.cohort="funnel"; p.cohortOverride="funnel";});
  const names=ids.map(id=>personById(id).fn||personById(id).name);
  ST.sel.clear();
  /* toast() writes textContent — escaping here would print O&#39;Brien */
  toast(ids.length===1?(names[0]+" → Pipeline · owe them an intro")
                      :(ids.length+" added to the Pipeline"),"ok");
  render();
  if(!window.__LIVE)return;
  /* On failure, re-read from the server rather than undo(): by the time the response lands the operator may
     have done something else, and undo() would roll THAT back instead. Bootstrap is authoritative. */
  api("/api/people/add-to-pipeline",{ids,force}).then(r=>{
    if(!r||!r.ok){
      toast("Couldn't save that: "+((r&&r.error)||"the engine refused it")+" — reloading from the engine.","warn");
      return api("/api/bootstrap").then(d=>{if(applyBootstrap(d))render();});}
    if(r.nSkipped){
      toast("Not added — "+r.skipped.map(s=>s.name+": "+s.reason).join(" · "),"warn");
      return api("/api/bootstrap").then(d=>{if(applyBootstrap(d))render();});}
  });
}
/* Undo an add. NOT the same as Exit: exit records that a conversation ended and keeps them in the
   board's exited drawer; this is "I put them there by mistake" and leaves no trace in the metrics. */
function removeFromPipeline(id){const p=personById(id);if(!p)return;
  if(!confirm("Take "+p.fn+" off the pipeline board? They stay a connection — nothing is deleted, and no message has been sent."))return;
  snapshot("remove from pipeline");
  p.tags=p.tags.filter(t=>t!=="in-intro-funnel"&&t!=="manual-add");
  /* Dropping the override hands them back to the server's generated cohort rule. Recompute it here
     rather than defaulting to 'funnel' (isFunnel treats a missing cohort as funnel), or removing a
     hand-added person would leave them counted in the funnel metrics until the next reload. The
     server's rule also tests `source`, which /bootstrap doesn't ship; a synced-in prospect always
     carries requestSentAt or a pre-connection stage, so this agrees in practice and the next
     bootstrap is authoritative either way. */
  if(p.cohortOverride==="funnel"){p.cohortOverride=null;
    p.cohort=(p.requestSentAt||p.introSentAt||["warming","request_sent"].includes(p.stage))?"funnel":"preexisting";}
  /* undo only the eligibility override the forced add set (stamped 'manual-add'), never one the operator
     set himself — otherwise outbound stays open to a personal/client contact who is off the board */
  if(p.overrideCampaignTag==="manual-add"){p.overrideEligibility=false;p.overrideCampaignTag=null;}
  persist("/api/people/remove-from-pipeline",{ids:[id]});
  toast(p.fn+" removed from the Pipeline");render();}
/* ---- manual "Sync now" ----------------------------------------------------------------------
   The pipeline hovercards read a LOCAL mirror that refreshes on a ~30-min schedule; this pulls it
   NOW so the operator can refresh, then process everyone in one pass without a just-sent message showing as
   un-sent. Non-instant (~1 min), so it obeys the async-action-feedback rule: press ack, elapsed
   ticker, explicit error + retry, never a silent hang. */
let _sync={status:"idle",startedAt:0,error:"",mirror:null};
let _syncTick=null;
function _syncElapsed(){if(!_sync.startedAt)return"";
  const s=Math.max(0,Math.floor((Date.now()-_sync.startedAt)/1000));
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;}
/* Two different pulls with two different clocks. Chats/messages CANNOT discover a new connection —
   that's the relations list, a separate Unipile endpoint — so a "Sync now" that only pulls messages
   looks broken when you press it on the Connections tab and nobody new appears. Each bar reports the
   freshness of the thing IT pulls. */
function _syncMirrorLabel(mode){const m=_sync.mirror; if(!m)return"";
  const raw=(mode==="connections")?m.connectionsSyncedAt:m.lastSyncedAt;
  if(!raw)return"";
  const t=String(raw).replace("T"," ").slice(11,16);
  return t?`synced through ${t} UTC`:"";}
/* mode: 'messages' (pipeline bar) | 'connections' (Connections bar). A run started from one bar is
   visible in the other — same in-flight job — so neither can be double-fired. */
function syncBar(mode){
  mode=mode||"messages";
  const mine=(_sync.mode||"messages")===mode;
  if(_sync.status==="pending")return `<div class="syncbar working">
    <span class="spin"></span> ${mine?(mode==="connections"?"Pulling your connections from LinkedIn…":"Syncing LinkedIn messages…")
      :"A LinkedIn sync is already running…"} <span id="synctick" class="mono">${_syncElapsed()}</span>
    <span class="syncnote">${mode==="connections"?"a full pass over ~"+(people.filter(p=>["accepted","intro_sent"].includes(p.stage)).length).toLocaleString()+" connections takes about a minute":""}</span></div>`;
  if(_sync.status==="error"&&mine)return `<div class="syncbar err">
    <span>⚠ ${esc(_sync.error||"Sync failed.")}</span>
    <button class="btn sm" onclick="runSync('${mode}')">↻ Try again</button></div>`;
  const done=_sync.status==="done"&&mine;
  return `<div class="syncbar">
    <button class="btn ghost sm" onclick="runSync('${mode}')" title="${mode==="connections"
      ? "Pull your connection list from LinkedIn right now — anyone who connected since the last pass appears here when it finishes."
      : "Pull the latest LinkedIn messages now so every card is up to date before you send"}">⟳ ${mode==="connections"?"Sync connections now":"Sync now"}</button>
    <span class="syncnote">${done?"✓ "+esc(_syncMirrorLabel(mode)||"up to date"):esc(_syncMirrorLabel(mode))}${
      mode==="connections"?' <span class="muted">· runs automatically every 30 min</span>'+providerGapNote():''}</span></div>`;}
/* Why this tab's count sits UNDER the number LinkedIn's own My Network page shows.
   Measured 2026-08-01: LinkedIn said 4,770, the provider returned 4,592 — a 178-person gap that
   is NOT a truncated sync (walks at page size 100 and 250 both end naturally on exactly 4,592, and
   the provider returns short pages, dropping individual records it can't resolve). Those are closed,
   restricted and anonymised accounts that LinkedIn still counts and the API will not hand over.
   Stated inline because the alternative is re-deriving it from scratch every time the two are
   compared — which is exactly how a working sync got reported as broken. */
function providerGapNote(){
  const m=_sync.mirror, seen=m&&m.connectionsSeen;
  if(!seen)return"";
  return ` <span class="muted" title="LinkedIn's My Network page counts connections the API will not return — accounts that are closed, restricted, or shown as 'LinkedIn Member'. The gap is normally a few percent and is not a sync failure. Anyone who connects with you recently DOES come through.">· LinkedIn handed us <b>${seen.toLocaleString()}</b> ⓘ</span>`;}
function _startSyncTick(){if(_syncTick)return;
  _syncTick=setInterval(()=>{if(_sync.status!=="pending"){clearInterval(_syncTick);_syncTick=null;return;}
    const el=document.getElementById("synctick");if(el)el.textContent=_syncElapsed();},1000);}
function _paintSync(){if(ST.tab==="pipeline")renderPipeline();else if(ST.tab==="connections")renderConnections();}
function runSync(mode){
  mode=mode||"messages";
  if(_sync.status==="pending")return;                         // re-entrancy guard
  _sync={status:"pending",startedAt:Date.now(),error:"",mirror:_sync.mirror,mode};
  _paintSync();_startSyncTick();
  if(!window.__LIVE){                                          // static/mock: simulate a short sync
    setTimeout(()=>{_sync={status:"done",startedAt:0,error:"",mode,
      mirror:{lastSyncedAt:new Date().toISOString(),connectionsSyncedAt:new Date().toISOString(),messages:0,chats:0}};_paintSync();
      toast("Mirror refreshed","ok");},1400);return;}
  api("/api/sync/now",{mode}).then(r=>{
    if(!r||!r.ok){_sync={status:"error",startedAt:0,error:(r&&r.error)||"The server refused the sync.",mode};_paintSync();return;}
    pollSync();
  }).catch(e=>{_sync={status:"error",startedAt:0,error:"Network error: "+e,mode};_paintSync();});}
function pollSync(){
  if(_sync.status!=="pending")return;_startSyncTick();
  api("/api/sync/status").then(r=>{
    if(!r||!r.ok){setTimeout(pollSync,2500);return;}           // transient blip → keep trying
    if(r.running){setTimeout(pollSync,2500);return;}
    if(r.idle){_sync={status:"error",startedAt:0,error:"The sync was interrupted (the engine may have restarted). Try again.",mode:_sync.mode};_paintSync();return;}
    if(r.syncOk===false||r.error){_sync={status:"error",startedAt:0,error:r.error||"Sync did not complete. Try again.",mirror:r.mirror,mode:_sync.mode};_paintSync();return;}
    // success → pull the freshly-synced data in and re-render
    const wasMode=_sync.mode, before=people.filter(p=>["accepted","intro_sent"].includes(p.stage)).length;
    _sync={status:"done",startedAt:0,error:"",mirror:r.mirror,mode:wasMode};
    api("/api/bootstrap").then(d=>{if(applyBootstrap(d)){render();}else{_paintSync();}
      if(wasMode==="connections"){
        /* Say the number either way. "0 new" is the answer to "is this thing even syncing?" —
           silence there is what makes a working sync look broken. */
        const now=people.filter(p=>["accepted","intro_sent"].includes(p.stage)).length, add=now-before;
        toast(add>0?(add+" new connection"+(add!==1?"s":"")+" pulled in")
                   :"Connections up to date — nothing new since the last pass.","ok");return;}
      const n=(r.summary||"").match(/(\d+)\s+synced/g);
      toast("Synced"+(n?" — "+n.join(", "):"")+".","ok");});
  }).catch(()=>{setTimeout(pollSync,2500);});}
function renderPipeline(){
  /* 4 columns: Connected (owe an intro) → Intro sent → Follow-up 1 → Follow-up 2.
     Post-intro people are bucketed by fu_step. There is NO "Follow-up 3" column: sending follow-up 3
     is the LAST touch, so it GRADUATES the person out of the pipeline (drops the in-intro-funnel tag)
     — they become a regular connection, still visible + filterable in the Connections tab. */
  /* Pipeline membership = the in-intro-funnel tag: only contacts who came through the Prospect
     funnel and connected (NOT the whole 1st-degree network). "Connected — owe an intro" = accepted
     AND in-intro-funnel; the intro/follow-up columns are always in-funnel by construction. */
  /* A blocking tag (omit / personal / client / do-not-pitch) drops someone from the pipeline —
     tagging "omit" removes them here, unless outbound is explicitly overridden for them. */
  const inFunnel=p=>inPipelineNow(p);
  /* Columns come from the SELECTED funnel's stages, so adding a 6th follow-up adds a column and a
     branch funnel gets its own board. The final stage has no column: sending it graduates them. */
  const fid=(funnelById(ST.pipeFunnel)?ST.pipeFunnel:rootFunnel().id); ST.pipeFunnel=fid;
  const f=funnelById(fid), ss=stagesOf(fid), onF=p=>(p.funnelId||rootFunnel().id)===fid;
  /* First column = people who OWE the funnel's opening touch. On the root that's "connected but
     no intro yet"; on a branch it's whoever was just diverted here (fuStep -1 = nothing sent in
     THIS funnel), who would otherwise render in no column at all. */
  const cols=[f.isRoot
      ? {label:"Connected — owe an intro", list:people.filter(p=>p.stage==="accepted"&&inFunnel(p))}
      : {label:"Diverted here — owe "+(ss[0]?ss[0].label:"a reply"),
         list:people.filter(p=>onF(p)&&(p.fuStep==null||p.fuStep<0)&&!p.funnelExited&&!personBlocked(p))}]
    /* `!!nextStageOf(p)` is what makes a SHORT campaign graduate on time. The columns are indexed by
       funnel stage, so a 3-message campaign inside a 5-stage funnel used to leave people parked in
       "Follow-up 2 sent" with a Send button for a stage their campaign has no message at. Finishing
       a campaign now removes them from the board exactly like finishing the funnel does. */
    .concat(ss.slice(0,-1).map((st,i)=>({label:st.label+" sent",
      list:people.filter(p=>p.stage==="intro_sent"&&onF(p)&&p.fuStep===i&&!personBlocked(p)&&!p.funnelExited&&!!nextStageOf(p))})));
  /* Exiting is the point at which a real conversation started, so the card should leave the board —
     it was still sitting in its old column wearing an "exited" pill, which reads as "still queued".
     Kept reachable in a drawer instead of vanishing, because exiting by accident is one click. */
  /* Only the CLOSED ones belong in this drawer. Promoted people left for the Follow-up tab and
     showing them here as "exited" would bury the exact conversations worth chasing. */
  const exited=people.filter(p=>p.funnelExited&&onF(p)&&p.stage==="intro_sent"&&p.exitReason!=="promoted");
  /* funnel switcher — a branch is its own pipeline, so it needs its own board */
  const withPeople=funnels.filter(x=>!x.isRoot&&people.some(p=>p.funnelId===x.id&&!p.funnelExited));
  const tabs=[rootFunnel()].concat(withPeople).map(x=>`<button class="${x.id===fid?'on':''}" onclick="ST.pipeFunnel=${x.id};renderPipeline()">${x.isRoot?'':'🌿 '}${esc(x.label)}${
    x.isRoot?'':' · '+people.filter(p=>p.funnelId===x.id&&!p.funnelExited).length}</button>`).join("");
  $("v-pipeline").innerHTML=`
  <div class="h1row"><h1>Pipeline</h1>${syncBar()}</div>
  <p class="lede">${f.isRoot
    ? `The post-connection nurture sequence. A new connection needs an <b>introduction</b>, then works through this funnel's
       stages. Each card shows its <b>last touch</b> and how long ago, so you can see who's gone quiet. Sending the
       <b>final stage</b> graduates them out into your regular <b>Connections</b>. When someone replies, <b>classify it</b> —
       that moves them onto the branch's own funnel, which gets its own tab here.`
    : `The <b>${esc(f.label)}</b> branch has its own funnel. These people answered that way and left the baseline drip for
       good — they'll only ever get the stages below.`}</p>
  ${withPeople.length?`<div class="seg" style="margin:8px 0 12px">${tabs}</div>`:''}
  <div class="kanwrap"><div class="kanban" style="grid-template-columns:repeat(${Math.max(cols.length,1)},minmax(212px,1fr))">
    ${cols.length?cols.map((col,ci)=>`<div class="kcol" ondragover="colDragOver(event)"
        ondragleave="colDragLeave(event)" ondrop="colDrop(event,${fid},${ci-1})">
        <div class="kh"><span>${esc(col.label)}</span><span class="n">${col.list.length}</span></div>
        ${col.list.map(pipelineCard).join("")||'<div class="muted" style="font-size:12px;padding:6px 4px">—</div>'}
      </div>`).join(""):'<div class="muted" style="padding:10px">This funnel has only one stage, so everyone in it is waiting on that single touch — add a stage in the Message Funnel to give it a board.</div>'}
  </div></div>
  ${exited.length?`<div class="exwrap">
    <button class="exhead" onclick="ST.pipeExited=!ST.pipeExited;renderPipeline()"
      title="People you pulled out of this funnel because the conversation became real">
      <span class="cv">${ST.pipeExited?"\u25be":"\u25b8"}</span> Exited this funnel
      <span class="n">${exited.length}</span></button>
    ${ST.pipeExited?`<p class="lede" style="margin:8px 0 10px">No longer receiving automated touches. Their
       history is intact \u2014 put one back if you exited them by mistake.</p>
      <div class="exlist">${exited.map(pipelineCard).join("")}</div>`:""}
  </div>`:""}`;
}
/* pipeline card message chips: the intro + every follow-up sent so far, accumulating as the person
   moves through the funnel. Hover a chip to read the actual text that went out — the logged send if
   we have it (incl. per-send edits), otherwise the template merged for this person. */
const attrEsc=s=>esc(s||"").replace(/"/g,"&quot;");
function _sendRec(p,type,step){return (p.sends||[]).filter(x=>x.type===type&&(type==="intro"||x.step===step)).pop();}
function touchBody(p,type,step){const s=_sendRec(p,type,step);if(s&&s.body)return s.body;
  const mid=type==="intro"?p.introMessageId:(p.fuMsgIds&&p.fuMsgIds[step]);
  if(mid!=null){const m=msgById(mid);if(m)return mergeText(m.body,p);}return "";}
function touchCode(p,type,step){const s=_sendRec(p,type,step);if(s&&s.code)return s.code;
  const mid=type==="intro"?p.introMessageId:(p.fuMsgIds&&p.fuMsgIds[step]);
  if(mid!=null){const m=msgById(mid);if(m)return m.code;}return "";}
function touchChips(p){
  if(p.stage!=="intro_sent")return "";
  const chips=[];const ic=touchCode(p,"intro"),ib=touchBody(p,"intro");
  chips.push(`<span class="pill p-pur" title="${ib?attrEsc(ib):'Intro sent'}">${p.introKind==='loom'?'📹 Loom':'✉ Intro'}${ic?' · '+esc(ic):''}</span>`);
  for(let s=1;s<=(p.fuStep||0);s++){const c=touchCode(p,"fu",s),b=touchBody(p,"fu",s);
    chips.push(`<span class="pill p-amb" title="${b?attrEsc(b):'Follow-up '+s+' sent — exact message not recorded'}">FL${s}${c?' · '+esc(c):''}</span>`);}
  return chips.join(" ");
}
/* ---- drag to re-seat -------------------------------------------------------------------------
   Dropping is a BOOKKEEPING move, never a send: it corrects where someone sits when the funnel was
   rebuilt under them, or advances someone you don't want to walk through every stage. The column a
   card lands in is the stage it was last SENT, so dropping on "Follow-up 1 sent" means exactly
   "treat FL1 as already delivered" — the next send is FL2. */
let _drag=null;
function cardDragStart(ev,id){_drag=id;ev.dataTransfer.effectAllowed="move";
  try{ev.dataTransfer.setData("text/plain",String(id));}catch(_){}
  ev.currentTarget.classList.add("dragging");
  document.querySelectorAll(".kcol").forEach(c=>c.classList.add("droppable"));}
function cardDragEnd(ev){_drag=null;ev.currentTarget.classList.remove("dragging");
  document.querySelectorAll(".kcol").forEach(c=>c.classList.remove("droppable","over"));}
function colDragOver(ev){if(_drag==null)return;ev.preventDefault();
  ev.dataTransfer.dropEffect="move";ev.currentTarget.classList.add("over");}
function colDragLeave(ev){ev.currentTarget.classList.remove("over");}
/* step = the fuStep this column represents; -1 = the leading "owe them the first touch" column */
function colDrop(ev,fid,step){
  ev.preventDefault();ev.currentTarget.classList.remove("over");
  const id=_drag!=null?_drag:parseInt(ev.dataTransfer.getData("text/plain"),10);
  _drag=null;document.querySelectorAll(".kcol").forEach(c=>c.classList.remove("droppable","over"));
  const p=personById(id);if(!p)return;
  const cur=(p.funnelId||rootFunnel().id), curIx=(p.fuStep==null?-1:p.fuStep);
  if(cur===fid&&curIx===step&&!p.funnelExited)return;      // dropped where it already was
  moveStage(id,fid+":"+step);
}
function pipelineCard(p){
  let acts="", meta="", touch="";
  /* The campaign they're riding, read off what was actually sent — so an `accepted` person who has
     had nothing sent yet correctly has none, and gets no stripe. Deliberately no `title=` on the
     card itself: an OS tooltip there fires over the thread hovercard (the exact collision fixed on
     the Engage comment badge). The named chip inside carries the label. */
  const pSeries=(p.stage==="accepted")?null:(personSeriesId(p)!=null?seriesById(personSeriesId(p)):null);
  if(p.stage==="accepted"){
    acts=`<button class="btn sm" onclick="event.stopPropagation();openStageComposer(${p.id})">✉️ Send intro</button>`;
    meta=`<span class="pill p-teal">connected ${daysAgoLabel(p.connectedAt)}</span>`;
  } else {  // intro_sent — somewhere inside a funnel
    const replied=p.replyCount>0, br=onBranch(p), exited=!!p.funnelExited, f=personFunnel(p);
    /* "final" is the CAMPAIGN's last message, not the funnel's last stage — see campaignLastIx. */
    const next=nextStageOf(p), ss=stagesOf(f.id), isLast=isFinalSend(p);
    if(replied&&!exited&&!br){        // replied but not yet routed → classify it against what we sent
      acts=`<button class="btn accent ghost sm" onclick="event.stopPropagation();openReplyClassifier(${p.id})">🌿 Classify reply → branch</button>`;
    } else if(exited){                 // off the board — the only useful action is undoing that
      acts=`<button class="btn ghost sm" onclick="event.stopPropagation();unexitFunnel(${p.id})">\u21a9 Put back in funnel</button>`;
    } else if(next){                   // next stage of WHATEVER funnel they're on
      acts=`<button class="btn accent ${br?'':'ghost'} sm" onclick="event.stopPropagation();openStageComposer(${p.id})" ${
        isLast?`title="${attrEsc("Last message in "+((pSeries&&pSeries.label)||f.label)+". Sending it takes "+(p.fn||"them")+" off the pipeline board and into Connections, marked completed.")}"`:''}>${
        br?'🌿 ':''}Send ${esc(next.label)} ${isLast?'· final →':'→'}</button>`;
    }
    const statePill = br?`<span class="pill p-acc" title="Diverted into the ${attrEsc(f.label)} branch funnel — off the parent drip for good">🌿 ${esc(f.label)}</span>`
      : (exited&&p.exitReason==="promoted")?`<span class="pill p-grn" title="Promoted — on the manual Follow-up list">\u2b50 promoted</span>`
      : exited?`<span class="pill p-teal" title="Closed — off the drip, still a connection">\u26d4 closed</span>`
      : (replied?'<span class="pill p-grn">✓ replied</span>':'');
    /* The campaign shows BOTH ways: the left stripe for the at-a-glance scan down a column, and a
       named chip because a colour with no key beside it is a memory test. */
    const ps=pSeries;
    const campPill=ps?`<span class="schip sc-${esc(ps.color||'indigo')}" title="Last message sent to ${attrEsc(p.fn)} was part of the ${attrEsc(ps.label)} campaign — the composer will offer its next message first">${esc(ps.label)}</span>`:'';
    meta=`${campPill} ${touchChips(p)} ${statePill}`;

     they stay put until the operator exits them himself, but nothing about the card should invite
     another send — messaging them is guaranteed to fail. */
  const gone=!!p.disconnectedAt;
  if(gone) acts="";
  return `<div class="pcard${isDue(p)&&!gone?' ready':''}${gone?' gone':''}${
    pSeries?' hascamp st-'+esc(pSeries.color||'indigo'):''}" draggable="true" onclick="openPerson(${p.id})"
    ondragstart="event.stopPropagation();cardDragStart(event,${p.id})" ondragend="cardDragEnd(event)">
    <div class="pc-top">${avatar(p)}<div style="min-width:0"><div class="pc-nm">${starGlyph(p)}${esc(p.name)}</div></div></div>
    <div class="pc-hl">${esc(p.headline)}</div>
    ${gone?`<div class="gonebar" title="A full connections sync stopped finding them on ${attrEsc((p.disconnectedAt||'').slice(0,10))}. Messages to them will fail.">⛓ No longer connected · detected ${esc(daysAgoLabel(p.disconnectedAt))}</div>`:''}
    <div class="pc-meta">${meta}</div>

    ${p.stage==="intro_sent"?`<div class="pc-acts2" onclick="event.stopPropagation()">

        title="It went well — take them off the drip and onto the manual Follow-up list">\u2b50 Promote</button>
      <button class="btn gray sm" onclick="exitFunnel(${p.id})"
        title="This one is over — stop the automated touches, keep them as a connection">\u26d4 Exit</button>`}

        onchange="moveStage(${p.id},this.value)">${stageMoveOptions(p)}</select>

}
/* The option a person was last SENT — the message whose reply we're about to classify, and so the
   only place the right branches can come from. p.sends carries the code of each logged send. */
function lastSentMessage(p){
  const s=(p.sends||[]).slice().pop();
  /* messageId first: `code` is NOT unique in the library (two options both read 'FL16'), so a
     code lookup can hand back a different message than the one that actually went out. */
  if(s&&s.messageId!=null){const m=msgById(s.messageId); if(m)return m;}
  if(s&&s.code){const m=library.find(x=>x.code===s.code); if(m)return m;}
  if((p.fuStep==null||p.fuStep===0)&&p.introMessageId!=null)return msgById(p.introMessageId)||null;
  return null;
}

/* ---- REPLY CLASSIFIER — route a replied person into a branch's own funnel -------------------

function classifyReply(id,action,branchId,replyClass){const p=personById(id);if(!p)return;

/* ---- SEND COMPOSER ------------------------------------------------------------------
   Pick a template → see it MERGED for this person → edit the text → Send.
   The tweak you make is what gets sent + logged; it does NOT fork the template. Ticking
   "save as a new variant" is the ONLY thing that spins off an A/B variant (your edited
   text is re-generalized back to merge tags first). Fixes the operator's two gripes: (1) no more
   accidental variant per incidental edit, (2) you see + adjust the real merged message
   (e.g. fix a mangled first name) before it goes. */
function mergeText(body,p){return (body||"")
  .replace(/\{\{first\}\}/g,p.fn||"").replace(/\{\{last\}\}/g,p.ln||"").replace(/\{\{name\}\}/g,p.name||"")
  .replace(/\{\{agency\}\}/g,p.agency||"").replace(/\{\{title\}\}/g,p.title||"").replace(/\{\{city\}\}/g,p.city||"");}
/* reverse of mergeText: concrete values → merge tags, so an edited message can be saved as a
   reusable variant. Most-specific values first so e.g. full name is caught before first name. */
function regeneralize(text,p){let s=text||"";
  [[p.name,"{{name}}"],[p.agency,"{{agency}}"],[p.title,"{{title}}"],[p.city,"{{city}}"],[p.fn,"{{first}}"],[p.ln,"{{last}}"]]
    .forEach(function(pair){if(pair[0])s=s.split(pair[0]).join(pair[1]);});return s;}
/* `stage` is a STAGE ROW (from nextStageOf), not a category string — the composer serves the
   options of whatever stage the person's funnel says comes next, baseline or branch alike. */
/* Which option should already be ticked when the composer opens?
   Two facts fight here and the operator wanted both. (1) The campaign you just WROTE is the one you're
   running, so newest belongs on top. (2) But people are mid-funnel in the OLD campaign when a new
   one starts, and serving them the new campaign's follow-up would drop them into a thread they
   never began. So: ORDER is always newest-first, but the DEFAULT PICK follows the campaign this
   person is already in, and falls back to newest when there's nothing to continue.
   Returns {msg, why} — `why` is shown, because a default the operator can't explain is a default
   they will stop trusting. */
function composerDefault(p,opts){
  const sid=personSeriesId(p);
  if(sid!=null){
    const s=seriesById(sid);
    const match=opts.find(m=>m.seriesId===sid&&m.parentId==null)||opts.find(m=>m.seriesId===sid);
    if(match)return {msg:match,why:`Pre-picked because ${esc(p.fn)} is already in the <b>${esc(s?s.label:"same")}</b> campaign — this is its next message.`,
                     kind:"continue",seriesId:sid};
    return {msg:opts[0],why:`${esc(p.fn)} is in the <b>${esc(s?s.label:"another")}</b> campaign, but it has no option at this stage — so this is the newest option instead. Sending it moves them onto a different thread.`,
            kind:"orphan",seriesId:sid};
  }
  const lastSent=lastSentMessage(p);
  return {msg:opts[0],
          why:lastSent?`Nothing sent to ${esc(p.fn)} carries a campaign yet, so this is the newest option.`
                      :`${esc(p.fn)} hasn't been sent anything yet, so this is your newest option.`,
          kind:"newest",seriesId:null};
}
function openSendComposer(personId,stage,opt){
  opt=opt||{};

  const f=personFunnel(p);
  const isIntro=(stage.funnelId===rootFunnel().id&&stage.sortOrder===0);

  openModal(`<div class="mhead"><div><h2>${opt.heading||((isIntro?"Send introduction":("Send "+esc(stage.label)))+" to "+esc(p.fn))}</h2>
    <div class="sub">${f.isRoot?'':`<span class="pill p-acc">🌿 ${esc(f.label)}</span> `}Pick a template, then edit the text for ${esc(p.fn)} before sending. Your tweaks are sent &amp; logged — they don't change the template unless you tick "save as a new variant".</div></div>
    <div class="dclose" onclick="closeModal()">×</div></div>
    <div class="mbody">
      <label class="fld">Template <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— newest first · drives A/B stats</span></label>
      <div class="cmpwhy ${dflt.kind}">${dflt.why} You can pick any option below.</div>
      <div id="cmp-opts">${opts.map(m=>`
        <label class="rulerow${dflt.seriesId!=null&&m.seriesId===dflt.seriesId?' samecamp':''}" style="cursor:pointer;align-items:flex-start;border:0;padding:6px 0">
          <input type="radio" name="cmp" value="${m.id}" class="ck" style="margin-top:3px" ${m.id===pick.id?'checked':''} onchange="pickComposerMsg(${m.id})">
          <div class="rinfo"><b><span class="code">${m.code}</span> ${esc(m.title)}</b> <span class="pill p-grn">${replyPct(m)}% reply</span>
            ${seriesChip(m,{showNone:series.length>0})}</div>
        </label>`).join("")}</div>
      <label class="fld" style="margin-top:10px">Message to ${esc(p.fn)} <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— merge tags filled in; edit freely before sending</span></label>
      <textarea id="cmp-body" style="min-height:150px;width:100%">${esc(mergeText(pick.body,p))}</textarea>
      ${isIntro?`<label class="fld" style="margin-top:10px">Loom link (optional — makes it a 📹 Loom intro)</label>
        <input type="text" id="cmp-loom" placeholder="loom.com/share/…" style="width:100%">`:''}
      <label style="margin-top:12px;display:flex;gap:8px;align-items:flex-start;cursor:pointer">
        <input type="checkbox" id="cmp-variant" style="margin-top:3px">
        <span class="muted" style="font-size:12.5px">Also save my edits as a <b>new variant</b> of this template — only for a meaningful change worth A/B-tracking. Leave unticked for incidental tweaks (still sent &amp; logged, just no new template).</span></label>
      <div id="cmp-err" style="margin-top:12px;display:none"></div>
      <div class="btnrow" style="margin-top:16px;justify-content:space-between">
        <button class="btn gray sm" onclick="copyComposer()">⧉ Copy text</button>
        <span><button class="btn gray" id="cmp-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn" id="cmp-send" onclick="sendComposed()">${isIntro?"Mark intro sent":("Mark "+esc(stage.label)+" sent")} →</button></span></div>
    </div>`);
}
function pickComposerMsg(mid){
  const st=ST._compose; if(!st)return; const p=personById(st.personId), m=msgById(mid); if(!p||!m)return;
  const ta=$("cmp-body"), curMerged=mergeText((msgById(st.msgId)||{}).body,p);
  if(ta){ if(ta.value===curMerged||!ta.value.trim()||confirm("Replace your edited text with the "+m.code+" template?")) ta.value=mergeText(m.body,p); }
  st.msgId=mid;
}
function copyComposer(){const ta=$("cmp-body");if(ta&&navigator.clipboard){navigator.clipboard.writeText(ta.value);toast("Copied to clipboard","ok");}}
async function sendComposed(){
  const st=ST._compose; if(!st)return; const p=personById(st.personId), m=msgById(st.msgId); if(!p||!m)return;
  if(st.pending)return;   // re-entrancy guard: one send in flight per composer
  const bodyText=($("cmp-body").value||"").trim(); if(!bodyText){toast("Message is empty");return;}
  const loom=st.isIntro?(($("cmp-loom")&&$("cmp-loom").value.trim())||""):"";
  const saveVar=$("cmp-variant")&&$("cmp-variant").checked;
  /* LIVE: the DM must actually reach LinkedIn before anything advances. The server only moves
     the pipeline after Unipile confirms — mirror that here: no optimistic state, no success
     toast, until the POST comes back ok. A failed send keeps the composer open with the error
     so the text isn't lost and Send doubles as Retry. (Standing async-action-feedback rule.) */
  if(window.__LIVE){
    st.pending=true;
    const btn=$("cmp-send"), cancel=$("cmp-cancel"), err=$("cmp-err"), t0=Date.now();
    if(err){err.style.display="none";err.innerHTML="";}
    if(cancel)cancel.disabled=true;
    if(btn){btn.disabled=true;
      btn.innerHTML='<span class="spin"></span> Sending via LinkedIn… <span id="cmp-tick">0:00</span>';
      st.tick=setInterval(()=>{const el=$("cmp-tick");if(!el){clearInterval(st.tick);return;}
        const s=Math.floor((Date.now()-t0)/1000);el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");},1000);}
    const r=await api("/api/person/"+p.id+"/send",{messageId:m.id,code:m.code,stageId:st.stage.id,kind:st.isIntro?(loom?"loom":"message"):"text",body:bodyText,loomUrl:loom});
    clearInterval(st.tick); st.pending=false;
    if(!r||!r.ok){
      if(cancel)cancel.disabled=false;
      /* A person who has disconnected or blocked can NEVER be messaged again, so offering
         "Try again" is actively misleading — it invites the operator to burn three attempts
         on it, which is exactly what happened on 2026-07-31. Offer Exit instead. */
      const dead=!!(r&&r.unreachable);
      if(btn){btn.disabled=dead; btn.innerHTML=dead?"Can't be sent":"↻ Try again →";}
      if(err){err.style.display="block";
        err.innerHTML='<div class="errbar"><b>Not sent.</b> Nothing was recorded and '+esc(p.fn)+' stays where they were.\n'
          +esc((r&&r.error)||"No response from the server.")+'</div>'
          +(dead?'<div class="btnrow" style="margin-top:8px;justify-content:flex-end">'
                 +'<button class="btn gray sm" onclick="closeModal();exitFunnel('+p.id+')">⛔ Take '+esc(p.fn)+' out of the funnel</button></div>':'');}
      return;
    }
  }
  snapshot(st.isIntro?"send intro":"send follow-up");
  if(saveVar){
    const gen=regeneralize(bodyText,p), root=familyRoot(m), n=library.filter(x=>x.parentId===root.id).length+1, code=root.code+"."+n;
    const v={id:imid++,stageId:root.stageId,code:code,parentId:root.id,seriesId:root.seriesId,title:m.title+" (v"+n+")",body:gen,isActive:true,sortOrder:imid,versions:[],assigned:0,replied:0,viewed:0,withLoom:0};
    createMsgRemote(v,{action:"branch",id:m.id,title:v.title,body:gen},false);
    toast("Saved your edit as new variant "+code,"ok");
  }
  m.assigned=(m.assigned||0)+1;
  const ss=stagesOf(personFunnel(p).id), lastIx=ss.length-1;
  let step=p.fuStep||0;
  if(st.isIntro){ p.stage="intro_sent";p.introMessageId=m.id;p.introKind=loom?"loom":"message";p.loomUrl=loom||null;p.fuStep=0;p.lastActivityAt=TODAY; }
  else { step=Math.min(lastIx,(p.fuStep==null?-1:p.fuStep)+1); p.fuStep=step; p.lastActivityAt=TODAY;
    if(!p.fuMsgIds)p.fuMsgIds={}; p.fuMsgIds[step]=m.id; }
  /* graduation is now DATA: the last stage of whatever funnel they're on ends it (a 6-stage
     baseline and a 2-stage branch both close correctly). Explicit Exit still exists. */
  const done=(step>=lastIx&&lastIx>=0&&!st.isIntro);
  if(done)p.tags=p.tags.filter(t=>t!=="in-intro-funnel");
  (p.sends=p.sends||[]).push({type:st.isIntro?"intro":"fu",step:st.isIntro?0:step,code:m.code,body:bodyText,at:TODAY});
  closeModal();
  toast((st.isIntro?"Intro "+m.code:st.stage.label+" "+m.code)+" sent to "+p.fn+(done?" — final stage, graduated out of the funnel":"")+" · logged","ok");
  render();
}

/* ---- why is this tab empty? --------------------------------------------------------------
   "No posts match this filter" is true and useless: it reads as BROKEN when the honest answer
   is usually "you already handled them". 2026-08-04 — the Team tab showed nothing for days and
   looked like a collection failure; it wasn't, the team's only recent posts had all been liked
   or skipped already, and the rest were outside the 4-day window. Two facts have to be visible
   to tell those apart, and neither can be derived from the posts in the browser (the payload
   only carries the newest few hundred UNREAD posts, so a handled or older post simply isn't
   here). They come from the server as feedStats.

   Nothing about the feed's behaviour changes — this is the empty state explaining itself. */
const FEED_TAG_GROUPS={team:{label:"your team",stat:"team"},strategic:{label:"your strategic contacts",stat:"strategic"}};
function feedEmptyCard(ff){
  const g=FEED_TAG_GROUPS[ff], fs=window.__FEEDSTATS;
  const w=(fs&&fs.windowDays)||FEED_MAX_AGE_DAYS;
  const generic=`The feed only shows posts from the last ${w} days that you haven't already liked or skipped, so an empty tab usually means you're caught up rather than that nothing came in.`;
  if(!g||!fs||!fs.groups||!fs.groups[g.stat])
    return `<div class="card muted">Nothing to show here right now. ${generic}</div>`;
  const s=fs.groups[g.stat];
  const n=(v,one,many)=>`<b>${v}</b> ${v===1?one:many}`;
  // Nothing has ever been collected → this IS a collection problem, and must not be dressed up
  // as "you're caught up". Points at the one lever that controls it.
  if(!s.total) return `<div class="card muted">We haven't collected any posts from ${g.label} yet
    — ${s.tagged?n(s.tagged,"person is","people are")+` tagged, ${s.authors?"and their profiles are on the watch list":"but none of their profiles are on the watch list yet"}`:"nobody is tagged for this group"}.
    ${s.authors?"Their posts appear here as soon as the next read picks some up.":""}</div>`;
  const bits=[];
  if(s.recent) bits.push(`${g.label.replace(/^your /,"Your ")} posted ${n(s.recent,"time","times")} in the last ${w} days${s.recentUntouched?"":" — and you've already liked or skipped every one of them"}.`);
  else bits.push(`${g.label.replace(/^your /,"Your ")} hasn't posted in the last ${w} days.`);
  // The pile that exists but can't be reached from here. Saying the number is the difference
  // between "the tab works" and "the tab is lying to me".
  if(s.untouched) bits.push(`${n(s.untouched,"older post is","older posts are")} still unhandled but sit outside the ${w}-day window, so they don't show up here${s.newestUntouched?` — the most recent is from ${esc(String(s.newestUntouched).slice(0,10))}`:""}.`);
  bits.push(`Across all time we've collected ${n(s.total,"post","posts")} from ${g.label}.`);
  return `<div class="card muted">You're caught up. ${bits.join(" ")}</div>`;
}

/* ============================ ENGAGE (the feed) ============================ */
function renderEngage(){
  const within=ST.feedWithin;
  /* the feed is a TO-DO list: once you like, reply to, or skip a post it leaves (state!=="none");
     muted authors are hidden entirely. Posts mid-draft keep state "none" so they stay until saved. */
  let list=posts.filter(p=>p.state==="none"&&!personById(p.authorId).isMuted&&postDaysAgo(p.postedAt)<=FEED_MAX_AGE_DAYS);
  if(within)list=list.filter(p=>postDaysAgo(p.postedAt)<=within);

/* Engage pipeline marker — shows where this post's author sits in the outreach funnel and, on hover,

   has made to a person but the messages that person has actually been sent. Only renders for people
   the funnel has touched (in-pipeline, promoted/exited, or with any logged send / synced thread) —
   the vast majority of feed authors are random connections and get nothing. Derives stage from the
   SAME helpers the Pipeline board uses (inPipelineNow / stageLabelOf / nextStageOf / lastSentIx) so
   the marker and the board can never disagree about someone's stage. */
function engStageMarker(a){
  const inPipe=inPipelineNow(a);
  const nSends=(a.sends||[]).length, hasThread=!!threadOf(a);
  const promoted=a.funnelExited&&a.exitReason==="promoted", exited=a.funnelExited&&!promoted;
  if(!inPipe&&!promoted&&!exited&&!nSends&&!hasThread)return "";
  let label,cls;
  if(inPipe&&(a.stage==="accepted"||lastSentIx(a)<0)){label="⏳ owe intro";cls="p-teal";}
  else if(inPipe&&!nextStageOf(a)){label="✓ campaign complete";cls="p-grn";}
  else if(inPipe){label="📮 "+(stageLabelOf(a)||"in funnel");cls="p-pur";}
  else if(promoted){label="🤝 in follow-up";cls="p-grn";}
  else if(exited){label="⤴ left funnel";cls="p-gray";}
  else {label="✉ "+(stageLabelOf(a)||(nSends?nSends+" sent":"DM thread"));cls="p-amb";}
  const hint=(nSends||hasThread)?"Hover to read the DM thread — what "+(a.fn||"they")+" has been sent"
                               :"In your outreach pipeline — no DMs sent yet";
  return `<span class="thr pipemark" title="${attrEsc(hint)}"><span class="pill ${cls}">${esc(label)}</span>${threadPop(a)}</span>`;
}

async function likePost(id){const p=posts.find(x=>x.id===id);if(!p||p.state!=="none")return;

  }
  snapshot("like");p.state="liked";const a=personById(p.authorId);a.engLikes=(a.engLikes||0)+1;
  toast("👍 Liked on LinkedIn — removed from feed","ok");renderEngage();}
function dismissPost(id){snapshot("skip post");const p=posts.find(x=>x.id===id);p.state="dismissed";persist("/api/post/"+id+"/dismiss");renderEngage();}

  toast("Moved to low-value posts","ok");renderEngage();}
function unmarkLowValue(id){snapshot("restore post");const p=posts.find(x=>x.id===id);if(!p)return;

  toast("Restored to the main feed","ok");renderEngage();}

    /* mock the 3-layer pipeline result: writer(+maybe fallback) → critic verdict → deterministic finalize.
       verdict: 'pass' or 'revise' (critic flagged N high/med issues → one rewrite). banned = words the
       deterministic strip removed; bannedRemaining = anything still leaking after the rewrite (rare). */
    const flagged=settings.critic_enabled?(chance(.4)?1+Math.floor(rnd()*2):0):0;
    const usedFallback=chance(.12);
    p.replyJob={status:"done",text:pick(drafts),model:usedFallback?settings.fallback_model:settings.writer_model,
      usedFallback, criticOn:settings.critic_enabled, verdict:flagged?"revise":"pass", flagged,
      banned:chance(.5)?1:0, bannedRemaining:chance(.08)?[pick(blLiterals())]:[], steer};

}
/* elapsed-time helpers for async panels: a per-post ticker updates the #rtick span every second
   so the user can see the draft is actively working and how long it's taken. Re-queries the DOM
   each tick, so it survives feed re-renders; self-stops when the job leaves 'pending'. */
function replyElapsed(job){if(!job||!job.startedAt)return"";const s=Math.max(0,Math.floor((Date.now()-job.startedAt)/1000));return`· ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;}
const replyTickers={};
function startReplyTicker(id){
  if(replyTickers[id])return;   // already ticking
  replyTickers[id]=setInterval(()=>{
    const p=posts.find(x=>x.id===id);
    if(!p||!p.replyJob||p.replyJob.status!=="pending"){clearInterval(replyTickers[id]);delete replyTickers[id];return;}
    const el=$("rtick-"+id);if(el)el.textContent=replyElapsed(p.replyJob);
  },1000);
}
/* poll the real reply job until done/error (live mode) */
function pollReply(id){
  const p=posts.find(x=>x.id===id);if(!p||!p.replyJob||p.replyJob.status!=="pending")return;
  startReplyTicker(id);   // resilient: ensure the elapsed ticker is running (e.g. after a tab switch / re-render)
  api("/api/reply/status/"+id).then(r=>{
    if(!r||!r.ok){setTimeout(()=>pollReply(id),2500);return;}   // transient blip → keep trying, don't silently die
    if(r.status==="pending"){setTimeout(()=>pollReply(id),2500);return;}
    if(r.status==="error"){p.replyJob={status:"error",error:r.error||"The draft did not come back. Try again.",steer:r.steer};}
    else if(r.status==="done"){
      let flagged=0;try{const v=JSON.parse(r.review||"null");if(v&&v.issues)flagged=v.issues.filter(i=>["high","medium"].includes(i.severity)).length;}catch(e){}
      const bn=Number(r.bannedRemaining||0);
      p.replyJob={status:"done",text:r.reply,model:r.model,usedFallback:!!r.fallbackUsed,criticOn:settings.critic_enabled,
        verdict:r.review?"revise":"pass",flagged,banned:0,bannedRemaining:bn>0?Array(bn).fill("·"):[],steer:r.steer};
    }
    if(ST.tab==="engage")renderEngage();
  });
}
function saveReply(id){snapshot("save reply");const p=posts.find(x=>x.id===id);
  const ta=$("rt-"+id);const original=(p.replyJob&&p.replyJob.text)||"";const final=ta?ta.value:original;
  if(window.__LIVE)persist("/api/reply/save",{postId:id,original,final,steer:(p.replyJob&&p.replyJob.steer)||""});
  if(ta)p.replyJob.text=ta.value;p.state="done";p.replyJob=null;

/* Send-as-is: from the compose box (BEFORE generation) save exactly what the operator typed as the sent
   comment and mark replied — no writer/critic pass. Recorded with source='as_is' so it's captured
   as a pure-voice training exemplar but stays OUT of the diff-based weekly reply_learn analyzer
   (there's no AI draft to diff against). Mirrors saveReply's local-state updates. */
function sendReplyAsIs(id){const p=posts.find(x=>x.id===id);if(!p)return;
  const el=$("steer-"+id);const text=((el&&el.value)||(p.replyJob&&p.replyJob.steer)||"").trim();
  if(!text){toast("Type the message you want to send first","warn");return;}
  snapshot("send reply as-is");

  const raw=(p.replyJob&&p.replyJob._ceRaw)||null;

/* ---- COPY EDIT — the setting between "Send as is" and "Generate" -----------------------------
   the operator dictates his comments, so the box regularly holds his exact thought wrapped in dictation
   damage: missing punctuation, half-caught words, run-on sentences. "Send as is" ships the mess;
   "Generate" throws his words away and writes new ones. This third button keeps every word and
   fixes only the transcription — the model is never shown the post or the voice profile, so it
   has nothing to write FROM even if it wanted to.

   Deliberately NOT a re-render: the textarea is the working surface, so the result is written
   straight into it and the raw text is stashed on the job so ↩ Undo can put it back. Nothing is
   sent or recorded here — this only changes what's in the box, and you still choose what to do
   with it. Full async-action treatment (press ack, elapsed, error, retry) per the standing rule. */
async function copyEditReply(id){
  const p=posts.find(x=>x.id===id); if(!p||!p.replyJob)return;
  const ta=$("steer-"+id), btn=$("ce-btn-"+id), err=$("ce-err-"+id);
  const text=((ta&&ta.value)||"").trim();
  if(!text){toast("Type or dictate something first — copy edit cleans up what's in the box","warn");return;}
  if(p.replyJob._ceBusy)return;                       // one pass in flight per post
  p.replyJob._ceBusy=true; p.replyJob.steer=text;     // survive any re-render mid-flight
  const t0=Date.now();
  if(err){err.style.display="none";err.innerHTML="";}
  if(btn){btn.disabled=true;
    btn.innerHTML='<span class="spin"></span> Copy editing… <span id="ce-tick-'+id+'">0:00</span>';
    p.replyJob._ceTick=setInterval(()=>{const el=$("ce-tick-"+id);
      if(!el){clearInterval(p.replyJob._ceTick);return;}
      const s=Math.floor((Date.now()-t0)/1000);el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");},1000);}
  let r;
  if(window.__LIVE) r=await api("/api/reply/copyedit",{text:text});
  else { await new Promise(res=>setTimeout(res,900)); r={ok:true,changed:true,text:mockCopyEdit(text)}; }
  clearInterval(p.replyJob._ceTick); p.replyJob._ceBusy=false;
  if(!r||!r.ok){
    if(btn){btn.disabled=false;btn.innerHTML="↻ Copy edit again";}
    if(err){err.style.display="block";
      err.innerHTML='<div class="errbar" style="margin-top:8px"><b>Not copy edited.</b> Your text is exactly as you left it.\n'
        +esc((r&&r.error)||"No response from the server.")+'</div>';}
    return;
  }
  if(btn){btn.disabled=false;btn.innerHTML="✎ Copy edit";}
  if(!r.changed){
    if(err){err.style.display="block";
      err.innerHTML='<div class="muted" style="font-size:11.5px;margin-top:7px">Nothing to fix — your text was already clean.</div>';}
    return;
  }
  p.replyJob._ceRaw=text;                              // keep the dictation so Undo is real
  p.replyJob.steer=r.text;
  if(ta){ta.value=r.text;ta.focus();}
  if(err){err.style.display="block";
    err.innerHTML='<div class="muted" style="font-size:11.5px;margin-top:7px">✎ Cleaned up — your wording is unchanged, only the transcription was fixed. '
      +'<span class="linkish" onclick="undoCopyEdit('+id+')">↩ undo</span></div>';}
}
function undoCopyEdit(id){const p=posts.find(x=>x.id===id);
  if(!p||!p.replyJob||p.replyJob._ceRaw==null)return;
  const ta=$("steer-"+id), err=$("ce-err-"+id);
  if(ta)ta.value=p.replyJob._ceRaw;
  p.replyJob.steer=p.replyJob._ceRaw; p.replyJob._ceRaw=null;
  if(err){err.style.display="none";err.innerHTML="";}
  toast("Back to what you dictated","ok");}
/* prototype-only stand-in so the button demonstrates the behaviour without a backend */
function mockCopyEdit(t){let s=t.replace(/\s+/g," ").trim();
  s=s.replace(/\b(um|uh)\b\s*/gi,"").replace(/\b(\w+)\s+\1\b/gi,"$1");
  s=s.charAt(0).toUpperCase()+s.slice(1);
  if(!/[.!?]$/.test(s))s+=".";
  return s;}

    stage:Object.keys(STAGE_META).indexOf(p.stage),eligible:outboundEligible(p)?2:personBlocked(p)?0:1,
    facets:(p.isFreelance?1:0)+(p.isPrincipal?2:0),summary:roleVerdict(p).rank,fu:p.stage==="intro_sent"?p.fuStep:-1,agency:p.agency,loc:p.state,

  list.sort((a,b)=>{const x=val(a),y=val(b);return (x>y?1:x<y?-1:0)*dir;});
