{tab:"engage",sel:["#v-engage .post","#v-engage .feedwrap"],title:"AI replies in YOUR voice",body:"<b>Draft reply</b> asks an AI to write the comment as <i>you</i>, using the voice profile in Settings. A second model (the <b>critic</b>) reviews the draft, then a final pass strips em-dashes and banned hype words. You always edit and approve before anything is posted — and every edit you make teaches the tool your voice."},
{tab:"engage",sel:["#v-engage .grptitle.low","#v-engage .qfrow"],title:"The low-value filter",body:"Not every post deserves your time. Hiring announcements, reposts, and promos are auto-labeled and moved into this group so you can skip the noise or clear it in one click. Mislabeled something? One click restores it to the main feed."},
{tab:"connections",sel:["#connTbody .tagcell","#v-connections .tablewrap"],title:"Triage: tags are the nervous system",body:"This is your whole network as a CRM table, and <b>tags drive everything</b>: <span class=\"tag\">agency</span> marks someone as an outreach target, while <span class=\"tag block\">⛔ personal / client / omit / do-not-pitch</span> BLOCK them from ever receiving automated outreach. These quick-tag chips let you tag anyone with one click, straight from the list."},
{tab:"connections",sel:["#v-connections .tagfilter","#v-connections .toolbar"],title:"Tri-state filters & the red badge",body:"Click a tag chip once to show only people <b>with</b> it, twice to show people <b>without</b> it, a third time to turn it off. And look at the tab bar: the <b>red number on Connections</b> counts NEW connections that still need tagging (hover it — it also tracks the older backlog). Untagged people are invisible to every rule, so triage that number to zero."},
{tab:"connections",sel:["#connTbody .summcell","#v-connections .tablewrap"],title:"Summary & role badges",body:"The Summary column is the AI researcher's one-line read on each person, plus a role badge: <b>🛡 principal</b> (agency owner — the person you actually want), <b>agency staff</b>, <b>freelance/solo</b>, or <b>in-house</b>. It answers “who is this?” without opening LinkedIn."},
{tab:"connections",sel:["[data-tut=conn-viewsbtn]","#v-connections .toolbar"],title:"Saved views",body:"Once you've arranged columns and filters you like, save the layout as a named view — “triage mode”, “principals only” — and flip between them here. Views remember column order, visibility, and widths, and persist in your browser."},
{tab:"invitations",sel:["#v-invitations .seg","#v-invitations h1"],title:"Invitations: the raw ledger",body:"Every pending connection invitation, in <b>both directions</b>, synced from LinkedIn — including requests you sent outside this tool. A big pile of stale sent invites looks spammy, so you can withdraw them here (the real tool can auto-withdraw after a set number of days), and accept or ignore the ones you've received."},
{tab:"intro",sel:["#v-intro .libcat","#v-intro h1"],title:"The Message Library",body:"Everything the tool sends comes from here: <b>intro</b> templates and the three <b>follow-up</b> categories. Each message shows live performance — assigned, replied, reply rate — and you can add A/B variants (<span class=\"code\">1.1</span> under <span class=\"code\">1</span>) to test wording. Editing a message that already has stats offers to <b>branch</b> it into a new variant so the numbers stay clean; archived messages are kept, just out of rotation."},
{tab:"campaigns",sel:["#v-campaigns .guide","#v-campaigns h1"],title:"Campaigns — a planned area",body:"Honest note: this tab is designed and specified, but it's the least built-out part of the plan — bulk message sequences to a chosen segment, with a per-message <b>approval queue</b> and daily caps. The core funnel (Prospects → Pipeline) doesn't depend on it at all. Treat it as a preview of where the tool goes next."},
{tab:"messages",sel:["#v-messages .guide","#v-messages h1"],title:"Messages: your synced inbox",body:"Your LinkedIn conversations, mirrored into the tool so every reply lands next to the person's CRM record. Unread counts, archiving, and thread history work like LinkedIn's inbox; the sync runs on a schedule and you can trigger it manually."},
{tab:"dash",sel:"[data-tut=dash-learn]",title:"The self-learning voice loop",body:"Once a week the tool studies how you <b>edited</b> its drafted replies and proposes numbered recommendations (“shorter openers”, “fewer questions”). You steer in plain English — <i>“apply 1 and 2, skip 3”</i> — review a diff, then confirm. Every change is versioned: the <b>⏱ history</b> links in Settings show every prior value of your voice profile with one-click revert."},
{tab:"dash",sel:"[data-tut=settings-btn]",title:"Settings: everything real starts OFF",body:"The most important idea in this tool: every automated action — connection requests, profile views, invite withdrawal, message sending — has its own <b>on/off switch</b>, a <b>dry-run</b> mode, and <b>daily caps</b>. In a fresh install of the real tool, <b>every sender starts OFF</b>. You turn them on one at a time, only once you trust what they'd do."},
{tab:"dash",sel:"#tutPill",title:"That's the tour!",body:"Toggle this tutorial layer any time with the 🎓 pill (or in ⚙ Settings, where you can also restart this tour). While it's on, small <b>?</b> hotspots sit around the app — click any of them for a plain-English explainer of that area. Best next step: explore with hints on and click through the funnel yourself. Nothing here touches a real LinkedIn account."}
];

{tab:"engage",sel:"#v-engage .post .ph",title:"A post card",body:"Like, skip, mute, mark low-value — or Draft reply for an AI draft in your voice (add an optional steering note first). You always edit and approve before anything goes out.",step:9},
{tab:"connections",sel:"#v-connections h1",title:"Connections",body:"Your whole network as a CRM: search, filter, sort, choose and reorder columns, drill into anyone. Tagging here is what makes the rest of the tool smart.",step:11},
{tab:"connections",sel:['th[data-col="tags"]',"#v-connections .listtbl thead"],title:"Quick-tag column",body:"One-click tag chips on every row. “agency” marks outreach targets; personal / client / omit / do-not-pitch BLOCK automated outreach to that person.",step:11},
{tab:"*",sel:"#tabs .tab:nth-child(5)",title:"The red untagged badge",body:"When a red number shows on the Connections tab, that many NEW connections still need tags (hover it to see the older backlog too). Untagged people are invisible to filters and outreach rules — triage the number to zero.",step:12},
{tab:"invitations",sel:"#v-invitations h1",title:"Invitations",body:"Pending invites in both directions, synced from LinkedIn. Withdraw stale sent ones; accept or ignore received ones.",step:15},
{tab:"intro",sel:"#v-intro h1",title:"Message Library",body:"All intro and follow-up templates with live reply stats and A/B variants. Everything the tool sends comes from here.",step:16},
{tab:"intro",sel:"#v-intro .introitem .abstat",title:"Message stats",body:"Anatomy of a template: assigned (how many people got it), replied, reply rate, views. 🏆 marks the best performer in its category — rework or archive the laggards.",step:16},
{tab:"campaigns",sel:"#v-campaigns h1",title:"Campaigns",body:"Planned bulk sequences with approval queues and daily caps. Fully spec'd for the real build, least essential today.",step:17},
{tab:"messages",sel:"#v-messages h1",title:"Messages",body:"Your synced LinkedIn inbox, joined to the CRM so every thread sits next to the person's record.",step:18},
{tab:"modal",sel:"#cmp-opts",title:"The send composer",body:"Pick a template (that choice drives the A/B stats), edit the merged text for this person, then send. In the real tool this REALLY sends on LinkedIn; here it's simulated.",step:7},
{tab:"modal",sel:"#set-funnel",title:"The safety gates",body:"Every sender has an on/off switch, a dry-run mode, per-run + daily caps, and the soak window. In the real build these all start OFF — you enable them one at a time.",step:20}

/* ---------------- content: per-tab intro cards (shown once per tab per session) ---------------- */
const TUT_TABS={
dash:{title:"Dashboard — start here",body:"The whole engine at a glance: funnel counts, today's actions, and your task queue.",step:3},
prospects:{title:"Prospects — the pre-connection funnel",body:"People you plan to connect with. Warm them up, let them soak a few business days, and the capped sender fires requests oldest-first.",step:4},
pipeline:{title:"Pipeline — you owe these people an intro",body:"Accepted connections move through intro → three follow-ups. Keep the leftmost column empty.",step:6},
engage:{title:"Engage — stay visible",body:"Recent posts from your network, with AI-drafted replies in your voice. A few real comments a day beats any pitch.",step:8},
connections:{title:"Connections — your LinkedIn CRM",body:"Everyone you're connected with. Tags drive outreach eligibility — triage the red untagged badge down to zero.",step:11},
invitations:{title:"Invitations — the pending ledger",body:"Sent and received invites synced from LinkedIn. Withdraw stale ones; accept or ignore incoming.",step:15},
intro:{title:"Message Library — what the tool says",body:"Intro + follow-up templates with live reply stats and A/B variants. Every send pulls from here.",step:16},
campaigns:{title:"Campaigns — planned bulk sequences",body:"Designed but least built-out: sequences with approval queues and caps. A preview of what's next.",step:17},
messages:{title:"Messages — your synced inbox",body:"LinkedIn conversations mirrored next to each person's CRM record.",step:18}
};

/* ---------------- engine ---------------- */
let tour={on:false,i:0};
const seenTabs=new Set();          // session-only: which tabs already showed their intro card
function mode(){try{return localStorage.getItem(KEY);}catch(e){return "on";}}
function setModeVal(m){try{localStorage.setItem(KEY,m);}catch(e){}}
function isOn(){return mode()==="on";}
function findEl(sel){const list=Array.isArray(sel)?sel:[sel];for(const s of list){const el=document.querySelector(s);if(el)return el;}return null;}

/* header pill */
const pill=document.createElement("button");
pill.id="tutPill";pill.className="tut-pill";pill.title="Tutorial mode: hotspots + guided tour";
pill.onclick=()=>TUT.setMode(isOn()?"off":"on");
const setBtn=document.querySelector('[data-tut=settings-btn]');
if(setBtn)setBtn.parentNode.insertBefore(pill,setBtn);
function syncPill(){pill.textContent=isOn()?"🎓 Tutorial ON":"🎓 Tutorial OFF";pill.classList.toggle("off",!isOn());}

/* ---- hotspots ---- */
let spotCard=null;
function removeSpots(){document.querySelectorAll(".tut-spot").forEach(s=>s.remove());closeSpotCard();}
function attachSpots(){
  removeSpots();
  if(!isOn()||tour.on)return;
  const modalOpen=document.getElementById("modalwrap").classList.contains("show");
  TUT_SPOTS.forEach((sp,i)=>{
    if(sp.tab==="modal"){if(!modalOpen)return;}
    else if(sp.tab!=="*"&&sp.tab!==ST.tab)return;
    const el=findEl(sp.sel);
    if(!el||el.querySelector(":scope>.tut-spot"))return;
    const b=document.createElement("button");
    b.className="tut-spot";b.type="button";b.textContent="?";b.title=sp.title;
    b.onclick=e=>{e.stopPropagation();e.preventDefault();openSpotCard(i,b);};
    el.appendChild(b);
  });
}
function openSpotCard(i,anchor){
  closeSpotCard();
  const sp=TUT_SPOTS[i];
  const c=document.createElement("div");c.className="tut-spotcard";c.id="tutSpotCard";
  c.innerHTML=`<div class="tut-ct">${sp.title}</div><div class="tut-cb">${sp.body}</div>
    <div class="tut-cf">${sp.step?`<span class="tut-link" onclick="TUT.start(${sp.step-1})">▶ Tour this area</span>`:""}
      <span class="tut-n" style="margin-left:auto;margin-right:0"></span>
      <button class="tut-b" onclick="TUT.closeCard()">Got it</button></div>
    <span class="tut-x" onclick="TUT.closeCard()">✕</span>`;
  document.body.appendChild(c);spotCard=c;
  const r=anchor.getBoundingClientRect();placeBox(c,r,"bottom");
  setTimeout(()=>document.addEventListener("click",spotCardOutside),0);
}
function spotCardOutside(e){if(spotCard&&!spotCard.contains(e.target))closeSpotCard();}
function closeSpotCard(){if(spotCard){spotCard.remove();spotCard=null;document.removeEventListener("click",spotCardOutside);}}

/* ---- tab intro cards (once per tab per session) ---- */
let tabCard=null;
function hideTabCard(){if(tabCard){tabCard.remove();tabCard=null;}}
function maybeShowTabCard(tab){
  if(!isOn()||tour.on||seenTabs.has(tab)||!TUT_TABS[tab])return;
  if(document.getElementById("modalwrap").classList.contains("show"))return;   // welcome open etc.
  seenTabs.add(tab);hideTabCard();
  const t=TUT_TABS[tab];
  const c=document.createElement("div");c.className="tut-tabcard";
  c.innerHTML=`<div class="tut-ct">${t.title}</div><div class="tut-cb">${t.body}</div>
    <div class="tut-cf"><span class="tut-link" onclick="TUT.start(${t.step-1})">▶ Tour this tab</span>
      <span style="margin-left:auto"></span><button class="tut-b" onclick="TUT.hideTab()">Got it</button></div>
    <span class="tut-x" onclick="TUT.hideTab()">✕</span>`;
  document.body.appendChild(c);tabCard=c;
}

/* ---- guided tour ---- */
let dim=null,halo=null,card=null;
function startTour(i){
  if(!isOn())TUT.setMode("on");
  closeModal();closeDrawer();closeSpotCard();hideTabCard();removeSpots();
  tour.on=true;tour.i=Math.max(0,Math.min(i||0,TUT_STEPS.length-1));
  const top=document.querySelector(".top");if(top)top.classList.add("tut-lift");
  if(!dim){
    dim=document.createElement("div");dim.className="tut-dim";
    halo=document.createElement("div");halo.className="tut-halo";
    card=document.createElement("div");card.className="tut-card";card.id="tutCard";
    document.body.appendChild(dim);document.body.appendChild(halo);document.body.appendChild(card);
  }
  showStep();
}
function showStep(){
  const st=TUT_STEPS[tour.i];
  if(st.tab&&ST.tab!==st.tab)go(st.tab);
  window.__tourTab=(st.tab&&st.tab!=="*")?st.tab:null;   // highlight that section's nav tab
  if(typeof renderTabs==="function")renderTabs();
  requestAnimationFrame(()=>{
    let el=findEl(st.sel);
    if(!el){ // defensive: skip a step whose target is absent (fallbacks should prevent this)
      if(tour.i<TUT_STEPS.length-1){tour.i++;showStep();}else endTour();
      return;
    }
    el.scrollIntoView({block:"center",behavior:"auto"});
    requestAnimationFrame(()=>{
      const r=el.getBoundingClientRect();
      halo.style.top=(r.top-6)+"px";halo.style.left=(r.left-6)+"px";
      halo.style.width=(r.width+12)+"px";halo.style.height=(r.height+12)+"px";
      const last=tour.i===TUT_STEPS.length-1;
      const secName=(st.tab&&st.tab!=="*"&&typeof N_TABS!=="undefined")?N_TABS[st.tab]:"";
      card.innerHTML=`<div class="tut-kicker">Guided tour${secName?" · "+secName:""}</div><div class="tut-ct">${st.title}</div><div class="tut-cb">${st.body}</div>
        <div class="tut-cf"><span class="tut-n">step ${tour.i+1} of ${TUT_STEPS.length}</span>
          <button class="tut-b" ${tour.i===0?"disabled":""} onclick="TUT.back()">‹ Back</button>
          <button class="tut-b pri" onclick="${last?"TUT.end()":"TUT.next()"}">${last?"✓ Finish":"Next ›"}</button></div>
        <span class="tut-x" onclick="TUT.end()">✕ End tour</span>`;
      placeBox(card,r,st.pos||"bottom");
    });
  });
}
function placeBox(box,r,pref){
  const vw=window.innerWidth,vh=window.innerHeight,m=12;
  box.style.visibility="hidden";box.style.top="0px";box.style.left="0px";
  const cw=box.offsetWidth,ch=box.offsetHeight;
  const below=r.bottom+m+ch<=vh-8, above=r.top-m-ch>=8;
  let top,left=r.left;
  if(pref==="top"&&above)top=r.top-m-ch;
  else if(below)top=r.bottom+m;
  else if(above)top=r.top-m-ch;
  else{top=Math.max(8,(vh-ch)/2);left=Math.max(8,(vw-cw)/2);}
  left=Math.min(Math.max(8,left),vw-cw-8);
  top=Math.min(Math.max(8,top),vh-ch-8);
  box.style.top=top+"px";box.style.left=left+"px";box.style.visibility="visible";
}
function endTour(reattach){
  tour.on=false;
  window.__tourTab=null;
  const top=document.querySelector(".top");if(top)top.classList.remove("tut-lift");
  if(typeof renderTabs==="function")renderTabs();
  if(dim){dim.remove();halo.remove();card.remove();dim=halo=card=null;}
  if(reattach!==false&&isOn())attachSpots();
}
document.addEventListener("keydown",e=>{
  if(!tour.on)return;
  if(e.key==="ArrowRight"){e.preventDefault();e.stopPropagation();TUT.next();}
  else if(e.key==="ArrowLeft"){e.preventDefault();e.stopPropagation();TUT.back();}
  else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();TUT.end();}
},true);
window.addEventListener("resize",()=>{if(tour.on)showStep();});

/* ---- welcome modal (first run / restart) ---- */
function welcome(){
  openModal(`<div class="mhead"><div><h2>👋 Welcome to the LinkedIn Engine</h2>
    <div class="sub">A 60-second orientation — you've never seen this tool before, and that's fine.</div></div>
    <div class="dclose" onclick="TUT.explore()">×</div></div>
    <div class="mbody">
      <p style="margin:0 0 10px;font-size:13.5px;line-height:1.6">This is a <b>LinkedIn relationship engine</b>. It works your network deliberately instead of ad hoc:
      it <b>warms up</b> a prospect before you ever reach out, sends connection requests at a <b>safe, human pace</b>,
      remembers <b>who you owe an intro</b>, helps you engage with your network's posts using <b>AI-drafted replies in YOUR voice</b>,
      and makes sure no relationship quietly goes cold.</p>
      <div class="guide" style="margin:0 0 14px"><div class="ic">🔒</div><div><b>Nothing here touches a real LinkedIn account</b> — this demo runs entirely on mock data.
      And in the real tool, <b>every automated action starts switched OFF</b> until you deliberately enable it.</div></div>
      <div class="btnrow" style="justify-content:flex-start">
        <button class="btn" onclick="TUT.start(0)">▶ Take the guided tour</button>
        <button class="btn gray" onclick="TUT.explore()">Explore with hints on</button>
        <button class="btn gray ghost" onclick="TUT.off()">Turn tutorial off</button>
      </div>
    </div>`);
}

/* ---- hooks: re-attach hotspots after the app re-renders / switches tabs / opens modals ---- */
let spotsQueued=false;
function scheduleSpots(){
  if(!isOn()||tour.on||spotsQueued)return;
  spotsQueued=true;
  requestAnimationFrame(()=>{spotsQueued=false;if(isOn()&&!tour.on)attachSpots();});
}
["render","renderTabs","renderDash","renderProspects","renderPipeline","renderEngage","renderConnections",
 "renderConnRows","renderInvitations","renderLibrary","renderCampaigns","renderMessages"].forEach(n=>{
  const f=window[n];if(typeof f!=="function")return;
  window[n]=function(){const r=f.apply(this,arguments);scheduleSpots();return r;};
});
const _go=window.go;
window.go=function(t){const r=_go.apply(this,arguments);maybeShowTabCard(t);return r;};
const _openModal=window.openModal;
window.openModal=function(){const r=_openModal.apply(this,arguments);scheduleSpots();return r;};
/* settings modal: inject the Tutorial-mode row (toggle + restart link) above the save row */
const _openSettings=window.openSettings;
window.openSettings=function(sec){
  const r=_openSettings.apply(this,arguments);
  const mb=document.querySelector("#modal .mbody");
  if(mb&&!mb.querySelector(".tut-setrow")){
    const row=document.createElement("div");row.className="tut-setrow";
    row.innerHTML=`<label class="switch"><input type="checkbox" id="tutSetTog" ${isOn()?"checked":""}
        onchange="TUT.setMode(this.checked?'on':'off')"><span class="track"></span></label>
      <div class="rinfo"><b>🎓 Tutorial mode</b>
        <div class="muted">Beginner hotspots on every section + per-tab intro cards. Applies immediately (separate from Save).
        <span class="linkish" onclick="TUT.restart()">↻ Restart guided tour</span></div></div>`;
    const btnrow=mb.querySelector(":scope>.btnrow");
    mb.insertBefore(row,btnrow||null);
  }
  return r;
};

/* ---- public API (inline onclicks) ---- */
window.TUT={
  setMode(m){setModeVal(m);syncPill();
    if(m==="off"){endTour(false);removeSpots();hideTabCard();const t=document.getElementById("tutSetTog");if(t)t.checked=false;}
    else{attachSpots();const t=document.getElementById("tutSetTog");if(t)t.checked=true;}},
  start(i){closeModal();startTour(i||0);},
  next(){if(tour.i<TUT_STEPS.length-1){tour.i++;showStep();}else endTour();},
  back(){if(tour.i>0){tour.i--;showStep();}},
  end(){endTour();},
  restart(){welcome();},
  welcome(){welcome();},
  explore(){closeModal();if(!isOn())TUT.setMode("on");else attachSpots();seenTabs.delete(ST.tab);maybeShowTabCard(ST.tab);},
  off(){closeModal();TUT.setMode("off");},
  closeCard(){closeSpotCard();},
  hideTab(){hideTabCard();}
};

/* ---- boot ---- */
syncPill();
if(mode()===null){setModeVal("on");syncPill();welcome();}      // first run: welcome, layer defaults on
else if(isOn()){attachSpots();maybeShowTabCard(ST.tab);}
})();
</script>
