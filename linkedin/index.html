function classifyReply(id,action,branchId,replyClass){const p=personById(id);if(!p)return;
  snapshot("classify reply");
  const b=branchId?branches.find(x=>x.id===branchId):null;
  if(action==="exit"){p.funnelExited=true;p.replyClass=replyClass;p.tags=p.tags.filter(t=>t!=="in-intro-funnel");}
  else if(b){ /* into the branch's OWN funnel, at its very start (nothing sent there yet) */
    p.funnelId=b.funnelId;p.funnelExited=false;p.fuStep=-1;p.replyClass=replyClass||b.label;
    if(!p.tags.includes("in-intro-funnel"))p.tags.push("in-intro-funnel");}
  p.replyClassifiedAt=TODAY;
  /* real build also POSTs /api/person/<id>/classify-reply here */
  closeModal();
  toast(action==="exit"?esc(p.fn)+" exited the funnel — no more automated touches"
        :esc(p.fn)+" → "+esc(b?b.label:"branch")+" — now on its own funnel","ok");

/* ---- SEND COMPOSER ------------------------------------------------------------------
   Pick a template → see it MERGED for this person → edit the text → Send.
   The tweak you make is what gets sent + logged; it does NOT fork the template. Ticking
   "save as a new variant" is the ONLY thing that spins off an A/B variant (your edited
   text is re-generalized back to merge tags first). Fixes Eric's two gripes: (1) no more
   accidental variant per incidental edit, (2) you see + adjust the real merged message
   (e.g. fix a mangled first name) before it goes. */
function mergeText(body,p){return (body||"")
  .replace(/\{\{first\}\}/g,p.fn||"").replace(/\{\{last\}\}/g,p.ln||"").replace(/\{\{name\}\}/g,p.name||"")
  .replace(/\{\{agency\}\}/g,p.agency||"").replace(/\{\{title\}\}/g,p.title||"").replace(/\{\{city\}\}/g,p.city||"");}
/* reverse of mergeText: concrete values → merge tags, so an edited message can be saved as a
   reusable variant. Most-specific values first so e.g. full name is caught before first name. */
function regeneralize(text,p){let s=text||"";
  [[p.name,"{{name}}"],[p.agency,"{{agency}}"],[p.title,"{{title}}"],[p.city,"{{city}}"],[p.fn,"{{first}}"],[p.ln,"{{last}}"]]
    .forEach(function(pair){if(pair[0])s=s.split(pair[0]).join(pair[1]);});return s;}
/* `stage` is a STAGE ROW (from nextStageOf), not a category string — the composer serves the
   options of whatever stage the person's funnel says comes next, baseline or branch alike. */
function openSendComposer(personId,stage,opt){
  opt=opt||{};
  const p=personById(personId); if(!p)return;
  const f=personFunnel(p);
  const isIntro=(stage.funnelId===rootFunnel().id&&stage.sortOrder===0);
  const opts=(opt.pool||libByStage(stage.id));
  if(!opts.length){toast(opt.emptyMsg||("No active options at the "+stage.label+" stage yet — add one in the Message Funnel"),"warn");return;}
  ST._compose={personId:personId,stage:stage,isIntro:isIntro,msgId:opts[0].id};
  openModal(`<div class="mhead"><div><h2>${opt.heading||((isIntro?"Send introduction":("Send "+esc(stage.label)))+" to "+esc(p.fn))}</h2>
    <div class="sub">${f.isRoot?'':`<span class="pill p-acc">🌿 ${esc(f.label)}</span> `}Pick a template, then edit the text for ${esc(p.fn)} before sending. Your tweaks are sent &amp; logged — they don't change the template unless you tick "save as a new variant".</div></div>
    <div class="dclose" onclick="closeModal()">×</div></div>
    <div class="mbody">
      <label class="fld">Template <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— drives A/B stats</span></label>
      <div id="cmp-opts">${opts.map((m,i)=>`
        <label class="rulerow" style="cursor:pointer;align-items:flex-start;border:0;padding:6px 0">
          <input type="radio" name="cmp" value="${m.id}" class="ck" style="margin-top:3px" ${i===0?'checked':''} onchange="pickComposerMsg(${m.id})">
          <div class="rinfo"><b><span class="code">${m.code}</span> ${esc(m.title)}</b> <span class="pill p-grn">${replyPct(m)}% reply</span></div>
        </label>`).join("")}</div>
      <label class="fld" style="margin-top:10px">Message to ${esc(p.fn)} <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— merge tags filled in; edit freely before sending</span></label>
      <textarea id="cmp-body" style="min-height:150px;width:100%">${esc(mergeText(opts[0].body,p))}</textarea>
      ${isIntro?`<label class="fld" style="margin-top:10px">Loom link (optional — makes it a 📹 Loom intro)</label>
        <input type="text" id="cmp-loom" placeholder="loom.com/share/…" style="width:100%">`:''}
      <label style="margin-top:12px;display:flex;gap:8px;align-items:flex-start;cursor:pointer">
        <input type="checkbox" id="cmp-variant" style="margin-top:3px">
        <span class="muted" style="font-size:12.5px">Also save my edits as a <b>new variant</b> of this template — only for a meaningful change worth A/B-tracking. Leave unticked for incidental tweaks (still sent &amp; logged, just no new template).</span></label>
      <div class="btnrow" style="margin-top:16px;justify-content:space-between">
        <button class="btn gray sm" onclick="copyComposer()">⧉ Copy text</button>
        <span><button class="btn gray" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="sendComposed()">${isIntro?"Mark intro sent":("Mark "+esc(stage.label)+" sent")} →</button></span></div>
    </div>`);
}
function pickComposerMsg(mid){
  const st=ST._compose; if(!st)return; const p=personById(st.personId), m=msgById(mid); if(!p||!m)return;
  const ta=$("cmp-body"), curMerged=mergeText((msgById(st.msgId)||{}).body,p);
  if(ta){ if(ta.value===curMerged||!ta.value.trim()||confirm("Replace your edited text with the "+m.code+" template?")) ta.value=mergeText(m.body,p); }
  st.msgId=mid;
}
function copyComposer(){const ta=$("cmp-body");if(ta&&navigator.clipboard){navigator.clipboard.writeText(ta.value);toast("Copied to clipboard","ok");}}
function sendComposed(){
  const st=ST._compose; if(!st)return; const p=personById(st.personId), m=msgById(st.msgId); if(!p||!m)return;
  const bodyText=($("cmp-body").value||"").trim(); if(!bodyText){toast("Message is empty");return;}
  const loom=st.isIntro?(($("cmp-loom")&&$("cmp-loom").value.trim())||""):"";
  const saveVar=$("cmp-variant")&&$("cmp-variant").checked;
  snapshot(st.isIntro?"send intro":"send follow-up");
  if(saveVar){
    const gen=regeneralize(bodyText,p), root=familyRoot(m), n=library.filter(x=>x.parentId===root.id).length+1, code=root.code+"."+n;
    const v={id:imid++,stageId:root.stageId,code:code,parentId:root.id,title:m.title+" (v"+n+")",body:gen,isActive:true,sortOrder:imid,versions:[],assigned:0,replied:0,viewed:0,withLoom:0};
    createMsgRemote(v,{action:"branch",id:m.id,title:v.title,body:gen},false);
    toast("Saved your edit as new variant "+code,"ok");
  }
  m.assigned=(m.assigned||0)+1;
  const ss=stagesOf(personFunnel(p).id), lastIx=ss.length-1;
  let step=p.fuStep||0;
  if(st.isIntro){ p.stage="intro_sent";p.introMessageId=m.id;p.introKind=loom?"loom":"message";p.loomUrl=loom||null;p.fuStep=0;p.lastActivityAt=TODAY; }
  else { step=Math.min(lastIx,(p.fuStep==null?-1:p.fuStep)+1); p.fuStep=step; p.lastActivityAt=TODAY;
    if(!p.fuMsgIds)p.fuMsgIds={}; p.fuMsgIds[step]=m.id; }
  /* graduation is now DATA: the last stage of whatever funnel they're on ends it (a 6-stage
     baseline and a 2-stage branch both close correctly). Explicit Exit still exists. */
  const done=(step>=lastIx&&lastIx>=0&&!st.isIntro);
  if(done)p.tags=p.tags.filter(t=>t!=="in-intro-funnel");
  (p.sends=p.sends||[]).push({type:st.isIntro?"intro":"fu",step:st.isIntro?0:step,code:m.code,body:bodyText,
    at:TODAY,ts:tsAt(TODAY,new Date().getHours(),new Date().getMinutes())});
  /* real build also POSTs /api/person/<id>/send here */
  closeModal();
  toast((st.isIntro?"Intro "+m.code:st.stage.label+" "+m.code)+" sent to "+p.fn+(done?" — final stage, graduated out of the funnel":"")+" · logged","ok");
  render();
}

      `<span class="chip2 ${ff===k?'set':''}" onclick="ST.feedFilter='${k}';renderEngage()">${l} <span class="c">${counts[k]}</span></span>`).join("")}

/* Engage pipeline marker — shows where this post's author sits in the outreach funnel and, on hover,
   the DM thread (reusing the pipeline's threadPop), so the feed surfaces not just the comments Eric
   has made to a person but the messages that person has actually been sent. Only renders for people
   the funnel has touched (in-pipeline, promoted/exited, or with any logged send / synced thread) —
   the vast majority of feed authors are random connections and get nothing. Derives stage from the
   SAME helpers the Pipeline board uses (inPipelineNow / stageLabelOf / nextStageOf / lastSentIx) so
   the marker and the board can never disagree about someone's stage. */
function engStageMarker(a){
  const inPipe=inPipelineNow(a);
  const nSends=(a.sends||[]).length, hasThread=!!threadOf(a);
  const promoted=a.funnelExited&&a.exitReason==="promoted", exited=a.funnelExited&&!promoted;
  if(!inPipe&&!promoted&&!exited&&!nSends&&!hasThread)return "";
  let label,cls;
  if(inPipe&&(a.stage==="accepted"||lastSentIx(a)<0)){label="⏳ owe intro";cls="p-teal";}
  else if(inPipe&&!nextStageOf(a)){label="✓ funnel complete";cls="p-grn";}
  else if(inPipe){label="📮 "+(stageLabelOf(a)||"in funnel");cls="p-pur";}
  else if(promoted){label="🤝 in follow-up";cls="p-grn";}
  else if(exited){label="⤴ left funnel";cls="p-gray";}
  else {label="✉ "+(stageLabelOf(a)||(nSends?nSends+" sent":"DM thread"));cls="p-amb";}
  const hint=(nSends||hasThread)?"Hover to read the DM thread — what "+(a.fn||"they")+" has been sent"
                               :"In your outreach pipeline — no DMs sent yet";
  return `<span class="thr pipemark" title="${attrEsc(hint)}"><span class="pill ${cls}">${esc(label)}</span>${threadPop(a)}</span>`;

/* clear all low-value (reposts/announcements) currently visible in the feed — one click */
function clearLowValue(){

/* Skip remaining: one click dismisses every post still showing in the current Engage view (whatever
   filter/age window is active), for when you've worked down the list and the rest are too old to bother.
   Uses ST.feedShown (the exact ids rendered), only touches still-active posts. Undoable (snapshot). */
function skipRemaining(){
  const shown=new Set(ST.feedShown||[]);
  const targets=posts.filter(p=>shown.has(p.id)&&p.state==="none");
  if(!targets.length){toast("Nothing left to skip");return;}
  snapshot("skip remaining");
  const ids=targets.map(p=>p.id);

  toast("Skipped "+ids.length+" post"+(ids.length!==1?"s":"")+" — undo with Ctrl+Z","ok");renderEngage();}
/* Draft reply is now TWO steps: (1) open the compose area + ask for an optional steering note,
   (2) Generate actually runs the async draft. Clicking "Draft reply" no longer auto-generates. */
function openReplyCompose(id){
  const p=posts.find(x=>x.id===id);
  const prev=(p.replyJob&&p.replyJob.steer)||"";   // keep prior steer when regenerating
  p.replyJob={status:"compose",steer:prev};renderEngage();
  setTimeout(()=>{const t=$("steer-"+id);if(t)t.focus();},30);
}
function cancelReply(id){const p=posts.find(x=>x.id===id);p.replyJob=null;renderEngage();}
/* elapsed-time helpers for async panels: a per-post ticker updates the #rtick span every second so
   the draft reads as "still working," not frozen. Re-queries the DOM each tick, so it survives feed
   re-renders; self-stops when the job leaves 'pending'. (Mirrors the real build.) */
function replyElapsed(job){if(!job||!job.startedAt)return"";const s=Math.max(0,Math.floor((Date.now()-job.startedAt)/1000));return`· ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;}
const replyTickers={};
function startReplyTicker(id){
  if(replyTickers[id])return;
  replyTickers[id]=setInterval(()=>{
    const p=posts.find(x=>x.id===id);
    if(!p||!p.replyJob||p.replyJob.status!=="pending"){clearInterval(replyTickers[id]);delete replyTickers[id];return;}
    const el=$("rtick-"+id);if(el)el.textContent=replyElapsed(p.replyJob);
  },1000);
}
/* simulate the async background reply job (pending → done), honoring the steering note */
function generateReply(id){
  const p=posts.find(x=>x.id===id);
  if(p&&p.replyJob&&p.replyJob.status==="pending")return;   // guard: don't double-submit while a draft is in flight
  const steer=(($("steer-"+id)&&$("steer-"+id).value)||(p.replyJob&&p.replyJob.steer)||"").trim();
  snapshot("draft reply");
  p.replyJob={status:"pending",steer,startedAt:Date.now()};renderEngage();startReplyTicker(id);
  setTimeout(()=>{
    const drafts=p.isAI?[
      "This is the right framing. The boring 60% is exactly where we've pointed our tooling too, which frees the team for the work clients actually remember.",
      "Strongly agree. We've had the same result; the trick was treating it as a floor for quality, not a ceiling on headcount."
    ]:[
      "Saying no to the wrong-fit work is underrated. We started doing the same and the pipeline got healthier, not thinner.",
      "Love this. The proposal-not-the-relationship point is one I wish I'd learned five years earlier."];
    /* mock the 3-layer pipeline result: writer(+maybe fallback) → critic verdict → deterministic finalize.
       verdict: 'pass' or 'revise' (critic flagged N high/med issues → one rewrite). banned = words the
       deterministic strip removed; bannedRemaining = anything still leaking after the rewrite (rare). */
    const flagged=settings.critic_enabled?(chance(.4)?1+Math.floor(rnd()*2):0):0;
    const usedFallback=chance(.12);
    p.replyJob={status:"done",text:pick(drafts),model:usedFallback?settings.fallback_model:settings.writer_model,
      usedFallback, criticOn:settings.critic_enabled, verdict:flagged?"revise":"pass", flagged,
      banned:chance(.5)?1:0, bannedRemaining:chance(.08)?[pick(blLiterals())]:[], steer};
    if(ST.tab==="engage")renderEngage();
  },1400);
}
function saveReply(id){snapshot("save reply");const p=posts.find(x=>x.id===id);
  const ta=$("rt-"+id);if(ta)p.replyJob.text=ta.value;p.state="done";p.replyJob=null;
  const a=personById(p.authorId);a.engReplies=(a.engReplies||0)+1;
  toast("Reply saved & marked replied — edit captured for self-learning","ok");renderEngage();}
/* Send-as-is: save exactly what Eric typed in the compose box as the sent comment (no generation),
   mark replied. In the live build this records source='as_is' so it's a pure-voice training exemplar
   kept out of the diff-based reply_learn analyzer; here it just updates local mock state. */
function sendReplyAsIs(id){const p=posts.find(x=>x.id===id);if(!p)return;
  const el=$("steer-"+id);const text=((el&&el.value)||(p.replyJob&&p.replyJob.steer)||"").trim();
  if(!text){toast("Type the message you want to send first","warn");return;}
  snapshot("send reply as-is");p.state="done";p.replyJob=null;
  const a=personById(p.authorId);a.engReplies=(a.engReplies||0)+1;
  toast("Sent as-is & marked replied — captured as training data","ok");renderEngage();}

/* The classifier's read on WHAT this person is — the fast principal-vs-employee signal you'd
   otherwise open LinkedIn to check. Derived from the profile-research classification. rank groups them when sorted. */
function roleVerdict(p){const c=(p.research&&p.research.classification)||null;
  if(!c)return{label:"—",cls:"p-gray",rank:5};
  if(c.isAgencyPrincipal)return{label:"🛡 principal",cls:"p-grn",rank:0};   // owner/founder — the ones to KEEP
  if(c.isAgencyOther)return{label:"agency staff",cls:"p-amb",rank:1};       // at an agency but not the owner
  if(c.isFreelance)return{label:"freelance/solo",cls:"p-teal",rank:2};
  return{label:"in-house / other",cls:"p-gray",rank:3};                     // not an agency → usually not a fit
}

  research:p=>{if(!p.research)return '<td><span class="muted" title="not yet researched">—</span></td>';const c=p.research.classification;
    const flags=[c.isMuseumContact&&"museum",c.pastMuseumExperience&&"past-museum",c.isAgencyPrincipal&&"principal",c.isFreelance&&"freelance"].filter(Boolean);

/* filtered + sorted connection list — shared by the full render and the rows-only
   (search-as-you-type) render so both always agree. */
function connList(){
  const q=ST.connQ.toLowerCase();
  let list=people.filter(p=>["accepted","intro_sent"].includes(p.stage));
  if(ST.connView==="preferred")list=list.filter(p=>p.isStarred);
  if(ST.connView==="principal")list=list.filter(p=>p.isPrincipal);
  if(ST.connView==="eligible")list=list.filter(outboundEligible);
  if(ST.connView==="blocked")list=list.filter(personBlocked);
  if(ST.connView==="untagged")list=list.filter(p=>!p.tags||p.tags.length===0);
  if(ST.connStage)list=list.filter(p=>p.stage===ST.connStage);
  if(ST.connFu!=="")list=list.filter(p=>p.stage==="intro_sent"&&p.fuStep===+ST.connFu);
  if(ST.connTagInc.size)list=list.filter(p=>[...ST.connTagInc].some(t=>p.tags.includes(t)));  // include: has ANY chosen tag
  if(ST.connTagExc.size)list=list.filter(p=>![...ST.connTagExc].some(t=>p.tags.includes(t))); // exclude: has NONE
  if(ST.connTag)list=list.filter(p=>p.tags.includes(ST.connTag));
  if(ST.connResearch){const R=ST.connResearch;list=list.filter(p=>{const c=p.research&&p.research.classification;
    return R==="researched"?!!p.research : R==="unresearched"?!p.research :
      R==="principal"?(c&&c.isAgencyPrincipal) : R==="agencystaff"?(c&&c.isAgencyOther&&!c.isAgencyPrincipal) :
      R==="inhouse"?(c&&!c.isAgencyPrincipal&&!c.isAgencyOther&&!c.isFreelance) : R==="museum"?(c&&c.isMuseumContact) :
      R==="pastmuseum"?(c&&c.pastMuseumExperience) : R==="freelance"?(c&&c.isFreelance) : true;});}
  if(q)list=list.filter(p=>(p.name+" "+p.agency+" "+p.headline+" "+p.tags.join(" ")+" "+((p.research&&p.research.summary)||"")).toLowerCase().includes(q));
  const sf=ST.connSort.field, dir=ST.connSort.dir;
  const val=p=>({person:p.name,stage:Object.keys(STAGE_META).indexOf(p.stage),eligible:outboundEligible(p)?2:personBlocked(p)?0:1,
    facets:(p.isFreelance?1:0)+(p.isPrincipal?2:0),summary:roleVerdict(p).rank,fu:p.stage==="intro_sent"?p.fuStep:-1,agency:p.agency,loc:p.state,

  list.sort((a,b)=>{const x=val(a),y=val(b);return (x>y?1:x<y?-1:0)*dir;});
  return list;
}

        <div style="border-top:1px solid var(--line);margin-top:5px;padding-top:5px">
          <button class="btn sm" style="width:100%" onclick="saveConnView()">💾 Save current view…</button>
          ${ST.connOrder.length||ST.connHidden.size?`<button class="btn gray sm" style="width:100%;margin-top:4px" onclick="resetConnView()">↺ Reset to default</button>`:''}
        </div>

  </div>
  <div class="tablewrap">
    <table class="listtbl"><thead><tr>
      <th style="width:34px" class="nosort"><input type="checkbox" class="ck" id="connSelAll" onclick="toggleAll(this,[${list.map(p=>p.id).join(",")}])"></th>
      ${cols.map(([k,l])=>`<th data-col="${k}" ${k==="person"?"":`draggable="true" ondragstart="connDragStart(event,'${k}')" ondragover="connDragOver(event)" ondrop="connDrop(event,'${k}')" ondragend="connDragEnd(event)"`} onclick="sortConn('${k}')"${wStyle(k)} title="Drag to reorder · click to sort">${l}${sf===k?` <span class="arr">${dir>0?'▲':'▼'}</span>`:''}<span class="rsz" onmousedown="connRszStart(event,'${k}')" onclick="event.stopPropagation()"></span></th>`).join("")}

/* tri-state tag filter chip: off → include (has it) → exclude (does NOT have it) → off */
function cycleTagFilter(t){
  if(ST.connTagInc.has(t)){ST.connTagInc.delete(t);ST.connTagExc.add(t);}
  else if(ST.connTagExc.has(t)){ST.connTagExc.delete(t);}
  else{ST.connTagInc.add(t);}
  renderConnections();}
function clearConnFilters(){ST.connStage="";ST.connFu="";ST.connTag="";ST.connTagInc.clear();ST.connTagExc.clear();ST.connResearch="";ST.connQ="";renderConnections();}
function toggleConnCols(e){e.stopPropagation();ST.connColPanel=!ST.connColPanel;renderConnections();
  if(ST.connColPanel)setTimeout(()=>document.addEventListener("click",closeConnCols),0);}
function closeConnCols(e){if(e&&e.target.closest&&e.target.closest("#connColPanel"))return;
  ST.connColPanel=false;document.removeEventListener("click",closeConnCols);if(ST.tab==="connections")renderConnections();}
function toggleConnCol(k){if(ST.connHidden.has(k))ST.connHidden.delete(k);else ST.connHidden.add(k);saveConnPrefs();renderConnections();}
/* Reorder a column from the Columns panel (▲ earlier / ▼ later). 'person' stays pinned first.
   Reorders across ALL columns (visible + hidden) so the panel list order == the table order. */
function moveConnCol(k,dir){let order=orderedCols().map(c=>c[0]).filter(x=>x!=="person");
  const i=order.indexOf(k);if(i<0)return;const j=i+dir;if(j<0||j>=order.length)return;
  order.splice(i,1);order.splice(j,0,k);
  ST.connOrder=["person",...order];saveConnPrefs();ST.connViewName="";renderConnections();}
/* ---- column drag-reorder (HTML5 DnD on the header cells) ---- */
let _connDrag=null;
function connDragStart(e,k){_connDrag=k;e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",k);}catch(_){}}
function connDragOver(e){e.preventDefault();e.dataTransfer.dropEffect="move";}
function connDragEnd(){_connDrag=null;}
function connDrop(e,target){e.preventDefault();const from=_connDrag;_connDrag=null;
  if(!from||from===target||target==="person")return;
  // materialize the current visible+full order, move `from` to just before `target`, persist
  let order=orderedCols().map(c=>c[0]).filter(k=>k!=="person");
  order=order.filter(k=>k!==from);
  const ti=order.indexOf(target);order.splice(ti<0?order.length:ti,0,from);
  ST.connOrder=["person",...order];saveConnPrefs();ST.connViewName="";renderConnections();}
/* ---- saved views (named column order + visibility + widths) ---- */
function toggleConnViews(e){e.stopPropagation();ST.connViewPanel=!ST.connViewPanel;ST.connColPanel=false;renderConnections();
  if(ST.connViewPanel)setTimeout(()=>document.addEventListener("click",closeConnViews),0);}
function closeConnViews(e){if(e&&e.target.closest&&e.target.closest("#connViewPanel"))return;
  ST.connViewPanel=false;document.removeEventListener("click",closeConnViews);if(ST.tab==="connections")renderConnections();}
function saveConnView(){const n=(prompt("Name this view (columns, order, widths):",ST.connViewName||"My view")||"").trim();if(!n)return;
  ST.connViews[n]={order:orderedCols().map(c=>c[0]),hidden:[...ST.connHidden],w:{...ST.connW}};
  ST.connViewName=n;saveConnViews();toast("Saved view “"+n+"”","ok");renderConnections();}
function applyConnView(n){const v=ST.connViews[n];if(!v)return;
  ST.connOrder=v.order||[];ST.connHidden=new Set(v.hidden||[]);ST.connW={...(v.w||{})};ST.connViewName=n;
  saveConnPrefs();ST.connViewPanel=false;toast("View “"+n+"”","ok");renderConnections();}
function deleteConnView(n){if(!ST.connViews[n])return;delete ST.connViews[n];if(ST.connViewName===n)ST.connViewName="";
  saveConnViews();renderConnections();}
function resetConnView(){ST.connOrder=[];ST.connHidden=new Set();ST.connW={};ST.connViewName="";
  saveConnPrefs();toast("Columns reset to default");renderConnections();}
function connRszStart(e,key){e.preventDefault();e.stopPropagation();
  const th=e.target.closest("th");const startX=e.clientX, startW=th.offsetWidth;
  document.body.classList.add("resizing");
  const move=ev=>{const w=Math.max(60,startW+(ev.clientX-startX));ST.connW[key]=w;th.style.width=w+"px";};
  const up=()=>{document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);
    document.body.classList.remove("resizing");saveConnPrefs();};
  document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);}
function sortConn(f){if(ST.connSort.field===f)ST.connSort.dir*=-1;else ST.connSort={field:f,dir:1};renderConnections();}
function toggleSel(id){if(ST.sel.has(id))ST.sel.delete(id);else ST.sel.add(id);render();}
function toggleAll(box,ids){if(box.checked)ids.forEach(i=>ST.sel.add(i));else ids.forEach(i=>ST.sel.delete(i));render();}
function renderBulk(){if(!ST.sel.size)return"";
  const tagBtns=PRIMARY_QUICK_TAGS.map(t=>`<button class="btn sm bulktag${tagBlock(t)?' blk':''}" onclick="bulkTag('${t}','add')" title="Add '${t}' to all ${ST.sel.size} selected">${tagBlock(t)?'⛔':'＋'} ${t}</button>`).join("");
  return `<div class="bulk"><b>${ST.sel.size}</b> selected
  <span class="bulklbl">Tag all →</span> ${tagBtns}
  <span class="bulksep"></span>
  <button class="btn teal sm" onclick="bulkStar()" title="Mark all selected preferred">★ Prefer</button>
  <button class="btn sm" onclick="bulkPrincipal()" title="Mark all selected as agency principals">🛡 Principal</button>
  <button class="btn gray sm" onclick="ST.sel.clear();render()">Clear</button>
  <span class="x" onclick="ST.sel.clear();render()">×</span></div>`;}
/* Bulk actions apply to every selected connection (local state only in the demo), then clear
   the selection so the rows reflect it immediately. */
function bulkTag(t,action){const ids=[...ST.sel];if(!ids.length)return;snapshot("bulk "+action+" tag");
  ids.forEach(id=>{const p=personById(id);if(action==="add"){if(!p.tags.includes(t))p.tags.push(t);}else p.tags=p.tags.filter(x=>x!==t);});
  toast((action==="add"?"Tagged ":"Untagged ")+ids.length+" · "+t,"ok");ST.sel.clear();render();}
function bulkStar(){const ids=[...ST.sel];if(!ids.length)return;snapshot("bulk prefer");
  ids.forEach(id=>personById(id).isStarred=true);
  toast(ids.length+" marked preferred","ok");ST.sel.clear();render();}
function bulkPrincipal(){const ids=[...ST.sel];if(!ids.length)return;snapshot("bulk principal");
  ids.forEach(id=>{const p=personById(id);p.isPrincipal=true;p.isPrincipalSource="eric";});
  toast(ids.length+" marked principal","ok");ST.sel.clear();render();}

/* ============================ INTRO LIBRARY (A/B) ============================ */
/* ══ MESSAGE LIBRARY BOARD ═══════════════════════════════════════════════════════════════
   Renders ONE funnel at a time (ST.libFunnel; defaults to the root/baseline). Columns are that
   funnel's stages; cards are the options in each stage; a branch is a chip inside the card of the
   message that spawned it. Clicking a branch drills into ITS funnel — same screen, deeper path. */
function renderLibrary(){
  const fid=(funnelById(ST.libFunnel)?ST.libFunnel:rootFunnel().id);
  ST.libFunnel=fid;
  const f=funnelById(fid), ss=stagesOf(fid), archN=library.filter(m=>!m.isActive).length;
  const best={}; ss.forEach(st=>{best[st.id]=Math.max(...libByStage(st.id).map(replyPct),0);});
  const cols=ss.map(st=>{
    const msgs=library.filter(m=>m.stageId===st.id&&(ST.libShowArchived||m.isActive)).sort((a,b)=>a.sortOrder-b.sortOrder);
    const roots=msgs.filter(m=>!m.parentId), rootIds=new Set(roots.map(m=>m.id));
    const cards=roots.map(m=>optCard(m,best[st.id])+msgs.filter(x=>x.parentId===m.id).map(a=>optCard(a,best[st.id],true)).join("")).join("")
      /* an alternate whose base moved stage still has to render somewhere */
      +msgs.filter(m=>m.parentId&&!rootIds.has(m.parentId)).map(m=>optCard(m,best[st.id],true)).join("");
    return `<div class="stagecol">
      <div class="sh"><b>${esc(st.label)}</b><span class="n">stage ${st.sortOrder}</span>
        <span class="sx" title="Rename or delete this stage" onclick="stageMenu(${st.id},event)">⋯</span></div>
      ${cards}
      <button class="addmsg" onclick="newMsg(${st.id})" title="A new message option at the ${attrEsc(st.label)} stage">＋ Add option</button>
    </div>`;}).join("");
  const path=funnelPath(fid);
  const crumb=`<div class="crumb"><a onclick="openFunnel(${rootFunnel().id})">${esc(rootFunnel().label)} funnel</a>${
    path.map((h,i)=>` › <a onclick="openFunnel(${h.stage?h.stage.funnelId:rootFunnel().id})">${esc(h.stage?h.stage.label:'?')} · ${esc(h.message?h.message.code:'?')}</a>${
      i===path.length-1?` › <span class="cur">🌿 ${esc(h.branch.label)}</span>`:` › <a onclick="openFunnel(${h.funnel.id})">🌿 ${esc(h.branch.label)}</a>`}`).join("")}</div>`;
  $("v-intro").innerHTML=`
  <div class="pagehead"><div class="pht">
    <h1>Message Funnel
      ${(archN||ST.libShowArchived)?`<button class="btn ghost sm" style="float:right;font-weight:600" onclick="ST.libShowArchived=!ST.libShowArchived;renderLibrary()">${ST.libShowArchived?'Hide archived':'View archived'+(archN?' ('+archN+')':'')}</button>`:''}
    </h1>
    <p class="lede">${f.isRoot
      ? `Your <b>baseline funnel</b> — what everyone gets until a reply diverts them. Each <b>column is a stage</b>
         (add as many follow-ups as you need); each card is an <b>option</b> you might send at that stage.
         A <b>branch</b> lives inside the card of the message that asked the question — because that's the only
         place it means anything — and answering one moves the person into that branch's <b>own funnel</b>.`
      : `You're inside the <b>${esc(f.label)}</b> branch. These are its own stages — someone who answers this way
         leaves the parent drip for good, so they never see the parent's remaining stages.`}${
      ST.libShowArchived?' <b>Showing archived messages.</b>':''}</p>
  </div></div>
  ${crumb}
  <div class="libwrap"><div class="board" data-tut="lib-grid">${cols}
    <div class="stagecol addcol" onclick="addStage(${fid})" title="Add another stage to this funnel">＋ Add stage<br><span style="font-size:11px">(another follow-up)</span></div>
  </div></div>`;
}
/* one OPTION card: the message, its stats, and the branches it owns */
function optCard(m,bestPct,isAlt){
  const pct=replyPct(m), win=pct===bestPct&&pct>0&&m.assigned>0, brs=branchesOf(m.id);
  const stageOpts=stagesOf((stageById(m.stageId)||{}).funnelId)
    .map(x=>`<option value="${x.id}" ${x.id===m.stageId?'selected':''}>${esc(x.label)}</option>`).join("");
  const brHTML=`<div class="brs">${brs.length?'<div class="blbl">Branches from this message</div>':''}
    ${brs.map(b=>`<div class="br" onclick="openFunnel(${b.funnelId})" title="Open the ${attrEsc(b.label)} funnel">
      ${(b.quickKeys||[]).length?`<span class="bk">${esc((b.quickKeys||[]).join(','))}</span>`:''}
      <span class="bl">${esc(b.label)}</span>
      <span class="bgo">${library.filter(x=>x.isActive&&stagesOf(b.funnelId).some(s=>s.id===x.stageId)).length} msg ›</span>
      <span class="sx" title="Edit branch" onclick="event.stopPropagation();openBranchEditor(${b.id})">⋯</span></div>`).join("")}
    <div class="br add" onclick="openBranchEditor(null,${m.id})">＋ Add branch</div></div>`;
  return `<div class="opt ${isAlt?'alt':''} ${win?'winner':''} ${m.isActive?'':'arch'}">
    <div class="oh"><span class="code">${m.code}</span>
      ${win?'<span class="pill p-grn" title="best reply rate at this stage">🏆</span>':''}
      ${!m.isActive?'<span class="pill p-gray">archived</span>':''}
      <div class="ot">${esc(m.title)}</div></div>
    <div class="ob" onclick="this.classList.toggle('open')" title="Click to expand / collapse">${esc(m.body)}</div>
    <div class="of">
      <span title="${m.replied} replied · ${m.viewed} viewed"><b>${m.assigned}</b> sent ·
        <b style="color:${pct>=20?'var(--green)':pct>=10?'var(--amber)':'var(--red)'}">${pct}%</b> reply</span>
      ${m.versions.length?`<span class="linkish" onclick="msgHistory(${m.id})">${m.versions.length} ver</span>`:''}
      <span class="oacts">
        <select class="ov" title="Move to another stage" onchange="moveMsgStage(${m.id},+this.value)">${stageOpts}</select>
        <button class="btn ghost sm" onclick="editMsg(${m.id})">Edit</button>
        <button class="btn gray sm" onclick="addAlt(${m.id})" title="Add an A/B alternate">＋Alt</button>
        <button class="btn ${m.isActive?'red ghost':'gray'} sm" onclick="archiveMsg(${m.id})"
          title="${m.isActive?'Archive — stops appearing in the pickers, keeps its stats':'Restore'}">${m.isActive?'Archive':'Restore'}</button>
      </span></div>
    ${brHTML}</div>`;
}
function openFunnel(fid){ST.libFunnel=fid;renderLibrary();window.scrollTo(0,0);}
/* move an option to another stage of the SAME funnel — alternates follow their base (a family
   must never straddle two stages), and `setstage` avoids logging a bogus wording version. */
function moveMsgStage(id,sid){const m=msgById(id);if(!m||m.stageId===sid)return;
  snapshot("move option to another stage");
  [m].concat(library.filter(x=>x.parentId===m.id)).forEach(x=>x.stageId=sid);
  toast(m.code+" → "+((stageById(sid)||{}).label||"stage"),"ok");renderLibrary();}

/* ---- STAGES — the columns. Fully user-defined so any deployment can run 3 follow-ups or 6. ---- */
function addStage(fid){
  const label=(prompt('Name the new stage (e.g. "Follow-up 4"):',"Follow-up "+stagesOf(fid).length)||"").trim();
  if(!label)return;
  snapshot("add stage");
  const id=Date.now();
  stages.push({id:id,funnelId:fid,label:label,hint:"",sortOrder:stagesOf(fid).length});
  toast("Stage added: "+label,"ok");renderLibrary();}
/* The ⋯ on a stage header. v1 of this was a single prompt() where you deleted the stage by
   blanking the field — the capability existed but nothing announced it, so it read as missing.
   List the actions instead. */
function stageMenu(sid,ev){ev.stopPropagation();closeStageMenu();
  const st=stageById(sid);if(!st)return;
  const host=ev.currentTarget.parentElement;
  const m=document.createElement("div");m.className="smenu";
  m.innerHTML=`<button onclick="renameStage(${sid})">Rename stage…</button>
    <div class="sep"></div>
    <button class="danger" onclick="deleteStage(${sid})">Delete stage…</button>`;
  host.appendChild(m);
  setTimeout(()=>document.addEventListener("click",closeStageMenu,{once:true}),0);}
function closeStageMenu(){document.querySelectorAll(".smenu").forEach(x=>x.remove());}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeStageMenu();});
function renameStage(sid){closeStageMenu();const st=stageById(sid);if(!st)return;
  const label=prompt("Rename this stage:",st.label);
  if(label===null||!label.trim())return;
  snapshot("rename stage");st.label=label.trim();renderLibrary();}
/* Deleting a stage is never just a column disappearing: its messages have to land somewhere,
   and `fu_step` is an INDEX into the stage order, so everyone at or past it shifts down one.
   Say both out loud before doing it. */
function deleteStage(sid){closeStageMenu();
  const st=stageById(sid);if(!st)return;
  const n=library.filter(m=>m.stageId===sid&&m.isActive).length;
  const sibs=stagesOf(st.funnelId).filter(x=>x.id!==sid);
  if(!sibs.length){toast("A funnel needs at least one stage","warn");return;}
  const nb=sibs.slice().sort((a,b)=>Math.abs(a.sortOrder-st.sortOrder)-Math.abs(b.sortOrder-st.sortOrder))[0];
  const shifted=people.filter(p=>(p.funnelId||rootFunnel().id)===st.funnelId
    &&(p.fuStep!=null&&p.fuStep>=st.sortOrder)&&!p.funnelExited).length;
  let msg='Delete the "'+st.label+'" stage?';
  if(n)msg+='\n\n• '+n+' message'+(n===1?'':'s')+' move'+(n===1?'s':'')+' to "'+nb.label+'" (nothing is deleted).';
  if(shifted)msg+='\n\n• '+shifted+' '+(shifted===1?'person is':'people are')+' at or past this stage and will shift back one step, so their next message is whatever takes this slot.';
  if(!n&&!shifted)msg+='\n\nIt is empty — nothing else changes.';
  if(!confirm(msg))return;
  snapshot("delete stage");
  library.forEach(m=>{if(m.stageId===sid)m.stageId=nb.id;});
  people.forEach(p=>{if((p.funnelId||rootFunnel().id)===st.funnelId&&p.fuStep!=null&&p.fuStep>=st.sortOrder)p.fuStep-=1;});
  stages=stages.filter(x=>x.id!==sid);
  stagesOf(st.funnelId).forEach((x,i)=>x.sortOrder=i);
  toast("Stage deleted"+(n?" — "+n+" message"+(n===1?'':'s')+" moved to "+nb.label:""),"ok");renderLibrary();}

/* ---- BRANCHES — owned by ONE option; creating one also creates its funnel + first stage. ---- */
function openBranchEditor(bid,messageId){
  const b=bid?branches.find(x=>x.id===bid):null, m=msgById(b?b.messageId:messageId);
  openModal(`<div class="mhead"><div><h2>${b?"Edit branch":"New branch"}</h2>
    <div class="sub">A branch is a classified reply to <span class="code">${esc(m?m.code:'?')}</span>. Answering it takes the
    person OFF this funnel and into a funnel of the branch's own — they won't see the remaining stages here.</div></div>
    <div class="dclose" onclick="closeModal()">×</div></div>
    <div class="mbody">
      <label class="fld">Name</label>
      <input type="text" id="bt-label" value="${b?attrEsc(b.label):''}" placeholder="e.g. Interested — wants pricing" style="width:100%;margin-bottom:12px">
      <label class="fld">Description <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— optional; shown in the classifier</span></label>
      <input type="text" id="bt-hint" value="${b?attrEsc(b.hint||''):''}" placeholder="when this branch applies" style="width:100%;margin-bottom:12px">
      <label class="fld">Quick-pick keys <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— optional shortcut, leave blank if it doesn't fit</span></label>
      <input type="text" id="bt-quick" value="${b?attrEsc((b.quickKeys||[]).join(', ')):''}" placeholder="e.g. yes, y   —   or   1, 2   —   or leave empty" style="width:100%;margin-bottom:6px">
      <div class="muted" style="font-size:12px;margin-bottom:6px">Purely a convenience: any short token you'd recognise in a reply
        becomes a one-click button in the classifier. Branches work exactly the same with none set — you just pick by name.</div>
      <div class="btnrow" style="margin-top:16px;justify-content:${b?'space-between':'flex-end'}">
        ${b?`<button class="btn red ghost sm" onclick="deleteBranch(${b.id})">Delete branch</button>`:''}
        <span><button class="btn gray" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="saveBranch(${b?b.id:'null'},${m?m.id:'null'})">${b?'Save':'Create branch'} →</button></span></div>
    </div>`);
}
function saveBranch(bid,messageId){
  const label=($("bt-label").value||"").trim(); if(!label){toast("Give the branch a name","warn");return;}
  const hint=($("bt-hint").value||"").trim();
  const quickKeys=($("bt-quick").value||"").split(",").map(s=>s.trim()).filter(Boolean);
  snapshot(bid?"edit branch":"new branch");
  if(bid){const b=branches.find(x=>x.id===bid);
    if(b){b.label=label;b.hint=hint;b.quickKeys=quickKeys;const f=funnelById(b.funnelId);if(f)f.label=label;}
    closeModal();toast("Branch updated","ok");renderLibrary();return;}
  const id=Date.now(), fid=id+1;
  funnels.push({id:fid,label:label,branchId:id,isRoot:false,people:0});
  stages.push({id:fid*1000+1,funnelId:fid,label:"Reply 1",hint:"First message after they answer",sortOrder:0});
  branches.push({id:id,messageId:messageId,funnelId:fid,key:"b"+id,label:label,hint:hint,quickKeys:quickKeys,
                 sortOrder:branchesOf(messageId).length,people:0});
  closeModal();toast("Branch created — it has its own funnel now","ok");renderLibrary();}
function deleteBranch(bid){const b=branches.find(x=>x.id===bid);if(!b)return;
  const nm=library.filter(m=>stagesOf(b.funnelId).some(s=>s.id===m.stageId)).length;
  if(!confirm('Delete the "'+b.label+'" branch?'+(nm?"\n\nIts "+nm+" message"+(nm===1?'':'s')+" will be archived back onto the baseline, and "+(b.people||0)+" people return to the baseline funnel.":"")))return;
  snapshot("delete branch");
  const first=stagesOf(rootFunnel().id)[0];
  const bstages=stagesOf(b.funnelId).map(s=>s.id);
  library.forEach(m=>{if(bstages.indexOf(m.stageId)>=0){m.stageId=first.id;m.isActive=false;}});
  people.forEach(p=>{if(p.funnelId===b.funnelId){p.funnelId=rootFunnel().id;p.fuStep=0;}});
  stages=stages.filter(s=>s.funnelId!==b.funnelId);
  funnels=funnels.filter(f=>f.id!==b.funnelId);
  branches=branches.filter(x=>x.id!==bid);
  if(ST.libFunnel===b.funnelId)ST.libFunnel=rootFunnel().id;
  closeModal();toast("Branch deleted","ok");renderLibrary();}

function insertMacro(taId,macro){const ta=$(taId);if(!ta)return;const tag="{{"+macro+"}}";
  const s=ta.selectionStart??ta.value.length,e=ta.selectionEnd??ta.value.length;
  ta.value=ta.value.slice(0,s)+tag+ta.value.slice(e);ta.focus();ta.selectionStart=ta.selectionEnd=s+tag.length;
  ta.dispatchEvent(new Event("change"));}
function addRecipients(cid){snapshot("add recipients");const c=campaigns[cid];const seg=$("enrollSeg").value;
  const pool=people.filter(p=>{if(seg==="starred")return p.isStarred&&["accepted","intro_sent"].includes(p.stage);
    if(seg==="principal")return p.isPrincipal&&["accepted","intro_sent"].includes(p.stage);return p.stage===seg;});
  let added=0;pool.forEach(p=>{if(!enrollments.some(e=>e.campaignId===cid&&e.personId===p.id)){
    enroll(c,p,0,"active");added++;
    if(c.status==="active"&&msgQueue.filter(m=>m.status==="pending").length<14)
      msgQueue.push({id:mqId++,campaignId:cid,personId:p.id,stepId:c.steps[0].id,status:"pending"});}});
  toast(added?`Added ${added} recipient${added!==1?'s':''}`:"Everyone matching is already enrolled",added?"ok":"");renderCampaigns();}
function unenroll(eid){snapshot("remove recipient");const e=enrollments.find(x=>x.id===eid);
  enrollments=enrollments.filter(x=>x.id!==eid);msgQueue=msgQueue.filter(m=>!(m.personId===e.personId&&m.campaignId===e.campaignId&&m.status!=="sent"));renderCampaigns();}
function approveMsg(id){snapshot("approve message");msgQueue.find(m=>m.id===id).status="approved";renderCampaigns();}
function skipMsg(id){snapshot("skip message");msgQueue.find(m=>m.id===id).status="skipped";renderCampaigns();}
function runSender(cid){
  const approved=msgQueue.filter(m=>m.campaignId===cid&&m.status==="approved");
  if(!approved.length){toast("Approve some messages first");return;}
  snapshot("run sender");const btn=$("sendbtn-"+cid),bar=$("sendbar-"+cid);if(btn)btn.disabled=true;
  let i=0;const total=approved.length;
  const tick=()=>{if(i>=total){if(bar)bar.style.width="100%";
      toast(`Sent ${total} message${total!==1?'s':''}`,"ok");setTimeout(renderCampaigns,400);return;}
    const m=approved[i];m.status="sent";const e=enrollments.find(x=>x.campaignId===cid&&x.personId===m.personId);
    if(e){const c=campaigns[cid];e.curStep=Math.min(c.steps.length-1,e.curStep+1);if(e.curStep>=c.steps.length-1)e.status="done";}
    i++;if(bar)bar.style.width=(i/total*100)+"%";setTimeout(tick,420);};
  tick();
}

/* Activity = the person's event log. The PROTOTYPE derives it from state/timestamps; the REAL build
   writes an event_log row on every transition (worker/sync/manual) — see BUILD_NOTES §3. */
function personEvents(p){
  const ev=[], add=(at,what,kind)=>{if(at)ev.push({at,what,kind:kind||"you"});};
  add(p.addedAt,"Synced in from the Outreach Engine → warming","sync");
  if(p.resolved)add(p.addedAt,"LinkedIn profile resolved via Unipile","system");
  if(p.viewCount)add(p.lastViewedAt||p.addedAt,"Profile auto-viewed ×"+p.viewCount+" (warm-up)","worker");
  add(p.requestSentAt,"Connection request sent","worker");
  add(p.connectedAt,"Connection accepted","them");
  add(p.introSentAt,"Intro sent"+(p.introKind==='loom'?" (Loom)":""),"you");
  if(p.fuStep>0)add(p.lastActivityAt,"Follow-up "+p.fuStep+" sent","you");
  if(p.replyCount)add(p.lastInboundAt,"Replied ("+p.replyCount+")","them");
  return ev.filter(e=>e.at).sort((a,b)=>(b.at>a.at?1:b.at<a.at?-1:0));
}

  if(p.overrideEligibility&&blockingTagsOf(p).length)return '<span class="pill p-amb">⚠ overridden — sending despite '+blockingTagsOf(p).map(esc).join(", ")+'</span>';

    <div class="frow"><div class="fv"><button class="btn ghost sm" onclick="classifyPerson(${p.id})">↻ Re-scrape &amp; classify</button></div></div>`;

        <p class="muted" style="font-size:12px;margin:2px 0 6px">Three modes, one entry per line. <b>In quotes</b> = a literal word/phrase to never use (<code>*</code> = any word(s)), e.g. <code>"leverage"</code> or <code>"the * realm of"</code> — multiple per line is fine: <code>"frame" "framing"</code>. <b>Quoted ending in an ellipsis</b> (<code>…</code> or <code>...</code>) = a forbidden <b>opener</b>: banned only as a lead-in, never the word elsewhere, e.g. <code>"Enter…"</code>. <b>Without quotes</b> = a framing / style directive, e.g. <code>No staccato formatting</code>. Literal bans are stripped deterministically; openers + directives steer the writer prompt. <b>Em/en dashes are always stripped</b> regardless. This tool keeps its own copy — no cross-project dependency.</p>

          <div class="rinfo"><b>Automated profile-view warm-up</b><div class="muted">A worker quietly views on-deck prospects' profiles on a cycle (they often notice) so you're not a cold stranger when the request lands — alongside your manual warm-up.</div></div></div>
        <div class="twocol" style="margin-top:8px">
          <div><label class="fld">Views / day</label><input type="number" id="sv-view-day" value="${settings.view_daily_limit}" style="width:100%"></div>

          <div class="rinfo"><b>Auto-withdraw stale invitations</b><div class="muted">Sent connection requests that go unanswered past the window are withdrawn automatically, keeping your pending-invite count healthy.</div></div></div>
        <div class="twocol" style="margin-top:8px">
          <div><label class="fld">Withdraw after (days)</label><input type="number" id="sv-wd-days" value="${settings.withdraw_after_days}" style="width:100%"></div>
          <div></div>

      </div>
      <div class="btnrow" style="margin-top:18px;justify-content:flex-end">
        <button class="btn gray" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="saveSettings()">Save settings</button></div>
    </div>`);
  setSetTab(sec);
}
function setSetTab(s){document.querySelectorAll(".settab").forEach(t=>t.classList.toggle("on",t.dataset.s===s));
  ["voice","critic","funnel","automation"].forEach(k=>$("set-"+k).classList.toggle("on",k===s));}
function saveSettings(){snapshot("edit settings");
  const g=id=>$(id);
  /* snapshot the old value of each versioned voice/style field before overwriting (live: settings_versions) */
  const ver=(key,nv)=>{if(nv!==settings[key])(styleVersions[key]=styleVersions[key]||[]).push(mkStyleVer(TODAY,"edit",settings[key]));};
  if(g("sv-style")){ver("voice_style",g("sv-style").value);ver("voice_pov",g("sv-pov").value);ver("voice_background",g("sv-bg").value);
    settings.voice_style=g("sv-style").value;settings.voice_pov=g("sv-pov").value;settings.voice_background=g("sv-bg").value;
    settings.writer_model=g("sv-writer").value;settings.fallback_model=g("sv-fallback").value;settings.learn_model=g("sv-learn").value;}
  if(g("sc-enabled")){ver("critic_rubric",g("sc-rubric").value);
    settings.critic_enabled=g("sc-enabled").checked;settings.critic_model=g("sc-model").value;settings.critic_rubric=g("sc-rubric").value;}
  if(g("sb-list")){settings.blacklist=g("sb-list").value;}
  if(g("sf-enabled")){settings.funnel_enabled=g("sf-enabled").checked;settings.funnel_dry_run=g("sf-dry").checked;
    settings.funnel_per_run_cap=+g("sf-run").value;settings.funnel_daily_limit=+g("sf-day").value;
    settings.funnel_soak_business_days=+g("sf-soak").value;settings.send_identity=g("sf-ident").value;}
  if(g("sv-view-en")){settings.view_enabled=g("sv-view-en").checked;settings.view_daily_limit=+g("sv-view-day").value;settings.view_cooldown_days=+g("sv-view-cd").value;
    settings.withdraw_enabled=g("sv-wd-en").checked;settings.withdraw_after_days=+g("sv-wd-days").value;}
  closeModal();toast("Settings saved","ok");render();}

/* ============================ voice/style version history (⏱ links in Settings) ============================ */
/* Mirrors the live /api/style/versions + /api/style/revert flow (settings_versions table) as pure
   local state: every prior value newest-first, per-version Revert, and reverting saves the current
   text as a new version first so you can always come back. */
const STYLE_FIELD_META={
  voice_style:{label:"Writing style", ta:"sv-style"},
  voice_pov:{label:"Point of view", ta:"sv-pov"},
  voice_background:{label:"Background", ta:"sv-bg"},
  critic_rubric:{label:"Critic rubric", ta:"sc-rubric"}};
function openStyleHistory(key){
  const m=STYLE_FIELD_META[key];if(!m)return;
  const versions=(styleVersions[key]||[]).slice().reverse();   // newest first
  const box=v=>`<div style="font-size:12px;white-space:pre-wrap;max-height:110px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:7px">${esc(v||'(empty)')}</div>`;
  const rows=versions.map(v=>`<div class="lrev" style="align-items:flex-start">
    <div style="flex:1"><div class="muted" style="font-size:11.5px;margin-bottom:3px">${esc(fmtDate(v.at))} · ${esc(v.source||'edit')}</div>${box(v.value)}</div>
    <button class="btn ghost sm" style="margin-top:16px" onclick="revertStyle('${key}',${v.id})">↩ Revert to this</button></div>`).join("");
  openModal(`<div class="mhead"><div><h2>⏱ ${esc(m.label)} — version history</h2>
    <div class="sub">Every prior value, newest first. Reverting saves the current text first, so you can always come back.</div></div>
    <div class="dclose" onclick="closeModal()">×</div></div>
    <div class="mbody">
      <div class="lct">Current</div><div style="margin:3px 0 13px">${box(settings[key])}</div>
      <div class="lct">Previous versions <span class="muted">— ${versions.length}</span></div>
      ${rows||'<div class="muted" style="margin-top:6px">No prior versions yet — they appear here as you edit or apply learnings.</div>'}</div>`);
}
function revertStyle(key,vid){
  const m=STYLE_FIELD_META[key];if(!m)return;
  const v=(styleVersions[key]||[]).find(x=>x.id===vid);if(!v)return;
  snapshot("revert "+m.label);
  (styleVersions[key]=styleVersions[key]||[]).push(mkStyleVer(TODAY,"revert-save",settings[key]));  // current text saved first
  settings[key]=v.value;
  const ta=$(m.ta); if(ta)ta.value=v.value;   // no-op while the history modal is up; refreshed on reopen
  toast("Reverted "+m.label+" — reopen Settings to see it","ok");
  openStyleHistory(key);   // refresh so the just-left value now shows in the list
}

/* ============================ self-learning: review → propose → apply → undo ============================ */
const VFIELD_LABEL={voice_style:"Writing style", voice_pov:"Point of view", voice_background:"Background"};
function fieldLabel(f){return VFIELD_LABEL[f]||f;}

/* Parse the user's plain-English steer into the set of recommendation numbers to apply.
   Blank → the high-confidence ones. Handles "apply 1 and 2 but skip 3", "only 2", "skip 4". */
function parseNotesSelection(notes,recs){
  const all=recs.map(r=>r.n);
  notes=(notes||"").trim();
  if(!notes)return{sel:new Set(recs.filter(r=>r.conf==="high").map(r=>r.n)),mode:"default"};
  const EXCL=/\b(skip|skipping|don'?t|do not|not|drop|omit|exclude|without|leave out|ignore)\b/i;
  const INCL=/\b(only|just|apply|implement|use|include|do|add)\b/i;
  const clauses=notes.split(/\b(?:but|except|however)\b|[,;]/i);
  let include=new Set(),exclude=new Set(),sawInclude=false;
  clauses.forEach(c=>{
    const nums=(c.match(/[1-9]/g)||[]).map(Number).filter(n=>all.includes(n));
    if(!nums.length)return;
    if(EXCL.test(c))nums.forEach(n=>exclude.add(n));
    else{sawInclude=true;nums.forEach(n=>include.add(n));}   // bare numbers or include-verb => include
  });
  const sel=sawInclude?new Set([...include].filter(n=>!exclude.has(n)))
                      :new Set(all.filter(n=>!exclude.has(n)));
  return{sel,mode:"parsed"};
}

/* Build the proposal: append each chosen recommendation's rule to its target voice field, diff it.
   (In the real tool an LLM rewrites the field surgically; here we deterministically append the rule
   line so the demo shows a clean, honest before/after — see BUILD_NOTES §6.) */
function buildProposal(){
  const notes=$("ln-notes")?$("ln-notes").value:"";
  const {sel,mode}=parseNotesSelection(notes,LEARN_REPORT.recs);
  const chosen=LEARN_REPORT.recs.filter(r=>sel.has(r.n));
  const skipped=LEARN_REPORT.recs.filter(r=>!sel.has(r.n));
  const byField={};
  chosen.forEach(r=>(byField[r.field]=byField[r.field]||[]).push(r));
  const changes=Object.keys(byField).map(f=>{
    const before=settings[f];
    const after=before.trim()+"\n"+byField[f].map(r=>r.rule).join("\n");
    return{field:f,before,after,recs:byField[f].map(r=>r.n)};
  });
  let summary;
  if(!chosen.length)summary="No recommendations selected — nothing to change.";
  else summary=`Applying ${chosen.length} recommendation${chosen.length>1?"s":""} (${chosen.map(r=>"#"+r.n).join(", ")})`+
    (skipped.length?`; leaving out ${skipped.map(r=>"#"+r.n).join(", ")}${mode==="default"?" (tentative — not applied by default)":" per your notes"}.`:".");
  return{changes,summary,notes,chosenNums:chosen.map(r=>r.n),skippedNums:skipped.map(r=>r.n)};
}

function lineDiff(before,after){
  const b=before.split("\n"),a=after.split("\n");
  return a.map((ln,i)=>{const added=i>=b.length||b[i]!==a[i];
    return `<div class="dl ${added?"add":""}">${added?"+ ":"  "}${esc(ln)||"&nbsp;"}</div>`;}).join("");
}

function openLearnings(){
  openModal(`<div class="mhead"><div><h2>🧠 Reply self-learning</h2>
    <div class="sub">Review what the weekly analyzer found, add any notes, then push the ones you approve straight into your voice profile — with a diff first and one-click undo.</div></div>
    <div class="dclose" onclick="closeModal()">×</div></div>
    <div class="mbody" id="ln-body">${renderLearnBody()}</div>`);
}
function renderLearnBody(){
  const R=LEARN_REPORT;
  const recs=R.recs.map(r=>`<div class="lrec">
    <div class="lrn">${r.n}</div>
    <div style="flex:1">
      <div class="lrt">${esc(r.title)} <span class="pill ${r.conf==="high"?"p-grn":"p-amb"}">${r.conf==="high"?"high-confidence":"tentative"}</span></div>
      <div class="muted" style="font-size:12.5px;line-height:1.5">${esc(r.detail)}</div>
      <div class="miniinfo">→ targets <b>${fieldLabel(r.field)}</b></div></div></div>`).join("");
  const live=voiceRevisions.filter(v=>!v.undone).length;
  const revs=voiceRevisions.length?`<div class="lhist">
    <div class="lct" style="margin-bottom:5px">Applied changes — revision history</div>
    ${voiceRevisions.map((v,i)=>`<div class="lrev ${v.undone?"undone":""}">
      <div style="flex:1">
        <div style="font-size:12.5px"><b>${v.fields.map(fieldLabel).join(", ")}</b> · recs ${v.recs.map(n=>"#"+n).join(", ")} ${v.undone?'<span class="pill p-gray">undone</span>':""}</div>
        ${v.notes?`<div class="muted" style="font-size:11.5px">notes: ${esc(v.notes)}</div>`:""}
        <div class="muted" style="font-size:11.5px">${esc(v.summary)}</div></div>
      ${v.undone?"":`<button class="btn ghost sm" onclick="undoVoiceRevision(${i})">↩ Undo</button>`}</div>`).join("")}</div>`:"";
  return `
    <div class="lstats">This week · <b>${R.sent}</b> replies sent · <b>${R.edited}</b> edited before sending (${Math.round(R.edited/R.sent*100)}%) · analyzed ${esc(R.window)}${live?` · <span class="pill p-grn">${live} change${live>1?"s":""} applied</span>`:""}</div>
    <div class="lct" style="margin-top:13px">What it found <span class="muted" style="font-weight:400">— ${R.recs.length} recommendations</span></div>
    ${recs}
    <div class="lct" style="margin-top:15px">Your adjustments</div>
    <div class="muted" style="font-size:12px;margin-bottom:5px">Plain English — e.g. <i>"apply 1 and 2, skip 3"</i> or <i>"do 1 and 2 but not 3"</i>. Leave blank to apply the high-confidence ones (#1, #2).</div>
    <textarea id="ln-notes" style="min-height:58px" placeholder="Optional — which recommendations to apply, and any tweaks…"></textarea>
    <div class="btnrow" style="margin-top:9px">
      <button class="btn sm" onclick="proposeLearnings()">⚙ Propose voice-profile update</button>
      <span class="muted" style="font-size:11px">Shows a diff before anything is saved.</span></div>
    <div id="ln-result" style="margin-top:10px"></div>
    ${revs}`;
}
function proposeLearnings(){
  const p=buildProposal();_pendingProposal=p;
  const box=$("ln-result");
  if(!p.changes.length){box.innerHTML=`<div class="lcard"><b>No changes proposed.</b><div class="muted" style="font-size:12.5px;margin-top:3px">${esc(p.summary)}</div></div>`;return;}
  const diffs=p.changes.map(c=>`<div class="lf">
    <div class="lfh">${fieldLabel(c.field)} <span class="muted">(${c.field})</span></div>
    <div class="diffbox">${lineDiff(c.before,c.after)}</div></div>`).join("");
  box.innerHTML=`<div class="lcard">
    <div class="lct">Proposed voice-profile changes</div>
    <div class="muted" style="font-size:12.5px;margin:2px 0 8px">${esc(p.summary)}</div>
    ${diffs}
    <div class="btnrow" style="margin-top:12px">
      <button class="btn green sm" onclick="confirmProposal()">✓ Confirm &amp; update voice profile</button>
      <button class="btn gray sm" onclick="$('ln-result').innerHTML='';_pendingProposal=null">Cancel</button>
      <span class="muted" style="font-size:11px">Writes the voice fields · one-click undo after</span></div></div>`;
}
function confirmProposal(){
  const p=_pendingProposal;if(!p||!p.changes.length)return;
  snapshot("apply learnings");
  const before={};
  p.changes.forEach(c=>{before[c.field]=settings[c.field];
    (styleVersions[c.field]=styleVersions[c.field]||[]).push(mkStyleVer(TODAY,"apply-learnings",settings[c.field]));
    settings[c.field]=c.after;});
  voiceRevisions.unshift({at:TODAY,notes:p.notes,summary:p.summary,
    fields:p.changes.map(c=>c.field),recs:p.chosenNums,before,undone:false});
  _pendingProposal=null;
  toast("Voice profile updated — undo available","ok");
  render();                 // refresh the dashboard card / engage voice summary
  $("ln-body").innerHTML=renderLearnBody();   // re-render modal in place
}
function undoVoiceRevision(i){
  const r=voiceRevisions[i];if(!r||r.undone)return;
  snapshot("undo learnings apply");
  Object.keys(r.before).forEach(f=>settings[f]=r.before[f]);
  r.undone=true;
  toast("Reverted voice-profile change","ok");
  render();
  $("ln-body").innerHTML=renderLearnBody();
}

/* ============================ drawer / modal plumbing ============================ */
function openDrawer(html){$("drawer").innerHTML=html;$("drawer").classList.add("show");$("overlay").classList.add("show");}
function closeDrawer(){$("drawer").classList.remove("show");$("overlay").classList.remove("show");}
function openModal(html){$("modal").innerHTML=html;$("modalwrap").classList.add("show");}
function closeModal(){$("modalwrap").classList.remove("show");}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDrawer();closeModal();}});

/* ============================ boot ============================ */
loadConnPrefs();
go("dash");
/* Keep TODAY live: correct a tab left open across midnight without a manual reload. */
setInterval(()=>{const t=computeToday();if(t!==TODAY){TODAY=t;render();}},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const t=computeToday();if(t!==TODAY){TODAY=t;render();}}});
</script>

  else if(name==="skip"){ i = STORY_CH.length-1; render(); }
  else if(name==="close"){ finish("explore"); }
  else if(name==="tour"){ finish("tour"); }
  else if(name==="explore"){ finish("explore"); }
  else if(name==="quiet"){ finish("quiet"); }
  else if(name==="story"){ i = 1; render(); }

function finish(how){

function close(){
  if(veil && veil.parentNode) veil.parentNode.removeChild(veil);

  document.removeEventListener("keydown", onKey, true);
}

function onKey(e){
  if(!veil) return;
  var t=(document.activeElement||{}).tagName;
  if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT") return;
  if(e.key==="ArrowRight"){ e.preventDefault(); act("next"); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); act("back"); }
  else if(e.key==="Escape"){ e.preventDefault(); act("close"); }

  render();

{tab:"prospects",sel:"[data-tut=prospects-ondeck]",title:"Prospects: warming up",body:"Everyone here was picked for outreach but is not connected yet. <b>Warming</b> means becoming familiar before the request lands: view their profile, like or comment on a post. A background worker can view profiles for you, marked by the 🤖 auto-view chips. People notice who viewed them, so your request arrives from a name they half recognize rather than a stranger, and that raises accept rates."},
{tab:"prospects",sel:"[data-tut=prospects-guide]",title:"Send pacing & safety",body:"The tool never sends in bursts. There is a daily cap, every prospect has to sit a few <b>business days</b> on deck first (the “soak”), and real sends are spaced at randomized intervals so the pattern reads as a person. Send too fast and LinkedIn restricts your account, without warning. One more thing worth knowing: when someone <b>accepts</b>, the day's send budget grows a little."},
{tab:"pipeline",sel:"#v-pipeline .kcol",title:"You owe these people an intro",body:"When someone accepts your request they land in this first column. An accepted request with no message after it is a wasted connection, so think of this as your <b>debt list</b>. Cards move right as you send the intro and up to three follow-ups. Follow-up 3 is the last touch, and it graduates them out into your regular Connections."},
{tab:"pipeline",sel:["#v-pipeline .pcard .pc-acts .btn","#v-pipeline .kanban"],title:"The send composer",body:"Click <b>Send intro</b> on a card and a composer opens: pick a template, see it already filled in with this person's name and company, and edit it however you like before sending. In the <b>real tool this sends the LinkedIn message for real</b>. In this demo it is simulated. Your edits are logged against the template and feed its A/B stats."},
{tab:"engage",sel:"#v-engage .qfrow",title:"Engage: your network's posts",body:"Recent posts from people you are connected with. Commenting keeps you visible, and relationships go cold when the only time anyone hears from you is a pitch. The <b>🌱 In prospects</b>, <b>📮 In pipeline</b> and <b>🤝 In follow-up</b> filters narrow the feed to people in your funnel, or the ones you promoted out of it. A comment on one of those posts is the best minute you will spend in this tool."},
{tab:"engage",sel:["#v-engage .post","#v-engage .feedwrap"],title:"Drafted replies in your voice",body:"<b>Draft reply</b> writes the comment as <i>you</i>, using the voice profile in Settings. A second model, the <b>critic</b>, reviews that draft, then a final pass strips em dashes and banned hype words. Nothing is posted until you have read it and approved it, and every edit you make teaches the tool more about how you write."},
{tab:"engage",sel:["#v-engage .grptitle.low","#v-engage .qfrow"],title:"The low-value filter",body:"Not every post deserves your time. Hiring announcements, reposts and promos are auto-labeled and moved into this group, so you can skip the noise or clear it in one click. Mislabeled something? One click puts it back in the main feed."},
{tab:"connections",sel:["#connTbody .tagcell","#v-connections .tablewrap"],title:"Triage: the tags that decide everything",body:"This is your whole network as a CRM table, and <b>tags drive everything</b>: <span class=\"tag\">agency</span> marks someone as an outreach target, while <span class=\"tag block\">⛔ personal / client / omit / do-not-pitch</span> BLOCK them from ever receiving automated outreach. These quick-tag chips let you tag anyone with one click, straight from the list."},
{tab:"connections",sel:["#v-connections .tagfilter","#v-connections .toolbar"],title:"Tri-state filters & the untagged flag",body:"Click a tag chip once to show only people <b>with</b> it, twice to show people <b>without</b> it, a third time to turn it off. A red dot on the <b>☰ More menu</b> in the top nav flags new connections that still need tagging, and Connections lives in that menu. Untagged people are invisible to every rule, so work them down to zero."},
{tab:"connections",sel:["#connTbody .summcell","#v-connections .tablewrap"],title:"Summary & role badges",body:"The Summary column is the AI researcher's one-line read on each person, plus a role badge: <b>🛡 principal</b>, meaning the agency owner and the person you actually want, <b>agency staff</b>, <b>freelance/solo</b>, or <b>in-house</b>. It answers “who is this?” without opening LinkedIn."},
{tab:"connections",sel:["[data-tut=conn-viewsbtn]","#v-connections .toolbar"],title:"Saved views",body:"Once you have the columns and filters arranged the way you want, save the layout as a named view, say “triage mode” or “principals only”, and flip between them here. Views remember column order, visibility and widths, and they persist in your browser."},
{tab:"invitations",sel:["#v-invitations .seg","#v-invitations h1"],title:"Invitations: the raw ledger",body:"Every pending connection invitation, in <b>both directions</b>, synced from LinkedIn, including requests you sent outside this tool. A big pile of stale sent invites looks spammy, so you can withdraw them here, and the real tool can withdraw them on its own after a set number of days. Invites you have received get accepted or ignored from the same place."},
{tab:"intro",sel:["#v-intro .board","#v-intro h1"],title:"The Message Funnel",body:"Everything the tool sends comes from here, laid out as a <b>funnel board</b>. Each <b>column is a stage</b>, and each card is an <b>option</b> you might send at that stage. Add as many stages as you need: a fifth follow-up is one click on <b>＋ Add stage</b>. Each card shows live performance (sent, reply rate), takes A/B variants (<span class=\"code\">1.1</span> under <span class=\"code\">1</span>), and can be <b>Archived</b> to retire it from the pickers without losing its stats."},
{tab:"campaigns",sel:["#v-campaigns .guide","#v-campaigns h1"],title:"Campaigns: a planned area",body:"Honest note: this tab is designed and specified but it is the least built out part of the plan. The idea is bulk message sequences to a chosen segment, with a per-message <b>approval queue</b> and daily caps. The core funnel, Prospects through Pipeline, does not depend on it at all. Treat it as a preview of where the tool goes next."},
{tab:"messages",sel:["#v-messages .guide","#v-messages h1"],title:"Messages: your synced inbox",body:"Your LinkedIn conversations, mirrored into the tool so every reply lands next to the person's CRM record. Unread counts, archiving and thread history work the way LinkedIn's inbox does. The sync runs on a schedule, and you can trigger it by hand."},
{tab:"followup",sel:["#v-followup h1","#v-followup"],title:"Follow-up: the hand-managed list",body:"When a conversation actually goes somewhere, you <b>promote</b> that person out of the automated funnel and into here. They get <b>no automated touches</b>. This is the deliberate, human list. Set a <b>date</b> to float someone back to the top when it is time to reach out again, and keep <b>notes</b> so you are not rebuilding the thread from memory weeks later. The <b>🤝 In follow-up</b> filter on Engage shows their posts so you can stay warm between touches."},
{tab:"pipeline",sel:["#v-pipeline .pcard .pc-acts .btn","#v-pipeline .kanban","#v-pipeline h1"],title:"Branching: when someone replies",body:"The follow-up sequence assumes silence, so the moment someone <b>replies</b> the generic nudges stop and the card asks you to <b>classify the reply</b>. You can <b>divert</b> them onto a <b>branch</b>, a path with its own pre-written messages for one kind of answer, or <b>exit</b> them when the conversation has become a real back and forth. If they answered a survey with a number, one click on that number routes them. It is what keeps a canned “no response yet?” from going out after somebody has already replied."},
{tab:"intro",sel:["#v-intro .br","#v-intro h1"],title:"Branches belong to a message",body:"A branch exists only because <b>one message asked a question</b>, so it lives <b>inside that message’s card</b> rather than off to the side. Add one with <b>＋ Add branch</b> on the card that asks. Answering it takes the person <b>off this funnel for good</b> and into the branch’s <b>own funnel</b>, with its own stages. Click the chip to drill in. <b>Quick-pick keys</b> are optional: any short token you’d recognise in a reply (<span class=\"code\">yes</span>/<span class=\"code\">no</span>, or a number) becomes a one-click classify button. Leave them blank and you pick the branch by name instead."},
{tab:"dash",sel:"[data-tut=dash-learn]",title:"The self-learning voice loop",body:"Once a week the tool studies how you <b>edited</b> its drafted replies and proposes numbered recommendations, things like “shorter openers” or “fewer questions”. You steer it in plain English, <i>“apply 1 and 2, skip 3”</i>, review a diff, then confirm. Every change is versioned: the <b>⏱ history</b> links in Settings hold every prior value of your voice profile, each one restorable in a click."},
{tab:"dash",sel:"[data-tut=settings-btn]",title:"Settings: everything real starts OFF",body:"The idea that matters most in this tool: every automated action, meaning connection requests, profile views, invite withdrawal and message sending, has its own <b>on/off switch</b>, a <b>dry-run</b> mode and <b>daily caps</b>. In a fresh install of the real tool, <b>every sender starts off</b>. You turn them on one at a time, once you trust what each one would do."},
{tab:"dash",sel:"#tutPill",title:"That's the tour!",body:"Switch this tutorial layer on and off with the 🎓 pill, or in ⚙ Settings, where you can also restart the tour. While it is on, small <b>?</b> hotspots sit around the app, and each one opens a plain-English explainer of that area. The best next step is to click through the funnel yourself with the hints on. Nothing here touches a real LinkedIn account."}

/* ---------------- engine ---------------- */
let tour={on:false,i:0};
const seenTabs=new Set();          // session-only: which tabs already showed their intro card
function mode(){try{return localStorage.getItem(KEY);}catch(e){return "on";}}
function setModeVal(m){try{localStorage.setItem(KEY,m);}catch(e){}}
function isOn(){return mode()==="on";}
function findEl(sel){const list=Array.isArray(sel)?sel:[sel];for(const s of list){const el=document.querySelector(s);if(el)return el;}return null;}

/* header pill */
const pill=document.createElement("button");
pill.id="tutPill";pill.className="tut-pill";pill.title="Tutorial mode: hotspots + guided tour";
pill.onclick=()=>TUT.setMode(isOn()?"off":"on");
const pillSlot=document.getElementById("tutPillSlot");   // now lives top-left on the breadcrumb row
const setBtn=document.querySelector('[data-tut=settings-btn]');
if(pillSlot)pillSlot.appendChild(pill);
else if(setBtn)setBtn.parentNode.insertBefore(pill,setBtn);
function syncPill(){pill.textContent=isOn()?"🎓 Tutorial ON":"🎓 Tutorial OFF";pill.classList.toggle("off",!isOn());}

/* ---- hotspots ---- */
let spotCard=null;
function removeSpots(){document.querySelectorAll(".tut-spot").forEach(s=>s.remove());closeSpotCard();}
function attachSpots(){
  removeSpots();
  if(!isOn()||tour.on)return;
  const modalOpen=document.getElementById("modalwrap").classList.contains("show");
  TUT_SPOTS.forEach((sp,i)=>{
    if(sp.tab==="modal"){if(!modalOpen)return;}
    else if(sp.tab!=="*"&&sp.tab!==ST.tab)return;
    const el=findEl(sp.sel);
    if(!el||el.querySelector(":scope>.tut-spot"))return;
    const b=document.createElement("button");
    b.className="tut-spot";b.type="button";b.textContent="?";b.title=sp.title;
    b.onclick=e=>{e.stopPropagation();e.preventDefault();openSpotCard(i,b);};
    el.appendChild(b);
  });
}
function openSpotCard(i,anchor){
  closeSpotCard();
  const sp=TUT_SPOTS[i];
  const c=document.createElement("div");c.className="tut-spotcard";c.id="tutSpotCard";
  c.innerHTML=`<div class="tut-ct">${sp.title}</div><div class="tut-cb">${sp.body}</div>
    <div class="tut-cf">${sp.step?`<span class="tut-link" onclick="TUT.start(${sp.step-1})">▶ Tour this area</span>`:""}
      <span class="tut-n" style="margin-left:auto;margin-right:0"></span>
      <button class="tut-b" onclick="TUT.closeCard()">Got it</button></div>
    <span class="tut-x" onclick="TUT.closeCard()">✕</span>`;
  document.body.appendChild(c);spotCard=c;
  const r=anchor.getBoundingClientRect();placeBox(c,r,"bottom");
  setTimeout(()=>document.addEventListener("click",spotCardOutside),0);
}
function spotCardOutside(e){if(spotCard&&!spotCard.contains(e.target))closeSpotCard();}
function closeSpotCard(){if(spotCard){spotCard.remove();spotCard=null;document.removeEventListener("click",spotCardOutside);}}

/* ---- tab intro cards (once per tab per session) ---- */
let tabCard=null,tabDim=null;
function hideTabCard(){if(tabCard){tabCard.remove();tabCard=null;}if(tabDim){tabDim.remove();tabDim=null;}}
function maybeShowTabCard(tab){
  if(!isOn()||tour.on||seenTabs.has(tab)||!TUT_TABS[tab])return;
  if(document.getElementById("modalwrap").classList.contains("show"))return;   // welcome open etc.

      <span style="margin-left:auto"></span><button class="tut-b" onclick="TUT.hideTab()">Got it</button></div>
    <span class="tut-x" onclick="TUT.hideTab()">✕</span>`;
  document.body.appendChild(c);tabCard=c;
}

/* ---- guided tour ---- */
let dim=null,halo=null,card=null;
function startTour(i){
  if(!isOn())TUT.setMode("on");
  closeModal();closeDrawer();closeSpotCard();hideTabCard();removeSpots();
  tour.on=true;tour.i=Math.max(0,Math.min(i||0,TUT_STEPS.length-1));
  const top=document.querySelector(".top");if(top)top.classList.add("tut-lift");
  if(!dim){
    dim=document.createElement("div");dim.className="tut-dim";
    halo=document.createElement("div");halo.className="tut-halo";
    card=document.createElement("div");card.className="tut-card";card.id="tutCard";
    document.body.appendChild(dim);document.body.appendChild(halo);document.body.appendChild(card);
  }
  showStep();
}
function showStep(){
  const idx=tour.i, st=TUT_STEPS[idx];
  if(st.tab&&ST.tab!==st.tab)go(st.tab);
  window.__tourTab=(st.tab&&st.tab!=="*")?st.tab:null;   // highlight that section's nav tab
  if(typeof renderTabs==="function")renderTabs();
  // Paint SYNCHRONOUSLY, then settle on rAF. The old code did all its work inside nested
  // requestAnimationFrame callbacks, so if rAF is starved — a hidden/background tab, or the
  // app mid re-render — the halo + card never got populated and the tour looked frozen.
  // Painting inline first (like the Outreach Engine's tour) makes it robust; the rAF pass
  // just re-measures after layout settles. `idx` guards against a skipped step's stale rAF.
  const paint=()=>{
    if(!tour.on||tour.i!==idx)return;                    // a newer step took over — bail
    const el=findEl(st.sel);
    if(!el){ // defensive: skip a step whose target is absent (fallbacks should prevent this)
      if(idx<TUT_STEPS.length-1){tour.i=idx+1;showStep();}else endTour();
      return;
    }
    el.scrollIntoView({block:"center",behavior:"auto"});
    const r=el.getBoundingClientRect();
    halo.style.top=(r.top-6)+"px";halo.style.left=(r.left-6)+"px";
    halo.style.width=(r.width+12)+"px";halo.style.height=(r.height+12)+"px";
    const last=idx===TUT_STEPS.length-1;
    const secName=(st.tab&&st.tab!=="*"&&typeof N_TABS!=="undefined")?N_TABS[st.tab]:"";
    card.innerHTML=`<div class="tut-kicker">Guided tour${secName?" · "+secName:""}</div><div class="tut-ct">${st.title}</div><div class="tut-cb">${st.body}</div>
      <div class="tut-cf"><span class="tut-n">step ${idx+1} of ${TUT_STEPS.length}</span>
        <button class="tut-b" ${idx===0?"disabled":""} onclick="TUT.back()">‹ Back</button>
        <button class="tut-b pri" onclick="${last?"TUT.end()":"TUT.next()"}">${last?"✓ Finish":"Next ›"}</button></div>
      <span class="tut-x" onclick="TUT.end()">✕ End tour</span>`;
    placeBox(card,r,st.pos||"bottom");
  };
  paint();                        // works even when rAF is throttled
  requestAnimationFrame(paint);   // re-measure after layout / re-render settles
}
function placeBox(box,r,pref){
  const vw=window.innerWidth,vh=window.innerHeight,m=12;
  box.style.visibility="hidden";box.style.top="0px";box.style.left="0px";
  const cw=box.offsetWidth,ch=box.offsetHeight;
  const below=r.bottom+m+ch<=vh-8, above=r.top-m-ch>=8;
  let top,left=r.left;
  if(pref==="top"&&above)top=r.top-m-ch;
  else if(below)top=r.bottom+m;
  else if(above)top=r.top-m-ch;
  else{top=Math.max(8,(vh-ch)/2);left=Math.max(8,(vw-cw)/2);}
  left=Math.min(Math.max(8,left),vw-cw-8);
  top=Math.min(Math.max(8,top),vh-ch-8);
  box.style.top=top+"px";box.style.left=left+"px";box.style.visibility="visible";
}
function endTour(reattach){
  tour.on=false;
  window.__tourTab=null;
  const top=document.querySelector(".top");if(top)top.classList.remove("tut-lift");
  if(typeof renderTabs==="function")renderTabs();
  if(dim){dim.remove();halo.remove();card.remove();dim=halo=card=null;}
  if(reattach!==false&&isOn())attachSpots();
}
document.addEventListener("keydown",e=>{
  if(!tour.on)return;
  if(e.key==="ArrowRight"){e.preventDefault();e.stopPropagation();TUT.next();}
  else if(e.key==="ArrowLeft"){e.preventDefault();e.stopPropagation();TUT.back();}
  else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();TUT.end();}
},true);
window.addEventListener("resize",()=>{if(tour.on)showStep();});

    <div class="sub">A 60-second orientation — you've never seen this tool before, and that's fine.</div></div>
    <div class="dclose" onclick="TUT.explore()">×</div></div>
    <div class="mbody">
      <p style="margin:0 0 10px;font-size:13.5px;line-height:1.6">This is a <b>LinkedIn relationship engine</b>. It works your network deliberately instead of ad hoc:
