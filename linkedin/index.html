<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn Engine — prototype</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2330; --muted:#5b6675; --line:#e3e7ec;
  --accent:#3858c6; --accent-soft:#e9eefb; --teal:#0f8f74; --teal-soft:#e1f4ef;
  --amber:#9a6a00; --amber-soft:#fbf0d8; --red:#b4322b; --red-soft:#fbe9e7;
  --green:#2f7d32; --green-soft:#e7f3e8; --purple:#5b3fb5; --purple-soft:#ece7fb;
  --gold:#a96100; --gold-soft:#fbf0d8; --prefgreen:#1b7a37; --pref-soft:#e7f6ec;
  --shadow:0 1px 2px rgba(18,28,45,.06),0 4px 14px rgba(18,28,45,.05);
  --brand:var(--purple);  /* LinkedIn / cross-tool channel colour — this tool's signature */
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.topin{display:flex;align-items:center;gap:24px;padding:0 24px;max-width:1360px;margin:0 auto}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px;padding:14px 0 12px;display:flex;align-items:center;gap:9px}
.brand .li{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:var(--brand);color:#fff;font-weight:800;font-size:13px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:1px}
.tabs{display:flex;gap:3px;align-self:stretch}
.tab{display:flex;align-items:center;gap:7px;padding:0 14px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.tab .tc{font-size:11px;font-weight:700;background:#eef1f5;color:var(--muted);border-radius:999px;padding:1px 7px}
.tab.active .tc{background:var(--purple-soft);color:var(--brand)}
.tab .tc.due{background:var(--red);color:#fff}
/* tour "you are here" highlight — the active section pops while the rest of the header dims */
.top.tut-lift{z-index:9502;pointer-events:none}
.tab.tour-here{background:var(--brand);color:#fff;border-radius:9px 9px 3px 3px;border-bottom-color:var(--brand);box-shadow:0 3px 14px rgba(112,72,232,.42)}
.tab.tour-here .tc{background:rgba(255,255,255,.26);color:#fff}
.tab.tour-here .tc.due{background:rgba(255,255,255,.34);color:#fff}
.spacer{flex:1}
.pipe{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:6px;opacity:.9}
.pipe b{color:var(--ink)}.pipe .arr{color:#c2cad6}
.gearbtn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:9px;padding:7px 12px;cursor:pointer}
.gearbtn:hover{border-color:#c8d2e8;color:var(--ink)}
.crumbrow{padding-top:7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.iconbtn{font:inherit;font-size:15px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:9px;width:34px;height:34px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.iconbtn:hover{border-color:#c8d2e8;color:var(--ink)}
.iconbtn:disabled{opacity:.4;cursor:not-allowed}
/* ---- main ---- */
.main{padding:22px 24px 80px;max-width:1360px;margin:0 auto}
h1{font-size:22px;margin:0 0 3px}
.lede{color:var(--muted);margin:0 0 18px;max-width:80ch}
.view{display:none}.view.show{display:block}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 3px;font-size:15px}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:960px){.grid2,.grid3{grid-template-columns:1fr}}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow)}
.kpi b{font-size:24px;display:block;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi .ksub{display:block;font-size:10.5px;opacity:.7;margin-top:2px;font-weight:600}
.kpi.tealk b{color:var(--teal)}.kpi.acck b{color:var(--accent)}.kpi.grnk b{color:var(--green)}
.kpi.redk b{color:var(--red)}.kpi.purk b{color:var(--purple)}.kpi.goldk b{color:var(--gold)}
/* bar chart / funnel */
.barrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
.barrow .lab{width:140px;color:var(--muted);text-align:right;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .track{flex:1;background:#eef1f5;border-radius:5px;height:18px;overflow:hidden}
.barrow .track i{display:block;height:100%;background:var(--brand);border-radius:5px;min-width:2px}
.barrow .track i.teal{background:var(--teal)}.barrow .track i.amber{background:var(--amber)}
.barrow .track i.green{background:var(--green)}.barrow .track i.accent{background:var(--accent)}
.barrow .val{width:38px;font-weight:600;font-variant-numeric:tabular-nums}
/* buttons */
.btn{font:inherit;font-weight:600;font-size:13px;border-radius:9px;padding:8px 15px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:#fff;color:var(--brand)}
.btn.accent{background:var(--accent);border-color:var(--accent)}.btn.accent.ghost{background:#fff;color:var(--accent)}
.btn.teal{background:var(--teal);border-color:var(--teal)}.btn.teal.ghost{background:#fff;color:var(--teal)}
.btn.gray{background:#fff;color:var(--muted);border-color:var(--line)}
.btn.amber{background:var(--amber);border-color:var(--amber)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.red.ghost{background:#fff;color:var(--red);border-color:#f2cfca}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
/* toolbar */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{font:inherit;font-size:12.5px;font-weight:600;border:0;background:#fff;color:var(--muted);padding:7px 13px;cursor:pointer}
.seg button.on{background:var(--purple-soft);color:var(--brand)}
.seg button+button{border-left:1px solid var(--line)}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--ink);background:#fff}
input[type=search]{min-width:230px}
textarea{width:100%;resize:vertical;line-height:1.5}
label.fld{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;margin:0 0 5px}
/* table */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:var(--panel);max-height:calc(100vh - 300px)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{background:#fafbfc;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}
th.nosort{cursor:default}
th .arr{color:var(--brand);font-size:10px;margin-left:3px}
tbody tr:hover{background:#f7f9fc}
tr.om td{color:#aab2bd}tr.om td .nm{text-decoration:line-through;text-decoration-color:#d8a39e}
.lead{font-weight:600;color:var(--ink)}
td .acct{color:var(--muted);font-size:12px}
.ck{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;vertical-align:middle}
.linkish{color:var(--accent);cursor:pointer}.linkish:hover{text-decoration:underline}
.listtbl{table-layout:fixed}.listtbl th,.listtbl td{overflow:hidden;text-overflow:ellipsis}
.listtbl th{position:relative}
.rsz{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;user-select:none}
.rsz:hover{background:#c8d2e8}
body.resizing{cursor:col-resize;user-select:none}
/* avatar */
.av{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;flex:0 0 auto}
.av.big{width:46px;height:46px;font-size:16px}
.person{display:flex;align-items:center;gap:9px;min-width:0}
.person .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.person .hl{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* pills */
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid;line-height:1.5}
.p-grn{color:var(--green);background:var(--green-soft);border-color:#c7e3c8}
.p-amb{color:var(--amber);background:var(--amber-soft);border-color:#ecd9a8}
.p-red{color:var(--red);background:var(--red-soft);border-color:#f2cfca}
.p-acc{color:var(--accent);background:var(--accent-soft);border-color:#d4ddf7}
.p-teal{color:var(--teal);background:var(--teal-soft);border-color:#c5e8df}
.p-pur{color:var(--purple);background:var(--purple-soft);border-color:#d8cdf3}
.p-gray{color:var(--muted);background:#eef1f5;border-color:var(--line)}
.tag{display:inline-block;font-size:10.5px;color:var(--muted);background:#eef1f5;border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin:1px 3px 1px 0}
.tag.block{color:var(--red);background:var(--red-soft,#fdecec);border-color:#f3c9c9;font-weight:600}
.tagcell{white-space:normal;line-height:1.7}
/* Summary column: classifier role badge + the profile summary, clamped to a few readable lines */
.summcell{max-width:360px;min-width:200px;white-space:normal}
.summcell .summtxt{font-size:11px;color:var(--muted);line-height:1.4;margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.summcell:hover .summtxt{-webkit-line-clamp:unset;overflow:visible}
.tagtog{cursor:pointer} .tagtog .tx{margin-left:3px;opacity:.45;font-weight:700}
.tagtog:hover{border-color:var(--accent);color:var(--accent)} .tagtog:hover .tx{opacity:1;color:var(--red)}
/* always-visible quick-tag toggle chips in the Connections Tags column (agency/museum/personal/client/omit) */
.qtag{display:inline-block;font-size:10.5px;border-radius:6px;padding:1px 7px;margin:1px 3px 1px 0;cursor:pointer;border:1px dashed var(--line);background:#fff;color:var(--muted);user-select:none}
.qtag:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.qtag.on{background:#e3f5f2;border-style:solid;border-color:var(--teal);color:var(--teal);font-weight:600}
.qtag.on-block{background:var(--red-soft,#fdecec);border-style:solid;border-color:#f3c9c9;color:var(--red);font-weight:600}
/* tri-state tag FILTER chips in the Connections toolbar (include / exclude / off) */
.tagfilter{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center}
.tfchip{display:inline-block;font-size:11px;border-radius:6px;padding:2px 8px;cursor:pointer;border:1px dashed var(--line);background:#fff;color:var(--muted);user-select:none;white-space:nowrap}
.tfchip:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.tfchip.inc{background:#e3f5f2;border-style:solid;border-color:var(--teal);color:var(--teal);font-weight:600}
.tfchip.exc{background:var(--red-soft,#fdecec);border-style:solid;border-color:#e6a6a2;color:var(--red);font-weight:600;text-decoration:line-through}
/* always-visible principal (shield) toggle in the Connections Facets column */
.ptog{display:inline-block;cursor:pointer;padding:2px 5px;border-radius:6px;border:1px dashed var(--line);color:var(--muted);vertical-align:middle;line-height:1}
.ptog:hover{border-style:solid;border-color:var(--gold);color:var(--gold)}
.ptog.on{border-style:solid;border-color:var(--gold);color:var(--gold);background:#fdf6e3}
.tagadd{border:1px dashed var(--line);background:#fff;color:var(--muted);border-radius:6px;padding:0 6px;font-size:12px;cursor:pointer;vertical-align:middle;line-height:1.5}
.tagadd:hover{border-color:var(--accent);color:var(--accent);border-style:solid}
.tagpop{position:absolute;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:200px;max-height:320px;overflow:auto}
.tagpop .tphead{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:3px 6px 6px}
.tprow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12.5px}
.tprow:hover{background:var(--bg)} .tprow.on{color:var(--accent);font-weight:600} .tprow.on.blk{color:var(--red)}
.tprow .tpck{color:var(--accent);font-weight:700} .tprow.blk .tpck{color:var(--red)}
.muted{color:var(--muted)}.tnum{font-variant-numeric:tabular-nums}
.star-prin{color:var(--gold)}.star-pref{color:var(--prefgreen)}
.badge-prin{color:var(--gold)}.ic-shield{vertical-align:-1px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:#eef1f5;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-weight:700;color:var(--ink)}
/* bulk bar */
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:40;background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(18,28,45,.28)}
.bulk b{font-size:14px}.bulk .x{cursor:pointer;color:#aab2bd;margin-left:4px}
.bulk .btn{padding:6px 12px;font-size:12.5px}
.bulk .btn.gray{background:#2b3446;color:#dfe4ec;border-color:#3a4459}
.bulk .bulklbl{font-size:11.5px;color:#aab2bd;margin-left:4px}
.bulk .bulksep{width:1px;align-self:stretch;background:#3a4459;margin:0 2px}
.bulk .btn.bulktag{padding:5px 9px;font-size:11.5px;background:#2b3446;color:#dfe4ec;border-color:#3a4459}
.bulk .btn.bulktag:hover{border-color:var(--teal);color:#fff}
.bulk .btn.bulktag.blk:hover{border-color:var(--red)}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(18,28,45,.32);z-index:50;display:none}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:500px;max-width:94vw;background:var(--panel);border-left:1px solid var(--line);z-index:51;transform:translateX(100%);transition:transform .18s;overflow:auto;box-shadow:-8px 0 30px rgba(18,28,45,.12)}
.drawer.show{transform:translateX(0)}
.dhead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:18px 20px;display:flex;align-items:flex-start;gap:12px;z-index:2}
.dhead h2{margin:0;font-size:18px}.dhead .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.dclose{margin-left:auto;cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
.dbody{padding:18px 20px 50px}
.frow{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid #f0f2f5;font-size:13px;align-items:center}
.frow .fl{width:118px;color:var(--muted);flex:0 0 auto}.frow .fv{flex:1}
.frow .fv input,.frow .fv select{width:100%;max-width:300px}
.sechead{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 0 7px;font-weight:700}
.sechead .secbtn{float:right;margin-top:-4px}
.hist{border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:7px;font-size:12.5px}
.hist b{font-size:13px}
.cnotes{width:100%;resize:vertical;min-height:60px}
/* guide / banner */
.guide{border:1px solid #d8cdf3;background:#faf8ff;border-radius:11px;padding:13px 16px;margin:0 0 18px;font-size:13px;color:var(--muted);display:flex;gap:11px}
.guide.teal{border-color:#c5e8df;background:#f6fdfb}
.guide.amber{border-color:#ecd9a8;background:var(--amber-soft)}
.guide b{color:var(--ink)}.guide .ic{font-size:18px;flex:0 0 auto}
/* page header */
.pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:8px}
.pagehead .pht{flex:1}.pagehead h1{margin-bottom:3px}
/* modal */
.modalwrap{position:fixed;inset:0;background:rgba(18,28,45,.34);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:52px 20px;overflow:auto}
.modalwrap.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:620px;width:100%;box-shadow:0 22px 60px rgba(18,28,45,.28);animation:tin .16s}
.modal.wide{max-width:820px}
.modal .mhead{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.modal .mhead h2{margin:0;font-size:18px}.modal .mhead .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.modal .mbody{padding:16px 20px 22px}
/* toast */
#toast{position:fixed;bottom:22px;left:22px;z-index:80;display:flex;flex-direction:column;gap:8px}
.to{background:var(--ink);color:#fff;padding:10px 15px;border-radius:9px;font-size:13px;box-shadow:0 6px 20px rgba(18,28,45,.25);animation:tin .2s}
.to.ok{background:#1f5e34}.to.warn{background:#7c5300}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
/* chips / filters */
.qfrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.chip2{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--ink)}
.chip2:hover{border-color:#c8d2e8}
.chip2.set{border-color:var(--brand);background:var(--purple-soft);color:var(--brand)}
.chip2 .c{font-size:10.5px;font-weight:700;background:#eef1f5;border-radius:999px;padding:0 6px}
.chip2.set .c{background:#fff}
/* segmented funnel kanban */
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;align-items:start}
@media(max-width:1100px){.kanban{grid-template-columns:repeat(2,1fr)}}
.kcol{background:#f1f3f7;border:1px solid var(--line);border-radius:12px;padding:11px;min-height:80px}
.kcol .kh{display:flex;align-items:center;justify-content:space-between;margin:0 2px 9px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.kcol .kh .n{background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;box-shadow:var(--shadow);cursor:pointer}
.pcard:hover{border-color:#c8d2e8}
.pcard .pc-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.pcard .pc-nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pc-hl{color:var(--muted);font-size:11px;line-height:1.35;margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pc-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pcard .pc-acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.miniinfo{font-size:11px;color:var(--muted);margin-top:5px}
.miniinfo.stale{color:var(--red);font-weight:600}
.cell-stale{color:var(--red);font-weight:600}
.soak{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600}
.soak.ready{color:var(--green)}.soak.wait{color:var(--amber)}
tr.resolving{background:repeating-linear-gradient(45deg,#fffdf5,#fffdf5 10px,#fff8e8 10px,#fff8e8 20px)}
tr.resolving .soak.wait{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
/* warm-up checklist */
.warm{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
.warmstep{display:inline-flex;align-items:center;gap:4px;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;cursor:pointer;color:var(--muted);background:#fff}

<script>
/* ============================ deterministic mock data ============================ */
/* Seeded PRNG so the prototype looks identical every load — never Math.random / Date.now
   for anything that affects layout (per the prototyping skill). */
let _s=20260626; const rnd=()=>{_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff;};
const pick=a=>a[Math.floor(rnd()*a.length)];
const chance=p=>rnd()<p;
/* TODAY = the live LOCAL date (matches the user's calendar day). Kept in parity with the
   production build (linkedin-engine/index.html). Safe here because the prototype's mock data is
   randomized per load anyway — only the relative "days ago" offsets keyed off this, and pinning it
   to a fixed string made July activity read as "today". Local-date parts, not toISOString(), so it
   doesn't jump a day near UTC midnight. */
/* TODAY = the live LOCAL date, recomputed on every render (+ passive midnight check at boot) so a
   long-open tab never drifts. Kept in parity with the production build. */
function computeToday(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
let TODAY=computeToday();
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const FN=["Amy","Dave","Priya","Marcus","Lena","Sam","Tomas","Grace","Owen","Nadia","Carl","Beth","Raj","Ivy","Pete","Dana","Leo","Mona","Hugo","Ella","Jasmine","Megan","Anurag","Kara","Devon","Sasha","Will","Nora","Felix","Gina"];
const LN=["Reyes","Park","Okafor","Nguyen","Hahn","Bauer","Lopez","Klein","Doyle","Frost","Mehta","Cole","Singh","Vargas","Ruiz","Webb","Shaw","Diaz","Pratt","Yoon","Holmes","Devine","Chadha","Boyd","Lane"];
const TITLES=["Owner","Founder","Creative Director","Principal","Managing Partner","Marketing Lead","CEO","Partner","Brand Strategist"];
const NAMEA=["Bright","North","Cedar","Pixel","Vivid","Anchor","Maple","Lumen","Forge","Harbor","Slate","Ember","Cobalt","Thicket","Atlas","Wren","Sable","Drift","Mosaic","Verge"];
const NAMEB=["Pixel","Field","Craft","Signal","Loft","Yard","Bloom","Stack","Pine","Wave","Bird","Path","Spark","Frame","Root","Press","Hill","Kite","Lane","Coast"];
const CITIES=[["Austin","TX"],["Columbus","OH"],["Denver","CO"],["Raleigh","NC"],["Portland","OR"],["Nashville","TN"],["Tampa","FL"],["Boise","ID"],["Madison","WI"],["Richmond","VA"]];
const HEADLINES=["Helping small brands punch above their weight","Founder • web & brand for growing teams",
  "Creative Director | brand systems & websites","We build sites that actually convert","Marketing partner to founder-led companies",
  "Design + strategy for ambitious SMBs","Fractional creative lead for B2B teams","Turning ideas into brands people remember",
  "Web · SEO · paid — full-funnel for SMBs","Brand storyteller & studio owner","Scaling agencies without the burnout","AI-curious creative director"];
/* Controlled tag vocabulary (live: linkedin_tag_vocab). `block:1` tags are the load-bearing OUTBOUND
   gate — a person carrying any blocking tag is ineligible for connection requests / campaign sends
   unless overrideEligibility is set. auto = the matcher may apply it; cat = grouping. */
const TAG_VOCAB={
  "agency":{d:"Works at a target agency — the outbound audience",block:0,auto:1,cat:"fit"},
  "in-intro-funnel":{d:"Currently in the post-connection intro sequence",block:0,auto:1,cat:"system"},
  "warm":{d:"Warm relationship",block:0,auto:0,cat:"relationship"},
  "referral":{d:"Came via a referral",block:0,auto:0,cat:"relationship"},
  "met-at-event":{d:"Met in person at an event",block:0,auto:0,cat:"relationship"},
  "local":{d:"Local to Raleigh",block:0,auto:1,cat:"fit"},
  "museum":{d:"Museum-sector contact",block:0,auto:1,cat:"industry"},
  "reviewed-uncertain":{d:"Identity reviewed, still uncertain",block:0,auto:0,cat:"review"},
  "personal":{d:"Personal contact — never pitch",block:1,auto:0,cat:"relationship"},
  "client":{d:"Existing client — never pitch",block:1,auto:0,cat:"relationship"},
  "omit":{d:"Explicitly excluded from outreach",block:1,auto:1,cat:"system"},
  "do-not-pitch":{d:"Do not send outbound",block:1,auto:0,cat:"system"}
};
const CONN_TAGS=Object.keys(TAG_VOCAB);                       // keeps existing references working
const NONBLOCK_TAGS=CONN_TAGS.filter(t=>!TAG_VOCAB[t].block); // safe pool for random seeding
function tagBlock(t){return !!(TAG_VOCAB[t]&&TAG_VOCAB[t].block);}
function blockingTagsOf(p){return p.tags.filter(tagBlock);}
function personBlocked(p){return !p.overrideEligibility&&p.tags.some(tagBlock);}   // v_blocked_connections
function outboundEligible(p){return p.tags.includes("agency")&&!personBlocked(p);} // v_outbound_eligible
function tagPill(t){return `<span class="tag${tagBlock(t)?' block':''}" title="${esc((TAG_VOCAB[t]||{}).d||t)}${tagBlock(t)?' · BLOCKS outbound':''}">${tagBlock(t)?'⛔ ':''}${esc(t)}</span>`;}

/* one "person" = a LinkedIn contact moving through the journey.
   stage = the outreach state machine:
     warming → request_sent → accepted → intro_sent (+ fu_step 0..3)
   warming/request_sent are PRE-connection (Prospects tab). There is NO "queued" stage:
   deciding to promote someone out of the Outreach Engine IS the decision to work them, so
   they sync straight into "warming" (on deck). The only automatic pre-step is resolving their
   LinkedIn profile / provider-id (via Unipile, mirrors linkedin_provider_id in the live :8806
   engine) — tracked by p.resolved; it kicks off on arrival, no manual action, and until it
   clears you can't warm or send them.
   accepted/intro_sent are POST-connection (Pipeline tab — intro + up to 3 follow-ups). */
const STAGE_META={
  warming:["Warming up","p-amb"], request_sent:["Request sent","p-acc"],
  accepted:["Connected","p-teal"], intro_sent:["Intro sent","p-pur"]
};
/* post-intro nurture is tracked by fu_step (0 = intro only, 1..3 = follow-ups), shown as columns */
function fuLabel(p){return p.stage!=="intro_sent"?"":(p.fuStep===0?"Intro sent":"Follow-up "+p.fuStep);}
function daysAgoISO(n){const d=Date.parse(TODAY+"T00:00:00")-n*86400000;const dt=new Date(d);
  return dt.getUTCFullYear()+"-"+String(dt.getUTCMonth()+1).padStart(2,"0")+"-"+String(dt.getUTCDate()).padStart(2,"0");}
function fmtDate(d){if(!d)return"—";const[y,m,day]=d.split("-").map(Number);return MONTHS[m-1]+" "+day;}
/* business-days-since helper mirrors funnel_send.business_days_since() — weekends excluded */
function bizDaysSince(iso){let n=0;let cur=Date.parse(iso+"T00:00:00");const end=Date.parse(TODAY+"T00:00:00");
  while(cur<end){cur+=86400000;const wd=new Date(cur).getUTCDay();if(wd!==0&&wd!==6)n++;}return n;}

let people=[], pid=0;
function mkAgency(){return pick(NAMEA)+" "+pick(NAMEB)+" "+pick(["Studio","Co.","Group","Agency","Collective","Labs"]);}
function mkPerson(stage,opts){
  const fn=pick(FN), ln=pick(LN), [city,state]=pick(CITIES), agency=mkAgency();
  const p=Object.assign({
    id:pid++, fn, ln, name:fn+" "+ln, title:pick(TITLES), agency, city, state,
    headline:pick(HEADLINES), profileUrl:"linkedin.com/in/"+fn.toLowerCase()+ln.toLowerCase(),
    score:Math.round(48+rnd()*50), stage,
    isPrincipal:chance(.34), isStarred:false, isMuted:false, engLikes:0, engReplies:0, tags:[],
    introMessageId:null, introKind:null, loomUrl:null,
    replyCount:0, lastInboundAt:null, notes:"",
    resolved:true, providerId:null,  // LinkedIn profile resolved via Unipile (provider-id). false = still resolving on arrival.
    isFreelance:false, isPrincipalSource:"auto",   // freelance facet + principal provenance (auto|eric)

   tool the list is DB-backed (settings.key='blacklist', seeded from blacklist.txt) and editable in
   Settings → Reply critic; reply_gen.py enforces it deterministically. This tool keeps its OWN copy
   (no cross-project dependency). */
const BANNED=["leverage","delve","comprehensive","game-changer","quietly","synergy","unlock","robust"];
/* Parse the editable blacklist string into literal ban words (quoted, no '*'/'…') for the mock
   reply strip, so editing the list in Settings visibly changes mock output. Mirrors reply_gen.parse_blacklist. */
function blLiterals(){
  const raw=settings.blacklist||"";
  const lits=[];
  raw.split(/\n/).forEach(line=>{line=line.trim();
    if(!line||line[0]!=='"')return;
    (line.match(/"([^"]+)"/g)||[]).forEach(m=>{const t=m.slice(1,-1).trim();
      if(t&&!/\.{3,}|…/.test(t)&&!t.includes("*"))lits.push(t);});});
  return lits.length?lits:BANNED;
}

function daysAgoLabel(iso){if(!iso)return"—";const n=Math.round((Date.parse(TODAY+"T00:00:00")-Date.parse(iso+"T00:00:00"))/86400000);
  return n<=0?"today":n===1?"1d ago":n+"d ago";}

/* precise post age for the Engage feed — minutes/hours while fresh, days after ~2 days (uses real
   elapsed time, so a post from earlier today reads "5h ago", not "today"). */
function postAge(iso){if(!iso)return"—";const t=Date.parse(iso);if(isNaN(t))return"—";
  const ms=Date.now()-t;if(ms<0)return"now";const h=Math.floor(ms/3600000);
  if(h<1){const m=Math.max(1,Math.floor(ms/60000));return m+"m ago";}
  if(h<48)return h+"h ago";return Math.round(h/24)+"d ago";}

/* Untagged-triage counters (live: meta.untaggedNew / meta.untaggedBacklog from linkedin_engine.py):
   connections that arrived AFTER the watch cutoff and are still untagged drive the red nav badge;
   the pre-cutoff backlog is counted separately (and excluded from the badge on purpose). */
function untaggedMeta(){

          untaggedBacklog:un.filter(p=>arrived(p)<=since).length};}

/* CONN_COLS reordered by ST.connOrder; keys not in connOrder keep their default position at the end
   (so a newly-added column still shows). person stays pinned first. */
function orderedCols(){
  const byKey=Object.fromEntries(CONN_COLS.map(c=>[c[0],c]));
  const seen=new Set(), out=[];
  (ST.connOrder||[]).forEach(k=>{if(byKey[k]&&!seen.has(k)){seen.add(k);out.push(byKey[k]);}});
  CONN_COLS.forEach(c=>{if(!seen.has(c[0]))out.push(c);});
  // keep 'person' first
  out.sort((a,b)=>(a[0]==="person"?-1:b[0]==="person"?1:0));
  return out;
}

/* ============================ PIPELINE (post-connection state machine) ============================ */
function renderPipeline(){
  /* 4 columns: Connected (owe an intro) → Intro sent → Follow-up 1 → Follow-up 2.
     Post-intro people are bucketed by fu_step. There is NO "Follow-up 3" column: sending follow-up 3
     is the LAST touch, so it GRADUATES the person out of the pipeline (drops the in-intro-funnel tag)
     — they become a regular connection, still visible + filterable in the Connections tab. */
  /* Pipeline membership = the in-intro-funnel tag: only contacts who came through the Prospect
     funnel and connected (NOT the whole 1st-degree network). "Connected — owe an intro" = accepted
     AND in-intro-funnel; the intro/follow-up columns are always in-funnel by construction. */
  /* A blocking tag (omit / personal / client / do-not-pitch) drops someone from the pipeline —
     tagging "omit" removes them here, unless outbound is explicitly overridden for them. */
  const inFunnel=p=>p.tags.includes("in-intro-funnel")&&!personBlocked(p);
  const cols=[
    {label:"Connected — owe an intro", list:people.filter(p=>p.stage==="accepted"&&inFunnel(p))},
    {label:"Intro sent", list:people.filter(p=>p.stage==="intro_sent"&&p.fuStep===0&&!personBlocked(p))},
    {label:"Follow-up 1", list:people.filter(p=>p.stage==="intro_sent"&&p.fuStep===1&&!personBlocked(p))},
    {label:"Follow-up 2", list:people.filter(p=>p.stage==="intro_sent"&&p.fuStep===2&&!personBlocked(p))},
  ];
  $("v-pipeline").innerHTML=`
  <h1>Pipeline</h1>
  <p class="lede">The post-connection nurture sequence. A new connection needs an <b>introduction</b> (a Loom or a text intro from your A/B library),
  then up to <b>three follow-ups</b>. Each card shows its <b>last touch</b> and how long ago, so you can see who's gone quiet and is due for a nudge.
  Sending <b>follow-up 3</b> is the final touch — it graduates them out of the pipeline into your regular <b>Connections</b> (sort there by follow-up status to see who finished).</p>
  <div class="kanban" style="grid-template-columns:repeat(4,1fr)">
    ${cols.map(col=>`<div class="kcol">
        <div class="kh"><span>${col.label}</span><span class="n">${col.list.length}</span></div>
        ${col.list.map(pipelineCard).join("")||'<div class="muted" style="font-size:12px;padding:6px 4px">—</div>'}
      </div>`).join("")}
  </div>`;
}
/* pipeline card message chips: the intro + every follow-up sent so far, accumulating as the person
   moves through the funnel. Hover a chip to read the actual text that went out — the logged send if
   we have it (incl. per-send edits), otherwise the template merged for this person. */
const attrEsc=s=>esc(s||"").replace(/"/g,"&quot;");
function _sendRec(p,type,step){return (p.sends||[]).filter(x=>x.type===type&&(type==="intro"||x.step===step)).pop();}
function touchBody(p,type,step){const s=_sendRec(p,type,step);if(s&&s.body)return s.body;
  const mid=type==="intro"?p.introMessageId:(p.fuMsgIds&&p.fuMsgIds[step]);
  if(mid!=null){const m=msgById(mid);if(m)return mergeText(m.body,p);}return "";}
function touchCode(p,type,step){const s=_sendRec(p,type,step);if(s&&s.code)return s.code;
  const mid=type==="intro"?p.introMessageId:(p.fuMsgIds&&p.fuMsgIds[step]);
  if(mid!=null){const m=msgById(mid);if(m)return m.code;}return "";}
function touchChips(p){
  if(p.stage!=="intro_sent")return "";
  const chips=[];const ic=touchCode(p,"intro"),ib=touchBody(p,"intro");
  chips.push(`<span class="pill p-pur" title="${ib?attrEsc(ib):'Intro sent'}">${p.introKind==='loom'?'📹 Loom':'✉ Intro'}${ic?' · '+esc(ic):''}</span>`);
  for(let s=1;s<=(p.fuStep||0);s++){const c=touchCode(p,"fu",s),b=touchBody(p,"fu",s);
    chips.push(`<span class="pill p-amb" title="${b?attrEsc(b):'Follow-up '+s+' sent — exact message not recorded'}">FL${s}${c?' · '+esc(c):''}</span>`);}
  return chips.join(" ");
}
function pipelineCard(p){
  let acts="", meta="", touch="";
  if(p.stage==="accepted"){
    acts=`<button class="btn sm" onclick="event.stopPropagation();openIntroPicker(${p.id})">✉️ Send intro</button>`;
    meta=`<span class="pill p-teal">connected ${daysAgoLabel(p.connectedAt)}</span>`;
  } else {  // intro_sent (with a fu_step 0..3)
    const m=msgById(p.introMessageId);
    const replied=p.replyCount>0;
    if(!replied&&p.fuStep<3){
      const next=p.fuStep+1;
      acts=`<button class="btn accent ghost sm" onclick="event.stopPropagation();openFollowupPicker(${p.id})" ${next===3?'title="Final touch — graduates them out of the pipeline"':''}>Send follow-up ${next} ${next===3?'· final →':'→'}</button>`;
    }
    meta=`${touchChips(p)} ${replied?'<span class="pill p-grn">✓ replied</span>':''}`;
    touch=lastTouchStamp(p);
  }
  return `<div class="pcard" onclick="openPerson(${p.id})">
    <div class="pc-top">${avatar(p)}<div style="min-width:0"><div class="pc-nm">${starGlyph(p)}${esc(p.name)}</div></div></div>
    <div class="pc-hl">${esc(p.headline)}</div>
    <div class="pc-meta">${meta}</div>
    ${touch}
    ${acts?`<div class="pc-acts">${acts}</div>`:''}</div>`;
}

/* ---- SEND COMPOSER (prototype; mock — no backend persist) ---------------------------
   Pick a template → see it MERGED for this person → edit the text → Send. The tweak is what
   gets "sent"; it does NOT fork the template. Ticking "save as a new variant" is the only thing
   that spins off an A/B variant (edited text re-generalized back to merge tags first). */
function mergeText(body,p){return (body||"")
  .replace(/\{\{first\}\}/g,p.fn||"").replace(/\{\{last\}\}/g,p.ln||"").replace(/\{\{name\}\}/g,p.name||"")
  .replace(/\{\{agency\}\}/g,p.agency||"").replace(/\{\{title\}\}/g,p.title||"").replace(/\{\{city\}\}/g,p.city||"");}
function regeneralize(text,p){let s=text||"";
  [[p.name,"{{name}}"],[p.agency,"{{agency}}"],[p.title,"{{title}}"],[p.city,"{{city}}"],[p.fn,"{{first}}"],[p.ln,"{{last}}"]]
    .forEach(function(pair){if(pair[0])s=s.split(pair[0]).join(pair[1]);});return s;}
function openSendComposer(personId,cat){
  const p=personById(personId); if(!p)return;

  openModal(`<div class="mhead"><div><h2>${isIntro?"Send introduction":("Send "+catLabel(cat).toLowerCase())} to ${esc(p.fn)}</h2>
    <div class="sub">Pick a template, then edit the text for ${esc(p.fn)} before sending. Your tweaks are sent &amp; logged — they don't change the template unless you tick "save as a new variant".</div></div>
    <div class="dclose" onclick="closeModal()">×</div></div>
    <div class="mbody">
      <label class="fld">Template <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— drives A/B stats</span></label>
      <div id="cmp-opts">${opts.map((m,i)=>`
        <label class="rulerow" style="cursor:pointer;align-items:flex-start;border:0;padding:6px 0">
          <input type="radio" name="cmp" value="${m.id}" class="ck" style="margin-top:3px" ${i===0?'checked':''} onchange="pickComposerMsg(${m.id})">
          <div class="rinfo"><b><span class="code">${m.code}</span> ${esc(m.title)}</b> <span class="pill p-grn">${replyPct(m)}% reply</span></div>
        </label>`).join("")}</div>
      <label class="fld" style="margin-top:10px">Message to ${esc(p.fn)} <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— merge tags filled in; edit freely before sending</span></label>
      <textarea id="cmp-body" style="min-height:150px;width:100%">${esc(mergeText(opts[0].body,p))}</textarea>
      ${isIntro?`<label class="fld" style="margin-top:10px">Loom link (optional — makes it a 📹 Loom intro)</label>
        <input type="text" id="cmp-loom" placeholder="loom.com/share/…" style="width:100%">`:''}
      <label style="margin-top:12px;display:flex;gap:8px;align-items:flex-start;cursor:pointer">
        <input type="checkbox" id="cmp-variant" style="margin-top:3px">
        <span class="muted" style="font-size:12.5px">Also save my edits as a <b>new variant</b> of this template — only for a meaningful change worth A/B-tracking. Leave unticked for incidental tweaks (still sent &amp; logged, just no new template).</span></label>
      <div class="btnrow" style="margin-top:16px;justify-content:space-between">
        <button class="btn gray sm" onclick="copyComposer()">⧉ Copy text</button>
        <span><button class="btn gray" onclick="closeModal()">Cancel</button>
        <button class="btn" onclick="sendComposed()">${isIntro?"Mark intro sent":"Mark follow-up sent"} →</button></span></div>
    </div>`);
}
function pickComposerMsg(mid){
  const st=ST._compose; if(!st)return; const p=personById(st.personId), m=msgById(mid); if(!p||!m)return;
  const ta=$("cmp-body"), curMerged=mergeText((msgById(st.msgId)||{}).body,p);

}
function copyComposer(){const ta=$("cmp-body");if(ta&&navigator.clipboard){navigator.clipboard.writeText(ta.value);toast("Copied to clipboard","ok");}}
function sendComposed(){
  const st=ST._compose; if(!st)return; const p=personById(st.personId), m=msgById(st.msgId); if(!p||!m)return;

  const loom=st.isIntro?(($("cmp-loom")&&$("cmp-loom").value.trim())||""):"";

    const gen=regeneralize(bodyText,p), root=familyRoot(m), n=library.filter(x=>x.parentId===root.id).length+1, code=root.code+"."+n;
    library.push({id:imid++,category:root.category,code:code,parentId:root.id,title:m.title+" (v"+n+")",body:gen,isActive:true,sortOrder:imid,versions:[],assigned:0,replied:0,viewed:0,withLoom:0});
    toast("Saved your edit as new variant "+code,"ok");

  if(st.isIntro){ p.stage="intro_sent";p.introMessageId=m.id;p.introKind=loom?"loom":"message";p.loomUrl=loom||null;p.fuStep=0;p.lastActivityAt=TODAY; }
  else { step=Math.min(3,(p.fuStep||0)+1); p.fuStep=step; p.lastActivityAt=TODAY; if(!p.fuMsgIds)p.fuMsgIds={}; p.fuMsgIds[step]=m.id; if(step>=3)p.tags=p.tags.filter(t=>t!=="in-intro-funnel"); }
  (p.sends=p.sends||[]).push({type:st.isIntro?"intro":"fu",step:st.isIntro?0:step,code:m.code,body:bodyText,at:TODAY});
  closeModal();
  toast((st.isIntro?"Intro "+m.code:"Follow-up "+step+" "+m.code)+" sent to "+p.fn+((!st.isIntro&&step>=3)?" — sequence complete, graduated to Connections":"")+" · logged","ok");
  render();
}

/* ============================ ENGAGE (the feed) ============================ */
function renderEngage(){
  const within=ST.feedWithin;
  /* the feed is a TO-DO list: once you like, reply to, or skip a post it leaves (state!=="none");
     muted authors are hidden entirely. Posts mid-draft keep state "none" so they stay until saved. */
  let list=posts.filter(p=>p.state==="none"&&!personById(p.authorId).isMuted&&postDaysAgo(p.postedAt)<=FEED_MAX_AGE_DAYS);
  if(within)list=list.filter(p=>postDaysAgo(p.postedAt)<=within);
  const ff=ST.feedFilter;
  /* phase predicates: identify posts by contacts currently in the Prospect funnel or the Pipeline */
  const inProspects=p=>{const a=personById(p.authorId);return a&&["warming","request_sent"].includes(a.stage);};
  const inPipeline=p=>{const a=personById(p.authorId);return a&&a.tags.includes("in-intro-funnel");};
  if(ff==="ai")list=list.filter(p=>p.isAI);
  if(ff==="pref")list=list.filter(p=>personById(p.authorId).isStarred);
  if(ff==="prospects")list=list.filter(inProspects);
  if(ff==="pipeline")list=list.filter(inPipeline);
  const withinChips=[[0,"All ≤4d"],[1,"≤24h"],[2,"≤2d"],[3,"≤3d"]];
  const vis=posts.filter(p=>p.state==="none"&&!personById(p.authorId).isMuted&&postDaysAgo(p.postedAt)<=FEED_MAX_AGE_DAYS);
  const counts={all:vis.length, pref:vis.filter(p=>personById(p.authorId).isStarred).length,
    ai:vis.filter(p=>p.isAI).length, prospects:vis.filter(inProspects).length, pipeline:vis.filter(inPipeline).length};
  const mutedCount=people.filter(p=>p.isMuted).length;

  /* low-value (reposts/announcements) split into their own clearable group;

  ST.feedShown=list.map(p=>p.id);   // exactly what's on screen now → "Skip remaining" dismisses these

/* Skip remaining: one click dismisses every post still showing in the current Engage view (whatever
   filter/age window is active), for when you've worked down the list and the rest are too old to bother.
   Uses ST.feedShown (the exact ids rendered), only touches still-active posts. Undoable (snapshot). */
function skipRemaining(){
  const shown=new Set(ST.feedShown||[]);
  const targets=posts.filter(p=>shown.has(p.id)&&p.state==="none");
  if(!targets.length){toast("Nothing left to skip");return;}

/* Draft reply is now TWO steps: (1) open the compose area + ask for an optional steering note,
   (2) Generate actually runs the async draft. Clicking "Draft reply" no longer auto-generates. */
function openReplyCompose(id){
  const p=posts.find(x=>x.id===id);
  const prev=(p.replyJob&&p.replyJob.steer)||"";   // keep prior steer when regenerating
  p.replyJob={status:"compose",steer:prev};renderEngage();
  setTimeout(()=>{const t=$("steer-"+id);if(t)t.focus();},30);
}
function cancelReply(id){const p=posts.find(x=>x.id===id);p.replyJob=null;renderEngage();}
/* elapsed-time helpers for async panels: a per-post ticker updates the #rtick span every second so
   the draft reads as "still working," not frozen. Re-queries the DOM each tick, so it survives feed
   re-renders; self-stops when the job leaves 'pending'. (Mirrors the real build.) */
function replyElapsed(job){if(!job||!job.startedAt)return"";const s=Math.max(0,Math.floor((Date.now()-job.startedAt)/1000));return`· ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;}
const replyTickers={};
function startReplyTicker(id){
  if(replyTickers[id])return;
  replyTickers[id]=setInterval(()=>{
    const p=posts.find(x=>x.id===id);
    if(!p||!p.replyJob||p.replyJob.status!=="pending"){clearInterval(replyTickers[id]);delete replyTickers[id];return;}
    const el=$("rtick-"+id);if(el)el.textContent=replyElapsed(p.replyJob);
  },1000);
}
/* simulate the async background reply job (pending → done), honoring the steering note */
function generateReply(id){
  const p=posts.find(x=>x.id===id);
  if(p&&p.replyJob&&p.replyJob.status==="pending")return;   // guard: don't double-submit while a draft is in flight
  const steer=(($("steer-"+id)&&$("steer-"+id).value)||(p.replyJob&&p.replyJob.steer)||"").trim();
  snapshot("draft reply");
  p.replyJob={status:"pending",steer,startedAt:Date.now()};renderEngage();startReplyTicker(id);
  setTimeout(()=>{
    const drafts=p.isAI?[
      "This is the right framing. The boring 60% is exactly where we've pointed our tooling too, which frees the team for the work clients actually remember.",
      "Strongly agree. We've had the same result; the trick was treating it as a floor for quality, not a ceiling on headcount."
    ]:[
      "Saying no to the wrong-fit work is underrated. We started doing the same and the pipeline got healthier, not thinner.",
      "Love this. The proposal-not-the-relationship point is one I wish I'd learned five years earlier."];
    /* mock the 3-layer pipeline result: writer(+maybe fallback) → critic verdict → deterministic finalize.
       verdict: 'pass' or 'revise' (critic flagged N high/med issues → one rewrite). banned = words the
       deterministic strip removed; bannedRemaining = anything still leaking after the rewrite (rare). */
    const flagged=settings.critic_enabled?(chance(.4)?1+Math.floor(rnd()*2):0):0;
    const usedFallback=chance(.12);
    p.replyJob={status:"done",text:pick(drafts),model:usedFallback?settings.fallback_model:settings.writer_model,
      usedFallback, criticOn:settings.critic_enabled, verdict:flagged?"revise":"pass", flagged,
      banned:chance(.5)?1:0, bannedRemaining:chance(.08)?[pick(blLiterals())]:[], steer};
    if(ST.tab==="engage")renderEngage();
  },1400);
}
function saveReply(id){snapshot("save reply");const p=posts.find(x=>x.id===id);
  const ta=$("rt-"+id);if(ta)p.replyJob.text=ta.value;p.state="done";p.replyJob=null;
  const a=personById(p.authorId);a.engReplies=(a.engReplies||0)+1;

}

  if(ST.connView==="principal")list=list.filter(p=>p.isPrincipal);
  if(ST.connView==="eligible")list=list.filter(outboundEligible);
  if(ST.connView==="blocked")list=list.filter(personBlocked);
  if(ST.connView==="untagged")list=list.filter(p=>!p.tags||p.tags.length===0);
  if(ST.connStage)list=list.filter(p=>p.stage===ST.connStage);
  if(ST.connFu!=="")list=list.filter(p=>p.stage==="intro_sent"&&p.fuStep===+ST.connFu);
  if(ST.connTagInc.size)list=list.filter(p=>[...ST.connTagInc].some(t=>p.tags.includes(t)));  // include: has ANY chosen tag
  if(ST.connTagExc.size)list=list.filter(p=>![...ST.connTagExc].some(t=>p.tags.includes(t))); // exclude: has NONE
  if(ST.connTag)list=list.filter(p=>p.tags.includes(ST.connTag));
  if(ST.connResearch){const R=ST.connResearch;list=list.filter(p=>{const c=p.research&&p.research.classification;
    return R==="researched"?!!p.research : R==="unresearched"?!p.research :
      R==="principal"?(c&&c.isAgencyPrincipal) : R==="agencystaff"?(c&&c.isAgencyOther&&!c.isAgencyPrincipal) :
      R==="inhouse"?(c&&!c.isAgencyPrincipal&&!c.isAgencyOther&&!c.isFreelance) : R==="museum"?(c&&c.isMuseumContact) :
      R==="pastmuseum"?(c&&c.pastMuseumExperience) : R==="freelance"?(c&&c.isFreelance) : true;});}
  if(q)list=list.filter(p=>(p.name+" "+p.agency+" "+p.headline+" "+p.tags.join(" ")+" "+((p.research&&p.research.summary)||"")).toLowerCase().includes(q));
  const sf=ST.connSort.field, dir=ST.connSort.dir;
  const val=p=>({person:p.name,stage:Object.keys(STAGE_META).indexOf(p.stage),eligible:outboundEligible(p)?2:personBlocked(p)?0:1,
    facets:(p.isFreelance?1:0)+(p.isPrincipal?2:0),summary:roleVerdict(p).rank,fu:p.stage==="intro_sent"?p.fuStep:-1,agency:p.agency,loc:p.state,

  list.sort((a,b)=>{const x=val(a),y=val(b);return (x>y?1:x<y?-1:0)*dir;});
  return list;
}

/* tri-state tag filter chip: off → include (has it) → exclude (does NOT have it) → off */
function cycleTagFilter(t){
  if(ST.connTagInc.has(t)){ST.connTagInc.delete(t);ST.connTagExc.add(t);}
  else if(ST.connTagExc.has(t)){ST.connTagExc.delete(t);}
  else{ST.connTagInc.add(t);}
  renderConnections();}
function clearConnFilters(){ST.connStage="";ST.connFu="";ST.connTag="";ST.connTagInc.clear();ST.connTagExc.clear();ST.connResearch="";ST.connQ="";renderConnections();}
function toggleConnCols(e){e.stopPropagation();ST.connColPanel=!ST.connColPanel;renderConnections();
  if(ST.connColPanel)setTimeout(()=>document.addEventListener("click",closeConnCols),0);}

function toggleConnCol(k){if(ST.connHidden.has(k))ST.connHidden.delete(k);else ST.connHidden.add(k);saveConnPrefs();renderConnections();}
/* Reorder a column from the Columns panel (▲ earlier / ▼ later). 'person' stays pinned first.
   Reorders across ALL columns (visible + hidden) so the panel list order == the table order. */
function moveConnCol(k,dir){let order=orderedCols().map(c=>c[0]).filter(x=>x!=="person");
  const i=order.indexOf(k);if(i<0)return;const j=i+dir;if(j<0||j>=order.length)return;
  order.splice(i,1);order.splice(j,0,k);
  ST.connOrder=["person",...order];saveConnPrefs();ST.connViewName="";renderConnections();}
/* ---- column drag-reorder (HTML5 DnD on the header cells) ---- */
let _connDrag=null;
function connDragStart(e,k){_connDrag=k;e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",k);}catch(_){}}
function connDragOver(e){e.preventDefault();e.dataTransfer.dropEffect="move";}
function connDragEnd(){_connDrag=null;}
function connDrop(e,target){e.preventDefault();const from=_connDrag;_connDrag=null;
  if(!from||from===target||target==="person")return;
  // materialize the current visible+full order, move `from` to just before `target`, persist
  let order=orderedCols().map(c=>c[0]).filter(k=>k!=="person");
  order=order.filter(k=>k!==from);
  const ti=order.indexOf(target);order.splice(ti<0?order.length:ti,0,from);
  ST.connOrder=["person",...order];saveConnPrefs();ST.connViewName="";renderConnections();}

function saveConnView(){const n=(prompt("Name this view (columns, order, widths):",ST.connViewName||"My view")||"").trim();if(!n)return;
  ST.connViews[n]={order:orderedCols().map(c=>c[0]),hidden:[...ST.connHidden],w:{...ST.connW}};

function connRszStart(e,key){e.preventDefault();e.stopPropagation();
  const th=e.target.closest("th");const startX=e.clientX, startW=th.offsetWidth;
  document.body.classList.add("resizing");
  const move=ev=>{const w=Math.max(60,startW+(ev.clientX-startX));ST.connW[key]=w;th.style.width=w+"px";};
  const up=()=>{document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);
    document.body.classList.remove("resizing");saveConnPrefs();};
  document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);}

        Use <b>Save in place</b> only for a typo-level fix (keeps the stats; snapshots the old text to history).</div></div>`:''}
      <div class="btnrow" style="margin-top:14px;justify-content:space-between">
        <button class="btn red ghost sm" onclick="archiveMsg(${m.id})">${m.isActive?'Archive':'Restore'}</button>

        ${hasStats
          ?`<button class="btn gray" onclick="saveMsg(${m.id})">Save in place</button>
            <button class="btn" onclick="branchMsg(${m.id})">🌿 Save as new variant →</button>`
          :`<button class="btn" onclick="saveMsg(${m.id})">Save</button>`}</span></div>
    </div>`);
}
function saveMsg(id){snapshot("edit message");const m=msgById(id);
  const nt=$("im-title").value.trim(),nb=$("im-body").value.trim();
  if(nb!==m.body)m.versions.push({title:m.title,body:m.body,at:TODAY});
  m.title=nt||m.title;m.body=nb||m.body;m.category=$("im-cat").value;closeModal();toast("Saved "+m.code,"ok");renderLibrary();}
/* branch-on-edit: keep an edited-with-traction message related but A/B-separate — spins off a child
   variant (F1b → F1b.1, F1b.2) seeded with the edited text and FRESH stats, under the family root. */
function branchMsg(id){const src=msgById(id);
  const nt=$("im-title").value.trim(),nb=$("im-body").value.trim();
  const root=familyRoot(src);const n=library.filter(m=>m.parentId===root.id).length+1;const code=root.code+"."+n;
  snapshot("branch message variant");
  const v={id:imid++,category:root.category,code,parentId:root.id,
    title:nt||src.title,body:nb||src.body,isActive:true,sortOrder:imid,
    versions:[],assigned:0,replied:0,viewed:0,withLoom:0};
  library.push(v);closeModal();
  toast("Branched "+src.code+" → new variant "+code+" — fresh A/B stats, same family","ok");renderLibrary();}
function archiveMsg(id){snapshot("archive message");const m=msgById(id);m.isActive=!m.isActive;closeModal();toast(m.isActive?"Restored":"Archived","ok");renderLibrary();}
function newMsg(cat){snapshot("new message");cat=cat||"intro";
  const n=library.filter(m=>m.category===cat&&!m.parentId).length+1;
  const prefix=cat==='intro'?'':cat.replace('fu','FL');   // follow-up codes use FL (FL1n), not FU
  const m={id:imid++,category:cat,code:prefix+n,parentId:null,title:"Untitled "+catLabel(cat).toLowerCase()+" message",body:"Hi {{first}}, …",isActive:true,sortOrder:imid,versions:[],assigned:0,replied:0,viewed:0,withLoom:0};
  library.push(m);renderLibrary();editMsg(m.id);}
function addAlt(parentId){snapshot("add alternate");const parent=msgById(parentId);
  const n=library.filter(m=>m.parentId===parentId).length+1;
  const m={id:imid++,category:parent.category,code:parent.code+"."+n,parentId,title:parent.title+" (alt "+n+")",body:parent.body,isActive:true,sortOrder:imid,versions:[],assigned:0,replied:0,viewed:0,withLoom:0};
  library.push(m);renderLibrary();editMsg(m.id);}
function msgHistory(id){const m=msgById(id);
  openModal(`<div class="mhead"><div><h2>Version history <span class="code">${m.code}</span></h2></div><div class="dclose" onclick="closeModal()">×</div></div>
    <div class="mbody">${m.versions.length?m.versions.slice().reverse().map(v=>`<div class="hist"><b>${fmtDate(v.at)}</b> · ${esc(v.title)}<div class="muted" style="margin-top:4px">${esc(v.body)}</div></div>`).join(""):'<div class="muted">No prior versions.</div>'}</div>`);

function setCampStatus(id,s){snapshot("campaign status");campaigns[id].status=s;toast("Campaign "+s,"ok");renderCampaigns();}
function newCampaign(){snapshot("new campaign");const c=mkCamp({name:"Untitled campaign",status:"draft",segment:"",
  steps:[{id:0,day:0,body:"Hi {{first}}, …"}]});ST.camp=campaigns.length-1;renderCampaigns();}
function setStepBody(cid,sid,v){snapshot("edit step");campaigns[cid].steps.find(s=>s.id===sid).body=v;}
function setStepDay(cid,sid,v){snapshot("edit step day");campaigns[cid].steps.find(s=>s.id===sid).day=Math.max(0,+v||0);renderCampaigns();}
function addStep(cid){snapshot("add step");const c=campaigns[cid];const lastDay=c.steps.length?c.steps[c.steps.length-1].day:0;
  c.steps.push({id:Math.max(0,...c.steps.map(s=>s.id))+1,day:lastDay+3,body:"Hi {{first}}, …"});renderCampaigns();}
function delStep(cid,sid){snapshot("remove step");const c=campaigns[cid];c.steps=c.steps.filter(s=>s.id!==sid);renderCampaigns();}
function insertMacro(taId,macro){const ta=$(taId);if(!ta)return;const tag="{{"+macro+"}}";
  const s=ta.selectionStart??ta.value.length,e=ta.selectionEnd??ta.value.length;
  ta.value=ta.value.slice(0,s)+tag+ta.value.slice(e);ta.focus();ta.selectionStart=ta.selectionEnd=s+tag.length;
  ta.dispatchEvent(new Event("change"));}
function addRecipients(cid){snapshot("add recipients");const c=campaigns[cid];const seg=$("enrollSeg").value;
  const pool=people.filter(p=>{if(seg==="starred")return p.isStarred&&["accepted","intro_sent"].includes(p.stage);
    if(seg==="principal")return p.isPrincipal&&["accepted","intro_sent"].includes(p.stage);return p.stage===seg;});
  let added=0;pool.forEach(p=>{if(!enrollments.some(e=>e.campaignId===cid&&e.personId===p.id)){
    enroll(c,p,0,"active");added++;
    if(c.status==="active"&&msgQueue.filter(m=>m.status==="pending").length<14)
      msgQueue.push({id:mqId++,campaignId:cid,personId:p.id,stepId:c.steps[0].id,status:"pending"});}});
  toast(added?`Added ${added} recipient${added!==1?'s':''}`:"Everyone matching is already enrolled",added?"ok":"");renderCampaigns();}
function unenroll(eid){snapshot("remove recipient");const e=enrollments.find(x=>x.id===eid);
  enrollments=enrollments.filter(x=>x.id!==eid);msgQueue=msgQueue.filter(m=>!(m.personId===e.personId&&m.campaignId===e.campaignId&&m.status!=="sent"));renderCampaigns();}
function approveMsg(id){snapshot("approve message");msgQueue.find(m=>m.id===id).status="approved";renderCampaigns();}
function skipMsg(id){snapshot("skip message");msgQueue.find(m=>m.id===id).status="skipped";renderCampaigns();}
function runSender(cid){
  const approved=msgQueue.filter(m=>m.campaignId===cid&&m.status==="approved");
  if(!approved.length){toast("Approve some messages first");return;}
  snapshot("run sender");const btn=$("sendbtn-"+cid),bar=$("sendbar-"+cid);if(btn)btn.disabled=true;
  let i=0;const total=approved.length;
  const tick=()=>{if(i>=total){if(bar)bar.style.width="100%";
      toast(`Sent ${total} message${total!==1?'s':''}`,"ok");setTimeout(renderCampaigns,400);return;}
    const m=approved[i];m.status="sent";const e=enrollments.find(x=>x.campaignId===cid&&x.personId===m.personId);
    if(e){const c=campaigns[cid];e.curStep=Math.min(c.steps.length-1,e.curStep+1);if(e.curStep>=c.steps.length-1)e.status="done";}
    i++;if(bar)bar.style.width=(i/total*100)+"%";setTimeout(tick,420);};
  tick();
}

/* Activity = the person's event log. The PROTOTYPE derives it from state/timestamps; the REAL build
   writes an event_log row on every transition (worker/sync/manual) — see BUILD_NOTES §3. */
function personEvents(p){
  const ev=[], add=(at,what,kind)=>{if(at)ev.push({at,what,kind:kind||"you"});};
  add(p.addedAt,"Synced in from the Outreach Engine → warming","sync");
  if(p.resolved)add(p.addedAt,"LinkedIn profile resolved via Unipile","system");
  if(p.viewCount)add(p.lastViewedAt||p.addedAt,"Profile auto-viewed ×"+p.viewCount+" (warm-up)","worker");
  add(p.requestSentAt,"Connection request sent","worker");
  add(p.connectedAt,"Connection accepted","them");
  add(p.introSentAt,"Intro sent"+(p.introKind==='loom'?" (Loom)":""),"you");
  if(p.fuStep>0)add(p.lastActivityAt,"Follow-up "+p.fuStep+" sent","you");
  if(p.replyCount)add(p.lastInboundAt,"Replied ("+p.replyCount+")","them");
  return ev.filter(e=>e.at).sort((a,b)=>(b.at>a.at?1:b.at<a.at?-1:0));
}
function setStage(id,s){snapshot("change stage");personById(id).stage=s;toast("Stage → "+STAGE_META[s][0]);openPerson(id);renderTabs();}
function setNotes(id,v){snapshot("edit notes");personById(id).notes=v;}
function addTag(id){const t=(prompt("Add tag (vocab: "+CONN_TAGS.join(", ")+"):")||"").trim();if(!t)return;
  snapshot("add tag");const p=personById(id);if(!p.tags.includes(t))p.tags.push(t);
  if(tagBlock(t))toast("⛔ '"+t+"' blocks outbound — this contact is now ineligible unless overridden");
  openPerson(id);render();}
function removeTag(id,t){snapshot("remove tag");const p=personById(id);p.tags=p.tags.filter(x=>x!==t);openPerson(id);render();}
/* ---- inline quick-tag (Connections table): click a chip to toggle, or ＋ for the full vocab
   popover. Mirrors the live tool's click-to-assign tagging, kept compact via a per-row popover. ---- */
const QUICK_TAGS=CONN_TAGS.filter(t=>t!=="in-intro-funnel");   // manually-assignable vocab
/* Ever-present one-click toggles in the person drawer + the Tags column — the tags applied most
   while triaging connections. Toggle to add/remove without the ＋ prompt. */
const PRIMARY_QUICK_TAGS=["agency","museum","personal","client","omit"];
function toggleQuickTag(id,t){const p=personById(id);quickTag(id,t,p.tags.includes(t)?"remove":"add");openPerson(id);}
function quickTag(id,t,action){snapshot(action==="add"?"add tag":"remove tag");const p=personById(id);
  if(action==="add"){if(!p.tags.includes(t))p.tags.push(t);}else{p.tags=p.tags.filter(x=>x!==t);}
  if(tagBlock(t)&&action==="add")toast("⛔ '"+t+"' blocks outbound — ineligible unless overridden");
  if($("tagPop")&&ST.tagPop===id)refreshTagPop(id);   // keep the pop open + in sync
  renderConnections();}
/* Connections-table tag toggle: same as quickTag but re-renders ROWS ONLY (not the whole page),
   so bulk-categorizing the untagged backlog stays snappy and never jumps scroll position. Used by
   the always-visible quick-tag chips in the Tags column. */
function connQuickTag(id,t,action){snapshot(action==="add"?"add tag":"remove tag");const p=personById(id);
  if(action==="add"){if(!p.tags.includes(t))p.tags.push(t);}else{p.tags=p.tags.filter(x=>x!==t);}
  if(tagBlock(t)&&action==="add")toast("⛔ '"+t+"' blocks outbound — ineligible unless overridden");
  renderConnRows();}
/* Connections-table principal toggle: click the shield to mark/unmark an agency principal.
   Rows-only re-render, same snappy bulk-edit feel as tags. */
function connTogglePrincipal(id){const p=personById(id);const now=!p.isPrincipal;
  snapshot(now?"mark principal":"unmark principal");p.isPrincipal=now;p.isPrincipalSource="eric";
  renderConnRows();}
function tagPopHTML(p){return `<div class="tphead">Tags · ${esc(p.name)}</div>`+
  QUICK_TAGS.map(t=>{const on=p.tags.includes(t);return `<div class="tprow ${on?'on':''}${tagBlock(t)?' blk':''}" onclick="event.stopPropagation();quickTag(${p.id},'${esc(t)}','${on?'remove':'add'}')">
    <span>${tagBlock(t)?'⛔ ':''}${esc(t)}</span><span class="tpck">${on?'✓':''}</span></div>`;}).join("");}
function refreshTagPop(id){const el=$("tagPop");const p=personById(id);if(el&&p)el.innerHTML=tagPopHTML(p);}
function openTagPop(id,ev){closeTagPop();const p=personById(id);if(!p)return;ST.tagPop=id;
  const pop=document.createElement("div");pop.className="tagpop";pop.id="tagPop";pop.innerHTML=tagPopHTML(p);
  document.body.appendChild(pop);
  const r=ev.target.getBoundingClientRect();
  pop.style.top=(r.bottom+5+window.scrollY)+"px";
  pop.style.left=(Math.max(8,Math.min(r.left,window.innerWidth-240))+window.scrollX)+"px";
  setTimeout(()=>document.addEventListener("click",closeTagPop),0);}
function closeTagPop(e){if(e&&e.target.closest&&e.target.closest("#tagPop"))return;
  const el=$("tagPop");if(el)el.remove();ST.tagPop=null;document.removeEventListener("click",closeTagPop);}
/* ---- outbound eligibility + facets ---- */
function eligibilityPill(p){
  if(outboundEligible(p))return '<span class="pill p-grn">✓ outbound-eligible</span>';
  if(personBlocked(p))return '<span class="pill p-red">⛔ blocked · '+blockingTagsOf(p).map(esc).join(", ")+'</span>';
  if(p.overrideEligibility&&blockingTagsOf(p).length)return '<span class="pill p-amb">⚠ overridden — sending despite '+blockingTagsOf(p).map(esc).join(", ")+'</span>';
  if(!p.tags.includes("agency"))return '<span class="pill p-gray">not in outbound audience (no \'agency\' tag)</span>';
  return '<span class="pill p-gray">—</span>';}
function toggleOverride(id){snapshot("toggle eligibility override");const p=personById(id);p.overrideEligibility=!p.overrideEligibility;
  if(p.overrideEligibility&&!p.overrideCampaignTag)p.overrideCampaignTag="manual";openPerson(id);render();}

  snapshot("review name");p.fn=(v.trim()||p.fn);p.name=p.fn+" "+p.ln;p.displayFirstName=p.fn;p.nameFlagged=false;openPerson(id);toast("Name reviewed","ok");render();}
/* ---- agency linking (drawer) ---- */
function agencyLinkRow(p,l,ix){
  const badge=l.status==="confirmed"?'<span class="pill p-grn">confirmed</span>':l.status==="needs_review"?'<span class="pill p-amb">needs review</span>':l.status==="rejected"?'<span class="pill p-red">rejected</span>':'<span class="pill p-gray">auto</span>';

    <b>${esc(l.name)}</b> ${l.primary?'<span class="pill p-acc">primary</span>':''} ${badge}
    <div class="miniinfo">${esc(l.role||'')} · ${esc(l.source)} · conf ${Math.round(l.confidence*100)}%${l.geoAgree===1?' · 📍 geo-match':l.geoAgree===0?' · 📍 geo-mismatch':''}</div>

function makePrimaryLink(id,ix){snapshot("primary agency");const p=personById(id);p.agencyLinks.forEach((l,i)=>l.primary=(i===ix));p.agency=p.agencyLinks[ix].name;openPerson(id);render();}
function confirmLink(id,ix){snapshot("confirm agency link");const p=personById(id);const l=p.agencyLinks[ix];l.status="confirmed";l.reviewedBy="eric";openPerson(id);toast("Link confirmed","ok");}
function rejectLink(id,ix){snapshot("remove agency link");const p=personById(id);const l=p.agencyLinks[ix];p.agencyLinks.splice(ix,1);

function addAgencyLink(id){const el=$("ag-search-"+id);const v=el&&el.value?el.value.trim():"";if(!v)return;
  snapshot("link agency");const p=personById(id);
  p.agencyLinks.push({domain:agencyDomain(v),name:v,primary:!p.agencyLinks.some(l=>l.primary),source:"manual",confidence:1,status:"confirmed",role:p.title,geoAgree:null});
  if(p.agencyLinks.length===1)p.agency=v;openPerson(id);toast("Linked "+v,"ok");}
/* ---- profile research (scraped profile + LLM classification cache) ---- */
function researchSection(p){
  const r=p.research;
  if(!r)return `<div class="sechead">Profile research</div>
    <div class="frow"><div class="fv"><span class="muted">Not yet researched.</span>
      <button class="btn ghost sm" style="margin-left:8px" onclick="classifyPerson(${p.id})">🔎 Scrape &amp; classify</button></div></div>`;
  const c=r.classification, facet=(on,l)=>on?`<span class="pill p-teal">${l}</span> `:"";
  const cp=r.confidence==="high"?'p-grn':r.confidence==="medium"?'p-amb':'p-gray';
  const anyFlag=c.isAgencyPrincipal||c.isAgencyOther||c.isMuseumContact||c.pastMuseumExperience||c.isFreelance;
  return `<div class="sechead">Profile research <span class="muted" style="font-weight:400">— scraped ${daysAgoLabel(r.scrapedAt)} · ${esc(r.model)}</span></div>
    <div class="frow"><div class="fl">Class</div><div class="fv">
      ${facet(c.isAgencyPrincipal,"agency principal")}${facet(c.isAgencyOther,"agency (other)")}${facet(c.isMuseumContact,"museum contact")}${facet(c.pastMuseumExperience,"past museum exp.")}${facet(c.isFreelance,"freelance")}
      ${anyFlag?'':'<span class="muted">— no flags</span> '}<span class="pill ${cp}">${r.confidence} confidence</span></div></div>
    <div class="frow"><div class="fl">Summary</div><div class="fv">${esc(r.summary)}</div></div>
    <div class="frow"><div class="fv"><button class="btn ghost sm" onclick="classifyPerson(${p.id})">↻ Re-scrape &amp; classify</button></div></div>`;
}
function classifyPerson(id){snapshot("classify profile");const p=personById(id);
  p.research={scrapedAt:TODAY,model:"gemini-flash-lite",
    classification:{isAgencyPrincipal:p.isPrincipal,isAgencyOther:!p.isPrincipal,isMuseumContact:p.tags.includes("museum"),pastMuseumExperience:false,isFreelance:p.isFreelance},
    summary:(p.isPrincipal?"Owns/runs ":"Works at ")+p.agency+" — classified from a fresh profile scrape.",confidence:"medium"};

function setSetTab(s){document.querySelectorAll(".settab").forEach(t=>t.classList.toggle("on",t.dataset.s===s));
  ["voice","critic","funnel","automation"].forEach(k=>$("set-"+k).classList.toggle("on",k===s));}
function saveSettings(){snapshot("edit settings");

/* ============================ voice/style version history (⏱ links in Settings) ============================ */
/* Mirrors the live /api/style/versions + /api/style/revert flow (settings_versions table) as pure
   local state: every prior value newest-first, per-version Revert, and reverting saves the current
   text as a new version first so you can always come back. */
const STYLE_FIELD_META={
  voice_style:{label:"Writing style", ta:"sv-style"},
  voice_pov:{label:"Point of view", ta:"sv-pov"},
  voice_background:{label:"Background", ta:"sv-bg"},
  critic_rubric:{label:"Critic rubric", ta:"sc-rubric"}};
function openStyleHistory(key){
  const m=STYLE_FIELD_META[key];if(!m)return;
  const versions=(styleVersions[key]||[]).slice().reverse();   // newest first
  const box=v=>`<div style="font-size:12px;white-space:pre-wrap;max-height:110px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:7px">${esc(v||'(empty)')}</div>`;
  const rows=versions.map(v=>`<div class="lrev" style="align-items:flex-start">
    <div style="flex:1"><div class="muted" style="font-size:11.5px;margin-bottom:3px">${esc(fmtDate(v.at))} · ${esc(v.source||'edit')}</div>${box(v.value)}</div>
    <button class="btn ghost sm" style="margin-top:16px" onclick="revertStyle('${key}',${v.id})">↩ Revert to this</button></div>`).join("");
  openModal(`<div class="mhead"><div><h2>⏱ ${esc(m.label)} — version history</h2>
    <div class="sub">Every prior value, newest first. Reverting saves the current text first, so you can always come back.</div></div>
    <div class="dclose" onclick="closeModal()">×</div></div>
    <div class="mbody">
      <div class="lct">Current</div><div style="margin:3px 0 13px">${box(settings[key])}</div>
      <div class="lct">Previous versions <span class="muted">— ${versions.length}</span></div>
      ${rows||'<div class="muted" style="margin-top:6px">No prior versions yet — they appear here as you edit or apply learnings.</div>'}</div>`);
}
function revertStyle(key,vid){
  const m=STYLE_FIELD_META[key];if(!m)return;
  const v=(styleVersions[key]||[]).find(x=>x.id===vid);if(!v)return;
  snapshot("revert "+m.label);
  (styleVersions[key]=styleVersions[key]||[]).push(mkStyleVer(TODAY,"revert-save",settings[key]));  // current text saved first
  settings[key]=v.value;
  const ta=$(m.ta); if(ta)ta.value=v.value;   // no-op while the history modal is up; refreshed on reopen
  toast("Reverted "+m.label+" — reopen Settings to see it","ok");
  openStyleHistory(key);   // refresh so the just-left value now shows in the list
}

/* ============================ self-learning: review → propose → apply → undo ============================ */
const VFIELD_LABEL={voice_style:"Writing style", voice_pov:"Point of view", voice_background:"Background"};
function fieldLabel(f){return VFIELD_LABEL[f]||f;}

/* Parse the user's plain-English steer into the set of recommendation numbers to apply.
   Blank → the high-confidence ones. Handles "apply 1 and 2 but skip 3", "only 2", "skip 4". */
function parseNotesSelection(notes,recs){
  const all=recs.map(r=>r.n);
  notes=(notes||"").trim();
  if(!notes)return{sel:new Set(recs.filter(r=>r.conf==="high").map(r=>r.n)),mode:"default"};
  const EXCL=/\b(skip|skipping|don'?t|do not|not|drop|omit|exclude|without|leave out|ignore)\b/i;
  const INCL=/\b(only|just|apply|implement|use|include|do|add)\b/i;
  const clauses=notes.split(/\b(?:but|except|however)\b|[,;]/i);
  let include=new Set(),exclude=new Set(),sawInclude=false;
  clauses.forEach(c=>{
    const nums=(c.match(/[1-9]/g)||[]).map(Number).filter(n=>all.includes(n));
    if(!nums.length)return;
    if(EXCL.test(c))nums.forEach(n=>exclude.add(n));
    else{sawInclude=true;nums.forEach(n=>include.add(n));}   // bare numbers or include-verb => include
  });
  const sel=sawInclude?new Set([...include].filter(n=>!exclude.has(n)))
                      :new Set(all.filter(n=>!exclude.has(n)));
  return{sel,mode:"parsed"};
}

/* Build the proposal: append each chosen recommendation's rule to its target voice field, diff it.
   (In the real tool an LLM rewrites the field surgically; here we deterministically append the rule
   line so the prototype shows a clean, honest before/after — see BUILD_NOTES §6.) */
function buildProposal(){
  const notes=$("ln-notes")?$("ln-notes").value:"";
  const {sel,mode}=parseNotesSelection(notes,LEARN_REPORT.recs);
  const chosen=LEARN_REPORT.recs.filter(r=>sel.has(r.n));
  const skipped=LEARN_REPORT.recs.filter(r=>!sel.has(r.n));
  const byField={};
  chosen.forEach(r=>(byField[r.field]=byField[r.field]||[]).push(r));
  const changes=Object.keys(byField).map(f=>{
    const before=settings[f];
    const after=before.trim()+"\n"+byField[f].map(r=>r.rule).join("\n");
    return{field:f,before,after,recs:byField[f].map(r=>r.n)};
  });
  let summary;
  if(!chosen.length)summary="No recommendations selected — nothing to change.";
  else summary=`Applying ${chosen.length} recommendation${chosen.length>1?"s":""} (${chosen.map(r=>"#"+r.n).join(", ")})`+
    (skipped.length?`; leaving out ${skipped.map(r=>"#"+r.n).join(", ")}${mode==="default"?" (tentative — not applied by default)":" per your notes"}.`:".");
  return{changes,summary,notes,chosenNums:chosen.map(r=>r.n),skippedNums:skipped.map(r=>r.n)};
}

function lineDiff(before,after){
  const b=before.split("\n"),a=after.split("\n");
  return a.map((ln,i)=>{const added=i>=b.length||b[i]!==a[i];
    return `<div class="dl ${added?"add":""}">${added?"+ ":"  "}${esc(ln)||"&nbsp;"}</div>`;}).join("");
}

function openLearnings(){
  openModal(`<div class="mhead"><div><h2>🧠 Reply self-learning</h2>
    <div class="sub">Review what the weekly analyzer found, add any notes, then push the ones you approve straight into your voice profile — with a diff first and one-click undo.</div></div>
    <div class="dclose" onclick="closeModal()">×</div></div>
    <div class="mbody" id="ln-body">${renderLearnBody()}</div>`);
}
function renderLearnBody(){
  const R=LEARN_REPORT;
  const recs=R.recs.map(r=>`<div class="lrec">
    <div class="lrn">${r.n}</div>
    <div style="flex:1">
      <div class="lrt">${esc(r.title)} <span class="pill ${r.conf==="high"?"p-grn":"p-amb"}">${r.conf==="high"?"high-confidence":"tentative"}</span></div>
      <div class="muted" style="font-size:12.5px;line-height:1.5">${esc(r.detail)}</div>
      <div class="miniinfo">→ targets <b>${fieldLabel(r.field)}</b></div></div></div>`).join("");
  const live=voiceRevisions.filter(v=>!v.undone).length;
  const revs=voiceRevisions.length?`<div class="lhist">
    <div class="lct" style="margin-bottom:5px">Applied changes — revision history</div>
    ${voiceRevisions.map((v,i)=>`<div class="lrev ${v.undone?"undone":""}">
      <div style="flex:1">
        <div style="font-size:12.5px"><b>${v.fields.map(fieldLabel).join(", ")}</b> · recs ${v.recs.map(n=>"#"+n).join(", ")} ${v.undone?'<span class="pill p-gray">undone</span>':""}</div>
        ${v.notes?`<div class="muted" style="font-size:11.5px">notes: ${esc(v.notes)}</div>`:""}
        <div class="muted" style="font-size:11.5px">${esc(v.summary)}</div></div>
      ${v.undone?"":`<button class="btn ghost sm" onclick="undoVoiceRevision(${i})">↩ Undo</button>`}</div>`).join("")}</div>`:"";
  return `
    <div class="lstats">This week · <b>${R.sent}</b> replies sent · <b>${R.edited}</b> edited before sending (${Math.round(R.edited/R.sent*100)}%) · analyzed ${esc(R.window)}${live?` · <span class="pill p-grn">${live} change${live>1?"s":""} applied</span>`:""}</div>
    <div class="lct" style="margin-top:13px">What it found <span class="muted" style="font-weight:400">— ${R.recs.length} recommendations</span></div>
    ${recs}
    <div class="lct" style="margin-top:15px">Your adjustments</div>
    <div class="muted" style="font-size:12px;margin-bottom:5px">Plain English — e.g. <i>"apply 1 and 2, skip 3"</i> or <i>"do 1 and 2 but not 3"</i>. Leave blank to apply the high-confidence ones (#1, #2).</div>
    <textarea id="ln-notes" style="min-height:58px" placeholder="Optional — which recommendations to apply, and any tweaks…"></textarea>
    <div class="btnrow" style="margin-top:9px">
      <button class="btn sm" onclick="proposeLearnings()">⚙ Propose voice-profile update</button>
      <span class="muted" style="font-size:11px">Shows a diff before anything is saved.</span></div>
    <div id="ln-result" style="margin-top:10px"></div>
    ${revs}`;
}
function proposeLearnings(){
  const p=buildProposal();_pendingProposal=p;
  const box=$("ln-result");
  if(!p.changes.length){box.innerHTML=`<div class="lcard"><b>No changes proposed.</b><div class="muted" style="font-size:12.5px;margin-top:3px">${esc(p.summary)}</div></div>`;return;}
  const diffs=p.changes.map(c=>`<div class="lf">
    <div class="lfh">${fieldLabel(c.field)} <span class="muted">(${c.field})</span></div>
    <div class="diffbox">${lineDiff(c.before,c.after)}</div></div>`).join("");
  box.innerHTML=`<div class="lcard">
    <div class="lct">Proposed voice-profile changes</div>
    <div class="muted" style="font-size:12.5px;margin:2px 0 8px">${esc(p.summary)}</div>
    ${diffs}
    <div class="btnrow" style="margin-top:12px">
      <button class="btn green sm" onclick="confirmProposal()">✓ Confirm &amp; update voice profile</button>
      <button class="btn gray sm" onclick="$('ln-result').innerHTML='';_pendingProposal=null">Cancel</button>
      <span class="muted" style="font-size:11px">Writes the voice fields · one-click undo after</span></div></div>`;
}
function confirmProposal(){
  const p=_pendingProposal;if(!p||!p.changes.length)return;
  snapshot("apply learnings");
  const before={};
  p.changes.forEach(c=>{before[c.field]=settings[c.field];
    (styleVersions[c.field]=styleVersions[c.field]||[]).push(mkStyleVer(TODAY,"apply-learnings",settings[c.field]));
    settings[c.field]=c.after;});
  voiceRevisions.unshift({at:TODAY,notes:p.notes,summary:p.summary,
    fields:p.changes.map(c=>c.field),recs:p.chosenNums,before,undone:false});
  _pendingProposal=null;
  toast("Voice profile updated — undo available","ok");
  render();                 // refresh the dashboard card / engage voice summary
  $("ln-body").innerHTML=renderLearnBody();   // re-render modal in place
}
function undoVoiceRevision(i){
  const r=voiceRevisions[i];if(!r||r.undone)return;
  snapshot("undo learnings apply");
  Object.keys(r.before).forEach(f=>settings[f]=r.before[f]);
  r.undone=true;
  toast("Reverted voice-profile change","ok");
  render();
  $("ln-body").innerHTML=renderLearnBody();
}

go("dash");

document.addEventListener("visibilitychange",()=>{if(!document.hidden){const t=computeToday();if(t!==TODAY){TODAY=t;render();}}});
</script>

<script>
