<!DOCTYPE html>
<html lang="en">
<head>
<style id="demo-first-visit-style">html[data-demo-first-visit] :is(#demo-tour-start,#demo-start,#demo-tour-launch,#tutPill){display:none!important}</style>
<script id="demo-first-visit">
(function(){
  const key="demo-walkthrough-seen:linkedin";
  let first=true;
  try { first=localStorage.getItem(key)!=="1"; } catch {}
  if(first)document.documentElement.setAttribute("data-demo-first-visit","");
  
  function ready(){
    let attempts=0;
    const timer=setInterval(()=>{
      const launch=document.querySelector("#demo-tour-start,#demo-start,#demo-tour-launch,#tutPill");
      if(!launch){if(++attempts>100)clearInterval(timer);return;}
      
      clearInterval(timer);
      if(!first)return;
      launch.click();
      const check=setInterval(()=>{
        const card=document.querySelector("#demo-tour-card,#demo-tour,.tut-card");
        if(card&&!card.hidden&&card.getBoundingClientRect().height){
          try { localStorage.setItem(key,"1"); } catch {}
          clearInterval(check);
        }else if(++attempts>100){
          document.documentElement.removeAttribute("data-demo-first-visit");
          clearInterval(check);
        }
      },100);
    },100);
  }
  if(document.readyState==="complete")setTimeout(ready,500);
  else window.addEventListener("load",()=>setTimeout(ready,500),{once:true});
})();
</script><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; media-src data: blob:; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn Engine</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2330; --muted:#5b6675; --line:#e3e7ec;
  --accent:#3858c6; --accent-soft:#e9eefb; --teal:#0f8f74; --teal-soft:#e1f4ef;
  --amber:#9a6a00; --amber-soft:#fbf0d8; --red:#b4322b; --red-soft:#fbe9e7;
  --green:#2f7d32; --green-soft:#e7f3e8; --purple:#5b3fb5; --purple-soft:#ece7fb;
  --gold:#a96100; --gold-soft:#fbf0d8; --prefgreen:#1b7a37; --pref-soft:#e7f6ec;
  --shadow:0 1px 2px rgba(18,28,45,.06),0 4px 14px rgba(18,28,45,.05);
  --brand:var(--purple);  /* LinkedIn / cross-tool channel colour — this tool's signature */
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.topin{display:flex;align-items:center;gap:24px;padding:0 24px;max-width:1360px;margin:0 auto}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px;padding:14px 0 12px;display:flex;align-items:center;gap:9px}
.brand .li{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:var(--brand);color:#fff;font-weight:800;font-size:13px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:1px}
/* main nav row only (the breadcrumb/utility row stays compact): more room around + between items */
.topin:not(.crumbrow){gap:36px;padding-left:26px;padding-right:26px}
.topin:not(.crumbrow) .tabs{gap:9px}
.topin:not(.crumbrow) .tab{padding:0 19px}
.tabs{display:flex;gap:2px;align-self:stretch}
.tab{position:relative;display:flex;align-items:center;gap:5px;padding:0 15px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.tab .caret{font-size:9px;opacity:.55;margin-left:-1px}
/* count badge floats in the item's top-right corner instead of sitting inline */
.tab>.tc{position:absolute;top:5px;right:1px;font-size:9px;font-weight:800;line-height:1.55;min-width:15px;text-align:center;background:#e3e8ef;color:var(--muted);border-radius:999px;padding:0 4px;box-shadow:0 0 0 2px var(--panel);pointer-events:none}
.tab.active>.tc{background:var(--purple-soft);color:var(--brand)}
.tab>.tc.due{background:var(--red);color:#fff}
.tab>.tc+.tc{right:19px}                 /* a rare second badge stacks left of the first */
/* dropdown (Pipeline parent) + hamburger (More) menus */
.tab.parent,.tab.hamburger{padding-right:12px}
.tab.hamburger{font-size:17px;padding:0 13px}
.navpop{position:absolute;top:100%;left:0;min-width:205px;background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:0 14px 34px rgba(15,20,30,.18);padding:6px;display:none;z-index:9600}
.navpop.right{left:auto;right:0}
.tab.parent:hover .navpop,.tab.hamburger:hover .navpop{display:block}
.tab.parent:hover::after,.tab.hamburger:hover::after{content:"";position:absolute;left:0;right:0;top:calc(100% - 2px);height:10px}  /* hover bridge on the trigger */
.navpop .mi{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 11px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap}
.navpop .mi:hover{background:var(--purple-soft);color:var(--brand)}
.navpop .mi.active{color:var(--brand);background:var(--purple-soft)}
.mtc{font-size:10px;font-weight:800;background:#e3e8ef;color:var(--muted);border-radius:999px;padding:1px 7px;min-width:16px;text-align:center;flex:0 0 auto}
.mtc.due{background:var(--red);color:#fff}
.mtc+.mtc{margin-left:4px}
.hamdot{position:absolute;top:9px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--panel)}
.spacer{flex:1}
.pipe{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.pipe b{color:var(--ink)}.pipe .arr{color:#c2cad6}
.gearbtn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:9px;padding:7px 12px;cursor:pointer}
.gearbtn:hover{border-color:#c8d2e8;color:var(--ink)}
.crumbrow{padding-top:7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.iconbtn{font:inherit;font-size:15px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:9px;width:34px;height:34px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.iconbtn:hover{border-color:#c8d2e8;color:var(--ink)}
.iconbtn:disabled{opacity:.4;cursor:not-allowed}
/* ---- main ---- */
.main{padding:22px 24px 80px;max-width:1360px;margin:0 auto}
h1{font-size:22px;margin:0 0 3px}
.lede{color:var(--muted);margin:0 0 18px;max-width:80ch}
.view{display:none}.view.show{display:block}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 3px;font-size:15px}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:960px){.grid2,.grid3{grid-template-columns:1fr}}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow)}
.kpi b{font-size:24px;display:block;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi .ksub{display:block;font-size:10.5px;opacity:.7;margin-top:2px;font-weight:600}
.kpi.tealk b{color:var(--teal)}.kpi.acck b{color:var(--accent)}.kpi.grnk b{color:var(--green)}
.kpi.redk b{color:var(--red)}.kpi.purk b{color:var(--purple)}.kpi.goldk b{color:var(--gold)}
/* States the denominator IN the UI. Two counts that disagree (325 in the funnel vs 4,852 people)
   read as a bug unless the screen says which one it is measuring and where the rest went. */
.cohortnote{font-size:12px;color:var(--muted);background:var(--purple-soft);border:1px solid #ddd6fb;
  border-radius:8px;padding:8px 12px;margin:0 0 14px;line-height:1.55}
.cohortnote b{color:var(--ink)}
.pxchip{font-size:9px;font-weight:700;background:#eef1f5;color:var(--muted);border:1px solid var(--line);
  border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px;letter-spacing:.2px;white-space:nowrap}
/* bar chart / funnel */
.barrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
.barrow .lab{width:140px;color:var(--muted);text-align:right;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .track{flex:1;background:#eef1f5;border-radius:5px;height:18px;overflow:hidden}
.barrow .track i{display:block;height:100%;background:var(--brand);border-radius:5px;min-width:2px}
.barrow .track i.teal{background:var(--teal)}.barrow .track i.amber{background:var(--amber)}
.barrow .track i.green{background:var(--green)}.barrow .track i.accent{background:var(--accent)}
.barrow .val{width:38px;font-weight:600;font-variant-numeric:tabular-nums}
/* buttons */
.btn{font:inherit;font-weight:600;font-size:13px;border-radius:9px;padding:8px 15px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:#fff;color:var(--brand)}
.btn.accent{background:var(--accent);border-color:var(--accent)}.btn.accent.ghost{background:#fff;color:var(--accent)}
.btn.teal{background:var(--teal);border-color:var(--teal)}.btn.teal.ghost{background:#fff;color:var(--teal)}
.btn.gray{background:#fff;color:var(--muted);border-color:var(--line)}
.btn.amber{background:var(--amber);border-color:var(--amber)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.red.ghost{background:#fff;color:var(--red);border-color:#f2cfca}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
/* toolbar */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{font:inherit;font-size:12.5px;font-weight:600;border:0;background:#fff;color:var(--muted);padding:7px 13px;cursor:pointer}
.seg button.on{background:var(--purple-soft);color:var(--brand)}
.seg button+button{border-left:1px solid var(--line)}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--ink);background:#fff}
input[type=search]{min-width:230px}
textarea{width:100%;resize:vertical;line-height:1.5}
label.fld{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;margin:0 0 5px}
/* table */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:var(--panel);max-height:calc(100vh - 300px)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{background:#fafbfc;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}
th.nosort{cursor:default}
th .arr{color:var(--brand);font-size:10px;margin-left:3px}
tbody tr:hover{background:#f7f9fc}
tr.om td{color:#aab2bd}tr.om td .nm{text-decoration:line-through;text-decoration-color:#d8a39e}
.lead{font-weight:600;color:var(--ink)}
td .acct{color:var(--muted);font-size:12px}
.ck{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;vertical-align:middle}
.linkish{color:var(--accent);cursor:pointer}.linkish:hover{text-decoration:underline}
.listtbl{table-layout:fixed}.listtbl th,.listtbl td{overflow:hidden;text-overflow:ellipsis}
.listtbl th{position:relative}
.rsz{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;user-select:none}
.rsz:hover{background:#c8d2e8}
body.resizing{cursor:col-resize;user-select:none}
/* avatar */
.av{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;flex:0 0 auto}
.av.big{width:46px;height:46px;font-size:16px}
.person{display:flex;align-items:center;gap:9px;min-width:0;max-width:100%}
.person>div{min-width:0}
.person .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px}
.person .hl{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px}
.frow>.fv{flex:1 1 auto;min-width:0;overflow:hidden}
/* pills */
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid;line-height:1.5}
.p-grn{color:var(--green);background:var(--green-soft);border-color:#c7e3c8}
.p-amb{color:var(--amber);background:var(--amber-soft);border-color:#ecd9a8}
.p-red{color:var(--red);background:var(--red-soft);border-color:#f2cfca}
.p-acc{color:var(--accent);background:var(--accent-soft);border-color:#d4ddf7}
.p-teal{color:var(--teal);background:var(--teal-soft);border-color:#c5e8df}
.p-pur{color:var(--purple);background:var(--purple-soft);border-color:#d8cdf3}
.p-gray{color:var(--muted);background:#eef1f5;border-color:var(--line)}
/* ── CAMPAIGN (series) palette ─────────────────────────────────────────────────────────────────
   Six well-separated hues, NO GREEN: green is already "ready to send" on a pipeline card, and a
   green campaign would make that status unreadable. Each colour supplies an ink, a wash and a
   border so a chip, a card stripe and a legend swatch all stay recognisably the same campaign. */
:root{
  --sc-indigo:#3949ab;  --sc-indigo-soft:#e8ebfa;  --sc-indigo-line:#c5cdf0;
  --sc-magenta:#a51e69; --sc-magenta-soft:#fbe6f1; --sc-magenta-line:#f0c2da;
  --sc-cyan:#0d7490;    --sc-cyan-soft:#e0f2f7;    --sc-cyan-line:#b6dce8;
  --sc-orange:#b4600f;  --sc-orange-soft:#fceee0;  --sc-orange-line:#efd0ac;
  --sc-violet:#6d3fb5;  --sc-violet-soft:#efe8fb;  --sc-violet-line:#d5c6f2;
  --sc-slate:#455a75;   --sc-slate-soft:#e9eef4;   --sc-slate-line:#c7d2e0;
}
.schip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:2px 8px;
  border-radius:999px;border:1px solid;line-height:1.5;max-width:170px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.schip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.sc-indigo {color:var(--sc-indigo); background:var(--sc-indigo-soft); border-color:var(--sc-indigo-line)}
.sc-magenta{color:var(--sc-magenta);background:var(--sc-magenta-soft);border-color:var(--sc-magenta-line)}
.sc-cyan   {color:var(--sc-cyan);   background:var(--sc-cyan-soft);   border-color:var(--sc-cyan-line)}
.sc-orange {color:var(--sc-orange); background:var(--sc-orange-soft); border-color:var(--sc-orange-line)}
.sc-violet {color:var(--sc-violet); background:var(--sc-violet-soft); border-color:var(--sc-violet-line)}
.sc-slate  {color:var(--sc-slate);  background:var(--sc-slate-soft);  border-color:var(--sc-slate-line)}
.sc-none{color:var(--muted);background:#f2f4f7;border-color:var(--line);border-style:dashed}
.sc-none::before{background:transparent;box-shadow:inset 0 0 0 1px var(--muted)}
/* The campaign stripe down the left edge of an option card. A SEPARATE class from the chip on
   purpose: the chip classes set `color`, and putting one on the card would tint every word in it. */
.opt.st-indigo {border-left:4px solid var(--sc-indigo)}
.opt.st-magenta{border-left:4px solid var(--sc-magenta)}
.opt.st-cyan   {border-left:4px solid var(--sc-cyan)}
.opt.st-orange {border-left:4px solid var(--sc-orange)}
.opt.st-violet {border-left:4px solid var(--sc-violet)}
.opt.st-slate  {border-left:4px solid var(--sc-slate)}
.opt.st-none   {border-left:4px solid var(--line)}
/* legend / filter bar above the board */
.serbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 12px}
.serbar .sl{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.serbar .schip{cursor:pointer;user-select:none}
.serbar .schip.off{opacity:.4}
.serbar .schip .sx{opacity:.55;font-weight:700;margin-left:1px}
.serbar .schip .sx:hover{opacity:1}
.opt.dimmed{opacity:.32}
/* composer: why this option is pre-picked, and which rows are the same campaign as the person */
.cmpwhy{font-size:11.5px;line-height:1.5;color:var(--muted);background:#f6f8fb;border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:0 7px 7px 0;padding:7px 10px;margin:0 0 8px}
.cmpwhy.orphan{background:var(--amber-soft);border-color:#ecd9a8;border-left-color:var(--amber);color:#6b4b02}
.cmpwhy b{color:var(--ink)}
.rulerow.samecamp{background:#f8fafd;border-radius:7px;padding-left:7px!important;padding-right:7px!important}
.tag{display:inline-block;font-size:10.5px;color:var(--muted);background:#eef1f5;border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin:1px 3px 1px 0}
.tag.block{color:var(--red);background:var(--red-soft,#fdecec);border-color:#f3c9c9;font-weight:600}
.tagcell{white-space:normal;line-height:1.7}
/* Summary column: classifier role badge + the profile summary, clamped to a few readable lines */
.summcell{max-width:360px;min-width:200px;white-space:normal}
.summcell .summtxt{font-size:11px;color:var(--muted);line-height:1.4;margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.summcell:hover .summtxt{-webkit-line-clamp:unset;overflow:visible}
.tagtog{cursor:pointer} .tagtog .tx{margin-left:3px;opacity:.45;font-weight:700}
.tagtog:hover{border-color:var(--accent);color:var(--accent)} .tagtog:hover .tx{opacity:1;color:var(--red)}
/* always-visible quick-tag toggle chips in the Connections Tags column (agency/museum/personal/client/omit) */
.qtag{display:inline-block;font-size:10.5px;border-radius:6px;padding:1px 7px;margin:1px 3px 1px 0;cursor:pointer;border:1px dashed var(--line);background:#fff;color:var(--muted);user-select:none}
.qtag:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.qtag.on{background:#e3f5f2;border-style:solid;border-color:var(--teal);color:var(--teal);font-weight:600}
.qtag.on-block{background:var(--red-soft,#fdecec);border-style:solid;border-color:#f3c9c9;color:var(--red);font-weight:600}
/* Prospects: names the two populations the tab mixes, so the split is stated not inferred. */
.splitnote{font-size:12px;color:var(--muted);background:#f6f7fb;border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;margin:0 0 10px}
.splitnote b{color:var(--ink)}
/* add-to-pipeline chip (Connections). .warn = something is in the way but the click still works. */
.qtag.pipeadd{white-space:nowrap}
.qtag.pipeadd:hover{background:var(--accent-soft,#eee9fd)}
.qtag.pipeadd.warn{border-color:#f0d7a8;color:#a5730f}
.qtag.pipeadd.warn:hover{border-color:#e0a83c;color:#8a5f0b;background:#fdf5e6}
.pill.pipein{cursor:pointer}
/* tri-state tag FILTER chips in the Connections toolbar (include / exclude / off) */
.tagfilter{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center}
.tfchip{display:inline-block;font-size:11px;border-radius:6px;padding:2px 8px;cursor:pointer;border:1px dashed var(--line);background:#fff;color:var(--muted);user-select:none;white-space:nowrap}
.tfchip:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.tfchip.inc{background:#e3f5f2;border-style:solid;border-color:var(--teal);color:var(--teal);font-weight:600}
.tfchip.exc{background:var(--red-soft,#fdecec);border-style:solid;border-color:#e6a6a2;color:var(--red);font-weight:600;text-decoration:line-through}
/* always-visible principal (shield) toggle in the Connections Facets column */
.ptog{display:inline-block;cursor:pointer;padding:2px 5px;border-radius:6px;border:1px dashed var(--line);color:var(--muted);vertical-align:middle;line-height:1}
.ptog:hover{border-style:solid;border-color:var(--gold);color:var(--gold)}
.ptog.on{border-style:solid;border-color:var(--gold);color:var(--gold);background:#fdf6e3}
.tagadd{border:1px dashed var(--line);background:#fff;color:var(--muted);border-radius:6px;padding:0 6px;font-size:12px;cursor:pointer;vertical-align:middle;line-height:1.5}
.tagadd:hover{border-color:var(--accent);color:var(--accent);border-style:solid}
.tagpop{position:absolute;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:200px;max-height:320px;overflow:auto}
.tagpop .tphead{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:3px 6px 6px}
.tprow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12.5px}
.tprow:hover{background:var(--bg)} .tprow.on{color:var(--accent);font-weight:600} .tprow.on.blk{color:var(--red)}
.tprow .tpck{color:var(--accent);font-weight:700} .tprow.blk .tpck{color:var(--red)}
.muted{color:var(--muted)}.tnum{font-variant-numeric:tabular-nums}
.star-prin{color:var(--gold)}.star-pref{color:var(--prefgreen)}
.badge-prin{color:var(--gold)}.ic-shield{vertical-align:-1px}
.badge-focus{font-size:10.5px;vertical-align:1px} .pill.p-focus{background:#eaf6ee;color:#1c7a3e;border-color:#bfe3c9}
.badge-gone{font-size:10.5px;vertical-align:1px;filter:grayscale(1);opacity:.8;cursor:help}
/* low invite-queue banner (dashboard) */
.qbanner{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:8px;margin:0 0 14px;
  background:#fff8e6;border:1px solid #f0d9a0;color:#6b4e00;font-size:13px;line-height:1.45}
.qbanner.empty{background:#fdecec;border-color:#f2c2c2;color:#8a1f1f}
.qbanner .qb-i{font-size:15px;line-height:1.2}
.qbanner b{font-weight:650} .qbanner .qb-sub{opacity:.85;margin-top:2px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:#eef1f5;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-weight:700;color:var(--ink)}
/* bulk bar */
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:40;background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(18,28,45,.28)}
.bulk b{font-size:14px}.bulk .x{cursor:pointer;color:#aab2bd;margin-left:4px}
.bulk .btn{padding:6px 12px;font-size:12.5px}
.bulk .btn.gray{background:#2b3446;color:#dfe4ec;border-color:#3a4459}
.bulk .bulklbl{font-size:11.5px;color:#aab2bd;margin-left:4px}
.bulk .bulksep{width:1px;align-self:stretch;background:#3a4459;margin:0 2px}
.bulk .btn.bulktag{padding:5px 9px;font-size:11.5px;background:#2b3446;color:#dfe4ec;border-color:#3a4459}
.bulk .btn.bulktag:hover{border-color:var(--teal);color:#fff}
.bulk .btn.bulktag.blk:hover{border-color:var(--red)}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(18,28,45,.32);z-index:50;display:none}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:500px;max-width:94vw;background:var(--panel);border-left:1px solid var(--line);z-index:51;transform:translateX(100%);transition:transform .18s;overflow:auto;box-shadow:-8px 0 30px rgba(18,28,45,.12)}
.drawer.show{transform:translateX(0)}
.dhead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:18px 20px;display:flex;align-items:flex-start;gap:12px;z-index:2}
.dhead h2{margin:0;font-size:18px}.dhead .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.dclose{margin-left:auto;cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
.dbody{padding:18px 20px 50px}
.frow{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid #f0f2f5;font-size:13px;align-items:center}
.frow .fl{width:118px;color:var(--muted);flex:0 0 auto}.frow .fv{flex:1}
.frow .fv input,.frow .fv select{width:100%;max-width:300px}
.sechead{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 0 7px;font-weight:700}
.sechead .secbtn{float:right;margin-top:-4px}
.hist{border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:7px;font-size:12.5px}
.hist b{font-size:13px}
.cnotes{width:100%;resize:vertical;min-height:60px}
/* guide / banner */
.guide{border:1px solid #d8cdf3;background:#faf8ff;border-radius:11px;padding:13px 16px;margin:0 0 18px;font-size:13px;color:var(--muted);display:flex;gap:11px}
.guide.teal{border-color:#c5e8df;background:#f6fdfb}
.guide.amber{border-color:#ecd9a8;background:var(--amber-soft)}
.guide b{color:var(--ink)}.guide .ic{font-size:18px;flex:0 0 auto}
/* page header */
.pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:8px}
.pagehead .pht{flex:1}.pagehead h1{margin-bottom:3px}
/* modal */
.modalwrap{position:fixed;inset:0;background:rgba(18,28,45,.34);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:52px 20px;overflow:auto}
.modalwrap.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:620px;width:100%;box-shadow:0 22px 60px rgba(18,28,45,.28);animation:tin .16s}
.modal.wide{max-width:820px}
.modal .mhead{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.modal .mhead h2{margin:0;font-size:18px}.modal .mhead .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.modal .mbody{padding:16px 20px 22px}
/* toast */
#toast{position:fixed;bottom:22px;left:22px;z-index:80;display:flex;flex-direction:column;gap:8px}
.to{background:var(--ink);color:#fff;padding:10px 15px;border-radius:9px;font-size:13px;box-shadow:0 6px 20px rgba(18,28,45,.25);animation:tin .2s}
.to.ok{background:#1f5e34}.to.warn{background:#7c5300}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
/* chips / filters */
.qfrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.chip2{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--ink)}
.chip2:hover{border-color:#c8d2e8}
.chip2.set{border-color:var(--brand);background:var(--purple-soft);color:var(--brand)}
.chip2 .c{font-size:10.5px;font-weight:700;background:#eef1f5;border-radius:999px;padding:0 6px}
.chip2.set .c{background:#fff}
/* segmented funnel kanban */
/* PIPELINE BOARD — columns come from the funnel's stages, so the count is user-defined. Give each
   a min width and let the board scroll inside its own wrapper rather than squeezing to nothing:
   a 6-stage funnel used to crush every column to ~160px. */
.kanwrap{overflow-x:auto;padding-bottom:8px}
/* sync-now control */
.h1row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.syncbar{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted)}
.syncbar.working{color:var(--accent);font-weight:600}
.syncbar.err{color:#dc2626;background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.28);
  border-radius:9px;padding:5px 10px;max-width:520px}
.syncnote{color:var(--muted)}
.syncbar .mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}
.spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* drag to re-seat a card between columns */
.pcard[draggable=true]{cursor:grab}
.pcard.dragging{opacity:.45;cursor:grabbing}
.kcol.droppable{outline:1px dashed var(--line);outline-offset:3px;border-radius:10px}
.kcol.over{outline:2px dashed var(--accent);background:var(--accent-soft,rgba(37,99,235,.06))}
/* follow-up list */
.hcount{font-size:13px;font-weight:600;color:var(--muted);margin-left:8px}
.fustats{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
.fustat{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:4px 11px}
.fustat b{color:var(--ink);font-size:13px}
.fustat.hot{border-color:#f0dca8;background:#fff8e6;color:#7a5b12}
.fustat.hot b{color:#7a5b12}
.furow{display:grid;grid-template-columns:minmax(190px,1.4fr) 120px 132px minmax(200px,1.6fr) auto;
  gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:11px;
  background:var(--panel);margin-bottom:9px}
.furow.due{border-color:#f0dca8;background:#fffdf7}
.furow.done{opacity:.62}
.fu-who{display:flex;gap:9px;align-items:center;min-width:0;cursor:pointer}
.fu-nm{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fu-hl{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fu-when{font-size:12px}
.fu-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:3px}
.fu-date{font:inherit;font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);color:var(--ink);width:100%}
.fu-notes{font:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);resize:vertical;width:100%}
.fu-acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.empty{border:1px dashed var(--line);border-radius:11px;padding:22px;color:var(--muted);font-size:13px}
@media(max-width:1000px){.furow{grid-template-columns:1fr 1fr;gap:9px}
  .fu-who{grid-column:1/-1}.fu-notes{grid-column:1/-1}.fu-acts{grid-column:1/-1;flex-direction:row}}
/* thread-mirror lag: sends the tool has logged but the sync has not brought back yet */
.thrpop .tlag{background:#fff8e6;border:1px solid #f0dca8;color:#7a5b12;border-radius:7px;
  padding:6px 8px;margin:0 0 7px;font-size:11.5px;line-height:1.45}
/* the OTHER state: logged hours ago and still absent, so sync lag is not the explanation and the
   amber "already delivered" reassurance would be false. Red, because this one wants a human. */
.thrpop .tlag.tmiss{background:#fdeeee;border-color:#efc3c3;color:#8c2d2d}
.lagdot{color:var(--amber,#c98a12);margin-left:4px;font-size:9px;vertical-align:2px}
.lagdot.missdot{color:#c0392b}
/* exited drawer — collapsed by default so it reads as an archive, not another column */
.exwrap{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.exhead{display:inline-flex;align-items:center;gap:7px;background:none;border:0;cursor:pointer;
  font:600 12.5px/1 inherit;color:var(--muted);padding:4px 2px}
.exhead:hover{color:var(--ink)}
.exhead .cv{font-size:10px;width:9px}
.exhead .n{background:var(--line);color:var(--ink);border-radius:999px;padding:1px 7px;font-size:11px}
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:9px}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(212px,1fr));gap:13px;align-items:start;min-width:min-content}
@media(max-width:1100px){.kanban{grid-template-columns:repeat(2,minmax(212px,1fr))}}
.kcol{background:#f1f3f7;border:1px solid var(--line);border-radius:12px;padding:11px;min-height:80px}
.kcol .kh{display:flex;align-items:center;justify-content:space-between;margin:0 2px 9px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.kcol .kh .n{background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px}
.pcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;box-shadow:var(--shadow);cursor:pointer}
.pcard:hover{border-color:#c8d2e8}
/* left the network: readable but visibly inert — greyed, desaturated, no send affordance. NOT
   hidden and NOT auto-exited; the operator wants to see who dropped off and decide for himself. */
.pcard.gone{background:#f6f7f9;border-color:#e3e6ec;box-shadow:none}
.pcard.gone .pc-nm,.pcard.gone .pc-hl,.pcard.gone .pc-meta{color:#98a1b0}
.pcard.gone .pc-top,.pcard.gone .pc-meta,.pcard.gone .pc-hl{filter:grayscale(1);opacity:.75}
.gonebar{display:block;margin:6px 0 2px;padding:4px 7px;border-radius:6px;font-size:11.5px;font-weight:600;
  color:#8a6d3b;background:rgba(212,160,23,.12);border:1px solid rgba(212,160,23,.3)}
.pcard .pc-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.pcard .pc-nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pc-hl{color:var(--muted);font-size:11px;line-height:1.35;margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pc-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pcard .pc-acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
/* secondary row: exit / re-bucket. Muted so it never competes with the send button. */
.pcard .pc-acts2{display:flex;gap:5px;margin-top:5px;align-items:center;flex-wrap:wrap}
.pcard .pc-acts2 .btn{padding:2px 6px;font-size:10.5px}
.pcard select.mvstage{font-size:10.5px;padding:2px 4px;max-width:132px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted)}
.miniinfo{font-size:11px;color:var(--muted);margin-top:5px}
/* READY-TO-SEND SIGNAL — the stage's own `waitDays` has elapsed since the last touch.
   Green, not orange/red: this is a GO state, not a problem. Red already means "something is wrong"
   elsewhere in this tool (failed send, lag), and a board where every healthy waiting card turns red
   on schedule trains you to ignore red. Reserved the amber `.wait` tone for "still cooking". */
.duetag{font-weight:600;white-space:nowrap}
.duetag.ready{color:var(--green)}
.duetag.wait{color:var(--muted);font-weight:500}
/* inset shadow rather than a real left border: a border would widen the box and nudge every ready
   card's text 2px out of line with its neighbours' */
.pcard.ready{border-color:#c7e3c8;box-shadow:inset 3px 0 0 var(--green),var(--shadow);
  background:linear-gradient(90deg,var(--green-soft),#fff 46%)}
.pcard.ready .miniinfo.isready{color:var(--green)}
/* ── CAMPAIGN STRIPE on a pipeline card ───────────────────────────────────────────────────────
   Same left-edge read as the Message Funnel board, so a campaign looks the same wherever you meet
   it. A pseudo-element, NOT a border, for the reason the note above gives: a real border widens the
   box and would nudge every campaign card's text out of line with its neighbours'.

   It takes the outermost 4px and READINESS MOVES INSIDE IT rather than being displaced: a ready
   card in a campaign shows campaign-then-green, and readiness still also carries the green wash,
   the light-green border and the green "▶ ready" label. That redundancy is the whole reason this
   is safe — readiness was never resting on the stripe alone, so lending the outer edge to the
   campaign costs it nothing. Cards with no campaign are untouched. */
.pcard.hascamp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  border-radius:10px 0 0 10px;background:var(--camp);pointer-events:none}
.pcard.st-indigo {--camp:var(--sc-indigo)}
.pcard.st-magenta{--camp:var(--sc-magenta)}
.pcard.st-cyan   {--camp:var(--sc-cyan)}
.pcard.st-orange {--camp:var(--sc-orange)}
.pcard.st-violet {--camp:var(--sc-violet)}
.pcard.st-slate  {--camp:var(--sc-slate)}
/* ready AND in a campaign: green shifts to 4-7px so both stripes are visible side by side */
.pcard.ready.hascamp{box-shadow:inset 7px 0 0 var(--green),var(--shadow)}
/* a lost connection is greyed all over — a campaign colour would fight that signal */
.pcard.gone::before{background:#c8ccd4}
/* THREAD HOVERCARD — the real synced LinkedIn exchange, revealed by hovering the last-touch stamp.
   The event log only carries wording for sends made AFTER send-logging shipped, so for anything
   older this conversation IS the record of what actually went out. */
.thr{position:relative;display:inline-block;cursor:help;border-bottom:1px dotted currentColor}
.thrpop{display:none;position:absolute;z-index:60;left:0;top:100%;margin-top:5px;width:330px;
  max-height:326px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 10px 30px rgba(16,24,40,.16);padding:9px 10px;cursor:auto;
  text-align:left;font-weight:400;color:var(--ink);text-transform:none;letter-spacing:0}
.thr:hover .thrpop,.thrpop:hover{display:block}
/* transparent hover bridge across the 5px gap so the popup doesn't drop while the cursor travels
   from the stamp into it.
   THE BRIDGE MUST LIVE ON .thr, NOT ON .thrpop. v1 of this fix hung it off `.thrpop::before` with
   top:-7px — correct geometry, but .thrpop is `overflow-y:auto`, and a scroll container CLIPS its
   own absolutely-positioned pseudo-element. The strip was painted and then cut off, so the gap
   still fell through to .pcard and the card still vanished. Hanging it on .thr (no overflow) works
   for both the down and the flipped-up placement at once, since inflating .thr's hit area on all
   sides covers whichever side the popup took. Hovering a pseudo-element counts as hovering its
   originating element, so .thr:hover stays true across the gap. */
.thr:hover::after{content:"";position:absolute;left:0;right:0;top:-7px;bottom:-7px}
.thrpop.up{top:auto;bottom:100%;margin:0 0 5px}
.thrpop.rt{left:auto;right:0}
.thrpop .thh{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
  margin-bottom:6px;position:sticky;top:-9px;background:var(--panel);padding:2px 0 5px}
.thrpop .tm{font-size:11.5px;line-height:1.45;margin-bottom:7px;padding:6px 8px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.thrpop .tm.me{background:var(--purple-soft);border:1px solid #d9d2f0}
.thrpop .tm.them{background:var(--teal-soft);border:1px solid #bfe3d8}
.thrpop .tw{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);display:block;margin-bottom:2px}
.thrpop .tnone{font-size:11.5px;color:var(--muted);padding:4px 0}
/* "this row's next stage is due" — green for the same reason the card is: it's a GO, not a fault.
   (The old red .cell-stale lived here; it fired on the same condition and read as an error.) */
.cell-ready{color:var(--green);font-weight:600}
/* Red here is correct and is NOT the old .cell-stale: an invite unanswered past your own withdraw
   threshold is a fault state you were told was being handled automatically and isn't. */
.cell-overdue{color:var(--red);font-weight:700}
tr.staleinv{background:var(--red-soft,#fdecec)}
.soak{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600}
.soak.ready{color:var(--green)}.soak.wait{color:var(--amber)}
tr.resolving{background:repeating-linear-gradient(45deg,#fffdf5,#fffdf5 10px,#fff8e8 10px,#fff8e8 20px)}
tr.resolving .soak.wait{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
/* warm-up checklist */
.warm{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
.warmstep{display:inline-flex;align-items:center;gap:4px;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;cursor:pointer;color:var(--muted);background:#fff}
.warmstep.done{color:var(--green);background:var(--green-soft);border-color:#c7e3c8}
/* feed */
.feedwrap{display:grid;grid-template-columns:1fr 290px;gap:18px;align-items:start}
@media(max-width:1000px){.feedwrap{grid-template-columns:1fr}}
.grpsec{margin-bottom:8px}
.grptitle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin:14px 2px 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grptitle .gt-n{color:var(--muted);font-weight:600}
.grptitle.pref{color:var(--prefgreen)}.grptitle.ai{color:var(--purple)}
.post{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:13px;box-shadow:var(--shadow);border-left:3px solid transparent}
.post.starred{border-left-color:var(--prefgreen)}
.post.ai{border-left-color:var(--purple)}
.post.low{opacity:.74;border-left-color:#c2cad6;background:#fbfcfd}
.post.done{opacity:.62}
.engbadge{display:inline-block;font-size:10.5px;font-weight:600;color:var(--teal);background:var(--teal-soft);border:1px solid #c5e8df;border-radius:999px;padding:0 7px;margin-left:7px}
/* Pipeline marker on Engage cards: where this author sits in the outreach funnel, hovering into the
   DM thread so the feed shows not just past comments but the messages this person has been sent. It's
   a .thr trigger wrapping a stage pill — kill the .thr dotted underline (a pill reads better plain). */
.pipemark{border-bottom:none;margin-left:6px;vertical-align:baseline}
.pipemark .pill{cursor:help;font-size:10px}
/* "N commented" inside the badge is a .thr hovercard listing what the operator actually posted, so he can
   check his previous angles before commenting on the same person again. Wider than the default

   stage = the outreach state machine:

   deciding to promote someone out of the Outreach Engine IS the decision to work them, so
   they sync straight into "warming" (on deck). The only automatic pre-step is resolving their
   LinkedIn profile / provider-id (via Unipile, mirrors linkedin_provider_id in the live :8785
   engine) — tracked by p.resolved; it kicks off on arrival, no manual action, and until it
   clears you can't warm or send them.

function daysAgoISO(n){const d=Date.parse(TODAY+"T00:00:00")-n*86400000;const dt=new Date(d);

/* Year shown for anything outside the current year. Dropping it unconditionally was safe while
   every date on screen was recent, but the Connections list spans 2007→today: a connection made in

   for exactly the old records you'd sort by date to find. Current-year dates stay short. */
function fmtDate(d){if(!d)return"—";const[y,m,day]=d.split("-").map(Number);
  const thisYear=+TODAY.slice(0,4);
  return MONTHS[m-1]+" "+day+(y===thisYear?"":" '"+String(y).slice(-2));}
/* business-days-since helper mirrors funnel_send.business_days_since() — weekends excluded */

/* ═══ FUNNEL MODEL v2 (2026-07-18) ═══════════════════════════════════════════════════════
   funnel → stage → option → branch → a NEW funnel.

   · FUNNEL  one ordered sequence of stages. Exactly one ROOT (the baseline drip); every branch
             owns another. `funnels[].branchId` = the branch that spawned it (null on the root).
   · STAGE   one step = one COLUMN of the library board. User-defined: rename, reorder, add a
             5th/6th follow-up, delete. Stage 0 of the root funnel is the intro.
   · OPTION  a message you might send at that stage. Several per stage; A/B alternates nest.
   · BRANCH  a classified reply to ONE option — it exists only because that message asked a
             question, so it is owned by `branches[].messageId`, NOT by the funnel. Answering it
             diverts the person into `branches[].funnelId`, and they never return to the parent.

   Why not the v1 model: v1 made a branch a global row spanning every stage, which implied
   "answered 1–2" meant something at the Intro stage. It doesn't. See DESIGN.md §13.

   `quickKeys` stays an OPTIONAL per-branch shortcut — the classifier hides the row when empty. */
let funnels=[{id:1,label:"Baseline",branchId:null,isRoot:true,people:0}];
let stages=[
  {id:1,funnelId:1,label:"Intro",hint:"First touch after a connection accepts",sortOrder:0},
  {id:2,funnelId:1,label:"Follow-up 1",hint:"First nudge if no reply",sortOrder:1},
  {id:3,funnelId:1,label:"Follow-up 2",hint:"Second nudge",sortOrder:2},
  {id:4,funnelId:1,label:"Follow-up 3",hint:"Final nudge before you let it rest",sortOrder:3},
];
let branches=[];
/* ── SERIES (campaigns) ────────────────────────────────────────────────────────────────────────
   The grouping the stage columns could never express. A STAGE says WHEN a message goes out; a
   SERIES says WHICH campaign it belongs to, so one campaign's intro / FL1 / FL2 … read as one
   thread running left-to-right across the board.

   Deliberately SOFT. It colours the board and pre-selects the composer; it never restricts what
   you may send. That flexibility is the point — a one-off bridge option that pulls somebody from
   an old campaign into a new one is a real thing the operator does, and a strict model would forbid it.

   GREEN IS NOT IN THE PALETTE. Green already means "ready to send" on a pipeline card, and a
   campaign that happened to be green would make a status signal unreadable. Readiness stays
   green + a label; campaigns get the other six hues. Mirrors SERIES_COLORS in linkedin_engine.py. */
const SERIES_COLORS=["indigo","magenta","cyan","orange","violet","slate"];

const seriesById   = id=>series.find(s=>s.id===id)||null;

const seriesStripe = m=>{const s=seriesOf(m);return s?("st-"+(s.color||"indigo")):"st-none";};
/* the small coloured campaign badge — used on option cards, composer rows and pipeline cards */
function seriesChip(m,opt){opt=opt||{};const s=seriesOf(m);
  if(!s)return opt.showNone?`<span class="schip sc-none" title="Not assigned to a campaign yet">no campaign</span>`:"";
  return `<span class="schip sc-${esc(s.color||"indigo")}" title="Part of the ${attrEsc(s.label)} campaign${
    s.note?" — "+attrEsc(s.note):""}">${esc(s.label)}</span>`;}
/* Which campaign is this person actually riding? Read it off what they were SENT, newest first —
   never off a stored field, because nothing writes one and a person's campaign is simply the
   campaign of the last thing that went to them. Falls back through the same chain lastSentMessage
   uses so a person whose sends predate send-logging still resolves via their intro. */
function personSeriesId(p){
  const sends=(p&&p.sends)||[];
  for(let i=sends.length-1;i>=0;i--){
    const s=sends[i]||{};
    const m=(s.messageId!=null?msgById(s.messageId):null)||(s.code?library.find(x=>x.code===s.code):null);
    if(m&&m.seriesId!=null)return m.seriesId;}
  if(p&&p.fuMsgIds){const steps=Object.keys(p.fuMsgIds).map(Number).sort((a,b)=>b-a);
    for(const s of steps){const m=msgById(p.fuMsgIds[s]);if(m&&m.seriesId!=null)return m.seriesId;}}
  if(p&&p.introMessageId!=null){const m=msgById(p.introMessageId);if(m&&m.seriesId!=null)return m.seriesId;}
  return null;}
const rootFunnel   = ()=>funnels.find(f=>f.isRoot||f.branchId==null)||funnels[0];
const funnelById   = id=>funnels.find(f=>f.id===id);
const stageById    = id=>stages.find(s=>s.id===id);

const stageIndex   = sid=>{const s=stageById(sid); return s?stagesOf(s.funnelId).findIndex(x=>x.id===sid):-1;};

const personFunnel = p=>funnelById(p.funnelId)||rootFunnel();
const onBranch     = p=>{const f=personFunnel(p); return !!f&&!f.isRoot&&f.branchId!=null;};
/* fuStep = index of the LAST stage sent (-1 = nothing sent in this funnel yet), so the NEXT
   message is stage index fuStep+1. Returns null when they've finished the funnel.
   `lastSentIx` does NOT trust the counter blind: on the ROOT funnel, stage!=='intro_sent' means
   nothing has gone out no matter what fuStep says, so the next send is the intro. Column 0 of the
   board already reads `stage`, and /api/person/<id>/stage already treats accepted <-> step -1 as
   the same fact — this closes the one place that read the counter alone. It mattered: the people
   table defaulted fu_step to 0 ("intro already sent"), so every freshly synced connection served
   Follow-up 1 from a button labelled "Send intro". */
function lastSentIx(p){const f=personFunnel(p),ix=(p.fuStep==null?-1:p.fuStep);
  if(f.isRoot&&p.stage!=="intro_sent")return -1;
  return ix;}
/* The last stage this person will ACTUALLY receive, which is a question about their CAMPAIGN and
   not about their funnel. A campaign can be shorter than the funnel it runs inside: "Simple and
   Direct" is 3 messages sitting in a 5-stage funnel. Reading "final" off the funnel is wrong twice
   over — the card offers a Follow-up 3 the campaign does not have, and the composer then falls back
   to the newest option from ANOTHER campaign, which drops the person into a thread they never
   began. Falls back to the funnel's own end when nothing they have been sent carries a campaign. */
function campaignLastIx(p){
  const ss=stagesOf(personFunnel(p).id), sid=personSeriesId(p);
  if(sid==null)return ss.length-1;
  let last=-1;
  ss.forEach((st,i)=>{if(library.some(m=>m.isActive&&m.stageId===st.id&&m.seriesId===sid))last=i;});
  /* A campaign with no message anywhere in THIS funnel (someone diverted onto a branch the campaign
     never covered) must not read as "already finished" — that would strand them with no next touch
     and no way to see why. Defer to the funnel and let the composer's own warning handle it. */
  return last<0?ss.length-1:last;}
function nextStageOf(p){const ss=stagesOf(personFunnel(p).id);
  const ix=lastSentIx(p)+1;
  if(ix>=ss.length)return null;              // funnel itself ran out
  if(ix>campaignLastIx(p))return null;       // their campaign ran out first
  return ss[ix];}
/* True when the NEXT send is the last one this person will get, so the button can say so before
   it's clicked. the operator's ask (2026-08-17): sending it removes them from the pipeline board, and a
   button that reads the same as every other send gives no warning that it's about to do that. */
function isFinalSend(p){const nx=nextStageOf(p); if(!nx)return false;
  const ss=stagesOf(personFunnel(p).id);
  return ss.findIndex(x=>x.id===nx.id)>=campaignLastIx(p);}
function stageLabelOf(p){const ss=stagesOf(personFunnel(p).id),ix=p.fuStep==null?-1:p.fuStep;
  return (ix>=0&&ix<ss.length)?ss[ix].label:"";}
/* breadcrumb from the root down to a funnel: [{funnel,stage,message,branch}…] */
function funnelPath(fid){const out=[];let f=funnelById(fid),guard=0;
  while(f&&!f.isRoot&&f.branchId!=null&&guard++<20){
    const b=branches.find(x=>x.id===f.branchId); if(!b)break;
    const m=msgById(b.messageId), s=m?stageById(m.stageId):null;
    out.unshift({funnel:f,branch:b,message:m,stage:s});
    f=s?funnelById(s.funnelId):null;}
  return out;}
/* every quick-pick token across the branches of ONE option — drives the classifier's quick row */
function quickKeysFor(mid){const out=[];branchesOf(mid).forEach(b=>(b.quickKeys||[]).forEach(k=>out.push({tok:String(k),branchId:b.id})));
  return out.sort((a,b)=>a.tok<b.tok?-1:(a.tok>b.tok?1:0));}
/* active options sitting in one stage, A/B alternates nested under their base */
function libByStage(sid){return library.filter(m=>m.stageId===sid&&m.isActive).sort((a,b)=>a.sortOrder-b.sortOrder);}
/* The composer's order: NEWEST option first. When you write a new campaign, its messages are the
   ones you're actually sending, so they belong at the top and the old ones stay reachable below.
   Families stay intact — an A/B alternate sorts with its base, never above it, or the pair reads
   as two unrelated options. sortOrder is monotonic (each new row takes MAX+1), so "highest base
   sortOrder first" IS newest-first. */
function libByStageNewestFirst(sid){
  const opts=libByStage(sid), byId={}; opts.forEach(m=>byId[m.id]=m);
  const rootKey=m=>{const base=(m.parentId!=null&&byId[m.parentId])?byId[m.parentId]:m;return base.sortOrder;};
  return opts.slice().sort((a,b)=>{
    const ra=rootKey(a), rb=rootKey(b);
    if(ra!==rb)return rb-ra;                                  // newer family first
    return (a.parentId!=null?1:0)-(b.parentId!=null?1:0)      // base above its own alternates
        || a.sortOrder-b.sortOrder;});}

const BANNED=["leverage","delve","comprehensive","game-changer","quietly","synergy","unlock","robust"];
/* Parse the editable blacklist string into literal ban words (quoted, no '*'/'…') for the mock
   reply strip, so editing the list in Settings visibly changes mock output. Mirrors reply_gen.parse_blacklist. */
function blLiterals(){
  const raw=settings.blacklist||"";
  const lits=[];
  raw.split(/\n/).forEach(line=>{line=line.trim();
    if(!line||line[0]!=='"')return;
    (line.match(/"([^"]+)"/g)||[]).forEach(m=>{const t=m.slice(1,-1).trim();
      if(t&&!/\.{3,}|…/.test(t)&&!t.includes("*"))lits.push(t);});});
  return lits.length?lits:BANNED;
}

   datetime ("2026-07-06T15:19:00") postedAt values — the old inline filter concatenated
   "T00:00:00" which turned real datetimes into an invalid date (NaN) and hid every post. */
function postDaysAgo(iso){const t=Date.parse(iso);return isNaN(t)?1e9:(Date.now()-t)/86400000;}
const FU_STALE_DAYS=5;   // DEFAULT wait, used for any stage that hasn't been given its own `waitDays`

/* ══ FOLLOW-UP READINESS ═════════════════════════════════════════════════════════════════════
   Each stage carries `waitDays`: how long to let a person sit after their last touch before that
   stage is due. It schedules NOTHING — no auto-send, no queue. Its whole job is to colour the
   pipeline card so "who has waited long enough?" is answerable by looking instead of by counting
   days on every card.

   Deliberately CALENDAR days, weekends and holidays included. Skipping them would mean the
   readiness colour disagreed with the "3d ago" stamp right next to it, and the tool would have to
   carry a holiday calendar to be right about it. A card that goes ready on a Saturday is simply a
   card the operator sends Monday.

   Returns null when readiness is meaningless — no next stage (graduated), already replied, exited,
   or never touched. Everything that colours or counts "due" goes through here, so the pipeline,
   the dashboard tile, the table column and the person modal can never drift apart. */
function dueInfo(p){
  if(!p||p.stage!=="intro_sent"||p.funnelExited||p.replyCount||!p.lastActivityAt)return null;
  const next=nextStageOf(p); if(!next)return null;
  const wait=(next.waitDays==null?FU_STALE_DAYS:next.waitDays);
  const days=daysSince(p.lastActivityAt);
  return {stage:next,wait:wait,days:days,ready:days>=wait,inDays:Math.max(0,wait-days)};
}
const isDue=p=>{const d=dueInfo(p);return !!d&&d.ready;};
const FEED_MAX_AGE_DAYS=4;   // Engage hard cap: posts older than this are dropped from the feed entirely (stale = not worth commenting)

/* Task queue (live: linkedin_tasks) — the operator's prioritized todos, surfaced on the Dashboard.
   Seeded here from state; the real build creates/closes rows on transitions + worker outcomes. */
const TASK_LABEL={record_loom:"Record a Loom intro", review_inbound:"Review an inbound reply",
  approve_fu:"Approve a follow-up", retry_send:"Retry a failed send", reapprove_reeligible:"Re-approve a re-eligible contact"};
let tasks=[], taskId=0;
const mkTask=(personId,type,priority)=>tasks.push({id:taskId++,personId,type,priority:priority||5,status:"open"});
people.filter(p=>p.stage==="accepted"&&p.tags.includes("in-intro-funnel")).slice(0,2).forEach(p=>mkTask(p.id,"record_loom",2));
people.filter(isDue).slice(0,3).forEach(p=>mkTask(p.id,"approve_fu",3));
convos.filter(c=>c.unreadCount>0).slice(0,2).forEach(c=>mkTask(c.personId,"review_inbound",1));
{const o=people.find(p=>p.overrideEligibility); if(o)mkTask(o.id,"reapprove_reeligible",4);}

/* "last touch" stamp: date + how many days ago, reddened once it goes stale (the operator's activity-visibility ask) */
/* The synced LinkedIn thread for a person, oldest → newest. This is the ONLY complete record of
   what actually went out: `p.sends` is built from event_log payloads, which only carry wording for
   sends made after send-logging shipped, so anything older has no body there. The chat is ground
   truth for both directions. */
function threadOf(p){const c=(typeof convos!=="undefined"&&convos||[]).find(x=>x.personId===p.id);
  return c&&c.msgs&&c.msgs.length?c.msgs:null;}
/* Hover the last-touch stamp to read the whole exchange — the "what did I actually send this person
   six weeks ago?" question the activity log can't answer (it only says "Follow-up 1"). */
/* Sends this tool has logged that the synced thread does not yet contain. event_log is written the
   moment a send succeeds; chat_messages only catches up on the next Unipile sync, so the mirror
   trails reality by up to one sync interval. Without this the hovercard renders a stale thread as
   though it were complete, and "not synced yet" looks exactly like "never sent". */
/* Identify a mirrored send by its BODY TEXT, never by its timestamp.
   The timestamp test that used to live here could not work: we stamp a send when LinkedIn's API
   ANSWERS, while LinkedIn stamps the same message when it ACCEPTED it — measured 1-24s earlier.
   So "newest logged send > newest mirrored message" was true forever on any thread whose last
   message is one of ours, and the banner never cleared no matter how many syncs ran. Audited
   2026-08-17: all 25 people showing the warning had the message sitting in the mirror already;
   zero were real. A warning that is permanently on is worse than none — it trains you to ignore
   the one case it exists to catch (a stale thread reading as "never sent", the near-miss that
   nearly sent an essay to 33 people twice).
   Body text is self-identifying and every logged send carries it (351/351 at the time of the fix).
   Each mirrored message is consumed at most once, so genuinely sending the same wording twice
   still reports the second one. */
const _normBody=s=>(s||"").replace(/\s+/g," ").trim().toLowerCase();
function unsyncedSends(p,msgs){
  const sends=(p.sends||[]).filter(s=>s.ts).sort((a,b)=>a.ts<b.ts?-1:1);
  if(!sends.length)return [];
  const mine=(msgs||[]).filter(m=>m.from==="me").map(m=>({k:_normBody(m.t),used:false}));
  /* fallback only, for a send with no wording recorded (rows predating send-logging). Compares on
     `ts` (normalised "YYYY-MM-DD HH:MM:SS"), never `at` — `at` is truncated to the day. */
  const newest=(msgs&&msgs.length)?msgs.map(m=>m.ts||"").sort().pop():"";
  const claim=b=>{
    let i=mine.findIndex(m=>!m.used&&m.k===b);
    /* LinkedIn re-wraps and trims some of what it stores, so a generous prefix compare gets the
       last word before we call a send missing */
    if(i<0)i=mine.findIndex(m=>!m.used&&m.k&&(m.k.startsWith(b.slice(0,120))||b.startsWith(m.k.slice(0,120))));
    if(i<0)return false;
    mine[i].used=true;return true;};
  return sends.filter(s=>{const b=_normBody(s.body);
    return b?!claim(b):s.ts>newest;});
}
/* An unmirrored send means two completely different things depending on its AGE, and one banner
   for both is how this warning started lying. Minutes old \u2192 ordinary sync lag, it really is
   delivered and the mirror simply has not refreshed. Still missing hours later \u2192 sync is not the
   explanation, and "already delivered" is a false reassurance. Julie Jensen (audit 2026-08-17)
   has two logged intros 7 minutes apart and exactly ONE message in LinkedIn: one of them never
   landed, and the old banner would have told you it had. Grace is 6h \u2014 12x the ~30min the mirror
   is ever legitimately behind. */
const SYNC_GRACE_MS=6*60*60*1000;
const _sendAgeMs=s=>{const d=Date.parse(((s&&s.ts)||"").replace(" ","T")+"Z");
  return isNaN(d)?0:Date.now()-d;};
function splitPending(pend){
  return {fresh:pend.filter(s=>_sendAgeMs(s)<=SYNC_GRACE_MS),
          stale:pend.filter(s=>_sendAgeMs(s)>SYNC_GRACE_MS)};
}
function threadPop(p){
  const msgs=threadOf(p);
  const sp=splitPending(unsyncedSends(p,msgs)), fresh=sp.fresh, stale=sp.stale;
  const lag=(fresh.length?`<div class="tlag">\u26a0 ${fresh.length} message${fresh.length===1?"":"s"} sent since the last
     sync${fresh.length===1?"":" (newest "+fmtDate(fresh[fresh.length-1].at)+")"} \u2014 already delivered, not yet mirrored below.</div>`:"")
   +(stale.length?`<div class="tlag tmiss">\u26a0 ${stale.length} message${stale.length===1?"":"s"} logged as sent${
     stale.length===1?" on "+fmtDate(stale[0].at):" (newest "+fmtDate(stale[stale.length-1].at)+")"
     } never turned up in this thread. Too old to be sync lag, so check LinkedIn before you send it again.</div>`:"");
  if(!msgs)return `<div class="thrpop"><div class="thh">Message history</div>${lag}
    <div class="tnone">No synced conversation yet. LinkedIn threads arrive on the next sync.</div></div>`;
  const rows=msgs.map(m=>`<div class="tm ${m.from==="me"?"me":"them"}">
    <span class="tw">${m.from==="me"?"You":esc(p.fn||p.name)} · ${fmtDate(m.at)}</span>${esc(m.t)}</div>`).join("");
  const nOut=msgs.filter(m=>m.from==="me").length, nIn=msgs.length-nOut;
  return `<div class="thrpop" onclick="event.stopPropagation()">
    <div class="thh">Message history · ${nOut} sent · ${nIn} received</div>${lag}${rows}</div>`;
}
function lastTouchStamp(p){const iso=p.lastActivityAt;if(!iso)return"";const n=daysSince(iso);
  const d=dueInfo(p);
  const sp=splitPending(unsyncedSends(p,threadOf(p)));
  const has=!!threadOf(p), lag=sp.fresh.length+sp.stale.length, miss=sp.stale.length;
  /* The stamp says how long it has been; the tag says whether that is long ENOUGH. The tag is the
     only thing that knows the stage's own wait, so its tooltip always names it — a bare "ready"
     invites "ready by whose count?" the first time a wait gets edited. */
  const tag=!d?"":d.ready
    ?` <span class="duetag ready" title="${attrEsc(d.stage.label)} waits ${d.wait}d after the previous touch — that has passed">▶ ready</span>`
    :` <span class="duetag wait" title="${attrEsc(d.stage.label)} waits ${d.wait}d after the previous touch">in ${d.inDays}d</span>`;
  return `<div class="miniinfo${d&&d.ready?' isready':''}"><span class="thr" title="${
    miss?miss+' message'+(miss===1?'':'s')+' logged as sent but missing from this thread. Hover for detail'
    :lag?lag+' message'+(lag===1?'':'s')+' sent since the last sync \u2014 hover for detail'
    :(has?'Hover to read the full exchange':'No synced thread yet')}"
    >Last touch: ${fmtDate(iso)} · ${n<=0?'today':n+'d ago'}${has?' 💬':''}${
    miss?'<span class="lagdot missdot" title="logged as sent but never appeared in the thread">\u25cf</span>'
    :lag?'<span class="lagdot" title="newer sends not yet mirrored">\u25cf</span>':''}${threadPop(p)}</span>${tag}</div>`;}
/* Flip the hovercard up/left when it would run off the viewport, then clamp it to the room
   actually available so it can never be cut off by the window edge.
   This used to hard-code 336x330 — the size of the ORIGINAL .thrpop. The comment hovercard
   (.cmtpop) is 520 wide and up to 62vh tall, so those constants silently stopped flipping it
   (2026-07-22). Measure the popup instead: one rule now fits every .thrpop variant, and any
   future one, without another magic number. Measuring needs display:block (a display:none
   element has zero size), so it is shown invisibly for one frame and restored immediately —
   the CSS :hover rule is what actually reveals it. */
document.addEventListener("mouseover",e=>{
  const t=e.target.closest&&e.target.closest(".thr");if(!t)return;
  const pop=t.querySelector(".thrpop");if(!pop)return;
  pop.classList.remove("up","rt");
  const prev=pop.style.cssText;
  pop.style.maxHeight="";pop.style.display="block";pop.style.visibility="hidden";
  const ph=pop.offsetHeight,pw=pop.offsetWidth;
  pop.style.cssText=prev;
  const r=t.getBoundingClientRect();
  const below=window.innerHeight-r.bottom-12, above=r.top-12;
  if(ph>below&&above>below)pop.classList.add("up");
  if(r.left+pw>window.innerWidth-8)pop.classList.add("rt");
  const room=pop.classList.contains("up")?above:below;
  if(ph>room)pop.style.maxHeight=Math.max(180,room)+"px";   // scrolls within whatever fits
});

/* ---- per-card funnel actions ------------------------------------------------------------------
   EXIT: the conversation became real, so stop automating it. Reuses the classify-reply 'exit' path
   (drops in-intro-funnel, sets funnel_exited) rather than inventing a second way to leave. */
function exitFunnel(id){const p=personById(id);if(!p)return;
  if(!confirm('Take '+p.fn+' out of the funnel?\n\nThey stop receiving automated touches and stay a regular connection. Their history is kept.'))return;
  snapshot("exit funnel");
  p.funnelExited=true;p.replyClass=p.replyClass||"conversation";
  p.tags=p.tags.filter(t=>t!=="in-intro-funnel");p.replyClassifiedAt=TODAY;
  persist("/api/person/"+id+"/classify-reply",{action:"exit",replyClass:"conversation"});
  toast(esc(p.fn)+" exited the funnel","ok");render();}
/* UNEXIT: the mirror of exitFunnel, for the accidental click. The stage endpoint already clears
   funnel_exited and restores the membership tag, so re-assert their CURRENT position and let it. */
function unexitFunnel(id){const p=personById(id);if(!p)return;
  snapshot("return to funnel");
  p.funnelExited=false;if(!p.tags.includes("in-intro-funnel"))p.tags.push("in-intro-funnel");
  persist("/api/person/"+id+"/stage",{funnelId:(p.funnelId||rootFunnel().id),fuStep:(p.fuStep==null?-1:p.fuStep)});
  toast(esc(p.fn)+" is back in the funnel","ok");render();}
/* PROMOTE: the positive way out. Exit and Promote both stop the drip, but a dead lead and a live
   opportunity should never look the same afterwards — promoting routes them to the Follow-up tab
   with a due date, so a good conversation can't quietly evaporate into the exited pile. */
function promotePerson(id){const p=personById(id);if(!p)return;
  const due=prompt("Follow up with "+p.fn+" on… (YYYY-MM-DD, or leave blank for no date)","");
  if(due===null)return;
  const d=(due||"").trim();
  if(d&&!/^\d{4}-\d{2}-\d{2}$/.test(d)){toast("Date must look like 2026-08-01","warn");return;}
  snapshot("promote to follow-up");
  p.funnelExited=true;p.exitReason="promoted";p.replyClass=p.replyClass||"conversation";
  p.tags=p.tags.filter(t=>t!=="in-intro-funnel");
  followUps=followUps.filter(f=>f.personId!==id);
  followUps.unshift({personId:id,addedAt:TODAY,dueAt:d||null,notes:"",closedAt:null,outcome:""});
  persist("/api/person/"+id+"/promote",{dueAt:d||null,notes:""});
  toast(esc(p.fn)+" \u2192 Follow-up","ok");render();}
/* MOVE: put someone at a different stage WITHOUT sending anything. Needed because people who were
   worked before the funnel settled are out of sequence — the step recorded against them may not be
   the message they actually last received. */
function moveStage(id,val){const p=personById(id);if(!p||!val)return;
  const [fid,ix]=val.split(":").map(Number);
  const st=stagesOf(fid)[ix]||null, f=funnelById(fid);
  snapshot("move to stage");
  p.funnelId=fid;p.fuStep=ix;p.funnelExited=false;p.exitReason=null;
  /* `stage` has to move with `fu_step`. The first column filters on stage==='accepted' while every
     other column filters on fu_step, so changing only fu_step leaves someone matching their OLD
     column's test and the card visibly doesn't move. Mirrors the same rule in /api/person/<id>/stage. */
  if(f&&f.isRoot&&(p.stage==="accepted"||p.stage==="intro_sent"))p.stage=ix<0?"accepted":"intro_sent";
  if(!p.tags.includes("in-intro-funnel"))p.tags.push("in-intro-funnel");
  persist("/api/person/"+id+"/stage",{funnelId:fid,fuStep:ix});
  toast(esc(p.fn)+" → "+(ix<0?"start of "+(f?f.label:"funnel"):(st?st.label:"stage")+" sent"),"ok");render();}
/* options = every stage of every funnel, valued as "<funnelId>:<lastStageIndexSent>". Index -1 means
   "nothing sent in this funnel yet", which is how a just-diverted person sits. */
function stageMoveOptions(p){
  const cur=(p.funnelId||rootFunnel().id), ix=(p.fuStep==null?-1:p.fuStep);
  return funnels.map(f=>{const ss=stagesOf(f.id);if(!ss.length)return"";
    const opts=[`<option value="${f.id}:-1" ${f.id===cur&&ix<0?'selected':''}>— nothing sent yet</option>`]
      .concat(ss.map((s,i)=>`<option value="${f.id}:${i}" ${f.id===cur&&i===ix?'selected':''}>${esc(s.label)} sent</option>`));
    return `<optgroup label="${attrEsc(f.isRoot?f.label:"🌿 "+f.label)}">${opts.join("")}</optgroup>`;
  }).join("");
}

/* posts worth your attention: not engaged/dismissed, not low-value, author not muted */
function engageablePosts(){return posts.filter(p=>p.state==="none"&&!p.lowValue&&!personById(p.authorId).isMuted);}

function toast(msg,kind){const t=document.createElement("div");t.className="to "+(kind||"");t.textContent=msg;$("toast").appendChild(t);setTimeout(()=>t.remove(),2600);}

/* ---- global UNDO (Ctrl+Z) — snapshot mutable state before any action ---- */
let _undo=[];
function snapshot(label){_undo.push({label,data:JSON.stringify({people,library,funnels,stages,branches,series,posts,convos,invitations,syncState,tasks,settings,voiceRevisions})});if(_undo.length>50)_undo.shift();updateUndoBtn();}
function undo(){if(!_undo.length){toast("Nothing to undo");return;}const s=_undo.pop();const d=JSON.parse(s.data);
  people=d.people;library=d.library;posts=d.posts;convos=d.convos;settings=d.settings;
  if(d.invitations)invitations=d.invitations; if(d.syncState)syncState=d.syncState; if(d.tasks)tasks=d.tasks;
  if(d.voiceRevisions)voiceRevisions=d.voiceRevisions;
  if(d.funnels)funnels=d.funnels; if(d.stages)stages=d.stages; if(d.branches)branches=d.branches;
  if(d.series)series=d.series;

function updateUndoBtn(){const b=$("undoBtn");if(b){b.disabled=!_undo.length;b.title=_undo.length?("Undo: "+_undo[_undo.length-1].label+" (Ctrl+Z)"):"Nothing to undo";}}
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){
    const t=e.target.tagName;if(t==="INPUT"||t==="TEXTAREA")return;  // don't hijack native text-undo

/* CONN_COLS reordered by ST.connOrder; keys not in connOrder keep their default position at the end
   (so a newly-added column still shows). person stays pinned first. */
function orderedCols(){
  const byKey=Object.fromEntries(CONN_COLS.map(c=>[c[0],c]));
  const seen=new Set(), out=[];
  (ST.connOrder||[]).forEach(k=>{if(byKey[k]&&!seen.has(k)){seen.add(k);out.push(byKey[k]);}});
  CONN_COLS.forEach(c=>{if(!seen.has(c[0]))out.push(c);});
  // keep 'person' first
  out.sort((a,b)=>(a[0]==="person"?-1:b[0]==="person"?1:0));
  return out;
}

const TABS=[["dash","Dashboard"],["prospects","Prospects"],["pipeline","Pipeline"],["followup","Follow-up"],["engage","Engage"],

/* Per-key badge DATA, reused by the floating top-nav badges and the inline menu badges. */
function _badges(k){
  const out=[]; let due=false;
  /* Two badges, not one total: "warming" is a queue you feed, "request sent" is people you're
     waiting on. A single 305 hid 263 unanswered invites inside a number that reads as pipeline. */
  if(k==="prospects"){const w=people.filter(p=>p.stage==="warming").length;
    const s=people.filter(p=>p.stage==="request_sent").length, st=staleRequests().length;
    out.push({t:w,title:`${w} warming up — no connection request sent to them yet`});
    if(s)out.push({t:s,due:!!st,title:`${s} connection request${s!==1?'s':''} sent and unanswered`
      +(st?` · ${st} for ${+settings.withdraw_after_days||30}+ days`:"")});
    if(st)due=true;}
  else if(k==="pipeline"){const n=people.filter(inPipelineNow).length;const acc=people.filter(p=>p.stage==="accepted"&&inPipelineNow(p)).length;out.push({t:n,due:!!acc,title:`${n} in the pipeline${acc?" \u00b7 "+acc+" awaiting an intro":""}`});if(acc)due=true;}
  else if(k==="followup"){const open=followUps.filter(f=>!f.closedAt);const d=open.filter(f=>f.dueAt&&f.dueAt<=TODAY).length;out.push({t:open.length,due:!!d,title:`${open.length} open \u00b7 ${d} due now`});if(d)due=true;}
  else if(k==="engage"){const n=engageablePosts().length;out.push({t:n});}
  else if(k==="campaigns"){const n=msgQueue.filter(m=>m.status==="pending").length;out.push({t:n,due:!!n,title:`${n} messages awaiting approval`});if(n)due=true;}
  else if(k==="connections"){const n=people.filter(p=>["accepted","intro_sent"].includes(p.stage)).length;const un=(window.__META&&window.__META.untaggedNew)||0;out.push({t:n});if(un){out.push({t:un,due:true,title:`${un} new connection${un!==1?'s':''} since ${(settings.untagged_watch_since||'').slice(0,10)} still need tagging`});due=true;}}
  else if(k==="invitations"){const n=invitations.filter(v=>v.direction==="received"&&v.status==="pending").length;out.push({t:n,due:!!n,title:`${n} incoming invitations`});if(n)due=true;}
  else if(k==="messages"){const n=convos.reduce((s,c)=>s+(c.archived?0:c.unreadCount),0);out.push({t:n,due:!!n});if(n)due=true;}

}
function _tc(k,cls){return _badges(k).items.map(b=>`<span class="${cls}${b.due?" due":""}"${b.title?` title="${b.title}"`:""}>${b.t}</span>`).join("");}
/* Top nav: Dashboard \u00b7 Prospects \u00b7 Pipeline\u25be(Contact Pipeline / Message Funnel) \u00b7 Engage \u00b7

   they still own the full view list; this only changes how the nav is laid out. */
function renderTabs(){

  const mi=(k,l)=>`<div class="mi${ST.tab===k?" active":""}" onclick="event.stopPropagation();go('${k}')"><span>${l}</span>${_tc(k,"mtc")}</div>`;

/* ============================ FOLLOW-UP ============================ */
/* The people worth chasing personally. They got here by Promote, which is the deliberate opposite
   of Exit: the funnel worked, so it stops and a human takes over. Everything here is hand-managed
   — a due date and free notes — because the whole point is that automation is done with them. */
function fuRow(f){
  const p=personById(f.personId);if(!p)return "";
  const overdue=f.dueAt&&f.dueAt<=TODAY&&!f.closedAt;
  const conv=(typeof convos!=="undefined"&&convos||[]).find(c=>c.personId===p.id);
  const lastAt=(conv&&conv.msgs&&conv.msgs.length)?conv.msgs[conv.msgs.length-1].at:p.lastActivityAt;
  const hasThread=!!threadOf(p);
  return `<div class="furow${f.closedAt?" done":""}${overdue?" due":""}">
    <div class="fu-who" onclick="openPerson(${p.id})">
      ${avatar(p)}
      <div style="min-width:0">
        <div class="fu-nm">${starGlyph(p)}${esc(p.name)}</div>
        <div class="fu-hl">${esc(p.headline||p.title||"")}</div>
      </div>
    </div>
    <div class="fu-when">
      <div class="fu-lbl">Last exchange</div>
      <div>${lastAt
        ? `<span class="thr" title="${hasThread?'Hover to read the full exchange':'No synced thread yet'}">${fmtDate(lastAt)} \u00b7 ${daysSince(lastAt)}d ago${hasThread?' \ud83d\udcac':''}${threadPop(p)}</span>`
        : '<span class="muted">\u2014</span>'}</div>
    </div>
    <div class="fu-when">
      <div class="fu-lbl">Follow up on</div>
      <input type="date" class="fu-date" value="${f.dueAt||''}"
        onchange="setFollowUpDue(${p.id},this.value)" title="When you want to come back to this">
      ${overdue?'<span class="pill p-amb" style="margin-top:4px;display:inline-block">\u26a0 due</span>':''}
    </div>
    <textarea class="fu-notes" rows="2" placeholder="What you agreed, what to send, where it stands\u2026"
      onchange="setFollowUpNotes(${p.id},this.value)">${esc(f.notes||"")}</textarea>
    <div class="fu-acts">
      ${f.closedAt
        ? `<span class="pill p-gray" title="Closed ${attrEsc(f.closedAt)}">\u2713 done</span>
           <button class="btn ghost sm" onclick="reopenFollowUp(${p.id})">Reopen</button>`
        : `<button class="btn grn ghost sm" onclick="closeFollowUp(${p.id})" title="Handled \u2014 archive it (nothing is deleted)">\u2713 Done</button>
           <button class="btn ghost sm" onclick="backToFunnel(${p.id})" title="Put them back on the automated drip">\u21a9 Funnel</button>`}
    </div>
  </div>`;
}
function renderFollowUp(){
  const open=followUps.filter(f=>!f.closedAt&&personById(f.personId));
  const done=followUps.filter(f=>f.closedAt&&personById(f.personId));

/* Back onto the drip: reuses the stage endpoint, which already clears funnel_exited and restores
   the membership tag. The follow-up row is closed rather than deleted \u2014 the conversation
   still happened. */
function backToFunnel(id){const p=personById(id),f=_fu(id);if(!p)return;
  if(!confirm("Put "+p.fn+" back on the automated funnel?\n\nThey resume from where they left off and the follow-up is marked done."))return;

  return `<div class="qbanner${empty?" empty":""}">

}

/* ============================ PROSPECTS (pre-connection funnel) ============================ */
/* ---- prospect status ------------------------------------------------------------------------
   "Prospects" is TWO populations with nothing in common operationally: people we haven't contacted
   at all (warming), and people we HAVE asked and who haven't answered (request sent). One number
   covering both hides the second group entirely — you can't tell a queue that's filling from a pile
   of invites nobody is accepting. Every prospect surface states which of the two it is. */
function prospectStatus(p){
  const soak=settings.funnel_soak_business_days;
  if(p.stage==="warming"){
    if(!p.resolved)return{cls:"p-gray",txt:"🔍 resolving profile",
      tip:"Looking up their LinkedIn profile. No request can be sent until this lands."};
    const bd=bizDaysSince(p.addedAt), left=soak-bd;
    return left>0
      ? {cls:"p-amb",txt:"🌱 warming up · "+left+" biz day"+(left!==1?"s":"")+" to go",
         tip:"No connection request has been sent. They season "+soak+" business days first."}
      : {cls:"p-grn",txt:"🌱 warmed · ready to send",
         tip:"Soak cleared. No request sent yet — the auto-sender can pick them up, or send now."};
  }
  if(p.stage==="request_sent"){
    const d=daysSince(p.requestSentAt), cut=+settings.withdraw_after_days||30;
    return d>=cut
      ? {cls:"p-red",txt:"📨 no answer · "+d+"d",
         tip:"Connection request sent "+d+" days ago and still unanswered — past your "+cut+"-day mark."}
      : {cls:"p-acc",txt:"📨 awaiting accept · "+d+"d",
         tip:"Connection request sent "+d+" day"+(d!==1?"s":"")+" ago. Nothing more goes out until they accept."};
  }
  return{cls:"p-gray",txt:p.stage,tip:""};
}
function statusPill(p){const s=prospectStatus(p);
  return `<span class="pill ${s.cls}" title="${attrEsc(s.tip)}">${esc(s.txt)}</span>`;}
/* Invites out longer than the withdraw threshold. The threshold is a SETTING ONLY — see the
   Invitations tab note; nothing withdraws them automatically. */
function staleRequests(){const cut=+settings.withdraw_after_days||30;
  return people.filter(p=>p.stage==="request_sent"&&p.requestSentAt&&daysSince(p.requestSentAt)>=cut);}

  const stale=staleRequests(), cut=+settings.withdraw_after_days||30;
  const resolving=warming.filter(p=>!p.resolved);
  /* on-deck = warming people, OLDEST added_at first (mirrors funnel_send _eligible_ranked): the

  /* Removed prospects leave the queue entirely — they are listed in their own card below so a

  const dropped=warming.filter(p=>p.queueDropped&&!p.withdrawn);

  const withdrawn=[...warming].filter(p=>p.withdrawn)

  const onDeck=[...warming].filter(p=>!p.queueDropped&&!p.withdrawn).sort((a,b)=>a.addedAt.localeCompare(b.addedAt));

  /* automated profile-view warm-up summary (live: prospects.view_*) */
  const funnelPeople=[...warming,...sent];
  const autoViewedCount=funnelPeople.filter(p=>(p.viewCount||0)>0).length;
  const totalAutoViews=funnelPeople.reduce((s,p)=>s+(p.viewCount||0),0);
  const enrolledViews=funnelPeople.filter(p=>p.viewState==="enrolled").length;

  $("v-prospects").innerHTML=`
  <div class="pagehead"><div class="pht">
