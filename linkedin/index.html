/* tri-state tag filter chip: off → include (has it) → exclude (does NOT have it) → off */
function cycleTagFilter(t){
  if(ST.connTagInc.has(t)){ST.connTagInc.delete(t);ST.connTagExc.add(t);}
  else if(ST.connTagExc.has(t)){ST.connTagExc.delete(t);}
  else{ST.connTagInc.add(t);}
  renderConnections();}
function clearConnFilters(){ST.connStage="";ST.connFu="";ST.connTag="";ST.connTagInc.clear();ST.connTagExc.clear();ST.connResearch="";ST.connQ="";renderConnections();}
function toggleConnCols(e){e.stopPropagation();ST.connColPanel=!ST.connColPanel;renderConnections();
  if(ST.connColPanel)setTimeout(()=>document.addEventListener("click",closeConnCols),0);}
function closeConnCols(e){if(e&&e.target.closest&&e.target.closest("#connColPanel"))return;
  ST.connColPanel=false;document.removeEventListener("click",closeConnCols);if(ST.tab==="connections")renderConnections();}
function toggleConnCol(k){if(ST.connHidden.has(k))ST.connHidden.delete(k);else ST.connHidden.add(k);saveConnPrefs();renderConnections();}
/* Reorder a column from the Columns panel (▲ earlier / ▼ later). 'person' stays pinned first.
   Reorders across ALL columns (visible + hidden) so the panel list order == the table order. */
function moveConnCol(k,dir){let order=orderedCols().map(c=>c[0]).filter(x=>x!=="person");
  const i=order.indexOf(k);if(i<0)return;const j=i+dir;if(j<0||j>=order.length)return;
  order.splice(i,1);order.splice(j,0,k);
  ST.connOrder=["person",...order];saveConnPrefs();ST.connViewName="";renderConnections();}
/* ---- column drag-reorder (HTML5 DnD on the header cells) ---- */
let _connDrag=null;
function connDragStart(e,k){_connDrag=k;e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",k);}catch(_){}}
function connDragOver(e){e.preventDefault();e.dataTransfer.dropEffect="move";}
function connDragEnd(){_connDrag=null;}
function connDrop(e,target){e.preventDefault();const from=_connDrag;_connDrag=null;
  if(!from||from===target||target==="person")return;
  // materialize the current visible+full order, move `from` to just before `target`, persist
  let order=orderedCols().map(c=>c[0]).filter(k=>k!=="person");
  order=order.filter(k=>k!==from);
  const ti=order.indexOf(target);order.splice(ti<0?order.length:ti,0,from);
  ST.connOrder=["person",...order];saveConnPrefs();ST.connViewName="";renderConnections();}
/* ---- saved views (named column order + visibility + widths) ---- */
function toggleConnViews(e){e.stopPropagation();ST.connViewPanel=!ST.connViewPanel;ST.connColPanel=false;renderConnections();
  if(ST.connViewPanel)setTimeout(()=>document.addEventListener("click",closeConnViews),0);}
function closeConnViews(e){if(e&&e.target.closest&&e.target.closest("#connViewPanel"))return;
  ST.connViewPanel=false;document.removeEventListener("click",closeConnViews);if(ST.tab==="connections")renderConnections();}
function saveConnView(){const n=(prompt("Name this view (columns, order, widths):",ST.connViewName||"My view")||"").trim();if(!n)return;
  ST.connViews[n]={order:orderedCols().map(c=>c[0]),hidden:[...ST.connHidden],w:{...ST.connW}};
  ST.connViewName=n;saveConnViews();toast("Saved view “"+n+"”","ok");renderConnections();}
function applyConnView(n){const v=ST.connViews[n];if(!v)return;
  ST.connOrder=v.order||[];ST.connHidden=new Set(v.hidden||[]);ST.connW={...(v.w||{})};ST.connViewName=n;
  saveConnPrefs();ST.connViewPanel=false;toast("View “"+n+"”","ok");renderConnections();}
function deleteConnView(n){if(!ST.connViews[n])return;delete ST.connViews[n];if(ST.connViewName===n)ST.connViewName="";
  saveConnViews();renderConnections();}
function resetConnView(){ST.connOrder=[];ST.connHidden=new Set();ST.connW={};ST.connViewName="";
  saveConnPrefs();toast("Columns reset to default");renderConnections();}
function connRszStart(e,key){e.preventDefault();e.stopPropagation();
  const th=e.target.closest("th");const startX=e.clientX, startW=th.offsetWidth;
  document.body.classList.add("resizing");
  const move=ev=>{const w=Math.max(60,startW+(ev.clientX-startX));ST.connW[key]=w;th.style.width=w+"px";};
  const up=()=>{document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);
    document.body.classList.remove("resizing");saveConnPrefs();};
  document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);}
/* An EXPLICIT "Sort by" control, not only click-the-header. Sorting by connection date was already
   possible — click the Connected column — but a sortable header is invisible until you happen to try
   it, and the answer to "how do I see my newest connections?" should not be a discovery. Mirrors
   LinkedIn's own "Sort by: Recently added" affordance, which is where the expectation comes from.

   Reads and writes the SAME ST.connSort the headers use, so the dropdown, the header arrow and the
   rows can never disagree — the picker just names the combinations worth having. */
const CONN_SORTS=[
  ["connectedAt:-1","Recently connected"],
  ["connectedAt:1","Longest connected"],
  ["score:-1","Score — highest first"],
  ["lastTouch:-1","Last touch — most recent"],
  ["lastTouch:1","Last touch — longest ago"],
  ["person:1","Name A–Z"],
  ["person:-1","Name Z–A"],
  ["replies:-1","Most replies"],
  ["pipeline:-1","In the pipeline first"],
];
function connSortPicker(){
  const cur=ST.connSort.field+":"+ST.connSort.dir;
  /* A sort the picker doesn't list (any other header click) shows as "Custom" rather than silently
     mislabelling itself as whatever sits first in the list. */
  const known=CONN_SORTS.some(([v])=>v===cur);
  return `<select onchange="setConnSort(this.value)" title="Sort the list. Clicking any column header does the same thing.">
    ${known?'':`<option value="${esc(cur)}" selected>Custom (${esc(colLabel(ST.connSort.field))} ${ST.connSort.dir>0?'▲':'▼'})</option>`}
    ${CONN_SORTS.map(([v,l])=>`<option value="${v}" ${v===cur?'selected':''}>Sort: ${l}</option>`).join("")}
  </select>`;}
function colLabel(k){const c=CONN_COLS.find(x=>x[0]===k);return c?c[1]:k;}
function setConnSort(v){const [f,d]=v.split(":");ST.connSort={field:f,dir:+d};renderConnections();}
/* First click on a column sorts the way that column is USEFUL, not always ascending. Clicking
   "Connected" and getting 2016 first reads as "my recent connections aren't here" — which is exactly
   the conclusion it produced. Dates and counts start high/newest; names and labels start A-Z. */
const CONN_SORT_DESC_FIRST=new Set(["connectedAt","lastTouch","score","replies","fu","pipeline","eligible"]);
function sortConn(f){if(ST.connSort.field===f)ST.connSort.dir*=-1;
  else ST.connSort={field:f,dir:CONN_SORT_DESC_FIRST.has(f)?-1:1};renderConnections();}
function toggleSel(id){if(ST.sel.has(id))ST.sel.delete(id);else ST.sel.add(id);render();}
function toggleAll(box,ids){if(box.checked)ids.forEach(i=>ST.sel.add(i));else ids.forEach(i=>ST.sel.delete(i));render();}
function renderBulk(){if(!ST.sel.size)return"";
  const tagBtns=PRIMARY_QUICK_TAGS.map(t=>`<button class="btn sm bulktag${tagBlock(t)?' blk':''}" onclick="bulkTag('${t}','add')" title="Add '${t}' to all ${ST.sel.size} selected">${tagBlock(t)?'⛔':'＋'} ${t}</button>`).join("");
  /* Count the ones this would actually move, so the button never promises work it won't do. */
  const addable=[...ST.sel].map(personById).filter(p=>p&&pipelineAddable(p)).length;
  return `<div class="bulk"><b>${ST.sel.size}</b> selected
  ${addable?`<button class="btn accent sm" onclick="addToPipeline([...ST.sel])"
    title="Put ${addable} of the ${ST.sel.size} selected on the Pipeline board owing an intro. Sends nothing.">＋ Add ${addable} to pipeline</button>
  <span class="bulksep"></span>`:''}
  <span class="bulklbl">Tag all →</span> ${tagBtns}
  <span class="bulksep"></span>
  <button class="btn teal sm" onclick="bulkStar()" title="Mark all selected preferred">★ Prefer</button>
  <button class="btn sm" onclick="bulkPrincipal()" title="Mark all selected as agency principals">🛡 Principal</button>
  <button class="btn gray sm" onclick="ST.sel.clear();render()">Clear</button>
  <span class="x" onclick="ST.sel.clear();render()">×</span></div>`;}
/* Bulk actions apply to every selected connection AND persist server-side (one request), then clear
   the selection. Local state is updated in lockstep so the rows reflect it immediately. */
function bulkTag(t,action){const ids=[...ST.sel];if(!ids.length)return;snapshot("bulk "+action+" tag");
  ids.forEach(id=>{const p=personById(id);if(action==="add"){if(!p.tags.includes(t))p.tags.push(t);}else p.tags=p.tags.filter(x=>x!==t);});
  if(window.__LIVE)api("/api/people/bulk-tag",{ids,tag:t,action});
  toast((action==="add"?"Tagged ":"Untagged ")+ids.length+" · "+t,"ok");ST.sel.clear();render();}
function bulkStar(){const ids=[...ST.sel];if(!ids.length)return;snapshot("bulk prefer");
  ids.forEach(id=>personById(id).isStarred=true);
  if(window.__LIVE)api("/api/people/bulk-field",{ids,field:"isStarred",value:true});
  toast(ids.length+" marked preferred","ok");ST.sel.clear();render();}
function bulkPrincipal(){const ids=[...ST.sel];if(!ids.length)return;snapshot("bulk principal");
  ids.forEach(id=>{const p=personById(id);p.isPrincipal=true;p.isPrincipalSource="operator";});
  if(window.__LIVE)api("/api/people/bulk-field",{ids,field:"isPrincipal",value:true});
  toast(ids.length+" marked principal","ok");ST.sel.clear();render();}

/* ============================ INTRO LIBRARY (A/B) ============================ */
/* ══ MESSAGE LIBRARY BOARD ═══════════════════════════════════════════════════════════════
   Renders ONE funnel at a time (ST.libFunnel; defaults to the root/baseline). Columns are that
   funnel's stages; cards are the options in each stage; a branch is a chip inside the card of the
   message that spawned it. Clicking a branch drills into ITS funnel — same screen, deeper path. */
function renderLibrary(){
  const fid=(funnelById(ST.libFunnel)?ST.libFunnel:rootFunnel().id);
  ST.libFunnel=fid;
  const f=funnelById(fid), ss=stagesOf(fid), archN=library.filter(m=>!m.isActive).length;
  const best={}; ss.forEach(st=>{best[st.id]=Math.max(...libByStage(st.id).map(replyPct),0);});
  const cols=ss.map(st=>{
    const msgs=library.filter(m=>m.stageId===st.id&&(ST.libShowArchived||m.isActive))
      .sort((a,b)=>b.sortOrder-a.sortOrder);   /* newest option at the top of the column, same order the composer serves */
    const roots=msgs.filter(m=>!m.parentId), rootIds=new Set(roots.map(m=>m.id));
    const cards=roots.map(m=>optCard(m,best[st.id])+msgs.filter(x=>x.parentId===m.id).map(a=>optCard(a,best[st.id],true)).join("")).join("")
      /* an alternate whose base moved stage still has to render somewhere */
      +msgs.filter(m=>m.parentId&&!rootIds.has(m.parentId)).map(m=>optCard(m,best[st.id],true)).join("");
    return `<div class="stagecol">
      <div class="sh"><b>${esc(st.label)}</b><span class="n">stage ${st.sortOrder}</span>
        <span class="sx" title="Rename, set the wait, or delete this stage" onclick="stageMenu(${st.id},event)">⋯</span></div>
      ${st.sortOrder===0?`<div class="swait none" title="Stage 0 is the intro — there is no previous touch to wait after">first touch</div>`
        :`<div class="swait${st.waitDays==null?' dflt':''}" onclick="setStageWait(${st.id})"
           title="Wait this long after the previous touch before this stage counts as ready. Informational only — nothing is scheduled or auto-sent.">⏱ wait ${
           st.waitDays==null?FU_STALE_DAYS+'d (default)':st.waitDays+'d'} <span class="ed">edit</span></div>`}
      ${cards}
      <button class="addmsg" onclick="newMsg(${st.id})" title="A new message option at the ${attrEsc(st.label)} stage">＋ Add option</button>
    </div>`;}).join("");
  const path=funnelPath(fid);
  const crumb=`<div class="crumb"><a onclick="openFunnel(${rootFunnel().id})">${esc(rootFunnel().label)} funnel</a>${
    path.map((h,i)=>` › <a onclick="openFunnel(${h.stage?h.stage.funnelId:rootFunnel().id})">${esc(h.stage?h.stage.label:'?')} · ${esc(h.message?h.message.code:'?')}</a>${
      i===path.length-1?` › <span class="cur">🌿 ${esc(h.branch.label)}</span>`:` › <a onclick="openFunnel(${h.funnel.id})">🌿 ${esc(h.branch.label)}</a>`}`).join("")}</div>`;
  $("v-intro").innerHTML=`
  <div class="pagehead"><div class="pht">
    <h1>Message Funnel
      ${(archN||ST.libShowArchived)?`<button class="btn ghost sm" style="float:right;font-weight:600" onclick="ST.libShowArchived=!ST.libShowArchived;renderLibrary()">${ST.libShowArchived?'Hide archived':'View archived'+(archN?' ('+archN+')':'')}</button>`:''}
    </h1>
    <p class="lede">${f.isRoot
      ? `Your <b>baseline funnel</b> — what everyone gets until a reply diverts them. Each <b>column is a stage</b>
         (add as many follow-ups as you need); each card is an <b>option</b> you might send at that stage.
         A <b>branch</b> lives inside the card of the message that asked the question — because that's the only
         place it means anything — and answering one moves the person into that branch's <b>own funnel</b>.`
      : `You're inside the <b>${esc(f.label)}</b> branch. These are its own stages — someone who answers this way
         leaves the parent drip for good, so they never see the parent's remaining stages.`}${
      ST.libShowArchived?' <b>Showing archived messages.</b>':''}</p>
  </div></div>
  ${crumb}
  ${seriesLegend()}
  <div class="libwrap"><div class="board" data-tut="lib-grid">${cols}
    <div class="stagecol addcol" onclick="addStage(${fid})" title="Add another stage to this funnel">＋ Add stage<br><span style="font-size:11px">(another follow-up)</span></div>
  </div></div>`;
}
/* ── CAMPAIGN LEGEND / FILTER ────────────────────────────────────────────────────────────────
   Reading a colour off a card only works if something on screen says what the colour means, so the
   legend is not decoration — it is the key. Clicking a campaign dims everything that isn't it, so
   "show me just the new campaign, all the way down the funnel" is one click. It is a VIEW filter:
   nothing is hidden from the composer and nothing about sending changes. */
function seriesLegend(){
  const off=ST.libSeriesHidden=ST.libSeriesHidden||{};
  const unassigned=library.filter(m=>m.isActive&&m.seriesId==null).length;
  const chips=series.map(s=>`<span class="schip sc-${esc(s.color||'indigo')}${off[s.id]?' off':''}"
      onclick="toggleSeriesFilter(${s.id})"
      title="${attrEsc(s.label)}${s.note?' — '+attrEsc(s.note):''} · click to dim the rest">${esc(s.label)}
      <span class="sx" onclick="event.stopPropagation();editSeries(${s.id})" title="Rename, recolour or remove this campaign">⋯</span></span>`).join("");
  return `<div class="serbar">
    <span class="sl">Campaigns</span>
    ${chips||'<span class="muted" style="font-size:12px">None yet — group the options that belong to one campaign so you can see the thread across the stages.</span>'}
    ${unassigned?`<span class="schip sc-none${off.none?' off':''}" onclick="toggleSeriesFilter('none')"
        title="${unassigned} active option${unassigned!==1?'s':''} not assigned to a campaign">unassigned · ${unassigned}</span>`:''}
    <button class="btn ghost sm" style="margin-left:4px" onclick="newSeries()">＋ New campaign</button>
    ${Object.keys(off).some(k=>off[k])?`<button class="btn gray sm" onclick="ST.libSeriesHidden={};renderLibrary()">Show all</button>`:''}
    <span class="muted" style="font-size:11.5px;margin-left:auto">Colour = campaign. Green stays reserved for “ready to send”.</span>
  </div>`;}
function toggleSeriesFilter(key){const off=ST.libSeriesHidden=ST.libSeriesHidden||{};
  /* clicking a campaign SOLOS it (dim the rest); clicking the soloed one clears the filter */
  const all=series.map(s=>s.id).concat(library.some(m=>m.isActive&&m.seriesId==null)?["none"]:[]);
  const soloed=all.filter(k=>!off[k]);
  if(soloed.length===1&&String(soloed[0])===String(key)){ST.libSeriesHidden={};}
  else{const n={};all.forEach(k=>{if(String(k)!==String(key))n[k]=true;});ST.libSeriesHidden=n;}
  renderLibrary();}
const seriesDimmed = m=>{const off=ST.libSeriesHidden||{};return !!off[m.seriesId==null?"none":m.seriesId];};
/* one OPTION card: the message, its stats, and the branches it owns */
function optCard(m,bestPct,isAlt){
  const pct=replyPct(m), win=pct===bestPct&&pct>0&&m.assigned>0, brs=branchesOf(m.id);
  const stageOpts=stagesOf((stageById(m.stageId)||{}).funnelId)
    .map(x=>`<option value="${x.id}" ${x.id===m.stageId?'selected':''}>${esc(x.label)}</option>`).join("");
  const serOpts=`<option value="">— no campaign —</option>`+series.map(s=>
    `<option value="${s.id}" ${s.id===m.seriesId?'selected':''}>${esc(s.label)}</option>`).join("");
  const brHTML=`<div class="brs">${brs.length?'<div class="blbl">Branches from this message</div>':''}
    ${brs.map(b=>`<div class="br" onclick="openFunnel(${b.funnelId})" title="Open the ${attrEsc(b.label)} funnel">
      ${(b.quickKeys||[]).length?`<span class="bk">${esc((b.quickKeys||[]).join(','))}</span>`:''}

  return `<div class="opt ${isAlt?'alt':''} ${win?'winner':''} ${m.isActive?'':'arch'} ${seriesStripe(m)}${seriesDimmed(m)?' dimmed':''}">
    <div class="oh"><span class="code">${m.code}</span>

    <div class="ob" onclick="this.classList.toggle('open')" title="Click to expand / collapse">${esc(m.body)}</div>
    <div class="of">
      <span title="${m.replied} replied · ${m.viewed} viewed"><b>${m.assigned}</b> sent ·
        <b style="color:${pct>=20?'var(--green)':pct>=10?'var(--amber)':'var(--red)'}">${pct}%</b> reply</span>
      ${m.versions.length?`<span class="linkish" onclick="msgHistory(${m.id})">${m.versions.length} ver</span>`:''}
      <span class="oacts">
        <select class="ov" title="Move to another stage" onchange="moveMsgStage(${m.id},+this.value)">${stageOpts}</select>
        ${isAlt?'':`<select class="ov" title="Which campaign this option belongs to" onchange="moveMsgSeries(${m.id},this.value)">${serOpts}</select>`}
        <button class="btn ghost sm" onclick="editMsg(${m.id})">Edit</button>
        <button class="btn gray sm" onclick="addAlt(${m.id})" title="Add an A/B alternate">＋Alt</button>
        <button class="btn ${m.isActive?'red ghost':'gray'} sm" onclick="archiveMsg(${m.id})"
          title="${m.isActive?'Archive — stops appearing in the pickers, keeps its stats':'Restore'}">${m.isActive?'Archive':'Restore'}</button>
      </span></div>
    ${brHTML}</div>`;
}
function openFunnel(fid){ST.libFunnel=fid;renderLibrary();window.scrollTo(0,0);}
/* move an option to another stage of the SAME funnel — alternates follow their base (a family
   must never straddle two stages), and `setstage` avoids logging a bogus wording version. */
function moveMsgStage(id,sid){const m=msgById(id);if(!m||m.stageId===sid)return;
  snapshot("move option to another stage");
  [m].concat(library.filter(x=>x.parentId===m.id)).forEach(x=>x.stageId=sid);
  persist("/api/message",{action:"setstage",id:m.id,stageId:sid});
  toast(m.code+" → "+((stageById(sid)||{}).label||"stage"),"ok");renderLibrary();}

/* ---- CAMPAIGNS (series) --------------------------------------------------------------------
   Assigning an option to a campaign changes nothing about how it sends. It changes what you can
   SEE (the thread of one campaign across the stage columns) and what the composer pre-selects
   (the option from the campaign this person is already in). `setseries` deliberately mirrors
   `setstage` — no message_versions row, because this is not a wording change — and alternates
   follow their base, because an A/B pair is one option and therefore one campaign. */
function moveMsgSeries(id,val){const m=msgById(id);if(!m)return;
  const sid=(val===""||val==null)?null:+val;
  if((m.seriesId==null?null:m.seriesId)===sid)return;
  snapshot("assign option to a campaign");
  [m].concat(library.filter(x=>x.parentId===m.id)).forEach(x=>x.seriesId=sid);
  persist("/api/message",{action:"setseries",id:m.id,seriesId:sid});
  toast(m.code+" → "+(sid==null?"no campaign":((seriesById(sid)||{}).label||"campaign")),"ok");renderLibrary();}

function pickSeriesColor(c){window.__seColor=c;

function saveSeries(sid){const s=seriesById(sid);if(!s)return;

function deleteSeries(sid){const s=seriesById(sid);if(!s)return;

/* ---- STAGES — the columns. Fully user-defined so any deployment can run 3 follow-ups or 6. ---- */
async function addStage(fid){
  const label=(prompt('Name the new stage (e.g. "Follow-up 4"):',"Follow-up "+stagesOf(fid).length)||"").trim();
  if(!label)return;
  snapshot("add stage");
  let id=Date.now();
  if(window.__LIVE){const r=await api("/api/stage",{action:"create",funnelId:fid,label:label});if(r&&r.id)id=r.id;}
  stages.push({id:id,funnelId:fid,label:label,hint:"",sortOrder:stagesOf(fid).length});
  toast("Stage added: "+label,"ok");renderLibrary();}
/* The ⋯ on a stage header. v1 of this was a single prompt() where you deleted the stage by
   blanking the field — the capability existed but nothing announced it, so it read as missing.
   List the actions instead. */
function stageMenu(sid,ev){ev.stopPropagation();closeStageMenu();
  const st=stageById(sid);if(!st)return;
  const host=ev.currentTarget.parentElement;
  const m=document.createElement("div");m.className="smenu";
  m.innerHTML=`<button onclick="renameStage(${sid})">Rename stage…</button>
    ${st.sortOrder===0?'':`<button onclick="setStageWait(${sid})">Set follow-up wait…</button>`}
    <div class="sep"></div>
    <button class="danger" onclick="deleteStage(${sid})">Delete stage…</button>`;
  host.appendChild(m);
  setTimeout(()=>document.addEventListener("click",closeStageMenu,{once:true}),0);}
function closeStageMenu(){document.querySelectorAll(".smenu").forEach(x=>x.remove());}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeStageMenu();});
function renameStage(sid){closeStageMenu();const st=stageById(sid);if(!st)return;
  const label=prompt("Rename this stage:",st.label);
  if(label===null||!label.trim())return;
  snapshot("rename stage");st.label=label.trim();
  persist("/api/stage",{action:"update",id:sid,label:st.label});renderLibrary();}
/* The stage's follow-up wait: how many days after the PREVIOUS touch this one is due. Editing it
   re-colours the pipeline immediately and changes nothing else — no queue, no send, no schedule.
   Say that in the prompt, because a number-of-days field in an outreach tool otherwise reads like
   an automation setting, and the first thought on typing "3" should not be "did I just arm this?" */
function setStageWait(sid){closeStageMenu();const st=stageById(sid);if(!st)return;
  if(st.sortOrder===0){toast("The intro has no previous touch to wait after","warn");return;}
  const cur=st.waitDays==null?"":String(st.waitDays);
  const raw=prompt('Wait how many days after the previous touch before "'+st.label+'" is ready?\n\n'
    +'This only colours the pipeline card green when the wait has passed — nothing is scheduled and '
    +'nothing sends itself. Weekends and holidays count as days.\n\n'
    +'Leave blank to use the default ('+FU_STALE_DAYS+' days).',cur);
  if(raw===null)return;
  const t=raw.trim();
  let wd=null;
  if(t!==""){wd=parseInt(t,10);
    if(isNaN(wd)||wd<0){toast("Enter a whole number of days, or leave blank for the default","warn");return;}}
  snapshot("set stage wait");
  st.waitDays=wd;
  persist("/api/stage",{action:"update",id:sid,waitDays:wd});
  toast(st.label+" → ready "+(wd==null?FU_STALE_DAYS+"d (default)":wd+"d")+" after the previous touch","ok");
  renderLibrary();render();}
/* Deleting a stage is never just a column disappearing: its messages have to land somewhere,
   and `fu_step` is an INDEX into the stage order, so everyone at or past it shifts down one.
   Say both out loud before doing it. */
function deleteStage(sid){closeStageMenu();
  const st=stageById(sid);if(!st)return;
  const n=library.filter(m=>m.stageId===sid&&m.isActive).length;
  const sibs=stagesOf(st.funnelId).filter(x=>x.id!==sid);
  if(!sibs.length){toast("A funnel needs at least one stage","warn");return;}
  const nb=sibs.slice().sort((a,b)=>Math.abs(a.sortOrder-st.sortOrder)-Math.abs(b.sortOrder-st.sortOrder))[0];
  const shifted=people.filter(p=>(p.funnelId||rootFunnel().id)===st.funnelId
    &&(p.fuStep!=null&&p.fuStep>=st.sortOrder)&&!p.funnelExited).length;
  let msg='Delete the "'+st.label+'" stage?';
  if(n)msg+='\n\n• '+n+' message'+(n===1?'':'s')+' move'+(n===1?'s':'')+' to "'+nb.label+'" (nothing is deleted).';
  if(shifted)msg+='\n\n• '+shifted+' '+(shifted===1?'person is':'people are')+' at or past this stage and will shift back one step, so their next message is whatever takes this slot.';
  if(!n&&!shifted)msg+='\n\nIt is empty — nothing else changes.';
  if(!confirm(msg))return;
  snapshot("delete stage");
  library.forEach(m=>{if(m.stageId===sid)m.stageId=nb.id;});
  people.forEach(p=>{if((p.funnelId||rootFunnel().id)===st.funnelId&&p.fuStep!=null&&p.fuStep>=st.sortOrder)p.fuStep-=1;});
  stages=stages.filter(x=>x.id!==sid);
  stagesOf(st.funnelId).forEach((x,i)=>x.sortOrder=i);
  persist("/api/stage",{action:"delete",id:sid,reassign:true});
  toast("Stage deleted"+(n?" — "+n+" message"+(n===1?'':'s')+" moved to "+nb.label:""),"ok");renderLibrary();}

/* ---- BRANCHES — owned by ONE option; creating one also creates its funnel + first stage. ---- */

      <div class="btnrow" style="margin-top:16px;justify-content:${b?'space-between':'flex-end'}">
        ${b?`<button class="btn red ghost sm" onclick="deleteBranch(${b.id})">Delete branch</button>`:''}
        <span><button class="btn gray" onclick="closeModal()">Cancel</button>

async function saveBranch(bid,messageId){
  const label=($("bt-label").value||"").trim(); if(!label){toast("Give the branch a name","warn");return;}
  const hint=($("bt-hint").value||"").trim();
  const quickKeys=($("bt-quick").value||"").split(",").map(s=>s.trim()).filter(Boolean);
  snapshot(bid?"edit branch":"new branch");
  if(bid){const b=branches.find(x=>x.id===bid);
    if(b){b.label=label;b.hint=hint;b.quickKeys=quickKeys;const f=funnelById(b.funnelId);if(f)f.label=label;}
    persist("/api/branch",{action:"update",id:bid,label:label,hint:hint,quickKeys:quickKeys});
    closeModal();toast("Branch updated","ok");renderLibrary();return;}
  let id=Date.now(), fid=id+1;
  if(window.__LIVE){const r=await api("/api/branch",{action:"create",messageId:messageId,label:label,hint:hint,quickKeys:quickKeys});
    if(r&&r.id){id=r.id;fid=r.funnelId;}}
  funnels.push({id:fid,label:label,branchId:id,isRoot:false,people:0});
  stages.push({id:fid*1000+1,funnelId:fid,label:"Reply 1",hint:"First message after they answer",sortOrder:0});
  branches.push({id:id,messageId:messageId,funnelId:fid,key:"b"+id,label:label,hint:hint,quickKeys:quickKeys,
                 sortOrder:branchesOf(messageId).length,people:0});
  closeModal();toast("Branch created — it has its own funnel now","ok");renderLibrary();}
function deleteBranch(bid){const b=branches.find(x=>x.id===bid);if(!b)return;
  const nm=library.filter(m=>stagesOf(b.funnelId).some(s=>s.id===m.stageId)).length;
  if(!confirm('Delete the "'+b.label+'" branch?'+(nm?"\n\nIts "+nm+" message"+(nm===1?'':'s')+" will be archived back onto the baseline, and "+(b.people||0)+" people return to the baseline funnel.":"")))return;
  snapshot("delete branch");
  const first=stagesOf(rootFunnel().id)[0];
  const bstages=stagesOf(b.funnelId).map(s=>s.id);
  library.forEach(m=>{if(bstages.indexOf(m.stageId)>=0){m.stageId=first.id;m.isActive=false;}});
  people.forEach(p=>{if(p.funnelId===b.funnelId){p.funnelId=rootFunnel().id;p.fuStep=0;}});
  stages=stages.filter(s=>s.funnelId!==b.funnelId);
  funnels=funnels.filter(f=>f.id!==b.funnelId);
  branches=branches.filter(x=>x.id!==bid);
  persist("/api/branch",{action:"delete",id:bid,reassign:true});
  if(ST.libFunnel===b.funnelId)ST.libFunnel=rootFunnel().id;
  closeModal();toast("Branch deleted","ok");renderLibrary();}

/* the family root for A/B purposes: an alternate branches under its base, the base under itself */
function familyRoot(m){return m.parentId?(msgById(m.parentId)||m):m;}
function editMsg(id){const m=msgById(id);const hasStats=m.assigned>0;const root=familyRoot(m);
  const st=stageById(m.stageId)||{}, f=funnelById(st.funnelId)||{};
  openModal(`<div class="mhead"><div><h2>Edit option <span class="code">${m.code}</span></h2>
    <div class="sub">${esc(f.label||'')} · ${esc(st.label||'')} · ${hasStats?`this one has <b>${m.assigned} sends</b> of reply data`:'no sends yet'}.</div></div><div class="dclose" onclick="closeModal()">×</div></div>
    <div class="mbody">
      <label class="fld">Stage <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">— which step of <b>${esc(f.label||'')}</b> this is sent at</span></label>
      <select id="im-stage" style="width:100%;margin-bottom:12px">${stagesOf(st.funnelId).map(x=>`<option value="${x.id}" ${x.id===m.stageId?'selected':''}>${esc(x.label)}</option>`).join("")}</select>
      <label class="fld">Title</label><input type="text" id="im-title" value="${esc(m.title)}" style="width:100%;margin-bottom:12px">
      <label class="fld">Body — use {{first}} and {{agency}} merge tags</label>

        <b>Save as new variant</b> spins off <span class="code">${root.code}.n</span> under the same family — its own A/B stats, still linked to <span class="code">${root.code}</span>.
        Use <b>Save in place</b> only for a typo-level fix (keeps the stats; snapshots the old text to history).</div></div>`:''}
      <div class="btnrow" style="margin-top:14px;justify-content:space-between">
        <button class="btn red ghost sm" onclick="archiveMsg(${m.id})">${m.isActive?'Archive':'Restore'}</button>
        <span><button class="btn gray" onclick="closeModal()">Cancel</button>
        ${hasStats
          ?`<button class="btn gray" onclick="saveMsg(${m.id})">Save in place</button>
            <button class="btn" onclick="branchMsg(${m.id})">🌿 Save as new variant →</button>`
          :`<button class="btn" onclick="saveMsg(${m.id})">Save</button>`}</span></div>
    </div>`);
}
function saveMsg(id){snapshot("edit option");const m=msgById(id);
  const nt=$("im-title").value.trim(),nb=$("im-body").value.trim();
  if(nb!==m.body)m.versions.push({title:m.title,body:m.body,at:TODAY});
  m.title=nt||m.title;m.body=nb||m.body;
  const ssel=$("im-stage"); if(ssel)m.stageId=+ssel.value;
  persist("/api/message",{action:"update",id:m.id,title:m.title,body:m.body,stageId:m.stageId});
  closeModal();toast("Saved "+m.code,"ok");renderLibrary();}
/* live-mode create helper: push locally, then adopt the server's real id/code so later edits persist */
async function createMsgRemote(localRow,payload,openEdit){
  library.push(localRow);
  if(window.__LIVE){const r=await api("/api/message",payload);if(r&&r.id){localRow.id=r.id;if(r.code)localRow.code=r.code;}}
  renderLibrary();if(openEdit)editMsg(localRow.id);}
function branchMsg(id){const src=msgById(id);
  const nt=$("im-title").value.trim(),nb=$("im-body").value.trim();
  const root=familyRoot(src);const n=library.filter(m=>m.parentId===root.id).length+1;const code=root.code+"."+n;
  snapshot("branch option variant");
  const v={id:imid++,stageId:root.stageId,code,parentId:root.id,seriesId:root.seriesId,
    title:nt||src.title,body:nb||src.body,isActive:true,sortOrder:imid,
    versions:[],assigned:0,replied:0,viewed:0,withLoom:0};
  closeModal();
  createMsgRemote(v,{action:"branch",id:src.id,title:v.title,body:v.body},false);
  toast("Branched "+src.code+" → new variant "+code+" — fresh A/B stats, same family","ok");}
function archiveMsg(id){snapshot("archive option");const m=msgById(id);m.isActive=!m.isActive;
  persist("/api/message",{action:"archive",id:m.id});closeModal();toast(m.isActive?"Restored":"Archived","ok");renderLibrary();}
/* a new option is born in the STAGE whose ＋ was clicked, so it's never mis-filed */
function newMsg(sid){snapshot("new option");
  const st=stageById(sid)||stagesOf(rootFunnel().id)[0]; sid=st.id;
  const isIntro=(st.funnelId===rootFunnel().id&&st.sortOrder===0);
  const n=library.filter(m=>m.stageId===sid&&!m.parentId).length+1;
  const prefix=isIntro?'':(st.label.replace(/follow[\s-]*up\s*/i,'FL').replace(/[^A-Za-z0-9]/g,'')||'M');
  /* If exactly one campaign is soloed in the legend, the option you're adding is obviously part of
     it — inherit rather than making you set it again on every new stage. */
  const ser=soloedSeriesId();

        which became false on 2026-08-24 when withdraw_send.py shipped. The lesson both times is the

    box==='sent'?(()=>{const st=staleRequests(),cut=+settings.withdraw_after_days||30,w=withdrawSweep();

function setCampStatus(id,s){snapshot("campaign status");campaigns[id].status=s;toast("Campaign "+s,"ok");renderCampaigns();}
function newCampaign(){snapshot("new campaign");const c=mkCamp({name:"Untitled campaign",status:"draft",segment:"",
  steps:[{id:0,day:0,body:"Hi {{first}}, …"}]});ST.camp=campaigns.length-1;renderCampaigns();}
function setStepBody(cid,sid,v){snapshot("edit step");campaigns[cid].steps.find(s=>s.id===sid).body=v;}
function setStepDay(cid,sid,v){snapshot("edit step day");campaigns[cid].steps.find(s=>s.id===sid).day=Math.max(0,+v||0);renderCampaigns();}
function addStep(cid){snapshot("add step");const c=campaigns[cid];const lastDay=c.steps.length?c.steps[c.steps.length-1].day:0;
  c.steps.push({id:Math.max(0,...c.steps.map(s=>s.id))+1,day:lastDay+3,body:"Hi {{first}}, …"});renderCampaigns();}
function delStep(cid,sid){snapshot("remove step");const c=campaigns[cid];c.steps=c.steps.filter(s=>s.id!==sid);renderCampaigns();}
function insertMacro(taId,macro){const ta=$(taId);if(!ta)return;const tag="{{"+macro+"}}";
  const s=ta.selectionStart??ta.value.length,e=ta.selectionEnd??ta.value.length;
  ta.value=ta.value.slice(0,s)+tag+ta.value.slice(e);ta.focus();ta.selectionStart=ta.selectionEnd=s+tag.length;
  ta.dispatchEvent(new Event("change"));}
function addRecipients(cid){snapshot("add recipients");const c=campaigns[cid];const seg=$("enrollSeg").value;
  const pool=people.filter(p=>{if(seg==="starred")return p.isStarred&&["accepted","intro_sent"].includes(p.stage);
    if(seg==="principal")return p.isPrincipal&&["accepted","intro_sent"].includes(p.stage);return p.stage===seg;});
  let added=0;pool.forEach(p=>{if(!enrollments.some(e=>e.campaignId===cid&&e.personId===p.id)){
    enroll(c,p,0,"active");added++;
    if(c.status==="active"&&msgQueue.filter(m=>m.status==="pending").length<14)
      msgQueue.push({id:mqId++,campaignId:cid,personId:p.id,stepId:c.steps[0].id,status:"pending"});}});
  toast(added?`Added ${added} recipient${added!==1?'s':''}`:"Everyone matching is already enrolled",added?"ok":"");renderCampaigns();}
function unenroll(eid){snapshot("remove recipient");const e=enrollments.find(x=>x.id===eid);
  enrollments=enrollments.filter(x=>x.id!==eid);msgQueue=msgQueue.filter(m=>!(m.personId===e.personId&&m.campaignId===e.campaignId&&m.status!=="sent"));renderCampaigns();}
function approveMsg(id){snapshot("approve message");msgQueue.find(m=>m.id===id).status="approved";renderCampaigns();}
function skipMsg(id){snapshot("skip message");msgQueue.find(m=>m.id===id).status="skipped";renderCampaigns();}
function runSender(cid){
  const approved=msgQueue.filter(m=>m.campaignId===cid&&m.status==="approved");
  if(!approved.length){toast("Approve some messages first");return;}
  snapshot("run sender");const btn=$("sendbtn-"+cid),bar=$("sendbar-"+cid);if(btn)btn.disabled=true;
  let i=0;const total=approved.length;
  const tick=()=>{if(i>=total){if(bar)bar.style.width="100%";
      toast(`Sent ${total} message${total!==1?'s':''}`,"ok");setTimeout(renderCampaigns,400);return;}
    const m=approved[i];m.status="sent";const e=enrollments.find(x=>x.campaignId===cid&&x.personId===m.personId);
    if(e){const c=campaigns[cid];e.curStep=Math.min(c.steps.length-1,e.curStep+1);if(e.curStep>=c.steps.length-1)e.status="done";}
    i++;if(bar)bar.style.width=(i/total*100)+"%";setTimeout(tick,420);};
  tick();
}

/* Activity = the person's event log. The PROTOTYPE derives it from state/timestamps; the REAL build
   writes an event_log row on every transition (worker/sync/manual) — see BUILD_NOTES §3. */
function personEvents(p){
  const ev=[], add=(at,what,kind)=>{if(at)ev.push({at,what,kind:kind||"you"});};
  add(p.addedAt,"Synced in from the Outreach Engine → warming","sync");
  if(p.resolved)add(p.addedAt,"LinkedIn profile resolved via Unipile","system");
  if(p.viewCount)add(p.lastViewedAt||p.addedAt,"Profile auto-viewed ×"+p.viewCount+" (warm-up)","worker");
  add(p.requestSentAt,"Connection request sent","worker");
  add(p.connectedAt,"Connection accepted","them");
  add(p.introSentAt,"Intro sent"+(p.introKind==='loom'?" (Loom)":""),"you");
  if(p.fuStep>0)add(p.lastActivityAt,"Follow-up "+p.fuStep+" sent","you");
  if(p.replyCount)add(p.lastInboundAt,"Replied ("+p.replyCount+")","them");
  return ev.filter(e=>e.at).sort((a,b)=>(b.at>a.at?1:b.at<a.at?-1:0));
}
function setStage(id,s){snapshot("change stage");personById(id).stage=s;persist("/api/person/"+id+"/update",{stage:s});toast("Stage → "+STAGE_META[s][0]);openPerson(id);renderTabs();}
function setNotes(id,v){snapshot("edit notes");personById(id).notes=v;persist("/api/person/"+id+"/update",{notes:v});}
function addTag(id){const t=(prompt("Add tag (vocab: "+CONN_TAGS.join(", ")+"):")||"").trim();if(!t)return;
  snapshot("add tag");const p=personById(id);if(!p.tags.includes(t))p.tags.push(t);
  persist("/api/person/"+id+"/tag",{tag:t,action:"add"});
  if(tagBlock(t))toast("⛔ '"+t+"' blocks outbound — this contact is now ineligible unless overridden");
  openPerson(id);render();}
function removeTag(id,t){snapshot("remove tag");const p=personById(id);p.tags=p.tags.filter(x=>x!==t);persist("/api/person/"+id+"/tag",{tag:t,action:"remove"});openPerson(id);render();}
/* ---- inline quick-tag (Connections table): click a chip's × to remove, or ＋ to toggle from the vocab.
   Mirrors the live tool's click-to-assign tagging, kept compact via a per-row popover. ---- */
const QUICK_TAGS=CONN_TAGS.filter(t=>t!=="in-intro-funnel");   // manually-assignable vocab
/* Ever-present one-click toggles in the person drawer — the tags the operator applies most
   while triaging connections. Toggle to add/remove without the ＋ prompt. */
const PRIMARY_QUICK_TAGS=["agency","museum","team","strategic","personal","client","omit"];
function toggleQuickTag(id,t){const p=personById(id);quickTag(id,t,p.tags.includes(t)?"remove":"add");openPerson(id);}
function quickTag(id,t,action){snapshot(action==="add"?"add tag":"remove tag");const p=personById(id);
  if(action==="add"){if(!p.tags.includes(t))p.tags.push(t);}else{p.tags=p.tags.filter(x=>x!==t);}
  persist("/api/person/"+id+"/tag",{tag:t,action});
  if(tagBlock(t)&&action==="add")toast("⛔ '"+t+"' blocks outbound — ineligible unless overridden");
  if($("tagPop")&&ST.tagPop===id)refreshTagPop(id);   // keep the pop open + in sync
  renderConnections();}
/* Connections-table tag toggle: same as quickTag but re-renders ROWS ONLY (not the whole page),
   so bulk-categorizing the untagged backlog stays snappy and never jumps scroll position. Used by
   the always-visible quick-tag chips in the Tags column. */
function connQuickTag(id,t,action){snapshot(action==="add"?"add tag":"remove tag");const p=personById(id);
  if(action==="add"){if(!p.tags.includes(t))p.tags.push(t);}else{p.tags=p.tags.filter(x=>x!==t);}
  persist("/api/person/"+id+"/tag",{tag:t,action});
  if(tagBlock(t)&&action==="add")toast("⛔ '"+t+"' blocks outbound — ineligible unless overridden");
  renderConnRows();}
/* Connections-table principal toggle: click the shield to mark/unmark an agency principal (stamps
   is_principal_source='operator' server-side). Rows-only re-render, same snappy bulk-edit feel as tags. */
function connTogglePrincipal(id){const p=personById(id);const now=!p.isPrincipal;
  snapshot(now?"mark principal":"unmark principal");p.isPrincipal=now;p.isPrincipalSource="operator";
  persist("/api/person/"+id+"/update",{isPrincipal:now});renderConnRows();}
function tagPopHTML(p){return `<div class="tphead">Tags · ${esc(p.name)}</div>`+
  QUICK_TAGS.map(t=>{const on=p.tags.includes(t);return `<div class="tprow ${on?'on':''}${tagBlock(t)?' blk':''}" onclick="event.stopPropagation();quickTag(${p.id},'${esc(t)}','${on?'remove':'add'}')">
    <span>${tagBlock(t)?'⛔ ':''}${esc(t)}</span><span class="tpck">${on?'✓':''}</span></div>`;}).join("");}
function refreshTagPop(id){const el=$("tagPop");const p=personById(id);if(el&&p)el.innerHTML=tagPopHTML(p);}
function openTagPop(id,ev){closeTagPop();const p=personById(id);if(!p)return;ST.tagPop=id;
  const pop=document.createElement("div");pop.className="tagpop";pop.id="tagPop";pop.innerHTML=tagPopHTML(p);
  document.body.appendChild(pop);
  const r=ev.target.getBoundingClientRect();
  pop.style.top=(r.bottom+5+window.scrollY)+"px";
  pop.style.left=(Math.max(8,Math.min(r.left,window.innerWidth-240))+window.scrollX)+"px";
  setTimeout(()=>document.addEventListener("click",closeTagPop),0);}
function closeTagPop(e){if(e&&e.target.closest&&e.target.closest("#tagPop"))return;
  const el=$("tagPop");if(el)el.remove();ST.tagPop=null;document.removeEventListener("click",closeTagPop);}
/* ---- outbound eligibility + facets ---- */
function eligibilityPill(p){
  if(outboundEligible(p))return '<span class="pill p-grn">✓ outbound-eligible</span>';
  if(personBlocked(p))return '<span class="pill p-red">⛔ blocked · '+blockingTagsOf(p).map(esc).join(", ")+'</span>';
  if(p.overrideEligibility&&blockingTagsOf(p).length)return '<span class="pill p-amb">⚠ overridden — sending despite '+blockingTagsOf(p).map(esc).join(", ")+'</span>';
  if(!p.tags.includes("agency"))return '<span class="pill p-gray">not in outbound audience (no \'agency\' tag)</span>';
  return '<span class="pill p-gray">—</span>';}
function toggleOverride(id){snapshot("toggle eligibility override");const p=personById(id);p.overrideEligibility=!p.overrideEligibility;

function makePrimaryLink(id,ix){snapshot("primary agency");const p=personById(id);p.agencyLinks.forEach((l,i)=>l.primary=(i===ix));p.agency=p.agencyLinks[ix].name;openPerson(id);render();}
function confirmLink(id,ix){snapshot("confirm agency link");const p=personById(id);const l=p.agencyLinks[ix];l.status="confirmed";l.reviewedBy="operator";openPerson(id);toast("Link confirmed","ok");}
function rejectLink(id,ix){snapshot("remove agency link");const p=personById(id);const l=p.agencyLinks[ix];p.agencyLinks.splice(ix,1);

/* ---- profile research (scraped profile + LLM classification cache) ---- */
function researchSection(p){

      <button class="btn ghost sm" style="margin-left:8px" onclick="classifyPerson(${p.id})">🔎 Scrape &amp; classify</button></div></div>`;
  const c=r.classification, facet=(on,l)=>on?`<span class="pill p-teal">${l}</span> `:"";
  const cp=r.confidence==="high"?'p-grn':r.confidence==="medium"?'p-amb':'p-gray';
  const anyFlag=c.isAgencyPrincipal||c.isAgencyOther||c.isMuseumContact||c.pastMuseumExperience||c.isFreelance;
  return `<div class="sechead">Profile research <span class="muted" style="font-weight:400">— scraped ${daysAgoLabel(r.scrapedAt)} · ${esc(r.model)}</span></div>

      ${facet(c.isAgencyPrincipal,"agency principal")}${facet(c.isAgencyOther,"agency (other)")}${facet(c.isMuseumContact,"museum contact")}${facet(c.pastMuseumExperience,"past museum exp.")}${facet(c.isFreelance,"freelance")}
      ${anyFlag?'':'<span class="muted">— no flags</span> '}<span class="pill ${cp}">${r.confidence} confidence</span></div></div>
    <div class="frow"><div class="fl">Summary</div><div class="fv">${esc(r.summary)}</div></div>
    <div class="frow"><div class="fv"><button class="btn ghost sm" onclick="classifyPerson(${p.id})">↻ Re-scrape &amp; classify</button></div></div>`;
}

/* ============================ self-learning: review → propose → apply → undo ============================ */
const VFIELD_LABEL={voice_style:"Writing style", voice_pov:"Point of view", voice_background:"Background"};
function fieldLabel(f){return VFIELD_LABEL[f]||f;}

/* Parse the operator's plain-English steer into the set of recommendation numbers to apply.
   Blank → the high-confidence ones. Handles "apply 1 and 2 but skip 3", "only 2", "skip 4". */
function parseNotesSelection(notes,recs){
  const all=recs.map(r=>r.n);
  notes=(notes||"").trim();
  if(!notes)return{sel:new Set(recs.filter(r=>r.conf==="high").map(r=>r.n)),mode:"default"};
  const EXCL=/\b(skip|skipping|don'?t|do not|not|drop|omit|exclude|without|leave out|ignore)\b/i;
  const INCL=/\b(only|just|apply|implement|use|include|do|add)\b/i;
  const clauses=notes.split(/\b(?:but|except|however)\b|[,;]/i);
  let include=new Set(),exclude=new Set(),sawInclude=false;
  clauses.forEach(c=>{
    const nums=(c.match(/[1-9]/g)||[]).map(Number).filter(n=>all.includes(n));
    if(!nums.length)return;
    if(EXCL.test(c))nums.forEach(n=>exclude.add(n));
    else{sawInclude=true;nums.forEach(n=>include.add(n));}   // bare numbers or include-verb => include
  });
  const sel=sawInclude?new Set([...include].filter(n=>!exclude.has(n)))
                      :new Set(all.filter(n=>!exclude.has(n)));
  return{sel,mode:"parsed"};
}

/* Build the proposal: append each chosen recommendation's rule to its target voice field, diff it.
   (In the real tool an LLM rewrites the field surgically; here we deterministically append the rule
   line so the prototype shows a clean, honest before/after — see BUILD_NOTES §6.) */
function buildProposal(){
  const notes=$("ln-notes")?$("ln-notes").value:"";
  const {sel,mode}=parseNotesSelection(notes,LEARN_REPORT.recs);
  const chosen=LEARN_REPORT.recs.filter(r=>sel.has(r.n));
  const skipped=LEARN_REPORT.recs.filter(r=>!sel.has(r.n));
  const byField={};
  chosen.forEach(r=>(byField[r.field]=byField[r.field]||[]).push(r));
  const changes=Object.keys(byField).map(f=>{
    const before=settings[f];
    const after=before.trim()+"\n"+byField[f].map(r=>r.rule).join("\n");
    return{field:f,before,after,recs:byField[f].map(r=>r.n)};
  });
  let summary;
  if(!chosen.length)summary="No recommendations selected — nothing to change.";
  else summary=`Applying ${chosen.length} recommendation${chosen.length>1?"s":""} (${chosen.map(r=>"#"+r.n).join(", ")})`+
    (skipped.length?`; leaving out ${skipped.map(r=>"#"+r.n).join(", ")}${mode==="default"?" (tentative — not applied by default)":" per your notes"}.`:".");
  return{changes,summary,notes,chosenNums:chosen.map(r=>r.n),skippedNums:skipped.map(r=>r.n)};
}

function lineDiff(before,after){
  const b=before.split("\n"),a=after.split("\n");
  return a.map((ln,i)=>{const added=i>=b.length||b[i]!==a[i];
    return `<div class="dl ${added?"add":""}">${added?"+ ":"  "}${esc(ln)||"&nbsp;"}</div>`;}).join("");
}

async function proposeLearnings(){
  if(window.__LIVE&&window.__LEARN&&window.__LEARN.reportMd){
    const notes=$("ln-notes")?$("ln-notes").value:"";
    if($("ln-busy"))$("ln-busy").textContent="Analyzing your edits…";
    const r=await api("/api/reply_learnings/propose",{learning_id:window.__LEARN.id,notes});
    if($("ln-busy"))$("ln-busy").textContent="";
    if(!r||!r.ok){toast((r&&r.error)||"Propose failed","err");return;}
    _pendingProposal=r;
    const box=$("ln-result");
    if(!r.changes||!r.changes.length){box.innerHTML=`<div class="lcard"><b>No changes proposed.</b><div class="muted" style="font-size:12.5px;margin-top:3px">${esc(r.summary||'')}</div></div>`;return;}
    const diffs=r.changes.map(c=>`<div class="lf"><div class="lfh">${esc(c.label)} <span class="muted">(${c.key})</span></div>
      <div class="diffbox">${lineDiff(c.old,c.new)}</div></div>`).join("");
    box.innerHTML=`<div class="lcard"><div class="lct">Proposed voice-profile changes</div>
      <div class="muted" style="font-size:12.5px;margin:2px 0 8px">${esc(r.summary||'')}</div>${diffs}
      <div class="btnrow" style="margin-top:12px">
        <button class="btn green sm" onclick="confirmProposal()">✓ Confirm &amp; update voice profile</button>
        <button class="btn gray sm" onclick="$('ln-result').innerHTML='';_pendingProposal=null">Cancel</button>
        <span class="muted" style="font-size:11px">Writes your real voice fields · one-click undo after</span></div></div>`;
    return;
  }
  const p=buildProposal();_pendingProposal=p;
  const box=$("ln-result");
  if(!p.changes.length){box.innerHTML=`<div class="lcard"><b>No changes proposed.</b><div class="muted" style="font-size:12.5px;margin-top:3px">${esc(p.summary)}</div></div>`;return;}
  const diffs=p.changes.map(c=>`<div class="lf">
    <div class="lfh">${fieldLabel(c.field)} <span class="muted">(${c.field})</span></div>
    <div class="diffbox">${lineDiff(c.before,c.after)}</div></div>`).join("");
  box.innerHTML=`<div class="lcard">
    <div class="lct">Proposed voice-profile changes</div>
    <div class="muted" style="font-size:12.5px;margin:2px 0 8px">${esc(p.summary)}</div>
    ${diffs}
    <div class="btnrow" style="margin-top:12px">
      <button class="btn green sm" onclick="confirmProposal()">✓ Confirm &amp; update voice profile</button>
      <button class="btn gray sm" onclick="$('ln-result').innerHTML='';_pendingProposal=null">Cancel</button>
      <span class="muted" style="font-size:11px">Writes the voice fields · one-click undo after</span></div></div>`;
}
async function confirmProposal(){
  const p=_pendingProposal;if(!p||!p.changes||!p.changes.length)return;
  if(window.__LIVE&&p.proposal_id){
    const r=await api("/api/reply_learnings/apply",{proposal_id:p.proposal_id});
    if(!r||!r.ok){toast((r&&r.error)||"Apply failed","err");return;}
    p.changes.forEach(c=>{settings[c.key]=c.new;
      if(c.key==="reply_style_instructions")settings.voice_style=c.new;
      if(c.key==="reply_point_of_view")settings.voice_pov=c.new;
      if(c.key==="reply_personal_history")settings.voice_background=c.new;});
    if(window.__LEARN){(window.__LEARN.revisions=window.__LEARN.revisions||[]).unshift(
      {id:r.revision_id,at:TODAY,summary:p.summary,notes:p.notes,undone:false,fields:p.changes.map(c=>c.label)});}
    _pendingProposal=null;
    toast("Voice profile updated — undo available","ok");
    render();$("ln-body").innerHTML=renderLearnBody();
    return;
  }
  snapshot("apply learnings");
  const before={};
  p.changes.forEach(c=>{before[c.field]=settings[c.field];settings[c.field]=c.after;});
  voiceRevisions.unshift({at:TODAY,notes:p.notes,summary:p.summary,
    fields:p.changes.map(c=>c.field),recs:p.chosenNums,before,undone:false});
  _pendingProposal=null;
  toast("Voice profile updated — undo available","ok");
  render();                 // refresh the dashboard card / engage voice summary
  $("ln-body").innerHTML=renderLearnBody();   // re-render modal in place
}
async function undoLearning(revId){
  const r=await api("/api/style/undo",{revision_id:revId});
  if(!r||!r.ok){toast((r&&r.error)||"Undo failed","err");return;}
  // backend restored the pre-apply values; re-pull settings + learn so the UI reflects them
  const d=await api("/api/bootstrap");
  if(d&&d.settings)settings=Object.assign({},settings,d.settings);
  if(d&&d.learn)window.__LEARN=d.learn;
  toast("Reverted voice-profile change","ok");
  render();$("ln-body").innerHTML=renderLearnBody();
}

/* ============================ boot ============================ */
/* Real-data bridge: when served by linkedin_engine.py, /api/bootstrap returns every collection in
   the SAME shape as the mock arrays above; we swap the mock for real data and re-index the id
   counters. Served as a static file with no backend, the fetch fails and the mock prototype stands. */
const API_BASE="";  // same origin
async function api(path,bodyObj){
  try{const r=await fetch(API_BASE+path,{method:bodyObj?"POST":"GET",
    headers:bodyObj?{"Content-Type":"application/json"}:undefined,
    body:bodyObj?JSON.stringify(bodyObj):undefined});
    /* An error RESPONSE still has a body, and for provider actions that body IS the diagnosis
       ("send failed: 401: …"). Discarding it and reporting a bare "http 500" is how a real
       LinkedIn error reached the screen as a meaningless number. Parse it; fall back to the
       status only when there's genuinely nothing there. */
    if(!r.ok){ let d=null; try{ d=await r.json(); }catch(e){}
      return {ok:false, status:r.status,
              error:(d&&(d.error||d.message))||("The server returned an error (http "+r.status+") with no explanation.")}; }
    return await r.json();
  }catch(e){return{ok:false,error:"Could not reach the engine — is it still running? ("+e+")"};}
}
window.__LIVE=false;   // flips true once real data loads (persistence hooks check this)
function persist(path,bodyObj){ if(window.__LIVE) api(path,bodyObj||{}); }  // fire-and-forget write
function applyBootstrap(d){
  if(!d||!Array.isArray(d.people))return false;
  people=d.people;
  if(Array.isArray(d.library))library=d.library;
  if(Array.isArray(d.funnels))funnels=d.funnels;
  if(Array.isArray(d.stages))stages=d.stages;
  if(Array.isArray(d.branches))branches=d.branches;
  if(Array.isArray(d.series))series=d.series;
  if(Array.isArray(d.posts))posts=d.posts;
  if(Array.isArray(d.convos))convos=d.convos;
  if(Array.isArray(d.followUps))followUps=d.followUps;
  if(Array.isArray(d.invitations))invitations=d.invitations;
  if(Array.isArray(d.campaigns))campaigns=d.campaigns;
  if(Array.isArray(d.enrollments))enrollments=d.enrollments;
  if(Array.isArray(d.msgQueue))msgQueue=d.msgQueue;
  if(Array.isArray(d.tasks))tasks=d.tasks;
  if(d.settings)settings=Object.assign({},settings,d.settings);
  if(d.syncState)syncState=Object.assign({},syncState,d.syncState);
  // re-index id counters so client-created rows don't collide with real ids
  const mx=(arr,k)=>arr.reduce((m,x)=>Math.max(m,(x&&x[k]!=null)?x[k]:0),0);
  pid=mx(people,"id")+1; imid=mx(library,"id")+1; postId=mx(posts,"id")+1;
  invId=mx(invitations,"id")+1; cpid=mx(campaigns,"id")+1;
  enrId=mx(enrollments,"id")+1; mqId=mx(msgQueue,"id")+1; taskId=mx(tasks,"id")+1;
  window.__LIVE=true; window.__META=d.meta||{}; window.__LEARN=d.learn||null;
  /* Whole-table counts behind the delivered slice of posts — the only way the Engage tabs can
     tell "you're caught up" apart from "these posts exist but you can't see them here". */
  window.__FEEDSTATS=d.feedStats||null;
  return true;
}
/* tiny markdown → HTML for the weekly report (##/### headers, - bullets, **bold**, blank lines) */
function mdLite(md){return (md||"").split("\n").map(l=>{
  l=esc(l).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  if(/^###\s+/.test(l))return `<div style="font-weight:700;margin:9px 0 2px">${l.replace(/^###\s+/,"")}</div>`;
  if(/^##\s+/.test(l))return `<div style="font-weight:800;font-size:14px;margin:13px 0 3px">${l.replace(/^##\s+/,"")}</div>`;
  if(/^-\s+/.test(l))return `<div style="margin-left:12px">• ${l.replace(/^-\s+/,"")}</div>`;
  if(/^>\s?/.test(l))return `<div style="border-left:2px solid var(--line);padding-left:8px;color:var(--muted);font-style:italic">${l.replace(/^>\s?/,"")}</div>`;
  if(!l.trim())return "<div style='height:6px'></div>";
  return `<div>${l}</div>`;}).join("");}
(async function boot(){
  loadConnPrefs();
  const d=await api("/api/bootstrap");
  if(applyBootstrap(d)){
    console.log("LinkedIn Engine: live data — "+people.length+" people, provider "+(window.__META.provider||"?"));
  }else{
    console.log("LinkedIn Engine: no backend — mock prototype");
  }
  go("dash");
  /* Keep TODAY live: correct a tab that was left open across midnight (or loaded on a prior day)
     without a manual reload — check each minute and whenever the tab regains focus. */
  setInterval(()=>{const t=computeToday();if(t!==TODAY){TODAY=t;render();}},60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){const t=computeToday();if(t!==TODAY){TODAY=t;render();}}});
})();

ypeof go==='function')go(step.tab);else if(typeof switchTab==='function')switchTab(step.tab)}await new Promise(r=>setTimeout(r,180));const target=document.querySelector(step.target);if(!target)throw new Error('Missing tour target '+step.target);target.scrollIntoView({block:'nearest'});const r=target.getBoundingClientRect();highlight.hidden=card.hidden=false;Object.assign(highlight.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});card.innerHTML='<small>'+(at+1)+' / '+steps.length+'</small><h3>'+step.title+'</h3><p>'+step.body+'</p><button onclick="DEMO_TOUR.close()">Close</button>'+(at?'<button onclick="DEMO_TOUR.back()">Back</button>':'')+'<button id="demo-tour-next" onclick="DEMO_TOUR.next()">'+(at===steps.length-1?'Done':'Next')+'</button>';card.style.left=Math.max(12,Math.min(innerWidth-350,r.right+16))+'px';card.style.top=Math.max(12,Math.min(innerHeight-card.offsetHeight-12,r.top+30))+'px'}window.DEMO_TOUR={start:()=>{at=0;show()},next:()=>{if(at===steps.length-1)close();else{at++;show()}},back:()=>{at=Math.max(0,at-1);show()},close};})();</script></body></html>
