:root {
  --accent: #0a0a0a;
  --accent-muted: #555;
  --bg: #fff;
  --bg-secondary: #f7f7f7;
  --border: #e5e5e5;
  --border-strong: #ccc;
  --text: #0a0a0a;
  --text-muted: #666;
  --text-faint: #999;
  --success: #16a34a;
  --danger: #dc2626;
  --warning: #d97706;
  --info: #2563eb;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
  background: var(--bg);
}
.prose h1 {
  font-size: 1.25rem;
  font-weight: 700;
  margin: 1rem 0 0.5rem;
}
.prose h2 {
  font-size: 1.125rem;
  font-weight: 600;
  margin: 0.875rem 0 0.375rem;
}
.prose h3 {
  font-size: 1rem;
  font-weight: 600;
  margin: 0.75rem 0 0.25rem;
}
.prose p {
  margin: 0.375rem 0;
  line-height: 1.6;
}
.prose ul, .prose ol {
  margin: 0.375rem 0;
  padding-left: 1.5rem;
}
.prose li {
  margin: 0.125rem 0;
  line-height: 1.5;
}
.prose a {
  color: var(--info);
  text-decoration: underline;
}
.prose code {
  background: var(--bg-secondary);
  padding: 0.125rem 0.25rem;
  border-radius: 3px;
  font-size: 0.875em;
}
.prose blockquote {
  border-left: 3px solid var(--border-strong);
  padding-left: 0.75rem;
  color: var(--text-muted);
  margin: 0.5rem 0;
}
.prose strong {
  font-weight: 600;
}
.prose hr {
  border-color: var(--border);
  margin: 1rem 0;
}
.scroll-thin::-webkit-scrollbar {
  width: 4px;
}
.scroll-thin::-webkit-scrollbar-track {
  background: transparent;
}
.scroll-thin::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 2px;
}
@keyframes pulse-dot {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.3;
  }
}
.animate-pulse-dot {
  animation: pulse-dot 1.5s ease-in-out infinite;
}
.social-sheet-grid {
  --rdg-color-scheme: light;
  --rdg-border-color: #e0e0e0;
  --rdg-header-background-color: #f8fafd;
  --rdg-row-hover-background-color: #f8fbff;
  font-size: 11px;
}
.social-sheet-grid .rdg-header-row {
  font-size: 10px;
  font-weight: 700;
}
.social-sheet-grid .rdg-cell {
  border-inline-end: 1px solid #e6e6e6;
}
.social-sheet-grid .rdg-cell-frozen {
  background: #fff;
}
.social-sheet-grid .rdg-header-row .rdg-cell-frozen {
  background: #f8fafd;
}

async function show(i){target?.classList.remove('demo-tour-target');card?.remove();if(i>=steps.length){close();return}step=i;launch.hidden=true;const s=steps[i];s.before?.();await new Promise(r=>setTimeout(r,200));target=document.querySelector(s.selector)||document.querySelector('#root');target.classList.add('demo-tour-target');const rect=target.getBoundingClientRect();card=document.createElement('section');card.id='demo-tour-card';card.setAttribute('role','dialog');card.innerHTML='<h2>'+s.title+'</h2><p>'+s.text+'</p><footer><small>'+(i+1)+' / '+steps.length+'</small><button data-close>Close</button>'+(i?'<button data-back>Back</button>':'')+'<button data-next>'+(i===steps.length-1?'Done':'Next')+'</button></footer>';document.body.append(card);card.style.left=Math.max(12,Math.min(innerWidth-324,rect.right+12))+'px';card.style.top=Math.max(12,Math.min(innerHeight-card.offsetHeight-12,rect.top+20))+'px';card.querySelector('[data-next]').onclick=()=>show(i+1);card.querySelector('[data-close]').onclick=close;if(i)card.querySelector('[data-back]').onclick=()=>show(i-1);}
launch.onclick=()=>show(0);window.demoTour={start:()=>show(0),count:steps.length};})();
