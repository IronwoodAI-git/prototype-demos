/* ---------------- guided tour engine ---------------- */
let shield=null,halo=null,card=null;
function startTour(i){
  closeMini();closeIntro();
  const top=document.querySelector(".top");if(top)top.classList.add("tut-lift");
  try{if(typeof closeModal==="function")closeModal();}catch(e){}
  try{if(typeof closeDrawer==="function"&&cur<0)closeDrawer();}catch(e){}
  if(!shield){
    shield=N("div","tut-shield");shield.onclick=e=>e.stopPropagation();  // dim overlay eats clicks
    halo=N("div","tut-halo");card=N("div","tut-card");
    document.body.appendChild(shield);document.body.appendChild(halo);document.body.appendChild(card);
  }
  clearSpots();
  goStep(i||0);
}
function goStep(i){
  if(i<0||i>=TUT_STEPS.length)return;
  const prev=TUT_STEPS[cur];if(prev&&prev.post){try{prev.post();}catch(e){}}
  cur=i;const s=TUT_STEPS[i];
  if(s.tab&&s.tab!=="*"&&ST.tab!==s.tab)go(s.tab);          // auto tab-switch via the app's own fn
  window.__tourTab=(s.tab&&s.tab!=="*")?s.tab:null;         // highlight that section's nav tab
  if(typeof renderTabs==="function")renderTabs();
  if(s.pre){try{s.pre();}catch(e){}}
  place();                       // the app's renders are synchronous — measure immediately
  requestAnimationFrame(place);  // and settle once more after any pending layout
}
function place(){
  if(cur<0||!card)return;
  const s=TUT_STEPS[cur];
  const t=document.querySelector(s.sel)||(s.fb?document.querySelector(s.fb):null)||document.querySelector(".main");
  try{t.scrollIntoView({block:"center"});}catch(e){}
  const r=t.getBoundingClientRect(),pad=6;
  halo.style.left=(r.left-pad)+"px";halo.style.top=(r.top-pad)+"px";
  halo.style.width=(r.width+pad*2)+"px";halo.style.height=(r.height+pad*2)+"px";
  card.innerHTML=`
    <span class="tut-x" onclick="TUT.end()" title="End tour">✕</span>
    <div class="tut-kicker">Guided tour${(s.tab&&s.tab!=="*"&&typeof TABS!=="undefined")?" · "+((TABS.find(t=>t[0]===s.tab)||[])[1]||""):""}</div>
    <h4>${s.title}</h4>
    <div class="tut-body">${s.body}</div>
    <div class="tut-foot">
      <span class="tut-step">step ${cur+1} of ${TUT_STEPS.length}</span>
      <span style="flex:1"></span>
      <button class="tut-btn ghost" ${cur===0?"disabled":""} onclick="TUT.back()">‹ Back</button>
      <button class="tut-btn" onclick="TUT.next()">${cur===TUT_STEPS.length-1?"✓ Finish":"Next ›"}</button>
    </div>`;
  const cw=card.offsetWidth,ch=card.offsetHeight,gap=14;
  const vw=document.documentElement.clientWidth,vh=document.documentElement.clientHeight;
  let pos=s.pos||"bottom",x,y;
  if(pos==="right"&&r.right+gap+cw>vw-10)pos="bottom";
  if(pos==="left"&&r.left-gap-cw<10)pos="bottom";
  if(pos==="bottom"&&r.bottom+gap+ch>vh-10&&r.top-gap-ch>10)pos="top";
  if(pos==="top"&&r.top-gap-ch<10)pos="bottom";
  if(pos==="right"){x=r.right+gap;y=r.top;}
  else if(pos==="left"){x=r.left-gap-cw;y=r.top;}
  else if(pos==="top"){x=r.left;y=r.top-gap-ch;}
  else {x=r.left;y=r.bottom+gap;}
  x=Math.max(10,Math.min(x,vw-cw-10));y=Math.max(10,Math.min(y,vh-ch-10));
  card.style.left=x+"px";card.style.top=y+"px";
}
function endTour(finished){
  if(cur>=0){const s=TUT_STEPS[cur];if(s&&s.post){try{s.post();}catch(e){}}}
  cur=-1;
  [shield,halo,card].forEach(n=>{if(n)n.remove();});shield=halo=card=null;
  window.__tourTab=null;
  const top=document.querySelector(".top");if(top)top.classList.remove("tut-lift");
  if(typeof renderTabs==="function")renderTabs();
  schedule();
  if(finished&&on&&typeof toast==="function")toast("Tour done — hints stay on. Click any ? badge, or toggle 🎓 in the header.","ok");
}

/* ---------------- ambient hotspots ---------------- */
function clearSpots(){document.querySelectorAll(".tut-spot").forEach(n=>n.remove());}
function attachSpots(){
  clearSpots();
  if(!on||cur>=0)return;
  TUT_SPOTS.forEach(sp=>{
    if(sp.tab!=="*"&&sp.tab!==ST.tab)return;
    const t=document.querySelector(sp.sel);if(!t)return;
    const r=t.getBoundingClientRect();if(!r.width&&!r.height)return;
    const b=N("button","tut-spot","?");
    b.title=sp.title+" — click for a hint";b.dataset.sel=sp.sel;
    b.style.left=(window.scrollX+r.right-8)+"px";
    b.style.top=(window.scrollY+r.top-8)+"px";
    b.onclick=e=>{e.stopPropagation();openMini(sp,b);};
    document.body.appendChild(b);
  });
}
function repositionSpots(){  // sticky-header targets shift on page scroll
  document.querySelectorAll(".tut-spot").forEach(b=>{
    const t=document.querySelector(b.dataset.sel);if(!t){b.remove();return;}
    const r=t.getBoundingClientRect();
    b.style.left=(window.scrollX+r.right-8)+"px";
    b.style.top=(window.scrollY+r.top-8)+"px";
  });
}
/* debounce within a synchronous render chain, then re-attach immediately after it
   (microtask, not rAF — rAF stalls in background tabs and the renders here are sync) */
function schedule(){if(raf)return;raf=1;queueMicrotask(()=>{raf=0;attachSpots();});}

/* hotspot explainer card */
let mini=null;
function closeMini(){if(mini){mini.remove();mini=null;document.removeEventListener("click",closeMini);}}
function openMini(sp,anchor){
  closeMini();closeIntro();
  const idx=sp.tourStep!=null?TUT_STEPS.findIndex(s=>s.id===sp.tourStep):-1;
  mini=N("div","tut-mini",`
    <span class="tut-x" onclick="TUT.closeMini()">✕</span>
    <h4>${sp.title}</h4>
    <div class="tut-body">${sp.body}</div>
    ${idx>=0?`<div class="tut-foot"><span class="tut-link" onclick="TUT.tourFrom('${sp.tourStep}')">▶ Tour this area</span></div>`:""}`);
  mini.onclick=e=>e.stopPropagation();
  document.body.appendChild(mini);
  const r=anchor.getBoundingClientRect(),w=mini.offsetWidth;
  mini.style.left=Math.max(10,Math.min(window.scrollX+r.left,window.scrollX+document.documentElement.clientWidth-w-12))+"px";
  mini.style.top=(window.scrollY+r.bottom+8)+"px";
  setTimeout(()=>document.addEventListener("click",closeMini),0);
}

/* ---------------- tab intro cards ---------------- */
let intro=null;
function closeIntro(){if(intro){intro.remove();intro=null;}}
function showIntro(tab){
  if(!on||cur>=0||seenTabs.has(tab))return;
  const t=TUT_TABS.find(x=>x.tab===tab);if(!t)return;
  seenTabs.add(tab);closeIntro();
  intro=N("div","tut-intro",`
    <span class="tut-x" onclick="TUT.closeIntro()">✕</span>
    <div class="tut-kicker">🎓 ${t.title}</div>
    <div class="tut-body">${t.body}</div>
    <div class="tut-foot">
      <span class="tut-link" onclick="TUT.tourFrom('${t.step}')">▶ Tour this tab</span>
      <span style="flex:1"></span>
      <button class="tut-btn ghost" onclick="TUT.closeIntro()">Got it</button>
    </div>`);
  document.body.appendChild(intro);
}

/* ---------------- toggle + header pill ---------------- */
function setOn(v){
  on=v;try{localStorage.setItem(LS_KEY,v?"on":"off");}catch(e){}
  updatePill();
  if(!v){endTour(false);clearSpots();closeMini();closeIntro();}
  else attachSpots();
}
function updatePill(){
  const p=document.getElementById("tutPill");if(!p)return;
  p.className="tut-pill"+(on?"":" off");
  p.innerHTML="🎓 Tutorial "+(on?"ON":"OFF");
  p.title=on?"Tutorial mode is ON — hotspots + tab intros. Click to turn off.":"Tutorial mode is OFF. Click to turn hints back on.";
}
(function injectPill(){
  const pills=document.querySelector(".hdr-pills")||document.querySelector(".topin");if(!pills)return;
  const p=N("button","tut-pill");p.id="tutPill";
  p.onclick=()=>{setOn(!on);if(typeof toast==="function")toast(on?"Tutorial hints ON — ? badges mark every major area":"Tutorial hints off — toggle 🎓 anytime","");};
  pills.insertBefore(p,pills.firstChild);   // 🎓 Tutorial sits left of the ⚡ status pill
  updatePill();
})();

/* ---------------- welcome modal (first run / restart) ---------------- */
function welcome(){
  closeMini();closeIntro();
  openModal(`
   <div class="mhead"><div><h2>👋 Welcome to the Outreach Engine</h2><div class="sub">What this tool is, in 30 seconds</div></div><div class="dclose" onclick="closeModal()">×</div></div>
   <div class="mbody">
     <p style="margin:0 0 10px">This is a <b>cold-email outreach engine</b>: one place to keep your master list of companies and people, refine it down to the prospects worth talking to, and run careful email campaigns that <b>protect your sending reputation</b>.</p>
     <p style="margin:0 0 10px">List building and enrichment happen in upstream tools — their output lands here. From here you <b>rank and review</b> the list, send <b>warmed-up</b> campaigns with hard guardrails, log replies, and hand the best prospects to a companion LinkedIn tool.</p>
     <p class="muted" style="margin:0 0 4px;font-size:12.5px">This prototype runs on sample data — nothing sends real email, so click anything. The guided tour takes ~3 minutes and follows the real workflow in order.</p>
     <div class="btnrow" style="margin-top:16px">
       <button class="btn" onclick="closeModal();TUT.start()">▶ Take the guided tour</button>
       <button class="btn ghost" onclick="closeModal();TUT.explore()">Explore with hints on</button>
       <button class="btn gray" onclick="closeModal();TUT.off()">Turn tutorial off</button>
     </div>
   </div>`);
}

/* ---------------- settings surface (row appended into ⚙ Campaign settings) ---------------- */
function injectSettingsRow(){
  const mb=document.querySelector("#modal .mbody");
  if(!mb||mb.querySelector(".tut-setrow"))return;
  const d=N("div","tut-setrow",`
    <div class="sechead">Tutorial mode</div>
    <div class="rulerow">
      <label class="switch"><input type="checkbox" ${on?"checked":""} onchange="TUT.toggle()"><span class="track"></span></label>
      <div class="rinfo"><b>Tutorial mode</b><div class="muted">Shows a “?” hotspot on every major section plus a first-visit intro card per tab. The 🎓 pill in the header toggles this too.</div></div>
      <div class="rright"><span class="tut-link" onclick="closeModal();TUT.welcome()">↻ Restart guided tour</span></div>
    </div>`);
  mb.appendChild(d);
}

/* ---------------- hooks into the app (re-attach after renders / tab switches) ---------------- */
["render","renderList","renderTable","renderDash","renderFollow","renderCamp"].forEach(fn=>{
  const o=window[fn];if(typeof o!=="function")return;
  window[fn]=function(){const r=o.apply(this,arguments);schedule();return r;};
});
const _go=window.go;
window.go=function(t){const r=_go.apply(this,arguments);closeMini();if(cur<0){closeIntro();showIntro(t);}schedule();return r;};
const _ocs=window.openCampaignSettings;
window.openCampaignSettings=function(){const r=_ocs.apply(this,arguments);injectSettingsRow();return r;};

/* keyboard: ← → advance, Esc ends (only while the tour runs, never while typing) */
document.addEventListener("keydown",e=>{
  if(cur<0)return;
  const tag=(document.activeElement||{}).tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  if(e.key==="ArrowRight"){e.preventDefault();TUT.next();}
  else if(e.key==="ArrowLeft"){e.preventDefault();TUT.back();}
  else if(e.key==="Escape"){endTour(false);}
});
window.addEventListener("resize",()=>{if(cur>=0)place();schedule();});
window.addEventListener("scroll",()=>{if(cur>=0)place();else repositionSpots();},{passive:true});

/* ---------------- public API (used by inline onclick handlers) ---------------- */
window.TUT={
  toggle:()=>setOn(!on),
  start:()=>{if(!on)setOn(true);startTour(0);},
  explore:()=>{if(!on)setOn(true);seenTabs.delete(ST.tab);attachSpots();showIntro(ST.tab);},
  off:()=>setOn(false),
  welcome,
  next:()=>{cur===TUT_STEPS.length-1?endTour(true):goStep(cur+1);},
  back:()=>{if(cur>0)goStep(cur-1);},
  end:()=>endTour(false),
  tourFrom:id=>{const i=TUT_STEPS.findIndex(s=>s.id===id);if(i<0)return;if(!on)setOn(true);startTour(i);},
  closeMini,closeIntro
};

/* ---------------- boot ---------------- */
if(on)attachSpots();
if(firstRun){seenTabs.add(ST.tab);welcome();}   // welcome covers the first tab's intro
else if(on)showIntro(ST.tab);
})();
</script>
</body>
</html>
