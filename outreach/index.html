<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; media-src data: blob:; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach Engine demo</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2330; --muted:#5b6675; --line:#e3e7ec;
  --accent:#3858c6; --accent-soft:#e9eefb; --teal:#0f8f74; --teal-soft:#e1f4ef;
  --amber:#9a6a00; --amber-soft:#fbf0d8; --red:#b4322b; --red-soft:#fbe9e7;
  --green:#2f7d32; --green-soft:#e7f3e8; --purple:#5b3fb5; --purple-soft:#ece7fb;
  --shadow:0 1px 2px rgba(18,28,45,.06),0 4px 14px rgba(18,28,45,.05);
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.topin{display:flex;align-items:center;gap:26px;padding:0 26px;max-width:1320px;margin:0 auto}
.brand{font-weight:700;font-size:15px;letter-spacing:.2px;padding:13px 0 11px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand .li{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:12.5px;letter-spacing:.3px;flex:0 0 auto}
.brand .bcol{display:flex;flex-direction:column;justify-content:center;line-height:1.12}
.brand .bname{font-weight:700;font-size:15px;white-space:nowrap}
.brand .bsub{font-weight:400;color:var(--muted);font-size:11px;white-space:nowrap}
.brand .pbadge{align-self:flex-start;background:#f59e0b;color:#111;font-size:8px;font-weight:800;padding:1px 5px;border-radius:4px;letter-spacing:.6px;margin:2px 0 1px;line-height:1.45}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:1px}
.tabs{display:flex;gap:4px;align-self:stretch}
.tab{display:flex;align-items:center;gap:6px;padding:0 15px;font-weight:600;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
/* two-row header to match the LinkedIn Engine: compact utility/breadcrumb row on top,
   roomier main nav below (more padding + space between items) */
.crumbrow{padding-top:6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
#tutPillSlot{display:flex;align-items:center;flex:0 0 auto}
.crumbrow .tut-pill{font-size:10.5px;padding:3px 10px;margin:0}
.topin:not(.crumbrow){gap:36px;padding-left:26px;padding-right:26px}
.topin:not(.crumbrow) .tabs{gap:9px}
.topin:not(.crumbrow) .tab{padding:0 19px}
.tab .tc{font-size:11px;font-weight:700;background:#eef1f5;color:var(--muted);border-radius:999px;padding:1px 7px}
.tab.active .tc{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}
.pipe{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.pipe b{color:var(--ink)}
.pipe .arr{color:#c2cad6}
/* ---- main ---- */
.main{padding:24px 26px 70px;max-width:1320px;margin:0 auto}
h1{font-size:22px;margin:0 0 3px}
.lede{color:var(--muted);margin:0 0 18px;max-width:78ch}
.view{display:none}
.view.show{display:block}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 3px;font-size:15px}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:960px){.grid2,.grid3{grid-template-columns:1fr}}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow)}
.kpi b{font-size:24px;display:block;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.tealk b{color:var(--teal)} .kpi.acck b{color:var(--accent)}
.kpi.grnk b{color:var(--green)} .kpi.redk b{color:var(--red)}
.kpi.purk b{color:var(--purple)}
/* bar chart */
.barrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
.barrow .lab{width:120px;color:var(--muted);text-align:right;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .track{flex:1;background:#eef1f5;border-radius:5px;height:16px;overflow:hidden}
.barrow .track i{display:block;height:100%;background:var(--accent);border-radius:5px}
.barrow .track i.teal{background:var(--teal)} .barrow .track i.amber{background:var(--amber)}
.barrow .val{width:34px;font-weight:600;font-variant-numeric:tabular-nums}
/* buttons */
.btn{font:inherit;font-weight:600;font-size:13px;border-radius:9px;padding:8px 15px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.teal{background:var(--teal);border-color:var(--teal)}
.btn.teal.ghost{background:#fff;color:var(--teal)}
.btn.gray{background:#fff;color:var(--muted);border-color:var(--line)}
.btn.amber{background:var(--amber);border-color:var(--amber)}
.btn.red.ghost{background:#fff;color:var(--red);border-color:#f2cfca}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:8px}
.btn.xs{padding:2px 8px;font-size:11px;border-radius:7px;font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
/* toolbar */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{font:inherit;font-size:12.5px;font-weight:600;border:0;background:#fff;color:var(--muted);padding:7px 13px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg button+button{border-left:1px solid var(--line)}
input[type=text],input[type=search],select,textarea{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--ink);background:#fff}
input[type=search]{min-width:230px}
.sel{position:relative}
/* table */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:var(--panel);max-height:calc(100vh - 290px)}
.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 2px 0;font-size:12.5px;color:var(--muted)}
.pager select{font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
.pager .pinfo{font-variant-numeric:tabular-nums}
/* row count above the table — the same total the pager reports at the bottom, so the size
   of a filtered list is legible without scrolling. */
.rowcount{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px;padding:0 2px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rowcount b{color:var(--ink);font-weight:600}
.rowcount .rc-note{color:var(--muted)}
.actstatus{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:12.5px;color:var(--muted)}
.actstatus .ic{color:var(--accent)}
.actstatus b{color:var(--ink);font-weight:600}
.gact{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px;cursor:pointer;user-select:none;white-space:nowrap}
.gact .dripdot{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulsedot 1s infinite}
@keyframes pulsedot{0%,100%{opacity:.3}50%{opacity:1}}
/* inline button spinner — a long bulk action must LOOK like it's running (added 2026-07-18) */
.spin{display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-right:5px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
button:disabled{cursor:progress}
.presetsel{font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
tr.grouprow td{background:#eef2fb;font-weight:600;border-top:2px solid var(--line)}
input.cellin{width:100%;font:inherit;padding:2px 5px;border:1px solid var(--accent);border-radius:5px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{background:#fafbfc;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}
th.nosort{cursor:default}
th .arr{color:var(--accent);font-size:10px;margin-left:3px}
tbody tr:hover{background:#f7f9fc}
tr.om td{color:#aab2bd}
tr.om td .nm{text-decoration:line-through;text-decoration-color:#d8a39e}
.lead{font-weight:600;color:var(--ink)}
td .acct{color:var(--muted);font-size:12px}
.ck{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
.linkish{color:var(--accent);cursor:pointer}
.linkish:hover{text-decoration:underline}
/* pills */
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid;line-height:1.5}
/* focused-firm 🎯 badge — same glyph + sizing as the LinkedIn Engine's .badge-focus, so one
   symbol means one thing in both tools (it's also the Focus review queue's button glyph). */
.badge-focus{font-size:10.5px;vertical-align:1px}
.p-grn{color:var(--green);background:var(--green-soft);border-color:#c7e3c8}
.p-amb{color:var(--amber);background:var(--amber-soft);border-color:#ecd9a8}
.p-red{color:var(--red);background:var(--red-soft);border-color:#f2cfca}
.p-acc{color:var(--accent);background:var(--accent-soft);border-color:#d4ddf7}
.p-teal{color:var(--teal);background:var(--teal-soft);border-color:#c5e8df}
.p-pur{color:var(--purple);background:var(--purple-soft);border-color:#d8cdf3}
.p-gray{color:var(--muted);background:#eef1f5;border-color:var(--line)}
.tag{display:inline-block;font-size:10.5px;color:var(--muted);background:#eef1f5;border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin:1px 3px 1px 0}
.muted{color:var(--muted)} .tnum{font-variant-numeric:tabular-nums}
/* bulk bar */
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:40;background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(18,28,45,.28)}
.bulk b{font-size:14px} .bulk .x{cursor:pointer;color:#aab2bd;margin-left:4px}
.bulk .btn{padding:6px 12px;font-size:12.5px}
.bulk .btn.gray{background:#2b3446;color:#dfe4ec;border-color:#3a4459}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(18,28,45,.32);z-index:50;display:none}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:480px;max-width:94vw;background:var(--panel);border-left:1px solid var(--line);z-index:51;transform:translateX(100%);transition:transform .18s;overflow:auto;box-shadow:-8px 0 30px rgba(18,28,45,.12)}
.drawer.show{transform:translateX(0)}
.dhead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:18px 20px;display:flex;align-items:flex-start;gap:10px}
.dhead h2{margin:0;font-size:18px} .dhead .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.dclose{margin-left:auto;cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
.dbody{padding:18px 20px 40px}
.frow{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid #f0f2f5;font-size:13px}
.frow .fl{width:120px;color:var(--muted);flex:0 0 auto} .frow .fv{flex:1}
.sechead{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 0 6px;font-weight:700}
.hist{border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:7px;font-size:12.5px}
.hist b{font-size:13px}
/* editable CRM drawer */
.dtitle{font-size:18px;font-weight:700;border:1px solid transparent;border-radius:7px;padding:3px 6px;margin:-3px 0 0 -6px;width:100%;color:var(--ink);background:transparent}
.dtitle:hover{border-color:var(--line)} .dtitle:focus{border-color:var(--accent);background:#fff;outline:none}
.dedit .frow{align-items:center}
.dedit .frow .fv input,.dedit .frow .fv select{width:100%;max-width:300px}
.cnotes{width:100%;resize:vertical;min-height:64px}
.secnote{text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)}
.sechead .secbtn{float:right;margin-top:-4px}
.hist.fu .btnrow input{font-size:12px;padding:5px 8px}
.hist.fu.fudone{opacity:.62}
/* stage-cell follow-up tick + overdue tab badge */
.futick{font-size:10.5px;margin-left:5px;color:var(--amber);white-space:nowrap}
.futick.od{color:var(--red);font-weight:700}
.fudue{color:var(--red);font-weight:600}
.tab .tc.due{background:var(--red);color:#fff}
.futbl td{vertical-align:top}
/* SES sending-health card */
.seshealth .shhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;cursor:pointer;user-select:none}
.seshealth.collapsed .shhead{margin-bottom:0}
.seshealth .shhead h3{margin:0}
.seshealth .shhead .caret{color:var(--muted);font-size:12px;margin-right:2px}
.seshealth .shhead:hover .caret{color:var(--ink)}
.shtbl td{vertical-align:top}
.meter{height:7px;background:#eef1f5;border-radius:999px;overflow:hidden;margin-bottom:3px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
/* stage manager */
.stagelist{display:flex;flex-direction:column;gap:7px;margin-bottom:4px}
.stagerow{display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid var(--line);border-radius:9px}
.stagerow select{font-size:12px;padding:4px 7px}
/* clickable website link in the accounts row */
td a.weblink{display:inline-block;color:var(--accent);font-size:12px;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
td a.weblink.acct{margin-left:8px}   /* breathing room between the account name and its inline URL */
td a.weblink:hover{text-decoration:underline}
/* guide / banner */
.guide{border:1px solid #d4ddf7;background:#fbfcff;border-radius:11px;padding:14px 16px;margin:0 0 18px;font-size:13px;color:var(--muted);display:flex;gap:11px}
.guide.teal{border-color:#c5e8df;background:#f6fdfb}
.guide.purple{border-color:#d8cdf3;background:#faf8ff}
.guide b{color:var(--ink)}
.guide .ic{font-size:18px;flex:0 0 auto}
/* refine panel */
.refbox{border:1px dashed #c9b27a;background:var(--amber-soft);border-radius:10px;padding:12px 14px;font-size:12.5px}
.refbox h4{margin:0 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--amber)}
.refrow{display:flex;align-items:center;gap:9px;padding:5px 0;border-top:1px solid #ecdcb6}
.refrow:first-of-type{border-top:0}
.refrow .rc{margin-left:auto;font-weight:700;color:var(--amber)}
/* campaigns layout */
/* The campaign list is command-and-control, not a nav rail: it carries readiness,
   schedule and progress, so it needs real width. */
.camplay{display:grid;grid-template-columns:400px 1fr;gap:18px;align-items:start}
@media(max-width:1200px){.camplay{grid-template-columns:340px 1fr}}
@media(max-width:960px){.camplay{grid-template-columns:1fr}}
/* readiness checklist on the card */
.rdy{margin:8px 0 2px;border-radius:8px;padding:7px 9px;font-size:11.5px;border:1px solid}
.rdy.go{background:#f2fbf4;border-color:#cfe9d4;color:#1e6b32}
.rdy.blocked{background:#fff7e6;border-color:#f0dcb0;color:#8a5d0d}
.rdy .rrow{display:flex;gap:6px;align-items:flex-start;margin-top:3px}
.rdy .rrow:first-child{margin-top:0}
.rdy .rmark{flex:0 0 12px;font-weight:700}
.rdy .fixlink{text-decoration:underline;cursor:pointer;font-weight:600}
.rdyhead{font-weight:700;display:flex;align-items:center;gap:6px}
/* inline schedule controls on the card */
.cschd{margin:8px 0 2px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:#fbfcfe}
.cschd .armlbl{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.schinline{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.schinline select{padding:2px 4px;font-size:11.5px}
.schinline input[type=number]{width:56px;padding:2px 4px;font-size:11.5px}
.clist .citem{border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:9px;cursor:pointer;background:#fff}
.clist .citem:hover{border-color:#c8d2e8}
.clist .citem.on{border-color:var(--accent);background:var(--accent-soft)}
.clist .citem .cn{font-weight:600;font-size:13.5px}
.clist .citem .cm{font-size:11.5px;color:var(--muted);margin-top:3px}
/* per-campaign schedule panel */
.schedgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:12px}
.schedgrid label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.dayrow{display:flex;gap:4px}
.daybtn{width:26px;height:26px;line-height:24px;text-align:center;border:1px solid var(--line);
  border-radius:6px;font-size:11.5px;cursor:pointer;user-select:none;background:#fff;color:var(--muted)}
.daybtn:hover{border-color:#c8d2e8}
.daybtn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
/* campaign card: progress bar + hover send-log panel */
.cprog{margin:8px 0 2px;position:relative}
.cprog .meter{margin-bottom:2px}
.cprog .cpl{font-size:11px;color:var(--muted)}
.cprog .cwarn{font-size:11px;color:#9a6a12;background:#fff7e6;border:1px solid #f0dcb0;border-radius:6px;padding:4px 7px}
.clogx{font-size:11px;margin-left:5px;white-space:nowrap}
.clog{display:none;position:absolute;z-index:60;left:0;top:100%;margin-top:6px;width:290px;
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;
  box-shadow:0 10px 26px rgba(20,30,60,.16);cursor:default}
.chas:hover .clog{display:block}
.clogh{font-weight:600;font-size:11.5px;margin-bottom:6px}
.clogt{width:100%;border-collapse:collapse;font-size:11px}
.clogt th{text-align:left;color:var(--muted);font-weight:500;padding:2px 5px 4px 0;border-bottom:1px solid var(--line)}
.clogt td{padding:2px 5px 2px 0;white-space:nowrap}
.sparkb{height:5px;background:#eef1f5;border-radius:999px;overflow:hidden}
.sparkb i{display:block;height:100%;background:var(--accent)}
.statline{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 0}
.statline .s{font-size:11.5px;color:var(--muted)} .statline .s b{color:var(--ink);font-size:13px}
.tmpl{border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px}
.tmpl.win{border-color:#c7e3c8;background:var(--green-soft)}
.tmpl .th{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.tmpl .subj{font-weight:600;font-size:13.5px}
.tmpl .body{font-size:12.5px;color:var(--muted);white-space:pre-wrap;border-left:2px solid var(--line);padding-left:10px;margin:6px 0}
.tmpl .abstat{display:flex;gap:16px;font-size:12px;align-items:center}
.tmpl .abstat b{font-size:14px}
.sendbox{border:1px solid #ecd9a8;background:var(--amber-soft);border-radius:11px;padding:15px 16px}
.sendbox h3{color:var(--amber);margin:0 0 9px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.field label{font-weight:600}
.bar{height:11px;border-radius:6px;background:#fff;border:1px solid #ecd9a8;overflow:hidden;margin:11px 0 6px}

.to{background:var(--ink);color:#fff;padding:10px 15px;border-radius:9px;font-size:13px;box-shadow:0 6px 20px rgba(18,28,45,.25);animation:tin .2s}
.to.ok{background:#1f5e34} .to.warn{background:#7c5300}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.colpanel{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:9px;z-index:20;min-width:170px;display:none}

.rsz{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;user-select:none}
.rsz:hover{background:#c8d2e8}

/* modal */

/* Safety net: .modal itself is unpadded because content is meant to supply
   .mhead/.mbody. A modal built without them ran flush to the edges, so give
   any such modal sane padding rather than relying on every caller remembering. */

/* filter / sort / views / quick filters */
.cnt{font-size:10.5px;font-weight:700;background:rgba(255,255,255,.25);border-radius:999px;padding:0 6px;margin-left:5px}

.builderbox{border:1px solid var(--line);border-radius:11px;background:var(--panel);box-shadow:var(--shadow);padding:14px 16px;margin:0 0 14px}
.builderbox .bh{display:flex;align-items:center;gap:10px;margin-bottom:11px}

/* Filter + Sort side by side when both are open (wrap on narrow widths) */
.builderrow{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;margin:0 0 14px}
.builderrow>.builderbox{flex:1 1 340px;min-width:0;margin:0}
.condrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.condrow select,.condrow input[type=text],.condrow input[type=number]{font-size:12.5px;padding:6px 9px}
.condrow .conj{width:58px;color:var(--muted);font-size:12px;font-weight:600;text-align:right}
.condrow .del{cursor:pointer;color:var(--muted);font-size:15px;padding:0 4px;line-height:1}
.condrow .del:hover{color:var(--red)}
.matchtog{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.matchtog button{font:inherit;font-size:11.5px;font-weight:600;border:0;background:#fff;color:var(--muted);padding:5px 10px;cursor:pointer}

.mspop{position:absolute;z-index:70;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(18,28,45,.18);padding:7px;min-width:172px;max-height:280px;overflow:auto}

.seltag{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 4px 2px 9px;font-size:11.5px;font-weight:600}

/* inline row actions */
.rowacts{display:inline-flex;gap:4px;vertical-align:middle}
.ra{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:19px;padding:0 5px;border:1px solid var(--line);border-radius:6px;font-size:10.5px;font-weight:700;color:var(--muted);background:#fff;cursor:pointer;line-height:1}
.ra:hover{border-color:#c8d2e8;color:var(--ink)}
.ra.li{color:var(--purple);border-color:#d8cdf3}

.ra.fok{color:var(--green);border-color:#c7e3c8}
.ra.fok:hover{background:var(--green-soft)}
.ra.fno{color:var(--red);border-color:#f2cfca}
.ra.fno:hover{background:var(--red-soft)}
/* campaign settings rules */
.rulerow{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid #f0f2f5}
.rulerow:first-of-type{border-top:0}
.rinfo{flex:1} .rinfo b{font-size:13.5px} .rinfo .muted{font-size:12px;margin-top:2px;line-height:1.4}

.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track:before{transform:translateX(14px)}

<div class="top">

       (copy + merge tags + signature + preview) needs real room. Reached from a campaign,

<script>
/* ============================================================================
   PROTOTYPE MOCK BACKEND
   ----------------------------------------------------------------------------
   This file is the REAL Outreach Engine UI (index.html, verbatim) running with
   no server behind it. Everything below intercepts window.fetch and answers the
   app's ~10 API endpoints from synthetic data generated in the browser.

   Why it's built this way: the demo used to be a hand-maintained copy of
   the UI, and it fell eight days behind the real app because every change had
   to be ported by hand. Now the UI file is copied verbatim and only this shim
   is maintained, so a re-sync is a file copy.

   ALL DATA HERE IS FAKE. Agencies, people, emails and domains are generated
   from word lists with a seeded PRNG — no real contact ever reaches this file.
   That matters: this repo is shared with clients. Never paste live data in.

   Deterministic by design (seeded PRNG), so the demo looks the same on every
   load and screenshots stay stable.
   ========================================================================== */
(function(){
"use strict";

/* ---------- seeded PRNG (mulberry32) — deterministic demo, every reload ---- */
let _s=0x9E3779B9;
function rnd(){_s|=0;_s=_s+0x6D2B79F5|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const pick=a=>a[Math.floor(rnd()*a.length)];
const chance=p=>rnd()<p;
const iso=d=>d.toISOString().slice(0,10);
const dayShift=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d);};
const TODAY=iso(new Date());

/* ---------- word lists (all invented) ------------------------------------- */
const A1=["North","Bright","Iron","Cedar","Summit","Harbor","Field","Copper","Lantern","Meridian","Anchor","Willow","Forge","Compass","Rivet","Quarry","Marble","Beacon","Tandem","Hollow"];
const A2=["Peak","Lane","Works","Field","House","Bridge","Yard","Grove","Point","Ridge","Court","Row","Line","Gate","Park"];
const A3=["Studio","Agency","Group","Collective","Labs","Creative","Partners","Co.","Media","Digital"];
const FIRST=["Dana","Marcus","Priya","Nolan","Rosa","Ellis","Tomas","Ingrid","Devon","Amara","Curtis","Lena","Bram","Saoirse","Oskar","Neve","Rafe","Juno","Hollis","Marisol","Theo","Wren","Casper","Imani"];
const LAST=["Whitfield","Okafor","Lindqvist","Barrera","Nakamura","Delacroix","Achebe","Bergstrom","Vasquez","Thornbury","Mwangi","Kowalski","Ferreira","Haddad","Sorensen","Ibarra","Novak","Rasmussen"];
const TITLES=[["Founder",.30],["Owner",.14],["Principal",.08],["Managing Partner",.06],["CEO",.10],["Creative Director",.10],["Marketing Director",.08],["Head of Growth",.06],["Account Director",.08]];
const CITIES=[["Raleigh","NC"],["Austin","TX"],["Portland","OR"],["Denver","CO"],["Nashville","TN"],["Madison","WI"],["Providence","RI"],["Boise","ID"],["Savannah","GA"],["Burlington","VT"],["Tacoma","WA"],["Omaha","NE"]];
const CATS=["Creative Agency","Digital Marketing","SEO Agency","Branding Studio","Web Design","Content Marketing","PR Agency"];
const SERVICES=["Brand strategy","Web design","SEO","Paid media","Content","Email marketing","Video","UX research"];
const INDUSTRIES=["Healthcare","Nonprofit","SaaS","Higher ed","Hospitality","Manufacturing","Retail","Financial services"];
const ROLE_INBOX=["info","hello","contact","studio","team","hi"];

function weighted(pairs){let r=rnd(),acc=0;for(const[v,w]of pairs){acc+=w;if(r<=acc)return v;}return pairs[pairs.length-1][0];}

/* ---------- generate accounts + contacts ---------------------------------- */
const N_ACC=420;
const accounts=[],contacts=[];
for(let i=0;i<N_ACC;i++){
  const [city,state]=pick(CITIES);
  const name=pick(A1)+" "+pick(A2)+" "+pick(A3);
  const domain=name.toLowerCase().replace(/[^a-z]+/g,"")+".example";   // .example is reserved — never resolves
  const band=weighted([["solo",.20],["2-10",.42],["11-50",.26],["51-200",.09],["201+",.03]]);
  const tier=weighted([["A",.12],["B",.44],["C",.30],["D",.14]]);
  const focused=chance(.38);
  accounts.push({
    id:i, name, city, state, category:pick(CATS),
    rating:+(3.5+rnd()*1.5).toFixed(1), reviews:Math.floor(6+rnd()*190),
    size_band:band, est_staff:band==="solo"?1:Math.floor(3+rnd()*60),
    website:"https://"+domain, website_source:"maps", fit_tier:tier,
    account_score:Math.round(20+rnd()*70), status:chance(.06)?"omitted":"active",
    omitReason:null, tags:[], notes:"", reviewed:chance(.3),
    is_focused:focused, focus_type:focused?pick(["vertical","horizontal+vertical"]):"horizontal",
    focus_type_model:"demo", focus_feedback:null, focus_feedback_at:null, focus_feedback_verdict:null,
    niche_clarity:focused?+(0.5+rnd()*0.5).toFixed(2):null, niche_evidence:"",
    specialization:focused?pick(INDUSTRIES)+" agencies":"", services:SERVICES.slice(0,2+Math.floor(rnd()*3)).join(", "),
    industries:INDUSTRIES.slice(0,1+Math.floor(rnd()*3)).join(", "), target_customer_type:pick(["B2B","B2C","Both"]),
    vertical_flag:focused, company_linkedin:chance(.5)?"https://linkedin.example/company/"+domain.split(".")[0]:"",
    fran:chance(.07), thin:chance(.09), source:"maps", times_seen:1,
    first_seen_city:city, first_seen_state:state, _deleted:false
  });
  const n=1+Math.floor(rnd()*3);
  for(let k=0;k<n;k++){
    const generic=chance(.30);
    const f=pick(FIRST), l=pick(LAST);
    const scraped=chance(.62);
    const vs=weighted([["valid",.60],["unknown",.24],["invalid",.08],["risky",.05],["catch_all",.03]]);
    const tags=[];
    if(generic)tags.push("generic");
    if(scraped&&vs!=="valid")tags.push("trusted:site-email");
    if(chance(.05))tags.push("tried:intro");
    contacts.push({
      id:contacts.length, accountId:i,
      name:generic?"":f+" "+l, first_name:generic?"":f,
      title:generic?pick(["",""]):weighted(TITLES),
      email:(generic?pick(ROLE_INBOX):f.toLowerCase()+"."+l.toLowerCase())+"@"+domain,
      emailGuessed:scraped?0:1, verify_status:vs, verified:vs==="valid",
      email_confidence:Math.round(40+rnd()*60), emailState:"none",
      nameValidated:!generic, merge_ready:!generic,
      status:chance(.05)?"omitted":"active", omitReason:null, stage:"new",
      tags, notes:"", reviewed:chance(.25), cleared:chance(.4),
      rank:Math.round(10+rnd()*80), scoreBase:Math.round(10+rnd()*70), scoreAdj:0,
      score_provisional:false, lead_tier:pick(["A","B","C"]),
      hasLinkedin:chance(.55), linkedin_url:chance(.55)?"https://linkedin.example/in/"+f.toLowerCase()+l.toLowerCase():"",
      // enum fields must use values the UI's lookup tables actually contain —
      // LSTATE[""] is undefined and the destructure in cell() throws, killing the table.
      linkedinActive:chance(.3), linkedinState:chance(.12)?"synced":"none",
      li_fit:chance(.5)?Math.round(rnd()*100):null,
      liActivity:null, liStage:chance(.08)?pick(["request_sent","accepted","warming","intro_sent"]):"",
      liBlock:chance(.03), liBlockReason:"existing client", liSyncEligible:chance(.4),
      cadence:pick(["none","weekly","monthly","rare",""]), activityStatus:pick(["na","enriched","pending"]),
      source:pick(["discovery","remine","li_people","deep_scrape"]), _deleted:false
    });
  }
}

/* ---------- campaigns: the same six-cell matrix the real system runs ------- */
const SEQ=[
  ["Step 1 · Intro","Not another AI platform email",0,"enrollment"],
  ["Step 2 · Follow-up","When AI experimentation becomes a time sink",3,"prev"],
  ["Step 3 · Final follow-up","The uncomfortable flip side to AI productivity",3,"prev"],
  ["Step 4","Why I'm focused on agency AI adoption",3,"prev"],
  ["Step 5","A low-risk way to get started",3,"prev"]
];
const DEMO_BODY=`Hi {{first_name}},

I know agency leaders are getting buried in AI emails, so I'll start by clarifying what this isn't. I'm not trying to sell you another AI software platform.

We help creative and marketing firms figure out where AI is actually worth applying, and how to get to useful results without losing months to scattered experiments.

Is AI use at {{company}} still mostly ad hoc, or have you started approaching it systematically?

{{email_signature}}`;

const CAMP_DEFS=[
  [1,"Demo Intro · B · Small agencies (2–10)","demo-hello",false,["B"],["2-10","1-10","solo"],10,"active",true,9],
  [2,"Demo Intro · B · Mid agencies (11–50)","demo-outreach",false,["B"],["11-50"],10,"active",true,10],
  [3,"Demo Intro · B · Larger agencies (51+)","demo-connect",false,["B"],["51-200","201+"],10,"draft",false,11],
  [4,"Demo Warm-up · Generic inboxes · Small","demo-hello",true,null,["2-10","1-10","solo"],50,"draft",false,13],
  [5,"Demo Warm-up · Generic inboxes · Mid","demo-outreach",true,null,["11-50"],50,"draft",false,14],
  [6,"Demo Warm-up · Generic inboxes · Larger","demo-connect",true,null,["51-200","201+"],50,"draft",false,15]
];
const campaigns=CAMP_DEFS.map(([id,name,sender,np,tier,bands,prio,status,auto,hour])=>{
  const steps=SEQ.map(([nm,subj,delay,after],ix)=>({
    stepNumber:ix+1,name:nm,delayDays:delay,delayAfter:after,subject:subj,
    body:np?DEMO_BODY.replace(/^Hi \{\{first_name\}\},\n\n/,""):DEMO_BODY,
    sent:0,variants:[{id:id*100+ix,campaignId:id,stepNumber:ix+1,name:nm,variant:"A",
      subject:subj,body:np?DEMO_BODY.replace(/^Hi \{\{first_name\}\},\n\n/,""):DEMO_BODY,
      delayDays:delay,delayAfter:after,sent:0,replied:0}]}));
  const crit={wave:1,size_bands:bands,require_valid_email:true,exclude_tried_intro:true,hold_li_funnel:true};
  if(tier)crit.tier=tier; else {crit.personalized=false;crit.warmup_generic=true;}
  return {id,name,sender,status,group:np?"demo-warmup-generic":"demo-intro-b",
    segment:(np?"Generic inboxes":"Tier B")+" · "+bands.join("/")+" → "+sender,
    segmentCriteria:JSON.stringify(crit),nonPersonalized:np,
    templates:steps.flatMap(s=>s.variants),steps,
    warmup:true,warmupDay:status==="active"?2:0,
    warmupStartedAt:status==="active"?dayShift(-1):null,warmupCap:10,sentTodayIdentity:0,
    autoSend:auto,dailyCap:100,sendDays:"mon,tue,wed,thu,fri",skipHolidays:true,
    sendHour:hour,priority:prio,enrolled:0,reached:0,sendLog:[],
    seqStats:{active:0,replied:0,interested:0,notInterested:0,unsubscribed:0,bounced:0,completed:0,paused:0},
    dueToday:0};
});

/* enrol a slice of matching contacts so the demo has a populated pipeline */
const enrollments=[];
function accOf(c){return accounts[c.accountId];}
campaigns.forEach(cp=>{
  if(cp.status!=="active")return;
  let crit={};try{crit=JSON.parse(cp.segmentCriteria);}catch(e){}
  const pool=contacts.filter(c=>{
    const a=accOf(c);
    if(c.status!=="active"||a.status!=="active")return false;
    if(crit.tier&&!crit.tier.includes(a.fit_tier))return false;
    if(crit.size_bands&&!crit.size_bands.includes(a.size_band))return false;
    const isGeneric=(c.tags||[]).includes("generic");
    return cp.nonPersonalized?isGeneric:(!isGeneric&&c.nameValidated);
  });
  const take=pool.slice(0,Math.min(pool.length,cp.id===1?180:120));
  take.forEach((c,ix)=>{
    const reached=ix<10;
    enrollments.push({campaignId:cp.id,contactId:c.id,templateId:cp.templates[0].id,
      status:reached?"sent":"queued",seqStatus:"active",currentStep:reached?1:0,
      nextSendAt:reached?dayShift(3):TODAY,exitReason:null});
    if(reached)c.emailState="sent"; else if(c.emailState==="none")c.emailState="queued";
  });
  cp.enrolled=take.length; cp.reached=Math.min(10,take.length);
  cp.steps[0].sent=cp.reached; cp.templates[0].sent=cp.reached;
  cp.seqStats.active=take.length;
  cp.sendLog=[{date:dayShift(-1),sent:cp.reached,failed:0,people:cp.reached}];
  cp.sentTodayIdentity=0;
});

const stages=[["new","New","slate",0],["contacted","Contacted","blue",1],["interested","Interested","green",2],
  ["followup","Follow-up","amber",3],["customer","Customer","violet",4],["not_interested","Not interested","gray",5]]

  [3,"incampaign","Skip already in this campaign",true,false],[4,"firstname","Require a usable first name (merge)",true,false],
  [5,"verified","Require a verified email",false,false],[6,"cleared","Only send to cleared-for-send contacts",false,false]]
  .map(([id,kind,label,enabled,locked])=>({id,kind,param:null,label,enabled,locked,isCustom:false}));

const DEMO_SIGNATURE='<table cellpadding="0" cellspacing="0" style="font-family:Arial,sans-serif;background:#f95301;color:#fff"><tr><td style="padding:14px 18px"><b style="font-size:15px">Demo Sender</b><br><span style="font-size:12px">Example Consulting · demo@example.com</span></td></tr></table>';

/* ---------- mutable settings the UI can change --------------------------- */
const settings={sequence_auto:false,linkedin_auto_sync:true,identity_daily_cap:200,
  email_signature:DEMO_SIGNATURE,send_skip_weekends:true,send_holidays:[]};
let runToday=null;   // send_runs row for today

/* ---------- the scheduler planner, ported from autosend.plan() ------------ */
const RAMP=[[2,10],[4,15],[7,25],[10,40],[14,60],[18,90],[21,120],[25,160],[28,200]];
const DAYK=["mon","tue","wed","thu","fri","sat","sun"];
function rampFor(day){for(const[t,c]of RAMP)if(day<=t)return c;return 200;}
function buildPlan(ignoreClock){
  const now=new Date(), wd=DAYK[(now.getDay()+6)%7], hour=now.getHours();
  const byId={};
  campaigns.filter(c=>c.status==="active"&&c.autoSend).forEach(c=>{(byId[c.sender]=byId[c.sender]||[]).push(c);});
  const out=[];let total=0;
  Object.keys(byId).sort().forEach(sender=>{
    const grp=byId[sender];
    const warming=grp.filter(c=>c.warmup&&c.warmupStartedAt);
    const sentToday=grp.reduce((n,c)=>n+(c.sentTodayIdentity||0),0);
    let budget,basis;
    if(warming.length){const d=warming[0].warmupDay||1;budget=Math.max(0,rampFor(d)-sentToday);basis=`warm-up day ${d} — ${rampFor(d)}/day ceiling`;}
    else{budget=Math.max(0,settings.identity_daily_cap-sentToday);basis=`steady ${settings.identity_daily_cap}/day`;}
    let remaining=budget;
    const entry={identity:sender,budget,basis,sentToday,warmupDay:(warming[0]||{}).warmupDay||null,campaigns:[]};
    grp.sort((a,b)=>(a.priority-b.priority)||(a.id-b.id)).forEach(c=>{
      const due=enrollments.filter(e=>e.campaignId===c.id&&e.seqStatus==="active"&&(!e.nextSendAt||e.nextSendAt<=TODAY)).length;
      const days=(c.sendDays||"").split(",");
      const already=c.sentTodayIdentity||0;
      const capLeft=Math.max(0,(c.dailyCap||50)-already);
      let send=0,why="";
      if(!days.includes(wd))why=`${wd} not in send days`;
      else if(!ignoreClock&&hour<(c.sendHour??9))why=`not before ${String(c.sendHour??9).padStart(2,"0")}:00`;
      else if(!due)why="nobody due";
      else if(!capLeft)why=`campaign cap ${c.dailyCap}/day reached`;
      else if(!remaining)why=`address budget spent (${basis})`;
      else send=Math.min(due,capLeft,remaining);
      remaining-=send;total+=send;
      entry.campaigns.push({id:c.id,name:c.name,send,why,due,sentToday:already,cap:c.dailyCap,priority:c.priority,sendHour:c.sendHour});
    });
    entry.remaining=remaining;out.push(entry);
  });
  return {day:TODAY,identities:out,total,
    enabled:settings.sequence_auto,serverRunnerLive:settings.sequence_auto,
    taskInstalled:false,needsRestart:false,canSend:settings.sequence_auto,run:runToday};
}

/* ---------- SES health: same SHAPE the live panel consumes ---------------- */
function sesHealth(){
  const series=[];
  for(let i=14;i>=0;i--){
    const attempts=Math.round(120+rnd()*700), bounces=chance(.55)?Math.round(attempts*(0.005+rnd()*0.04)):0;
    series.push({date:dayShift(-i),attempts,bounces,complaints:0,rejects:0,
      bounceRate:+(bounces/attempts*100).toFixed(2),complaintRate:0});
  }
  const at=series.reduce((n,d)=>n+d.attempts,0), bo=series.reduce((n,d)=>n+d.bounces,0);
  const ours=[["demo-hello","hello@example.com"],["demo-outreach","outreach@example.com"],["demo-connect","connect@example.com"]]
    .map(([id])=>{const sent=Math.round(80+rnd()*500),b=Math.round(sent*(0.01+rnd()*0.05));
      return {identity:id,sentEver:sent,bounced:b,bounceRate:+(b/sent*100).toFixed(2),
              sentWindow:Math.round(rnd()*40),lastSend:dayShift(-Math.floor(rnd()*20)),scope:"outreach-engine"};});
  return {fetchedAt:new Date().toISOString().slice(0,19),live:true,error:null,
    account:{scope:"account",sendingEnabled:true,enforcementStatus:"HEALTHY",productionAccess:true,
      max24h:50000,sent24h:series[series.length-1].attempts,maxRate:14,series,
      window:{attempts:at,bounces:bo,complaints:0,bounceRate:+(bo/at*100).toFixed(2),complaintRate:0,days:series.length}},
    identities:[{name:"example.com",type:"DOMAIN",verified:true,sendingEnabled:true,dkim:"SUCCESS",dkimSigning:true}],
    perDomain:[{configSet:"demo-campaigns",sent:at,bounces:bo,complaints:0,delivered:at-bo,
      bounceRate:+(bo/at*100).toFixed(2),complaintRate:0}],
    perDomainError:null, ours};
}

/* ---------- route table --------------------------------------------------- */
const OK={ok:true};
function handle(path,method,body){
  const q=path.indexOf("?")>=0?path.slice(path.indexOf("?")+1):"";
  const base=path.split("?")[0];
  switch(base){
    case "/api/bootstrap":   return bootstrap();
    case "/api/health":      return {ok:true,db:"demo (in-browser)"};
    case "/api/ses/health":  return _ses;
    case "/api/autosend/plan": return buildPlan(/now=1/.test(q));
    case "/api/send/state":  return {running:false,paused:false,stop:false,campaign_id:null,total:0,sent:0,failed:0,skipped:0,started_at:null,last_error:null,message:""};
    case "/api/send/config": return {identities:[
        {id:"demo-hello",label:"Demo · hello@example.com",from_email:"hello@example.com",configured:true},
        {id:"demo-outreach",label:"Demo · outreach@example.com",from_email:"outreach@example.com",configured:true},
        {id:"demo-connect",label:"Demo · connect@example.com",from_email:"connect@example.com",configured:true}],
        test_emails:["you@example.com"],default:"demo-hello"};
    case "/api/activity/state":   return {running:false,pending:0,doneToday:0,lastRun:null};
    case "/api/activity/history": return {series:[]};
    case "/api/activity/start":
    case "/api/activity/pause":   return OK;
    case "/api/settings":         Object.assign(settings,body||{}); return OK;
    case "/api/campaigns/schedule":{
      const c=campaigns.find(x=>x.id===body.campaignId);
      if(!c)return {ok:false,error:"no such campaign"};
      if(body.sendDays!==undefined){
        const d=String(body.sendDays).split(",").map(s=>s.trim().toLowerCase()).filter(x=>DAYK.includes(x));
        if(!d.length)return {ok:false,error:"pick at least one send day"};
        c.sendDays=DAYK.filter(x=>d.includes(x)).join(",");
      }
      if(body.autoSend!==undefined)c.autoSend=!!body.autoSend;
      if(body.skipHolidays!==undefined)c.skipHolidays=!!body.skipHolidays;
      if(body.dailyCap!==undefined)c.dailyCap=Math.max(1,Math.min(+body.dailyCap||0,5000));
      if(body.sendHour!==undefined)c.sendHour=Math.max(0,Math.min(+body.sendHour||0,23));
      if(body.priority!==undefined)c.priority=Math.max(0,Math.min(+body.priority||0,999));
      return {ok:true,plan:buildPlan(false)};
    }
    case "/api/autosend/run":{
      const p=buildPlan(!!(body&&body.now));
      if(!p.total)return {ok:true,sent:0,plan:p,note:"nothing due"};
      if(runToday)return {ok:true,sent:0,skipped:true,note:`already claimed by ${runToday.runner}`};
      let sent=0;
      p.identities.forEach(i=>i.campaigns.forEach(cc=>{
        if(cc.send<=0)return;
        const c=campaigns.find(x=>x.id===cc.id);
        const due=enrollments.filter(e=>e.campaignId===c.id&&e.seqStatus==="active"&&(!e.nextSendAt||e.nextSendAt<=TODAY)).slice(0,cc.send);
        due.forEach(e=>{e.currentStep=(e.currentStep||0)+1;e.status="sent";e.nextSendAt=dayShift(3);
          const ct=contacts[e.contactId];if(ct)ct.emailState="sent";});
        c.sentTodayIdentity=(c.sentTodayIdentity||0)+due.length;
        c.reached=Math.min(c.enrolled,(c.reached||0)+due.length);
        c.sendLog.unshift({date:TODAY,sent:due.length,failed:0,people:due.length});
        sent+=due.length;
      }));
      runToday={id:1,day:TODAY,scope:"all",runner:"demo",state:"done",
        started_at:new Date().toISOString().slice(0,19),finished_at:new Date().toISOString().slice(0,19),
        planned:p.total,sent,detail:null};
      return {ok:true,sent,planned:p.total,plan:buildPlan(false)};
    }
    case "/api/enroll":{
      const c=campaigns.find(x=>x.id===body.campaignId);
      if(!c)return {ok:false,error:"no such campaign"};
      let added=0;
      (body.contactIds||[]).forEach(cid=>{
        if(enrollments.some(e=>e.campaignId===c.id&&e.contactId===cid))return;
        enrollments.push({campaignId:c.id,contactId:cid,templateId:c.templates[0].id,status:"queued",
          seqStatus:"active",currentStep:0,nextSendAt:TODAY,exitReason:null});
        const ct=contacts[cid];if(ct&&ct.emailState==="none")ct.emailState="queued";
        added++;
      });
      c.enrolled+=added;c.seqStats.active+=added;
      return {ok:true,added,skipped:(body.contactIds||[]).length-added,li_excluded:[],li_excluded_n:0};
    }
    case "/api/preview/email":{
      const c=campaigns.find(x=>x.id===body.campaignId)||campaigns[0];
      const st=(c.steps||[])[body.step||0]||c.steps[0];
      const who=contacts.find(x=>x.nameValidated)||contacts[0];
      const sub=(st.subject||"").replace(/\{\{first_name\}\}/g,who.first_name||"there")
                 .replace(/\{\{company\}\}/g,accOf(who).name);
      const bod=(st.body||"").replace(/\{\{first_name\}\}/g,who.first_name||"there")
                 .replace(/\{\{company\}\}/g,accOf(who).name)
                 .replace(/\{\{email_signature\}\}/g,settings.email_signature)
                 .replace(/\{\{unsubscribe_url\}\}/g,"#");
      return {ok:true,subject:sub,
        html:`<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;color:#222">${bod.replace(/\n/g,"<br>")}</div>`
             +bootstrap().meta.footerPreview,
        to:who.email,contact:who.name};
    }
    case "/api/test-send": return {ok:true,demo:true,message:"Prototype — no email is actually sent."};
    default:
      if(/^\/api\/campaigns\/\d+\/sequence$/.test(base)){
        const id=+base.split("/")[3];const c=campaigns.find(x=>x.id===id);
        if(c&&body.steps){c.steps=body.steps;c.templates=body.steps.flatMap(s=>s.variants||[s]);}
        return OK;
      }
      if(/^\/api\/campaigns\/\d+\/warmup$/.test(base))return {is_warmup:true,warmup_day:2,recommended_today:10,sent_today:0,remaining_today:10};
      return OK;   // save / bulk / followups / tags — accepted, state lives in the UI
  }
}

/* ---------- intercept ------------------------------------------------------ */
const _fetch=window.fetch.bind(window);
window.fetch=function(input,init){
  const url=typeof input==="string"?input:(input&&input.url)||"";
  if(!/^\/api\//.test(url)&&!/^https?:\/\/[^/]+\/api\//.test(url))return _fetch(input,init);
  const path=url.replace(/^https?:\/\/[^/]+/,"");
  let body=null;
  try{body=init&&init.body?JSON.parse(init.body):null;}catch(e){}
  const data=handle(path,(init&&init.method)||"GET",body);
  return Promise.resolve(new Response(JSON.stringify(data),
    {status:200,headers:{"Content-Type":"application/json"}}));
};

window.__DEMO__={accounts,contacts,campaigns,enrollments,settings,buildPlan};

<script>
/* ============================ mock data ============================ */
// Deterministic PRNG so the demo looks the same every load.
let _s=20260625; const rnd=()=>{_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff;};
const pick=a=>a[Math.floor(rnd()*a.length)];
const chance=p=>rnd()<p;

const CATS=["Web Design","Branding Studio","Digital Marketing","SEO Agency","Creative Agency"];
const CITIES=[["Austin","TX"],["Columbus","OH"],["Denver","CO"],["Raleigh","NC"],["Portland","OR"],
  ["Nashville","TN"],["Tampa","FL"],["Boise","ID"],["Madison","WI"],["Richmond","VA"],["Boulder","CO"],["Asheville","NC"]];
const FN=["Amy","Dave","Priya","Marcus","Lena","Sam","Tomas","Grace","Owen","Nadia","Carl","Beth","Raj","Ivy","Pete","Dana","Leo","Mona","Hugo","Ella"];
const LN=["Reyes","Park","Okafor","Nguyen","Hahn","Bauer","Lopez","Klein","Doyle","Frost","Mehta","Cole","Singh","Vargas","Ruiz","Webb","Shaw","Diaz","Pratt","Yoon"];
const TITLES=["Owner","Founder","Creative Director","Principal","Managing Partner","Marketing Lead","CEO"];
const DOMW=["studio","collective","co","labs","group","works","agency","creative","digital","design"];
const NAMEA=["Bright","North","Cedar","Pixel","Vivid","Anchor","Maple","Lumen","Forge","Harbor","Slate","Ember","Cobalt","Thicket","Atlas","Wren","Sable","Drift","Mosaic","Verge","Quill","Brisk","Honey","Tidal"];

// LinkedIn "headline" — the descriptive role text that helps judge LinkedIn fit
const HEADLINES=["Helping small brands punch above their weight","Founder • web & brand for growing teams",
  "Creative Director | brand systems & websites","We build sites that actually convert",
  "Marketing partner to founder-led companies","Design + strategy for ambitious SMBs",
  "Fractional creative lead for B2B teams","Turning ideas into brands people remember",
  "Web · SEO · paid — full-funnel for SMBs","Brand storyteller & studio owner"];

/* company size — matches the Enrichment tool's output: a headcount BAND + an optional exact
   est_staff count (when a determinative source is found), NOT an opaque S/M/L flag. */

/* ===== LinkedIn-activity deep-enrich (RELOCATED from the enrichment tool → runs HERE).

let ACT=null, ACT_HIST=null, _actPoll=null, _actHistReq=false;

    if(!d.ok)toast("Couldn't start: "+(d.error||"unknown"),"err");

  }).catch(e=>toast("Start failed: "+e,"err")).then(()=>loadActivity()).then(()=>loadActivityHistory());}

function _fmtDay(iso){try{return new Date(iso+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});}catch(e){return iso;}}
function connBand(n){return n==null?"":n>=500?"500+":n>=100?"100–500":"<100";}
function lastPostBand(days){return days==null?"none":days<=7?"7d":days<=30?"30d":days<=90?"90d":days<=180?"180d":"older";}
function cadenceBand(p){return p>=8?"weekly":p>=3?"monthly":p>=1?"rare":"none";}
function genActivity(){
  const connections=[40,90,140,220,480,640,900,1800][Math.floor(rnd()*8)];

  const original90d=Math.max(0,posts90d-Math.floor(rnd()*(posts90d*0.5+1)));

let accounts=[], contacts=[], campaigns=[];

        let est=null;if(band==="solo")est=1;else if(rnd()<.6){const[lo,hi]=SIZE_RANGE[band];est=lo+Math.floor(rnd()*(hi-lo+1));}

      emailState:"none", linkedinState:"none",
      hasLinkedin:hasLi, linkedinActive:liActive, headline:hasLi?pick(HEADLINES):"",
      linkedin_url: hasLi?("linkedin.com/in/"+fn.toLowerCase()+"-"+ln.toLowerCase()):"",
      cadence: liActive?pick(["~3 posts/wk","~1 post/wk","daily","monthly"]):"",
      nameValidated:nv, merge_ready: nv && ver,               // usable first name + deliverable email (Enrichment's gate)

function ruleSuppresses(c,r,target){if(!r.enabled)return false;const a=accOf(c);switch(r.kind){

/* ---- Whole-AWS-account sending health (dashboard) ----------------------------------

async function renderAwsAccount(){
  const el=$("awsdash"); if(!el) return;
  if(!SESH){ el.innerHTML=`<div class="card"><h3>Amazon SES — whole account</h3><div class="sub">loading…</div></div>`; await loadSes(); }

  const A=S.account, w=(A&&A.window)||{}, rows=S.senders||[];
  const bs=sesStatus(w.bounceRate||0,5,10), cs=sesStatus(w.complaintRate||0,0.1,0.5);
  const quotaPct=A?Math.round(A.sent24h/Math.max(A.max24h,1)*100):0;

  // a clean bill of health — the exact trap the count-metric query fell into (it returned a
  // convincing 0 for every sender because nothing publishes those metrics).
  const cell=(v,suffix,thresholds,row)=>v==null
    ? `<td class="tnum muted" title="${attrEsc(row&&row.reason?row.reason:"per-domain bounce/complaint needs the CloudWatch IAM permission")}">—</td>`
    : `<td class="tnum"><span class="pill ${sesStatus(v,thresholds[0],thresholds[1])[0]}">${v.toFixed(2)}${suffix}</span></td>`;
  // Bounce reaches us three different ways and they do NOT mean the same thing, so the cell
  // carries its source. Ranked by trust: AWS's own metric > account-minus-measured arithmetic >
  // the app's own records. Showing the museum's raw ledger unlabelled would have read 5.24%
  // (suppression-list backfill counted as this window's bounces) against a real 3.04% account.
  const SRC={cloudwatch:["","AWS CloudWatch — the number AWS enforces on"],
             derived:["~","Derived: whole-account bounces minus the senders CloudWatch can measure. "+
                          "AWS publishes no per-set metric for this sender."],
             ledger:["≈","This app's own bounce records only — known incomplete."]};

    if(r.shownBounceRate==null) return `<td class="tnum muted" title="${attrEsc(r.reason||"no bounce data for this sender")}">—</td>`;

  };

    <h3>Amazon SES — whole account <span class="muted" style="font-weight:400">· every domain, not just Demo</span></h3>
    <div class="sub">AWS pools quota and reputation per account, so any sender here can throttle the others.</div>
    ${A?`<div class="kpis" style="grid-template-columns:repeat(5,1fr);margin:10px 0 6px">
      ${kpi(A.enforcementStatus==="HEALTHY"&&A.sendingEnabled?"Healthy":"⚠ "+esc(A.enforcementStatus),"AWS status",A.enforcementStatus==="HEALTHY"?"grnk":"redk")}
      ${kpi(nf(A.sent24h),"sent last 24h","")}
      ${kpi((w.bounceRate||0).toFixed(2)+"%","bounce · "+(w.days||0)+"d",bs[2]==="ok"?"grnk":"redk")}
      ${kpi((w.complaintRate||0).toFixed(2)+"%","complaints · "+(w.days||0)+"d",cs[2]==="ok"?"grnk":"redk")}
      ${kpi(quotaPct+"%","of daily quota","")}
    </div>`:`<div class="guide amber"><span class="ic">⚠</span><div>No live SES account data.${S.error?" "+esc(S.error):""}</div></div>`}
    <div class="tablewrap" style="max-height:none;margin-top:8px"><table class="listtbl shtbl">
      <thead><tr><th class="nosort">Sender</th><th class="nosort">Domain</th><th class="nosort tnum">Sent 15d</th>
        <th class="nosort tnum">Today</th><th class="nosort tnum">Bounce</th><th class="nosort tnum">Complaint</th>
        <th class="nosort tnum">Suppressed</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td><b>${esc(r.app)}</b>${r.mine?` <span class="pill p-grn" title="This tool">this app</span>`:""}
            <div class="muted" style="font-size:11px">config set: ${esc(r.configSet)}</div></td>
        <td class="muted">${esc(r.domains)}</td>
        <td class="tnum">${r.sentWindow==null?`<span class="muted" title="${r.dbFound?"couldn't read that app's database":"that app isn't installed here"}">n/a</span>`:nf(r.sentWindow)}</td>
        <td class="tnum">${r.sentToday==null?`<span class="muted">n/a</span>`:nf(r.sentToday)}</td>

    ${rows.some(r=>r.reputationEnabled===false)?`<div class="guide amber" style="font-size:12px;margin-top:10px"><span class="ic">⚠</span><div>

      metrics turned OFF in SES, so AWS publishes no bounce or complaint rate for it and this row can never

function openAddQuick(anchor){

/* open-ended fields use a TYPEAHEAD (options computed on demand, never preloaded);
   fixed small sets use a checkbox list. In production the typeahead hits a server
   autocomplete endpoint — we never ship a 50k-value list to the browser. */
function isOpenField(field){const d=fieldDef(field);if(!d)return false;return d.opt?d.opt==="open":(d.type==="text"||d.type==="textenum");}
function openMulti(anchor,field,sel,onChange){
  openPop(anchor,p=>{
    if(isOpenField(field)){
      const selBox=document.createElement("div");selBox.className="selbox";
      const inp=document.createElement("input");inp.type="text";inp.className="msinput";inp.placeholder=`type to find ${fieldLabel(field).toLowerCase()}…`;
      const list=document.createElement("div");list.className="sugglist";
      const drawSel=()=>{selBox.innerHTML=sel.map((s,ix)=>`<span class="seltag">${esc(s)}<b data-ix="${ix}">×</b></span>`).join("");
        selBox.querySelectorAll("b").forEach(b=>b.onclick=()=>{sel.splice(+b.dataset.ix,1);drawSel();drawList();onChange();});};
      const drawList=()=>{const q=inp.value.trim();
        if(!q){list.innerHTML=`<div class="muted" style="padding:6px 4px;font-size:11.5px">Start typing — matches load on demand (not preloaded).</div>`;return;}
        const matches=fieldOpts(field).filter(o=>o.toLowerCase().includes(q.toLowerCase())&&!sel.includes(o)).slice(0,15);
        list.innerHTML=matches.length?matches.map(o=>`<div class="suggit">${esc(o)}</div>`).join(""):`<div class="muted" style="padding:6px 4px;font-size:11.5px">No match — press Enter to add “${esc(q)}”.</div>`;
        list.querySelectorAll(".suggit").forEach((d,ix)=>d.onclick=()=>{sel.push(matches[ix]);inp.value="";drawSel();drawList();inp.focus();onChange();});};
      inp.oninput=drawList;
      inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const v=inp.value.trim();if(v&&!sel.includes(v)){sel.push(v);inp.value="";drawSel();drawList();onChange();}}};
      p.appendChild(selBox);p.appendChild(inp);p.appendChild(list);drawSel();drawList();setTimeout(()=>inp.focus(),10);
      const act=document.createElement("div");act.className="msact";act.innerHTML=`<a>Clear</a><a>Done</a>`;
      act.children[0].onclick=()=>{sel.length=0;drawSel();drawList();onChange();};act.children[1].onclick=closePop;p.appendChild(act);
    } else {
      const opts=fieldDef(field).type==="tags"?allTags():fieldOpts(field);
      opts.forEach(o=>{const lbl=document.createElement("label");
        lbl.innerHTML=`<input type="checkbox" ${sel.includes(o)?"checked":""}> <span>${esc(optLabel(field,o))}</span>`;
        lbl.querySelector("input").onchange=e=>{if(e.target.checked){if(!sel.includes(o))sel.push(o);}else{const ix=sel.indexOf(o);if(ix>=0)sel.splice(ix,1);}onChange();};
        p.appendChild(lbl);});
      const act=document.createElement("div");act.className="msact";act.innerHTML=`<a>Clear</a><a>Done</a>`;
      act.children[0].onclick=()=>{sel.length=0;[...p.querySelectorAll("input")].forEach(c=>c.checked=false);onChange();};
      act.children[1].onclick=closePop;p.appendChild(act);
    }
  });
}
function openQuickPop(anchor,i){const qf=curQuick()[i];
  openMulti(anchor,qf.field,qf.values,()=>{const chip=document.querySelector(`.qfrow [data-qf="${i}"]`);if(chip)chip.outerHTML=quickChipHTML(i);saveQuickSets();renderTable();});

/* generic anchored popover.
   The click-outside listener is stored on _popClose and removed in closePop().
   Earlier this used addEventListener(...,{once:true}); when a popover was closed
   by an INTERNAL action (picking a field/value -> closePop() directly), that
   one-shot listener was never consumed and lingered, then fired on the NEXT
   click and instantly killed the next popover — the "click does nothing / opens
   then vanishes / feels laggy" bug. */
let _pop=null,_popClose=null;
function closePop(){if(_popClose){document.removeEventListener("click",_popClose);_popClose=null;}if(_pop){_pop.remove();_pop=null;}}
function openPop(anchor,build){closePop();const p=document.createElement("div");p.className="mspop";p.onclick=e=>e.stopPropagation();
  document.body.appendChild(p);build(p);const r=anchor.getBoundingClientRect();
  p.style.left=Math.min(window.scrollX+r.left,window.scrollX+document.documentElement.clientWidth-p.offsetWidth-12)+"px";
  p.style.top=(window.scrollY+r.bottom+5)+"px";_pop=p;
  _popClose=()=>closePop();
  setTimeout(()=>document.addEventListener("click",_popClose),0);}

/* filter builder */
function filterPanel(){return `<div class="builderbox">
  <div class="bh"><h4>Filter</h4>
    <div class="matchtog"><button class="${ST.filterMatch==="all"?"on":""}" onclick="setMatch('all')">Match ALL</button><button class="${ST.filterMatch==="any"?"on":""}" onclick="setMatch('any')">Match ANY</button></div>
    <div style="flex:1"></div>
    ${ST.filters.length?`<button class="btn gray sm" onclick="ST.filters=[];renderList()">Clear all</button>`:""}
    <span class="del" style="font-size:18px" onclick="togglePanel('filter')">×</span>
  </div>
  ${ST.filters.map((c,i)=>condRow(c,i)).join("")||`<div class="muted" style="font-size:12.5px;padding:2px 0 6px">No conditions yet — add one.</div>`}
  <button class="btn ghost sm" style="margin-top:4px" onclick="addCond()">+ Add condition</button>
</div>`;}
function condRow(c,i){const def=fieldDef(c.field)||FIELDS[ST.grain][0];const ops=OPS[def.type];
  const conj=i===0?"Where":(ST.filterMatch==="any"?"or":"and");
  let val="";
  // "has none of" TAKES a value list (matchCond reads it) — it was grouped with the
  // valueless operators, so its chips rendered blank. That hid the already-tried /
  // not-interested exclusion on every "See audience" view, and a hand-built
  // "has none of" was a silent no-op because nothing could be selected.
  if(["empty","not_empty"].includes(c.op)){val="";}
  else if(["any","none","has_any","has_all","has_none"].includes(c.op)){const sel=Array.isArray(c.value)?c.value:[];val=`<button class="chip2 ${sel.length?"set":""}" onclick="openCondPop(this,${i})">${sel.length?esc(sel.slice(0,2).join(", "))+(sel.length>2?` +${sel.length-2}`:""):"select…"}</button>`;}
  else if(def.type==="number"){val=`<input type="number" value="${esc(typeof c.value==="string"||typeof c.value==="number"?c.value:"")}" onchange="setCondVal(${i},this.value)" style="width:88px">`;}
  else {val=`<input type="text" value="${esc(typeof c.value==="string"?c.value:"")}" onchange="setCondVal(${i},this.value)" placeholder="type text…" style="min-width:150px">`;}
  return `<div class="condrow"><span class="conj">${conj}</span>
    <select onchange="setCondField(${i},this.value)">${FIELDS[ST.grain].map(f=>`<option value="${f.k}" ${f.k===c.field?"selected":""}>${esc(f.label)}</option>`).join("")}</select>
    <select onchange="setCondOp(${i},this.value)">${ops.map(([o,l])=>`<option value="${o}" ${o===c.op?"selected":""}>${esc(l)}</option>`).join("")}</select>
    ${val}<span class="del" onclick="delCond(${i})">×</span></div>`;}
const defaultOp=t=>t==="number"?"gte":t==="enum"?"any":t==="tags"?"has_any":"contains";
function addCond(){const f=FIELDS[ST.grain][0];ST.filters.push({field:f.k,op:defaultOp(f.type),value:(f.type==="enum"||f.type==="tags")?[]:""});renderList();}
function delCond(i){ST.filters.splice(i,1);renderList();}
function setMatch(m){ST.filterMatch=m;renderList();}
function setCondField(i,k){const f=fieldDef(k);ST.filters[i].field=k;ST.filters[i].op=defaultOp(f.type);ST.filters[i].value=(f.type==="enum"||f.type==="tags")?[]:"";renderList();}
function setCondOp(i,o){const c=ST.filters[i];const setops=["any","none","has_any","has_all","has_none"];
  if(setops.includes(o)){if(!Array.isArray(c.value))c.value=[];}
  else if(!["empty","not_empty"].includes(o)){if(Array.isArray(c.value))c.value="";}
  c.op=o;renderList();}
function setCondVal(i,v){ST.filters[i].value=v;renderTable();}
function openCondPop(anchor,i){const c=ST.filters[i];if(!Array.isArray(c.value))c.value=[];
  openMulti(anchor,c.field,c.value,()=>{anchor.classList.toggle("set",c.value.length>0);
    anchor.textContent=c.value.length?(c.value.slice(0,2).join(", ")+(c.value.length>2?` +${c.value.length-2}`:"")):"select…";renderTable();});
}

const OPS={

/* ---- LinkedIn sync queue: the primary hand-off workflow ----

/* ---- Account fit (2026-07-16) — formerly the "Score" column, and badly misnamed.
   `scoreBase` is NOT a per-person score. import_from_agencies.py does
   `score_base = acct["account_score"]` / `lead_tier = acct["fit_tier"]`, so every contact
   inherits their AGENCY's MDE Gemini ICP fit score verbatim — identical across all 10,914
   rows, and identical for every person at the same agency. Dan Cohen's 25 is Full Court
   Press's 25.

   It also answers a different question than Rank: fit_score is scored against the
   1-10-person-agency ICP (tier C = "skip"), a SEPARATE play from this 11-50 queue — so a
   low number here is expected in this queue and is not a knock on the person. Per-person
   quality is Rank (cross-channel) and LI fit (LinkedIn).

   Two things removed here:
   - the old `scoreParts()` why-tooltip: leftover prototype mock weights (base 44, +14

     84 while the pill showed 25 — it contradicted the very value it claimed to explain.
   - deriving the letter via `scoreTier()`: MDE's tiers are LLM-ASSIGNED, not threshold-
     derived (their ranges overlap — A 80-100, B 50-82, C 0-50), and MDE has no "D" at all.
     The old 46-point cutoff invented a phantom D for 3,281 contacts and disagreed with the
     imported tier on 35.4% of rows. Use the imported letter; show none if it's missing. */
const FIT_CLS={A:"p-grn",B:"p-acc",C:"p-amb"};
function acctFitCell(c){const a=accOf(c);const sc=a.account_score;
  if(sc==null)return `<span class="muted" title="No ICP fit score for this agency yet.">—</span>`;
  const tier=String(c.lead_tier||a.fit_tier||"").trim().toUpperCase();
  const tip=`Account fit ${sc}${tier?` · tier ${tier}`:""} — the AGENCY's score, not this person's.&#10;`
    +`Every contact at ${esc(a.name||"this agency")} shows this same number.&#10;&#10;`
    +`It rates the agency against the 1-10-person ICP (tier C = skip) — a different play from `
    +`this 11-50 queue, so a low number here is expected and says nothing about the person.&#10;&#10;`
    +`For per-person quality use Rank (cross-channel) or LI fit (LinkedIn).`;
  return `<span class="pill ${FIT_CLS[tier]||"p-amb"}" title="${tip}">${sc}${tier?" "+tier:""}</span>`;}
function actionIcons(c){let h=`<span class="rowacts">`;
  if(c.linkedinState==="none") h+=`<span class="ra li" title="Sync this contact into the LinkedIn Engine's prospect list (does not open their LinkedIn page)" onclick="event.stopPropagation();inlinePush(${c.id})">sync</span>`;

function cell(r,c){

      case "email":return `<span class="muted">${esc(r.email)}</span>`;
      case "verified":return r.verified?`<span class="pill p-grn">verified</span>`:`<span class="pill p-gray">no</span>`;
      case "verify_status":{const vs=r.verify_status||"unknown";const cl={valid:"p-grn",risky:"p-amb",invalid:"p-red",unknown:"p-gray"}[vs]||"p-gray";return `<span class="pill ${cl}">${esc(vs)}</span>`;}
      /* Send gate = the ACTUAL yes/no on whether a campaign may email this contact, and WHY.
         Spelling out the reason matters: "not ok" on a perfectly plausible-looking address is
         almost always an inconclusive verifier probe (catch-all / greylisted), not a bad mailbox. */
      case "email_ok":{
        const trusted=(r.tags||[]).includes("trusted:site-email");
        const vs=r.verify_status||"unknown";
        if(vs==="valid")  return `<span class="pill p-grn" title="Verified deliverable — clear to send.">ok</span>`;
        if(trusted)       return `<span class="pill p-grn" title="Address is published on the company's own website, so it's trusted over the verifier's '${esc(vs)}' verdict.">ok · trusted</span>`;
        if(!r.email)      return `<span class="pill p-gray" title="No email address on this contact.">no email</span>`;
        const why={risky:"Catch-all/accept-all domain — the server accepts any address, so the mailbox can't be confirmed.",
                   unknown:"Verifier couldn't get an answer (probe blocked, greylisted or timed out). Not proof the address is bad.",
                   invalid:"Mail server rejected this mailbox — sending would likely bounce."}[vs]
                   ||"Not verified yet.";
        const cl=vs==="invalid"?"p-red":"p-amb";
        return `<span class="pill ${cl}" title="${esc(why)}">${esc(vs==="unknown"?"unverified":vs)}</span>`;}
      case "email_confidence":{const p=r.email_confidence||0;const cl=p>=80?"p-grn":p>=50?"p-amb":"p-gray";return p?`<span class="pill ${cl}" title="Email confidence — verified addresses score high, pattern-guesses lower">${p}%</span>`:`<span class="muted">—</span>`;}
      case "email_state":{const[t,cl]=ESTATE[r.emailState];return `<span class="pill ${cl}">${t}</span>`;}
      case "haslinkedin":return r.hasLinkedin?`<span class="pill p-pur">in</span>`:`<span class="muted">·</span>`;
      case "liactive":return r.linkedinActive?`<span class="pill p-grn">active</span>`:`<span class="muted">·</span>`;
      case "cadence":return r.cadence?`<span class="muted">${esc(r.cadence)}</span>`:`<span class="muted">—</span>`;
      case "li_activity":return activityCell(r);
      case "li_conn":{const a=r.liActivity;return a&&a.connections!=null?`<span class="tnum" title="LinkedIn connections">${a.connections.toLocaleString()}</span>`:`<span class="muted">—</span>`;}
      case "li_foll":{const a=r.liActivity;return a&&a.followers!=null?`<span class="tnum" title="LinkedIn followers">${a.followers.toLocaleString()}</span>`:`<span class="muted">—</span>`;}
      case "li_posts90d":{const a=r.liActivity;return a&&a.posts90d!=null?`<span class="tnum" title="${a.posts90d} posts in last 90d · ${a.original90d||0} original">${a.posts90d}${a.original90d?`<span class="muted"> (${a.original90d})</span>`:""}</span>`:`<span class="muted">—</span>`;}
      case "li_lastpostdate":{const a=r.liActivity;if(!a||!a.lastPostAt)return `<span class="muted">—</span>`;const d=a.lastPostDays;const rel=d==null?esc(String(a.lastPostAt).slice(0,10)):(d<=0?"today":`${d} day${d===1?"":"s"} ago`);return `<span class="muted" title="Last LinkedIn post · ${esc(String(a.lastPostAt).slice(0,10))}">${rel}</span>`;}
      case "source":return r.source?`<span class="muted">${esc(r.source)}</span>`:`<span class="muted">—</span>`;
      case "cleared":return clearedCell(r);
      case "reviewed":return reviewedCell(r);
      case "linkedin_url":return r.linkedin_url?`<a class="weblink" href="${esc(webURL(r.linkedin_url))}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Open ${esc(r.linkedin_url)}">${esc(r.linkedin_url)} ↗</a>`:`<span class="muted">—</span>`;
      case "channel":{if(r.linkedinState==="none")return `<span class="muted">—</span>`;const[t,cl]=LSTATE[r.linkedinState];return `<span class="pill ${cl}">${t}</span>`;}
      case "tags":return r.tags.length?r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join(""):`<span class="muted">—</span>`;
      case "notes":return r.notes?`<span class="muted" title="${esc(r.notes)}">${esc(r.notes.length>46?r.notes.slice(0,46)+"…":r.notes)}</span>`:`<span class="muted">—</span>`;
      case "status":return r.status==="omitted"?`<span class="pill p-red">omitted</span>`:`<span class="pill p-grn">active</span>`;
    }
    return acctCell(a,c);   // account-level columns shown on contact rows
  } else {
    switch(c){
      case "name":return `${focusBadge(r)}<span class="nm lead linkish" onclick="openAccount(${r.id})">${esc(r.name)}</span>${r.website?`<a class="acct weblink" href="${esc(webURL(r.website))}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Open ${esc(r.website)}">${esc(r.website)} ↗</a>`:""}`;
      case "acts":return acctActionIcons(r);
      case "source":return r.source?`<span class="muted">${esc(r.source)}</span>`:`<span class="muted">—</span>`;
      case "reviewed":return reviewedCell(r);
      case "contacts":return `<span class="tnum">${contactsOf(r).length}</span>`;
      case "tags":return r.tags.length?r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join(""):`<span class="muted">—</span>`;
      case "notes":return r.notes?`<span class="muted" title="${esc(r.notes)}">${esc(r.notes.length>46?r.notes.slice(0,46)+"…":r.notes)}</span>`:`<span class="muted">—</span>`;
      case "status":return r.status==="omitted"?`<span class="pill p-red">omitted</span>`:`<span class="pill p-grn">active</span>`;
    }
    return acctCell(r,c);
  }
}

/* score_adj shifts RANK, not Account fit. contact_rank() is `uncapped + bonus + score_adj`,
   i.e. LINEAR in score_adj — so the client can mirror the server by shifting c.rank by the
   same delta. Without this the row wouldn't move until the next bootstrap and demote would
   look broken. */
function _adjRank(c,delta){c.scoreAdj=(c.scoreAdj||0)+delta;if(c.rank!=null)c.rank=+(c.rank+delta).toFixed(1);}
function demote(id){snapshot("demote lead");const c=contacts[id];_adjRank(c,-15);saveC(id,{scoreAdj:c.scoreAdj});toast("Lead demoted — Rank −15 · Ctrl+Z to undo","warn");render();}

/* Add the CURRENT SELECTION to a campaign. The other enrollment path is
   enrollAudience(), which adds a campaign's whole qualifying segment in one go —
   use that for "fill this campaign"; use this one for a hand-picked subset.
   Archived campaigns are not offered (you can't send from them), and the picker
   accepts a number OR any part of the campaign name — nobody should have to
   count list positions. */
function bulkAddCampaign(){
  const pick=campaigns.map((c,i)=>[c,i]).filter(([c])=>c.status!=="archived");
  if(!pick.length){toast("No live campaigns to add to.","warn");return;}
  const n=selectedContactIds().length;
  const list=pick.map(([c],k)=>`${k}: ${c.name}`).join("\n");
  const ans=prompt(`Add ${n} selected contact${n>1?"s":""} to which campaign?\n\nType the number, or part of the name.\n\n${list}`,"0");
  if(ans===null)return;
  const q=(""+ans).trim();
  let camp=/^\d+$/.test(q)?(pick[+q]||[])[0]:null;
  if(!camp){const hits=pick.filter(([c])=>c.name.toLowerCase().includes(q.toLowerCase()));
    if(hits.length===1)camp=hits[0][0];
    else if(hits.length>1){toast(`“${q}” matches ${hits.length} campaigns — be more specific.`,"warn");return;}}
  if(!camp){toast("No such campaign","warn");return;}
  const tmpl=camp.templates[0];
  if(!tmpl){toast("Campaign has no sequence yet — open it and add step 1 first","warn");return;}
  snapshot("add to campaign");
  const _addC=[];
  let added=0,skipped=0,dupe=0;
  const due=clientSendDay(TODAY,(seqOf(camp)[0]||{}).delayDays||0);
  selectedContactIds().forEach(id=>{
    const ct=contacts[id];
    if(!isEligible(ct,camp)){skipped++;return;}                         // global campaign guardrails (group-aware)
    if(enrollments.some(e=>e.campaignId===camp.id&&e.contactId===id)){dupe++;return;}
    enrollments.push({campaignId:camp.id,contactId:id,templateId:tmpl.id,status:"queued",seqStatus:"active",currentStep:0,nextSendAt:due,exitReason:null});
    if(ct.emailState==="none")ct.emailState="queued"; added++;_addC.push(id);
  });
  apiEnroll(camp.dbId,_addC.map(id=>contacts[id].dbId));
  toast(added+" contacts queued in “"+camp.name+"”"+(skipped?` · ${skipped} skipped by campaign rules`:"")+(dupe?` · ${dupe} already in`:""),"ok");
  ST.sel.clear();renderList();
}
// Bulk LinkedIn sync. The button MUST show it's working: this call POSTs one contact at a time to the
// LinkedIn Engine, so a 40-contact selection takes tens of seconds. It previously fired a toast and left
// the button looking untouched, which reads as "nothing happened" and invites re-clicking the same batch
// (2026-07-18). Now: re-entrancy guard, disabled + spinner + live count on the button itself,
// restored on every exit path.
let _pushLIBusy=false;
function bulkPushLI(btn){
  if(_pushLIBusy){toast("Already syncing — hang tight","warn");return;}
  const sel=selectedContactIds().filter(id=>contacts[id].dbId!=null);
  const already=sel.filter(id=>contacts[id].linkedinState!=="none").length;
  // LinkedIn needs a PERSON. Nameless records (a general inbox with no identified human) can't become a
  // connection request — they're filtered out of this queue only, and stay perfectly valid email targets.
  const nameless=sel.filter(id=>contacts[id].linkedinState==="none"&&!((contacts[id].name||"").trim()||(contacts[id].first_name||"").trim()));
  const ids=sel.filter(id=>contacts[id].linkedinState==="none"&&!nameless.includes(id));
  if(!ids.length){
    toast(nameless.length?`Nothing to sync — ${nameless.length} selected have no contact name (LinkedIn needs a person; they're still fine for email)`
                         :"Nothing to sync — selection is already in the LinkedIn Engine","warn");
    return;
  }
  _pushLIBusy=true;
  const el=btn||document.querySelector('.bulkbar .btn.teal'), label=el?el.innerHTML:null;
  if(el){el.disabled=true;el.style.opacity=.75;el.innerHTML=`<span class="spin"></span> syncing ${ids.length}…`;}
  const skipNote=[nameless.length?`${nameless.length} skipped (no name)`:"",already?`${already} already synced`:""].filter(Boolean).join(" · ");
  toast(`Syncing ${ids.length} to the LinkedIn Engine…${skipNote?" · "+skipNote:""}`,"ok");
  const restore=()=>{_pushLIBusy=false; if(el){el.disabled=false;el.style.opacity="";el.innerHTML=label;}};
  _api("/api/bulk",{entity:"contact",ids:ids.map(id=>contacts[id].dbId),op:"pushli"}).then(res=>{
    if(res&&res.ok){
      ids.forEach(id=>contacts[id].linkedinState="synced");
      const errs=(res.errors||[]).length;
      toast(`${res.pushed} synced to the LinkedIn Engine`
            +(res.dedup?` · ${res.dedup} already there`:"")
            +(errs?` · ${errs} skipped`:"")+(skipNote?" · "+skipNote:""),"ok");
      if(errs) console.warn("LinkedIn sync skips:",res.errors);
      ST.sel.clear();renderList();
    }
    else toast((res&&res.error)||"Sync failed — is the LinkedIn Engine running on :8806?","warn");
  }).catch(e=>toast("Sync failed — "+(e&&e.message||e),"warn")).finally(restore);
}
function Date_now(){return new Date().toISOString().slice(0,10);} // real "today" (TDZ-safe: no ref to the let TODAY, which the seed's genActivity() would hit before init)

/* ---- CSV export: current grain, current filtered+sorted rows, visible columns (values, not HTML) ---- */
function buildCSV(){
  const cols=visCols().filter(([k])=>k!=="acts");        // skip the row-actions column (no value)
  const rows=listRows();
  const q=v=>{v=(v==null)?"":Array.isArray(v)?v.join("; "):(""+v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const head=cols.map(([k,l])=>q(l)).join(",");
  const body=rows.map(r=>cols.map(([k])=>q(fval(r,k))).join(",")).join("\n");
  return {csv:head+(body?"\n"+body:""), nrows:rows.length, ncols:cols.length};
}
function exportCSV(){
  const {csv,nrows,ncols}=buildCSV();
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=`outreach-${ST.grain}-${Date_now()}.csv`;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  toast(`Exported ${nrows} ${ST.grain} × ${ncols} columns → CSV`,"ok");
}
