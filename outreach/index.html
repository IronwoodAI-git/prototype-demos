<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach Engine — prototype</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2330; --muted:#5b6675; --line:#e3e7ec;
  --accent:#3858c6; --accent-soft:#e9eefb; --teal:#0f8f74; --teal-soft:#e1f4ef;
  --amber:#9a6a00; --amber-soft:#fbf0d8; --red:#b4322b; --red-soft:#fbe9e7;
  --green:#2f7d32; --green-soft:#e7f3e8; --purple:#5b3fb5; --purple-soft:#ece7fb;
  --shadow:0 1px 2px rgba(18,28,45,.06),0 4px 14px rgba(18,28,45,.05);
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.topin{display:flex;align-items:center;gap:26px;padding:0 26px;max-width:1320px;margin:0 auto}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px;padding:15px 0 13px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:1px}
.tabs{display:flex;gap:6px;align-self:stretch}
.tab{display:flex;align-items:center;gap:8px;padding:0 18px;font-weight:600;font-size:15.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .tc{font-size:11px;font-weight:700;background:#eef1f5;color:var(--muted);border-radius:999px;padding:1px 7px}
.tab.active .tc{background:var(--accent-soft);color:var(--accent)}
/* tour "you are here" highlight — the active section pops while the rest of the header dims */
.top.tut-lift{z-index:100002;pointer-events:none}
.tab.tour-here{background:var(--accent);color:#fff;border-radius:9px 9px 3px 3px;border-bottom-color:var(--accent);box-shadow:0 3px 14px rgba(56,88,198,.45)}
.tab.tour-here .tc{background:rgba(255,255,255,.26);color:#fff}
.spacer{flex:1}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding:7px 0}
.hdr-pills{display:flex;align-items:center;gap:8px}
.pipe{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:6px;opacity:.9}
.pipe b{color:var(--ink)}
.pipe .arr{color:#c2cad6}
/* ---- main ---- */
.main{padding:24px 26px 70px;max-width:1320px;margin:0 auto}
h1{font-size:22px;margin:0 0 3px}
.lede{color:var(--muted);margin:0 0 18px;max-width:78ch}
.view{display:none}
.view.show{display:block}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 3px;font-size:15px}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:960px){.grid2,.grid3{grid-template-columns:1fr}}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow)}
.kpi b{font-size:24px;display:block;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.tealk b{color:var(--teal)} .kpi.acck b{color:var(--accent)}
.kpi.grnk b{color:var(--green)} .kpi.redk b{color:var(--red)}
.kpi.purk b{color:var(--purple)}
/* bar chart */
.barrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
.barrow .lab{width:120px;color:var(--muted);text-align:right;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .track{flex:1;background:#eef1f5;border-radius:5px;height:16px;overflow:hidden}
.barrow .track i{display:block;height:100%;background:var(--accent);border-radius:5px}
.barrow .track i.teal{background:var(--teal)} .barrow .track i.amber{background:var(--amber)}
.barrow .val{width:34px;font-weight:600;font-variant-numeric:tabular-nums}
/* buttons */
.btn{font:inherit;font-weight:600;font-size:13px;border-radius:9px;padding:8px 15px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.teal{background:var(--teal);border-color:var(--teal)}
.btn.teal.ghost{background:#fff;color:var(--teal)}
.btn.gray{background:#fff;color:var(--muted);border-color:var(--line)}
.btn.amber{background:var(--amber);border-color:var(--amber)}
.btn.red.ghost{background:#fff;color:var(--red);border-color:#f2cfca}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
/* toolbar */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{font:inherit;font-size:12.5px;font-weight:600;border:0;background:#fff;color:var(--muted);padding:7px 13px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg button+button{border-left:1px solid var(--line)}
input[type=text],input[type=search],select,textarea{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--ink);background:#fff}
input[type=search]{min-width:230px}
.sel{position:relative}
/* table */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:var(--panel);max-height:calc(100vh - 290px)}
.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 2px 0;font-size:12.5px;color:var(--muted)}
.pager select{font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
.pager .pinfo{font-variant-numeric:tabular-nums}
.actstatus{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:12.5px;color:var(--muted)}
.actstatus .ic{color:var(--accent)}
.actstatus b{color:var(--ink);font-weight:600}
.gact{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px;cursor:pointer;user-select:none;white-space:nowrap}
.gact .dripdot{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulsedot 1s infinite}
@keyframes pulsedot{0%,100%{opacity:.3}50%{opacity:1}}
.presetsel{font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
tr.grouprow td{background:#eef2fb;font-weight:600;border-top:2px solid var(--line)}
input.cellin{width:100%;font:inherit;padding:2px 5px;border:1px solid var(--accent);border-radius:5px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{background:#fafbfc;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}
th.nosort{cursor:default}
th .arr{color:var(--accent);font-size:10px;margin-left:3px}
tbody tr:hover{background:#f7f9fc}
tr.om td{color:#aab2bd}
tr.om td .nm{text-decoration:line-through;text-decoration-color:#d8a39e}
.lead{font-weight:600;color:var(--ink)}
td .acct{color:var(--muted);font-size:12px}
.ck{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
.linkish{color:var(--accent);cursor:pointer}
.linkish:hover{text-decoration:underline}
/* pills */
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid;line-height:1.5}
.p-grn{color:var(--green);background:var(--green-soft);border-color:#c7e3c8}
.p-amb{color:var(--amber);background:var(--amber-soft);border-color:#ecd9a8}
.p-red{color:var(--red);background:var(--red-soft);border-color:#f2cfca}
.p-acc{color:var(--accent);background:var(--accent-soft);border-color:#d4ddf7}
.p-teal{color:var(--teal);background:var(--teal-soft);border-color:#c5e8df}
.p-pur{color:var(--purple);background:var(--purple-soft);border-color:#d8cdf3}
.p-gray{color:var(--muted);background:#eef1f5;border-color:var(--line)}
.tag{display:inline-block;font-size:10.5px;color:var(--muted);background:#eef1f5;border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin:1px 3px 1px 0}
.muted{color:var(--muted)} .tnum{font-variant-numeric:tabular-nums}
/* bulk bar */
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:40;background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(18,28,45,.28)}
.bulk b{font-size:14px} .bulk .x{cursor:pointer;color:#aab2bd;margin-left:4px}
.bulk .btn{padding:6px 12px;font-size:12.5px}
.bulk .btn.gray{background:#2b3446;color:#dfe4ec;border-color:#3a4459}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(18,28,45,.32);z-index:50;display:none}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:480px;max-width:94vw;background:var(--panel);border-left:1px solid var(--line);z-index:51;transform:translateX(100%);transition:transform .18s;overflow:auto;box-shadow:-8px 0 30px rgba(18,28,45,.12)}
.drawer.show{transform:translateX(0)}
.dhead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:18px 20px;display:flex;align-items:flex-start;gap:10px}
.dhead h2{margin:0;font-size:18px} .dhead .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.dclose{margin-left:auto;cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
.dbody{padding:18px 20px 40px}
.frow{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid #f0f2f5;font-size:13px}
.frow .fl{width:120px;color:var(--muted);flex:0 0 auto} .frow .fv{flex:1}
.sechead{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 0 6px;font-weight:700}
.hist{border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:7px;font-size:12.5px}
.hist b{font-size:13px}
/* editable CRM drawer */
.dtitle{font-size:18px;font-weight:700;border:1px solid transparent;border-radius:7px;padding:3px 6px;margin:-3px 0 0 -6px;width:100%;color:var(--ink);background:transparent}
.dtitle:hover{border-color:var(--line)} .dtitle:focus{border-color:var(--accent);background:#fff;outline:none}
.dedit .frow{align-items:center}
.dedit .frow .fv input,.dedit .frow .fv select{width:100%;max-width:300px}
.cnotes{width:100%;resize:vertical;min-height:64px}
.secnote{text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)}
.sechead .secbtn{float:right;margin-top:-4px}
.hist.fu .btnrow input{font-size:12px;padding:5px 8px}
.hist.fu.fudone{opacity:.62}
/* stage-cell follow-up tick + overdue tab badge */
.futick{font-size:10.5px;margin-left:5px;color:var(--amber);white-space:nowrap}
.futick.od{color:var(--red);font-weight:700}
.fudue{color:var(--red);font-weight:600}
.tab .tc.due{background:var(--red);color:#fff}
.futbl td{vertical-align:top}
/* SES sending-health card */
.seshealth .shhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;cursor:pointer;user-select:none}
.seshealth.collapsed .shhead{margin-bottom:0}
.seshealth .shhead h3{margin:0}
.seshealth .shhead .caret{color:var(--muted);font-size:12px;margin-right:2px}
.seshealth .shhead:hover .caret{color:var(--ink)}
.shtbl td{vertical-align:top}
.meter{height:7px;background:#eef1f5;border-radius:999px;overflow:hidden;margin-bottom:3px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
/* stage manager */
.stagelist{display:flex;flex-direction:column;gap:7px;margin-bottom:4px}
.stagerow{display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid var(--line);border-radius:9px}
.stagerow select{font-size:12px;padding:4px 7px}
/* clickable website link in the accounts row */
td a.weblink{display:inline-block;color:var(--accent);font-size:12px;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
td a.weblink.acct{margin-left:8px}   /* breathing room between the account name and its inline URL */
td a.weblink:hover{text-decoration:underline}
/* guide / banner */
.guide{border:1px solid #d4ddf7;background:#fbfcff;border-radius:11px;padding:14px 16px;margin:0 0 18px;font-size:13px;color:var(--muted);display:flex;gap:11px}
.guide.teal{border-color:#c5e8df;background:#f6fdfb}
.guide.purple{border-color:#d8cdf3;background:#faf8ff}
.guide b{color:var(--ink)}
.guide .ic{font-size:18px;flex:0 0 auto}
/* refine panel */
.refbox{border:1px dashed #c9b27a;background:var(--amber-soft);border-radius:10px;padding:12px 14px;font-size:12.5px}
.refbox h4{margin:0 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--amber)}
.refrow{display:flex;align-items:center;gap:9px;padding:5px 0;border-top:1px solid #ecdcb6}
.refrow:first-of-type{border-top:0}
.refrow .rc{margin-left:auto;font-weight:700;color:var(--amber)}
/* campaigns layout */
.camplay{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
@media(max-width:960px){.camplay{grid-template-columns:1fr}}
.clist .citem{border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:9px;cursor:pointer;background:#fff}
.clist .citem:hover{border-color:#c8d2e8}
.clist .citem.on{border-color:var(--accent);background:var(--accent-soft)}
.clist .citem .cn{font-weight:600;font-size:13.5px}
.clist .citem .cm{font-size:11.5px;color:var(--muted);margin-top:3px}
.statline{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 0}
.statline .s{font-size:11.5px;color:var(--muted)} .statline .s b{color:var(--ink);font-size:13px}
.tmpl{border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px}
.tmpl.win{border-color:#c7e3c8;background:var(--green-soft)}
.tmpl .th{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.tmpl .subj{font-weight:600;font-size:13.5px}
.tmpl .body{font-size:12.5px;color:var(--muted);white-space:pre-wrap;border-left:2px solid var(--line);padding-left:10px;margin:6px 0}
.tmpl .abstat{display:flex;gap:16px;font-size:12px;align-items:center}
.tmpl .abstat b{font-size:14px}
.sendbox{border:1px solid #ecd9a8;background:var(--amber-soft);border-radius:11px;padding:15px 16px}
.sendbox h3{color:var(--amber);margin:0 0 9px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.field label{font-weight:600}
.bar{height:11px;border-radius:6px;background:#fff;border:1px solid #ecd9a8;overflow:hidden;margin:11px 0 6px}
.bar>i{display:block;height:100%;width:0;background:var(--amber);transition:width .1s linear}
.runline{font-size:12.5px;color:var(--amber);font-variant-numeric:tabular-nums}
/* toast */
#toast{position:fixed;bottom:22px;left:22px;z-index:80;display:flex;flex-direction:column;gap:8px}
.to{background:var(--ink);color:#fff;padding:10px 15px;border-radius:9px;font-size:13px;box-shadow:0 6px 20px rgba(18,28,45,.25);animation:tin .2s}
.to.ok{background:#1f5e34} .to.warn{background:#7c5300}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.colpanel{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:9px;z-index:20;min-width:170px;display:none}
.colpanel.show{display:block}
.colpanel .cphead{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:3px 6px 6px}
.colpanel label{display:flex;gap:7px;align-items:center;font-size:12.5px;padding:5px 6px;border-radius:6px;cursor:pointer}
.colpanel label:hover{background:#f4f6f9}
.colpanel label.drag-over{box-shadow:inset 0 2px 0 var(--accent)}
.cpgrip{cursor:grab;color:#b6bfcb;font-size:13px;line-height:1}
/* page header w/ action */
.pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:6px}
.pagehead .pht{flex:1}
.pagehead h1{margin-bottom:3px}
/* resizable / fixed master table */
/* let the master-list table break out of .main's max-width and use the full
   browser width (title + filters stay within the margins) — 26px viewport gutter */
#listwrap{position:relative;left:50%;width:calc(100vw - 52px);margin-left:calc(26px - 50vw)}
.listtbl{table-layout:fixed}
.listtbl th,.listtbl td{overflow:hidden;text-overflow:ellipsis}
.listtbl th{position:relative}
.rsz{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;user-select:none}
.rsz:hover{background:#c8d2e8}
body.resizing{cursor:col-resize;user-select:none}
/* modal */
.modalwrap{position:fixed;inset:0;background:rgba(18,28,45,.34);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:64px 20px;overflow:auto}
.modalwrap.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:580px;width:100%;box-shadow:0 22px 60px rgba(18,28,45,.28);animation:tin .16s}
.modal .mhead{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.modal .mhead h2{margin:0;font-size:18px} .modal .mhead .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.modal .mbody{padding:16px 20px 22px}
/* filter / sort / views / quick filters */
.cnt{font-size:10.5px;font-weight:700;background:rgba(255,255,255,.25);border-radius:999px;padding:0 6px;margin-left:5px}
.btn.gray .cnt{background:var(--accent-soft);color:var(--accent)}
.viewsbar{display:flex;align-items:center;gap:6px}
.viewsbar select{padding:6px 9px;font-size:12.5px;max-width:150px}
.qfrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.chip2{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--ink)}
.chip2:hover{border-color:#c8d2e8}
.chip2.set{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip2 .rm{color:var(--muted);font-weight:700;margin-left:1px;padding:0 1px}
.chip2 .rm:hover{color:var(--red)}
.chip2.add{border-style:dashed;color:var(--muted);font-weight:600}
.builderbox{border:1px solid var(--line);border-radius:11px;background:var(--panel);box-shadow:var(--shadow);padding:14px 16px;margin:0 0 14px}
.builderbox .bh{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.builderbox .bh h4{margin:0;font-size:13px}
/* Filter + Sort side by side when both are open (wrap on narrow widths) */
.builderrow{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;margin:0 0 14px}
.builderrow>.builderbox{flex:1 1 340px;min-width:0;margin:0}
.condrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.condrow select,.condrow input[type=text],.condrow input[type=number]{font-size:12.5px;padding:6px 9px}
.condrow .conj{width:58px;color:var(--muted);font-size:12px;font-weight:600;text-align:right}
.condrow .del{cursor:pointer;color:var(--muted);font-size:15px;padding:0 4px;line-height:1}
.condrow .del:hover{color:var(--red)}
.matchtog{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.matchtog button{font:inherit;font-size:11.5px;font-weight:600;border:0;background:#fff;color:var(--muted);padding:5px 10px;cursor:pointer}
.matchtog button+button{border-left:1px solid var(--line)}
.matchtog button.on{background:var(--accent-soft);color:var(--accent)}
.mspop{position:absolute;z-index:70;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(18,28,45,.18);padding:7px;min-width:172px;max-height:280px;overflow:auto}
.mspop label{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:5px 8px;border-radius:6px;cursor:pointer}
.mspop label:hover{background:#f4f6f9}
.mspop .msact{display:flex;justify-content:space-between;padding:6px 8px 2px;border-top:1px solid var(--line);margin-top:5px;font-size:11.5px}
.mspop .msact a{color:var(--accent);cursor:pointer;font-weight:600}
.mspop .msinput{width:100%;font-size:12.5px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px}
.mspop .sugglist{max-height:172px;overflow:auto}
.mspop .suggit{font-size:12.5px;padding:5px 8px;border-radius:6px;cursor:pointer}
.mspop .suggit:hover{background:var(--accent-soft);color:var(--accent)}
.mspop .selbox{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.mspop .selbox:empty{display:none}
.seltag{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 4px 2px 9px;font-size:11.5px;font-weight:600}
.seltag b{cursor:pointer;font-size:13px;line-height:1}
.seltag b:hover{color:var(--red)}
/* inline row actions */
.rowacts{display:inline-flex;gap:4px;vertical-align:middle}
.ra{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:19px;padding:0 5px;border:1px solid var(--line);border-radius:6px;font-size:10.5px;font-weight:700;color:var(--muted);background:#fff;cursor:pointer;line-height:1}
.ra:hover{border-color:#c8d2e8;color:var(--ink)}
.ra.li{color:var(--purple);border-color:#d8cdf3}
.ra.li:hover{background:var(--purple-soft)}
.ra.on{color:var(--purple);background:var(--purple-soft);border-color:#d8cdf3;cursor:default}
.demoted{color:var(--red);font-size:10px;margin-left:3px;font-weight:700}
.scorewrap{display:inline-flex;align-items:center;gap:5px}
.ra.dem{font-size:9px;min-width:18px;height:17px;padding:0 4px}
.ra.dem.on{color:var(--red);border-color:#f2cfca;background:var(--red-soft)}
/* campaign settings rules */
.rulerow{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid #f0f2f5}
.rulerow:first-of-type{border-top:0}
.rinfo{flex:1} .rinfo b{font-size:13.5px} .rinfo .muted{font-size:12px;margin-top:2px;line-height:1.4}
.rright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto;white-space:nowrap}
.rcount{font-size:11px;font-weight:700;color:var(--amber)}
.switch{position:relative;display:inline-block;width:34px;height:20px;flex:0 0 auto;margin-top:2px}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .track{position:absolute;inset:0;background:#cfd6e0;border-radius:999px;transition:.15s;cursor:pointer}
.switch .track:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track:before{transform:translateX(14px)}
.switch input:disabled+.track{opacity:.55;cursor:not-allowed}
</style>

<body>

<div class="top">
  <div class="topin">
    <div class="brand">Outreach Engine <span style="background:#f59e0b;color:#111;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;margin:0 6px;letter-spacing:.6px;vertical-align:middle" title="You are viewing the front-end PROTOTYPE (mock data), not the real tool">PROTOTYPE</span> <small>master list · email campaigns</small></div>
    <div class="tabs" id="tabs"></div>
    <div class="spacer"></div>
    <div class="hdr-right">
      <div class="pipe">List Builder <span class="arr">→</span> Enrichment <span class="arr">→</span> <b>Outreach Engine</b> <span class="arr">→</span> LinkedIn</div>
      <div class="hdr-pills">
        <div id="gact" class="gact" onclick="go('dash')" title="LinkedIn-activity enrichment — click for details"></div>
      </div>
    </div>
  </div>
</div>

<div class="main">
  <!-- DASHBOARD -->
  <section class="view" id="v-dash"></section>
  <!-- MASTER LIST -->
  <section class="view" id="v-list"></section>
  <!-- FOLLOW-UPS -->
  <section class="view" id="v-follow"></section>
  <!-- CAMPAIGNS -->
  <section class="view" id="v-camp"></section>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>
<div class="modalwrap" id="modalwrap" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
/* ============================ mock data ============================ */
// Deterministic PRNG so the prototype looks the same every load.
let _s=20260625; const rnd=()=>{_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff;};
const pick=a=>a[Math.floor(rnd()*a.length)];
const chance=p=>rnd()<p;

const CATS=["Web Design","Branding Studio","Digital Marketing","SEO Agency","Creative Agency"];
const CITIES=[["Austin","TX"],["Columbus","OH"],["Denver","CO"],["Raleigh","NC"],["Portland","OR"],
  ["Nashville","TN"],["Tampa","FL"],["Boise","ID"],["Madison","WI"],["Richmond","VA"],["Boulder","CO"],["Asheville","NC"]];
const FN=["Amy","Dave","Priya","Marcus","Lena","Sam","Tomas","Grace","Owen","Nadia","Carl","Beth","Raj","Ivy","Pete","Dana","Leo","Mona","Hugo","Ella"];
const LN=["Reyes","Park","Okafor","Nguyen","Hahn","Bauer","Lopez","Klein","Doyle","Frost","Mehta","Cole","Singh","Vargas","Ruiz","Webb","Shaw","Diaz","Pratt","Yoon"];
const TITLES=["Owner","Founder","Creative Director","Principal","Managing Partner","Marketing Lead","CEO"];
const DOMW=["studio","collective","co","labs","group","works","agency","creative","digital","design"];
const NAMEA=["Bright","North","Cedar","Pixel","Vivid","Anchor","Maple","Lumen","Forge","Harbor","Slate","Ember","Cobalt","Thicket","Atlas","Wren","Sable","Drift","Mosaic","Verge","Quill","Brisk","Honey","Tidal"];
const NAMEB=["Pixel","Field","Craft","Signal","Loft","Yard","Bloom","Stack","Pine","Wave","Bird","Path","Spark","Frame","Root","Press","Hill","Kite","Lane","Coast"];
// LinkedIn "headline" — the descriptive role text that helps judge LinkedIn fit
const HEADLINES=["Helping small brands punch above their weight","Founder • web & brand for growing teams",
  "Creative Director | brand systems & websites","We build sites that actually convert",
  "Marketing partner to founder-led companies","Design + strategy for ambitious SMBs",
  "Fractional creative lead for B2B teams","Turning ideas into brands people remember",
  "Web · SEO · paid — full-funnel for SMBs","Brand storyteller & studio owner"];

/* company size — matches the Enrichment tool's output: a headcount BAND + an optional exact
   est_staff count (when a determinative source is found), NOT an opaque S/M/L flag. */
const SIZE_BANDS=["solo","2-10","11-50","51-200","201+"];
const SIZE_LABEL={solo:"Solo (1)","2-10":"2–10","11-50":"11–50","51-200":"51–200","201+":"201+"};
const SIZE_RANGE={solo:[1,1],"2-10":[2,10],"11-50":[11,50],"51-200":[51,200],"201+":[201,600]};
const sizeText=a=>{const b=SIZE_LABEL[a.size_band]||a.size_band||"—";return a.est_staff?`${b} · ~${a.est_staff}`:b;};

/* ===== LinkedIn-activity deep-enrich (RELOCATED from the enrichment tool → runs HERE).
   Mock of enrich_activity.py's Unipile data shape: raw counts + the coarse bands the
   lead score uses (connections / last-post / cadence + creator). The real Unipile worker
   is the Track-2 build; here a background "drip" simulates it. Provider is pluggable. ===== */
const ACT_PROVIDER="Unipile (mock)";
function connBand(n){return n==null?"":n>=500?"500+":n>=100?"100–500":"<100";}
function lastPostBand(days){return days==null?"none":days<=7?"7d":days<=30?"30d":days<=90?"90d":days<=180?"180d":"older";}
function cadenceBand(p){return p>=8?"weekly":p>=3?"monthly":p>=1?"rare":"none";}
function genActivity(){
  const connections=[40,90,140,220,480,640,900,1800][Math.floor(rnd()*8)];
  const followers=connections+Math.floor(rnd()*connections);
  const isCreator=chance(.12);
  const days=chance(.15)?null:[3,15,45,120,300][Math.floor(rnd()*5)];
  const posts90d=days==null?0:days<=7?6+Math.floor(rnd()*8):days<=30?2+Math.floor(rnd()*5):days<=90?1+Math.floor(rnd()*2):0;
  const original90d=Math.max(0,posts90d-Math.floor(rnd()*(posts90d*0.5+1)));
  let status="ok"; if(days==null&&chance(.4))status="no_posts"; else if(chance(.06))status="private";
  return {connections,followers,isCreator,lastPostDays:days,posts90d,original90d,status,enrichedAt:Date_now(),
    connBand:connBand(connections),lastPostBand:lastPostBand(days),cadenceBand:cadenceBand(posts90d)};
}
const CADENCE_TEXT={weekly:"~2 posts/wk",monthly:"~1 post/wk",rare:"~monthly",none:""};
function applyActivity(c,act){
  c.liActivity=act;
  // re-derive the coarse fields the score + existing LI columns use (mirrors the band write)
  c.linkedinActive = act.status==="ok" && act.lastPostDays!=null && act.lastPostDays<=30;
  c.cadence = act.status==="ok" ? (CADENCE_TEXT[act.cadenceBand]||"") : "";
}

let accounts=[], contacts=[], campaigns=[];
let aid=0, cid=0;
const N_ACC=44;
for(let i=0;i<N_ACC;i++){
  const [city,state]=pick(CITIES);
  const nm=pick(NAMEA)+" "+pick(NAMEB)+" "+pick(["Studio","Co.","Group","Agency","Collective","Labs","Creative"]);
  const fran=chance(.10), thin=chance(.13);
  const a={id:aid++, name:nm, city, state, category:pick(CATS),
    rating:+(3.6+rnd()*1.4).toFixed(1), reviews:Math.floor(8+rnd()*180),
    ...(()=>{const r=rnd();const band=r<.25?"solo":r<.65?"2-10":r<.88?"11-50":r<.97?"51-200":"201+";
        let est=null;if(band==="solo")est=1;else if(rnd()<.6){const[lo,hi]=SIZE_RANGE[band];est=lo+Math.floor(rnd()*(hi-lo+1));}
        return {size_band:band, est_staff:est};})(),
    website:nm.toLowerCase().replace(/[^a-z]+/g,"")+"."+pick(DOMW)+".com",
    website_source: chance(.18)?"found":"maps",                                  // 'found' = recovered by Enrichment's website pass
    company_linkedin: chance(.6)?("linkedin.com/company/"+nm.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")):"",
    account_score: 42+Math.floor(rnd()*54),                                      // Enrichment account-fit score 0-100
    fran, thin, status:"active", omitReason:null, tags:[], notes:""};
  // a handful arrive that *should* have been caught upstream — fodder for refinement
  if(fran && chance(.7)) a.tags.push("franchise");
  if(thin && chance(.6)) a.tags.push("thin-site");
  if(chance(.08)) a.tags.push("not interested");   // a few flagged — fodder for the suppression rule
  accounts.push(a);
  const nContacts = chance(.28)?2:1;
  for(let c=0;c<nContacts;c++){
    const fn=pick(FN), ln=pick(LN);
    const hasLi=chance(.7), liActive=hasLi&&chance(.55);
    const verSt=chance(.72)?"valid":pick(["risky","invalid","unknown"]);
    const ver=verSt==="valid", nv=chance(.9);
    contacts.push({id:cid++, accountId:a.id, name:fn+" "+ln, first_name:fn, title:pick(TITLES),
      email:fn.toLowerCase()+"@"+a.website, verified:ver, verify_status:verSt,
      status:"active", omitReason:null, tags:[...a.tags], notes:"",
      emailState:"none", linkedinState:"none",
      hasLinkedin:hasLi, linkedinActive:liActive, headline:hasLi?pick(HEADLINES):"",
      linkedin_url: hasLi?("linkedin.com/in/"+fn.toLowerCase()+"-"+ln.toLowerCase()):"",
      cadence: liActive?pick(["~3 posts/wk","~1 post/wk","daily","monthly"]):"",
      nameValidated:nv, merge_ready: nv && ver,               // usable first name + deliverable email (Enrichment's gate)
      scoreBase:0, scoreAdj:0, lead_tier:"", score_provisional:chance(.18)});
  }
}

/* seed activity state: contacts arrive from enrichment WITH a LinkedIn URL but NO
   activity yet — the outreach engine's background worker drips it in. A minority arrive
   pre-enriched so the enriched UI is visible immediately. No URL → nothing to enrich. */
contacts.forEach(c=>{
  if(!c.linkedin_url){c.liActivity=null;c.activityStatus="na";c.linkedinActive=false;c.cadence="";return;}
  if(chance(.30)){applyActivity(c,genActivity());c.activityStatus=chance(.22)?"stale":"enriched";}
  else{c.liActivity=null;c.activityStatus="pending";c.linkedinActive=false;c.cadence="";}
});

/* campaigns + templates + enrollments (enrollment = {campaignId, contactId, templateId, status}) */
let enrollments=[];
function mkCampaign(o){campaigns.push(Object.assign({id:campaigns.length,templates:[],warmup:false,group:""},o));return campaigns[campaigns.length-1];}
// "Q3 Introduction" is a GROUP sent as segments by role — a contact belongs to only ONE of them.
const c1=mkCampaign({name:"Q3 Intro — Owners", sender:"acme", status:"active", group:"Q3 Introduction",
  segment:"Owners / Founders · verified email", warmup:true, warmupDay:8});
const c2=mkCampaign({name:"NorthStar AI Launch", sender:"northstar-alex", status:"active", group:"",
  segment:"Creative & Digital Marketing · all states"});
const c3=mkCampaign({name:"Spring Re-engage (follow-up)", sender:"acme", status:"draft", group:"",
  segment:"No-reply from the Q3 Introduction group"});
const c4=mkCampaign({name:"Q3 Intro — Marketing Leads", sender:"acme", status:"active", group:"Q3 Introduction",
  segment:"Marketing leads · verified email"});

let tid=0;
function mkTmpl(camp,o){const t=Object.assign({id:tid++,campaignId:camp.id,sent:0,replied:0},o);camp.templates.push(t);return t;}
mkTmpl(c1,{name:"Variant A", variant:"A", subject:"Quick idea for {{agency}}",
  body:"Hi {{first_name}},\n\nLove what {{agency}} is doing in {{city}}. We help small studios ship faster sites without the overhead. Worth a 15-min look?\n\n— Alex, Acme Studio", sent:140, replied:13});
mkTmpl(c1,{name:"Variant B", variant:"B", subject:"{{first_name}} — a faster path for {{agency}}'s sites",
  body:"Hi {{first_name}},\n\nNoticed {{agency}} and wanted to reach out. We partner with studios like yours on build speed. Open to a quick chat?\n\n— Alex, Acme Studio", sent:138, replied:7});
mkTmpl(c2,{name:"Launch note", variant:"A", subject:"NorthStar AI is live",
  body:"Hi {{first_name}},\n\nWe just launched NorthStar AI...\n\n— Alex", sent:96, replied:9});
mkTmpl(c4,{name:"Marketing-lead intro", variant:"A", subject:"A faster path for {{agency}}'s sites",
  body:"Hi {{first_name}},\n\nFor marketing leads at studios like {{agency}}...\n\n— Alex, Acme Studio"});

/* seed enrollment statuses for the two active campaigns */
function seedEnroll(camp, pool, n){
  const chosen=pool.slice(0,n);
  chosen.forEach((ct,ix)=>{
    const tmpl=camp.templates[ix%camp.templates.length];
    let st="queued";
    const r=rnd();
    if(camp.status==="active"){ st = r<.10?"replied" : r<.16?"bounced" : r<.20?"unsubscribed" : r<.82?"sent":"queued"; }
    enrollments.push({campaignId:camp.id, contactId:ct.id, templateId:tmpl.id, status:st});
    ct.emailState = st;
  });
}
const verifiedPool = contacts.filter(c=>c.verified);
seedEnroll(c1, verifiedPool.filter(c=>["TX","OH","CO"].includes(accOf(c).state)), 46);
seedEnroll(c2, contacts.filter(c=>["Creative Agency","Digital Marketing"].includes(accOf(c).category)), 30);

/* A role-based warm-up address (hello@) warming in parallel — demonstrates that
   SEVERAL warm-up campaigns, each on its OWN sending address, ramp and auto-send
   independently. (In the real tool: hello@ / outreach@ / connect@ on the brand domain,
   each its own campaign, each auto-sending its daily ramp.) */
const c5=mkCampaign({name:"Warm-up — hello@ (role address)", sender:"northstar-hello",
  status:"active", group:"", segment:"Tier-C email channel · not already in a campaign",
  warmup:true, warmupDay:3});
mkTmpl(c5,{name:"Intro (NorthStar AI)", variant:"A",
  subject:"For agency principals thinking about AI",
  body:"Hi {{first_name}},\n\nQuick note from NorthStar — we help small agencies put AI to work without the hype.\n\n— Alex at NorthStar", sent:25, replied:1});
/* early warm-up roster: a handful already auto-sent over the first 3 days, the rest queued
   (small mock contact pool, so enroll the available verified/merge-ready set) */
{ const pool=contacts.filter(c=>c.verified && c.merge_ready);
  pool.forEach((ct,ix)=>{ enrollments.push({campaignId:c5.id, contactId:ct.id,
    templateId:c5.templates[0].id, status: ix<8?"sent":"queued"}); }); }

/* a subset already synced into the separate LinkedIn Engine */
contacts.filter(c=>c.status==="active").slice(0,11).forEach(c=>{ c.linkedinState="synced"; });

/* ---- CRM pipeline stage — seeded deterministically from how far each contact has
   progressed (New → Contacted → Interested → Follow-up → Customer / Not interested) ---- */
contacts.forEach(c=>{
  const es=c.emailState;
  c.stage = es==="replied" ? (chance(.5)?"interested":"followup")
          : (es==="sent"||es==="queued") ? "contacted"
          : (es==="bounced"||es==="unsubscribed") ? "not_interested"
          : "new";
});
// populate the middle of the pipeline so the CRM views aren't bare (deterministic)
{ const contactedPool=contacts.filter(c=>c.stage==="contacted");
  contactedPool.slice(0,5).forEach(c=>c.stage="interested");
  contactedPool.slice(5,9).forEach(c=>c.stage="followup"); }
contacts.filter(c=>c.stage==="interested").slice(0,2).forEach(c=>c.stage="customer");

/* ---- follow-up tasks (the CRM "I owe them something by <date>" list) ---- */
let followups=[], fuid=0;
{ const pool=contacts.filter(c=>["followup","interested"].includes(c.stage));
  const seed=[
    ["2026-06-22","Send the proposal deck we discussed",false],
    ["2026-06-24","Circle back — they asked to reconnect this week",false],
    ["2026-06-26","Call at 2pm re: project scope",false],
    ["2026-06-29","Follow up on the pricing question",false],
    ["2026-07-03","Send case study + offer a demo slot",false],
    ["2026-07-10","Quarterly nudge if no reply",false],
    ["2026-06-18","Intro call — done",true],
  ];
  seed.forEach((f,i)=>{const c=pool[(i*3)%pool.length];if(c)followups.push({id:fuid++,contactId:c.id,due:f[0],note:f[1],done:f[2]});});
}

/* lead score (enrichment-derived) — email+LinkedIn presence, LinkedIn activity, and
   account-level signals push a contact up. Manual scoreAdj lets you demote/restore. */
function computeScore(c){const a=accOf(c);let s=44;
  if(c.email)s+=4; if(c.verified)s+=14;
  if(c.hasLinkedin)s+=8; if(c.linkedinActive)s+=12;
  if(a.rating>=4.6)s+=8; else if(a.rating>=4.2)s+=4;
  if(a.reviews>=80)s+=5;
  if(a.size_band==="51-200"||a.size_band==="201+")s-=6; else if(a.size_band==="solo"||a.size_band==="2-10")s+=3;
  if(c.headline)s+=2;
  return Math.max(0,Math.min(100,Math.round(s)));}
contacts.forEach(c=>{c.scoreBase=computeScore(c);c.scoreAdj=0;});
const effScore=c=>Math.max(0,Math.min(100,c.scoreBase+(c.scoreAdj||0)));
const scoreTier=n=>n>=78?["A","p-grn"]:n>=62?["B","p-acc"]:n>=46?["C","p-amb"]:["D","p-red"];
contacts.forEach(c=>{c.lead_tier=scoreTier(c.scoreBase)[0];});   // Enrichment-style A/B/C/D tier (imported in prod)

/* ---- generic seed fields carried from the enrichment seed ----
   email_confidence: guessed-vs-verified strength %  ·  source: where the record came from
   cleared: the upstream "cleared-for-send" quality flag  ·  reviewed: the user's own "worked this" flag */
const SOURCES=["Maps import · 2026-06-25","Web search · 2026-06-24","Referral list","CSV upload · 2026-06-20","Enrichment · 2026-06-25"];
accounts.forEach(a=>{a.source=pick(SOURCES);a.reviewed=false;a._deleted=false;});
contacts.forEach(c=>{const a=accOf(c);
  c.email_confidence = c.verified ? 88+Math.floor(rnd()*12) : (c.email ? 30+Math.floor(rnd()*45) : 0);
  c.source = a.source;
  c.cleared = !!(c.merge_ready && c.verified && chance(.8));   // upstream cleared-for-send (mostly set; a few not yet)
  c.reviewed = false; c._deleted = false;
});

/* ---- account intelligence (from the upstream classifier; all nullable in prod) ----
   generic firmographic descriptors: services / industries / specialization + fit_tier. */
const SERVICES_POOL=["web design","branding","SEO","paid media","content","email marketing","UX audits","Shopify builds","video","PR"];
const INDUSTRIES_POOL=["small business","e-commerce","SaaS","healthcare","hospitality","real estate","nonprofits","professional services","education","restaurants"];
const SPEC_POOL=["Websites for growing SMBs","Brand systems & identity","Shopify & e-commerce builds","SEO + content programs","Full-funnel paid media","Marketing sites & landing pages","Rebrands & visual identity","Conversion-focused web design"];
function pickN(pool,n){const start=Math.floor(rnd()*pool.length);const out=[];for(let j=0;j<n;j++)out.push(pool[(start+j*3)%pool.length]);return [...new Set(out)];}
accounts.forEach(a=>{
  a.services=pickN(SERVICES_POOL,2+Math.floor(rnd()*2)).join(", ");
  a.industries=pickN(INDUSTRIES_POOL,2).join(", ");
  a.specialization=chance(.55)?pick(SPEC_POOL):"";
  a.fit_tier=a.account_score>=85?"A":a.account_score>=70?"B":a.account_score>=55?"C":"D";
});

/* ---- rank: uncapped per-contact sort key (simplified deterministic mock of the real
   build's server-side contact_rank — lead quality × LinkedIn activity + account-fit
   signals; the geo seam is omitted). Computed on read, so demotes and the activity drip
   shift rank immediately. ---- */
const SIZE_MID={solo:1,"2-10":6,"11-50":30,"51-200":125,"201+":400};
function rankSizePts(a){const est=a.est_staff!=null?a.est_staff:(SIZE_MID[a.size_band]!=null?SIZE_MID[a.size_band]*0.88:null);
  if(est==null)return 14;return est<=1?12:est<=4?28:est<=15?40:est<=30?30:est<=50?20:est<=200?8:2;}
const RANK_T1=["founder","owner","ceo","chief executive","president","principal","partner","managing director","managing partner"];
const RANK_T2=["co-founder","coo","cmo","cto","cfo","chief","vp","vice president","head of"];
const RANK_T3=["director","manager","lead"];
function rankTitlePts(t){t=(t||"").toLowerCase();if(!t)return 8;
  if(RANK_T1.some(x=>t.includes(x)))return 25;if(RANK_T2.some(x=>t.includes(x)))return 19;if(RANK_T3.some(x=>t.includes(x)))return 13;return 11;}
function rankActDelta(c){if(!(c.activityStatus==="enriched"||c.activityStatus==="stale")||!c.liActivity||c.liActivity.status!=="ok")return 0;
  const a=c.liActivity;let d=0;
  d+=a.connections>=500?0.10:a.connections>=100?0.04:-0.06;
  const lp=a.lastPostBand;d+=lp==="7d"?0.12:lp==="30d"?0.08:lp==="90d"?0.03:lp==="180d"?-0.02:lp==="older"?-0.06:-0.10;
  const p=a.posts90d||0;d+=p>=8?0.10:p>=3?0.05:p>=1?-0.03:-0.08;
  d+=a.followers>=5000?0.05:a.followers>=2000?0.03:a.followers>=1000?0.015:0;
  if(a.isCreator)d+=0.05;
  const o=a.original90d||0;d+=o>=4?0.08:o>=2?0.05:o>=1?0.03:0;
  return d;}
function rankAcctBonus(a){let b=0;
  const t=(a.fit_tier||"").toUpperCase();if(t==="A")b+=6;else if(t==="B")b+=2;
  return b;}
function contactRank(c){const a=accOf(c);
  let pts=rankSizePts(a)+rankTitlePts(c.title);
  pts+=c.linkedin_url?15:(c.email?8:0);
  if(c.first_name&&c.title)pts+=4;
  const ec=c.email_confidence||0;
  if(c.email)pts+=ec>=80?6:ec>=50?4:ec>0?2:0;
  const base=pts/90*100;
  return Math.round((base*(1+rankActDelta(c))+rankAcctBonus(a)+(c.scoreAdj||0))*10)/10;}

const DEFAULT_RULES=[

  {id:"omitted",kind:"omit",label:"Exclude omitted records",desc:"Contacts (or whole accounts) you've omitted never enter a campaign.",enabled:true},
  {id:"notint",kind:"tag",tag:"not interested",label:"Exclude “not interested”",desc:"If an account or contact is tagged not-interested, none of its contacts can be added or sent to.",enabled:true},
  {id:"incampaign",kind:"samegroup",label:"One campaign per group",desc:"Within a campaign GROUP (e.g. an intro sent as segments by role), a contact lands in only one. They can still be in other groups' campaigns — follow-ups, announcements, one-offs. Ungrouped campaigns are independent.",enabled:true},
  {id:"firstname",kind:"firstname",label:"Require a validated first name",desc:"Skip contacts whose first name isn't validated — needed for {{first_name}} personalization.",enabled:true},
  {id:"verified",kind:"verified",label:"Require verified email",desc:"Only send to addresses that passed email verification (lower bounce risk).",enabled:false},
  {id:"cleared",kind:"cleared",label:"Only send to cleared-for-send contacts",desc:"Send only to contacts marked cleared-for-send by the upstream contact-refinement pass.",enabled:false},
];
let campaignRules=DEFAULT_RULES.map(r=>({...r}));

function loadRules(){try{
  if(localStorage.getItem("oe_camprules_v")!==RULES_SCHEMA){localStorage.removeItem("oe_camprules");localStorage.setItem("oe_camprules_v",RULES_SCHEMA);return;}

function saveRules(){try{localStorage.setItem("oe_camprules",JSON.stringify(campaignRules));}catch(e){}}
function ruleSuppresses(c,r,target){if(!r.enabled)return false;const a=accOf(c);switch(r.kind){
  case "unsub":return ["unsubscribed","bounced"].includes(c.emailState);
  case "omit":return c.status==="omitted"||a.status==="omitted";
  case "tag":return (a.tags||[]).includes(r.tag)||(c.tags||[]).includes(r.tag);
  case "samegroup":{ if(!target||!target.group)return false;   // only meaningful relative to a grouped target
    return enrollments.some(e=>{if(e.contactId!==c.id)return false;const cc=campaigns[e.campaignId];return cc&&cc.id!==target.id&&cc.group===target.group;}); }
  case "firstname":return !c.nameValidated;
  case "verified":return !c.verified;
  case "cleared":return !c.cleared;
  case "minscore":return effScore(c)<(r.threshold||0);
} return false;}
// target = the campaign we're considering adding to (needed for the group rule)
function isEligible(c,target){return !campaignRules.some(r=>ruleSuppresses(c,r,target));}
function ruleSuppressCount(r){
  if(r.kind==="samegroup")  // contacts currently locked into a group (in ≥1 grouped campaign)
    return contacts.filter(c=>c.status==="active"&&enrollments.some(e=>e.contactId===c.id&&campaigns[e.campaignId]&&campaigns[e.campaignId].group)).length;
  return contacts.filter(c=>c.status==="active"&&ruleSuppresses(c,r)).length;}

function openAddQuick(anchor){

/* open-ended fields use a TYPEAHEAD (options computed on demand, never preloaded);
   fixed small sets use a checkbox list. In production the typeahead hits a server
   autocomplete endpoint — we never ship a 50k-value list to the browser. */
function isOpenField(field){const d=fieldDef(field);if(!d)return false;return d.opt?d.opt==="open":(d.type==="text"||d.type==="textenum");}
function openMulti(anchor,field,sel,onChange){
  openPop(anchor,p=>{
    if(isOpenField(field)){
      const selBox=document.createElement("div");selBox.className="selbox";
      const inp=document.createElement("input");inp.type="text";inp.className="msinput";inp.placeholder=`type to find ${fieldLabel(field).toLowerCase()}…`;
      const list=document.createElement("div");list.className="sugglist";
      const drawSel=()=>{selBox.innerHTML=sel.map((s,ix)=>`<span class="seltag">${esc(s)}<b data-ix="${ix}">×</b></span>`).join("");
        selBox.querySelectorAll("b").forEach(b=>b.onclick=()=>{sel.splice(+b.dataset.ix,1);drawSel();drawList();onChange();});};
      const drawList=()=>{const q=inp.value.trim();
        if(!q){list.innerHTML=`<div class="muted" style="padding:6px 4px;font-size:11.5px">Start typing — matches load on demand (not preloaded).</div>`;return;}
        const matches=fieldOpts(field).filter(o=>o.toLowerCase().includes(q.toLowerCase())&&!sel.includes(o)).slice(0,15);
        list.innerHTML=matches.length?matches.map(o=>`<div class="suggit">${esc(o)}</div>`).join(""):`<div class="muted" style="padding:6px 4px;font-size:11.5px">No match — press Enter to add “${esc(q)}”.</div>`;
        list.querySelectorAll(".suggit").forEach((d,ix)=>d.onclick=()=>{sel.push(matches[ix]);inp.value="";drawSel();drawList();inp.focus();onChange();});};
      inp.oninput=drawList;
      inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const v=inp.value.trim();if(v&&!sel.includes(v)){sel.push(v);inp.value="";drawSel();drawList();onChange();}}};
      p.appendChild(selBox);p.appendChild(inp);p.appendChild(list);drawSel();drawList();setTimeout(()=>inp.focus(),10);
      const act=document.createElement("div");act.className="msact";act.innerHTML=`<a>Clear</a><a>Done</a>`;
      act.children[0].onclick=()=>{sel.length=0;drawSel();drawList();onChange();};act.children[1].onclick=closePop;p.appendChild(act);
    } else {
      const opts=fieldDef(field).type==="tags"?allTags():fieldOpts(field);
      opts.forEach(o=>{const lbl=document.createElement("label");
        lbl.innerHTML=`<input type="checkbox" ${sel.includes(o)?"checked":""}> <span>${esc(optLabel(field,o))}</span>`;
        lbl.querySelector("input").onchange=e=>{if(e.target.checked){if(!sel.includes(o))sel.push(o);}else{const ix=sel.indexOf(o);if(ix>=0)sel.splice(ix,1);}onChange();};
        p.appendChild(lbl);});
      const act=document.createElement("div");act.className="msact";act.innerHTML=`<a>Clear</a><a>Done</a>`;
      act.children[0].onclick=()=>{sel.length=0;[...p.querySelectorAll("input")].forEach(c=>c.checked=false);onChange();};
      act.children[1].onclick=closePop;p.appendChild(act);
    }
  });
}
function openQuickPop(anchor,i){const qf=curQuick()[i];
  openMulti(anchor,qf.field,qf.values,()=>{const chip=document.querySelector(`.qfrow [data-qf="${i}"]`);if(chip)chip.outerHTML=quickChipHTML(i);saveQuickSets();renderTable();});

/* generic anchored popover.
   The click-outside listener is stored on _popClose and removed in closePop().
   Earlier this used addEventListener(...,{once:true}); when a popover was closed
   by an INTERNAL action (picking a field/value -> closePop() directly), that
   one-shot listener was never consumed and lingered, then fired on the NEXT
   click and instantly killed the next popover — the "click does nothing / opens
   then vanishes / feels laggy" bug. */
let _pop=null,_popClose=null;
function closePop(){if(_popClose){document.removeEventListener("click",_popClose);_popClose=null;}if(_pop){_pop.remove();_pop=null;}}
function openPop(anchor,build){closePop();const p=document.createElement("div");p.className="mspop";p.onclick=e=>e.stopPropagation();
  document.body.appendChild(p);build(p);const r=anchor.getBoundingClientRect();
  p.style.left=Math.min(window.scrollX+r.left,window.scrollX+document.documentElement.clientWidth-p.offsetWidth-12)+"px";
  p.style.top=(window.scrollY+r.bottom+5)+"px";_pop=p;
  _popClose=()=>closePop();
  setTimeout(()=>document.addEventListener("click",_popClose),0);}

/* filter builder */
function filterPanel(){return `<div class="builderbox">
  <div class="bh"><h4>Filter</h4>
    <div class="matchtog"><button class="${ST.filterMatch==="all"?"on":""}" onclick="setMatch('all')">Match ALL</button><button class="${ST.filterMatch==="any"?"on":""}" onclick="setMatch('any')">Match ANY</button></div>
    <div style="flex:1"></div>
    ${ST.filters.length?`<button class="btn gray sm" onclick="ST.filters=[];renderList()">Clear all</button>`:""}
    <span class="del" style="font-size:18px" onclick="togglePanel('filter')">×</span>
  </div>
  ${ST.filters.map((c,i)=>condRow(c,i)).join("")||`<div class="muted" style="font-size:12.5px;padding:2px 0 6px">No conditions yet — add one.</div>`}
  <button class="btn ghost sm" style="margin-top:4px" onclick="addCond()">+ Add condition</button>
</div>`;}
function condRow(c,i){const def=fieldDef(c.field)||FIELDS[ST.grain][0];const ops=OPS[def.type];
  const conj=i===0?"Where":(ST.filterMatch==="any"?"or":"and");
  let val="";
  if(["empty","not_empty","has_none"].includes(c.op)){val="";}
  else if(["any","none","has_any","has_all"].includes(c.op)){const sel=Array.isArray(c.value)?c.value:[];val=`<button class="chip2 ${sel.length?"set":""}" onclick="openCondPop(this,${i})">${sel.length?esc(sel.slice(0,2).join(", "))+(sel.length>2?` +${sel.length-2}`:""):"select…"}</button>`;}
  else if(def.type==="number"){val=`<input type="number" value="${esc(typeof c.value==="string"||typeof c.value==="number"?c.value:"")}" onchange="setCondVal(${i},this.value)" style="width:88px">`;}
  else {val=`<input type="text" value="${esc(typeof c.value==="string"?c.value:"")}" onchange="setCondVal(${i},this.value)" placeholder="type text…" style="min-width:150px">`;}
  return `<div class="condrow"><span class="conj">${conj}</span>
    <select onchange="setCondField(${i},this.value)">${FIELDS[ST.grain].map(f=>`<option value="${f.k}" ${f.k===c.field?"selected":""}>${esc(f.label)}</option>`).join("")}</select>
    <select onchange="setCondOp(${i},this.value)">${ops.map(([o,l])=>`<option value="${o}" ${o===c.op?"selected":""}>${esc(l)}</option>`).join("")}</select>
    ${val}<span class="del" onclick="delCond(${i})">×</span></div>`;}
const defaultOp=t=>t==="number"?"gte":t==="enum"?"any":t==="tags"?"has_any":"contains";
function addCond(){const f=FIELDS[ST.grain][0];ST.filters.push({field:f.k,op:defaultOp(f.type),value:(f.type==="enum"||f.type==="tags")?[]:""});renderList();}
function delCond(i){ST.filters.splice(i,1);renderList();}
function setMatch(m){ST.filterMatch=m;renderList();}
function setCondField(i,k){const f=fieldDef(k);ST.filters[i].field=k;ST.filters[i].op=defaultOp(f.type);ST.filters[i].value=(f.type==="enum"||f.type==="tags")?[]:"";renderList();}
function setCondOp(i,o){const c=ST.filters[i];const setops=["any","none","has_any","has_all","has_none"];
  if(setops.includes(o)){if(!Array.isArray(c.value))c.value=[];}
  else if(!["empty","not_empty"].includes(o)){if(Array.isArray(c.value))c.value="";}
  c.op=o;renderList();}
function setCondVal(i,v){ST.filters[i].value=v;renderTable();}
function openCondPop(anchor,i){const c=ST.filters[i];if(!Array.isArray(c.value))c.value=[];
  openMulti(anchor,c.field,c.value,()=>{anchor.classList.toggle("set",c.value.length>0);
    anchor.textContent=c.value.length?(c.value.slice(0,2).join(", ")+(c.value.length>2?` +${c.value.length-2}`:"")):"select…";renderTable();});
}

    case "starts_with":return sl.startsWith(q);case "empty":return !s;case "not_empty":return !!s;}}

  return `<span class="scorewrap"><span class="pill ${cl}" title="${tip}">${sc} ${tier}</span><span class="ra dem${dem?" on":""}" title="${dem?"Demoted — click to demote further":"Demote lead score"}" onclick="event.stopPropagation();demote(${c.id})">▼</span></span>`;}

/* ---- CSV export: current grain, current filtered+sorted rows, visible columns (values, not HTML) ---- */
function buildCSV(){
  const cols=visCols().filter(([k])=>k!=="acts");        // skip the row-actions column (no value)
  const rows=listRows();
  const q=v=>{v=(v==null)?"":Array.isArray(v)?v.join("; "):(""+v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const head=cols.map(([k,l])=>q(l)).join(",");
  const body=rows.map(r=>cols.map(([k])=>q(fval(r,k))).join(",")).join("\n");
  return {csv:head+(body?"\n"+body:""), nrows:rows.length, ncols:cols.length};
}
function exportCSV(){
  const {csv,nrows,ncols}=buildCSV();

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=`outreach-${ST.grain}-${Date_now()}.csv`;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);

}

function renderStageMgr(){
  let h=`<div class="stagelist">`;
  STAGE_DEFS.forEach((s,i)=>{const inUse=contacts.filter(c=>c.stage===s.key).length;
    h+=`<div class="stagerow">
      <span class="pill ${s.cls}">${esc(s.label)}</span>
      <span class="muted" style="font-size:11.5px">${inUse} contact${inUse===1?"":"s"}</span>
      <span style="flex:1"></span>
      <select onchange="recolorStage('${s.key}',this.value)" title="Color">${STAGE_COLORS.map(c=>`<option value="${c[0]}" ${s.cls===c[0]?"selected":""}>${c[1]}</option>`).join("")}</select>
      <button class="btn gray sm" ${i===0?"disabled":""} onclick="moveStage(${i},-1)" title="Move up">▲</button>
      <button class="btn gray sm" ${i===STAGE_DEFS.length-1?"disabled":""} onclick="moveStage(${i},1)" title="Move down">▼</button>
      ${s.builtin?`<span class="muted" style="font-size:11px" title="Built-in stage — can't be deleted">built-in</span>`:`<button class="btn red ghost sm" onclick="removeStage('${s.key}')" title="Delete stage">✕</button>`}

  h+=`</div>

function addStageFromUI(){
  const label=($("newStageLabel").value||"").trim();if(!label){toast("Enter a stage name","warn");return;}
  const cls=$("newStageColor").value||"p-acc";
  let base=label.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")||"stage";
  let key=base,n=2;while(STAGE[key]){key=base+"_"+(n++);}
  STAGE_DEFS.push({key,label,cls,builtin:false});rebuildStages();saveStages();renderStageMgr();render();
  toast("Stage “"+label+"” added","ok");
}
function recolorStage(key,cls){const def=STAGE_DEFS.find(s=>s.key===key);if(!def)return;def.cls=cls;rebuildStages();saveStages();renderStageMgr();render();}
function moveStage(i,dir){const j=i+dir;if(j<0||j>=STAGE_DEFS.length)return;const[m]=STAGE_DEFS.splice(i,1);STAGE_DEFS.splice(j,0,m);rebuildStages();saveStages();renderStageMgr();render();}
function removeStage(key){const def=STAGE_DEFS.find(s=>s.key===key);if(!def||def.builtin)return;
  const inUse=contacts.filter(c=>c.stage===key).length;
  if(inUse){if(!confirm(inUse+" contact"+(inUse===1?" is":"s are")+" in “"+def.label+"”. Move "+(inUse===1?"it":"them")+" to New and delete this stage?"))return;
    contacts.forEach(c=>{if(c.stage===key)c.stage="new";});}
  STAGE_DEFS=STAGE_DEFS.filter(s=>s.key!==key);rebuildStages();saveStages();renderStageMgr();render();toast("Stage “"+def.label+"” removed","");}

/* drawer section for the LinkedIn-activity deep-enrich (runs in the outreach engine) */
function activityDrawer(c){
  if(!c.linkedin_url) return `<div class="sechead">LinkedIn activity</div><div class="muted" style="font-size:12.5px">No LinkedIn URL — nothing to enrich.</div>`;
  const s=c.activityStatus, a=c.liActivity;
  const badge = s==="enriching"?`<span class="pill p-acc">enriching…</span>`
    : s==="pending"?`<span class="pill p-gray">pending</span>`
    : s==="stale"?`<span class="pill p-amb">enriched · stale</span>`
    : (a&&a.status!=="ok")?`<span class="pill p-gray">${esc(a.status)}</span>`
    : `<span class="pill p-grn">enriched</span>`;
  let detail="";
  if(a&&a.status==="ok"){
    detail=`<div class="statline" style="margin-top:7px">
      <div class="s"><b>${a.connBand}</b> connections</div>
      <div class="s"><b>${a.followers}</b> followers</div>
      <div class="s"><b>${a.lastPostBand}</b> last post</div>
      <div class="s"><b>${a.cadenceBand}</b> cadence</div>
      <div class="s"><b>${a.posts90d}</b> posts/90d <span class="muted">(${a.original90d} orig)</span></div>
      ${a.isCreator?`<div class="s">★ creator</div>`:""}</div>`;
  } else if(s==="pending"){
    detail=`<div class="muted" style="font-size:12px;margin-top:4px">Not yet enriched — the background worker will reach it (best-first), or enrich it now.</div>`;
  } else if(a&&a.status!=="ok"){
    detail=`<div class="muted" style="font-size:12px;margin-top:4px">Unipile returned <b>${esc(a.status)}</b> — profile/posts not retrievable.</div>`;
  }
  const btn = s==="enriching"?"" : `<button class="btn teal ghost sm" style="margin-top:8px" onclick="enrichOne(${c.id})">⚡ ${a?"Refresh":"Enrich"} activity (Unipile)</button>`;
  return `<div class="sechead">LinkedIn activity <span class="secnote">— deep-enrich runs here (slow drip · client's Unipile)</span></div>
    <div>${badge}${detail}${btn}</div>`;
}
function omitOne(id){const c=contacts[id];const r=prompt("Reason for omitting?","wrong-vertical");if(r==null)return;snapshot("omit contact");c.status="omitted";c.omitReason=r;omissions.push({contactId:id,reason:r,ts:Date_now()});toast("Omitted · Ctrl+Z to undo","warn");closeDrawer();render();}
function restoreOne(id){snapshot("restore contact");contacts[id].status="active";toast("Restored","ok");closeDrawer();render();}
function pushOne(id){snapshot("sync to LinkedIn");contacts[id].linkedinState="synced";toast("Synced to the LinkedIn Engine · Ctrl+Z to undo","ok");render();refreshDrawer();}
function demoteDrawer(id){demote(id);openContact(id);}
function resetScore(id){snapshot("reset score");contacts[id].scoreAdj=0;openContact(id);render();}
function demoteBy(id,n){snapshot("demote score");const c=contacts[id];c.scoreAdj=(c.scoreAdj||0)-n;openContact(id);render();}

function renderFollow(){
  const open=followups.filter(f=>!f.done);
  const done=followups.filter(f=>f.done).sort((a,b)=>a.due<b.due?1:-1);
  const bucketOf=f=> f.due<TODAY?"Overdue" : f.due===TODAY?"Today" : (daysBetween(TODAY,f.due)<=7?"This week":"Later");
  const order=["Overdue","Today","This week","Later"];
  const groups={Overdue:[],Today:[],"This week":[],Later:[]};
  open.forEach(f=>groups[bucketOf(f)].push(f));
  order.forEach(k=>groups[k].sort((a,b)=>a.due<b.due?-1:1));
  const od=groups.Overdue.length, td=groups.Today.length, wk=groups["This week"].length;

  const rowHtml=f=>{const c=contacts[f.contactId],a=accOf(c);const[st,scl]=stageInfo(c.stage||"new");const overdue=!f.done&&f.due<TODAY;const dd=daysBetween(TODAY,f.due);
    return `<tr>

function campStats(c){const e=enrollments.filter(x=>x.campaignId===c.id);
  const g=s=>e.filter(x=>x.status===s).length;
  // include template seed counts for the snapshot realism
  const tSent=c.templates.reduce((n,t)=>n+t.sent,0), tRep=c.templates.reduce((n,t)=>n+t.replied,0);
  return {queued:g("queued"),sent:g("sent")+g("replied")+tSent,replied:g("replied")+tRep,bounced:g("bounced"),unsub:g("unsubscribed"),total:e.length};}
function statusPill(s){const m={active:"p-grn",draft:"p-gray",paused:"p-amb"};return `<span class="pill ${m[s]||"p-gray"}">${s}</span>`;}

/* ---- New-qualifying contacts (re-run a campaign's OWN segment) ----------------
   A campaign's segment is a LIVE definition: as Enrichment adds contacts/emails to
   the master list, more people start matching it. This surfaces the ones that now
   match but aren't enrolled yet, as a one-click "+N new → Add" affordance, so you
   never have to rebuild a segment to pick up newcomers. (Mirrors the museum
   explorer's _find_new_prospects / add-prospects, now also live in the
   marketing-data-explorer email tool.) In production this re-runs the stored
   segment_criteria against the master list and excludes anyone already enrolled —
   see BUILD_NOTES.md §6 (Campaigns ▸ "New-qualifying"). Here it's a deterministic mock. */
function _ownerTitle(t){return /Owner|Founder|Principal|Managing Partner|CEO/i.test(t||"");}
function _mktTitle(t){return /Marketing/i.test(t||"");}
function segPredicate(c){            // mock matcher standing in for each campaign's stored criteria
  const A=ct=>accOf(ct);
  if(c.group==="Q3 Introduction" && /Owners/.test(c.name)) return ct=>ct.verified && _ownerTitle(ct.title);
  if(c.group==="Q3 Introduction" && /Marketing/.test(c.name)) return ct=>ct.verified && _mktTitle(ct.title);
  if(c.name==="NorthStar AI Launch") return ct=>["Creative Agency","Digital Marketing","SEO Agency","Branding Studio"].includes(A(ct).category);
  return null;                       // e.g. the follow-up draft's segment is reply-derived — no net-new surfaced in the mock
}
function newQualifying(c){
  const pred=segPredicate(c); if(!pred) return [];
  const enrolled=new Set(enrollments.filter(e=>e.campaignId===c.id).map(e=>e.contactId));
  // matches the segment, has an email, not already enrolled here, and passes the
  // SAME global guardrails a send would (group dedupe, omit, unsub, first-name, …)
  return contacts.filter(ct=>ct.status==="active" && ct.email && !enrolled.has(ct.id) && pred(ct) && isEligible(ct,c));
}
function addNewQualifying(id){
  const c=campaigns[id], fresh=newQualifying(c);
  if(!fresh.length){toast("No new qualifying contacts.","");return;}
  if(!confirm("Add "+fresh.length+" newly-qualifying contact"+(fresh.length>1?"s":"")+" to “"+c.name+"” as queued?"))return;
  snapshot("Add "+fresh.length+" new → "+c.name);
  const tmpl=(c.templates[0]||{}).id;
  fresh.forEach(ct=>{enrollments.push({campaignId:c.id,contactId:ct.id,templateId:tmpl,status:"queued"});ct.emailState="queued";});
  toast("Added "+fresh.length+" new contact"+(fresh.length>1?"s":"")+" → "+c.name+" (queued)","good");
  renderCamp();
}
function setCampaignGroup(id){const existing=[...new Set(campaigns.map(c=>c.group).filter(Boolean))];
  const g=prompt("Group this campaign with related ones (same group = a contact appears in only one).\nLeave blank for an independent campaign."+(existing.length?"\n\nExisting groups: "+existing.join(", "):""),campaigns[id].group||"");
  if(g===null)return;campaigns[id].group=g.trim();renderCamp();toast(g.trim()?"Grouped under “"+g.trim()+"”":"Campaign set independent","");}

/* ---- Amazon SES sending-health monitoring (mock; in prod fed by SES/CloudWatch metrics) ----
   Reputation (bounce/complaint) is tracked per SENDING DOMAIN; our two domains are isolated SES
   setups (acmestudio.com vs northstar-ai.com), each with their own identities. */
const SES=[
  {id:"acmestudio.com", label:"acmestudio.com", region:"us-east-1", identities:["alex@acmestudio.com"],
    sent24h:1840, quota:50000, rate:14, deliveries:11420, bounces:131, complaints:6},
  {id:"northstar-ai.com", label:"northstar-ai.com", region:"us-east-1", identities:["alex@northstar-ai.com","jamie@northstar-ai.com"],
    sent24h:610, quota:50000, rate:14, deliveries:3180, bounces:142, complaints:14},
];
const nf=n=>(""+n).replace(/\B(?=(\d{3})+(?!\d))/g,",");        // 11420 -> "11,420" (deterministic)
// AWS guidance: bounce review ≈5% / pause ≈10%; complaint target <0.1% / enforcement ≈0.5%
function sesStatus(rate,warnAt,badAt){return rate>=badAt?["p-red","Critical","bad"]:rate>=warnAt?["p-amb","Elevated","warn"]:["p-grn","Healthy","ok"];}
const _rank={ok:0,warn:1,bad:2};
function sesRows(){return SES.map(s=>{
  const br=s.deliveries?s.bounces/s.deliveries*100:0, cr=s.deliveries?s.complaints/s.deliveries*100:0;
  const b=sesStatus(br,5,10), c=sesStatus(cr,0.1,0.5);
  const worst=_rank[b[2]]>=_rank[c[2]]?b:c;
  return {s,br,cr,b,c,worst,quotaPct:Math.round(s.sent24h/s.quota*100)};});}
function sesOverall(){return sesRows().reduce((w,r)=>_rank[r.worst[2]]>_rank[w[2]]?r.worst:w,["p-grn","Healthy","ok"]);}
function toggleSesHealth(){ST.sesOpen=!ST.sesOpen;try{localStorage.setItem("oe_sesopen",ST.sesOpen?"1":"0");}catch(e){}renderCamp();}
function sesHealthCard(){
  const rows=sesRows(), ov=sesOverall();
  const ovLabel=ov[2]==="ok"?"All healthy":ov[2]==="warn"?"Monitor":"Action needed";
  const weak=rows.filter(r=>r.worst[2]!=="ok").map(r=>r.s.label);
  const open=ST.sesOpen;
  return `<div class="card seshealth${open?"":" collapsed"}" data-tut="ses">
    <div class="shhead" onclick="toggleSesHealth()" title="${open?"Collapse":"Expand"} sending health">
      <h3><span class="caret">${open?"▾":"▸"}</span> Sending health <span class="muted" style="font-weight:400">· Amazon SES · last 24h</span></h3>
      <span class="pill ${ov[0]}">${ovLabel}</span></div>
    ${open?`<div class="shbody">
    <div class="tablewrap" style="max-height:none"><table class="listtbl shtbl">
      <thead><tr><th class="nosort">Sending domain</th><th class="nosort tnum">Sent 24h</th><th class="nosort">Daily quota</th><th class="nosort tnum">Rate</th><th class="nosort">Bounce</th><th class="nosort">Complaint</th><th class="nosort">Reputation</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td><b>${esc(r.s.label)}</b><div class="acct">${r.s.identities.map(esc).join(", ")} · ${r.s.region}</div></td>
        <td class="tnum">${nf(r.s.sent24h)}</td>
        <td style="min-width:120px"><div class="meter"><i style="width:${r.quotaPct}%"></i></div><span class="muted" style="font-size:11px">${nf(r.s.sent24h)} / ${nf(r.s.quota)}</span></td>
        <td class="tnum">${r.s.rate}/s</td>
        <td><span class="pill ${r.b[0]}" title="${nf(r.s.bounces)} of ${nf(r.s.deliveries)} delivered">${r.br.toFixed(2)}%</span></td>
        <td><span class="pill ${r.c[0]}" title="${nf(r.s.complaints)} spam reports">${r.cr.toFixed(2)}%</span></td>
        <td><span class="pill ${r.worst[0]}">${r.worst[1]}</span></td>
      </tr>`).join("")}</tbody></table></div>
    <div class="guide ${ov[2]==="ok"?"":"amber"}" style="margin-top:12px;font-size:12px"><span class="ic">${ov[2]==="ok"?"✓":"⚠"}</span><div>
      AWS reviews accounts when <b>bounce &gt; 5%</b> and may pause sending near <b>10%</b>; the <b>complaint</b> (spam) target is <b>&lt; 0.1%</b>, with enforcement around <b>0.5%</b>.${weak.length?` <b>${weak.join(", ")}</b> ${weak.length>1?"are":"is"} trending up — tighten to verified-only sends, slow the warm-up, or pause the weakest segment before it crosses a threshold.`:` Both domains are well within limits — keep verification + warm-up pacing on.`}</div></div>
    </div>`:""}
  </div>`;
}

    ? `<input type="text" id="nrVal" placeholder="tag, e.g. competitor" style="min-width:150px">`
    : `<input type="number" id="nrVal" placeholder="min score, e.g. 60" style="width:130px">`;}
function addRule(){const k=$("nrKind").value,v=($("nrVal").value||"").trim();
  if(!v){toast("Enter a value for the rule","warn");return;}
  if(k==="tag")campaignRules.push({id:"c"+(++_ruleSeq),type:"custom",kind:"tag",tag:v,enabled:true,label:"Exclude tag “"+v+"”",desc:"Accounts or contacts tagged "+v+" are suppressed."});
  else campaignRules.push({id:"c"+(++_ruleSeq),type:"custom",kind:"minscore",threshold:+v,enabled:true,label:"Minimum lead score "+(+v),desc:"Contacts below a lead score of "+(+v)+" are suppressed."});
  saveRules();openCampaignSettings();if(ST.tab==="camp")renderCamp();toast("Rule added","ok");}
function delRule(i){if(campaignRules[i].locked)return;campaignRules.splice(i,1);saveRules();openCampaignSettings();if(ST.tab==="camp")renderCamp();}

let sending=false;
function runSend(campId){
  if(sending)return;const camp=campaigns[campId];
  const q=enrollments.filter(e=>e.campaignId===campId&&e.status==="queued");
  if(!q.length)return; snapshot("send campaign batch"); sending=true;
  $("sndGo").disabled=true;let i=0;
  const bar=$("sndBar").firstElementChild;
  const step=()=>{
    if(i>=q.length){sending=false;toast("Send complete — "+q.length+" sent","ok");renderCamp();return;}
    const e=q[i]; const r=rnd(); e.status = r<.12?"replied":r<.17?"bounced":"sent";
    contacts[e.contactId].emailState=e.status; i++;
    bar.style.width=Math.round(i/q.length*100)+"%";
    $("sndRun").textContent=`sending… ${i}/${q.length}`;
    setTimeout(step,55);
  };
  step();
}

/* ============================ boot ============================ */
loadColPrefs();
loadViews();
loadQuickSets();
loadRules();
loadStages();
try{const s=localStorage.getItem("oe_sesopen");if(s!==null)ST.sesOpen=s==="1";}catch(e){}

document.addEventListener("dblclick",e=>{const td=e.target.closest&&e.target.closest("#listwrap td[data-col]");if(!td)return;const tr=td.closest("tr[data-k]");if(tr)startCellEdit(tr,td);});
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&(e.key==="z"||e.key==="Z")){
    const t=document.activeElement,tag=t&&t.tagName;
    if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;  // let native text-undo work
    e.preventDefault();undo();
  }
});
go("dash");
/* deep-link: ?focus=c<id> or a<id> opens that record's drawer (shareable links) */
try{const fp=new URLSearchParams(location.search).get("focus");
  if(fp){const isC=fp[0]==="c";const id=+fp.slice(1);
    if(!isNaN(id)){go("list");setGrain(isC?"contacts":"accounts");
      if(isC&&contacts[id]&&!contacts[id]._deleted)openContact(id);
      else if(!isC&&accounts[id]&&!accounts[id]._deleted)openAccount(id);}}
}catch(e){}
</script>
