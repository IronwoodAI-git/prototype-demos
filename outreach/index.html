      <button class="btn gray sm" ${i===STAGE_DEFS.length-1?"disabled":""} onclick="moveStage(${i},1)" title="Move down">▼</button>
      ${s.builtin?`<span class="muted" style="font-size:11px" title="Built-in stage — can't be deleted">built-in</span>`:`<button class="btn red ghost sm" onclick="removeStage('${s.key}')" title="Delete stage">✕</button>`}
    </div>`;});
  h+=`</div>
    <div class="sechead">Add a stage</div>
    <div class="condrow" style="flex-wrap:wrap">
      <input type="text" id="newStageLabel" placeholder="Stage name (e.g. Proposal sent)" style="min-width:210px" onkeydown="if(event.key==='Enter')addStageFromUI()">
      <select id="newStageColor">${STAGE_COLORS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join("")}</select>
      <button class="btn sm" onclick="addStageFromUI()">+ Add stage</button>
    </div>`;
  $("stagemgr").innerHTML=h;
}
function addStageFromUI(){
  const label=($("newStageLabel").value||"").trim();if(!label){toast("Enter a stage name","warn");return;}
  const cls=$("newStageColor").value||"p-acc";
  let base=label.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")||"stage";
  let key=base,n=2;while(STAGE[key]){key=base+"_"+(n++);}
  STAGE_DEFS.push({key,label,cls,builtin:false});rebuildStages();saveStages();renderStageMgr();render();
  toast("Stage “"+label+"” added","ok");
}
function recolorStage(key,cls){const def=STAGE_DEFS.find(s=>s.key===key);if(!def)return;def.cls=cls;rebuildStages();saveStages();renderStageMgr();render();}
function moveStage(i,dir){const j=i+dir;if(j<0||j>=STAGE_DEFS.length)return;const[m]=STAGE_DEFS.splice(i,1);STAGE_DEFS.splice(j,0,m);rebuildStages();saveStages();renderStageMgr();render();}
function removeStage(key){const def=STAGE_DEFS.find(s=>s.key===key);if(!def||def.builtin)return;
  const inUse=contacts.filter(c=>c.stage===key).length;
  if(inUse){if(!confirm(inUse+" contact"+(inUse===1?" is":"s are")+" in “"+def.label+"”. Move "+(inUse===1?"it":"them")+" to New and delete this stage?"))return;
    contacts.forEach(c=>{if(c.stage===key)c.stage="new";});}
  STAGE_DEFS=STAGE_DEFS.filter(s=>s.key!==key);rebuildStages();saveStages();renderStageMgr();render();toast("Stage “"+def.label+"” removed","");}

function focusReviewBlock(a,id){
  const ft=a.focus_type||"", v=a.focus_feedback_verdict||"";
  const isCand = ft==="vertical"||ft==="horizontal+vertical"||!!v||a.is_focused;
  if(!isCand && !a.specialization) return "";
  const clar = a.niche_clarity!=null?a.niche_clarity:"—";
  const badge = `<span class="pill ${a.is_focused?"p-grn":"p-gray"}">${esc(ft||"—")}</span>`;
  const meta = `${badge} <span class="muted" style="font-size:11.5px">clarity ${clar}</span>`;
  const evid = [
    a.specialization?frow("Specialization", `<span class="muted">${esc(a.specialization)}</span>`):"",
    a.target_customer_type?frow("Target vertical", `<span class="muted">${esc(a.target_customer_type)}</span>`):"",
    a.niche_evidence?frow("Evidence", `<span class="muted" style="font-size:12px">${esc(a.niche_evidence)}</span>`):"",
  ].join("");
  let action;
  if(v==="confirmed"){
    action = `<div class="hist" style="border-color:#bbe6c4;background:#f4fbf5"><b style="color:var(--grn,#1a7f37)">✓ You confirmed this is focused</b>${a.focus_feedback_at?`<span class="pill p-grn" style="float:right">${esc(a.focus_feedback_at.slice(0,10))}</span>`:""}${a.focus_feedback?`<div class="muted" style="margin-top:3px">"${esc(a.focus_feedback)}"</div>`:""}<div class="btnrow" style="margin-top:8px"><button class="btn gray sm" onclick="focusVerdict(${id},'')">↺ Undo verdict</button></div></div>`;
  } else if(v==="not_focused"){
    action = `<div class="hist" style="border-color:#f0c9c9;background:#fdf5f5"><b style="color:var(--red,#b42318)">✗ You flagged this as NOT focused</b>${a.focus_feedback_at?`<span class="pill p-red" style="float:right">${esc(a.focus_feedback_at.slice(0,10))}</span>`:""}${a.focus_feedback?`<div class="muted" style="margin-top:3px">"${esc(a.focus_feedback)}"</div>`:""}<div class="btnrow" style="margin-top:8px"><button class="btn gray sm" onclick="focusVerdict(${id},'')">↺ Undo verdict</button></div></div>`;
  } else {
    action = `<input id="ffNote${id}" class="cellin" placeholder="reason (required to reject, optional to confirm)" style="width:100%;margin:6px 0">
      <div class="btnrow"><button class="btn red ghost sm" onclick="focusVerdict(${id},'not_focused')">✗ Not actually focused</button><button class="btn teal sm" onclick="focusVerdict(${id},'confirmed')">✓ Correctly focused</button></div>`;
  }
  return `<div class="sechead">Focus review</div>${frow("Model verdict", meta)}${evid}${action}`;
}
function focusVerdict(id,verdict){
  const a=accounts[id]; if(!a) return;
  if(a.dbId==null){toast("No database id for this account — reload the page","warn");return;}
  const el=document.getElementById("ffNote"+id);
  const note=(el&&el.value||"").trim();
  if(verdict==="not_focused" && !note){toast("Add a short reason before flagging not-focused","warn");if(el)el.focus();return;}
  _api("/api/account/focus_feedback",{accountId:a.dbId,verdict:verdict,note:note}).then(res=>{
    if(res&&res.ok){
      a.is_focused=res.is_focused; a.focus_type=res.focus_type;
      a.focus_feedback_verdict=res.focus_feedback_verdict; a.focus_feedback=res.focus_feedback; a.focus_feedback_at=res.focus_feedback_at;
      toast(verdict===""?"Verdict cleared":(verdict==="confirmed"?"Confirmed focused ✓":"Flagged not-focused ✗"),"ok");
      render(); if(ST.drawerAccount===id) openAccount(id);
    } else toast((res&&res.error)||"Save failed","warn");
  });
}

  let detail="";
  if(a&&a.status==="ok"){
    detail=`<div class="statline" style="margin-top:7px">
      <div class="s"><b>${a.connBand}</b> connections</div>

/* ===================== SEQUENCES: scheduling + stats helpers ===================== */
/* The campaign's ordered steps. Real data ships `steps`; fall back to grouping flat
   templates by stepNumber (seed / legacy) so campDetail always has a sequence. */
function seqOf(c){
  if(c.steps&&c.steps.length)return c.steps;
  const m={};(c.templates||[]).forEach(t=>{const sn=t.stepNumber||1;(m[sn]=m[sn]||[]).push(t);});
  return Object.keys(m).map(Number).sort((a,b)=>a-b).map(sn=>({
    stepNumber:sn,name:m[sn][0].name,subject:m[sn][0].subject,body:m[sn][0].body,
    delayDays:m[sn][0].delayDays||0,variants:m[sn],sent:m[sn].reduce((n,t)=>n+(t.sent||0),0)}));
}
/* Business-day + holiday send-date, mirrors schedule.py so previews match the server. */
function clientSendDay(fromISO,delayDays){
  const hol=new Set(SENDRULES.holidays||[]);const skip=SENDRULES.skipWeekends!==false;
  const p=String(fromISO).slice(0,10).split("-").map(Number);
  let d=new Date(Date.UTC(p[0],p[1]-1,p[2]));
  d.setUTCDate(d.getUTCDate()+(+delayDays||0));
  for(let i=0;i<400;i++){const wd=d.getUTCDay();const iso=d.toISOString().slice(0,10);
    if(!((skip&&(wd===0||wd===6))||hol.has(iso)))break;
    d.setUTCDate(d.getUTCDate()+1);}
  return d.toISOString().slice(0,10);
}
function schedNote(){const h=(SENDRULES.holidays||[]).length;const parts=[];
  if(SENDRULES.skipWeekends!==false)parts.push("weekends");
  if(h)parts.push(h+" holiday"+(h>1?"s":""));
  return parts.length?("skipping "+parts.join(" & ")):"on any day";}
function timingLabel(st,i){if((st.stepNumber||1)===1||i===0)return "sent first (on enrollment)";
  const d=st.delayDays||0;return d+" day"+(d===1?"":"s")+" after step "+((st.stepNumber||1)-1);}
function fmtDue(iso){if(!iso)return "—";
  if(iso<TODAY)return `<span class="pill p-amb" title="overdue — will go out on the next send">${iso} ⚠</span>`;
  if(iso===TODAY)return `<span class="pill p-grn">today</span>`;return iso;}
function campSeqStats(c){
  const roster=enrollments.filter(e=>e.campaignId===c.id);
  const steps=seqOf(c);let active=0,replied=0,completed=0,due=0,contacted=0;
  roster.forEach(e=>{const ss=e.seqStatus||"active";
    if(ss==="active"){active++;if(!e.nextSendAt||e.nextSendAt<=TODAY)due++;}
    else if(ss==="completed")completed++;
    if(ss==="replied"||ss==="interested")replied++;
    if((e.currentStep||0)>0)contacted++;});
  const sent=steps.reduce((n,st)=>n+(st.sent||0),0);
  const exited=roster.length-active-completed;
  return {active,replied,completed,due,contacted,sent,exited,total:roster.length};}

/* ===================== SEQUENCES: stop / resume a contact ===================== */
function stopSeq(contactArrIdx,seqStatus,reason){
  const ct=contacts[contactArrIdx];if(!ct)return;
  snapshot("stop sequence");
  enrollments.forEach(e=>{if(e.contactId===contactArrIdx&&(e.seqStatus==="active"||e.seqStatus==="paused")){
    e.seqStatus=seqStatus;e.exitReason=reason;e.nextSendAt=null;}});
  if(seqStatus==="replied"||seqStatus==="interested"){ct.stage="interested";if(["sent","queued","none"].includes(ct.emailState))ct.emailState="replied";}
  if(seqStatus==="not_interested")ct.stage="not_interested";
  if(ct.dbId!=null)_api("/api/sequence/action",{contactId:ct.dbId,op:"stop",seqStatus,reason});
  toast("Sequence stopped for "+esc(ct.name)+" · "+reason+" · Ctrl+Z to undo","ok");
  renderCamp();
}
function resumeSeq(contactArrIdx){
  const ct=contacts[contactArrIdx];if(!ct)return;
  snapshot("resume sequence");
  enrollments.forEach(e=>{if(e.contactId===contactArrIdx&&["paused","not_interested","interested","replied"].includes(e.seqStatus)){
    const camp=campaigns[e.campaignId];const steps=seqOf(camp);const nextStep=(e.currentStep||0)+1;
    if(nextStep>steps.length){e.seqStatus="completed";e.nextSendAt=null;}
    else{e.seqStatus="active";e.exitReason=null;
      const base=e.lastSentAt||TODAY;e.nextSendAt=clientSendDay(base,(steps[nextStep-1]||{}).delayDays||0);}}});
  if(ct.dbId!=null)_api("/api/sequence/action",{contactId:ct.dbId,op:"resume"});
  toast("Sequence resumed for "+esc(ct.name),"ok");renderCamp();
}

/* Render the signature exactly as an inbox would, and flag the two things that actually
   break a pasted Gmail signature: inline data: images (Gmail embeds them; they bloat the
   message and many clients strip them) and relative image paths that resolve nowhere. */
function renderSigPreview(){
  const el=$("bldSig"), fr=$("sigFrame"), warn=$("sigWarn");
  if(!el||!fr)return;
  const v=el.value||"";
  fr.srcdoc=`<!doctype html><meta charset="utf-8"><body style="margin:0;padding:10px;font-family:Arial,sans-serif">${v||'<span style="color:#999">(empty)</span>'}</body>`;
  const msgs=[];
  const imgs=(v.match(/<img[^>]*>/gi)||[]);
  if(/src\s*=\s*["']?data:/i.test(v))msgs.push("⚠ contains an inline <code>data:</code> image — host it at a URL instead, several clients strip these");
  imgs.forEach(t=>{const m=t.match(/src\s*=\s*["']([^"']+)/i);
    if(m&&!/^https?:\/\//i.test(m[1])&&!/^data:/i.test(m[1]))msgs.push("⚠ image <code>"+esc(m[1].slice(0,40))+"</code> isn't an absolute https URL — it won't load in an inbox");});
  if(v&&!/<[a-z]/i.test(v))msgs.push("plain text — line breaks are preserved automatically");
  else if(imgs.length)msgs.push(imgs.length+" image"+(imgs.length===1?"":"s")+" found");
  warn.innerHTML=msgs.join(" · ");
}

/* A campaign's REAL target audience = the guardrails (isEligible) PLUS its own stored
   tier/size criteria. The guardrails alone don't know about tier or size — those live in
   segment_criteria — so without this the preview and coverage check page a superset
   (6,999 instead of B·Small's 1,736) and disagree with the "See audience" button. */
function campaignAudience(c){
  if(!c)return contacts.filter(x=>x.status==="active"&&x.dbId!=null&&x.email);
  let sc={}; try{sc=JSON.parse(c.segmentCriteria||"{}")||{};}catch(e){sc={};}
  const tiers=sc.tier||sc.tiers, bands=sc.size_bands;
  return contacts.filter(x=>{
    if(x.status!=="active"||x._deleted||x.dbId==null)return false;
    const a=accOf(x)||{};
    if(Array.isArray(tiers)&&tiers.length&&!tiers.includes(a.fit_tier||""))return false;
    if(Array.isArray(bands)&&bands.length&&!bands.includes(a.size_band||""))return false;
    return isEligible(x,c);
  });
}
/* ---- Enroll a campaign's OWN audience ---------------------------------------
   "See audience" answered *who qualifies*; this closes the loop and actually puts
   them in the campaign. Same resolver (campaignAudience) the audience view and
   the preview use, so what you looked at is exactly what gets enrolled — minus
   anyone already in. The server's /api/enroll is the real choke point: it
   re-checks li_block and refuses duplicates, so a double-click can't double-add.
   Enrolling is NOT sending — warm-up still caps the daily volume and every batch
   is still started by hand. */
let _enrollBusy=false;
async function enrollAudience(campIdx,btn){
  const c=campaigns[campIdx]; if(!c)return;
  if(_enrollBusy){toast("Already enrolling — hang tight","warn");return;}
  if(c.status==="archived"){toast("That campaign is archived.","warn");return;}
  if(!seqOf(c).length||!(seqOf(c)[0]||{}).subject){
    if(!confirm("“"+c.name+"” has no step-1 subject yet. Enroll anyway?\n\nNothing sends until you start a batch, so this is safe — but the sequence won't be ready."))return;
  }
  const aud=campaignAudience(c);
  const already=new Set(enrollments.filter(e=>e.campaignId===c.id).map(e=>e.contactId));
  const fresh=aud.filter(ct=>!already.has(ct.id));
  if(!fresh.length){
    toast(aud.length?`All ${nf(aud.length)} qualifying contacts are already enrolled.`:"No contacts currently match this campaign's segment.","warn");
    return;
  }
  // The three numbers must reconcile on screen — audience, already in, net new.
  const ans=prompt(
    `Enroll into “${c.name}”\n\n`+
    `  ${nf(aud.length)} contacts match this campaign's audience\n`+
    `  ${nf(already.size)} already enrolled\n`+
    `  ${nf(fresh.length)} would be added now\n\n`+
    `Enrolling does NOT send anything — warm-up still caps daily volume and you start each batch by hand.\n\n`+
    `How many to add? (master-list order; blank/all = ${nf(fresh.length)})`, String(fresh.length));
  if(ans===null)return;
  const want=(""+ans).trim()===""?fresh.length:parseInt(ans,10);
  if(!(want>0)){toast("Enter a number greater than zero.","warn");return;}
  const take=fresh.slice(0,Math.min(want,fresh.length));
  _enrollBusy=true;
  const restore=btn?btn.innerHTML:null;
  if(btn){btn.disabled=true;btn.innerHTML=`<span class="spin"></span> Enrolling ${nf(take.length)}…`;}
  snapshot("enroll "+take.length+" → "+c.name);
  try{
    const res=await _api("/api/enroll",{campaignId:c.dbId,contactIds:take.map(ct=>ct.dbId).filter(x=>x!=null)});
    if(!res||!res.ok){toast("Enroll failed — nothing was added.","warn");undo();return;}
    // mirror the server's result into client state (it, not us, decides what stuck)
    const tmpl=(c.templates[0]||{}).id;
    const due=clientSendDay(TODAY,(seqOf(c)[0]||{}).delayDays||0);
    take.forEach(ct=>{
      if(enrollments.some(e=>e.campaignId===c.id&&e.contactId===ct.id))return;
      enrollments.push({campaignId:c.id,contactId:ct.id,templateId:tmpl,status:"queued",
                        seqStatus:"active",currentStep:0,nextSendAt:due,exitReason:null});
      if(ct.emailState==="none")ct.emailState="queued";});
    c.enrolled=(c.enrolled||0)+(res.added||0);
    const li=res.li_excluded_n||0;
    toast(`${nf(res.added||0)} enrolled in “${c.name}”`+
          (li?` · ${li} held back (LinkedIn relationship)`:"")+
          (res.skipped-li>0?` · ${res.skipped-li} already in`:""),"good");
  } finally {
    _enrollBusy=false;
    if(btn){btn.disabled=false;btn.innerHTML=restore;}
    renderCamp();
  }
}

/* ---- merge-tag coverage (concept ported from the museum CRM) --------------------------
   Every {{tag}} you use is REQUIRED on every recipient. Warn up-front how many of this
   campaign's people have it blank, because at send time they'd either be skipped or —
   worse — receive "Hi ,". Non-data tags are excluded (the sender fills those). */
function renderMergeCheck(){
  const host=$("mergeCheck"); if(!host)return;
  const c=_builder.id!=null?campaigns[_builder.id]:null;
  const used=new Set();
  _builder.steps.forEach(s=>{((s.subject||"")+" "+(s.body||"")).replace(/\{\{([a-zA-Z_][a-zA-Z0-9_]*)\}\}/g,(m,k)=>{used.add(k);return m;});});
  NON_DATA_TAGS.forEach(([t])=>used.delete(t));
  const known=new Set(MERGE_FIELDS.map(f=>f[0]));
  const unknown=[...used].filter(t=>!known.has(t));
  if(!used.size&&!unknown.length){host.innerHTML="";return;}
  // audience = enrolled if any, else the campaign's guardrail-eligible set
  let aud=[];
  if(c){aud=enrollments.filter(e=>e.campaignId===c.id).map(e=>contacts[e.contactId]).filter(Boolean);
    if(!aud.length)aud=campaignAudience(c);}   // same set as "See audience" / the preview stepper
  const by={};
  aud.forEach(ct=>{const v=mergeValues(ct);used.forEach(t=>{if(known.has(t)&&!String(v[t]||"").trim())by[t]=(by[t]||0)+1;});});
  const bad=Object.entries(by).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]);
  let h="";
  if(unknown.length)
    h+=`<div class="guide" style="margin-top:10px;border-color:#c92a2a"><span class="ic">⛔</span><div><b>Unknown merge tag${unknown.length>1?"s":""}:</b> ${unknown.map(t=>`<code>{{${esc(t)}}}</code>`).join(", ")} — these are not real fields and would send <i>literally</i>. Use the Insert buttons above.</div></div>`;
  if(bad.length)
    h+=`<div class="guide" style="margin-top:10px;border-color:#f59f00"><span class="ic">⚠</span><div><b>Blank for some recipients:</b> ${bad.map(([t,n])=>`<code>{{${esc(t)}}}</code> — ${n}`).join(", ")}. Those would render empty (e.g. “Hi ,”). Either drop the tag, or move them to a non-personalized campaign.</div></div>`;
  if(!h&&used.size)
    h=`<div class="guide" style="margin-top:10px"><span class="ic">✓</span><div>All ${used.size} merge tag${used.size===1?"":"s"} populated for every recipient${aud.length?` (${aud.length} checked)`:""}.</div></div>`;
  host.innerHTML=h;
}

/* ---- New-qualifying contacts (re-run a campaign's OWN segment) ----------------
   A campaign's segment is a LIVE definition: as Enrichment adds contacts/emails to
   the master list, more people start matching it. This surfaces the ones that now
   match but aren't enrolled yet, as a one-click "+N new → Add" affordance, so you
   never have to rebuild a segment to pick up newcomers. (Mirrors the museum
   explorer's _find_new_prospects / add-prospects, now also live in the
   marketing-data-explorer email tool.) In production this re-runs the stored
   segment_criteria against the master list and excludes anyone already enrolled —
   see BUILD_NOTES.md §6 (Campaigns ▸ "New-qualifying"). Here it's a deterministic mock. */
/* Was a hardcoded mock matcher keyed off prototype campaign names ("Q3
   Introduction", "Demo AI Launch"), so it returned null — and therefore
   ZERO new-qualifying contacts — for every real campaign. That silently killed
   the "+N new → Add all" affordance, which is why campaigns 8-13 looked like
   they had no way to get recipients (2026-07-21). Now it runs the SAME
   resolver as "See audience" and the preview: campaignAudience() reads the
   campaign's stored segment_criteria (tier, size bands) and applies the live
   guardrails (valid email, owner-only, already-tried, LinkedIn-funnel hold,
   group dedupe, omit, unsub). One definition, three surfaces. */
// Memo lives for ONE render pass only (renderCamp clears it): the card and the
// detail pane both ask for the same campaign, and each answer is a full scan of
// ~22.6k contacts. Clearing per render means a rule toggle, an omit or an
// enrollment is never served stale.
const _nqCache=new Map();
function newQualifying(c){
  if(!c||c.status==="archived")return [];
  const key=c.id;
  if(_nqCache.has(key))return _nqCache.get(key);
  const enrolled=new Set(enrollments.filter(e=>e.campaignId===c.id).map(e=>e.contactId));
  const out=campaignAudience(c).filter(ct=>!enrolled.has(ct.id));
  _nqCache.set(key,out);
  return out;
}

/* Live SES health. This was a hardcoded array of invented numbers inherited from
   the demo — sent24h/bounces/complaints were all made up, and it listed only
   two of the five demo addresses. the operator was reading reputation decisions off
   fiction (2026-07-21). It now comes from /api/ses/health.

   The distinction the panel MUST preserve: SES's GetAccount/GetSendStatistics are
   ACCOUNT-WIDE — one AWS account sends for every sending domain the account owns, so the account bounce rate
   is everything mixed together, not this app's campaigns. Our own per-address
   ledger is exact but only covers what this app sent. Per-domain SES numbers need
   CloudWatch, which this IAM user can't read yet. Each block is labelled. */
let SESH=null;

const nf=n=>(""+n).replace(/\B(?=(\d{3})+(?!\d))/g,",");        // 11420 -> "11,420" (deterministic)
// AWS guidance: bounce review ≈5% / pause ≈10%; complaint target <0.1% / enforcement ≈0.5%
function sesStatus(rate,warnAt,badAt){return rate>=badAt?["p-red","Critical","bad"]:rate>=warnAt?["p-amb","Elevated","warn"]:["p-grn","Healthy","ok"];}
const _rank={ok:0,warn:1,bad:2};

/* Worst-of across the signals we can actually see. Deliberately account-scoped:
   AWS enforces at the account level, so that's the number that can stop sending. */
function sesOverall(){
  const A=SESH&&SESH.account;
  if(!A)return ["p-gray","Unknown","ok"];
  if(A.enforcementStatus&&A.enforcementStatus!=="HEALTHY")return ["p-red","Action needed","bad"];
  if(!A.sendingEnabled)return ["p-red","Sending paused","bad"];
  const w=A.window||{};
  const b=sesStatus(w.bounceRate||0,5,10), c=sesStatus(w.complaintRate||0,0.1,0.5);
  return _rank[b[2]]>=_rank[c[2]]?b:c;
}

/* ===================== SCHEDULE & AUTOMATION (per campaign) =====================
   Warm-up reputation belongs to the ADDRESS, not the campaign, and each address
   here carries two campaigns. So the daily cap you set is a per-campaign LIMIT,
   not an entitlement: while warming, the address's shared ramp ceiling wins and
   campaigns draw from it in priority order (personalized intro first, generic
   warm-up takes the remainder). The server's autosend.plan() is the single
   source of truth for that arithmetic — this panel only ever DISPLAYS what the
   server says it would send, so the UI can't drift from the sender. */
const DAYKEYS=["mon","tue","wed","thu","fri","sat","sun"];
const DAYLBL={mon:"M",tue:"T",wed:"W",thu:"T",fri:"F",sat:"S",sun:"S"};
let PLAN=null;   // last /api/autosend/plan response

const APPDIR="<the outreach-engine folder>";
async function loadPlan(){try{PLAN=await (await fetch("/api/autosend/plan")).json();}catch(e){PLAN=null;}return PLAN;}
function planFor(campDbId){
  if(!PLAN)return null;
  for(const i of (PLAN.identities||[]))for(const c of (i.campaigns||[]))
    if(c.id===campDbId)return {...c,budget:i.budget,basis:i.basis,identity:i.identity,sentTodayIdentity:i.sentToday};
  return null;
}
function hourLbl(h){const x=((h%24)+24)%24;return (x%12||12)+(x<12?"am":"pm");}

  const days=(c.sendDays||"mon,tue,wed,thu,fri").split(",").map(s=>s.trim()).filter(Boolean);

  const on=!!c.autoSend;
  return `<div class="card">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h3 style="margin:0">Schedule &amp; automation</h3>
      <span class="pill ${on?((PLAN&&PLAN.canSend)?"p-grn":"p-amb"):"p-gray"}">${on?((PLAN&&PLAN.canSend)?"auto-sending":(PLAN&&PLAN.enabled)?"armed · no runner live":"armed · master switch off"):"manual only"}</span>
      <label style="margin-left:auto;font-size:12.5px;display:flex;align-items:center;gap:6px;cursor:pointer">

        <label style="display:flex;align-items:center;gap:6px;margin-top:7px;font-weight:400;font-size:12px;cursor:pointer">
          <input type="checkbox" ${c.skipHolidays?"checked":""} onchange="saveSchedule(${c.id},{skipHolidays:this.checked},this)"> Skip holidays</label>
      </div>
      <div><label>Start at</label>
        <select onchange="saveSchedule(${c.id},{sendHour:+this.value},this)">
          ${Array.from({length:24},(_,h)=>`<option value="${h}" ${h===(c.sendHour??9)?"selected":""}>${hourLbl(h)}</option>`).join("")}
        </select>
        <div class="muted" style="font-size:11px;margin-top:4px">Stagger campaigns that share an address.</div>

      </div>
      <div><label>Priority on ${esc(SENDERS[c.sender]||c.sender)}</label>

    ${(()=>{

async function saveAutomation(){
  const patch={sequence_auto:$("autoMaster").checked,
               linkedin_auto_sync:$("liAuto").checked,
               identity_daily_cap:Math.max(1,+$("identCap").value||200)};
  const r=await _api("/api/settings",patch);
  if(!r||!r.ok){toast((r&&r.error)||"Couldn't save","warn");return;}
  CFGUI.linkedinAutoSync=patch.linkedin_auto_sync; CFGUI.identityDailyCap=patch.identity_daily_cap;
  closeModal();
  toast(patch.sequence_auto?"Automation ON — restart the server to start the timer":"Automation OFF","good");
  await loadPlan(); renderCamp();
}
async function runNow(btn){
  if(!confirm("Run today's plan now?\n\nThis sends real email immediately, ignoring each campaign's start hour. Per-campaign caps and the warm-up ceiling still apply."))return;
  const old=btn.innerHTML; btn.disabled=true; btn.innerHTML=`<span class="spin"></span> Sending…`;
  const r=await _api("/api/autosend/run",{now:true});
  btn.disabled=false; btn.innerHTML=old;
  if(!r||!r.ok){toast((r&&r.error)||"Run failed","warn");return;}
  toast(r.skipped?`Already claimed today — ${r.note}`:`Sent ${nf(r.sent||0)} of ${nf(r.planned||0)} planned`,"good");
  closeModal(); await loadPlan(); await reloadData(); renderCamp();
}
function toggleDay(campIdx,d){
  const c=campaigns[campIdx];
  const cur=new Set((c.sendDays||"").split(",").map(s=>s.trim()).filter(Boolean));
  cur.has(d)?cur.delete(d):cur.add(d);
  if(!cur.size){toast("Pick at least one send day","warn");return;}
  saveSchedule(campIdx,{sendDays:DAYKEYS.filter(x=>cur.has(x)).join(",")});
}
async function saveSchedule(campIdx,patch,el){
  const c=campaigns[campIdx]; if(!c)return;
  if(el){el.disabled=true;}
  const res=await _api("/api/campaigns/schedule",Object.assign({campaignId:c.dbId},patch));
  if(el)el.disabled=false;
  if(!res||!res.ok){toast((res&&res.error)||"Couldn't save the schedule","warn");renderCamp();return;}
  Object.assign(c,patch);
  if(res.plan)PLAN=Object.assign(PLAN||{},res.plan);
  toast("Schedule saved","good");
  renderCamp();
}
async function refreshPlan(btn){
  const old=btn?btn.innerHTML:null;
  if(btn){btn.disabled=true;btn.innerHTML=`<span class="spin"></span> Checking…`;}
  await loadPlan();
  if(btn){btn.disabled=false;btn.innerHTML=old;}
  renderCamp();
}

/* ---- Campaign readiness --------------------------------------------------
   "Active" only ever meant the campaign's own status, which is why a campaign
   could read active and still send nothing — no recipients, no runner alive, a
   master switch off two screens away (2026-07-21). This walks the WHOLE
   chain a real send has to clear and reports the first thing that would stop
   it, with the fix one click away. Blockers are things that stop it sending at
   all; "waiting" items are normal (nobody due today, before the start hour). */
function campReadiness(cc){
  const P=PLAN||{}, p=planFor(cc.dbId);
  const blockers=[], waiting=[];
  if(cc.status==="archived")return {blockers:[{t:"Archived — will never send"}],waiting:[],ok:false,arch:true};
  if(cc.status!=="active")blockers.push({t:`Status is “${cc.status}” — set it to active`,fix:"editCampaign",label:"open"});
  const steps=seqOf(cc), empty=steps.filter(s=>!(s.subject||"").trim()||!(s.body||"").trim()).length;
  if(!steps.length)blockers.push({t:"No sequence steps",fix:"editSequence",label:"add copy"});
  else if(empty===steps.length)blockers.push({t:"No copy written yet",fix:"editSequence",label:"write it"});
  else if(empty)waiting.push({t:`${empty} of ${steps.length} steps still empty — those steps hold until written`,fix:"editSequence",label:"finish"});
  if(!cc.enrolled)blockers.push({t:"Nobody enrolled",fix:"enroll",label:"enroll now"});
  if(!cc.autoSend)blockers.push({t:"“Send automatically” is off — sends only when you start a batch by hand",fix:"arm",label:"turn on"});
  else{
    if(!P.enabled)blockers.push({t:"Automation master switch is off — no campaign sends",fix:"automation",label:"open settings"});
    else if(P.needsRestart)blockers.push({t:"Automation is on but no runner is live — restart the server, or install the Scheduled Task",fix:"automation",label:"details"});
    else if(!P.canSend)blockers.push({t:"No runner available to send",fix:"automation",label:"details"});
  }
  if(!blockers.length&&p&&!p.send&&p.why)waiting.push({t:p.why});
  return {blockers,waiting,ok:!blockers.length,today:p?p.send:0};
}
function readinessBox(cc,i){
  const r=campReadiness(cc);
  if(r.arch)return "";
  const act=(f,label)=>`<span class="fixlink" onclick="event.stopPropagation();readyFix(${i},'${f}')">${esc(label)}</span>`;
  if(r.ok){
    const t=r.today
      ? `Sending <b>${nf(r.today)}</b> today`
      : `Ready — ${esc((r.waiting[0]||{}).t||"nothing due today")}`;
    return `<div class="rdy go"><div class="rdyhead">✓ ${t}</div>${
      r.waiting.slice(r.today?0:1).map(w=>`<div class="rrow"><span class="rmark">·</span><span>${esc(w.t)}${w.fix?" — "+act(w.fix,w.label):""}</span></div>`).join("")}</div>`;
  }
  return `<div class="rdy blocked"><div class="rdyhead">⚠ Won't send — ${r.blockers.length} thing${r.blockers.length>1?"s":""} to fix</div>${
    r.blockers.map(b=>`<div class="rrow"><span class="rmark">✕</span><span>${esc(b.t)}${b.fix?" — "+act(b.fix,b.label):""}</span></div>`).join("")}${
    r.waiting.map(w=>`<div class="rrow"><span class="rmark">·</span><span>${esc(w.t)}${w.fix?" — "+act(w.fix,w.label):""}</span></div>`).join("")}</div>`;
}
function readyFix(i,what){
  if(what==="enroll")return enrollAudience(i,null);
  if(what==="automation")return openAutomationSettings();
  if(what==="editSequence"||what==="editCampaign")return openCampaignBuilder(i);
  if(what==="arm")return saveSchedule(i,{autoSend:true});
}
/* The schedule is the campaign's most-changed setting, so it lives ON the card

function warmPill(cc){

    ? ` · <span class="pill p-amb" title="Warm-up day ${d} — recommended ceiling ${cc.warmupCap}/day across ${esc(cc.sender)}; ${cc.sentTodayIdentity||0} sent today on that address.">🌱 warm-up · day ${d}</span>`
    : ` · <span class="pill p-amb" title="Warm-up mode is ON but the ramp hasn't started — day 1 begins with the first send. Opening cap ${cc.warmupCap}/day.">🌱 warm-up · not started</span>`;

function campProgress(cc){
  const total=cc.enrolled||0, done=Math.min(cc.reached||0,total||(cc.reached||0));
  const pct=total?Math.round(done/total*100):0;
  const log=cc.sendLog||[];
  // Honest empty state: "active" with nobody enrolled will never send a thing.
  if(!total){
    return cc.status==="active"
      ? `<div class="cprog"><div class="cwarn" title="The campaign is switched on, but no contacts are enrolled — there is nothing for it to send. Use “See audience”, then add the contacts to this campaign.">⚠ active · 0 enrolled — nothing will send</div></div>`
      : `<div class="cprog"><div class="cpl muted">no contacts enrolled yet</div></div>`;
  }
  const recent=log.slice(0,14);
  const peak=Math.max(1,...recent.map(r=>r.sent));
  const logHtml=recent.length
    ? `<table class="clogt"><thead><tr><th>Day</th><th class="tnum">Sent</th><th class="tnum">People</th><th></th></tr></thead><tbody>${
        recent.map(r=>`<tr><td>${r.date}</td><td class="tnum">${r.sent}</td><td class="tnum">${r.people}</td><td style="width:70px"><div class="sparkb"><i style="width:${Math.round(r.sent/peak*100)}%"></i></div></td></tr>`).join("")
      }</tbody></table>${log.length>recent.length?`<div class="muted" style="font-size:11px;margin-top:5px">+ ${log.length-recent.length} earlier day(s)</div>`:""}`
    : `<div class="muted" style="font-size:11.5px">No sends recorded yet.</div>`;
  return `<div class="cprog chas">
    <div class="meter" title="${nf(done)} of ${nf(total)} enrolled contacts have received at least one email"><i style="width:${pct}%"></i></div>
    <div class="cpl"><b>${nf(done)}</b> of <b>${nf(total)}</b> contacted <span class="muted">· ${pct}%</span>
      <span class="linkish clogx">📈 log</span></div>
    <div class="clog" onclick="event.stopPropagation()">
      <div class="clogh">Send log — ${esc(cc.name)}</div>${logHtml}</div>
  </div>`;
}

  const goBtn=$("sndGo"); if(goBtn)goBtn.disabled=true;
  const bar=$("sndBar")&&$("sndBar").firstElementChild;
  const run=$("sndRun");
  let resp;
  try{ resp=await _api(`/api/campaigns/${camp.dbId}/send`,{count:due,respectWarmup:true}); }
  catch(e){ resp={ok:false,error:String(e)}; }
  if(!resp||resp.ok===false){ sending=false; if(goBtn)goBtn.disabled=false;
    toast("Send failed: "+((resp&&resp.error)||"unknown"),"warn"); return; }
  // poll the batch state
  const poll=async()=>{
    let st; try{ st=await fetch("/api/send/state").then(r=>r.json()); }catch(e){ st=null; }
    if(st){
      const done=(st.sent||0)+(st.failed||0)+(st.skipped||0), tot=st.total||due;
      if(bar)bar.style.width=Math.min(100,Math.round(done/(tot||1)*100))+"%";
      if(run)run.textContent=`sending… ${st.sent||0} sent · ${st.skipped||0} skipped · ${st.failed||0} failed`;
      if(!st.running){
        sending=false;
        // the DB is source of truth for step advancement + rescheduling — reload it
        await reloadData();
        toast(`Send complete — ${st.sent||0} sent`+((st.skipped||st.failed)?` · ${st.skipped||0} skipped · ${st.failed||0} failed`:""),"ok");
        if(ST.tab==="camp")renderCamp(); return;
      }
    }
    setTimeout(poll,600);
  };
  poll();
}

/* Test-send the step CURRENTLY OPEN in the editor, including unsaved edits — that's the
   point of a test: check the copy you're working on, not whatever was last saved. Honours the
   step picker, so every step in a sequence can be proofed, not just step 1. */
async function sendTestFromEditor(){
  _bSync();
  if(!SENDCFG.test_emails||!SENDCFG.test_emails.length){toast("No test inbox configured","warn");return;}
  const si=Math.max(0,Math.min(+($("pvStep")||{}).value||0,_builder.steps.length-1));
  const st=_builder.steps[si]||{};
  if(!(st.subject||"").trim()&&!(st.body||"").trim()){toast("Step "+(si+1)+" has no copy yet","warn");return;}
  const to=prompt(`Send step ${si+1} to which of your own inboxes?\n\n`+SENDCFG.test_emails.join("\n"),SENDCFG.test_emails[0]);
  if(!to)return;
  const camp=_builder.id!=null?campaigns[_builder.id]:null;
  const btn=$("pvTestBtn"); const old=btn?btn.textContent:"";
  if(btn){btn.disabled=true;btn.textContent="Sending…";}
  try{
    const r=await _api("/api/test-send",{identity:(camp&&camp.sender)||"demo-hello",
      subject:st.subject||"",body:st.body||"",to});
    if(r&&r.ok)toast(`Step ${si+1} sent to ${to} ✓ — check your inbox`,"ok");
    else toast("Test failed: "+((r&&r.error)||"unknown"),"warn");
  }catch(e){toast("Test failed: "+String(e),"warn");}
  finally{if(btn){btn.disabled=false;btn.textContent=old||"✉ Send me a test";}}
}
async function sendTest(campId){
  const camp=campaigns[campId];
  if(!SENDCFG.test_emails||!SENDCFG.test_emails.length){toast("No test inbox configured","warn");return;}
  const to=prompt("Send a test to which of your own inboxes?\n\n"+SENDCFG.test_emails.join("\n"),SENDCFG.test_emails[0]);
  if(!to)return;
  const tmpl=(camp.templates||[])[0]||{};
  toast("Sending test…","");
  const r=await _api("/api/test-send",{identity:camp.sender,subject:tmpl.subject||"",body:tmpl.body||"",to});
  if(r&&r.ok)toast("Test sent to "+to+" ✓ (check your inbox)","ok");
  else toast("Test failed: "+((r&&r.error)||"unknown"),"warn");
}

/* ============================ server persistence ============================ */
/* The UI addresses records by ARRAY INDEX (contacts[id]); the server uses stable
   dbIds. These helpers translate index -> dbId and POST the change. Fire-and-forget
   with an error toast — the in-memory mutation + render already happened. */
function _api(path,body){return fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify(body)}).then(r=>r.json()).catch(e=>{toast("Save failed — is the server running?","warn");return null;});}
function saveC(id,patch){const c=contacts[id];if(!c||c.dbId==null)return;_api("/api/save",{entity:"contact",id:c.dbId,patch});}
function saveA(id,patch){const a=accounts[id];if(!a||a.dbId==null)return;_api("/api/save",{entity:"account",id:a.dbId,patch});}
function apiBulk(entity,dbIds,op,value){dbIds=(dbIds||[]).filter(x=>x!=null);if(!dbIds.length)return;_api("/api/bulk",{entity,ids:dbIds,op,value});}
function apiEnroll(campDbId,contactDbIds){contactDbIds=(contactDbIds||[]).filter(x=>x!=null);if(campDbId==null||!contactDbIds.length)return;_api("/api/enroll",{campaignId:campDbId,contactIds:contactDbIds});}
function apiFollowupAdd(f){const c=contacts[f.contactId];if(!c||c.dbId==null)return;
  _api("/api/followups",{contactId:c.dbId,due:f.due,note:f.note}).then(r=>{if(r&&r.id!=null)f.id=r.id;});}
function apiFollowupPatch(f,patch){if(!f||f.id==null)return;fetch("/api/followups",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({id:f.id},patch))}).catch(()=>{});}
function apiFollowupDel(f){if(!f||f.id==null)return;fetch("/api/followups",{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:f.id})}).catch(()=>{});}

/* Load real data from the server and RE-INDEX so id === array position (the whole
   UI assumes accounts[c.accountId] / contacts[id] work). dbId is kept for saves. */
function applyBootstrap(d){
  const accIdx=new Map(),conIdx=new Map(),campIdx=new Map();
  accounts.length=0;
  (d.accounts||[]).forEach(a=>{a.dbId=a.id;a._deleted=!!a._deleted;a.id=accounts.length;accIdx.set(a.dbId,a.id);accounts.push(a);});
  contacts.length=0;
  (d.contacts||[]).forEach(c=>{const ai=accIdx.get(c.accountId);if(ai==null)return;
    c.dbId=c.id;c.accountId=ai;c._deleted=!!c._deleted;c.id=contacts.length;conIdx.set(c.dbId,c.id);contacts.push(c);});
  campaigns.length=0;
  (d.campaigns||[]).forEach(cp=>{cp.dbId=cp.id;cp.id=campaigns.length;campIdx.set(cp.dbId,cp.id);campaigns.push(cp);});
  enrollments.length=0;
  (d.enrollments||[]).forEach(e=>{const ci=conIdx.get(e.contactId),pi=campIdx.get(e.campaignId);if(ci==null||pi==null)return;
    enrollments.push({campaignId:pi,contactId:ci,templateId:e.templateId,status:e.status,
      seqStatus:e.seqStatus||"active",currentStep:e.currentStep||0,nextSendAt:e.nextSendAt||null,exitReason:e.exitReason||null});});
  if(d.meta&&d.meta.sendRules)SENDRULES=d.meta.sendRules;
  if(d.meta){if(d.meta.linkedinAutoSync!=null)CFGUI.linkedinAutoSync=d.meta.linkedinAutoSync;
             if(d.meta.identityDailyCap!=null)CFGUI.identityDailyCap=d.meta.identityDailyCap;}
  if(d.meta&&d.meta.emailSignature!=null)SIGNATURE=d.meta.emailSignature;
  if(d.meta&&d.meta.footerPreview!=null)FOOTER_PREVIEW=d.meta.footerPreview;
  followups.length=0;
  (d.followups||[]).forEach(f=>{const ci=conIdx.get(f.contactId);if(ci==null)return;
    followups.push({id:f.id,contactId:ci,due:f.due,note:f.note,done:!!f.done});});
  omissions.length=0;
  if(d.meta&&d.meta.today)TODAY=d.meta.today;
}

loadColPrefs();
loadViews();

try{const s=localStorage.getItem("oe_sesopen");if(s!==null)ST.sesOpen=s==="1";}catch(e){}

document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&(e.key==="z"||e.key==="Z")){
    const t=document.activeElement,tag=t&&t.tagName;
    if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;  // let native text-undo work
    e.preventDefault();undo();
  }
});
(async function(){
  try{
    const r=await fetch("/api/bootstrap");
    if(!r.ok)throw new Error("HTTP "+r.status);
    applyBootstrap(await r.json());
    loadSendConfig();
    loadActivity();
    loadActivityHistory();
    loadPlan().then(()=>{if(ST.tab==="camp")renderCamp();});   // what the scheduler would send today
    loadSes().then(()=>{if(ST.tab==="camp")renderCamp();});     // live SES reputation
  }catch(e){
    document.body.insertAdjacentHTML("afterbegin",
      "<div style='background:#7f1d1d;color:#fff;padding:12px 18px;font:14px system-ui;position:sticky;top:0;z-index:9999'>Couldn't load data from the Outreach Engine server. Start it with <code>python outreach_engine.py</code> and reload. ("+esc(String((e&&e.message)||e))+")</div>");
  }
  go("dash");
  /* deep-link: ?focus=c<id> or a<id> opens that record's drawer (shareable links) */
  try{const fp=new URLSearchParams(location.search).get("focus");
    if(fp){const isC=fp[0]==="c";const id=+fp.slice(1);

  }catch(e){}
})();
</script>

var veil = null, i = 0;

function markSeen(){ try{ sessionStorage.setItem(SKEY,"1"); }catch(e){} }
function esc(){ return null; }

function hasTut(){ return typeof window.TUT === "object" && window.TUT; }

function render(){
  var c = STORY_CH[i], last = i === STORY_CH.length - 1, lead = i === 0;
  var dots = STORY_CH.map(function(_,n){
    return '<i class="'+(n===i?'on':(n<i?'past':''))+'" data-g="'+n+'" title="'+(n+1)+'"></i>';
  }).join("");
  var body = "";
  if(c.lede)   body += '<p class="lede">'+c.lede+'</p>';
  if(c.body)   body += c.body;
  if(c.vs)     body += '<div class="sty-vs"><div><h5>'+c.vs[0].h+'</h5>'+c.vs[0].b+'</div>'+
                       '<div><h5>'+c.vs[1].h+'</h5>'+c.vs[1].b+'</div></div>';
  if(c.flow)   body += '<div class="sty-flow">'+c.flow.map(function(f,n){
                       return '<div class="fs"><span class="n">'+(n+1)+'</span><span class="t">'+f[0]+
                              '</span><span class="d">'+f[1]+'</span></div>';}).join("")+'</div>';
  if(c.list)   body += '<ul class="sty-ul">'+c.list.map(function(l){return '<li>'+l+'</li>';}).join("")+'</ul>';
  if(c.after)  body += c.after;
  if(c.note)   body += '<div class="sty-note">'+c.note+'</div>';

  var foot;
  if(c.choices){
    foot = '<div class="sty-choice">'+c.choices.map(function(ch,n){
      return '<button class="'+(ch.pri?'pri':'')+'" data-do="'+ch.act+'">'+
             '<span class="ci">'+ch.icon+'</span><span><span class="cl">'+ch.label+'</span>'+
             (ch.sub?'<span class="cs">'+ch.sub+'</span>':'')+'</span></button>';
    }).join("")+'</div>'+
    (lead ? '' : '<div class="sty-foot"><div class="sty-dots">'+dots+'</div>'+
       '<button class="sty-btn" data-do="back">&lsaquo; Back</button></div>');
  } else {
    foot = '<div class="sty-foot"><div class="sty-dots">'+dots+'</div>'+
      '<button class="sty-lnk" data-do="skip">Skip to the tool</button>'+
      '<button class="sty-btn" data-do="back"'+(i===0?' disabled':'')+'>&lsaquo; Back</button>'+
      '<button class="sty-btn pri" data-do="next">'+(last?'Finish':'Next')+' &rsaquo;</button></div>';
  }

  veil.innerHTML = '<div class="sty-card'+(lead?' lead':'')+(c.wide?' wide':'')+'">'+
    '<button class="sty-x" data-do="close" title="Close">&times;</button>'+
    '<p class="sty-kick">'+(c.kicker || ('The story &middot; '+i+' of '+(STORY_CH.length-1)))+'</p>'+
    '<h3 class="sty-h">'+c.title+'</h3>'+
    '<div class="sty-b">'+body+'</div>'+ foot + '</div>';
  veil.scrollTop = 0;
  var card = veil.firstChild; if(card) card.scrollTop = 0;
}

function act(name){
  if(name==="next"){ if(i<STORY_CH.length-1){ i++; render(); } else finish("tour"); }
  else if(name==="back"){ if(i>0){ i--; render(); } }
  else if(name==="skip"){ i = STORY_CH.length-1; render(); }
  else if(name==="close"){ finish("explore"); }
  else if(name==="tour"){ finish("tour"); }
  else if(name==="explore"){ finish("explore"); }
  else if(name==="quiet"){ finish("quiet"); }
  else if(name==="story"){ i = 1; render(); }
}

function finish(how){
  markSeen();
  close();
  if(!hasTut()) return;
  try{
    if(how==="tour")        window.TUT.start(0);
    else if(how==="quiet")  window.TUT.off();
    else                    window.TUT.explore();
  }catch(e){}
}

function close(){
  if(veil && veil.parentNode) veil.parentNode.removeChild(veil);
  veil = null;
  document.removeEventListener("keydown", onKey, true);
}

function onKey(e){
  if(!veil) return;
  var t=(document.activeElement||{}).tagName;
  if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT") return;
  if(e.key==="ArrowRight"){ e.preventDefault(); act("next"); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); act("back"); }
  else if(e.key==="Escape"){ e.preventDefault(); act("close"); }
}

function open(start){
  if(veil) close();
  i = (typeof start === "number") ? start : 0;
  veil = document.createElement("div");
  veil.className = "sty-veil";
  veil.addEventListener("click", function(ev){
    var b = ev.target.closest ? ev.target.closest("[data-do]") : null;
    if(b){ ev.preventDefault(); act(b.getAttribute("data-do")); return; }
    var d = ev.target.getAttribute && ev.target.getAttribute("data-g");
    if(d !== null && d !== undefined){ i = +d; render(); return; }
    if(ev.target === veil){ /* clicking the backdrop does nothing: this is a deliberate read */ }
  });
  document.body.appendChild(veil);
  render();
  document.addEventListener("keydown", onKey, true);
}

/* header entry point, so the story can be replayed at any time */
function injectPill(){
  if(document.getElementById("styPill")) return;
  var anchor = document.getElementById("tutPill");
  var b = document.createElement("button");
  b.id = "styPill"; b.className = "sty-pill";
  b.innerHTML = "\u{1F4D6} The story";
  b.title = "What this tool is and why it exists, in about two minutes";
  b.onclick = function(){ open(1); };
  if(anchor && anchor.parentNode){ anchor.parentNode.insertBefore(b, anchor); return; }
  var slot = document.getElementById("tutPillSlot") ||
             document.querySelector(".hdr-pills") || document.querySelector(".topin");
  if(slot) slot.insertBefore(b, slot.firstChild);
}

window.STORY = {
  willRun: willRun,
  open: open,
  replay: function(){ open(0); },
  close: close,
  chapters: STORY_CH
};

function boot(){
  injectPill();
  /* the tutorial layer may not have injected its pill yet; try once more next frame */
  requestAnimationFrame(injectPill);
  setTimeout(injectPill, 400);
  if(willRun) open(isNaN(at) ? 0 : Math.max(0, Math.min(STORY_CH.length-1, at)));
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
</script>

/* ---------------- content: tab intro cards (once per tab per session) ---------------- */
const TUT_TABS=[
 {tab:"dash",  step:"dash-kpis", title:"Dashboard",
  body:"Your health check. The cards up top summarize the list, the charts break it down, and the ⚡ card shows how far the background LinkedIn enrichment has got. Start here each session to see what changed."},
 {tab:"list",  step:"grain", title:"Master List",
  body:"Every company and person in one table. Filter and rank it to pick who to contact, omit and tag to keep it clean, and open any name for the full picture."},
 {tab:"follow", step:"followups", title:"Follow-ups",
  body:"Dated promises tied to contacts. “Ask me next month” lives here so it actually happens. Overdue items rise to the top and count on the tab badge."},
 {tab:"camp",  step:"camplist", title:"Campaigns",
  body:"Where email goes out, carefully. The segment chooses who, the sequence says what, and warm-up caps, guardrails and SES health keep your sending domain intact."}
];

/* ---------------- guided tour engine ---------------- */
let shield=null,halo=null,card=null;
function startTour(i){
  closeMini();closeIntro();
  const top=document.querySelector(".top");if(top)top.classList.add("tut-lift");
  try{if(typeof closeModal==="function")closeModal();}catch(e){}
  try{if(typeof closeDrawer==="function"&&cur<0)closeDrawer();}catch(e){}
  if(!shield){
    shield=N("div","tut-shield");shield.onclick=e=>e.stopPropagation();  // dim overlay eats clicks
    halo=N("div","tut-halo");card=N("div","tut-card");
    document.body.appendChild(shield);document.body.appendChild(halo);document.body.appendChild(card);
  }
  clearSpots();
  goStep(i||0);
}
function goStep(i){
  if(i<0||i>=TUT_STEPS.length)return;
  const prev=TUT_STEPS[cur];if(prev&&prev.post){try{prev.post();}catch(e){}}
  cur=i;const s=TUT_STEPS[i];
  if(s.tab&&s.tab!=="*"&&ST.tab!==s.tab)go(s.tab);          // auto tab-switch via the app's own fn
  window.__tourTab=(s.tab&&s.tab!=="*")?s.tab:null;         // highlight that section's nav tab
  if(typeof renderTabs==="function")renderTabs();
  if(s.pre){try{s.pre();}catch(e){}}
  place();                       // the app's renders are synchronous — measure immediately
  requestAnimationFrame(place);  // and settle once more after any pending layout
}
/* Resolve a step/hotspot to a DOM element. Supports a text match (`text`) in addition to a
   CSS selector, because the redesigned Campaigns/List views build cards & controls with no
   stable id/class — but their headings ("Schedule & automation", "Email sequence",
   "Recipients", "Saved views", "Refinement") are stable, so we anchor by heading text and
   fall back to a CSS selector, then a section-level fallback. Keeps every anchor in this
   file — the live app stays untouched and survives every re-sync. */
function tutFind(spec){
  const view=document.querySelector("#v-"+ST.tab)||document;
  if(spec.text){
    const cand=view.querySelectorAll(".card,.seg,button,select,.sendbox,.clist,.presetsel,.pill,.chip,.btn");
    for(const c of cand){if(c.textContent.indexOf(spec.text)>-1)return c;}
  }
  return (spec.sel?document.querySelector(spec.sel):null)||(spec.fb?document.querySelector(spec.fb):null);
}
function place(){
  if(cur<0||!card)return;
  const s=TUT_STEPS[cur];
  const t=tutFind(s)||document.querySelector(".main");
  try{t.scrollIntoView({block:"center"});}catch(e){}
  const r=t.getBoundingClientRect(),pad=6;
  halo.style.left=(r.left-pad)+"px";halo.style.top=(r.top-pad)+"px";
  halo.style.width=(r.width+pad*2)+"px";halo.style.height=(r.height+pad*2)+"px";
  card.innerHTML=`
    <span class="tut-x" onclick="TUT.end()" title="End tour">✕</span>
    <div class="tut-kicker">Guided tour${(s.tab&&s.tab!=="*"&&typeof TABS!=="undefined")?" · "+((TABS.find(t=>t[0]===s.tab)||[])[1]||""):""}</div>
    <h4>${s.title}</h4>
    <div class="tut-body">${s.body}</div>
    <div class="tut-foot">
      <span class="tut-step">step ${cur+1} of ${TUT_STEPS.length}</span>
      <span style="flex:1"></span>
      <button class="tut-btn ghost" ${cur===0?"disabled":""} onclick="TUT.back()">‹ Back</button>
      <button class="tut-btn" onclick="TUT.next()">${cur===TUT_STEPS.length-1?"✓ Finish":"Next ›"}</button>
    </div>`;
  const cw=card.offsetWidth,ch=card.offsetHeight,gap=14;
  const vw=document.documentElement.clientWidth,vh=document.documentElement.clientHeight;
  let pos=s.pos||"bottom",x,y;
  if(pos==="right"&&r.right+gap+cw>vw-10)pos="bottom";
  if(pos==="left"&&r.left-gap-cw<10)pos="bottom";
  if(pos==="bottom"&&r.bottom+gap+ch>vh-10&&r.top-gap-ch>10)pos="top";
  if(pos==="top"&&r.top-gap-ch<10)pos="bottom";
  if(pos==="right"){x=r.right+gap;y=r.top;}
  else if(pos==="left"){x=r.left-gap-cw;y=r.top;}
  else if(pos==="top"){x=r.left;y=r.top-gap-ch;}
  else {x=r.left;y=r.bottom+gap;}
  x=Math.max(10,Math.min(x,vw-cw-10));y=Math.max(10,Math.min(y,vh-ch-10));
  card.style.left=x+"px";card.style.top=y+"px";
}
function endTour(finished){
  if(cur>=0){const s=TUT_STEPS[cur];if(s&&s.post){try{s.post();}catch(e){}}}
  cur=-1;
  [shield,halo,card].forEach(n=>{if(n)n.remove();});shield=halo=card=null;
  window.__tourTab=null;
  const top=document.querySelector(".top");if(top)top.classList.remove("tut-lift");
  if(typeof renderTabs==="function")renderTabs();
  schedule();
  if(finished&&on&&typeof toast==="function")toast("Tour done. Hints stay on: click any ? badge, or toggle 🎓 in the header.","ok");
}

/* ---------------- ambient hotspots ---------------- */
function clearSpots(){document.querySelectorAll(".tut-spot").forEach(n=>n.remove());}
function attachSpots(){
  clearSpots();
  if(!on||cur>=0)return;
  TUT_SPOTS.forEach(sp=>{
    if(sp.tab!=="*"&&sp.tab!==ST.tab)return;
    const t=tutFind(sp);if(!t)return;
    const r=t.getBoundingClientRect();if(!r.width&&!r.height)return;
    const b=N("button","tut-spot","?");
    b.title=sp.title+" (click for a hint)";b.dataset.sel=sp.sel;
    b.style.left=(window.scrollX+r.right-8)+"px";
    b.style.top=(window.scrollY+r.top-8)+"px";
    b.onclick=e=>{e.stopPropagation();openMini(sp,b);};
    document.body.appendChild(b);
  });
}
function repositionSpots(){  // sticky-header targets shift on page scroll
  document.querySelectorAll(".tut-spot").forEach(b=>{
    const t=document.querySelector(b.dataset.sel);if(!t){b.remove();return;}
    const r=t.getBoundingClientRect();
    b.style.left=(window.scrollX+r.right-8)+"px";
    b.style.top=(window.scrollY+r.top-8)+"px";
  });
}
/* debounce within a synchronous render chain, then re-attach immediately after it
   (microtask, not rAF — rAF stalls in background tabs and the renders here are sync) */
function schedule(){if(raf)return;raf=1;queueMicrotask(()=>{raf=0;attachSpots();});}

/* hotspot explainer card */
let mini=null;
function closeMini(){if(mini){mini.remove();mini=null;document.removeEventListener("click",closeMini);}}
function openMini(sp,anchor){
  closeMini();closeIntro();
  const idx=sp.tourStep!=null?TUT_STEPS.findIndex(s=>s.id===sp.tourStep):-1;
  mini=N("div","tut-mini",`
    <span class="tut-x" onclick="TUT.closeMini()">✕</span>
    <h4>${sp.title}</h4>
    <div class="tut-body">${sp.body}</div>
    ${idx>=0?`<div class="tut-foot"><span class="tut-link" onclick="TUT.tourFrom('${sp.tourStep}')">▶ Tour this area</span></div>`:""}`);
  mini.onclick=e=>e.stopPropagation();
  document.body.appendChild(mini);
  const r=anchor.getBoundingClientRect(),w=mini.offsetWidth;
  mini.style.left=Math.max(10,Math.min(window.scrollX+r.left,window.scrollX+document.documentElement.clientWidth-w-12))+"px";
  mini.style.top=(window.scrollY+r.bottom+8)+"px";
  setTimeout(()=>document.addEventListener("click",closeMini),0);
}

/* ---------------- tab intro cards ---------------- */
let intro=null;
function closeIntro(){if(intro){intro.remove();intro=null;}}
function showIntro(tab){
  if(!on||cur>=0||seenTabs.has(tab))return;
  const t=TUT_TABS.find(x=>x.tab===tab);if(!t)return;
  seenTabs.add(tab);closeIntro();
  intro=N("div","tut-intro",`
    <span class="tut-x" onclick="TUT.closeIntro()">✕</span>
    <div class="tut-kicker">🎓 ${t.title}</div>
    <div class="tut-body">${t.body}</div>
    <div class="tut-foot">
      <span class="tut-link" onclick="TUT.tourFrom('${t.step}')">▶ Tour this tab</span>
      <span style="flex:1"></span>
      <button class="tut-btn ghost" onclick="TUT.closeIntro()">Got it</button>
    </div>`);
  document.body.appendChild(intro);
}

/* ---------------- toggle + header pill ---------------- */
function setOn(v){
  on=v;try{localStorage.setItem(LS_KEY,v?"on":"off");}catch(e){}
  updatePill();
  if(!v){endTour(false);clearSpots();closeMini();closeIntro();}
  else attachSpots();
}
function updatePill(){
  const p=document.getElementById("tutPill");if(!p)return;
  p.className="tut-pill"+(on?"":" off");
  p.innerHTML="🎓 Tutorial "+(on?"ON":"OFF");
  p.title=on?"Tutorial mode is ON. Hotspots and tab intros are showing. Click to turn off.":"Tutorial mode is OFF. Click to turn hints back on.";
}
(function injectPill(){
  const slot=document.getElementById("tutPillSlot");   // new home: top-left of the crumbrow row
  const pills=slot||document.querySelector(".hdr-pills")||document.querySelector(".topin");if(!pills)return;
  const p=N("button","tut-pill");p.id="tutPill";
  p.onclick=()=>{setOn(!on);if(typeof toast==="function")toast(on?"Tutorial hints ON — ? badges mark every major area":"Tutorial hints off — toggle 🎓 anytime","");};
  if(slot)slot.appendChild(p); else pills.insertBefore(p,pills.firstChild);
  updatePill();
})();

/* ---------------- welcome modal (first run / restart) ---------------- */
function welcome(){
  closeMini();closeIntro();
  openModal(`
   <div class="mhead"><div><h2>👋 Welcome to the Outreach Engine</h2><div class="sub">What this tool is, in 30 seconds</div></div><div class="dclose" onclick="closeModal()">×</div></div>
   <div class="mbody">
     <p style="margin:0 0 10px">This is a <b>cold-email outreach engine</b>: one place to keep your master list of companies and people, refine it down to the prospects worth talking to, and run careful email campaigns that <b>protect your sending reputation</b>.</p>
     <p style="margin:0 0 10px">List building and enrichment happen in upstream tools — their output lands here. From here you <b>rank and review</b> the list, send <b>warmed-up</b> campaigns with hard guardrails, log replies, and hand the best prospects to a companion LinkedIn tool.</p>
     <p class="muted" style="margin:0 0 4px;font-size:12.5px">This demo runs on sample data — nothing sends real email, so click anything. The guided tour takes ~3 minutes and follows the real workflow in order.</p>
     <div class="btnrow" style="margin-top:16px">
       <button class="btn" onclick="closeModal();TUT.start()">▶ Take the guided tour</button>
       <button class="btn ghost" onclick="closeModal();TUT.explore()">Explore with hints on</button>
       <button class="btn gray" onclick="closeModal();TUT.off()">Turn tutorial off</button>
     </div>
   </div>`);
}

/* ---------------- settings surface (row appended into ⚙ Campaign settings) ---------------- */
function injectSettingsRow(){
  const mb=document.querySelector("#modal .mbody");
  if(!mb||mb.querySelector(".tut-setrow"))return;
  const d=N("div","tut-setrow",`
    <div class="sechead">Tutorial mode</div>
    <div class="rulerow">
      <label class="switch"><input type="checkbox" ${on?"checked":""} onchange="TUT.toggle()"><span class="track"></span></label>
      <div class="rinfo"><b>Tutorial mode</b><div class="muted">Shows a “?” hotspot on every major section plus a first-visit intro card per tab. The 🎓 pill in the header toggles this too.</div></div>
      <div class="rright"><span class="tut-link" onclick="closeModal();STORY.replay()">📖 Replay the story</span>
      <span class="tut-link" style="margin-left:12px" onclick="closeModal();TUT.start(0)">↻ Restart guided tour</span></div>
    </div>`);
  mb.appendChild(d);
}

/* ---------------- hooks into the app (re-attach after renders / tab switches) ---------------- */
["render","renderList","renderTable","renderDash","renderFollow","renderCamp"].forEach(fn=>{
  const o=window[fn];if(typeof o!=="function")return;
  window[fn]=function(){const r=o.apply(this,arguments);schedule();return r;};
});
const _go=window.go;
window.go=function(t){const r=_go.apply(this,arguments);closeMini();if(cur<0){closeIntro();showIntro(t);}schedule();return r;};
const _ocs=window.openCampaignSettings;
window.openCampaignSettings=function(){const r=_ocs.apply(this,arguments);injectSettingsRow();return r;};

/* keyboard: ← → advance, Esc ends (only while the tour runs, never while typing) */
document.addEventListener("keydown",e=>{
  if(cur<0)return;
  const tag=(document.activeElement||{}).tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  if(e.key==="ArrowRight"){e.preventDefault();TUT.next();}
  else if(e.key==="ArrowLeft"){e.preventDefault();TUT.back();}
  else if(e.key==="Escape"){endTour(false);}
});
window.addEventListener("resize",()=>{if(cur>=0)place();schedule();});
window.addEventListener("scroll",()=>{if(cur>=0)place();else repositionSpots();},{passive:true});

/* ---------------- public API (used by inline onclick handlers) ---------------- */
window.TUT={
  toggle:()=>setOn(!on),
  start:()=>{if(!on)setOn(true);startTour(0);},
  explore:()=>{if(!on)setOn(true);seenTabs.delete(ST.tab);attachSpots();showIntro(ST.tab);},
  off:()=>setOn(false),
  welcome,
  next:()=>{cur===TUT_STEPS.length-1?endTour(true):goStep(cur+1);},
  back:()=>{if(cur>0)goStep(cur-1);},
  end:()=>endTour(false),
  tourFrom:id=>{const i=TUT_STEPS.findIndex(s=>s.id===id);if(i<0)return;if(!on)setOn(true);startTour(i);},
  closeMini,closeIntro
};

/* ---------------- boot ---------------- */
if(on)attachSpots();
/* The story layer owns the very first screen of a session: it opens the narrative
   "what is this and why" card, then hands off to this tour. Only fall back to the old
   welcome modal if the story layer is absent or has already been seen this session. */
if(window.STORY&&window.STORY.willRun){seenTabs.add(ST.tab);}
else if(firstRun){seenTabs.add(ST.tab);}             // open on the tool; walkthrough starts on request
else if(on)showIntro(ST.tab);
})();
</script>
